-|---|---|---|---|\n| 0 | {0, 1} | 1 | นับ | 1 |\n| 1 | เยี่ยมแล้ว | | | 1 |\n| 2 | {2, 3, 4} (สามเหลี่ยม) | 2 | นับ (ตามที่ตัวอย่างต้องการ) | **2** |\n\nตัวอย่าง K₄: ทุกปมดีกรี 3 component เดียวที่มีไม่ผ่าน ผลลัพธ์ **0**\n\n## 5. จุดที่มักพลาด\n- **เชื่อถ้อยคำมากกว่าตัวอย่าง:** กฎ \"ห้ามมีวงวน\" แบบเคร่งครัดไม่ผ่านตัวอย่างที่ 4 เมื่อโจทย์กับตัวอย่างทางการขัดกัน ตัวอย่างคือสิ่งที่บอกว่า grader ตรวจอะไร\n- **การเวียนเกิดลึกเกินไป:** เส้นทาง 100,000 ปมทำให้ DFS แบบเวียนเกิดลึก 100,000 เฟรม อาจทำ stack ล้นในบาง grader การใช้ stack ของเราเองเลี่ยงปัญหานี้\n- **ขอบเขตในโจทย์สลับกัน** (\"2 ≤ n ≤ 100,000 และ 0 ≤ v ≤ 200,000\"): v คือจำนวนปม e คือจำนวนเส้น\n- **ปมโดดเดี่ยว** นับเป็นเส้นตรง (ตัวอย่างที่ 3 → 3)\n\n## 6. ความรู้พื้นฐาน\nบทที่ 16 คำถามเรื่อง component หลายข้อลดรูปเหลือ \"เดินทั้ง component แล้วเก็บสรุปเล็ก ๆ\" (ขนาด จำนวนเส้น ดีกรีสูงสุด เป็นกราฟสองส่วนไหม …) แล้วตัดสินคุณสมบัติจากสรุปนั้นใน O(1) จำไว้ด้วยว่า กราฟที่เชื่อมกันมี n ปม จะเป็นต้นไม้ก็ต่อเมื่อมี n − 1 เส้น"}}, {"id": "ex05m2_connection", "group": "graph1", "lesson": "16 · Graphs: BFS (distances)", "stars": 2, "complexity": "O(N · (N + E))", "kind": "program", "tags": ["BFS from every node", "distance ≤ K", "adjacency list"], "title": {"en": "Connection", "th": "เครือข่ายเพื่อน (Connection)"}, "blurb": {"en": "For every student, count the students within distance K (themselves included); print the maximum. One BFS per student, cut off at depth K.", "th": "สำหรับนิสิตแต่ละคน นับคนที่อยู่ห่างไม่เกิน K (รวมตัวเอง) แล้วพิมพ์ค่ามากสุด ทำ BFS หนึ่งครั้งต่อนิสิตหนึ่งคน และหยุดที่ความลึก K"}, "tests": {"en": "the PDF sample; 300 random graphs (N ≤ 10, K ≤ 4) against Floyd–Warshall distances in Python; N = 1,000 with E = 100,000 and K = 4 (the worst case) in 0.22 s.", "th": "ตัวอย่างใน PDF; สุ่มกราฟ 300 ชุด (N ≤ 10, K ≤ 4) เทียบกับระยะทางจาก Floyd–Warshall ใน Python; N = 1,000 กับ E = 100,000 และ K = 4 (กรณีแย่สุด) ใช้ 0.22 วินาที"}, "files": [{"name": "main.cpp", "src": "#include <iostream>\n#include <vector>\n#include <queue>\nusing namespace std;\n\nint main() {\n    ios_base::sync_with_stdio(false); cin.tie(NULL);\n    int n, e, K;\n    cin >> n >> e >> K;\n    vector<vector<int>> adj(n);\n    // read the e friendships (undirected)\n    for (int i = 0; i < e; i++) {\n        int a, b;\n        cin >> a >> b;\n        adj[a].push_back(b);\n        adj[b].push_back(a);\n    }\n    vector<int> dist(n);\n    int best = 0;\n    // one BFS from every student s = 0..n-1\n    for (int s = 0; s < n; s++) {\n        // dist = -1 means \"not reached yet\"\n        for (int i = 0; i < n; i++) dist[i] = -1;\n        queue<int> q;\n        dist[s] = 0;\n        q.push(s);\n        int count = 0;                       // students within distance K (s itself included)\n        // BFS pops nodes in order of distance 0, 1, 2, ...\n        while (!q.empty()) {\n            int u = q.front(); q.pop();\n            count++;\n            if (dist[u] == K) continue;      // do not expand further than K steps\n            for (int w : adj[u]) {\n                if (dist[w] == -1) {\n                    dist[w] = dist[u] + 1;\n                    q.push(w);\n                }\n            }\n        }\n        if (count > best) best = count;\n    }\n    cout << best << \"\\n\";\n}\n"}], "body": {"en": "## 1. What the problem says\nN students (0..N−1, N ≤ 1,000) and E friendships (E ≤ 100,000, each line A < B, no repeats). A student's **degree-K friends** are everyone reachable by a path of length **at most K** (1 ≤ K ≤ 4); a student is their own degree-0 friend. Print the **largest number of degree-K friends** any student has.\n\nSample: 7 students, 8 edges, K = 2 → **6**.\n\n## 2. What it really means\n\"Path of length at most K\" = **BFS distance ≤ K**. For one student, run BFS and count the nodes at distance 0, 1, …, K. Do this for every student and keep the maximum.\n\n```text\nsample graph                         from student 4 (K = 2):\n   0 ── 6 ── 5 ── 4 ── 3 ── 2           distance 0: 4\n        │    │    │                     distance 1: 1, 3, 5\n        └─── 1 ───┘                     distance 2: 2, 6         → 6 students\n```\n\n(The edges are 0-6, 1-6, 1-5, 1-4, 2-3, 3-4, 4-5, 5-6.)\n\n:::hint Hint 1\nBFS visits nodes in order of distance. Which distance is the first one you do **not** need?\n:::\n:::hint Hint 2\nWhen you pop a node whose distance is already K, count it but do not push its neighbours.\n:::\n\n## 3. What, why, how\n- **What:** single-source BFS repeated from every node, with a depth cut-off.\n- **Why BFS (not DFS):** BFS finds **shortest** distances in an unweighted graph. A DFS may first reach a node by a long detour, say distance 3 > K, and wrongly skip it, even though a 2-step path exists.\n- **How:** for each s: dist[] = −1, dist[s] = 0, queue = {s}, count = 0. Pop u: count++; if dist[u] == K continue; push every neighbour with dist −1 at dist[u] + 1.\n- **Cost:** each BFS is O(N + E) in the worst case; N of them: 1,000 · 101,000 ≈ 10⁸ simple steps, measured 0.22 s. With small K the cut-off usually makes it much faster.\n- **Why not Floyd–Warshall:** N³ = 10⁹ for N = 1,000: too slow, and it ignores that the graph is unweighted.\n\n## 4. Solution\n{{code}}\n{{tests}}\n\n**Trace**: number of students within distance 2, from every start:\n\n| start | reached (distance) | count |\n|---|---|---|\n| 0 | 0(0) 6(1) 1(2) 5(2) | 4 |\n| 1 | 1(0) 4(1) 5(1) 6(1) 0(2) 3(2) | **6** |\n| 2 | 2(0) 3(1) 4(2) | 3 |\n| 3 | 3(0) 2(1) 4(1) 1(2) 5(2) | 5 |\n| 4 | 4(0) 1(1) 3(1) 5(1) 2(2) 6(2) | **6** |\n| 5 | 5(0) 1(1) 4(1) 6(1) 0(2) 3(2) | **6** |\n| 6 | 6(0) 0(1) 1(1) 5(1) 4(2) | 5 |\n\nMaximum **6**.\n\n## 5. Traps\n- **Forgetting to count the student themself:** the PDF says you are your own degree-0 friend.\n- **DFS with a depth limit:** can miss nodes reached first through a long path (see above).\n- **Resetting `dist` with `memset` on a huge array per start:** fine here (N ≤ 1,000), but think about it when N is large.\n- **One-directional edges:** friendship is mutual; store both directions.\n\n## 6. Background\nLesson 16. BFS from a source gives the shortest number of edges to every node. Running it from every node gives all-pairs distances in O(N·(N + E)), which beats Floyd–Warshall on sparse unweighted graphs. The \"stop expanding at depth K\" trick is the same as limiting the spread to T days in [Pandemic](#a62_q2a_pandemic).", "th": "## 1. โจทย์บอกอะไร\nมีนิสิต N คน (0..N−1, N ≤ 1,000) และความเป็นเพื่อน E คู่ (E ≤ 100,000 แต่ละบรรทัด A < B ไม่ซ้ำ) **เพื่อนดีกรี K** ของนิสิตคนหนึ่งคือทุกคนที่ไปถึงได้ด้วยเส้นทางยาว **ไม่เกิน K** (1 ≤ K ≤ 4) และนิสิตเป็นเพื่อนดีกรี 0 ของตัวเอง ให้พิมพ์ **จำนวนเพื่อนดีกรี K ที่มากที่สุด** ของนิสิตคนใดคนหนึ่ง\n\nตัวอย่าง: นิสิต 7 คน 8 เส้น K = 2 → **6**\n\n## 2. จริง ๆ แล้วถามอะไร\n\"เส้นทางยาวไม่เกิน K\" = **ระยะทาง BFS ≤ K** สำหรับนิสิตหนึ่งคน ทำ BFS แล้วนับปมที่ระยะ 0, 1, …, K ทำแบบนี้กับนิสิตทุกคนแล้วเก็บค่ามากสุด\n\n```text\nsample graph                         from student 4 (K = 2):\n   0 ── 6 ── 5 ── 4 ── 3 ── 2           distance 0: 4\n        │    │    │                     distance 1: 1, 3, 5\n        └─── 1 ───┘                     distance 2: 2, 6         → 6 students\n```\n\n(เส้นเชื่อมคือ 0-6, 1-6, 1-5, 1-4, 2-3, 3-4, 4-5, 5-6)\n\n:::hint คำใบ้ 1\nBFS เยี่ยมปมตามลำดับระยะทาง ระยะไหนคือระยะแรกที่เรา **ไม่** ต้องการ\n:::\n:::hint คำใบ้ 2\nเมื่อดึงปมที่ระยะเท่ากับ K แล้ว ให้นับมัน แต่ไม่ต้องใส่เพื่อนบ้านของมันลงคิว\n:::\n\n## 3. อะไร ทำไม อย่างไร\n- **อะไร:** BFS จากจุดเดียว ทำซ้ำจากทุกปม พร้อมหยุดที่ความลึก K\n- **ทำไม BFS (ไม่ใช่ DFS):** BFS หาระยะ **สั้นที่สุด** ในกราฟไม่มีน้ำหนัก DFS อาจไปถึงปมหนึ่งครั้งแรกผ่านทางอ้อมที่ยาว เช่นระยะ 3 > K แล้วข้ามมันไปอย่างผิด ๆ ทั้งที่มีทาง 2 ก้าวอยู่\n- **อย่างไร:** ทุก s: dist[] = −1, dist[s] = 0, คิว = {s}, count = 0 ดึง u: count++; ถ้า dist[u] == K ให้ continue; ใส่เพื่อนบ้านที่ dist เป็น −1 ด้วยระยะ dist[u] + 1\n- **ต้นทุน:** BFS แต่ละครั้ง O(N + E) ในกรณีแย่สุด ทำ N ครั้ง: 1,000 · 101,000 ≈ 10⁸ ขั้นง่าย ๆ วัดได้ 0.22 วินาที ถ้า K เล็ก การหยุดที่ K มักทำให้เร็วกว่านั้นมาก\n- **ทำไมไม่ใช้ Floyd–Warshall:** N³ = 10⁹ เมื่อ N = 1,000 ช้าเกินไป และไม่ได้ใช้ประโยชน์ที่กราฟไม่มีน้ำหนัก\n\n## 4. โค้ดเฉลย\n{{code}}\n{{tests}}\n\n**ไล่ค่า**: จำนวนนิสิตที่อยู่ในระยะ 2 จากทุกจุดเริ่ม:\n\n| เริ่ม | ไปถึง (ระยะ) | จำนวน |\n|---|---|---|\n| 0 | 0(0) 6(1) 1(2) 5(2) | 4 |\n| 1 | 1(0) 4(1) 5(1) 6(1) 0(2) 3(2) | **6** |\n| 2 | 2(0) 3(1) 4(2) | 3 |\n| 3 | 3(0) 2(1) 4(1) 1(2) 5(2) | 5 |\n| 4 | 4(0) 1(1) 3(1) 5(1) 2(2) 6(2) | **6** |\n| 5 | 5(0) 1(1) 4(1) 6(1) 0(2) 3(2) | **6** |\n| 6 | 6(0) 0(1) 1(1) 5(1) 4(2) | 5 |\n\nค่ามากสุด **6**\n\n## 5. จุดที่มักพลาด\n- **ลืมนับตัวเอง:** PDF บอกว่าเราเป็นเพื่อนดีกรี 0 ของตัวเอง\n- **DFS แบบจำกัดความลึก:** อาจพลาดปมที่ไปถึงครั้งแรกผ่านทางยาว (ดูข้างบน)\n- **รีเซ็ต `dist` ด้วย `memset` บนอาร์เรย์ใหญ่ทุกครั้ง:** ข้อนี้ไม่เป็นไร (N ≤ 1,000) แต่ต้องคิดถ้า N ใหญ่\n- **เก็บเส้นทิศเดียว:** ความเป็นเพื่อนเป็นของทั้งสองฝ่าย ต้องเก็บทั้งสองทิศ\n\n## 6. ความรู้พื้นฐาน\nบทที่ 16 BFS จากจุดเริ่มให้จำนวนเส้นที่น้อยที่สุดไปทุกปม ทำจากทุกปมจะได้ระยะทุกคู่ใน O(N·(N + E)) ซึ่งเร็วกว่า Floyd–Warshall บนกราฟไม่มีน้ำหนักที่เส้นไม่หนาแน่น ท่า \"หยุดขยายที่ความลึก K\" เหมือนกับการจำกัดการแพร่ที่ T วันในข้อ [Pandemic](#a62_q2a_pandemic)"}}, {"id": "a62_q2a_pandemic", "group": "graph1", "lesson": "16 · Graphs: BFS (multi-source)", "stars": 2, "complexity": "O(R · C)", "kind": "program", "tags": ["multi-source BFS", "grid", "stop at day T"], "title": {"en": "Pandemic", "th": "โรคระบาด (Pandemic)"}, "blurb": {"en": "A virus spreads one cell per day on a grid, never into mountains. Count the infected cells after T days with one BFS that starts from every infected cell at once.", "th": "ไวรัสแพร่วันละหนึ่งช่องบนตาราง และไม่เข้าภูเขา นับช่องที่ติดเชื้อหลัง T วัน ด้วย BFS ครั้งเดียวที่เริ่มจากทุกช่องที่ติดเชื้อพร้อมกัน"}, "tests": {"en": "the 3 PDF samples; 300 random grids (up to 6×6, T ≤ 8) against a day-by-day simulation in Python; a 500×500 grid with T = 1,000,000 in 0.02 s.", "th": "ตัวอย่าง 3 ชุดใน PDF; สุ่มตาราง 300 ชุด (ถึง 6×6, T ≤ 8) เทียบกับการจำลองทีละวันใน Python; ตาราง 500×500 กับ T = 1,000,000 ใช้ 0.02 วินาที"}, "files": [{"name": "main.cpp", "src": "#include <cstdio>\n#include <vector>\n#include <queue>\nusing namespace std;\n\nint main() {\n    int R, C, T;\n    if (scanf(\"%d %d %d\", &R, &C, &T) != 3) return 0;\n    vector<vector<int>> g(R, vector<int>(C));\n    vector<vector<int>> day(R, vector<int>(C, -1));   // day[r][c] = first day the virus is there, -1 = never\n    queue<pair<int,int>> q;\n    // read the map row by row; every 1 is a source on day 0\n    for (int r = 0; r < R; r++)\n        for (int c = 0; c < C; c++) {\n            if (scanf(\"%d\", &g[r][c]) != 1) return 0;\n            if (g[r][c] == 1) { day[r][c] = 0; q.push({r, c}); }\n        }\n    const int dr[4] = {-1, 1, 0, 0}, dc[4] = {0, 0, -1, 1};\n    int infected = 0;\n    // multi-source BFS: cells come out of the queue in order of their infection day\n    while (!q.empty()) {\n        auto [r, c] = q.front(); q.pop();\n        infected++;                          // every popped cell has day <= T\n        if (day[r][c] == T) continue;        // its neighbours would be infected on day T+1: too late\n        // the 4 neighbours: up, down, left, right\n        for (int k = 0; k < 4; k++) {\n            int nr = r + dr[k], nc = c + dc[k];\n            if (nr < 0 || nr >= R || nc < 0 || nc >= C) continue;   // off the map\n            if (g[nr][nc] == 2 || day[nr][nc] != -1) continue;      // mountain, or already infected\n            day[nr][nc] = day[r][c] + 1;\n            q.push({nr, nc});\n        }\n    }\n    printf(\"%d\\n\", infected);\n}\n"}], "body": {"en": "## 1. What the problem says\nThe country is an R × C grid (1 ≤ R, C ≤ 500). Each cell is\n- **0**: healthy land,\n- **1**: infected on day 0,\n- **2**: a mountain, which the virus can never enter.\n\nIf a cell is infected on day x, its 4 neighbours (up, down, left, right) are infected on day x + 1. After **T** days (0 ≤ T ≤ 1,000,000), how many cells are infected?\n\nSample 2: a 3 × 3 grid with two infected corners and T = 2 → **8**.\n\n## 2. What it really means\n\"Infected on day d\" means **BFS distance d from the nearest infected cell**, walking only through non-mountain cells. So the answer is the number of cells whose distance to the **nearest** source is ≤ T.\n\nThat is a **multi-source BFS**: put every day-0 cell in the queue first, at distance 0, and run one ordinary BFS.\n\n```text\nsample 2, distance to the nearest 1:\n   day 0       distances      T = 2: count cells with distance ≤ 2\n   0 0 1        2 1 0           ✓ ✓ ✓\n   0 0 0        3 2 1           ✗ ✓ ✓      → 8 cells\n   0 0 1        2 1 0           ✓ ✓ ✓\n```\n\n:::hint Hint 1\nRunning one BFS per infected cell is too slow when half the map is infected. Can one BFS start in many places at once?\n:::\n:::hint Hint 2\nT can be 1,000,000, but the BFS stops by itself once the queue is empty. You only need T to decide whether to expand a cell.\n:::\n\n## 3. What, why, how\n- **What:** BFS on a grid graph (cells are nodes, side-sharing neighbours are edges), with all sources in the queue at the start.\n- **Why one BFS is enough:** imagine a super-source joined to every infected cell by a 0-length edge. A BFS from it gives each cell its distance to the nearest real source. Putting all sources in the queue at distance 0 *is* that BFS, without building the extra node.\n- **Why the queue order matters:** BFS pops cells in non-decreasing distance. So when you pop a cell with day = T, every later cell has day ≥ T too, and none of its neighbours (day T + 1) should be added.\n- **How:** day[][] = −1. Push every 1-cell with day 0. Pop (r, c): count it; if day == T stop expanding; otherwise give each in-bounds, non-mountain, unseen neighbour day + 1 and push it.\n- **Cost:** every cell enters the queue at most once: O(R · C) = 250,000 cells. T never enters the cost.\n- **Why not simulate day by day:** each day costs O(R · C), and T can be 10⁶: 2.5 × 10¹¹ steps.\n\n## 4. Solution\n{{code}}\n{{tests}}\n\n**Trace**: sample 1 (5 × 4, T = 3, one source at row 3, column 2; the mountain is at row 3, column 1):\n\n| day | new cells this day | infected so far |\n|---|---|---|\n| 0 | (3,2) | 1 |\n| 1 | (2,2) (4,2) (3,3) | 4 |\n| 2 | (1,2) (2,1) (2,3) (4,1) (4,3) | 9 |\n| 3 | (0,2) (1,1) (1,3) (2,0) (4,0) | **14** |\n\nThe mountain (3,1) is never entered, and (3,0) is reached only on day 4, so it is not counted.\n\n## 5. Traps\n- **T = 0:** the answer is just the number of 1s. The check `day == T` before expanding handles it.\n- **Simulating T days:** times out for large T, and wastes work once the grid stops changing.\n- **One BFS per source:** O(sources · R · C), too slow.\n- **Counting mountains or 0-cells that were never reached:** count only popped cells.\n- **Reading 250,000 numbers with slow input:** use `scanf` or turn off cin syncing.\n\n## 6. Background\nLesson 16. Multi-source BFS appears again in [Hacking](#a58_q3_p3a_hacking) (with weights, so Dijkstra) and in [Sea bridge](#da66_f1_sea_bridge). The idea \"add a virtual source joined to all real sources\" works for BFS, Dijkstra and even MST. Compare also the depth cut-off in [Connection](#ex05m2_connection).", "th": "## 1. โจทย์บอกอะไร\nประเทศเป็นตาราง R × C (1 ≤ R, C ≤ 500) แต่ละช่องเป็น\n- **0**: พื้นที่ปกติ ยังไม่ติดเชื้อ\n- **1**: ติดเชื้อตั้งแต่วันที่ 0\n- **2**: ภูเขา ไวรัสเข้าไม่ได้เลย\n\nถ้าช่องหนึ่งติดเชื้อในวันที่ x ช่องข้างเคียง 4 ทิศ (บน ล่าง ซ้าย ขวา) จะติดในวันที่ x + 1 ถามว่าเมื่อผ่านไป **T** วัน (0 ≤ T ≤ 1,000,000) มีกี่ช่องที่ติดเชื้อ\n\nตัวอย่างที่ 2: ตาราง 3 × 3 มีมุมที่ติดเชื้อสองมุม T = 2 → **8**\n\n## 2. จริง ๆ แล้วถามอะไร\n\"ติดเชื้อในวันที่ d\" แปลว่า **ระยะ BFS เท่ากับ d จากช่องติดเชื้อที่ใกล้ที่สุด** โดยเดินผ่านเฉพาะช่องที่ไม่ใช่ภูเขา คำตอบจึงคือจำนวนช่องที่ระยะไปยังจุดเริ่ม **ที่ใกล้ที่สุด** ≤ T\n\nนี่คือ **BFS หลายจุดเริ่ม (multi-source BFS)**: ใส่ทุกช่องที่ติดเชื้อวันที่ 0 ลงคิวก่อนด้วยระยะ 0 แล้วทำ BFS ธรรมดาครั้งเดียว\n\n```text\nsample 2, distance to the nearest 1:\n   day 0       distances      T = 2: count cells with distance ≤ 2\n   0 0 1        2 1 0           ✓ ✓ ✓\n   0 0 0        3 2 1           ✗ ✓ ✓      → 8 cells\n   0 0 1        2 1 0           ✓ ✓ ✓\n```\n\n:::hint คำใบ้ 1\nทำ BFS หนึ่งครั้งต่อช่องติดเชื้อหนึ่งช่องจะช้าเกินไปถ้าครึ่งแผนที่ติดเชื้อ BFS ครั้งเดียวเริ่มจากหลายที่พร้อมกันได้ไหม\n:::\n:::hint คำใบ้ 2\nT อาจเป็น 1,000,000 แต่ BFS จะหยุดเองเมื่อคิวว่าง เราใช้ T แค่ตัดสินว่าจะขยายช่องนั้นต่อหรือไม่\n:::\n\n## 3. อะไร ทำไม อย่างไร\n- **อะไร:** BFS บนกราฟตาราง (ช่องคือปม ช่องที่มีด้านติดกันคือเส้นเชื่อม) โดยใส่ทุกจุดเริ่มลงคิวตั้งแต่แรก\n- **ทำไม BFS ครั้งเดียวพอ:** ลองนึกถึงปมพิเศษ (super-source) ที่ต่อกับทุกช่องติดเชื้อด้วยเส้นยาว 0 BFS จากปมนี้ให้ระยะของทุกช่องไปยังจุดเริ่มจริงที่ใกล้ที่สุด การใส่ทุกจุดเริ่มลงคิวด้วยระยะ 0 *ก็คือ* BFS นั้นเอง โดยไม่ต้องสร้างปมเพิ่ม\n- **ทำไมลำดับในคิวสำคัญ:** BFS ดึงช่องออกตามระยะที่ไม่ลดลง ดังนั้นเมื่อดึงช่องที่ day = T ช่องที่ตามมาทั้งหมดก็มี day ≥ T และไม่ควรเพิ่มเพื่อนบ้านของมัน (ซึ่งจะเป็น day T + 1)\n- **อย่างไร:** day[][] = −1 ใส่ทุกช่องที่เป็น 1 ด้วย day 0 ดึง (r, c): นับมัน; ถ้า day == T ไม่ต้องขยาย; ไม่อย่างนั้นให้เพื่อนบ้านที่อยู่ในตาราง ไม่ใช่ภูเขา และยังไม่เคยเห็น มี day + 1 แล้วใส่ลงคิว\n- **ต้นทุน:** ทุกช่องเข้าคิวอย่างมากครั้งเดียว: O(R · C) = 250,000 ช่อง T ไม่อยู่ในต้นทุนเลย\n- **ทำไมไม่จำลองทีละวัน:** แต่ละวันใช้ O(R · C) และ T อาจเป็น 10⁶: 2.5 × 10¹¹ ขั้น\n\n## 4. โค้ดเฉลย\n{{code}}\n{{tests}}\n\n**ไล่ค่า**: ตัวอย่างที่ 1 (5 × 4, T = 3, จุดเริ่มเดียวที่แถว 3 คอลัมน์ 2; ภูเขาอยู่ที่แถว 3 คอลัมน์ 1):\n\n| วัน | ช่องใหม่ในวันนั้น | ติดเชื้อสะสม |\n|---|---|---|\n| 0 | (3,2) | 1 |\n| 1 | (2,2) (4,2) (3,3) | 4 |\n| 2 | (1,2) (2,1) (2,3) (4,1) (4,3) | 9 |\n| 3 | (0,2) (1,1) (1,3) (2,0) (4,0) | **14** |\n\nภูเขา (3,1) ไม่ถูกเข้าเลย และ (3,0) ถูกถึงในวันที่ 4 จึงไม่นับ\n\n## 5. จุดที่มักพลาด\n- **T = 0:** คำตอบคือจำนวนเลข 1 เท่านั้น การเช็ก `day == T` ก่อนขยายจัดการให้แล้ว\n- **จำลองทีละวันจนครบ T วัน:** หมดเวลาเมื่อ T ใหญ่ และเสียงานเปล่าหลังตารางหยุดเปลี่ยน\n- **BFS หนึ่งครั้งต่อจุดเริ่ม:** O(จำนวนจุดเริ่ม · R · C) ช้าเกินไป\n- **นับภูเขาหรือช่อง 0 ที่ไปไม่ถึง:** นับเฉพาะช่องที่ถูกดึงออกจากคิว\n- **อ่านตัวเลข 250,000 ตัวด้วย input ที่ช้า:** ใช้ `scanf` หรือปิด sync ของ cin\n\n## 6. ความรู้พื้นฐาน\nบทที่ 16 BFS หลายจุดเริ่มจะพบอีกในข้อ [Hacking](#a58_q3_p3a_hacking) (มีน้ำหนัก จึงใช้ Dijkstra) และ [Sea bridge](#da66_f1_sea_bridge) ไอเดีย \"เพิ่มจุดเริ่มเสมือนที่ต่อกับทุกจุดเริ่มจริง\" ใช้ได้กับ BFS, Dijkstra และแม้แต่ MST ลองเทียบกับการหยุดที่ความลึก K ในข้อ [Connection](#ex05m2_connection)"}}, {"id": "a59_q3_cycle", "group": "graph1", "lesson": "16 · Graphs: degrees, leaf peeling", "stars": 3, "complexity": "O(n)", "kind": "program", "tags": ["unicyclic graph", "peel leaves", "degree counting"], "title": {"en": "Cycle in a tree", "th": "วงวนในต้นไม้ (Cycle)"}, "blurb": {"en": "n nodes and n edges, connected: a tree plus one extra edge. Find the length of its only cycle by repeatedly removing leaves until only the cycle is left.", "th": "n ปม n เส้น และเชื่อมกันหมด: ต้นไม้บวกเส้นเพิ่มหนึ่งเส้น หาความยาวของวงวนเดียวโดยลบใบไปเรื่อย ๆ จนเหลือแต่วงวน"}, "tests": {"en": "the PDF sample and a triangle; 300 random unicyclic graphs (n ≤ 12) against a Python brute force that tries removing each edge; n = 100,000 as a ring, a ring closed at the far end, and a long path ending in a triangle (deep recursion would crash there): 0.03 s.", "th": "ตัวอย่างใน PDF และสามเหลี่ยม; สุ่มกราฟที่มีวงวนเดียว 300 ชุด (n ≤ 12) เทียบกับ brute force ใน Python ที่ลองลบทีละเส้น; n = 100,000 แบบวงแหวน วงแหวนที่ปิดปลายไกล และเส้นยาวที่ปลายเป็นสามเหลี่ยม (recursion ลึกจะพังตรงนี้): 0.03 วินาที"}, "files": [{"name": "main.cpp", "src": "#include <cstdio>\n#include <vector>\nusing namespace std;\n\nint main() {\n    int n;\n    if (scanf(\"%d\", &n) != 1) return 0;\n    vector<vector<int>> adj(n);\n    vector<int> deg(n, 0);\n    // n nodes and n edges: a tree plus ONE extra edge, so exactly one cycle\n    for (int i = 0; i < n; i++) {\n        int x, y;\n        if (scanf(\"%d %d\", &x, &y) != 2) return 0;\n        adj[x].push_back(y);\n        adj[y].push_back(x);\n        deg[x]++; deg[y]++;\n    }\n    // Peel leaves: a node of degree 1 cannot be on the cycle. Remove it, which may\n    // turn its neighbour into a new leaf. Whatever survives is exactly the cycle.\n    vector<int> leaves;\n    vector<bool> removed(n, false);\n    // collect the initial leaves 0..n-1\n    for (int u = 0; u < n; u++)\n        if (deg[u] == 1) leaves.push_back(u);\n    int left = n;                            // nodes not removed yet\n    // keep removing leaves until none are left\n    while (!leaves.empty()) {\n        int u = leaves.back(); leaves.pop_back();\n        removed[u] = true;\n        left--;\n        // u's only remaining neighbour loses one degree\n        for (int w : adj[u]) {\n            if (removed[w]) continue;\n            deg[w]--;\n            if (deg[w] == 1) leaves.push_back(w);\n        }\n    }\n    // the cycle has as many edges as nodes\n    printf(\"%d\\n\", left);\n}\n"}], "body": {"en": "## 1. What the problem says\nA graph has n nodes (0..n−1, n ≤ 100,000) and **n edges**, and any two nodes are connected by a path. In other words it is a **tree with one extra edge**, so it has exactly one cycle. Print the cycle's size (its number of edges).\n\nSample: 9 nodes → **5**, the cycle 0 – 1 – 4 – 5 – 2 – 0.\n\n## 2. What it really means\nA node with degree 1 (a **leaf**) can never be on a cycle: a cycle enters and leaves every node, which needs 2 edges. Remove it. Its neighbour may now become a leaf; remove that too. When no leaves are left, the remaining nodes all have degree ≥ 2, and in a \"tree + 1 edge\" that is **exactly the cycle**.\n\n```text\n          0                       peel 8, 7, 6, 3        what is left:\n        ╱   ╲                                              0\n       1     2 ── 6, 7                                   ╱   ╲\n      ╱ ╲    │                                          1     2\n     3   4 ─ 5 ── 8                                      ╲    │\n                                                          4 ─ 5      5 nodes = 5 edges\n```\n\n:::hint Hint 1\nWhich nodes are certainly **not** on the cycle? Look at their degree.\n:::\n:::hint Hint 2\nAfter you delete such a node, the degree of one neighbour drops. Keep a list of nodes whose degree just became 1.\n:::\n\n## 3. What, why, how\n- **What:** leaf peeling, the same process as Kahn's topological sort but for undirected degrees.\n- **Why the survivors are the cycle:** peeling never removes a cycle node, because every cycle node always keeps its two cycle edges, so its degree stays ≥ 2. And a tree part hanging off the cycle always has a leaf, so peeling eats it completely.\n- **Why answer = number of nodes left:** a cycle with k nodes has k edges.\n- **How:** count degrees. Push every degree-1 node. Pop u: mark it removed; for its neighbour w that is not removed, deg[w]−−, and push w if deg[w] becomes 1. Print n − (number removed).\n- **Cost:** each node is pushed once and each edge is looked at twice: O(n).\n- **Why not DFS for a back edge:** that works too, but a recursive DFS on a 100,000-node path overflows the stack. Peeling uses no recursion.\n\n## 4. Solution\n{{code}}\n{{tests}}\n\n**Trace**: the sample. Initial degrees: 0:2, 1:3, 2:4, 3:1, 4:2, 5:3, 6:1, 7:1, 8:1. The stack starts as [3, 6, 7, 8].\n\n| pop | its neighbour's new degree | new leaf? | nodes left |\n|---|---|---|---|\n| 8 | deg[5] = 2 | no | 8 |\n| 7 | deg[2] = 3 | no | 7 |\n| 6 | deg[2] = 2 | no | 6 |\n| 3 | deg[1] = 2 | no | **5** |\n\nLeft: {0, 1, 2, 4, 5}, cycle size **5**.\n\n## 5. Traps\n- **Recursive DFS on a long path:** depth 100,000 can crash with a stack overflow.\n- **Printing the number of nodes in the cycle plus 1:** a cycle of k nodes has k edges, not k + 1.\n- **A self-loop or a double edge:** the statement promises a real cycle; if a double edge did appear (cycle of size 2), peeling still leaves those 2 nodes.\n- **n = 1 or 2:** with n edges these are only possible with a self-loop or double edge; the code does not crash on them.\n\n## 6. Background\nLesson 16. \"Tree + one edge\" (a *unicyclic* graph) is a common exam shape. Leaf peeling is the undirected version of the in-degree trick in Kahn's topological sort. It also finds the centre of a tree (peel until 1–2 nodes remain). Compare with [Cycle detection](#ex05m1_cycle), which only asks *whether* a cycle exists and answers with union-find.", "th": "## 1. โจทย์บอกอะไร\nกราฟมี n ปม (0..n−1, n ≤ 100,000) และ **n เส้น** และทุกคู่ปมมีเส้นทางถึงกัน อีกนัยหนึ่งคือ **ต้นไม้ที่มีเส้นเพิ่มอีกหนึ่งเส้น** จึงมีวงวนพอดีหนึ่งวง ให้พิมพ์ขนาดของวงวน (จำนวนเส้นในวง)\n\nตัวอย่าง: 9 ปม → **5** คือวง 0 – 1 – 4 – 5 – 2 – 0\n\n## 2. จริง ๆ แล้วถามอะไร\nปมที่มีดีกรี 1 (**ใบ**) อยู่บนวงวนไม่ได้เลย: วงวนต้องเข้าและออกทุกปม ซึ่งต้องใช้ 2 เส้น ลบมันทิ้ง เพื่อนบ้านของมันอาจกลายเป็นใบ ลบต่อ เมื่อไม่มีใบเหลือ ปมที่เหลือทุกปมมีดีกรี ≥ 2 และใน \"ต้นไม้ + 1 เส้น\" นั่นคือ **วงวนพอดี**\n\n```text\n          0                       peel 8, 7, 6, 3        what is left:\n        ╱   ╲                                              0\n       1     2 ── 6, 7                                   ╱   ╲\n      ╱ ╲    │                                          1     2\n     3   4 ─ 5 ── 8                                      ╲    │\n                                                          4 ─ 5      5 nodes = 5 edges\n```\n\n:::hint คำใบ้ 1\nปมไหนที่ **ไม่** อยู่บนวงวนแน่ ๆ ลองดูดีกรีของมัน\n:::\n:::hint คำใบ้ 2\nหลังลบปมแบบนั้น ดีกรีของเพื่อนบ้านหนึ่งปมจะลดลง เก็บรายการปมที่ดีกรีเพิ่งกลายเป็น 1\n:::\n\n## 3. อะไร ทำไม อย่างไร\n- **อะไร:** การลอกใบ (leaf peeling) กระบวนการเดียวกับ topological sort แบบ Kahn แต่ใช้ดีกรีของกราฟไม่มีทิศ\n- **ทำไมที่เหลือคือวงวน:** การลอกไม่เคยลบปมบนวง เพราะปมบนวงมีเส้นในวงสองเส้นเสมอ ดีกรีจึงไม่ต่ำกว่า 2 ส่วนต้นไม้ที่ห้อยจากวงมีใบเสมอ การลอกจึงกินมันจนหมด\n- **ทำไมคำตอบ = จำนวนปมที่เหลือ:** วงที่มี k ปมมี k เส้น\n- **อย่างไร:** นับดีกรี ใส่ทุกปมที่ดีกรี 1 ลง stack ดึง u: ทำเครื่องหมายว่าลบแล้ว; เพื่อนบ้าน w ที่ยังไม่ถูกลบ ให้ deg[w]−− และใส่ w ถ้า deg[w] กลายเป็น 1 พิมพ์ n − (จำนวนที่ลบ)\n- **ต้นทุน:** ทุกปมเข้าครั้งเดียว ทุกเส้นถูกดูสองครั้ง: O(n)\n- **ทำไมไม่ใช้ DFS หา back edge:** ก็ใช้ได้ แต่ DFS แบบ recursive บนเส้นยาว 100,000 ปมทำให้ stack ล้น การลอกใบไม่ใช้ recursion เลย\n\n## 4. โค้ดเฉลย\n{{code}}\n{{tests}}\n\n**ไล่ค่า**: ตัวอย่าง ดีกรีเริ่มต้น: 0:2, 1:3, 2:4, 3:1, 4:2, 5:3, 6:1, 7:1, 8:1 stack เริ่มเป็น [3, 6, 7, 8]\n\n| ดึง | ดีกรีใหม่ของเพื่อนบ้าน | เป็นใบใหม่ไหม | ปมที่เหลือ |\n|---|---|---|---|\n| 8 | deg[5] = 2 | ไม่ | 8 |\n| 7 | deg[2] = 3 | ไม่ | 7 |\n| 6 | deg[2] = 2 | ไม่ | 6 |\n| 3 | deg[1] = 2 | ไม่ | **5** |\n\nเหลือ {0, 1, 2, 4, 5} วงวนขนาด **5**\n\n## 5. จุดที่มักพลาด\n- **DFS แบบ recursive บนเส้นยาว:** ลึก 100,000 อาจพังเพราะ stack overflow\n- **พิมพ์จำนวนปมในวงบวก 1:** วงที่มี k ปมมี k เส้น ไม่ใช่ k + 1\n- **self-loop หรือเส้นซ้ำ:** โจทย์รับประกันว่ามีวงจริง ถ้ามีเส้นซ้ำ (วงขนาด 2) การลอกก็ยังเหลือ 2 ปมนั้น\n- **n = 1 หรือ 2:** เป็นไปได้เฉพาะเมื่อมี self-loop หรือเส้นซ้ำ โค้ดไม่พังในกรณีนี้\n\n## 6. ความรู้พื้นฐาน\nบทที่ 16 \"ต้นไม้ + หนึ่งเส้น\" (กราฟ *unicyclic*) เป็นรูปแบบที่ออกสอบบ่อย การลอกใบคือเวอร์ชันไม่มีทิศของท่านับ in-degree ใน topological sort แบบ Kahn และยังใช้หาจุดศูนย์กลางของต้นไม้ได้ (ลอกจนเหลือ 1–2 ปม) เทียบกับ [Cycle detection](#ex05m1_cycle) ที่ถามแค่ว่า *มี* วงวนหรือไม่ และตอบด้วย union-find"}}, {"id": "ex06e1_cable", "group": "mst", "lesson": "18 · Minimum spanning tree (Prim)", "stars": 2, "complexity": "O(N²)", "kind": "program", "tags": ["MST", "Prim O(N²)", "dense graph", "triangular input"], "title": {"en": "Cable company", "th": "บริษัทสายเคเบิล (Cable Company)"}, "blurb": {"en": "Every pair of N service centres has a cable price; connect them all as cheaply as possible. That is a minimum spanning tree of a complete graph, and Prim's O(N²) version is the natural fit.", "th": "ศูนย์บริการ N แห่ง ทุกคู่มีราคาสายเคเบิล ต้องเชื่อมทุกแห่งให้ถูกที่สุด นั่นคือ minimum spanning tree ของกราฟสมบูรณ์ และ Prim แบบ O(N²) เหมาะที่สุด"}, "tests": {"en": "the 2 PDF samples and N = 2; 300 random complete graphs (N ≤ 9) against Kruskal in Python; N = 1,000 (half a million costs) in 0.07 s.", "th": "ตัวอย่าง 2 ชุดใน PDF และ N = 2; สุ่มกราฟสมบูรณ์ 300 ชุด (N ≤ 9) เทียบกับ Kruskal ใน Python; N = 1,000 (ราคาครึ่งล้านค่า) ใช้ 0.07 วินาที"}, "files": [{"name": "main.cpp", "src": "#include <iostream>\n#include <vector>\nusing namespace std;\n\nint main() {\n    int n;\n    cin >> n;\n    // w[i][j] = cost of a cable between centres i and j (a complete graph)\n    vector<vector<int>> w(n, vector<int>(n, 0));\n    // line i (i = 0 .. n-2) holds the costs i-(i+1), i-(i+2), ..., i-(n-1)\n    for (int i = 0; i < n - 1; i++) {\n        for (int j = i + 1; j < n; j++) {\n            cin >> w[i][j];\n            w[j][i] = w[i][j];\n        }\n    }\n    // Prim's algorithm, O(n^2) version (best for a dense graph):\n    // grow one tree from centre 0; best[v] = cheapest cable from v into the tree.\n    const int INF = 1e9;\n    vector<int> best(n, INF);\n    vector<bool> inTree(n, false);\n    best[0] = 0;\n    long long total = 0;\n    // n rounds: each round adds exactly one centre to the tree\n    for (int round = 0; round < n; round++) {\n        int u = -1;\n        // pick the centre outside the tree with the cheapest connection\n        for (int v = 0; v < n; v++)\n            if (!inTree[v] && (u == -1 || best[v] < best[u])) u = v;\n        inTree[u] = true;\n        total += best[u];\n        // u is in the tree now: its cables may be cheaper connections for the others\n        for (int v = 0; v < n; v++)\n            if (!inTree[v] && w[u][v] < best[v]) best[v] = w[u][v];\n    }\n    cout << total << \"\\n\";\n}\n"}], "body": {"en": "## 1. What the problem says\nThere are N service centres (2 ≤ N ≤ 1,000). Data can be relayed, so the network works if the cables form one **connected** graph. You are given the cost of a cable for **every pair** (non-negative, ≤ 1,000), as a triangle: line i lists the costs from centre i to centres i+1, i+2, …, N−1. Print the minimum total cost.\n\nSample 1: N = 4 → **7**.\n\n> The PDF says \"the kth integer describes the cable from i to k\", but line i has only N−i−1 numbers. The samples make sense only if the kth number on line i is the cable from i to **i + 1 + k**.\n\n## 2. What it really means\nThe cheapest set of cables that keeps everything connected never contains a cycle (drop the most expensive cable of a cycle and you are still connected, for less). So it is a **tree** on all N nodes: a **minimum spanning tree (MST)**.\n\n```text\nsample 1 costs            the MST (cost 1 + 2 + 4 = 7)\n      0   1   2   3\n  0   -   1   3   4           0 ──1── 1\n  1       -   2   7           │       │\n  2           -   6           4       2\n  3               -           │       │\n                              3       2\n```\n\n:::hint Hint 1\nThe graph is **complete**: every pair has an edge, about 500,000 of them. Which MST algorithm does not need to sort the edges?\n:::\n:::hint Hint 2\nPrim with a simple array instead of a heap: each round scan all N nodes for the cheapest one outside the tree.\n:::\n\n## 3. What, why, how\n- **What:** Prim's algorithm, O(N²) array version.\n- **Why it is correct (cut property):** split the nodes into \"in the tree\" and \"outside\". The cheapest edge across that split is in some MST. Prim adds exactly that edge every round.\n- **Why O(N²) beats the heap and Kruskal here:** E = N(N−1)/2 ≈ 500,000. Kruskal sorts E edges: O(E log E). Heap Prim is O(E log N). Array Prim is O(N²) = 10⁶ with no log factor and no edge list at all.\n- **How:** best[v] = cheapest cable from v to the tree (∞ at the start, 0 for centre 0). N rounds: pick the outside u with the smallest best[u], add best[u] to the total, put u in the tree, then for every outside v set best[v] = min(best[v], w[u][v]).\n- **Input:** fill w[i][j] and w[j][i] for i < j from the triangle.\n\n## 4. Solution\n{{code}}\n{{tests}}\n\n**Trace**: sample 1. best[] is shown after each round (· = already in the tree).\n\n| round | picks u | adds | total | best[0..3] afterwards |\n|---|---|---|---|---|\n| 0 | 0 | 0 | 0 | · 1 3 4 |\n| 1 | 1 | 1 | 1 | · · 2 4 |\n| 2 | 2 | 2 | 3 | · · · 4 |\n| 3 | 3 | 4 | **7** | · · · · |\n\n## 5. Traps\n- **Misreading the triangle:** the kth number on line i is the cable to i + 1 + k, not to k.\n- **Kruskal with a full edge sort:** works, but costs more memory and time; with a slow DSU it can time out.\n- **Forgetting the update step:** after adding u you must lower best[v] using u's cables.\n- **N = 2:** one line with one number; the answer is that number.\n\n## 6. Background\nLesson 18. The cut property makes both Prim and Kruskal correct. Rule of thumb: dense or complete graph → array Prim O(V²); sparse graph → Kruskal with DSU, or heap Prim. The next problem, [Beautiful roads](#a60a_q3_xor_road), is a *maximum* spanning tree on a complete graph whose weights are computed, not read. Prim's loop looks almost the same as dense Dijkstra in [Farthest](#a61_q2_farthest): only the value stored in best[] changes.", "th": "## 1. โจทย์บอกอะไร\nมีศูนย์บริการ N แห่ง (2 ≤ N ≤ 1,000) ข้อมูลส่งต่อผ่านศูนย์อื่นได้ เครือข่ายจึงใช้งานได้ถ้าสายเคเบิลทำให้กราฟ **เชื่อมกันหมด** โจทย์ให้ราคาสายของ **ทุกคู่** (ไม่ติดลบ ≤ 1,000) เป็นรูปสามเหลี่ยม: บรรทัด i คือราคาจากศูนย์ i ไปศูนย์ i+1, i+2, …, N−1 ให้พิมพ์ราคารวมที่น้อยที่สุด\n\nตัวอย่างที่ 1: N = 4 → **7**\n\n> PDF เขียนว่า \"ตัวที่ k คือสายจาก i ไป k\" แต่บรรทัด i มีแค่ N−i−1 ตัว ตัวอย่างจะถูกต้องก็ต่อเมื่อตัวที่ k ของบรรทัด i คือสายจาก i ไป **i + 1 + k**\n\n## 2. จริง ๆ แล้วถามอะไร\nชุดสายที่ถูกที่สุดที่ยังเชื่อมทุกจุดไม่มีวงวนเลย (ตัดสายที่แพงที่สุดในวงทิ้ง ก็ยังเชื่อมกันอยู่และถูกลง) จึงเป็น **ต้นไม้** ที่ครอบทุกปม N ปม: **minimum spanning tree (MST)**\n\n```text\nsample 1 costs            the MST (cost 1 + 2 + 4 = 7)\n      0   1   2   3\n  0   -   1   3   4           0 ──1── 1\n  1       -   2   7           │       │\n  2           -   6           4       2\n  3               -           │       │\n                              3       2\n```\n\n:::hint คำใบ้ 1\nกราฟนี้ **สมบูรณ์**: ทุกคู่มีเส้น ประมาณ 500,000 เส้น อัลกอริทึม MST ตัวไหนที่ไม่ต้องเรียงเส้น\n:::\n:::hint คำใบ้ 2\nPrim ที่ใช้อาร์เรย์ธรรมดาแทน heap: ทุกรอบไล่ดูทั้ง N ปมเพื่อหาปมที่ถูกที่สุดที่อยู่นอกต้นไม้\n:::\n\n## 3. อะไร ทำไม อย่างไร\n- **อะไร:** อัลกอริทึม Prim แบบอาร์เรย์ O(N²)\n- **ทำไมถูกต้อง (cut property):** แบ่งปมเป็น \"อยู่ในต้นไม้\" กับ \"อยู่นอก\" เส้นที่ถูกที่สุดที่ข้ามรอยแบ่งนี้อยู่ใน MST บางต้นแน่นอน Prim เพิ่มเส้นนั้นพอดีในทุกรอบ\n- **ทำไม O(N²) ชนะ heap และ Kruskal ในข้อนี้:** E = N(N−1)/2 ≈ 500,000 Kruskal ต้องเรียง E เส้น: O(E log E) Prim แบบ heap คือ O(E log N) ส่วน Prim แบบอาร์เรย์คือ O(N²) = 10⁶ ไม่มี log และไม่ต้องมีรายการเส้นเลย\n- **อย่างไร:** best[v] = ราคาสายที่ถูกที่สุดจาก v เข้าต้นไม้ (เริ่ม ∞ และ 0 สำหรับศูนย์ 0) ทำ N รอบ: เลือก u ที่อยู่นอกและ best[u] น้อยสุด บวก best[u] เข้าผลรวม ใส่ u ในต้นไม้ แล้วทุก v ที่อยู่นอก ตั้ง best[v] = min(best[v], w[u][v])\n- **อ่าน input:** เติม w[i][j] และ w[j][i] สำหรับ i < j จากสามเหลี่ยม\n\n## 4. โค้ดเฉลย\n{{code}}\n{{tests}}\n\n**ไล่ค่า**: ตัวอย่างที่ 1 แสดง best[] หลังแต่ละรอบ (· = อยู่ในต้นไม้แล้ว)\n\n| รอบ | เลือก u | บวก | ผลรวม | best[0..3] หลังรอบ |\n|---|---|---|---|---|\n| 0 | 0 | 0 | 0 | · 1 3 4 |\n| 1 | 1 | 1 | 1 | · · 2 4 |\n| 2 | 2 | 2 | 3 | · · · 4 |\n| 3 | 3 | 4 | **7** | · · · · |\n\n## 5. จุดที่มักพลาด\n- **อ่านสามเหลี่ยมผิด:** ตัวที่ k ของบรรทัด i คือสายไป i + 1 + k ไม่ใช่ไป k\n- **Kruskal ที่เรียงเส้นทั้งหมด:** ใช้ได้ แต่เปลืองหน่วยความจำและเวลากว่า ถ้า DSU ช้าอาจหมดเวลา\n- **ลืมขั้นอัปเดต:** หลังเพิ่ม u ต้องลด best[v] ด้วยสายของ u\n- **N = 2:** มีบรรทัดเดียวที่มีเลขตัวเดียว คำตอบคือเลขนั้น\n\n## 6. ความรู้พื้นฐาน\nบทที่ 18 cut property ทำให้ทั้ง Prim และ Kruskal ถูกต้อง หลักจำ: กราฟหนาแน่นหรือสมบูรณ์ → Prim แบบอาร์เรย์ O(V²); กราฟเบาบาง → Kruskal กับ DSU หรือ Prim แบบ heap ข้อถัดไป [ถนนสวย](#a60a_q3_xor_road) เป็น *maximum* spanning tree บนกราฟสมบูรณ์ที่น้ำหนักต้องคำนวณเอง ไม่ได้อ่านมา ลูปของ Prim หน้าตาแทบเหมือน Dijkstra แบบหนาแน่นในข้อ [Farthest](#a61_q2_farthest) ต่างกันแค่ค่าที่เก็บใน best[]"}}, {"id": "a60a_q3_xor_road", "group": "mst", "lesson": "18 · Maximum spanning tree (Prim)", "stars": 3, "complexity": "O(n²)", "kind": "program", "tags": ["maximum spanning tree", "Prim O(n²)", "XOR weights", "unsigned long long"], "title": {"en": "Beautiful roads (XOR)", "th": "ถนนสวย (XOR road)"}, "blurb": {"en": "Build n−1 roads joining n districts; a road between codes x and y has beauty x XOR y. Maximise the total: a maximum spanning tree of a complete graph whose weights are computed on the fly.", "th": "สร้างถนน n−1 เส้นเชื่อม n อำเภอ ถนนระหว่างรหัส x กับ y มีความสวย x XOR y ทำให้ผลรวมมากที่สุด: maximum spanning tree ของกราฟสมบูรณ์ที่คำนวณน้ำหนักระหว่างทาง"}, "tests": {"en": "the PDF sample and n = 1; 300 random inputs (n ≤ 9, codes < 256 and < 2³⁰) against Kruskal in Python; n = 2,000 random 30-bit codes in 0.02 s.", "th": "ตัวอย่างใน PDF และ n = 1; สุ่ม 300 ชุด (n ≤ 9 รหัส < 256 และ < 2³⁰) เทียบกับ Kruskal ใน Python; n = 2,000 รหัสสุ่ม 30 บิต ใช้ 0.02 วินาที"}, "files": [{"name": "main.cpp", "src": "#include <iostream>\n#include <vector>\nusing namespace std;\n\nint main() {\n    int n;\n    cin >> n;\n    vector<long long> code(n);\n    // read the code of every district 0 .. n-1\n    for (int i = 0; i < n; i++) cin >> code[i];\n\n    // MAXIMUM spanning tree of the complete graph where w(x, y) = x XOR y.\n    // Prim's O(n^2) works unchanged if we always take the LARGEST connection.\n    // We never store the n*n weights: w(u, v) is computed on the fly.\n    vector<long long> best(n, -1);      // best[v] = largest edge from v into the tree, -1 = none yet\n    vector<bool> inTree(n, false);\n    best[0] = 0;\n    unsigned long long total = 0;       // up to 1999 * (2^30 - 1): needs 64 bits\n    // n rounds, one district joins the tree per round\n    for (int round = 0; round < n; round++) {\n        int u = -1;\n        // choose the outside district with the most beautiful connection\n        for (int v = 0; v < n; v++)\n            if (!inTree[v] && (u == -1 || best[v] > best[u])) u = v;\n        inTree[u] = true;\n        total += best[u];\n        // update every outside district with its road to u\n        for (int v = 0; v < n; v++) {\n            long long w = code[u] ^ code[v];\n            if (!inTree[v] && w > best[v]) best[v] = w;\n        }\n    }\n    cout << total << \"\\n\";\n}\n"}], "body": {"en": "## 1. What the problem says\nA province has n districts (1 ≤ n ≤ 2,000), each with a distinct code, a positive integer ≤ 2³⁰ − 1. The governor builds **n − 1 roads** so that every district can reach every other. A road between districts with codes x and y has **beauty x XOR y**. Print the **largest possible total beauty**. The PDF warns the answer can be big: use `unsigned long long`.\n\nSample: codes 3, 10, 9, 6 → **37**, using roads (3, 9), (6, 9), (6, 10) with beauty 10 + 15 + 12.\n\n## 2. What it really means\nn − 1 roads that connect n districts form a **spanning tree**. We want the one with the **largest** total weight: a **maximum spanning tree**. Any road can be built, so the graph is complete, with n(n−1)/2 ≈ 2,000,000 edges.\n\n```text\nweights x XOR y for the sample      max spanning tree (37)\n        3   10   9   6\n   3    -    9  10   5                3 ─10─ 9 ─15─ 6 ─12─ 10\n  10         -   3  12\n   9             -  15\n   6                 -\n```\n\n:::hint Hint 1\nDoes Prim still work if you always pick the **largest** connection instead of the smallest?\n:::\n:::hint Hint 2\nYou do not have to store 2,000 × 2,000 weights. When you need w(u, v), compute `code[u] ^ code[v]`.\n:::\n\n## 3. What, why, how\n- **What:** Prim's algorithm, O(n²) array version, with every comparison flipped (max instead of min).\n- **Why flipping works:** a maximum spanning tree for w is a minimum spanning tree for −w. The cut property becomes \"the heaviest edge across a cut is in some maximum spanning tree\", and Prim adds exactly that edge each round.\n- **Why array Prim:** the graph is complete. Kruskal would need to sort 2 million edges (and store them: 2 million × 16 bytes). Array Prim is n² = 4 × 10⁶ steps and stores only n numbers.\n- **How:** best[v] = largest road from v to the tree (−1 = none yet; 0 for district 0). n rounds: pick the outside u with the largest best[u], add it, then best[v] = max(best[v], code[u] ^ code[v]) for every outside v.\n- **Overflow:** up to 1,999 roads of beauty up to 2³⁰ − 1: about 2.1 × 10¹². That does not fit in `int`.\n\n## 4. Solution\n{{code}}\n{{tests}}\n\n**Trace**: the sample (index: code 0:3, 1:10, 2:9, 3:6).\n\n| round | picks u (code) | adds | total | best[0..3] afterwards |\n|---|---|---|---|---|\n| 0 | 0 (3) | 0 | 0 | · 9 10 5 |\n| 1 | 2 (9) | 10 | 10 | · 9 · 15 |\n| 2 | 3 (6) | 15 | 25 | · 12 · · |\n| 3 | 1 (10) | 12 | **37** | · · · · |\n\n## 5. Traps\n- **`int` total:** overflows; the answer can be about 2 × 10¹².\n- **Storing all edges for Kruskal:** 2 million edges is slow to sort and heavy on memory.\n- **Greedy \"connect each node to its best partner\":** may create cycles and fewer than n − 1 distinct roads.\n- **n = 1:** no roads, answer 0.\n- **Initialising best[] with 0 instead of −1:** fine here because codes are distinct (so every XOR is ≥ 1), but −1 is the safe habit for \"no edge yet\".\n\n## 6. Background\nLesson 18. Minimum and maximum spanning trees are the same algorithm with the comparison flipped. A faster method for XOR-MST exists (a binary trie, O(n · 30 · log n)), but with n ≤ 2,000 the simple O(n²) Prim is plenty. See [Cable company](#ex06e1_cable) for the same loop on a minimum tree.", "th": "## 1. โจทย์บอกอะไร\nจังหวัดหนึ่งมี n อำเภอ (1 ≤ n ≤ 2,000) แต่ละอำเภอมีรหัสไม่ซ้ำกันเป็นจำนวนเต็มบวก ≤ 2³⁰ − 1 ผู้ว่าฯ จะสร้าง **ถนน n − 1 เส้น** ให้ทุกอำเภอเดินทางถึงกันได้ ถนนระหว่างอำเภอรหัส x กับ y มี **ความสวย x XOR y** ให้พิมพ์ **ผลรวมความสวยที่มากที่สุด** PDF เตือนว่าคำตอบอาจใหญ่มาก ควรใช้ `unsigned long long`\n\nตัวอย่าง: รหัส 3, 10, 9, 6 → **37** ใช้ถนน (3, 9), (6, 9), (6, 10) ความสวย 10 + 15 + 12\n\n## 2. จริง ๆ แล้วถามอะไร\nถนน n − 1 เส้นที่เชื่อม n อำเภอคือ **spanning tree** เราต้องการต้นที่น้ำหนักรวม **มากที่สุด**: **maximum spanning tree** สร้างถนนคู่ไหนก็ได้ กราฟจึงสมบูรณ์ มี n(n−1)/2 ≈ 2,000,000 เส้น\n\n```text\nweights x XOR y for the sample      max spanning tree (37)\n        3   10   9   6\n   3    -    9  10   5                3 ─10─ 9 ─15─ 6 ─12─ 10\n  10         -   3  12\n   9             -  15\n   6                 -\n```\n\n:::hint คำใบ้ 1\nPrim ยังใช้ได้ไหมถ้าเราเลือกเส้นที่ **มากที่สุด** แทนที่จะเลือกน้อยที่สุด\n:::\n:::hint คำใบ้ 2\nไม่ต้องเก็บน้ำหนัก 2,000 × 2,000 ค่า เมื่อต้องการ w(u, v) ก็คำนวณ `code[u] ^ code[v]`\n:::\n\n## 3. อะไร ทำไม อย่างไร\n- **อะไร:** อัลกอริทึม Prim แบบอาร์เรย์ O(n²) โดยกลับการเปรียบเทียบทุกจุด (max แทน min)\n- **ทำไมกลับแล้วยังถูก:** maximum spanning tree ของ w คือ minimum spanning tree ของ −w cut property กลายเป็น \"เส้นที่หนักที่สุดที่ข้ามรอยแบ่งอยู่ใน maximum spanning tree บางต้น\" และ Prim เพิ่มเส้นนั้นพอดีทุกรอบ\n- **ทำไมใช้ Prim แบบอาร์เรย์:** กราฟสมบูรณ์ Kruskal ต้องเรียง 2 ล้านเส้น (และเก็บมัน: 2 ล้าน × 16 ไบต์) Prim แบบอาร์เรย์ใช้ n² = 4 × 10⁶ ขั้นและเก็บแค่ n ค่า\n- **อย่างไร:** best[v] = ถนนที่สวยที่สุดจาก v เข้าต้นไม้ (−1 = ยังไม่มี; 0 สำหรับอำเภอ 0) ทำ n รอบ: เลือก u ที่อยู่นอกและ best[u] มากที่สุด บวกเข้าผลรวม แล้ว best[v] = max(best[v], code[u] ^ code[v]) สำหรับทุก v ที่อยู่นอก\n- **ล้น:** ถนนถึง 1,999 เส้น สวยถึง 2³⁰ − 1: ประมาณ 2.1 × 10¹² ใส่ `int` ไม่ได้\n\n## 4. โค้ดเฉลย\n{{code}}\n{{tests}}\n\n**ไล่ค่า**: ตัวอย่าง (ลำดับ: รหัส 0:3, 1:10, 2:9, 3:6)\n\n| รอบ | เลือก u (รหัส) | บวก | ผลรวม | best[0..3] หลังรอบ |\n|---|---|---|---|---|\n| 0 | 0 (3) | 0 | 0 | · 9 10 5 |\n| 1 | 2 (9) | 10 | 10 | · 9 · 15 |\n| 2 | 3 (6) | 15 | 25 | · 12 · · |\n| 3 | 1 (10) | 12 | **37** | · · · · |\n\n## 5. จุดที่มักพลาด\n- **ผลรวมเป็น `int`:** ล้น คำตอบอาจถึงราว 2 × 10¹²\n- **เก็บทุกเส้นเพื่อทำ Kruskal:** 2 ล้านเส้นเรียงช้าและกินหน่วยความจำมาก\n- **ละโมบแบบ \"ต่อแต่ละปมกับคู่ที่ดีที่สุดของมัน\":** อาจเกิดวงวนและได้ถนนไม่ครบ n − 1 เส้น\n- **n = 1:** ไม่มีถนน คำตอบ 0\n- **ตั้ง best[] เป็น 0 แทน −1:** ข้อนี้ไม่เป็นไรเพราะรหัสไม่ซ้ำ (XOR ทุกคู่ ≥ 1) แต่ −1 คือนิสัยที่ปลอดภัยสำหรับ \"ยังไม่มีเส้น\"\n\n## 6. ความรู้พื้นฐาน\nบทที่ 18 minimum และ maximum spanning tree เป็นอัลกอริทึมเดียวกันแค่กลับการเปรียบเทียบ มีวิธีที่เร็วกว่าสำหรับ XOR-MST (ใช้ binary trie, O(n · 30 · log n)) แต่เมื่อ n ≤ 2,000 Prim O(n²) ธรรมดาก็เหลือเฟือ ดูข้อ [บริษัทสายเคเบิล](#ex06e1_cable) ที่ใช้ลูปเดียวกันกับต้นไม้น้อยที่สุด"}}, {"id": "a61_q2_farthest", "group": "sp", "lesson": "17 · Shortest paths: Dijkstra (dense)", "stars": 2, "complexity": "O(N²)", "kind": "program", "tags": ["Dijkstra O(N²)", "adjacency matrix", "directed", "unreachable → -1"], "title": {"en": "Farthest city", "th": "เมืองไกลสุด (Farthest)"}, "blurb": {"en": "One-way roads given as an adjacency matrix; find the shortest distance from the capital to every city and print the largest one, or -1 if some city cannot be reached.", "th": "ถนนทางเดียวให้มาเป็น adjacency matrix หาระยะสั้นสุดจากเมืองหลวงไปทุกเมือง แล้วพิมพ์ค่าที่มากที่สุด หรือ -1 ถ้ามีเมืองที่ไปไม่ถึง"}, "tests": {"en": "the PDF sample and a 2-city graph where city 2 is unreachable; 300 random directed matrices (N ≤ 8) against Floyd–Warshall in Python; N = 1,000 with half the roads present in 0.07 s.", "th": "ตัวอย่างใน PDF และกราฟ 2 เมืองที่ไปเมือง 2 ไม่ได้; สุ่มเมทริกซ์มีทิศ 300 ชุด (N ≤ 8) เทียบกับ Floyd–Warshall ใน Python; N = 1,000 ที่มีถนนครึ่งหนึ่ง ใช้ 0.07 วินาที"}, "files": [{"name": "main.cpp", "src": "#include <cstdio>\n#include <vector>\nusing namespace std;\n\nint main() {\n    int n;\n    if (scanf(\"%d\", &n) != 1) return 0;\n    // w[i][j] = length of the one-way road i -> j, or -1 if there is none\n    vector<vector<int>> w(n, vector<int>(n));\n    for (int i = 0; i < n; i++)\n        for (int j = 0; j < n; j++)\n            if (scanf(\"%d\", &w[i][j]) != 1) return 0;\n\n    // Dijkstra from city 1 (index 0), O(n^2) version for an adjacency matrix.\n    const long long INF = 1e18;\n    vector<long long> dist(n, INF);\n    vector<bool> done(n, false);\n    dist[0] = 0;\n    // n rounds: each round finalises the closest city not finalised yet\n    for (int round = 0; round < n; round++) {\n        int u = -1;\n        // scan all cities for the smallest tentative distance\n        for (int v = 0; v < n; v++)\n            if (!done[v] && dist[v] < INF && (u == -1 || dist[v] < dist[u])) u = v;\n        if (u == -1) break;                  // the rest cannot be reached\n        done[u] = true;\n        // relax every road u -> v\n        for (int v = 0; v < n; v++)\n            if (w[u][v] > 0 && dist[u] + w[u][v] < dist[v]) dist[v] = dist[u] + w[u][v];\n    }\n    long long far = 0;\n    // the answer: the largest distance, or -1 if some city is unreachable\n    for (int v = 0; v < n; v++) {\n        if (dist[v] == INF) { printf(\"-1\\n\"); return 0; }\n        if (dist[v] > far) far = dist[v];\n    }\n    printf(\"%lld\\n\", far);\n}\n"}], "body": {"en": "## 1. What the problem says\nCountry Algo has N cities (2 ≤ N ≤ 1,000) and **one-way** roads, at most one from a to b, each with a positive length < 1,000,000. The distance from the capital (city 1) to city c is the length of the **shortest** route. The input is an N × N adjacency matrix: entry (i, j) is the road i → j, **−1** means no road, and the diagonal is 0.\n\nPrint the distance from the capital to the **farthest** city, that is the largest of these shortest distances. If **any** city cannot be reached, print **−1**.\n\nSample → **6** (distances 1, 3, 4, 6 to cities 2, 3, 4, 5).\n\n> The Thai title says \"เมืองใกล้สุด\" (nearest city), but the explanation and the sample both ask for the **largest** shortest distance.\n\n## 2. What it really means\n\"Shortest distance from one source, positive weights\" is exactly **Dijkstra**. Then take the maximum over all cities, and check that none is still ∞.\n\n```text\nroads in the sample (from → to : length)\n   1 → 2 : 1      2 → 3 : 2      3 → 4 : 4      4 → 2 : 4      5 → 4 : 4\n   1 → 5 : 7      2 → 4 : 3                     4 → 3 : 2\n                  2 → 5 : 5\n\nshortest distances from city 1\n   city 2 : 1    (1 → 2)\n   city 3 : 3    (1 → 2 → 3)\n   city 4 : 4    (1 → 2 → 4)\n   city 5 : 6    (1 → 2 → 5, cheaper than the direct road of 7)   ← farthest\n```\n\n:::hint Hint 1\nThe input is already a matrix with up to 1,000,000 entries. Which Dijkstra suits a matrix best?\n:::\n:::hint Hint 2\nUse the O(N²) version: each round, scan all N cities for the closest unfinished one. No heap needed.\n:::\n\n## 3. What, why, how\n- **What:** Dijkstra, array (dense) version.\n- **Why Dijkstra:** all road lengths are positive. Then the unfinished city with the smallest tentative distance can never be improved later: any other route would go through a city that is at least as far already.\n- **Why the dense version:** reading the matrix already costs N². A heap would add a log factor and an edge list, and gains nothing when E can be close to N².\n- **How:** dist[0] = 0, others ∞. N rounds: pick the unfinished u with the smallest finite dist (stop if none), mark it done, and relax every v with w[u][v] > 0. At the end, any ∞ → print −1; otherwise print the max.\n- **Sizes:** a path can have 999 roads of length < 10⁶: under 10⁹, so `int` would just fit, but `long long` costs nothing here.\n\n## 4. Solution\n{{code}}\n{{tests}}\n\n**Trace**: the sample (cities numbered 1..5 as in the PDF; ∞ = not reached yet).\n\n| round | finalise | dist after relaxing (1 2 3 4 5) |\n|---|---|---|\n| 1 | city 1 (0) | 0 1 ∞ ∞ 7 |\n| 2 | city 2 (1) | 0 1 3 4 6 |\n| 3 | city 3 (3) | 0 1 3 4 6 |\n| 4 | city 4 (4) | 0 1 3 4 6 |\n| 5 | city 5 (6) | 0 1 3 4 6 |\n\nNo ∞ remains, the largest is **6**.\n\n## 5. Traps\n- **Treating −1 as an edge of length −1:** only positive entries are roads. The code tests `w[u][v] > 0`, which also skips the diagonal 0.\n- **Printing the nearest city:** the title misleads; the sample's answer is the largest distance.\n- **Forgetting the −1 case:** one unreachable city makes the whole answer −1.\n- **Picking an unreached city (dist = ∞) as u:** guard it, or stop when no finite dist is left.\n- **Reading the matrix with slow `cin`:** a million numbers; use `scanf` or fast I/O.\n\n## 6. Background\nLesson 17. Dijkstra comes in two shapes: **dense** O(V²) with a matrix, as here, and **heap** O(E log V) with adjacency lists, as in [Columbia](#ex06e3_columbia) and [Hacking](#a58_q3_p3a_hacking). With negative edges Dijkstra breaks: see [Shortest path](#ex06e2_shortest) for Bellman–Ford. The dense loop is the same shape as Prim in [Cable company](#ex06e1_cable).", "th": "## 1. โจทย์บอกอะไร\nประเทศอัลกอมี N เมือง (2 ≤ N ≤ 1,000) และถนน **ทางเดียว** จาก a ไป b อย่างมากหนึ่งเส้น แต่ละเส้นยาวเป็นจำนวนเต็มบวก < 1,000,000 ระยะทางจากเมืองหลวง (เมือง 1) ไปเมือง c คือความยาวของเส้นทางที่ **สั้นที่สุด** input เป็น adjacency matrix ขนาด N × N: ช่อง (i, j) คือถนน i → j **−1** คือไม่มีถนน และแนวทแยงเป็น 0\n\nให้พิมพ์ระยะทางจากเมืองหลวงไปเมืองที่ **ไกลที่สุด** คือค่ามากที่สุดของระยะสั้นสุดเหล่านี้ ถ้ามีเมือง **ใดก็ได้** ที่ไปไม่ถึง ให้พิมพ์ **−1**\n\nตัวอย่าง → **6** (ระยะ 1, 3, 4, 6 ไปเมือง 2, 3, 4, 5)\n\n> ชื่อภาษาไทยเขียนว่า \"เมืองใกล้สุด\" แต่คำอธิบายและตัวอย่างถามหาระยะสั้นสุดที่ **มากที่สุด**\n\n## 2. จริง ๆ แล้วถามอะไร\n\"ระยะสั้นสุดจากจุดเริ่มเดียว น้ำหนักเป็นบวก\" คือ **Dijkstra** พอดี แล้วหาค่ามากสุดจากทุกเมือง และเช็กว่าไม่มีเมืองไหนยังเป็น ∞\n\n```text\nroads in the sample (from → to : length)\n   1 → 2 : 1      2 → 3 : 2      3 → 4 : 4      4 → 2 : 4      5 → 4 : 4\n   1 → 5 : 7      2 → 4 : 3                     4 → 3 : 2\n                  2 → 5 : 5\n\nshortest distances from city 1\n   city 2 : 1    (1 → 2)\n   city 3 : 3    (1 → 2 → 3)\n   city 4 : 4    (1 → 2 → 4)\n   city 5 : 6    (1 → 2 → 5, cheaper than the direct road of 7)   ← farthest\n```\n\n:::hint คำใบ้ 1\ninput เป็นเมทริกซ์อยู่แล้ว ถึง 1,000,000 ช่อง Dijkstra แบบไหนเหมาะกับเมทริกซ์ที่สุด\n:::\n:::hint คำใบ้ 2\nใช้แบบ O(N²): ทุกรอบไล่ดูทั้ง N เมืองเพื่อหาเมืองที่ยังไม่เสร็จและใกล้ที่สุด ไม่ต้องใช้ heap\n:::\n\n## 3. อะไร ทำไม อย่างไร\n- **อะไร:** Dijkstra แบบอาร์เรย์ (หนาแน่น)\n- **ทำไม Dijkstra:** ถนนทุกเส้นยาวเป็นบวก เมืองที่ยังไม่เสร็จและมีระยะชั่วคราวน้อยที่สุดจะไม่มีทางถูกปรับให้ดีขึ้นอีก เพราะเส้นทางอื่นต้องผ่านเมืองที่ไกลอย่างน้อยเท่ากันอยู่แล้ว\n- **ทำไมแบบหนาแน่น:** แค่อ่านเมทริกซ์ก็ใช้ N² แล้ว heap จะเพิ่ม log และต้องมีรายการเส้น โดยไม่ได้อะไรเพิ่มเมื่อ E เกือบเท่า N²\n- **อย่างไร:** dist[0] = 0 ที่เหลือ ∞ ทำ N รอบ: เลือก u ที่ยังไม่เสร็จและ dist จำกัดน้อยที่สุด (หยุดถ้าไม่มี) ทำเครื่องหมายว่าเสร็จ แล้ว relax ทุก v ที่ w[u][v] > 0 สุดท้ายถ้ามี ∞ → พิมพ์ −1 ไม่อย่างนั้นพิมพ์ค่ามากสุด\n- **ขนาด:** เส้นทางมีถนนได้ 999 เส้น แต่ละเส้น < 10⁶: ต่ำกว่า 10⁹ `int` พอดีใส่ได้ แต่ `long long` ไม่เสียอะไรในข้อนี้\n\n## 4. โค้ดเฉลย\n{{code}}\n{{tests}}\n\n**ไล่ค่า**: ตัวอย่าง (ใช้เลขเมือง 1..5 ตาม PDF; ∞ = ยังไปไม่ถึง)\n\n| รอบ | ปิดเมือง | dist หลัง relax (1 2 3 4 5) |\n|---|---|---|\n| 1 | เมือง 1 (0) | 0 1 ∞ ∞ 7 |\n| 2 | เมือง 2 (1) | 0 1 3 4 6 |\n| 3 | เมือง 3 (3) | 0 1 3 4 6 |\n| 4 | เมือง 4 (4) | 0 1 3 4 6 |\n| 5 | เมือง 5 (6) | 0 1 3 4 6 |\n\nไม่มี ∞ เหลือ ค่ามากสุดคือ **6**\n\n## 5. จุดที่มักพลาด\n- **มอง −1 เป็นเส้นยาว −1:** เฉพาะค่าบวกเท่านั้นที่เป็นถนน โค้ดเช็ก `w[u][v] > 0` ซึ่งข้ามแนวทแยงที่เป็น 0 ด้วย\n- **พิมพ์เมืองที่ใกล้ที่สุด:** ชื่อโจทย์ชวนให้หลง คำตอบของตัวอย่างคือระยะที่มากที่สุด\n- **ลืมกรณี −1:** เมืองเดียวที่ไปไม่ถึงทำให้คำตอบทั้งหมดเป็น −1\n- **เลือกเมืองที่ยังไปไม่ถึง (dist = ∞) เป็น u:** ต้องกันไว้ หรือหยุดเมื่อไม่มี dist จำกัดเหลือ\n- **อ่านเมทริกซ์ด้วย `cin` ที่ช้า:** ล้านตัวเลข ใช้ `scanf` หรือ fast I/O\n\n## 6. ความรู้พื้นฐาน\nบทที่ 17 Dijkstra มีสองแบบ: **หนาแน่น** O(V²) กับเมทริกซ์ แบบข้อนี้ และ **heap** O(E log V) กับ adjacency list แบบข้อ [Columbia](#ex06e3_columbia) และ [Hacking](#a58_q3_p3a_hacking) ถ้ามีเส้นติดลบ Dijkstra ใช้ไม่ได้: ดูข้อ [Shortest path](#ex06e2_shortest) ที่ใช้ Bellman–Ford ลูปแบบหนาแน่นมีรูปเดียวกับ Prim ในข้อ [บริษัทสายเคเบิล](#ex06e1_cable)"}}, {"id": "ex06e3_columbia", "group": "sp", "lesson": "17 · Shortest paths: Dijkstra (heap) on a grid", "stars": 2, "complexity": "O(RC · log(RC))", "kind": "program", "tags": ["Dijkstra with a heap", "grid graph", "cost on the cell you enter"], "title": {"en": "Columbia", "th": "เมืองโคลัมเบีย (Columbia)"}, "blurb": {"en": "Entering each block of a grid city costs that block's fee. Print the cheapest cost from the top-left block to every block: Dijkstra on a grid, where each edge's weight is the fee of the cell it enters.", "th": "การเข้าแต่ละบล็อกของเมืองตารางต้องจ่ายค่าผ่านของบล็อกนั้น พิมพ์ค่าใช้จ่ายถูกที่สุดจากบล็อกมุมซ้ายบนไปทุกบล็อก: Dijkstra บนตาราง โดยน้ำหนักของเส้นคือค่าผ่านของช่องที่เดินเข้าไป"}, "tests": {"en": "the PDF sample and a 1×1 city; 300 random grids (up to 6×6, fees 0..9) against a Bellman–Ford-style relaxation in Python; 400 × 500 = 200,000 blocks in 0.04 s.", "th": "ตัวอย่างใน PDF และเมือง 1×1; สุ่มตาราง 300 ชุด (ถึง 6×6 ค่าผ่าน 0..9) เทียบกับการ relax แบบ Bellman–Ford ใน Python; 400 × 500 = 200,000 บล็อก ใช้ 0.04 วินาที"}, "files": [{"name": "main.cpp", "src": "#include <cstdio>\n#include <vector>\n#include <queue>\nusing namespace std;\n\nint main() {\n    int R, C;\n    if (scanf(\"%d %d\", &R, &C) != 2) return 0;\n    vector<vector<int>> fee(R, vector<int>(C));\n    // read the entrance fee of every block, row by row\n    for (int r = 0; r < R; r++)\n        for (int c = 0; c < C; c++)\n            if (scanf(\"%d\", &fee[r][c]) != 1) return 0;\n\n    // Dijkstra on the grid: entering block (r, c) costs fee[r][c].\n    // So the \"edge\" into a block weighs that block's fee.\n    const int INF = 2e9;\n    vector<vector<int>> dist(R, vector<int>(C, INF));\n    // min-heap of (distance, r, c)\n    priority_queue<tuple<int,int,int>, vector<tuple<int,int,int>>, greater<tuple<int,int,int>>> pq;\n    dist[0][0] = 0;                          // our own block is free\n    pq.push({0, 0, 0});\n    const int dr[4] = {-1, 1, 0, 0}, dc[4] = {0, 0, -1, 1};\n    // pop blocks in increasing order of cost\n    while (!pq.empty()) {\n        auto [d, r, c] = pq.top(); pq.pop();\n        if (d > dist[r][c]) continue;        // an old, outdated entry: skip it\n        // the 4 neighbouring blocks: up, down, left, right\n        for (int k = 0; k < 4; k++) {\n            int nr = r + dr[k], nc = c + dc[k];\n            if (nr < 0 || nr >= R || nc < 0 || nc >= C) continue;\n            int nd = d + fee[nr][nc];\n            if (nd < dist[nr][nc]) {\n                dist[nr][nc] = nd;\n                pq.push({nd, nr, nc});\n            }\n        }\n    }\n    // print the R x C table of minimum costs\n    for (int r = 0; r < R; r++) {\n        for (int c = 0; c < C; c++) printf(c ? \" %d\" : \"%d\", dist[r][c]);\n        printf(\"\\n\");\n    }\n}\n"}], "body": {"en": "## 1. What the problem says\nThe city is an R × C grid of blocks (R · C ≤ 200,000). To **enter** a block you pay its fee (0..1,000). You live in the **top-left** block and do not pay for it. You may move up, down, left or right. Print an R × C table: the minimum total fee to reach each block.\n\nSample (4 × 4):\n\n```text\nfees          answer\n1 1 1 1       0 1 2  3\n9 8 7 1       9 9 9  4\n1 1 1 1       8 7 6  5\n1 2 4 9       9 9 10 14\n```\n\n## 2. What it really means\nMake every block a node and join side-sharing blocks. Moving from a to b costs fee[b], so each **directed** edge a → b has weight **fee[b]**. All weights are ≥ 0: single-source shortest paths with non-negative weights is **Dijkstra**.\n\nLook at block (1, 0), fee 9: going straight down costs 9, but the detour around the top row and back along row 2 costs 1+1+1+1+1+1+1+1+1 = 9 too. Dijkstra simply tries everything in the right order.\n\n:::hint Hint 1\nBFS is not enough: fees differ, so \"fewest steps\" is not \"cheapest\". What do you use when edges have different non-negative weights?\n:::\n:::hint Hint 2\nYou never need an edge list. From cell (r, c) the 4 neighbours are computed on the spot, and the weight is the fee of the neighbour.\n:::\n\n## 3. What, why, how\n- **What:** Dijkstra with a min-heap (priority queue) of (distance, r, c), lazy deletion.\n- **Why it works with a cost on the cell:** a \"vertex cost\" is just an edge cost on every edge *into* that vertex. Fees are ≥ 0, so Dijkstra's greedy choice is safe (zero fees are fine; only negative ones break it).\n- **Why a heap, not the O(V²) scan:** V = 200,000, so V² = 4 × 10¹⁰ is far too slow. The graph is sparse (≤ 4 edges per node), so the heap gives O(V log V).\n- **How:** dist = ∞, dist[0][0] = 0, push (0, 0, 0). Pop (d, r, c); if d > dist[r][c] it is an outdated copy: skip. Otherwise for each neighbour (nr, nc): nd = d + fee[nr][nc]; if better, store and push.\n- **Lazy deletion:** instead of a \"decrease key\", push a new pair and ignore old ones when they come out. The heap may hold up to about 4V entries: still fine.\n\n## 4. Solution\n{{code}}\n{{tests}}\n\n**Trace**: the order Dijkstra finalises the 16 blocks of the sample (distance, row, column):\n\n| pops 1–8 | pops 9–16 |\n|---|---|\n| 0 (0,0) | 8 (2,0) |\n| 1 (0,1) | 9 (1,0) |\n| 2 (0,2) | 9 (1,1) |\n| 3 (0,3) | 9 (1,2) |\n| 4 (1,3) | 9 (3,0) |\n| 5 (2,3) | 9 (3,1) |\n| 6 (2,2) | 10 (3,2) |\n| 7 (2,1) | **14** (3,3) |\n\nThe cheap path goes along the top, down the right column, and back left along row 2. (3,3) costs 5 + 9 = 14 from (2,3), but 10 + 9 = 19 from (3,2).\n\n## 5. Traps\n- **Paying for the start block:** dist[0][0] = 0.\n- **Putting the fee on the cell you leave instead of the one you enter:** gives wrong numbers, e.g. (0,1) would cost 1 from the start's fee.\n- **BFS or DP that only moves right/down:** the cheapest route can go up and left (see row 2 in the sample).\n- **No outdated-entry check:** still correct, but much slower.\n- **Output format:** one row per line, numbers separated by single spaces.\n\n## 6. Background\nLesson 17. Grids are graphs with implicit edges; the same 4-direction loop is used in [Pandemic](#a62_q2a_pandemic) (BFS, all weights 1). When the cost is on the vertex, Dijkstra still works: see also [Hacking](#a58_q3_p3a_hacking), which adds many sources. Compare with dense Dijkstra in [Farthest](#a61_q2_farthest).", "th": "## 1. โจทย์บอกอะไร\nเมืองเป็นตารางบล็อก R × C (R · C ≤ 200,000) การ **เข้า** บล็อกหนึ่งต้องจ่ายค่าผ่านของบล็อกนั้น (0..1,000) เราอยู่บล็อก **มุมซ้ายบน** และไม่ต้องจ่ายค่าบล็อกตัวเอง เดินได้ บน ล่าง ซ้าย ขวา ให้พิมพ์ตาราง R × C: ค่าผ่านรวมน้อยที่สุดเพื่อไปถึงแต่ละบล็อก\n\nตัวอย่าง (4 × 4):\n\n```text\nfees          answer\n1 1 1 1       0 1 2  3\n9 8 7 1       9 9 9  4\n1 1 1 1       8 7 6  5\n1 2 4 9       9 9 10 14\n```\n\n## 2. จริง ๆ แล้วถามอะไร\nให้ทุกบล็อกเป็นปม และต่อบล็อกที่มีด้านติดกัน การเดินจาก a ไป b เสีย fee[b] ดังนั้นเส้น **มีทิศ** a → b มีน้ำหนัก **fee[b]** น้ำหนักทุกเส้น ≥ 0: ระยะสั้นสุดจากจุดเดียวที่น้ำหนักไม่ติดลบคือ **Dijkstra**\n\nลองดูบล็อก (1, 0) ค่าผ่าน 9: เดินลงตรง ๆ เสีย 9 ส่วนทางอ้อมไปตามแถวบนแล้วกลับมาตามแถว 2 เสีย 1+1+1+1+1+1+1+1+1 = 9 เท่ากัน Dijkstra แค่ลองทุกทางตามลำดับที่ถูกต้อง\n\n:::hint คำใบ้ 1\nBFS ไม่พอ: ค่าผ่านไม่เท่ากัน \"ก้าวน้อยสุด\" จึงไม่ใช่ \"ถูกที่สุด\" ถ้าเส้นมีน้ำหนักไม่ติดลบที่ต่างกัน เราใช้อะไร\n:::\n:::hint คำใบ้ 2\nไม่ต้องมีรายการเส้นเลย จากช่อง (r, c) เพื่อนบ้าน 4 ช่องคำนวณได้ทันที และน้ำหนักคือค่าผ่านของเพื่อนบ้าน\n:::\n\n## 3. อะไร ทำไม อย่างไร\n- **อะไร:** Dijkstra ที่ใช้ min-heap (priority queue) ของ (ระยะ, r, c) พร้อมการลบแบบขี้เกียจ (lazy deletion)\n- **ทำไมใช้ได้เมื่อค่าอยู่ที่ช่อง:** \"ค่าของปม\" ก็คือค่าบนทุกเส้นที่ *เข้า* ปมนั้น ค่าผ่าน ≥ 0 การเลือกแบบละโมบของ Dijkstra จึงปลอดภัย (ค่า 0 ไม่เป็นไร มีแค่ค่าติดลบที่ทำให้พัง)\n- **ทำไมใช้ heap ไม่ใช่การไล่ O(V²):** V = 200,000 ดังนั้น V² = 4 × 10¹⁰ ช้าเกินไป กราฟเบาบาง (≤ 4 เส้นต่อปม) heap จึงให้ O(V log V)\n- **อย่างไร:** dist = ∞, dist[0][0] = 0 ใส่ (0, 0, 0) ดึง (d, r, c); ถ้า d > dist[r][c] แปลว่าเป็นสำเนาเก่า ข้ามไป ไม่อย่างนั้นสำหรับเพื่อนบ้าน (nr, nc): nd = d + fee[nr][nc]; ถ้าดีกว่า เก็บแล้วใส่ heap\n- **ลบแบบขี้เกียจ:** แทนที่จะ \"ลดค่า key\" ให้ใส่คู่ใหม่ไปเลย แล้วข้ามคู่เก่าตอนมันออกมา heap อาจมีถึงราว 4V รายการ ก็ยังไหว\n\n## 4. โค้ดเฉลย\n{{code}}\n{{tests}}\n\n**ไล่ค่า**: ลำดับที่ Dijkstra ปิด 16 บล็อกของตัวอย่าง (ระยะ, แถว, คอลัมน์):\n\n| ดึงครั้งที่ 1–8 | ดึงครั้งที่ 9–16 |\n|---|---|\n| 0 (0,0) | 8 (2,0) |\n| 1 (0,1) | 9 (1,0) |\n| 2 (0,2) | 9 (1,1) |\n| 3 (0,3) | 9 (1,2) |\n| 4 (1,3) | 9 (3,0) |\n| 5 (2,3) | 9 (3,1) |\n| 6 (2,2) | 10 (3,2) |\n| 7 (2,1) | **14** (3,3) |\n\nทางที่ถูกไปตามแถวบน ลงคอลัมน์ขวา แล้ววกกลับซ้ายตามแถว 2 ช่อง (3,3) เสีย 5 + 9 = 14 ถ้ามาจาก (2,3) แต่เสีย 10 + 9 = 19 ถ้ามาจาก (3,2)\n\n## 5. จุดที่มักพลาด\n- **จ่ายค่าบล็อกเริ่มต้น:** dist[0][0] = 0\n- **คิดค่าผ่านที่ช่องที่ออก แทนช่องที่เข้า:** ได้ตัวเลขผิด เช่น (0,1) จะเสีย 1 จากค่าของช่องเริ่ม\n- **BFS หรือ DP ที่เดินได้แค่ขวา/ลง:** ทางที่ถูกที่สุดอาจเดินขึ้นและไปทางซ้าย (ดูแถว 2 ในตัวอย่าง)\n- **ไม่เช็กสำเนาเก่า:** ยังถูกต้อง แต่ช้าลงมาก\n- **รูปแบบผลลัพธ์:** หนึ่งแถวต่อหนึ่งบรรทัด คั่นตัวเลขด้วยช่องว่างหนึ่งช่อง\n\n## 6. ความรู้พื้นฐาน\nบทที่ 17 ตารางคือกราฟที่มีเส้นแบบแฝง ลูป 4 ทิศแบบเดียวกันใช้ในข้อ [Pandemic](#a62_q2a_pandemic) (BFS น้ำหนักเป็น 1 หมด) เมื่อค่าอยู่ที่ปม Dijkstra ก็ยังใช้ได้: ดูข้อ [Hacking](#a58_q3_p3a_hacking) ที่เพิ่มจุดเริ่มหลายจุด เทียบกับ Dijkstra แบบหนาแน่นในข้อ [Farthest](#a61_q2_farthest)"}}, {"id": "a58_q3_p3a_hacking", "group": "sp", "lesson": "17 · Shortest paths: multi-source Dijkstra", "stars": 3, "complexity": "O((n + m) log n)", "kind": "program", "tags": ["multi-source Dijkstra", "vertex weights", "max of shortest times"], "title": {"en": "Hacking", "th": "แฮกเครือข่าย (Hacking)"}, "blurb": {"en": "A virus starts on k servers; breaking into server i takes c[i] seconds, then it spreads along cables. When has every server fallen? Multi-source Dijkstra with the cost on the vertex, then take the maximum.", "th": "ไวรัสเริ่มที่เซิร์ฟเวอร์ k เครื่อง การเจาะเครื่อง i ใช้ c[i] วินาที แล้วแพร่ไปตามสาย เมื่อไหร่ทุกเครื่องจะถูกเจาะ: Dijkstra หลายจุดเริ่มที่ค่าอยู่บนปม แล้วหาค่ามากสุด"}, "tests": {"en": "the 3 PDF samples; 300 random connected graphs (n ≤ 9) against an event simulation in Python; n = 10,000, m = 40,000, k = 50 in 0.01 s.", "th": "ตัวอย่าง 3 ชุดใน PDF; สุ่มกราฟเชื่อมกัน 300 ชุด (n ≤ 9) เทียบกับการจำลองเหตุการณ์ใน Python; n = 10,000, m = 40,000, k = 50 ใช้ 0.01 วินาที"}, "files": [{"name": "main.cpp", "src": "#include <cstdio>\n#include <vector>\n#include <queue>\nusing namespace std;\n\nint main() {\n    int n, m, k;\n    if (scanf(\"%d %d %d\", &n, &m, &k) != 3) return 0;\n    vector<int> start(k);\n    // the k servers attacked first\n    for (int i = 0; i < k; i++) if (scanf(\"%d\", &start[i]) != 1) return 0;\n    vector<int> c(n);\n    // c[i] = seconds needed to break into server i\n    for (int i = 0; i < n; i++) if (scanf(\"%d\", &c[i]) != 1) return 0;\n    vector<vector<int>> adj(n);\n    // the m cables (the PDF text says n-1 lines, but the samples have m lines)\n    for (int i = 0; i < m; i++) {\n        int a, b;\n        if (scanf(\"%d %d\", &a, &b) != 2) return 0;\n        adj[a].push_back(b);\n        adj[b].push_back(a);\n    }\n    // t[v] = earliest time server v is hacked.\n    // An attacked-first server falls at time c[s]; from an infected u, a neighbour v\n    // falls at t[u] + c[v]. That is Dijkstra where the cost sits on the VERTEX we enter.\n    const int INF = 2e9;\n    vector<int> t(n, INF);\n    priority_queue<pair<int,int>, vector<pair<int,int>>, greater<pair<int,int>>> pq;\n    // all k starting servers go into the heap together (multi-source)\n    for (int i = 0; i < k; i++) {\n        int s = start[i];\n        if (c[s] < t[s]) { t[s] = c[s]; pq.push({t[s], s}); }\n    }\n    // pop servers in order of the time they are hacked\n    while (!pq.empty()) {\n        auto [d, u] = pq.top(); pq.pop();\n        if (d > t[u]) continue;              // outdated entry\n        // try to hack every neighbour from u\n        for (int v : adj[u]) {\n            if (d + c[v] < t[v]) {\n                t[v] = d + c[v];\n                pq.push({t[v], v});\n            }\n        }\n    }\n    int answer = 0;\n    // all servers are hacked once the LAST one falls\n    for (int v = 0; v < n; v++) if (t[v] > answer) answer = t[v];\n    printf(\"%d\\n\", answer);\n}\n"}], "body": {"en": "## 1. What the problem says\nThere are n servers (n ≤ 10,000) and m two-way cables (n − 1 ≤ m ≤ 40,000). A hacker attacks k servers at time 0. Breaking into server i takes **c[i]** seconds (1..1,000). Once a server is hacked, the virus immediately starts attacking all its neighbours. Print the **earliest time at which every server is hacked**.\n\nInput: n m k; the k starting servers; c[0..n−1]; then the cables.\n\nSample 2: n = 4, start at 0, c = 2 5 3 1 → **7**.\n\n> Two mistakes in the PDF: it says \"the next **n − 1** lines\" are cables, but the samples have **m** lines (sample 2 has 4 cables for 4 servers). And the Output section (\"n lines … choke point\") is copied from another problem: the samples print **one number**.\n\n## 2. What it really means\nLet t[v] be the time server v falls.\n- A starting server s falls at t[s] = c[s].\n- From a hacked u, a neighbour v can fall at t[u] + c[v].\n- t[v] is the minimum over all ways, so it is a **shortest path** where the cost sits on the **vertex you enter**, and there are **k sources**.\n\nThe answer is max over v of t[v], because everything is hacked when the **last** server falls.\n\n```text\nsample 2:  c = [2, 5, 3, 1]        times\n   0 ── 1                           t[0] = 2         (attacked first)\n   │    │                           t[2] = 2+3 = 5   (via 0)\n   2 ── 3                           t[3] = 5+1 = 6   (via 2)\n                                    t[1] = 2+5 = 7   (via 0; via 3 would be 6+5 = 11)\n                                    answer = max = 7\n```\n\n:::hint Hint 1\nHow would you handle k starting servers in one run instead of k runs?\n:::\n:::hint Hint 2\nPush every starting server into the heap at time c[s] before the loop starts. Then it is ordinary Dijkstra, with edge weight c[v] for an edge into v.\n:::\n\n## 3. What, why, how\n- **What:** Dijkstra with a binary heap, started from k sources at once.\n- **Why multi-source is correct:** add a virtual node joined to each start s by an edge of weight c[s]. One Dijkstra from it gives every server its fastest time from the nearest start. Pushing all starts first is the same thing.\n- **Why Dijkstra:** all c[i] ≥ 1 > 0, so the earliest unfinished server can never be reached earlier later on.\n- **How:** t = ∞. For each start s: t[s] = c[s], push. Pop (d, u); skip if d > t[u]. For each neighbour v: if d + c[v] < t[v], update and push. Print the max of t.\n- **Cost:** O((n + m) log n) ≈ 50,000 · 14. Measured 0.01 s.\n- **Sizes:** a time is at most 10,000 · 1,000 = 10⁷: `int` is safe.\n\n## 4. Solution\n{{code}}\n{{tests}}\n\n**Trace**: sample 2 (heap entries are (time, server)).\n\n| pop | action | t[0..3] | heap afterwards |\n|---|---|---|---|\n| start | push server 0 at c[0] = 2 | 2 ∞ ∞ ∞ | (2,0) |\n| (2,0) | t[1] = 2+5, t[2] = 2+3 | 2 7 5 ∞ | (5,2) (7,1) |\n| (5,2) | t[3] = 5+1 | 2 7 5 6 | (6,3) (7,1) |\n| (6,3) | 6+5 = 11 > 7: no change | 2 7 5 6 | (7,1) |\n| (7,1) | 7+1 = 8 > 6: no change | 2 7 5 6 | empty |\n\nmax(2, 7, 5, 6) = **7**.\n\n## 5. Traps\n- **Reading n − 1 cable lines:** follow the samples and read **m**.\n- **Starting the sources at time 0:** the first attack also takes c[s] seconds (sample 1: server 1 falls at 5, not 0).\n- **Printing n lines:** print one number.\n- **One Dijkstra per source:** k can be n; that is O(n · m log n), too slow.\n- **A start listed twice:** harmless; the code only pushes if it improves t[s].\n\n## 6. Background\nLesson 17. Cost on a vertex = cost on every edge into it. Many sources = one virtual source. Both tricks also appear in [Columbia](#ex06e3_columbia) (vertex costs) and [Pandemic](#a62_q2a_pandemic) (many sources, BFS). \"Time when everything is done\" = the maximum shortest distance, like [Farthest](#a61_q2_farthest).", "th": "## 1. โจทย์บอกอะไร\nมีเซิร์ฟเวอร์ n เครื่อง (n ≤ 10,000) และสายสองทาง m เส้น (n − 1 ≤ m ≤ 40,000) แฮกเกอร์โจมตีเซิร์ฟเวอร์ k เครื่องตอนเวลา 0 การเจาะเครื่อง i ใช้เวลา **c[i]** วินาที (1..1,000) เมื่อเครื่องไหนถูกเจาะแล้ว ไวรัสจะเริ่มโจมตีเพื่อนบ้านทุกเครื่องทันที ให้พิมพ์ **เวลาที่เร็วที่สุดที่ทุกเครื่องถูกเจาะ**\n\ninput: n m k; เครื่องเริ่มต้น k เครื่อง; c[0..n−1]; แล้วตามด้วยสาย\n\nตัวอย่างที่ 2: n = 4 เริ่มที่ 0, c = 2 5 3 1 → **7**\n\n> PDF ผิดสองจุด: เขียนว่า \"อีก **n − 1** บรรทัด\" เป็นสาย แต่ตัวอย่างมี **m** บรรทัด (ตัวอย่างที่ 2 มีสาย 4 เส้นสำหรับ 4 เครื่อง) และส่วน Output (\"n บรรทัด … choke point\") ถูกคัดลอกมาจากโจทย์อื่น ตัวอย่างพิมพ์ **ตัวเลขตัวเดียว**\n\n## 2. จริง ๆ แล้วถามอะไร\nให้ t[v] คือเวลาที่เครื่อง v ถูกเจาะ\n- เครื่องเริ่มต้น s ถูกเจาะที่ t[s] = c[s]\n- จากเครื่อง u ที่ถูกเจาะแล้ว เพื่อนบ้าน v ถูกเจาะได้ที่ t[u] + c[v]\n- t[v] คือค่าน้อยสุดของทุกทาง จึงเป็น **ระยะสั้นสุด** ที่ค่าอยู่ที่ **ปมที่เดินเข้า** และมี **จุดเริ่ม k จุด**\n\nคำตอบคือ max ของ t[v] ทุก v เพราะทุกเครื่องถูกเจาะเมื่อเครื่อง **สุดท้าย** ล้ม\n\n```text\nsample 2:  c = [2, 5, 3, 1]        times\n   0 ── 1                           t[0] = 2         (attacked first)\n   │    │                           t[2] = 2+3 = 5   (via 0)\n   2 ── 3                           t[3] = 5+1 = 6   (via 2)\n                                    t[1] = 2+5 = 7   (via 0; via 3 would be 6+5 = 11)\n                                    answer = max = 7\n```\n\n:::hint คำใบ้ 1\nจะจัดการจุดเริ่ม k จุดในการรันครั้งเดียวแทนที่จะรัน k ครั้งได้อย่างไร\n:::\n:::hint คำใบ้ 2\nใส่เครื่องเริ่มต้นทุกเครื่องลง heap ด้วยเวลา c[s] ก่อนเริ่มลูป แล้วก็เป็น Dijkstra ธรรมดา โดยเส้นที่เข้า v มีน้ำหนัก c[v]\n:::\n\n## 3. อะไร ทำไม อย่างไร\n- **อะไร:** Dijkstra กับ binary heap เริ่มจาก k จุดพร้อมกัน\n- **ทำไมหลายจุดเริ่มถูกต้อง:** เพิ่มปมเสมือนที่ต่อกับจุดเริ่ม s แต่ละจุดด้วยเส้นน้ำหนัก c[s] Dijkstra ครั้งเดียวจากปมนี้ให้เวลาที่เร็วที่สุดจากจุดเริ่มที่ใกล้ที่สุดกับทุกเครื่อง การใส่ทุกจุดเริ่มก่อนก็คือสิ่งเดียวกัน\n- **ทำไม Dijkstra:** c[i] ทุกตัว ≥ 1 > 0 เครื่องที่ยังไม่เสร็จและเร็วที่สุดจะไม่มีทางถูกเจาะเร็วกว่านี้ภายหลัง\n- **อย่างไร:** t = ∞ ทุกจุดเริ่ม s: t[s] = c[s] แล้วใส่ heap ดึง (d, u); ข้ามถ้า d > t[u] เพื่อนบ้าน v: ถ้า d + c[v] < t[v] อัปเดตแล้วใส่ heap พิมพ์ค่ามากสุดของ t\n- **ต้นทุน:** O((n + m) log n) ≈ 50,000 · 14 วัดได้ 0.01 วินาที\n- **ขนาด:** เวลาไม่เกิน 10,000 · 1,000 = 10⁷: `int` ปลอดภัย\n\n## 4. โค้ดเฉลย\n{{code}}\n{{tests}}\n\n**ไล่ค่า**: ตัวอย่างที่ 2 (รายการใน heap คือ (เวลา, เครื่อง))\n\n| ดึง | ทำอะไร | t[0..3] | heap หลังขั้นนี้ |\n|---|---|---|---|\n| เริ่ม | ใส่เครื่อง 0 ที่ c[0] = 2 | 2 ∞ ∞ ∞ | (2,0) |\n| (2,0) | t[1] = 2+5, t[2] = 2+3 | 2 7 5 ∞ | (5,2) (7,1) |\n| (5,2) | t[3] = 5+1 | 2 7 5 6 | (6,3) (7,1) |\n| (6,3) | 6+5 = 11 > 7: ไม่เปลี่ยน | 2 7 5 6 | (7,1) |\n| (7,1) | 7+1 = 8 > 6: ไม่เปลี่ยน | 2 7 5 6 | ว่าง |\n\nmax(2, 7, 5, 6) = **7**\n\n## 5. จุดที่มักพลาด\n- **อ่านสาย n − 1 บรรทัด:** ทำตามตัวอย่าง อ่าน **m** บรรทัด\n- **ให้จุดเริ่มมีเวลา 0:** การโจมตีครั้งแรกก็ใช้ c[s] วินาทีเช่นกัน (ตัวอย่างที่ 1: เครื่อง 1 ล้มที่ 5 ไม่ใช่ 0)\n- **พิมพ์ n บรรทัด:** พิมพ์ตัวเลขตัวเดียว\n- **Dijkstra หนึ่งครั้งต่อหนึ่งจุดเริ่ม:** k อาจเท่ากับ n จะได้ O(n · m log n) ช้าเกินไป\n- **จุดเริ่มซ้ำกัน:** ไม่เป็นไร โค้ดใส่ heap เฉพาะเมื่อ t[s] ดีขึ้น\n\n## 6. ความรู้พื้นฐาน\nบทที่ 17 ค่าบนปม = ค่าบนทุกเส้นที่เข้าปมนั้น หลายจุดเริ่ม = จุดเริ่มเสมือนจุดเดียว ทั้งสองท่าพบอีกในข้อ [Columbia](#ex06e3_columbia) (ค่าบนปม) และ [Pandemic](#a62_q2a_pandemic) (หลายจุดเริ่ม ใช้ BFS) \"เวลาที่ทุกอย่างเสร็จ\" = ระยะสั้นสุดที่มากที่สุด เหมือนข้อ [Farthest](#a61_q2_farthest)"}}, {"id": "ex06e2_shortest", "group": "sp", "lesson": "17 · Shortest paths: Bellman–Ford, negative cycles", "stars": 3, "complexity": "O(N · E)", "kind": "program", "tags": ["Bellman–Ford", "negative edges", "negative-cycle detection", "virtual source"], "title": {"en": "Shortest path with negative edges", "th": "เส้นทางสั้นสุดที่มีเส้นติดลบ (Shortest path)"}, "blurb": {"en": "Shortest distances from s in a directed graph whose edges may be negative, or -1 if the graph has a negative cycle. Bellman–Ford twice: once from a virtual source to find any negative cycle, once from s.", "th": "ระยะสั้นสุดจาก s ในกราฟมีทิศที่เส้นอาจติดลบ หรือ -1 ถ้ากราฟมีวงวนติดลบ ใช้ Bellman–Ford สองครั้ง: ครั้งแรกจากจุดเริ่มเสมือนเพื่อหาวงวนติดลบที่ใดก็ได้ ครั้งที่สองจาก s"}, "tests": {"en": "the 2 PDF samples, a 3-vertex graph where a negative edge beats a direct one, and N = 1; 300 random graphs (N ≤ 7, weights −5..9) against Floyd–Warshall with negative-cycle detection in Python; N = 100 with 10,000 edges in 0.01 s.", "th": "ตัวอย่าง 2 ชุดใน PDF, กราฟ 3 ปมที่เส้นติดลบชนะเส้นตรง และ N = 1; สุ่มกราฟ 300 ชุด (N ≤ 7 น้ำหนัก −5..9) เทียบกับ Floyd–Warshall ที่ตรวจวงวนติดลบใน Python; N = 100 กับ 10,000 เส้น ใช้ 0.01 วินาที"}, "files": [{"name": "main.cpp", "src": "#include <iostream>\n#include <vector>\nusing namespace std;\n\nstruct Edge { int a, b, c; };\n\nint main() {\n    int n, e, s;\n    cin >> n >> e >> s;\n    vector<Edge> E;\n    int a, b, c;\n    // read \"a b c\" until the input ends: same as reading E lines, and still\n    // correct if the E on the first line does not match the real edge count\n    while (cin >> a >> b >> c) E.push_back({a, b, c});\n\n    // Step 1: is there a negative cycle ANYWHERE? (sample 2 has one that s cannot\n    // even reach, and the answer is still -1.)  Start every vertex at 0, as if a\n    // hidden source had a 0-edge to each of them, and run Bellman-Ford.\n    vector<long long> h(n, 0);\n    bool changed = true;\n    // at most n rounds of relaxing every edge; stop early when nothing changes\n    for (int round = 0; round < n && changed; round++) {\n        changed = false;\n        for (const Edge &x : E)\n            if (h[x.a] + x.c < h[x.b]) { h[x.b] = h[x.a] + x.c; changed = true; }\n    }\n    if (changed) {            // still improving after n rounds -> a negative cycle exists\n        cout << -1 << \"\\n\";\n        return 0;\n    }\n\n    // Step 2: ordinary Bellman-Ford from s. No negative cycle, so n-1 rounds suffice.\n    const long long INF = 1e18;\n    vector<long long> dist(n, INF);\n    dist[s] = 0;\n    // rounds 1 .. n-1: after round i, every shortest path of <= i edges is found\n    for (int round = 1; round <= n - 1; round++) {\n        bool any = false;\n        for (const Edge &x : E)\n            if (dist[x.a] != INF && dist[x.a] + x.c < dist[x.b]) { dist[x.b] = dist[x.a] + x.c; any = true; }\n        if (!any) break;\n    }\n    // print vertex 0 .. n-1 (the PDF does not say what to print for an unreachable\n    // vertex; we never saw one in the samples, see the \"Traps\" section)\n    for (int v = 0; v < n; v++) {\n        if (v > 0) cout << ' ';\n        cout << dist[v];\n    }\n    cout << \"\\n\";\n}\n"}], "body": {"en": "## 1. What the problem says\nA directed graph has N vertices (N ≤ 100) and E weighted edges a → b with weight c, where **−1,000 ≤ c ≤ 1,000**. Print the shortest distance from s to every vertex 0..N−1 on one line. If the graph has a **negative cycle**, print only **−1**.\n\nSample 1 → `0 -1 0 4`. Sample 2 → `-1`: the cycle 1 → 2 → 3 → 1 has total weight −3.\n\n## 2. What it really means\nDijkstra assumes that once a vertex is the closest, nothing can make it closer. A negative edge breaks that. **Bellman–Ford** makes no such assumption: it simply relaxes **every** edge, round after round.\n\nLook closely at sample 2: s = 0, but vertex 0 has **no edges at all**, so s cannot reach the cycle. The expected answer is still −1. So we must detect a negative cycle **anywhere in the graph**, not only one reachable from s.\n\n```text\nsample 2:   0 (s, alone)        1 ──(−1)──▶ 2\n                                ▲            │\n                              (−1)         (−1)\n                                └──── 3 ◀────┘     cycle total −3 < 0  →  print −1\n```\n\n:::hint Hint 1\nA shortest path without a negative cycle uses at most N − 1 edges. What does it mean if a distance still improves in round N?\n:::\n:::hint Hint 2\nTo catch a cycle that s cannot reach, start **every** vertex at distance 0, as if a hidden source had a 0-edge to each of them.\n:::\n\n## 3. What, why, how\n- **What:** Bellman–Ford, used twice.\n- **Why N − 1 rounds are enough:** with no negative cycle, some shortest path is simple, so it has ≤ N − 1 edges. After round i, every shortest path with ≤ i edges is correct (induction on i).\n- **Why round N detects a cycle:** if something still improves in round N, there is a \"shortest path\" with N edges, which must repeat a vertex: a cycle that lowers the cost, a negative cycle.\n- **Step 1 (any negative cycle):** h[v] = 0 for all v, i.e. a virtual source joined to every vertex. Relax all edges up to N rounds. Still changing in round N → print −1.\n- **Step 2 (the distances):** dist[s] = 0, others ∞; relax all edges N − 1 times, skipping edges out of ∞ vertices. Stop early when a round changes nothing.\n- **Cost:** O(N · E) per step. With N = 100 that is tiny.\n\n## 4. Solution\n{{code}}\n{{tests}}\n\n**Trace A**: sample 2, step 1 (h starts at 0 everywhere; edges in input order 1→2, 2→3, 3→1):\n\n| round | h[0] h[1] h[2] h[3] | changed? |\n|---|---|---|\n| 1 | 0 −3 −1 −2 | yes |\n| 2 | 0 −6 −4 −5 | yes |\n| 3 | 0 −9 −7 −8 | yes |\n| 4 = N | 0 −12 −10 −11 | **yes → −1** |\n\n**Trace B**: sample 1, step 2 from s = 0 (edges 0→1 −1, 1→2 +1, 2→3 +4):\n\n| round | dist[0..3] |\n|---|---|\n| start | 0 ∞ ∞ ∞ |\n| 1 | 0 −1 0 4 |\n| 2 | no change, stop |\n\nOutput `0 -1 0 4`.\n\n## 5. Traps\n- **Using Dijkstra:*
