จถึง 25 ล้านครั้ง\n- **ระยะแบบ `int` หรือ `vector<vector<int>>` สำหรับ 25 ล้านช่อง:** เปลืองหน่วยความจำและ cache miss หนึ่งไบต์ต่อช่องก็พอ\n- **recursion (flood fill แบบ DFS):** ลึกได้หลายล้านชั้น และไม่ได้หาเส้นทางสั้นสุดด้วย\n- **input ช้า:** `cin` ธรรมดากับ 50 MB ช้าเกินไป แม้ `scanf` ก็เฉียดฉิว\n- **ช่อง 1 อยู่ติดช่อง 2:** คำตอบ 2 (ตัวอย่างที่ 4)\n\n## 6. ความรู้พื้นฐาน\nบทที่ 16 ไอเดียเดียวกับ [Pandemic](#a62_q2a_pandemic): จุดเริ่มหลายจุดในคิวเดียว รูปแบบ \"ถนนที่สั้นที่สุดระหว่างสองพื้นที่\" เป็นโจทย์ที่ออกสอบบ่อย (เป็นแก่นของโจทย์แบบ \"shortest bridge\") สำหรับตารางขนาดมหึมา ให้คิดเรื่องจำนวนไบต์ต่อช่องก่อนเขียนโค้ด"}}, {"id": "da66_f2_grid_loop", "group": "final", "lesson": "16 · Graphs: walking a degree-≤2 graph", "stars": 3, "complexity": "O(R · C)", "kind": "program", "tags": ["implicit graph", "pipe tiles", "direction tables", "cycles in a degree-2 graph", "simulation"], "title": {"en": "Grid loop", "th": "ถนนวงวนในตาราง (Grid Loop)"}, "blurb": {"en": "Every cell holds one of 6 road tiles, each joining two sides. Count the closed loops and the length of the longest one. Each cell has at most two real connections, so just follow each road until it closes or breaks.", "th": "ทุกช่องมีแผ่นถนนหนึ่งใน 6 แบบ แต่ละแบบเชื่อมสองด้าน ให้นับจำนวนวงวนที่ปิด และความยาวของวงที่ยาวที่สุด แต่ละช่องมีการเชื่อมจริงไม่เกินสองทาง จึงแค่เดินตามถนนแต่ละเส้นจนกว่าจะปิดวงหรือขาด"}, "tests": {"en": "all 3 PDF samples, a 1×1 map, and a 2×2 ring; 300 random maps (up to 5×5) against a Python brute force that builds the graph and finds cycles with union-find; a 1,000 × 1,000 map with one loop round the border (3,996 cells) and a random 1,000 × 1,000 map checked against the brute force, in 0.07–0.09 s.", "th": "ตัวอย่างทั้ง 3 ชุดใน PDF, แผนที่ 1×1 และวงแหวน 2×2; สุ่ม 300 แผนที่ (ถึง 5×5) เทียบกับ brute force ใน Python ที่สร้างกราฟแล้วหาวงด้วย union-find; แผนที่ 1,000 × 1,000 ที่มีวงเดียวรอบขอบ (3,996 ช่อง) และแผนที่สุ่ม 1,000 × 1,000 ที่เทียบกับ brute force ใช้ 0.07–0.09 วินาที"}, "files": [{"name": "main.cpp", "src": "#include <cstdio>\n#include <vector>\nusing namespace std;\n\n// Directions: 0 = up, 1 = right, 2 = down, 3 = left.\nconst int DR[4] = {-1, 0, 1, 0}, DC[4] = {0, 1, 0, -1};\n// OPEN[t] = the two sides that road type t (1..6) connects\nconst int OPEN[7][2] = {\n    {0, 0},      // (unused)\n    {3, 1},      // 1: left  - right\n    {0, 2},      // 2: up    - down\n    {0, 1},      // 3: up    - right\n    {1, 2},      // 4: right - down\n    {2, 3},      // 5: down  - left\n    {3, 0},      // 6: left  - up\n};\n\nint R, C;\nvector<vector<int>> g;\n\nbool opens(int r, int c, int dir) {          // does cell (r, c) have an exit towards dir?\n    return OPEN[g[r][c]][0] == dir || OPEN[g[r][c]][1] == dir;\n}\n\nint main() {\n    if (scanf(\"%d %d\", &R, &C) != 2) return 0;\n    g.assign(R, vector<int>(C));\n    for (int r = 0; r < R; r++)\n        for (int c = 0; c < C; c++)\n            if (scanf(\"%d\", &g[r][c]) != 1) return 0;\n\n    // Every cell has exactly 2 exits, so every cell has at most 2 real connections.\n    // A graph where every node has degree <= 2 splits into simple PATHS and simple CYCLES.\n    // We walk each piece once: it is a loop exactly when the walk comes back to its start.\n    vector<vector<bool>> seen(R, vector<bool>(C, false));\n    int loops = 0, longest = 0;\n    // try every cell as a starting point, row by row\n    for (int sr = 0; sr < R; sr++) {\n        for (int sc = 0; sc < C; sc++) {\n            if (seen[sr][sc]) continue;\n            // walk forward starting through the cell's first exit\n            int r = sr, c = sc, dir = OPEN[g[sr][sc]][0], len = 0;\n            bool closed = false;\n            seen[sr][sc] = true;\n            // each step: leave (r, c) through dir, enter the neighbour, then leave by its other exit\n            while (true) {\n                len++;\n                int nr = r + DR[dir], nc = c + DC[dir];\n                int back = (dir + 2) % 4;                            // the side we enter the neighbour from\n                if (nr < 0 || nr >= R || nc < 0 || nc >= C) break;   // road runs off the map\n                if (!opens(nr, nc, back)) break;                     // neighbour does not connect back\n                if (nr == sr && nc == sc) { closed = true; break; }  // back at the start: a loop\n                if (seen[nr][nc]) break;                             // cannot happen; safety only\n                seen[nr][nc] = true;\n                dir = (OPEN[g[nr][nc]][0] == back) ? OPEN[g[nr][nc]][1] : OPEN[g[nr][nc]][0];\n                r = nr; c = nc;\n            }\n            if (closed) {\n                loops++;\n                if (len > longest) longest = len;\n            } else {\n                // not a loop: also walk the other way from the start, just to mark that\n                // half of the path as seen (so we never start inside it again)\n                r = sr; c = sc; dir = OPEN[g[sr][sc]][1];\n                while (true) {\n                    int nr = r + DR[dir], nc = c + DC[dir];\n                    int back = (dir + 2) % 4;\n                    if (nr < 0 || nr >= R || nc < 0 || nc >= C) break;\n                    if (!opens(nr, nc, back) || seen[nr][nc]) break;\n                    seen[nr][nc] = true;\n                    dir = (OPEN[g[nr][nc]][0] == back) ? OPEN[g[nr][nc]][1] : OPEN[g[nr][nc]][0];\n                    r = nr; c = nc;\n                }\n            }\n        }\n    }\n    if (loops == 0) printf(\"0\\n\");\n    else printf(\"%d %d\\n\", loops, longest);\n}\n"}], "body": {"en": "## 1. What the problem says\nAn R × C grid (R, C ≤ 1,000) is filled with road tiles, types 1–6. Each type joins two sides of its cell:\n\n| type | joins | drawing |\n|---|---|---|\n| 1 | left – right | ─ |\n| 2 | up – down | │ |\n| 3 | up – right | └ |\n| 4 | right – down | ┌ |\n| 5 | down – left | ┐ |\n| 6 | left – up | ┘ |\n\nA **loop** is a road that, followed from some cell, comes back to that cell. Its length is the number of cells on it. Print **the number of loops and the length of the longest**, or just **0** if there are none.\n\nSample 1 (2 × 3): rows `4 1 5` and `3 1 6` draw one closed rectangle of 6 cells → `1 6`.\n\n## 2. What it really means\nTwo neighbouring cells are **really connected** only if **both** tiles open towards each other. Each cell has 2 openings, so each cell has **at most 2 real connections**. A graph where every node has degree ≤ 2 falls apart into simple **paths** and simple **cycles**, nothing else.\n\nSo: pick an unvisited cell, walk along the road in one direction, and see what happens:\n- you come back to the start → a **loop** (count it, record its length);\n- the road runs off the map, or into a tile that does not open back → a **path**, not a loop.\n\n```text\nsample 2 (4 × 4) → \"2 12\"\n   tiles        drawn\n   4 5 4 5      ┌ ┐ ┌ ┐      loop A,  4 cells: (0,2) (0,3) (1,3) (1,2)\n   2 2 3 6      │ │ └ ┘      loop B, 12 cells: (0,0) (0,1) (1,1) (2,1) (2,2) (2,3)\n   2 3 1 5      │ └ ─ ┐                        (3,3) (3,2) (3,1) (3,0) (2,0) (1,0)\n   3 1 1 6      └ ─ ─ ┘\n```\n\n:::hint Hint 1\nHow many neighbours can one cell really be connected to? What do graphs with that property look like?\n:::\n:::hint Hint 2\nStore each tile's two exits as directions 0–3 (up, right, down, left). Entering a cell from side `back`, you leave through its **other** exit.\n:::\n\n## 3. What, why, how\n- **What:** walk each component of an implicit degree-≤2 graph once.\n- **Direction tables:** DR = {−1, 0, 1, 0}, DC = {0, 1, 0, −1} for up, right, down, left. The side you enter from is `(dir + 2) % 4`. OPEN[t] lists the two exits of type t.\n- **One step:** from (r, c) moving in `dir`, go to (nr, nc). Stop if it is off the map or if the tile there does not open towards `back`. Otherwise the new `dir` is that tile's exit that is not `back`.\n- **Loop or path:** if a walk returns to its start, it is a loop of `len` cells. If not, walk the other way from the start too, only to mark the rest of the path as seen, so no later start lands inside it.\n- **Cost:** every cell is visited a constant number of times: O(R · C) = 10⁶. No recursion, no explicit graph.\n\n## 4. Solution\n{{code}}\n{{tests}}\n\n**Trace**: sample 1, starting at (0,0) (type 4 ┌, first exit = right):\n\n| step | enter cell | its type | entered from | leave towards | len |\n|---|---|---|---|---|---|\n| 1 | (0,1) | 1 ─ | left | right | 1 |\n| 2 | (0,2) | 5 ┐ | left | down | 2 |\n| 3 | (1,2) | 6 ┘ | up | left | 3 |\n| 4 | (1,1) | 1 ─ | right | left | 4 |\n| 5 | (1,0) | 3 └ | right | up | 5 |\n| 6 | (0,0) | start! | down | | **6** |\n\nBack at the start after 6 cells: one loop of length 6 → `1 6`.\n\n## 5. Traps\n- **Trusting one side only:** (r, c) opening right is not enough; the neighbour must open left.\n- **\"No loop\" output:** print a single `0`, not `0 0`.\n- **Recursive DFS:** a loop can have up to 10⁶ cells; recursion that deep can crash.\n- **Starting in the middle of a path:** walking only one way leaves the other half unseen; a later start would walk it again (still correct but wasteful) unless you mark both halves.\n- **Mixing up types 3–6:** copy the table from the PDF carefully: 3 = up–right, 4 = right–down, 5 = down–left, 6 = left–up.\n\n## 6. Background\nLesson 16. Grids are implicit graphs; direction arrays and an \"opposite side\" rule replace an adjacency list. Degree ≤ 2 makes cycle-finding a simple walk, compare [Line graph](#a62_q2a_line_graph), where the same \"max degree ≤ 2\" structure decides the answer. For a graph with exactly one cycle see [Cycle in a tree](#a59_q3_cycle).", "th": "## 1. โจทย์บอกอะไร\nตาราง R × C (R, C ≤ 1,000) ถูกเติมด้วยแผ่นถนนแบบ 1–6 แต่ละแบบเชื่อมสองด้านของช่อง:\n\n| แบบ | เชื่อม | รูป |\n|---|---|---|\n| 1 | ซ้าย – ขวา | ─ |\n| 2 | บน – ล่าง | │ |\n| 3 | บน – ขวา | └ |\n| 4 | ขวา – ล่าง | ┌ |\n| 5 | ล่าง – ซ้าย | ┐ |\n| 6 | ซ้าย – บน | ┘ |\n\n**วงวน** คือถนนที่ถ้าเดินตามจากช่องหนึ่งแล้วกลับมาที่ช่องนั้นได้ ความยาวคือจำนวนช่องบนวง ให้พิมพ์ **จำนวนวงวน และความยาวของวงที่ยาวที่สุด** หรือแค่ **0** ถ้าไม่มีเลย\n\nตัวอย่างที่ 1 (2 × 3): แถว `4 1 5` และ `3 1 6` วาดเป็นสี่เหลี่ยมปิดหนึ่งรูป 6 ช่อง → `1 6`\n\n## 2. จริง ๆ แล้วถามอะไร\nช่องสองช่องที่อยู่ติดกัน **เชื่อมกันจริง** ก็ต่อเมื่อแผ่นถนน **ทั้งคู่** เปิดเข้าหากัน แต่ละช่องมี 2 ทางเปิด จึงมี **การเชื่อมจริงไม่เกิน 2 ทาง** กราฟที่ทุกปมมีดีกรี ≤ 2 แยกออกเป็น **เส้นทาง** ธรรมดาและ **วงวน** ธรรมดาเท่านั้น ไม่มีแบบอื่น\n\nดังนั้น: เลือกช่องที่ยังไม่เคยเยี่ยม เดินตามถนนไปทางหนึ่ง แล้วดูว่าเกิดอะไร:\n- กลับมาที่จุดเริ่ม → **วงวน** (นับ และจดความยาว)\n- ถนนวิ่งออกนอกแผนที่ หรือชนแผ่นที่ไม่เปิดกลับมา → **เส้นทาง** ไม่ใช่วงวน\n\n```text\nsample 2 (4 × 4) → \"2 12\"\n   tiles        drawn\n   4 5 4 5      ┌ ┐ ┌ ┐      loop A,  4 cells: (0,2) (0,3) (1,3) (1,2)\n   2 2 3 6      │ │ └ ┘      loop B, 12 cells: (0,0) (0,1) (1,1) (2,1) (2,2) (2,3)\n   2 3 1 5      │ └ ─ ┐                        (3,3) (3,2) (3,1) (3,0) (2,0) (1,0)\n   3 1 1 6      └ ─ ─ ┘\n```\n\n:::hint คำใบ้ 1\nช่องหนึ่งช่องเชื่อมกับเพื่อนบ้านจริง ๆ ได้กี่ช่อง กราฟที่มีคุณสมบัตินี้มีหน้าตาอย่างไร\n:::\n:::hint คำใบ้ 2\nเก็บทางออกสองทางของแต่ละแบบเป็นทิศ 0–3 (บน ขวา ล่าง ซ้าย) เมื่อเข้าช่องจากด้าน `back` ให้ออกทางออก **อีกทาง** ของมัน\n:::\n\n## 3. อะไร ทำไม อย่างไร\n- **อะไร:** เดินทุกชิ้นส่วนของกราฟแฝงที่ดีกรี ≤ 2 ชิ้นละครั้ง\n- **ตารางทิศ:** DR = {−1, 0, 1, 0}, DC = {0, 1, 0, −1} สำหรับ บน ขวา ล่าง ซ้าย ด้านที่เราเดินเข้าคือ `(dir + 2) % 4` OPEN[t] คือทางออกสองทางของแบบ t\n- **หนึ่งก้าว:** จาก (r, c) เดินไปทาง `dir` ถึง (nr, nc) หยุดถ้าออกนอกแผนที่ หรือแผ่นตรงนั้นไม่เปิดหา `back` ไม่อย่างนั้น `dir` ใหม่คือทางออกของแผ่นนั้นที่ไม่ใช่ `back`\n- **วงหรือเส้นทาง:** ถ้าเดินแล้วกลับมาจุดเริ่ม คือวงยาว `len` ช่อง ถ้าไม่ ให้เดินอีกทางจากจุดเริ่มด้วย แค่เพื่อทำเครื่องหมายส่วนที่เหลือของเส้นทาง จะได้ไม่มีจุดเริ่มภายหลังตกลงไปข้างใน\n- **ต้นทุน:** ทุกช่องถูกเยี่ยมจำนวนครั้งคงที่: O(R · C) = 10⁶ ไม่มี recursion ไม่ต้องสร้างกราฟจริง\n\n## 4. โค้ดเฉลย\n{{code}}\n{{tests}}\n\n**ไล่ค่า**: ตัวอย่างที่ 1 เริ่มที่ (0,0) (แบบ 4 ┌ ทางออกแรก = ขวา):\n\n| ก้าว | เข้าช่อง | แบบ | เข้าจาก | ออกไปทาง | len |\n|---|---|---|---|---|---|\n| 1 | (0,1) | 1 ─ | ซ้าย | ขวา | 1 |\n| 2 | (0,2) | 5 ┐ | ซ้าย | ล่าง | 2 |\n| 3 | (1,2) | 6 ┘ | บน | ซ้าย | 3 |\n| 4 | (1,1) | 1 ─ | ขวา | ซ้าย | 4 |\n| 5 | (1,0) | 3 └ | ขวา | บน | 5 |\n| 6 | (0,0) | จุดเริ่ม! | ล่าง | | **6** |\n\nกลับมาจุดเริ่มหลัง 6 ช่อง: วงเดียวยาว 6 → `1 6`\n\n## 5. จุดที่มักพลาด\n- **เชื่อฝั่งเดียว:** (r, c) เปิดไปทางขวายังไม่พอ เพื่อนบ้านต้องเปิดมาทางซ้ายด้วย\n- **ผลลัพธ์เมื่อ \"ไม่มีวง\":** พิมพ์ `0` ตัวเดียว ไม่ใช่ `0 0`\n- **DFS แบบ recursive:** วงหนึ่งมีได้ถึง 10⁶ ช่อง recursion ลึกขนาดนั้นอาจพัง\n- **เริ่มกลางเส้นทาง:** เดินแค่ทางเดียวทำให้อีกครึ่งยังไม่ถูกเห็น จุดเริ่มภายหลังจะเดินซ้ำ (ยังถูกแต่เปลือง) ถ้าไม่ทำเครื่องหมายทั้งสองครึ่ง\n- **สลับแบบ 3–6:** คัดตารางจาก PDF ให้ดี: 3 = บน–ขวา, 4 = ขวา–ล่าง, 5 = ล่าง–ซ้าย, 6 = ซ้าย–บน\n\n## 6. ความรู้พื้นฐาน\nบทที่ 16 ตารางคือกราฟแฝง อาร์เรย์ทิศกับกฎ \"ด้านตรงข้าม\" ใช้แทน adjacency list ดีกรี ≤ 2 ทำให้การหาวงเป็นแค่การเดิน เทียบกับข้อ [Line graph](#a62_q2a_line_graph) ที่โครงสร้าง \"ดีกรีสูงสุด ≤ 2\" แบบเดียวกันเป็นตัวตัดสินคำตอบ สำหรับกราฟที่มีวงพอดีหนึ่งวงดู [วงวนในต้นไม้](#a59_q3_cycle)"}}, {"id": "da66_f2_new_game_plus", "group": "final", "lesson": "14 · Dynamic programming (state = position + last move)", "stars": 3, "complexity": "O(R · C)", "kind": "program", "tags": ["counting DP", "extra state for \"last door\"", "column by column", "mod 100000007"], "title": {"en": "New Game Plus", "th": "นิวเกมพลัส (New Game Plus)"}, "blurb": {"en": "Walk a maze from column 1 to column C, each step going up-right, right or down-right, never using the same door twice in a row, avoiding blocked rooms. Count the routes mod 100,000,007 with a DP whose state remembers the last door.", "th": "เดินเขาวงกตจากคอลัมน์ 1 ไปคอลัมน์ C แต่ละก้าวไปขวาบน ขวา หรือขวาล่าง ห้ามใช้ประตูเดิมสองครั้งติดกัน และหลบห้องห้ามเข้า นับจำนวนเส้นทาง mod 100,000,007 ด้วย DP ที่ state จำประตูล่าสุดไว้"}, "tests": {"en": "all 7 PDF samples, including the 25 × 25 empty maze (543,099,714 routes → 43,099,679); 300 random mazes (up to 5 × 6) against a Python brute force that enumerates every route; a 500 × 500 maze with 10 % blocked rooms in 0.02 s.", "th": "ตัวอย่างทั้ง 7 ชุดใน PDF รวมถึงเขาวงกตว่าง 25 × 25 (543,099,714 เส้นทาง → 43,099,679); สุ่ม 300 เขาวงกต (ถึง 5 × 6) เทียบกับ brute force ใน Python ที่ไล่ทุกเส้นทาง; เขาวงกต 500 × 500 ที่มีห้องห้ามเข้า 10 % ใช้ 0.02 วินาที"}, "files": [{"name": "main.cpp", "src": "#include <cstdio>\n#include <vector>\nusing namespace std;\n\nconst int MOD = 100000007;\n\nint main() {\n    int R, C;\n    if (scanf(\"%d %d\", &R, &C) != 2) return 0;\n    vector<vector<int>> blocked(R, vector<int>(C));\n    for (int r = 0; r < R; r++)\n        for (int c = 0; c < C; c++)\n            if (scanf(\"%d\", &blocked[r][c]) != 1) return 0;\n\n    // State = (row, the door we used to ENTER this room). Doors: 0 = X (up-right),\n    // 1 = Y (right), 2 = Z (down-right). The next door must differ from it.\n    // cur[r][d] = number of different room lists that end in room (r, c) and entered it by door d.\n    // For column 0 nobody entered by a door yet: we use d = 3 for \"start\" (no restriction).\n    const int DROW[3] = {-1, 0, +1};\n    vector<vector<long long>> cur(R, vector<long long>(4, 0)), nxt;\n    // column 0: start in any open room\n    for (int r = 0; r < R; r++)\n        if (!blocked[r][0]) cur[r][3] = 1;\n    // move column by column: c -> c+1, for c = 0 .. C-2\n    for (int c = 0; c + 1 < C; c++) {\n        nxt.assign(R, vector<long long>(4, 0));\n        // every room (r, c) and every way d we entered it\n        for (int r = 0; r < R; r++)\n            for (int d = 0; d < 4; d++) {\n                if (cur[r][d] == 0) continue;\n                // try the three doors e; door e may not repeat door d\n                for (int e = 0; e < 3; e++) {\n                    if (e == d) continue;\n                    int nr = r + DROW[e];\n                    if (nr < 0 || nr >= R || blocked[nr][c + 1]) continue;\n                    nxt[nr][e] = (nxt[nr][e] + cur[r][d]) % MOD;\n                }\n            }\n        cur.swap(nxt);\n    }\n    long long total = 0;\n    // every room in the last column, entered by any door\n    for (int r = 0; r < R; r++)\n        for (int d = 0; d < 4; d++) total = (total + cur[r][d]) % MOD;\n    printf(\"%lld\\n\", total);\n}\n"}], "body": {"en": "## 1. What the problem says\nA maze is an R × C grid of rooms (2 ≤ R, C ≤ 500); 1 marks a blocked room. You start in **any open room of column 1** and must reach **any room of column C**. Each room has three doors:\n- **X** → (r − 1, c + 1), up-right\n- **Y** → (r, c + 1), right\n- **Z** → (r + 1, c + 1), down-right\n\nRules: you may **not use the same door as the previous step** (X then X is forbidden, X then Y then X is fine); you cannot enter blocked rooms or leave the grid. Two plays differ if their **lists of rooms** differ. Print the number of plays **mod 100,000,007**.\n\nSample 2 (2 × 3, room (1,2) blocked) → **3**. The route (2,1) → (2,2) → (2,3) is not allowed: Y twice in a row.\n\n## 2. What it really means\nEvery step moves one column right, so a play has exactly C rooms, one per column, and a room list is the same as a door sequence plus the starting row. We are **counting paths** in a DAG of columns: a counting DP like [chocolate](#a62_q1b_chocolate), built column by column like [table no 11](#a64_q2_table_no_11).\n\nThe catch is the rule \"not the same door twice\". Whether a door is allowed depends on **how we got here**. So the state must remember it:\n\n> ways[r][d] = number of valid room lists that end in room (r, current column) and **entered it through door d**.\n\nFor column 1 nobody used a door yet; give it a fourth value d = \"start\" that forbids nothing.\n\n```text\ntransition (column c → c+1):\n   ways_next[r + Δ(e)][e] += ways[r][d]      for every door e ≠ d,\n                                             Δ(X) = −1, Δ(Y) = 0, Δ(Z) = +1,\n                                             if the target room is inside and open\n```\n\n:::hint Hint 1\nCounting paths column by column is easy without the door rule. What extra fact do you need about a path to know which doors it may use next?\n:::\n:::hint Hint 2\nUse 4 counters per room: entered by X, by Y, by Z, or \"started here\". Then each counter feeds the 2 or 3 doors that differ from it.\n:::\n\n## 3. What, why, how\n- **What:** a counting DP over columns with state (row, last door).\n- **Why the state is enough:** the future (which doors are allowed next, which rooms can be reached) depends only on the current room and the last door, not on the earlier history. That is exactly the \"memoryless\" condition a DP state needs.\n- **Why counts add up correctly:** two room lists that differ anywhere stay different when extended, so adding counts never double-counts.\n- **How:** cur[r][start] = 1 for every open room in column 0. For c = 0..C−2, build nxt from cur by the transition above, then swap. The answer is the sum of all cur[r][d] in the last column, mod 100,000,007.\n- **Cost:** R · C · 4 · 3 ≈ 3 × 10⁶ updates. Memory: two columns of R × 4 numbers.\n- **Mod:** reduce after every addition; values stay below 2 × 10⁸, safe in `long long`.\n\n## 4. Solution\n{{code}}\n{{tests}}\n\n**Trace**: sample 2. Rooms (row, column) 0-based; (0,1) is blocked. Counters are [X, Y, Z, start].\n\n| column | row 0 | row 1 | comment |\n|---|---|---|---|\n| 0 | [0, 0, 0, 1] | [0, 0, 0, 1] | start anywhere open |\n| 1 | blocked | [0, 1, 1, 0] | row 0 can only go Z (Y is blocked); row 1 goes Y (X is blocked) |\n| 2 | [2, 0, 0, 0] | [0, 1, 0, 0] | from \"entered by Z\": X up or Y right; from \"entered by Y\": only X up (Z is off the grid) |\n\nTotal 2 + 1 = **3**.\n\n## 5. Traps\n- **State without the last door:** you cannot enforce the rule.\n- **Forbidding the same door at the very first step:** there is no previous door for column 1.\n- **Starting from blocked rooms in column 1** or counting blocked rooms in column C: both are forbidden.\n- **Mod only at the end:** the true count for 500 × 500 is astronomically large.\n- **Recursion over all routes:** exponential (the 25 × 25 sample alone has 543 million routes).\n\n## 6. Background\nLesson 14. \"Add the last move to the state\" is the standard way to handle rules such as \"no two equal moves in a row\". The same idea appears in [table no 11](#a64_q2_table_no_11), where the state remembers what is in the previous row. Summing the counts of all predecessors is the pattern of [chocolate](#a62_q1b_chocolate); moving through a grid one layer at a time, choosing among a few next cells, is the shape of [triangle](#ex02m1_triangle).", "th": "## 1. โจทย์บอกอะไร\nเขาวงกตเป็นตารางห้อง R × C (2 ≤ R, C ≤ 500) เลข 1 คือห้องห้ามเข้า เราเริ่มที่ **ห้องเปิดใดก็ได้ในคอลัมน์ 1** และต้องไปถึง **ห้องใดก็ได้ในคอลัมน์ C** แต่ละห้องมีสามประตู:\n- **X** → (r − 1, c + 1) ขวาบน\n- **Y** → (r, c + 1) ขวา\n- **Z** → (r + 1, c + 1) ขวาล่าง\n\nกฎ: **ห้ามใช้ประตูเดียวกับก้าวก่อนหน้า** (X แล้ว X ห้าม แต่ X แล้ว Y แล้ว X ได้) ห้ามเข้าห้องห้ามเข้าหรือออกนอกตาราง การเล่นสองแบบต่างกันถ้า **รายการห้อง** ต่างกัน ให้พิมพ์จำนวนรูปแบบการเล่น **mod 100,000,007**\n\nตัวอย่างที่ 2 (2 × 3, ห้อง (1,2) ห้ามเข้า) → **3** เส้นทาง (2,1) → (2,2) → (2,3) ไม่ได้: ใช้ Y สองครั้งติดกัน\n\n## 2. จริง ๆ แล้วถามอะไร\nทุกก้าวขยับไปขวาหนึ่งคอลัมน์ การเล่นหนึ่งแบบจึงมี C ห้องพอดี คอลัมน์ละห้อง และรายการห้องก็เท่ากับลำดับประตูบวกแถวเริ่มต้น เรากำลัง **นับเส้นทาง** ใน DAG ของคอลัมน์: DP นับจำนวนแบบข้อ [chocolate](#a62_q1b_chocolate) ที่สร้างทีละคอลัมน์แบบข้อ [table no 11](#a64_q2_table_no_11)\n\nจุดยากคือกฎ \"ห้ามประตูเดิมสองครั้ง\" ประตูไหนใช้ได้ขึ้นกับว่า **เรามาถึงที่นี่อย่างไร** state จึงต้องจำสิ่งนี้ไว้:\n\n> ways[r][d] = จำนวนรายการห้องที่ถูกกฎซึ่งจบที่ห้อง (r, คอลัมน์ปัจจุบัน) และ **เข้ามาทางประตู d**\n\nคอลัมน์ 1 ยังไม่มีใครใช้ประตู ให้ค่าที่สี่ d = \"เริ่ม\" ซึ่งไม่ห้ามอะไรเลย\n\n```text\ntransition (column c → c+1):\n   ways_next[r + Δ(e)][e] += ways[r][d]      for every door e ≠ d,\n                                             Δ(X) = −1, Δ(Y) = 0, Δ(Z) = +1,\n                                             if the target room is inside and open\n```\n\n:::hint คำใบ้ 1\nถ้าไม่มีกฎประตู การนับเส้นทางทีละคอลัมน์ง่ายมาก เราต้องรู้ข้อมูลอะไรเพิ่มเกี่ยวกับเส้นทาง เพื่อจะรู้ว่าก้าวต่อไปใช้ประตูไหนได้\n:::\n:::hint คำใบ้ 2\nใช้ตัวนับ 4 ตัวต่อห้อง: เข้าทาง X, ทาง Y, ทาง Z หรือ \"เริ่มที่นี่\" แล้วตัวนับแต่ละตัวส่งต่อให้ประตู 2 หรือ 3 บานที่ไม่ซ้ำกับมัน\n:::\n\n## 3. อะไร ทำไม อย่างไร\n- **อะไร:** DP นับจำนวนทีละคอลัมน์ ด้วย state (แถว, ประตูล่าสุด)\n- **ทำไม state นี้พอ:** อนาคต (ประตูไหนใช้ได้ต่อ ห้องไหนไปถึงได้) ขึ้นกับแค่ห้องปัจจุบันและประตูล่าสุด ไม่ขึ้นกับประวัติก่อนหน้า ซึ่งคือเงื่อนไข \"ไม่ต้องจำอดีต\" ที่ state ของ DP ต้องมี\n- **ทำไมการบวกจำนวนถูกต้อง:** รายการห้องสองรายการที่ต่างกันตรงไหนสักที่ จะยังต่างกันเมื่อต่อยาวออกไป การบวกจึงไม่นับซ้ำ\n- **อย่างไร:** cur[r][เริ่ม] = 1 สำหรับทุกห้องเปิดในคอลัมน์ 0 สำหรับ c = 0..C−2 สร้าง nxt จาก cur ด้วย transition ข้างบน แล้วสลับ คำตอบคือผลรวมของ cur[r][d] ทั้งหมดในคอลัมน์สุดท้าย mod 100,000,007\n- **ต้นทุน:** R · C · 4 · 3 ≈ 3 × 10⁶ การอัปเดต หน่วยความจำ: สองคอลัมน์ ขนาด R × 4\n- **mod:** ลดหลังทุกการบวก ค่าอยู่ต่ำกว่า 2 × 10⁸ ปลอดภัยใน `long long`\n\n## 4. โค้ดเฉลย\n{{code}}\n{{tests}}\n\n**ไล่ค่า**: ตัวอย่างที่ 2 ห้อง (แถว, คอลัมน์) เริ่มที่ 0; (0,1) ห้ามเข้า ตัวนับคือ [X, Y, Z, เริ่ม]\n\n| คอลัมน์ | แถว 0 | แถว 1 | หมายเหตุ |\n|---|---|---|---|\n| 0 | [0, 0, 0, 1] | [0, 0, 0, 1] | เริ่มที่ห้องเปิดใดก็ได้ |\n| 1 | ห้ามเข้า | [0, 1, 1, 0] | แถว 0 ไปได้แค่ Z (Y ห้ามเข้า); แถว 1 ไป Y (X ห้ามเข้า) |\n| 2 | [2, 0, 0, 0] | [0, 1, 0, 0] | จาก \"เข้าทาง Z\": X ขึ้น หรือ Y ขวา; จาก \"เข้าทาง Y\": ได้แค่ X ขึ้น (Z ออกนอกตาราง) |\n\nรวม 2 + 1 = **3**\n\n## 5. จุดที่มักพลาด\n- **state ไม่มีประตูล่าสุด:** บังคับกฎไม่ได้\n- **ห้ามประตูซ้ำตั้งแต่ก้าวแรก:** คอลัมน์ 1 ยังไม่มีประตูก่อนหน้า\n- **เริ่มจากห้องห้ามเข้าในคอลัมน์ 1** หรือนับห้องห้ามเข้าในคอลัมน์ C: ห้ามทั้งคู่\n- **mod แค่ตอนท้าย:** จำนวนจริงของ 500 × 500 ใหญ่มหาศาล\n- **recursion ไล่ทุกเส้นทาง:** เอกซ์โพเนนเชียล (แค่ตัวอย่าง 25 × 25 ก็มี 543 ล้านเส้นทาง)\n\n## 6. ความรู้พื้นฐาน\nบทที่ 14 \"ใส่ท่าล่าสุดลงใน state\" คือวิธีมาตรฐานสำหรับกฎแบบ \"ห้ามท่าเดิมสองครั้งติดกัน\" ไอเดียเดียวกันอยู่ในข้อ [table no 11](#a64_q2_table_no_11) ที่ state จำว่าแถวก่อนหน้ามีอะไร การบวกจำนวนจากทุกตัวก่อนหน้าคือรูปแบบของข้อ [chocolate](#a62_q1b_chocolate) ส่วนการเดินผ่านตารางทีละชั้นโดยเลือกจากช่องถัดไปไม่กี่ช่องคือรูปร่างของข้อ [triangle](#ex02m1_triangle)"}}, {"id": "da67_f_abc_permutation", "group": "final67", "lesson": "11 · Recursion & backtracking", "stars": 1, "complexity": "O(3ᴺ · N) at most", "kind": "program", "tags": ["backtracking", "strings with limited letters", "lexicographic order", "count first", "output buffer"], "title": {"en": "ABC permutation", "th": "เรียงสับเปลี่ยน ABC (ABC Permutation)"}, "blurb": {"en": "Print every string of length N ≤ 12 that uses at most i A's, j B's and k C's, in dictionary order, with the count on the first line. Backtrack position by position trying A, B, C in order with a \"letters left\" counter, and collect the lines in a buffer so the count can be printed first.", "th": "พิมพ์ทุกสตริงยาว N ≤ 12 ที่ใช้ A ไม่เกิน i ตัว B ไม่เกิน j ตัว C ไม่เกิน k ตัว เรียงตามพจนานุกรม และพิมพ์จำนวนก่อนในบรรทัดแรก ใช้ backtracking ทีละตำแหน่งโดยลอง A, B, C ตามลำดับพร้อมตัวนับ \"ตัวอักษรที่เหลือ\" และเก็บบรรทัดไว้ใน buffer เพื่อพิมพ์จำนวนก่อนได้"}, "tests": {"en": "all five PDF samples and a case with no answer (N = 3 with only 2 C's → 0); 300 random inputs (N ≤ 6) against a Python filter over all 3ᴺ strings; N = 12 with no limits (531,441 lines) in 0.01 s.", "th": "ตัวอย่างทั้งห้าชุดใน PDF และกรณีที่ไม่มีคำตอบ (N = 3 แต่มี C แค่ 2 ตัว → 0); สุ่ม 300 ชุด (N ≤ 6) เทียบกับการกรองทุกสตริง 3ᴺ แบบใน Python; N = 12 ไม่จำกัดตัวอักษร (531,441 บรรทัด) ใช้ 0.01 วินาที"}, "files": [{"name": "main.cpp", "src": "#include <iostream>\n#include <string>\nusing namespace std;\n\nint N;\nint left_[3];                // how many more A, B, C we may still use\nstring cur, out;             // out collects every answer line, so the count can be printed first\nlong long P = 0;\n\n// fill positions pos, pos+1, ..., N-1\nvoid gen(int pos) {\n    if (pos == N) { out += cur; out += '\\n'; P++; return; }\n    // letters in alphabetical order: A, B, C  -> answers come out in dictionary order\n    for (int c = 0; c < 3; c++) {\n        if (left_[c] == 0) continue;          // this letter is used up\n        left_[c]--;\n        cur[pos] = 'A' + c;\n        gen(pos + 1);\n        left_[c]++;                           // undo\n    }\n}\n\nint main() {\n    ios_base::sync_with_stdio(false);\n    cin >> N >> left_[0] >> left_[1] >> left_[2];\n    cur.assign(N, ' ');\n    gen(0);\n    cout << P << \"\\n\" << out;\n}\n"}], "body": {"en": "## 1. What the problem says\nPrint every string of length N (1 ≤ N ≤ 12) made of the letters A, B and C that uses **at most** i A's, j B's and k C's. First print the count P, then the P strings in dictionary order (A < B < C). A correct count with wrong lines still earns 40 % of a test.\n\nInput: one line `N i j k`.\n\nSamples: `2 0 1 3` → 3 (BC, CB, CC); `2 1 1 3` → 7; `4 2 1 1` → 12 (the permutations of AABC); `5 2 3 0` → 10.\n\nThe PDF calls it a permutation, but the second sample shows that the letters are an upper limit: with N = 2, i = 1, j = 1, k = 3 the answer includes CC, which uses no A and no B.\n\n## 2. What it really means\nFill N positions from left to right. At each position try A, then B, then C, as long as that letter has copies left. Because the choices are tried in alphabetical order and all strings have the same length, the strings come out **already in dictionary order**.\n\n```text\nN = 2, at most A:0 B:1 C:3\n\nposition 0:     B (B left 0)          C (C left 2)\nposition 1:     C → \"BC\"              B → \"CB\"    C → \"CC\"\n                (no A, no B left)     (B left 0)\ncount 3\n```\n\n:::hint Hint 1\nThis is the [Generate barcode](#ex00e4) recursion with three letters instead of two. What do you need to remember at each step to know whether a letter can still be used?\n:::\n:::hint Hint 2\nKeep left[A], left[B], left[C]. At position pos try the letters in order A, B, C; skip a letter whose left is 0; decrement, recurse, increment. The count is needed **before** the list: store the lines in a string and print it after the count.\n:::\n\n## 3. What, why, how\n- **What:** backtracking `gen(pos)` over positions, letters in alphabetical order, a counter of copies left per letter.\n- **Why the order is automatically right:** two strings first differ at some position; the one with the smaller letter there was generated in an earlier branch, because the loop tries smaller letters first.\n- **How to print the count first:** append each finished string and a newline to `out`, count it in `P`, and print `P` then `out` at the end. (Computing P first with a separate counting pass also works.)\n- **Size:** at most 3¹² = 531,441 lines of 13 bytes, about 7 MB. Building one string and printing it once is fast; `endl` per line would flush 500,000 times.\n- **Cost:** O(P · N) for the output, plus the dead branches, which are at most N levels deep.\n\n## 4. Solution\n{{code}}\n{{tests}}\n\n**Trace**: sample 1, `2 0 1 3` (left shown as A/B/C).\n\n| call | left before | tried at this position | result |\n|---|---|---|---|\n| gen(0) | 0/1/3 | A: none left | skip |\n| gen(0) | 0/1/3 | B → gen(1) | |\n| gen(1) | 0/0/3 | A, B: none left; C | **BC** |\n| gen(0) | 0/1/3 | C → gen(1) | |\n| gen(1) | 0/1/2 | A: none; B | **CB** |\n| gen(1) | 0/1/2 | C | **CC** |\n\nP = 3, then BC, CB, CC.\n\n## 5. Traps\n- **Reading \"permutation\" literally** (exactly i A's, j B's, k C's): fails sample 1, where i + j + k = 4 ≠ N = 2.\n- **Printing lines before the count:** the count must come first, so buffer the lines or count first.\n- **Sorting at the end:** unnecessary if the letters are tried in order, and sorting 500,000 strings costs time.\n- **No answer:** print just `0`. With N = 3 and only C's allowed up to 2, nothing fits.\n- **Forgetting to restore** left[c] after the recursive call.\n\n## 6. Background\nLesson 11. Strings over a small alphabet with per-letter limits are \"multiset permutations\" when the limits add up to N exactly. The count can also be computed directly as a sum of multinomial coefficients N! / (a! b! c!) over all a ≤ i, b ≤ j, c ≤ k with a + b + c = N, which is how you could print P without generating anything. The da68 final repeats the problem with four letters: [ABCD permutation](#da68_f_abcd_permutation).", "th": "## 1. โจทย์บอกอะไร\nพิมพ์ทุกสตริงยาว N (1 ≤ N ≤ 12) ที่ประกอบด้วยตัวอักษร A, B, C โดยใช้ A **ไม่เกิน** i ตัว B ไม่เกิน j ตัว C ไม่เกิน k ตัว พิมพ์จำนวน P ก่อน แล้วพิมพ์สตริงทั้ง P ตัวเรียงตามพจนานุกรม (A < B < C) ถ้าจำนวนถูกแต่บรรทัดอื่นผิดยังได้ 40 % ของชุดทดสอบนั้น\n\ninput: หนึ่งบรรทัด `N i j k`\n\nตัวอย่าง: `2 0 1 3` → 3 (BC, CB, CC); `2 1 1 3` → 7; `4 2 1 1` → 12 (permutation ของ AABC); `5 2 3 0` → 10\n\nPDF เรียกว่า permutation แต่ตัวอย่างที่สองแสดงว่าจำนวนตัวอักษรเป็นแค่ขอบบน: เมื่อ N = 2, i = 1, j = 1, k = 3 คำตอบมี CC ซึ่งไม่ใช้ A และ B เลย\n\n## 2. จริง ๆ แล้วถามอะไร\nเติม N ตำแหน่งจากซ้ายไปขวา แต่ละตำแหน่งลอง A แล้ว B แล้ว C ตราบใดที่ตัวอักษรนั้นยังเหลือ เพราะลองตามลำดับตัวอักษรและทุกสตริงยาวเท่ากัน สตริงจึงออกมา **เรียงตามพจนานุกรมอยู่แล้ว**\n\n```text\nN = 2, at most A:0 B:1 C:3\n\nposition 0:     B (B left 0)          C (C left 2)\nposition 1:     C → \"BC\"              B → \"CB\"    C → \"CC\"\n                (no A, no B left)     (B left 0)\ncount 3\n```\n\n:::hint คำใบ้ 1\nนี่คือ recursion ของข้อ [Generate barcode](#ex00e4) ที่มีสามตัวอักษรแทนสอง ต้องจำอะไรไว้ในแต่ละขั้นจึงจะรู้ว่าตัวอักษรไหนยังใช้ได้\n:::\n:::hint คำใบ้ 2\nเก็บ left[A], left[B], left[C] ที่ตำแหน่ง pos ลองตัวอักษรตามลำดับ A, B, C ข้ามตัวที่ left เป็น 0 ลดค่า เรียกต่อ แล้วเพิ่มคืน จำนวนต้องพิมพ์ **ก่อน** รายการ จึงเก็บบรรทัดไว้ใน string แล้วพิมพ์หลังจำนวน\n:::\n\n## 3. อะไร ทำไม อย่างไร\n- **อะไร:** backtracking `gen(pos)` ไล่ตำแหน่ง ลองตัวอักษรตามลำดับ และมีตัวนับจำนวนที่เหลือของแต่ละตัว\n- **ทำไมลำดับถูกเองอัตโนมัติ:** สตริงสองตัวต่างกันครั้งแรกที่ตำแหน่งหนึ่ง ตัวที่ตัวอักษรตรงนั้นเล็กกว่าถูกสร้างในกิ่งก่อน เพราะลูปลองตัวที่เล็กกว่าก่อน\n- **พิมพ์จำนวนก่อนอย่างไร:** ต่อสตริงที่เสร็จแล้วพร้อมขึ้นบรรทัดใหม่เข้า `out` นับใน `P` แล้วพิมพ์ `P` ตามด้วย `out` ตอนจบ (นับ P ก่อนด้วยการไล่อีกรอบหนึ่งก็ได้)\n- **ขนาด:** มากสุด 3¹² = 531,441 บรรทัด บรรทัดละ 13 ไบต์ ราว 7 MB สร้าง string ก้อนเดียวแล้วพิมพ์ครั้งเดียวเร็ว ส่วน `endl` ทุกบรรทัดจะ flush 500,000 ครั้ง\n- **ต้นทุน:** O(P · N) สำหรับ output บวกกิ่งตันซึ่งลึกไม่เกิน N ระดับ\n\n## 4. โค้ดเฉลย\n{{code}}\n{{tests}}\n\n**ไล่ค่า**: ตัวอย่างที่ 1 `2 0 1 3` (left แสดงเป็น A/B/C)\n\n| การเรียก | left ก่อน | ลองที่ตำแหน่งนี้ | ผล |\n|---|---|---|---|\n| gen(0) | 0/1/3 | A: ไม่เหลือ | ข้าม |\n| gen(0) | 0/1/3 | B → gen(1) | |\n| gen(1) | 0/0/3 | A, B: ไม่เหลือ; C | **BC** |\n| gen(0) | 0/1/3 | C → gen(1) | |\n| gen(1) | 0/1/2 | A: ไม่เหลือ; B | **CB** |\n| gen(1) | 0/1/2 | C | **CC** |\n\nP = 3 แล้วตามด้วย BC, CB, CC\n\n## 5. จุดที่มักพลาด\n- **อ่านคำว่า \"permutation\" ตรงตัว** (A i ตัว B j ตัว C k ตัวพอดี): ตัวอย่างที่ 1 ผิด เพราะ i + j + k = 4 ≠ N = 2\n- **พิมพ์บรรทัดก่อนจำนวน:** จำนวนต้องมาก่อน จึงต้องเก็บบรรทัดไว้หรือนับก่อน\n- **เรียงตอนท้าย:** ไม่จำเป็นถ้าลองตัวอักษรตามลำดับ และการเรียง 500,000 สตริงเสียเวลา\n- **ไม่มีคำตอบ:** พิมพ์แค่ `0` เช่น N = 3 แต่ใช้ได้แค่ C ไม่เกิน 2 ตัว ก็ไม่มีสตริงไหนใช้ได้\n- **ลืมคืนค่า** left[c] หลังเรียก recursion\n\n## 6. ความรู้พื้นฐาน\nบทที่ 11 สตริงบนตัวอักษรชุดเล็กที่จำกัดจำนวนแต่ละตัว คือ \"permutation ของ multiset\" เมื่อขอบบนรวมกันได้ N พอดี จำนวนคำตอบคำนวณตรง ๆ ได้ด้วยผลรวมของสัมประสิทธิ์พหุนาม N! / (a! b! c!) บนทุก a ≤ i, b ≤ j, c ≤ k ที่ a + b + c = N ซึ่งเป็นวิธีพิมพ์ P โดยไม่ต้องสร้างอะไรเลย ข้อสอบ da68 final นำโจทย์นี้กลับมาอีกครั้งด้วยสี่ตัวอักษร: [ABCD permutation](#da68_f_abcd_permutation)"}}, {"id": "da67_f_border_extend", "group": "final67", "lesson": "16 · Graphs: BFS (multi-source)", "stars": 2, "complexity": "O(R · C)", "kind": "program", "tags": ["multi-source BFS", "grid", "distance to nearest land", "layered BFS", "fast output"], "title": {"en": "Border extend", "th": "ถมที่ขยายเกาะ (Border Extend)"}, "blurb": {"en": "An R × C map of land (1) and water (0), R, C ≤ 1000. Every water cell within k steps (up, down, left, right) of some land becomes 2. Put all land cells in one BFS queue at distance 0, expand layer by layer, and stop growing at distance k.", "th": "แผนที่ R × C ของพื้นดิน (1) และน้ำ (0) โดย R, C ≤ 1000 ทุกช่องน้ำที่อยู่ห่างจากพื้นดินไม่เกิน k ก้าว (บน ล่าง ซ้าย ขวา) จะกลายเป็น 2 ใส่ทุกช่องดินลงคิว BFS เดียวที่ระยะ 0 ขยายทีละชั้น และหยุดขยายที่ระยะ k"}, "tests": {"en": "all five PDF samples; 300 random maps (R, C ≤ 7, k ≤ 4) against a Python brute force using the Manhattan distance to the nearest land cell; R = C = 1,000 with one land cell in a corner and k = 2,000 (the whole map) in 0.07 s.", "th": "ตัวอย่างทั้งห้าชุดใน PDF; สุ่มแผนที่ 300 ชุด (R, C ≤ 7, k ≤ 4) เทียบกับ brute force ใน Python ที่ใช้ระยะ Manhattan ไปยังช่องดินที่ใกล้ที่สุด; R = C = 1,000 มีดินช่องเดียวที่มุมและ k = 2,000 (ทั้งแผนที่) ใช้ 0.07 วินาที"}, "files": [{"name": "main.cpp", "src": "#include <iostream>\n#include <vector>\n#include <queue>\nusing namespace std;\n\nint main() {\n    ios_base::sync_with_stdio(false); cin.tie(NULL);\n    int R, C, k;\n    cin >> R >> C >> k;\n    vector<vector<int>> g(R, vector<int>(C));\n    vector<vector<int>> dist(R, vector<int>(C, -1));   // steps from the nearest land, -1 = not reached\n    queue<pair<int, int>> q;\n    // read the map; every land cell (1) is a BFS source at distance 0\n    for (int r = 0; r < R; r++) {\n        for (int c = 0; c < C; c++) {\n            cin >> g[r][c];\n            if (g[r][c] == 1) { dist[r][c] = 0; q.push({r, c}); }\n        }\n    }\n    int dr[4] = {-1, 1, 0, 0}, dc[4] = {0, 0, -1, 1};\n    // multi-source BFS, but never further than k steps\n    while (!q.empty()) {\n        auto [r, c] = q.front(); q.pop();\n        if (dist[r][c] == k) continue;        // the border may not grow past k\n        // the four neighbours up, down, left, right\n        for (int d = 0; d < 4; d++) {\n            int nr = r + dr[d], nc = c + dc[d];\n            if (nr < 0 || nr >= R || nc < 0 || nc >= C || dist[nr][nc] != -1) continue;\n            dist[nr][nc] = dist[r][c] + 1;\n            g[nr][nc] = 2;                    // water within k steps becomes border\n            q.push({nr, nc});\n        }\n    }\n    // print the new map in the input format\n    for (int r = 0; r < R; r++) {\n        for (int c = 0; c < C; c++) cout << g[r][c] << (c + 1 < C ? ' ' : '\\n');\n    }\n}\n"}], "body": {"en": "## 1. What the problem says\nA map is an R × C grid (1 ≤ R, C ≤ 1,000): 1 is land, 0 is water. The **distance from land** of a water cell is the fewest steps (up, down, left or right, staying inside the grid) to reach any land cell. Every water cell whose distance is **at most k** (1 ≤ k ≤ 2,000) is filled; print the map with filled cells shown as **2**, in the same format as the input (numbers separated by spaces).\n\nSample 1: a 5 × 3 map with one land cell in the middle of row 2, k = 2:\n\n```text\ninput        output\n0 0 0        2 2 2\n0 1 0        2 1 2\n0 0 0        2 2 2\n0 0 0        0 2 0\n0 0 0        0 0 0\n```\n\n## 2. What it really means\n\"Distance to the **nearest** of many land cells\" is a **multi-source BFS**: put every land cell in the queue at distance 0 at the same time. The BFS then reaches each water cell first from its closest land cell, so its distance is correct. Stop expanding from cells at distance k.\n\n```text\ndistance from the land cell (k = 2):     filled = distance 1..2\n2 1 2                                    2 2 2\n1 0 1                                    2 1 2\n2 1 2                                    2 2 2\n3 2 3                                    0 2 0      distance 3 > k stays water\n4 3 4                                    0 0 0\n```\n\n:::hint Hint 1\nRunning one BFS per land cell could mean 10⁶ BFS runs over 10⁶ cells. How can a single BFS find the distance to the **nearest** land cell for every cell at once?\n:::\n:::hint Hint 2\nPush all land cells into the queue with distance 0 before the loop starts. Pop a cell; if its distance is already k, do not expand it; otherwise mark each unvisited neighbour with distance + 1, set it to 2 and push it.\n:::\n\n## 3. What, why, how\n- **What:** one BFS from all land cells together, limited to k layers.\n- **Why one BFS is enough:** imagine an extra cell joined to every land cell; a BFS from it visits cells in order of distance to the nearest land. Pushing all land cells first is exactly the first layer of that BFS.\n- **Why passing over land does not matter:** the walk may cross land, but a path that crosses land is never the shortest to the nearest land (it reached land earlier). So expanding only into unvisited water cells gives the right distances.\n- **How:**\n  - Read the grid into `g`; `dist = −1` everywhere, 0 on land, and push land cells.\n  - Pop (r, c); if `dist == k` continue; for the 4 neighbours inside the grid with `dist == −1`: set dist + 1, `g = 2`, push.\n  - Print row by row, numbers separated by spaces, `'\\n'` at row ends.\n- **Cost:** every cell is pushed at most once: O(R · C) = 10⁶. The output is 2 × 10⁶ characters, so use fast I/O as the PDF advises.\n\n## 4. Solution\n{{code}}\n{{tests}}\n\n**Trace**: sample 1 (rows and columns from 0; land at (1, 1)).\n\n| layer (distance) | cells reached in this layer | set to 2 |\n|---|---|---|\n| 0 | (1,1) | land, unchanged |\n| 1 | (0,1) (2,1) (1,0) (1,2) | yes |\n| 2 | (0,0) (0,2) (2,0) (2,2) (3,1) | yes |\n| 3 | not expanded: layer 2 cells have dist = k | |\n\nThe 9 cells set to 2 match the expected output.\n\n## 5. Traps\n- **One BFS per land cell:** correct but up to 10⁶ × 10⁶ work.\n- **Diagonal moves:** the statement allows only up, down, left and right. With 8 directions sample 1 would fill (3,0) and (3,2) too.\n- **Marking the cell as 2 when it is popped** instead of when it is pushed: fine for correctness if done carefully, but pushing a cell twice wastes memory; mark when pushing.\n- **k larger than the grid:** k can be 2,000 > R + C; the BFS simply runs out of cells. Do not allocate anything of size k.\n- **`endl` per row or per number:** 10⁶ numbers; use `'\\n'` and turn off sync.\n- **No land at all:** nothing is pushed, the map is printed unchanged.\n\n## 6. Background\nLesson 16. Multi-source BFS computes a **distance transform**: the distance of every cell to the nearest source. It appears in [Pandemic](#a62_q2a_pandemic) (infection spreading from many cities) and in [Sea bridge](#da66_f1_sea_bridge) (distance from one island). With weights it becomes multi-source Dijkstra; see [Shortest start](#a64_q3_shortest_start) for the same idea with negative edges.", "th": "## 1. โจทย์บอกอะไร\nแผนที่เป็นตาราง R × C (1 ≤ R, C ≤ 1,000): 1 คือพื้นดิน 0 คือน้ำ **ระยะห่างจากพื้นดิน** ของช่องน้ำคือจำนวนก้าวน้อยที่สุด (บน ล่าง ซ้าย หรือขวา และต้องอยู่ในตาราง) ที่เดินไปถึงช่องดินใดก็ได้ ทุกช่องน้ำที่ระยะ **ไม่เกิน k** (1 ≤ k ≤ 2,000) จะถูกถม ให้พิมพ์แผนที่โดยแสดงช่องที่ถูกถมเป็น **2** ในรูปแบบเดียวกับ input (ตัวเลขคั่นด้วยช่องว่าง)\n\nตัวอย่างที่ 1: แผนที่ 5 × 3 มีดินช่องเดียวตรงกลางแถวที่ 2 และ k = 2:\n\n```text\ninput        output\n0 0 0        2 2 2\n0 1 0        2 1 2\n0 0 0        2 2 2\n0 0 0        0 2 0\n0 0 0        0 0 0\n```\n\n## 2. จริง ๆ แล้วถามอะไร\n\"ระยะไปยังช่องดินที่ **ใกล้ที่สุด** จากหลายช่อง\" คือ **BFS หลายจุดเริ่ม**: ใส่ทุกช่องดินลงคิวที่ระยะ 0 พร้อมกัน BFS จะไปถึงช่องน้ำแต่ละช่องจากช่องดินที่ใกล้ที่สุดก่อนเสมอ ระยะจึงถูกต้อง แล้วหยุดขยายจากช่องที่ระยะ k\n\n```text\ndistance from the land cell (k = 2):     filled = distance 1..2\n2 1 2                                    2 2 2\n1 0 1                                    2 1 2\n2 1 2                                    2 2 2\n3 2 3                                    0 2 0      distance 3 > k stays water\n4 3 4                                    0 0 0\n```\n\n:::hint คำใบ้ 1\nถ้ารัน BFS หนึ่งครั้งต่อช่องดิน อาจต้องรัน 10⁶ ครั้งบน 10⁶ ช่อง BFS ครั้งเดียวจะหาระยะไปยังช่องดินที่ **ใกล้ที่สุด** ให้ทุกช่องพร้อมกันได้อย่างไร\n:::\n:::hint คำใบ้ 2\nใส่ทุกช่องดินลงคิวด้วยระยะ 0 ก่อนเริ่มลูป ดึงช่องออกมา ถ้าระยะเท่ากับ k แล้วไม่ต้องขยาย ไม่อย่างนั้นให้เพื่อนบ้านที่ยังไม่เคยเยี่ยมมีระยะ + 1 ตั้งเป็น 2 แล้วใส่คิว\n:::\n\n## 3. อะไร ทำไม อย่างไร\n- **อะไร:** BFS ครั้งเดียวจากทุกช่องดินพร้อมกัน จำกัดไว้ k ชั้น\n- **ทำไม BFS ครั้งเดียวพอ:** นึกภาพช่องพิเศษหนึ่งช่องที่ต่อกับทุกช่องดิน BFS จากช่องนั้นเยี่ยมช่องต่าง ๆ ตามลำดับระยะไปยังดินที่ใกล้ที่สุด การใส่ทุกช่องดินลงคิวก่อนก็คือชั้นแรกของ BFS นั้นพอดี\n- **ทำไมการเดินผ่านดินไม่มีผล:** การเดินข้ามดินได้ แต่เส้นทางที่ข้ามดินไม่มีทางเป็นเส้นทางสั้นสุดไปยังดินที่ใกล้ที่สุด (มันถึงดินตั้งแต่ก่อนหน้านั้นแล้ว) การขยายเฉพาะไปยังช่องน้ำที่ยังไม่เยี่ยมจึงได้ระยะที่ถูกต้อง\n- **อย่างไร:**\n  - อ่านตารางลง `g` ตั้ง `dist = −1` ทุกช่อง 0 บนดิน และใส่ช่องดินลงคิว\n  - ดึง (r, c) ถ้า `dist == k` ให้ข้าม สำหรับเพื่อนบ้าน 4 ทิศที่อยู่ในตารางและ `dist == −1`: ตั้ง dist + 1, `g = 2` แล้วใส่คิว\n  - พิมพ์ทีละแถว ตัวเลขคั่นด้วยช่องว่าง ขึ้นบรรทัดด้วย `'\\n'`\n- **ต้นทุน:** ทุกช่องถูกใส่คิวไม่เกินครั้งเดียว: O(R · C) = 10⁶ output ยาว 2 × 10⁶ ตัวอักษร จึงใช้ I/O เร็วตามที่ PDF แนะนำ\n\n## 4. โค้ดเฉลย\n{{code}}\n{{tests}}\n\n**ไล่ค่า**: ตัวอย่างที่ 1 (แถวและคอลัมน์เริ่มที่ 0 ดินอยู่ที่ (1, 1))\n\n| ชั้น (ระยะ) | ช่องที่ไปถึงในชั้นนี้ | ตั้งเป็น 2 |\n|---|---|---|\n| 0 | (1,1) | ดิน ไม่เปลี่ยน |\n| 1 | (0,1) (2,1) (1,0) (1,2) | ใช่ |\n| 2 | (0,0) (0,2) (2,0) (2,2) (3,1) | ใช่ |\n| 3 | ไม่ขยาย: ช่องในชั้น 2 มี dist = k | |\n\nช่องที่เป็น 2 ทั้ง 9 ช่องตรงกับ output ที่ต้องการ\n\n## 5. จุดที่มักพลาด\n- **BFS หนึ่งครั้งต่อช่องดิน:** ถูกแต่งานอาจถึง 10⁶ × 10⁶\n- **เดินแนวทแยง:** โจทย์ให้เดินแค่บน ล่าง ซ้าย ขวา ถ้าใช้ 8 ทิศ ตัวอย่างที่ 1 จะถม (3,0) และ (3,2) ด้วย\n- **ตั้งเป็น 2 ตอนดึงออก** แทนตอนใส่คิว: ถ้าระวังก็ยังถูก แต่ช่องเดียวอาจถูกใส่คิวสองครั้งเปลืองหน่วยความจำ ให้ทำเครื่องหมายตอนใส่คิว\n- **k ใหญ่กว่าตาราง:** k อาจเป็น 2,000 > R + C BFS ก็แค่หมดช่องให้ไป อย่าสร้างอะไรที่มีขนาด k\n- **`endl` ทุกแถวหรือทุกตัวเลข:** มีตัวเลข 10⁶ ตัว ใช้ `'\\n'` และปิด sync\n- **ไม่มีดินเลย:** ไม่มีอะไรถูกใส่คิว แผนที่พิมพ์ออกมาเหมือนเดิม\n\n## 6. ความรู้พื้นฐาน\nบทที่ 16 BFS หลายจุดเริ่มคำนวณ **distance transform**: ระยะจากทุกช่องไปยังแหล่งที่ใกล้ที่สุด พบได้ในข้อ [Pandemic](#a62_q2a_pandemic) (โรคระบาดจากหลายเมือง) และ [Sea bridge](#da66_f1_sea_bridge) (ระยะจากเกาะหนึ่ง) ถ้ามีน้ำหนักก็กลายเป็น Dijkstra หลายจุดเริ่ม ดูข้อ [Shortest start](#a64_q3_shortest_start) สำหรับไอเดียเดียวกันกับเส้นติดลบ"}}, {"id": "da67_f_one_two_apart", "group": "final67", "lesson": "15 · DP with states (last two cells)", "stars": 2, "complexity": "O(27 · n)", "kind": "program", "tags": ["counting DP", "state = last two values", "mod 100000007", "forbidden patterns", "rolling array"], "title": {"en": "One two apart", "th": "หนึ่งกับสองต้องห่างกัน (One Two Apart)"}, "blurb": {"en": "Count arrays of length n ≤ 10⁶ over {0, 1, 2} in which every 1 is at least 3 positions from every 2 (no 1 and 2 at distance 1 or 2), mod 100,000,007. A counting DP whose state is the last two cells: 9 states, 27 transitions per step.", "th": "นับอาเรย์ยาว n ≤ 10⁶ ที่มีค่า {0, 1, 2} ซึ่ง 1 ทุกตัวห่างจาก 2 ทุกตัวอย่างน้อย 3 ตำแหน่ง (1 กับ 2 ห่างกัน 1 หรือ 2 ไม่ได้) mod 100,000,007 ใช้ DP นับที่ state คือสองช่องสุดท้าย: 9 state และ 27 ทางต่อหนึ่งขั้น"}, "tests": {"en": "all five PDF samples (1, 3, 15, 214, 545,782) and n = 2 (7, the arrays listed in the PDF); n = 1..12 against a Python brute force over all 3ⁿ arrays; n = 10⁶ in 0.07 s.", "th": "ตัวอย่างทั้งห้าชุดใน PDF (1, 3, 15, 214, 545,782) และ n = 2 (7 แบบตามที่ PDF แสดง); n = 1..12 เทียบกับ brute force ใน Python ที่ลองทุกอาเรย์ 3ⁿ แบบ; n = 10⁶ ใช้ 0.07 วินาที"}, "files": [{"name": "main.cpp", "src": "#include <iostream>\nusing namespace std;\n\nconst long long MOD = 100000007;\n\n// can the three cells x, y, z (in a row) sit next to each other?\n// a 1 and a 2 may not be at distance 1 or 2\nbool ok3(int x, int y, int z) {\n    auto clash = [](int a, int b) { return (a == 1 && b == 2) || (a == 2 && b == 1); };\n    return !clash(x, y) && !clash(y, z) && !clash(x, z);\n}\n\nint main() {\n    int n;\n    cin >> n;\n    if (n == 1) { cout << 3 << \"\\n\"; return 0; }\n    // f[x][y] = number of valid arrays of the current length whose last two cells are x, y\n    long long f[3][3];\n    // length 2: any pair except 1-2 and 2-1\n    for (int x = 0; x < 3; x++)\n        for (int y = 0; y < 3; y++)\n            f[x][y] = ok3(0, x, y) ? 1 : 0;   // a leading 0 changes nothing\n    // grow the array from length len-1 to len, for len = 3 .. n\n    for (int len = 3; len <= n; len++) {\n        long long g[3][3] = {};\n        // old last two cells x, y and the new cell z\n        for (int x = 0; x < 3; x++)\n            for (int y = 0; y < 3; y++)\n                for (int z = 0; z < 3; z++)\n                    if (ok3(x, y, z)) g[y][z] = (g[y][z] + f[x][y]) % MOD;\n        // copy the new row back\n        for (int y = 0; y < 3; y++)\n            for (int z = 0; z < 3; z++) f[y][z] = g[y][z];\n    }\n    long long total = 0;\n    // add up every ending\n    for (int x = 0; x < 3; x++)\n        for (int y = 0; y < 3; y++) total = (total + f[x][y]) % MOD;\n    cout << total << \"\\n\";\n}\n"}], "body": {"en": "## 1. What the problem says\nFill an array a of length n (1 ≤ n ≤ 1,000,000) with values 0, 1 or 2 so that **a 1 and a 2 are never 1 or 2 positions apart**: if a[i] = 1, then a[i−2], a[i−1], a[i+1], a[i+2] are not 2. Print the number of valid arrays **mod 100,000,007**.\n\nSamples: n = 1 → **3**; n = 3 → **15**; n = 15 → **198799**; n = 214 → **89208675**; n = 545782 → **8393098**. For n = 2 the PDF lists 7 arrays: 00 01 02 10 11 20 22.\n\n## 2. What it really means\nBuilding the array left to right, a new value z only conflicts with the **two previous** values x, y. So the number of ways to continue depends only on those two cells: they are the DP state.\n\n```text\n... x y | z       z may be appended if no pair among (x, z), (y, z) is {1, 2}\n                  (the pair (x, y) was already checked when y was added)\n\nf[x][y] = number of valid arrays of the current length ending with x, y\nnext:     g[y][z] += f[x][y]   for every x, y, z with (x,y,z) valid\n\n9 states (x, y), at most 27 moves per step, n steps\n```\n\n:::hint Hint 1\nWhen you write the array from left to right, which earlier cells can a new cell possibly conflict with? Make those cells the state.\n:::\n:::hint Hint 2\nLet f[x][y] count valid prefixes ending in x, y. For each next value z, add f[x][y] into g[y][z] when none of the pairs (x,y), (y,z), (x,z) is a 1 next to a 2. Start at length 2, repeat to length n, sum the 9 entries, take mod after every addition.\n:::\n\n## 3. What, why, how\n- **What:** a counting DP over positions with state (second-to-last value, last value).\n- **Why two cells are enough:** the rule only looks at distances 1 and 2. When z is placed at position i, the cells it must be checked against are i−1 and i−2, which are y and x. Anything earlier is at distance ≥ 3 and cannot conflict.\n- **How:**\n  - `ok3(x, y, z)`: true if none of (x,y), (y,z), (x,z) is {1,2}.\n  - n = 1 is a special case: 3.\n  - Length 2: f[x][y] = 1 if (x, y) is not {1,2}. (Using `ok3(0, x, y)` checks just that, since 0 conflicts with nothing.)\n  - For len = 3..n: g = 0; for all x, y, z with ok3: g[y][z] += f[x][y] (mod); f = g.\n  - Answer: the sum of f (mod).\n- **Cost:** 27 · n ≈ 2.7 × 10⁷ tiny steps for n = 10⁶; memory O(1).\n\n## 4. Solution\n{{code}}\n{{tests}}\n\n**Trace**: the table f[x][y] for lengths 2 to 5 (rows x, columns y; the entries (1,2) and (2,1) are always 0).\n\n| length | 00 | 01 | 02 | 10 | 11 | 20 | 22 | total |\n|---|---|---|---|---|---|---|---|---|\n| 2 | 1 | 1 | 1 | 1 | 1 | 1 | 1 | 7 |\n| 3 | 3 | 2 | 2 | 2 | 2 | 2 | 2 | **15** |\n| 4 | 7 | 5 | 5 | 4 | 4 | 4 | 4 | 33 |\n| 5 | 15 | 11 | 11 | 9 | 9 | 9 | 9 | 73 |\n\nFor example f[0][0] at length 3 is 3: the arrays 000, 100 and 200 (from 00, 10, 20; a 0 conflicts with nothing).\n\n## 5. Traps\n- **The modulus is 100,000,007**, not the usual 1,000,000,007. Copying the habit fails every big sample.\n- **State = only the last cell:** misses \"1 _ 2\" with a gap of one, which is also forbidden. Sample n = 3 would give 17 instead of 15 (1 0 2 and 2 0 1 sneak in).\n- **n = 1** must print 3; a loop that starts at length 2 and sums would print 7.\n- **Overflow:** keep every entry below the modulus; the sum of 3 entries of 10⁸ fits in `long long` easily.\n- **Storing all n rows:** 10⁶ × 9 numbers is fine (72 MB with `long long`), but two rows are enough.\n\n## 6. Background\nLesson 15. \"Strings that avoid a pattern within distance d\" are counted with a DP whose state is the last d symbols, which is a walk on a small automaton. The step is a fixed 9 × 9 matrix, so the count for n up to 10¹⁸ could be found with matrix fast power in O(9³ log n), the trick from [Matrix modulo](#a60_q1_matmod) and [Linear recurrence](#da66_f1_linear_recurrence).", "th": "## 1. โจทย์บอกอะไร\nเติมอาเรย์ a ยาว n (1 ≤ n ≤ 1,000,000) ด้วยค่า 0, 1 หรือ 2 โดย **1 กับ 2 ห้ามห่างกัน 1 หรือ 2 ตำแหน่ง**: ถ้า a[i] = 1 แล้ว a[i−2], a[i−1], a[i+1], a[i+2] ต้องไม่ใช่ 2 ให้พิมพ์จำนวนอาเรย์ที่ใช้ได้ **mod 100,000,007**\n\nตัวอย่าง: n = 1 → **3**; n = 3 → **15**; n = 15 → **198799**; n = 214 → **89208675**; n = 545782 → **8393098** สำหรับ n = 2 PDF แสดง 7 แบบ: 00 01 02 10 11 20 22\n\n## 2. จริง ๆ แล้วถามอะไร\nเมื่อสร้างอาเรย์จากซ้ายไปขวา ค่าใหม่ z ขัดกับแค่ **สองค่าก่อนหน้า** x, y เท่านั้น จำนวนวิธีที่จะต่อไปได้จึงขึ้นกับสองช่องนั้นอย่างเดียว ให้สองช่องนี้เป็น state ของ DP\n\n```text\n... x y | z       z may be appended if no pair among (x, z), (y, z) is {1, 2}\n                  (the pair (x, y) was already checked when y was added)\n\nf[x][y] = number of valid arrays of the current length ending with x, y\nnext:     g[y][z] += f[x][y]   for every x, y, z with (x,y,z) valid\n\n9 states (x, y), at most 27 moves per step, n steps\n```\n\n:::hint คำใบ้ 1\nเมื่อเขียนอาเรย์จากซ้ายไปขวา ช่องใหม่มีโอกาสขัดกับช่องก่อนหน้าช่องไหนบ้าง ให้ช่องพวกนั้นเป็น state\n:::\n:::hint คำใบ้ 2\nให้ f[x][y] นับ prefix ที่ใช้ได้และจบด้วย x, y สำหรับค่าถัดไป z ให้บวก f[x][y] เข้า g[y][z] เมื่อไม่มีคู่ไหนใน (x,y), (y,z), (x,z) เป็น 1 ติดกับ 2 เริ่มที่ความยาว 2 ทำซ้ำจนถึงความยาว n รวมทั้ง 9 ช่อง และ mod หลังทุกการบวก\n:::\n\n## 3. อะไร ทำไม อย่างไร\n- **อะไร:** DP นับจำนวนไล่ตามตำแหน่ง state คือ (ค่ารองสุดท้าย, ค่าสุดท้าย)\n- **ทำไมสองช่องพอ:** กฎดูแค่ระยะ 1 และ 2 เมื่อวาง z ที่ตำแหน่ง i ช่องที่ต้องเช็กคือ i−1 และ i−2 ซึ่งก็คือ y และ x ช่องที่ก่อนหน้านั้นห่าง ≥ 3 จึงขัดกันไม่ได้\n- **อย่างไร:**\n  - `ok3(x, y, z)`: จริงเมื่อไม่มีคู่ไหนใน (x,y), (y,z), (x,z) เป็น {1,2}\n  - n = 1 เป็นกรณีพิเศษ: 3\n  - ความยาว 2: f[x][y] = 1 ถ้า (x, y) ไม่ใช่ {1,2} (ใช้ `ok3(0, x, y)` เช็กแค่นั้นพอดี เพราะ 0 ไม่ขัดกับอะไร)\n  - สำหรับ len = 3..n: g = 0; สำหรับทุก x, y, z ที่ ok3: g[y][z] += f[x][y] (mod) แล้ว f = g\n  - คำตอบ: ผลรวมของ f (mod)\n- **ต้นทุน:** 27 · n ≈ 2.7 × 10⁷ ขั้นเล็ก ๆ เมื่อ n = 10⁶ หน่วยความจำ O(1)\n\n## 4. โค้ดเฉลย\n{{code}}\n{{tests}}\n\n**ไล่ค่า**: ตาราง f[x][y] สำหรับความยาว 2 ถึง 5 (ช่อง (1,2) และ (2,1) เป็น 0 เสมอ)\n\n| ความยาว | 00 | 01 | 02 | 10 | 11 | 20 | 22 | รวม |\n|---|---|---|---|---|---|---|---|---|\n| 2 | 1 | 1 | 1 | 1 | 1 | 1 | 1 | 7 |\n| 3 | 3 | 2 | 2 | 2 | 2 | 2 | 2 | **15** |\n| 4 | 7 | 5 | 5 | 4 | 4 | 4 | 4 | 33 |\n| 5 | 15 | 11 | 11 | 9 | 9 | 9 | 9 | 73 |\n\nเช่น f[0][0] ที่ความยาว 3 คือ 3: อาเรย์ 000, 100 และ 200 (มาจาก 00, 10, 20 และ 0 ไม่ขัดกับอะไร)\n\n## 5. จุดที่มักพลาด\n- **ตัว mod คือ 100,000,007** ไม่ใช่ 1,000,000,007 ที่คุ้นเคย ลอกตามความเคยชินจะผิดทุกตัวอย่างที่ใหญ่\n- **state = แค่ช่องสุดท้าย:** พลาดรูปแบบ \"1 _ 2\" ที่เว้นหนึ่งช่องซึ่งก็ห้ามเหมือนกัน n = 3 จะได้ 17 แทน 15 (1 0 2 และ 2 0 1 หลุดเข้ามา)\n- **n = 1** ต้องพิมพ์ 3 ลูปที่เริ่มที่ความยาว 2 แล้วรวมจะพิมพ์ 7\n- **ล้น:** เก็บทุกช่องให้น้อยกว่าตัว mod ผลรวม 3 ค่าขนาด 10⁸ ใส่ `long long` ได้สบาย\n- **เก็บทั้ง n แถว:** 10⁶ × 9 ตัวก็ไหว (72 MB ถ้าใช้ `long long`) แต่สองแถวก็พอ\n\n## 6. ความรู้พื้นฐาน\nบทที่ 15 \"สตริงที่หลีกเลี่ยงรูปแบบภายในระยะ d\" นับได้ด้วย DP ที่ state คือ d สัญลักษณ์สุดท้าย ซึ่งก็คือการเดินบน automaton ขนาดเล็ก แต่ละขั้นเป็นเมทริกซ์ 9 × 9 ที่ตายตัว ถ้า n ใหญ่ถึง 10¹⁸ ก็หาได้ด้วยการยกกำลังเมทริกซ์แบบเร็วใน O(9³ log n) ซึ่งเป็นเทคนิคจากข้อ [Matrix modulo](#a60_q1_matmod) และ [Linear recurrence](#da66_f1_linear_recurrence)"}}, {"id": "da67_f_travelling_tourist", "group": "final67", "lesson": "17 · Shortest paths: Dijkstra + 15 · bit-mask DP", "stars": 3, "complexity": "O(k · m log n + 2ᵏ · k²)", "kind": "program", "tags": ["Dijkstra from each site", "travelling salesman", "bit-mask DP", "k ≤ 8", "open path", "any start"], "title": {"en": "Travelling tourist", "th": "นักท่องเที่ยวนั่งรถไฟฟ้า (Travelling Tourist)"}, "blurb": {"en": "n ≤ 500 stations, two-way train lines with fares, and k ≤ 8 sites to visit; start anywhere, end anywhere. Run Dijkstra from each site to get the k × k table of cheapest fares, then solve a small travelling-salesman path over the k sites with a bit-mask DP (or all k! orders).", "th": "มีสถานี n ≤ 500 แห่ง รถไฟฟ้าวิ่งสองทางพร้อมค่าโดยสาร และสถานที่ท่องเที่ยว k ≤ 8 แห่ง เริ่มที่ไหนก็ได้และจบที่ไหนก็ได้ รัน Dijkstra จากแต่ละสถานที่เพื่อได้ตาราง k × k ของค่าโดยสารถูกสุด แล้วแก้ปัญหาพนักงานขายเดินทางแบบเส้นทางเล็ก ๆ บน k สถานที่ด้วย bit-mask DP (หรือลองทุกลำดับ k! แบบ)"}, "tests": {"en": "the four readable PDF samples (the fifth is cut off in the PDF text); 300 random connected graphs (n ≤ 7) against Floyd–Warshall plus every visiting order in Python; n = 500 complete graph (124,750 lines) with k = 8 in 0.02 s.", "th": "ตัวอย่างใน PDF สี่ชุดที่อ่านได้ (ชุดที่ห้าถูกตัดในข้อความของ PDF); สุ่มกราฟเชื่อมกัน 300 ชุด (n ≤ 7) เทียบกับ Floyd–Warshall บวกการลองทุกลำดับการเยี่ยมใน Python; กราฟสมบูรณ์ n = 500 (124,750 บรรทัด) กับ k = 8 ใช้ 0.02 วินาที"}, "files": [{"name": "main.cpp", "src": "#include <iostream>\n#include <vector>\n#include <queue>\n#include <algorithm>\nusing namespace std;\n\nconst long long INF = 1e18;\n\nint main() {\n    ios_base::sync_with_stdio(false); cin.tie(NULL);\n    int n, m, k;\n    cin >> n >> m >> k;\n    vector<int> s(k);\n    // the k stations Somchai wants to visit\n    for (int i = 0; i < k; i++) cin >> s[i];\n    vector<vector<pair<int, int>>> adj(n + 1);\n    // the m two-way train lines\n    for (int i = 0; i < m; i++) {\n        int a, b, c;\n        cin >> a >> b >> c;\n        adj[a].push_back({b, c});\n        adj[b].push_back({a, c});\n    }\n\n    // step 1: Dijkstra from each of the k sites -> D[i][j] = cheapest fare from site i to site j\n    vector<vector<long long>> D(k, vector<long long>(k));\n    for (int i = 0; i < k; i++) {\n        vector<long long> dist(n + 1, INF);\n        priority_queue<pair<long long, int>, vector<pair<long long, int>>, greater<>> pq;\n        dist[s[i]] = 0;\n        pq.push({0, s[i]});\n        // standard Dijkstra: take the closest unfinished station\n        while (!pq.empty()) {\n            auto [d, u] = pq.top(); pq.pop();\n            if (d > dist[u]) continue;        // an old, longer entry\n            // relax every line out of u\n            for (auto [v, c] : adj[u]) {\n                if (d + c < dist[v]) { dist[v] = d + c; pq.push({dist[v], v}); }\n            }\n        }\n        // keep only the distances to the other sites\n        for (int j = 0; j < k; j++) D[i][j] = dist[s[j]];\n    }\n\n    // step 2: bitmask DP over the k sites\n    // best[mask][last] = cheapest way to have visited exactly the sites in mask, standing at site last\n    int FULL = 1 << k;\n    vector<vector<long long>> best(FULL, vector<long long>(k, INF));\n    // start anywhere for free\n    for (int i = 0; i < k; i++) best[1 << i][i] = 0;\n    // masks in increasing order: a mask is finished before any bigger mask that contains it\n    for (int mask = 1; mask < FULL; mask++) {\n        // the site we are standing at\n        for (int last = 0; last < k; last++) {\n            if (!(mask >> last & 1) || best[mask][last] == INF) continue;\n            // go next to a site not visited yet\n            for (int nxt = 0; nxt < k; nxt++) {\n                if (mask >> nxt & 1) continue;\n                long long cand = best[mask][last] + D[last][nxt];\n                int nm = mask | (1 << nxt);\n                if (cand < best[nm][nxt]) best[nm][nxt] = cand;\n            }\n        }\n    }\n    long long ans = INF;\n    // the trip may end at any site\n    for (int last = 0; last < k; last++) ans = min(ans, best[FULL - 1][last]);\n    cout << ans << \"\\n\";\n}\n"}], "body": {"en": "## 1. What the problem says\nA country has n stations (2 ≤ n ≤ 500) and m train lines (n − 1 ≤ m ≤ n(n−1)/2). Each line runs both ways between two stations with fare c (1 ≤ c ≤ 1,000), and the network is connected. Somchai wants to visit k sites (2 ≤ k ≤ 8), each at a given station. He may start at any station and end anywhere. Passing through a site's station on the way does **not** count as visiting it; he visits the sites one after another, travelling from each to the next. Print the **smallest total fare**.\n\nInput: `n m k`, the k site stations, then m lines `a b c`.\n\nSample 1: sites 1, 2, 3 with lines 1–2 (15), 1–3 (4), 2–3 (7) → **11** (1 → 3 → 2: 4 + 7). Sample 2: sites 1..4 → **100** (4 → 3 → 2 → 1: 38 + 24 + 38).\n\n## 2. What it really means\nTwo layers. Between two consecutive sites he takes the **cheapest route**, whatever stations it passes; that is a shortest-path question. Then he must choose the **order** of the k sites so that the sum of those cheapest fares is smallest; that is a travelling-salesman path on only k ≤ 8 points.\n\n```text\nstep 1: shortest fares between the sites (sample 1)\n            1    2    3\n      1     0   11    4        1-2 directly costs 15, but 1-3-2 costs 4 + 7 = 11\n      2    11    0    7\n      3     4    7    0\n\nstep 2: best order of the k sites, start and end anywhere\n      1 → 3 → 2 = 4 + 7 = 11     2 → 3 → 1 = 7 + 4 = 11     1 → 2 → 3 = 11 + 7 = 18 …\nanswer 11\n```\n\nThe rule about passing through a site only says that a site counts once you **choose** it as the next stop; routing between stops is free to use any stations.\n\n:::hint Hint 1\nSplit the trip into legs from one site to the next. What is the cost of one leg, and how many different legs can there be?\n:::\n:::hint Hint 2\nRun Dijkstra from each of the k sites (k ≤ 8 runs) to fill a k × k table D. Then best[mask][last] = cheapest way to visit exactly the sites in mask ending at last, with best[{i}][i] = 0, and extend with D[last][next]. The answer is the minimum over last of best[all][last].\n:::\n\n## 3. What, why, how\n- **What:** k Dijkstra runs, then a bit-mask DP over subsets of sites.\n- **Why each leg is a shortest path:** the legs are independent: once the order is fixed, making one leg cheaper never hurts another.\n- **Why the order needs search:** a greedy \"go to the nearest unvisited site\" fails. In sample 2 starting at 1 it goes 1 → 2 (38) → 3 (24) → 4 (38) = 100, which happens to be optimal, but with other fares nearest-first can be far off. With k ≤ 8, trying every order (8! = 40,320) or the DP (2⁸ · 8 · 8 = 16,384 steps) is instant.\n- **How:**\n  - Dijkstra with a min-heap from `s[i]`; copy the distances to the other sites into `D[i][j]`.\n  - `best[1 << i][i] = 0`. For masks in increasing order, for `last` in the mask with a finite value, for `nxt` not in the mask: relax `best[mask | 1 << nxt][nxt]` with `best[mask][last] + D[last][nxt]`.\n  - Answer: min over `last` of `best[FULL − 1][last]`.\n- **Why masks in increasing order work:** adding a site makes the mask a larger number, so every state is final before it is extended.\n- **Cost:** k · O(m log n) ≈ 8 · 125,000 · 9 for Dijkstra, and 2ᵏ · k² for the DP. Measured 0.02 s on the complete 500-station graph.\n\n## 4. Solution\n{{code}}\n{{tests}}\n\n**Trace**: sample 1, sites 1, 2, 3 (D from step 1). Entries are best[mask][last].\n\n| mask (sites visited) | last = 1 | last = 2 | last = 3 |\n|---|---|---|---|\n| {1} | 0 | | |\n| {2} | | 0 | |\n| {3} | | | 0 |\n| {1,2} | 11 (2 → 1) | 11 (1 → 2) | |\n| {1,3} | 4 (3 → 1) | | 4 (1 → 3) |\n| {2,3} | | 7 (3 → 2) | 7 (2 → 3) |\n| {1,2,3} | min(7 + 4, 7 + 11) = 11 | min(4 + 7, 4 + 11) = 11 | min(11 + 4, 11 + 7) = 15 |\n\nAnswer = min(11, 11, 15) = **11**.\n\n## 5. Traps\n- **Using the direct line fare** between two sites instead of the shortest route: in sample 1 the leg 1 → 2 costs 15 on its own line but only 11 through station 3. Every order that contains that leg would be overpriced (2 → 1 → 3 would cost 19 instead of 15).\n- **Returning to the start:** the trip is a path, not a cycle. Adding D[last][first] at the end turns sample 1 into 22.\n- **Fixing the start** at the first site in the input: the best order may start elsewhere (sample 2 starts at 4).\n- **Floyd–Warshall on all n stations:** 500³ = 1.25 × 10⁸ is acceptable but slower than k Dijkstra runs; both are fine here.\n- **Dense input:** up to 124,750 lines, so turn off stdio sync.\n\n## 6. Background\nLessons 15 and 17. This \"shortest paths between a few key points, then a TSP over them\" pattern is how real route planners handle a handful of stops. The bit-mask DP (Held–Karp, 1962) solves the TSP in O(2ᵏ · k²), far better than k! for k around 15–20. Compare [Buffet flight](#da66_f1_buffet_flight) for another da66 exam problem that hides a shortest path inside a story.", "th": "## 1. โจทย์บอกอะไร\nประเทศหนึ่งมีสถานี n แห่ง (2 ≤ n ≤ 500) และรถไฟฟ้า m สาย (n − 1 ≤ m ≤ n(n−1)/2) แต่ละสายวิ่งสองทางระหว่างสองสถานีด้วยค่าโดยสาร c (1 ≤ c ≤ 1,000) และเครือข่ายเชื่อมถึงกันทั้งหมด สมชายอยากไปเที่ยว k แห่ง (2 ≤ k ≤ 8) แต่ละแห่งอยู่ที่สถานีที่กำหนด เขาเริ่มได้ที่สถานีไหนก็ได้และจบที่ไหนก็ได้ การนั่งผ่านสถานีของสถานที่เที่ยว **ไม่** นับว่าได้เที่ยว เขาไปเที่ยวทีละแห่งโดยเดินทางจากแห่งหนึ่งไปแห่งถัดไป ให้พิมพ์ **ค่าเดินทางรวมที่น้อยที่สุด**\n\ninput: `n m k` แล้วสถานีของสถานที่ทั้ง k แห่ง แล้วอีก m บรรทัด `a b c`\n\nตัวอย่างที่ 1: สถานที่ 1, 2, 3 สาย 1–2 (15), 1–3 (4), 2–3 (7) → **11** (1 → 3 → 2: 4 + 7) ตัวอย่างที่ 2: สถานที่ 1..4 → **100** (4 → 3 → 2 → 1: 38 + 24 + 38)\n\n## 2. จริง ๆ แล้วถามอะไร\nมีสองชั้น ระหว่างสถานที่สองแห่งที่ไปต่อกัน เขาใช้ **เส้นทางที่ถูกที่สุด** จะผ่านสถานีไหนก็ได้ นั่นคือคำถามเส้นทางสั้นสุด แล้วเขาต้องเลือก **ลำดับ** ของ k สถานที่ให้ผลรวมของค่าเดินทางเหล่านั้นน้อยที่สุด นั่นคือปัญหาพนักงานขายเดินทางแบบเส้นทางบนจุดแค่ k ≤ 8 จุด\n\n```text\nstep 1: shortest fares between the sites (sample 1)\n            1    2    3\n      1     0   11    4        1-2 directly costs 15, but 1-3-2 costs 4 + 7 = 11\n      2    11    0    7\n      3     4    7    0\n\nstep 2: best order of the k sites, start and end anywhere\n      1 → 3 → 2 = 4 + 7 = 11     2 → 3 → 1 = 7 + 4 = 11     1 → 2 → 3 = 11 + 7 = 18 …\nanswer 11\n```\n\nกฎเรื่องนั่งผ่านสถานที่แค่บอกว่าสถานที่จะนับก็ต่อเมื่อเรา **เลือก** มันเป็นจุดหมายถัดไป ส่วนเส้นทางระหว่างจุดหมายใช้สถานีไหนก็ได้\n\n:::hint คำใบ้ 1\nแบ่งการเดินทางเป็นช่วงจากสถานที่หนึ่งไปอีกที่หนึ่ง ค่าของหนึ่งช่วงคือเท่าไร และมีช่วงที่ต่างกันได้กี่แบบ\n:::\n:::hint คำใบ้ 2\nรัน Dijkstra จากสถานที่แต่ละแห่ง (k ≤ 8 ครั้ง) เพื่อเติมตาราง D ขนาด k × k แล้วให้ best[mask][last] = วิธีที่ถูกที่สุดในการเยี่ยมสถานที่ใน mask พอดีและจบที่ last โดย best[{i}][i] = 0 แล้วขยายด้วย D[last][next] คำตอบคือค่าน้อยสุดของ best[ทั้งหมด][last]\n:::\n\n## 3. อะไร ทำไม อย่างไร\n- **อะไร:** รัน Dijkstra k ครั้ง แล้วทำ bit-mask DP บนเซตย่อยของสถานที่\n- **ทำไมแต่ละช่วงคือเส้นทางสั้นสุด:** ช่วงต่าง ๆ เป็นอิสระต่อกัน เมื่อกำหนดลำดับแล้ว การทำให้ช่วงหนึ่งถูกลงไม่ทำให้ช่วงอื่นแย่ลง\n- **ทำไมลำดับต้องค้นหา:** greedy แบบ \"ไปสถานที่ที่ยังไม่ไปและใกล้ที่สุด\" ใช้ไม่ได้ทั่วไป ในตัวอย่างที่ 2 ถ้าเริ่มที่ 1 จะได้ 1 → 2 (38) → 3 (24) → 4 (38) = 100 ซึ่งบังเอิญดีที่สุด แต่กับค่าโดยสารอื่นอาจห่างไกลมาก เมื่อ k ≤ 8 การลองทุกลำดับ (8! = 40,320) หรือ DP (2⁸ · 8 · 8 = 16,384 ขั้น) ทำได้ทันที\n- **อย่างไร:**\n  - Dijkstra ด้วย min-heap จาก `s[i]` แล้วคัดลอกระยะไปยังสถานที่อื่นลง `D[i][j]`\n  - `best[1 << i][i] = 0` ไล่ mask จากน้อยไปมาก สำหรับ `last` ใน mask ที่มีค่าจำกัด และ `nxt` ที่ไม่อยู่ใน mask: relax `best[mask | 1 << nxt][nxt]` ด้วย `best[mask][last] + D[last][nxt]`\n  - คำตอบ: ค่าน้อยสุดของ `best[FULL − 1][last]` บนทุก `last`\n- **ทำไมไล่ mask จากน้อยไปมากได้:** การเพิ่มสถานที่ทำให้ mask เป็นตัวเลขที่มากขึ้น ทุก state จึงเสร็จก่อนถูกนำไปขยาย\n- **ต้นทุน:** k · O(m log n) ≈ 8 · 125,000 · 9 สำหรับ Dijkstra และ 2ᵏ · k² สำหรับ DP วัดได้ 0.02 วินาทีบนกราฟสมบูรณ์ 500 สถานี\n\n## 4. โค้ดเฉลย\n{{code}}\n{{tests}}\n\n**ไล่ค่า**: ตัวอย่างที่ 1 สถานที่ 1, 2, 3 (D จากขั้นที่ 1) ค่าในตารางคือ best[mask][last]\n\n| mask (สถานที่ที่ไปแล้ว) | last = 1 | last = 2 | last = 3 |\n|---|---|---|---|\n| {1} | 0 | | |\n| {2} | | 0 | |\n| {3} | | | 0 |\n| {1,2} | 11 (2 → 1) | 11 (1 → 2) | |\n| {1,3} | 4 (3 → 1) | | 4 (1 → 3) |\n| {2,3} | | 7 (3 → 2) | 7 (2 → 3) |\n| {1,2,3} | min(7 + 4, 7 + 11) = 11 | min(4 + 7, 4 + 11) = 11 | min(11 + 4, 11 + 7) = 15 |\n\nคำตอบ = min(11, 11, 15) = **11**\n\n## 5. จุดที่มักพลาด\n- **ใช้ค่าโดยสารของสายตรง** ระหว่างสองสถานที่แทนเส้นทางที่ถูกที่สุด: ในตัวอย่างที่ 1 ช่วง 1 → 2 ถ้านั่งสายตรงเสีย 15 แต่ผ่านสถานี 3 เสียแค่ 11 ทุกลำดับที่มีช่วงนี้จะคิดราคาแพงเกินจริง (2 → 1 → 3 จะเป็น 19 แทน 15)\n- **กลับจุดเริ่ม:** การเดินทางเป็นเส้นทาง ไม่ใช่วง ถ้าบวก D[last][first] ตอนท้าย ตัวอย่างที่ 1 จะกลายเป็น 22\n- **ตรึงจุดเริ่ม** ไว้ที่สถานที่แรกใน input: ลำดับที่ดีที่สุดอาจเริ่มที่อื่น (ตัวอย่างที่ 2 เริ่มที่ 4)\n- **Floyd–Warshall บนทุกสถานี n แห่ง:** 500³ = 1.25 × 10⁸ ยังรับได้แต่ช้ากว่ารัน Dijkstra k ครั้ง ข้อนี้ใช้ได้ทั้งคู่\n- **input หนาแน่น:** มากถึง 124,750 บรรทัด จึงควรปิด sync ของ stdio\n\n## 6. ความรู้พื้นฐาน\nบทที่ 15 และ 17 รูปแบบ \"หาเส้นทางสั้นสุดระหว่างจุดสำคัญไม่กี่จุด แล้วทำ TSP บนจุดเหล่านั้น\" คือวิธีที่ระบบวางแผนเส้นทางจริงใช้กับจุดแวะไม่กี่จุด bit-mask DP (Held–Karp, 1962) แก้ TSP ใน O(2ᵏ · k²) ดีกว่า k! มากเมื่อ k ประมาณ 15–20 เทียบกับข้อ [Buffet flight](#da66_f1_buffet_flight) ข้อสอบ da66 อีกข้อที่ซ่อนเส้นทางสั้นสุดไว้ในเรื่องเล่า"}}, {"id": "da68_f_abcd_permutation", "group": "final68", "lesson": "11 · Recursion & backtracking", "stars": 1, "complexity": "O(4ᴺ · N) at most", "kind": "program", "tags": ["backtracking", "strings with limited letters", "lexicographic order", "count first", "output buffer"], "title": {"en": "ABCD permutation", "th": "เรียงสับเปลี่ยน ABCD (ABCD Permutation)"}, "blurb": {"en": "The da67 ABC permutation with a fourth letter: every string of length N ≤ 9 with at most a A's, b B's, c C's and d D's, count first, then the strings in dictionary order. Same backtracking, a loop over four letters.", "th": "ข้อ ABC permutation ของ da67 ที่เพิ่มตัวอักษรที่สี่: ทุกสตริงยาว N ≤ 9 ที่มี A ไม่เกิน a ตัว B ไม่เกิน b ตัว C ไม่เกิน c ตัว D ไม่เกิน d ตัว พิมพ์จำนวนก่อน แล้วสตริงเรียงตามพจนานุกรม backtracking แบบเดิม แค่วนสี่ตัวอักษร"}, "tests": {"en": "all three PDF samples; 300 random inputs (N ≤ 5) against a Python filter over all 4ᴺ strings; N = 9 with no limits (262,144 lines) in under 0.01 s.", "th": "ตัวอย่างทั้งสามชุดใน PDF; สุ่ม 300 ชุด (N ≤ 5) เทียบกับการกรองทุกสตริง 4ᴺ แบบใน Python; N = 9 ไม่จำกัดตัวอักษร (262,144 บรรทัด) ใช้ไม่ถึง 0.01 วินาที"}, "files": [{"name": "main.cpp", "src": "#include <iostream>\n#include <string>\nusing namespace std;\n\nint N;\nint left_[4];                // how many more A, B, C, D we may still use\nstring cur, out;             // out collects every answer line, so the count can be printed first\nlong long P = 0;\n\n// fill positions pos, pos+1, ..., N-1\nvoid gen(int pos) {\n    if (pos == N) { out += cur; out += '\\n'; P++; return; }\n    // letters in alphabetical order: A, B, C, D -> answers come out in dictionary order\n    for (int c = 0; c < 4; c++) {\n        if (left_[c] == 0) continue;          // this letter is used up\n        left_[c]--;\n        cur[pos] = 'A' + c;\n        gen(pos + 1);\n        left_[c]++;                           // undo\n    }\n}\n\nint main() {\n    ios_base::sync_with_stdio(false);\n    cin >> N >> left_[0] >> left_[1] >> left_[2] >> left_[3];\n    cur.assign(N, ' ');\n    gen(0);\n    cout << P << \"\\n\" << out;\n}\n"}], "body": {"en": "## 1. What the problem says\nPrint every string of length N (1 ≤ N ≤ 9) over the letters A, B, C, D that uses **at most** a A's, b B's, c C's and d D's (0 ≤ a, b, c, d ≤ N). First the count P, then the P strings in dictionary order. As in the da67 version, a correct count alone earns 40 % of a test.\n\nInput: one line `N a b c d`.\n\nSamples: `2 2 2 1 0` → 8 (AA AB AC BA BB BC CA CB: no D, and CC is missing because c = 1); `5 3 0 2 0` → 10; `4 1 1 1 1` → 24 (all permutations of ABCD).\n\n## 2. What it really means\nExactly [ABC permutation](#da67_f_abc_permutation) with one more letter. Fill positions left to right, try A, B, C, D in that order while copies are left; the output is automatically sorted.\n\n```text\nN = 2, at most A:2 B:2 C:1 D:0\n\n          A            B            C (C left 0)\n        / | \\        / | \\         / \\\n      AA  AB  AC   BA  BB  BC    CA   CB          CC: no C left,  _D: no D at all\ncount 8\n```\n\n:::hint Hint 1\nReuse the three-letter recursion. What changes when there are four letters?\n:::\n:::hint Hint 2\nOnly the loop bound: `for (c = 0; c < 4; c++)` with `left[4]`. Buffer the lines, print the count, then the buffer.\n:::\n\n## 3. What, why, how\n- **What:** backtracking over positions with `left[0..3]`, letters tried in alphabetical order.\n- **Why sorted:** same argument as before; the first differing position decides, and smaller letters are explored first.\n- **How:** identical to the da67 solution; `cur[pos] = 'A' + c`; at pos = N append `cur` and `'\\n'` to `out` and count.\n- **Size:** at most 4⁹ = 262,144 lines of 10 bytes, 2.6 MB.\n- **Cost:** O(P · N).\n\n## 4. Solution\n{{code}}\n{{tests}}\n\n**Trace**: sample 1, `2 2 2 1 0` (left shown as A/B/C/D).\n\n| first letter | left after it | second letters tried | strings |\n|---|---|---|---|\n| A | 1/2/1/0 | A, B, C (D: none) | AA, AB, AC |\n| B | 2/1/1/0 | A, B, C | BA, BB, BC |\n| C | 2/2/0/0 | A, B (C, D: none) | CA, CB |\n| D | | none left | |\n\nP = **8**.\n\n## 5. Traps\n- **Using next_permutation** on a fixed multiset: works only when the limits add up to exactly N; sample 1 (limits add up to 5, N = 2) needs strings with different letter counts.\n- **Printing in the wrong order** (for example generating by letter counts first): the order must be pure dictionary order.\n- **Forgetting the count line** or printing it last.\n- **`endl` per line:** 262,144 flushes; use `'\\n'` and one big write.\n\n## 6. Background\nLesson 11. Exams reuse problems with small twists; recognising \"this is last year's ABC with four letters\" saves most of the time. If the alphabet grew to 26 letters, the same code with a loop of 26 works; only the output size limits N.", "th": "## 1. โจทย์บอกอะไร\nพิมพ์ทุกสตริงยาว N (1 ≤ N ≤ 9) บนตัวอักษร A, B, C, D ที่ใช้ A **ไม่เกิน** a ตัว B ไม่เกิน b ตัว C ไม่เกิน c ตัว และ D ไม่เกิน d ตัว (0 ≤ a, b, c, d ≤ N) พิมพ์จำนวน P ก่อน แล้วสตริงทั้ง P ตัวเรียงตามพจนานุกรม เหมือนเวอร์ชัน da67 ที่ถ้าจำนวนถูกอย่างเดียวได้ 40 % ของชุดทดสอบ\n\ninput: หนึ่งบรรทัด `N a b c d`\n\nตัวอย่าง: `2 2 2 1 0` → 8 (AA AB AC BA BB BC CA CB: ไม่มี D และไม่มี CC เพราะ c = 1); `5 3 0 2 0` → 10; `4 1 1 1 1` → 24 (ทุก permutation ของ ABCD)\n\n## 2. จริง ๆ แล้วถามอะไร\nเหมือนข้อ [ABC permutation](#da67_f_abc_permutation) ทุกอย่าง แค่มีตัวอักษรเพิ่มอีกตัว เติมตำแหน่งจากซ้ายไปขวา ลอง A, B, C, D ตามลำดับตราบใดที่ยังเหลือ output จะเรียงเอง\n\n```text\nN = 2, at most A:2 B:2 C:1 D:0\n\n          A            B            C (C left 0)\n        / | \\        / | \\         / \\\n      AA  AB  AC   BA  BB  BC    CA   CB          CC: no C left,  _D: no D at all\ncount 8\n```\n\n:::hint คำใบ้ 1\nใช้ recursion แบบสามตัวอักษรซ้ำ มีอะไรเปลี่ยนเมื่อมีสี่ตัวอักษร\n:::\n:::hint คำใบ้ 2\nมีแค่ขอบของลูป: `for (c = 0; c < 4; c++)` กับ `left[4]` เก็บบรรทัดไว้ใน buffer พิมพ์จำนวน แล้วค่อยพิมพ์ buffer\n:::\n\n## 3. อะไร ทำไม อย่างไร\n- **อะไร:** backtracking ไล่ตำแหน่งพร้อม `left[0..3]` ลองตัวอักษรตามลำดับ\n- **ทำไมเรียงแล้ว:** เหตุผลเดิม ตำแหน่งแรกที่ต่างกันเป็นตัวตัดสิน และตัวอักษรที่เล็กกว่าถูกสำรวจก่อน\n- **อย่างไร:** เหมือนเฉลยของ da67 ทุกอย่าง `cur[pos] = 'A' + c` เมื่อ pos = N ต่อ `cur` และ `'\\n'` เข้า `out` แล้วนับ\n- **ขนาด:** มากสุด 4⁹ = 262,144 บรรทัด บรรทัดละ 10 ไบต์ 2.6 MB\n- **ต้นทุน:** O(P · N)\n\n## 4. โค้ดเฉลย\n{{code}}\n{{tests}}\n\n**ไล่ค่า**: ตัวอย่างที่ 1 `2 2 2 1 0` (left แสดงเป็น A/B/C/D)\n\n| ตัวแรก | left หลังใช้ | ตัวที่สองที่ลอง | สตริง |\n|---|---|---|---|\n| A | 1/2/1/0 | A, B, C (D: ไม่มี) | AA, AB, AC |\n| B | 2/1/1/0 | A, B, C | BA, BB, BC |\n| C | 2/2/0/0 | A, B (C, D: ไม่เหลือ) | CA, CB |\n| D | | ไม่เหลือ | |\n\nP = **8**\n\n## 5. จุดที่มักพลาด\n- **ใช้ next_permutation** กับ multiset ที่ตายตัว: ใช้ได้เฉพาะเมื่อขอบบนรวมกันได้ N พอดี ตัวอย่างที่ 1 (ขอบบนรวมได้ 5, N = 2) ต้องการสตริงที่จำนวนตัวอักษรต่างกัน\n- **พิมพ์ผิดลำดับ** (เช่น สร้างตามจำนวนตัวอักษรก่อน): ลำดับต้องเป็นลำดับพจนานุกรมล้วน ๆ\n- **ลืมบรรทัดจำนวน** หรือพิมพ์ไว้ท้ายสุด\n- **`endl` ทุกบรรทัด:** flush 262,144 ครั้ง ใช้ `'\\n'` และเขียนก้อนใหญ่ครั้งเดียว\n\n## 6. ความรู้พื้นฐาน\nบทที่ 11 ข้อสอบมักนำโจทย์เก่ามาดัดแปลงเล็กน้อย การมองออกว่า \"นี่คือ ABC ของปีที่แล้วที่มีสี่ตัวอักษร\" ช่วยประหยัดเวลาได้เกือบทั้งหมด ถ้าตัวอักษรเพิ่มเป็น 26 ตัว โค้ดเดิมที่วน 26 รอบก็ใช้ได้ มีแค่ขนาดของ output ที่จำกัด N"}}, {"id": "da68_f_hidden_palindrome", "group": "final68", "lesson": "15 · DP with states (intervals)", "stars": 2, "complexity": "O(N²) time, O(N) memory", "kind": "program", "tags": ["longest palindromic subsequence", "interval DP", "two rolling rows", "LCS with the reverse"], "title": {"en": "Hidden palindrome", "th": "พาลินโดรมที่ซ่อนอยู่ (Hidden Palindrome)"}, "blurb": {"en": "The longest palindromic subsequence of a string of length N ≤ 3000. Interval DP: L[i][j] is 2 + L[i+1][j−1] when s[i] = s[j], else the larger of L[i+1][j] and L[i][j−1]. Fill i from right to left, keeping only two rows.", "th": "ลำดับย่อยที่เป็นพาลินโดรมยาวที่สุดของสตริงยาว N ≤ 3000 ใช้ interval DP: L[i][j] เป็น 2 + L[i+1][j−1] เมื่อ s[i] = s[j] ไม่อย่างนั้นเอาค่ามากกว่าระหว่าง L[i+1][j] และ L[i][j−1] เติม i จากขวาไปซ้ายโดยเก็บแค่สองแถว"}, "tests": {"en": "all three PDF samples and \"ab\" (1); 300 random strings (N ≤ 12, alphabets of 1–3 letters) against a Python brute force over all 2ᴺ subsequences; N = 3,000 in under 0.01 s.", "th": "ตัวอย่างทั้งสามชุดใน PDF และ \"ab\" (1); สุ่มสตริง 300 ชุด (N ≤ 12 ใช้ตัวอักษร 1–3 แบบ) เทียบกับ brute force ใน Python ที่ลองทุกลำดับย่อย 2ᴺ แบบ; N = 3,000 ใช้ไม่ถึง 0.01 วินาที"}, "files": [{"name": "main.cpp", "src": "#include <iostream>\n#include <string>\n#include <vector>\n#include <algorithm>\nusing namespace std;\n\nint main() {\n    int n;\n    string s;\n    cin >> n >> s;\n    // L[i][j] = longest palindromic subsequence of s[i..j]\n    // only rows i and i+1 are needed, so keep two rows: cur = row i, nxt = row i+1\n    vector<int> cur(n, 0), nxt(n, 0);\n    // i from right to left, because row i is built from row i+1 (int: counting down)\n    for (int i = n - 1; i >= 0; i--) {\n        cur[i] = 1;                           // one letter is a palindrome\n        // j from left to right, because L[i][j] also uses L[i][j-1]\n        for (int j = i + 1; j < n; j++) {\n            if (s[i] == s[j]) cur[j] = (j == i + 1 ? 0 : nxt[j - 1]) + 2;   // wrap the inside with s[i], s[j]\n            else cur[j] = max(nxt[j], cur[j - 1]);                         // drop s[i] or drop s[j]\n        }\n        swap(cur, nxt);                       // row i becomes \"the row below\" for i-1\n    }\n    cout << nxt[n - 1] << \"\\n\";\n}\n"}], "body": {"en": "## 1. What the problem says\nN sheep (1 ≤ N ≤ 3,000) stand in a row, each showing one lowercase letter. Choose some of them **keeping their order** (a subsequence) so that the letters read the same forwards and backwards (a palindrome). Print the **length of the longest** such palindrome.\n\nInput: N, then the string of N letters.\n\nSamples: `a` → **1**; `abvba` → **5** (the whole string); `abcab` → **3** (for example `aba` or `bcb`).\n\n## 2. What it really means\nThis is the **longest palindromic subsequence** (LPS). Look at the two ends of a range s[i..j]:\n\n```text\ns[i] ... s[j]\n\nequal ends:      a [ b c ] a      both ends can be the outer pair of the palindrome\n                 L[i][j] = L[i+1][j-1] + 2\n\ndifferent ends:  a [ b c a ] b    they cannot both be used: drop one of them\n                 L[i][j] = max(L[i+1][j], L[i][j-1])\n\nbase: L[i][i] = 1 (a single letter), and an empty range has 0\n```\n\n:::hint Hint 1\nDefine the answer on a range: the longest palindromic subsequence inside s[i..j]. What happens with the first and last letters of that range?\n:::\n:::hint Hint 2\nIf s[i] = s[j], wrap the best palindrome of s[i+1..j−1] with them (+2). Otherwise take the better of s[i+1..j] and s[i..j−1]. Row i needs row i + 1, so fill i from N−1 down to 0 and j from i upward; two rows of N numbers are enough.\n:::\n\n## 3. What, why, how\n- **What:** interval DP on L[i][j], answer L[0][N−1], with two rolling rows.\n- **Why equal ends are always used:** take a longest palindrome P inside s[i..j] with at least 2 letters. Replace its first letter by s[i] and its last letter by s[j]. The positions are still in order, the two new end letters are equal, and the middle is unchanged, so it is still a palindrome of the same length, and it uses both ends. (If P has fewer than 2 letters, s[i] s[j] alone is longer.)\n- **Why the max is right for unequal ends:** a palindrome's first and last letters
