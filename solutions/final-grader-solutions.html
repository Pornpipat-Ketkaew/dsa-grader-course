ี่ต้องการโดยเรียงทางเลือกให้ถูก** ถ้ามีแค่ขวา/ลง (ชุดทดสอบ 25%) การนับจำนวนใช้ DP ได้ แต่เมื่อมีการเดินขึ้นและห้ามซ้ำช่อง การแจกแจงด้วย DFS คือเครื่องมือที่เหมาะ ถ้าถาม \"เส้นทางสั้นที่สุด\" แทน \"ทุกเส้นทาง\" ให้ใช้ BFS (บทที่ 16 ดูข้อ Dungeon) ข้อนี้อยู่ในบทเตรียมสอบปลายภาค แต่เทคนิคมาจาก [บท brute force](#ch-brute) ดู [Generate barcode](#ex00e4) และ [Consecutive ones](#ex00e5) สำหรับเส้นทางสั้นสุดบนตารางดู [Pandemic](#a62_q2a_pandemic) และ [Sea bridge](#da66_f1_sea_bridge)"}}, {"id": "da66_f1_buffet_flight", "group": "final", "lesson": "17 · Shortest paths: Dijkstra (dense)", "stars": 3, "complexity": "O(n² + m)", "kind": "program", "tags": ["Dijkstra O(n²)", "edge cost from vertex fees", "adjacency matrix", "fast input", "-1 unreachable"], "title": {"en": "Buffet flight", "th": "บินบุฟเฟต์ (Buffet Flight)"}, "blurb": {"en": "Flights are free but each one charges a take-off fee at the start airport and a landing fee at the end. Cheapest cost from airport 0 to every airport: Dijkstra where flight a → b weighs co[a] + ci[b].", "th": "บินฟรี แต่ทุกเที่ยวเสียค่าบินออกที่สนามบินต้นทางและค่าลงจอดที่ปลายทาง หาค่าใช้จ่ายน้อยสุดจากสนามบิน 0 ไปทุกสนามบิน: Dijkstra ที่เที่ยวบิน a → b หนัก co[a] + ci[b]"}, "tests": {"en": "all 3 PDF samples and a single airport; 300 random directed graphs (n ≤ 8) against Floyd–Warshall in Python; n = 2,000 with all n² − n = 3,998,000 flights (the largest input, about 40 MB) in 0.11 s.", "th": "ตัวอย่างทั้ง 3 ชุดใน PDF และสนามบินเดียว; สุ่มกราฟมีทิศ 300 ชุด (n ≤ 8) เทียบกับ Floyd–Warshall ใน Python; n = 2,000 ที่มีเที่ยวบินครบ n² − n = 3,998,000 เที่ยว (input ใหญ่สุด ราว 40 MB) ใช้ 0.11 วินาที"}, "files": [{"name": "main.cpp", "src": "#include <cstdio>\n#include <vector>\nusing namespace std;\n\n// Up to n*n - n ~ 4,000,000 flights = 8,000,000 numbers: read them fast.\nstatic char buf[1 << 16];\nint bufLen = 0, bufPos = 0;\nint readChar() {\n    if (bufPos == bufLen) { bufLen = fread(buf, 1, sizeof(buf), stdin); bufPos = 0; if (bufLen <= 0) return -1; }\n    return buf[bufPos++];\n}\nint readInt() {\n    int c = readChar();\n    while (c < '0' || c > '9') c = readChar();\n    int x = 0;\n    while (c >= '0' && c <= '9') { x = x * 10 + (c - '0'); c = readChar(); }\n    return x;\n}\n\nint main() {\n    int n = readInt(), m = readInt();\n    vector<int> ci(n), co(n);\n    for (int i = 0; i < n; i++) ci[i] = readInt();    // landing fees\n    for (int i = 0; i < n; i++) co[i] = readInt();    // take-off fees\n    // flight[a][b] = true if there is a flight a -> b (matrix: the graph can be dense)\n    vector<vector<char>> flight(n, vector<char>(n, 0));\n    for (int i = 0; i < m; i++) {\n        int a = readInt(), b = readInt();\n        flight[a][b] = 1;\n    }\n    // A flight a -> b costs co[a] + ci[b]. All costs are positive -> Dijkstra.\n    // The graph may have ~n^2 edges, so use the O(n^2) array version (no heap).\n    const long long INF = 1e18;\n    vector<long long> dist(n, INF);\n    vector<bool> done(n, false);\n    dist[0] = 0;\n    // n rounds: finalise the cheapest airport not finalised yet\n    for (int round = 0; round < n; round++) {\n        int u = -1;\n        for (int v = 0; v < n; v++)\n            if (!done[v] && dist[v] < INF && (u == -1 || dist[v] < dist[u])) u = v;\n        if (u == -1) break;                               // the rest is unreachable\n        done[u] = true;\n        // relax every flight u -> v\n        for (int v = 0; v < n; v++)\n            if (flight[u][v] && dist[u] + co[u] + ci[v] < dist[v]) dist[v] = dist[u] + co[u] + ci[v];\n    }\n    // airports 0 .. n-1, -1 for unreachable\n    for (int v = 0; v < n; v++) printf(v ? \" %lld\" : \"%lld\", dist[v] == INF ? -1LL : dist[v]);\n    printf(\"\\n\");\n}\n"}], "body": {"en": "## 1. What the problem says\nThere are n airports (n ≤ 2,000) and m one-way flights (m ≤ n² − n). Flying is free, but a flight a → b charges **co[a]** (take-off at a) plus **ci[b]** (landing at b), both 1..1,000. You start at airport 0. For every airport print the minimum total fee to get there, or **−1** if it cannot be reached.\n\nInput: `n m`; then **ci[0..n−1]** (landing); then **co[0..n−1]** (take-off); then m lines `a b`.\n\nSample 1: ci = 100 1 2 3, co = 10 20 30 40, flights 0→1→2→3 → `0 11 33 66`.\n\n> The PDF's comment for sample 1 writes \"co[0] + ci[1] = 1 + 10\", with the two numbers swapped; by the input order, co[0] = 10 and ci[1] = 1. The total 11 is the same.\n\n## 2. What it really means\nGive the flight a → b the weight **co[a] + ci[b]**. Then a trip's cost is the sum of its flights' weights, and we want single-source shortest paths with **positive** weights: **Dijkstra**.\n\n```text\nsample 3 (ci = 5 7 3 4 8, co = 1 4 4 2 6)\n\n  0 ─(1+4=5)─▶ 3          dist: 0 → 0\n  0 ─(1+8=9)─▶ 4                3 → 5\n  0 ─(1+7=8)─▶ 1                1 → 8\n  1 ─(4+3=7)─▶ 2                4 → 9\n                                2 → 8 + 7 = 15\n```\n\n:::hint Hint 1\nTurn the two fees into one weight per flight. What kind of shortest-path problem is left?\n:::\n:::hint Hint 2\nm can be about 4,000,000, nearly n². Which version of Dijkstra suits a graph that dense, and how do you read 8 million numbers fast?\n:::\n\n## 3. What, why, how\n- **What:** Dijkstra, O(n²) array version, on an adjacency matrix of flags.\n- **Why dense:** with m up to n² − n, the heap version is O(m log n) ≈ 4 × 10⁶ · 11, plus adjacency lists of 4 million ints (16 MB). The array version is O(n²) = 4 × 10⁶ steps and a `char` matrix of 4 MB.\n- **Why the weight trick is exact:** a route 0 → x → y pays co[0] + ci[x] + co[x] + ci[y], which is just (co[0] + ci[x]) + (co[x] + ci[y]): the sum of the two flight weights.\n- **How:** dist[0] = 0. n rounds: pick the unfinished airport u with the smallest finite dist (stop if none), mark it, and for every v with flight[u][v], relax with dist[u] + co[u] + ci[v]. Print −1 for ∞.\n- **Input size:** about 40 MB of text. The PDF suggests `sync_with_stdio(false)`; a small `fread` reader is faster still and is what the solution uses.\n\n## 4. Solution\n{{code}}\n{{tests}}\n\n**Trace**: sample 3, dist[0..4] after each round (· = finalised):\n\n| round | finalise | dist afterwards |\n|---|---|---|\n| 1 | 0 (0) | · 8 ∞ 5 9 |\n| 2 | 3 (5) | · 8 ∞ · 9 (3 → 4 would be 5 + 2 + 8 = 15) |\n| 3 | 1 (8) | · · 15 · 9 |\n| 4 | 4 (9) | · · 15 · · (4 → 1 would be 22, 4 → 3 would be 19) |\n| 5 | 2 (15) | done |\n\nOutput `0 8 15 5 9`.\n\n## 5. Traps\n- **Swapping ci and co:** the **first** fee line is ci (landing), the second is co (take-off).\n- **Charging fees per airport visited, not per flight:** each flight pays one take-off and one landing; an airport you pass through pays both its landing and its take-off.\n- **Charging airport 0's landing fee:** you start there; its answer is 0.\n- **Slow input:** 8 million numbers with plain `cin` takes about a second.\n- **Heap Dijkstra with adjacency lists:** works, but uses much more memory and time at m ≈ 4 × 10⁶.\n\n## 6. Background\nLesson 17. Costs that live on vertices can always be pushed onto edges (here: take-off on the start, landing on the end), as in [Columbia](#ex06e3_columbia) and [Hacking](#a58_q3_p3a_hacking). Dense graph → array Dijkstra, exactly as in [Farthest](#a61_q2_farthest).", "th": "## 1. โจทย์บอกอะไร\nมีสนามบิน n แห่ง (n ≤ 2,000) และเที่ยวบินทางเดียว m เที่ยว (m ≤ n² − n) บินฟรี แต่เที่ยวบิน a → b ต้องจ่าย **co[a]** (บินออกจาก a) บวก **ci[b]** (ลงจอดที่ b) ทั้งคู่อยู่ในช่วง 1..1,000 เราเริ่มที่สนามบิน 0 ให้พิมพ์ค่าใช้จ่ายรวมน้อยที่สุดไปถึงทุกสนามบิน หรือ **−1** ถ้าไปไม่ได้\n\ninput: `n m` แล้ว **ci[0..n−1]** (ลงจอด) แล้ว **co[0..n−1]** (บินออก) แล้ว m บรรทัด `a b`\n\nตัวอย่างที่ 1: ci = 100 1 2 3, co = 10 20 30 40 เที่ยวบิน 0→1→2→3 → `0 11 33 66`\n\n> คอมเมนต์ของตัวอย่างที่ 1 ใน PDF เขียน \"co[0] + ci[1] = 1 + 10\" ซึ่งสลับตัวเลขกัน ตามลำดับ input co[0] = 10 และ ci[1] = 1 ผลรวม 11 เท่ากัน\n\n## 2. จริง ๆ แล้วถามอะไร\nให้เที่ยวบิน a → b มีน้ำหนัก **co[a] + ci[b]** ค่าใช้จ่ายของการเดินทางก็คือผลรวมน้ำหนักของเที่ยวบิน และเราต้องการเส้นทางสั้นสุดจากจุดเดียวที่น้ำหนัก **เป็นบวก**: **Dijkstra**\n\n```text\nsample 3 (ci = 5 7 3 4 8, co = 1 4 4 2 6)\n\n  0 ─(1+4=5)─▶ 3          dist: 0 → 0\n  0 ─(1+8=9)─▶ 4                3 → 5\n  0 ─(1+7=8)─▶ 1                1 → 8\n  1 ─(4+3=7)─▶ 2                4 → 9\n                                2 → 8 + 7 = 15\n```\n\n:::hint คำใบ้ 1\nเปลี่ยนค่าธรรมเนียมสองอย่างให้เป็นน้ำหนักเดียวต่อเที่ยวบิน เหลือปัญหาเส้นทางสั้นสุดแบบไหน\n:::\n:::hint คำใบ้ 2\nm อาจราว 4,000,000 เกือบเท่า n² Dijkstra แบบไหนเหมาะกับกราฟที่หนาแน่นขนาดนั้น และจะอ่านตัวเลข 8 ล้านตัวให้เร็วได้อย่างไร\n:::\n\n## 3. อะไร ทำไม อย่างไร\n- **อะไร:** Dijkstra แบบอาร์เรย์ O(n²) บน adjacency matrix ที่เก็บเป็นธง\n- **ทำไมแบบหนาแน่น:** เมื่อ m ถึง n² − n แบบ heap คือ O(m log n) ≈ 4 × 10⁶ · 11 บวก adjacency list ของ int 4 ล้านตัว (16 MB) แบบอาร์เรย์คือ O(n²) = 4 × 10⁶ ขั้น กับเมทริกซ์ `char` 4 MB\n- **ทำไมท่าน้ำหนักนี้ถูกต้องพอดี:** เส้นทาง 0 → x → y จ่าย co[0] + ci[x] + co[x] + ci[y] ซึ่งก็คือ (co[0] + ci[x]) + (co[x] + ci[y]): ผลรวมน้ำหนักของสองเที่ยวบิน\n- **อย่างไร:** dist[0] = 0 ทำ n รอบ: เลือกสนามบิน u ที่ยังไม่เสร็จและ dist จำกัดน้อยที่สุด (หยุดถ้าไม่มี) ทำเครื่องหมาย แล้วทุก v ที่ flight[u][v] ให้ relax ด้วย dist[u] + co[u] + ci[v] พิมพ์ −1 แทน ∞\n- **ขนาด input:** ข้อความราว 40 MB PDF แนะนำ `sync_with_stdio(false)` ตัวอ่านแบบ `fread` เล็ก ๆ เร็วกว่านั้นอีก และเป็นสิ่งที่เฉลยใช้\n\n## 4. โค้ดเฉลย\n{{code}}\n{{tests}}\n\n**ไล่ค่า**: ตัวอย่างที่ 3 dist[0..4] หลังแต่ละรอบ (· = ปิดแล้ว):\n\n| รอบ | ปิด | dist หลังรอบ |\n|---|---|---|\n| 1 | 0 (0) | · 8 ∞ 5 9 |\n| 2 | 3 (5) | · 8 ∞ · 9 (3 → 4 จะเป็น 5 + 2 + 8 = 15) |\n| 3 | 1 (8) | · · 15 · 9 |\n| 4 | 4 (9) | · · 15 · · (4 → 1 จะเป็น 22, 4 → 3 จะเป็น 19) |\n| 5 | 2 (15) | เสร็จ |\n\nผลลัพธ์ `0 8 15 5 9`\n\n## 5. จุดที่มักพลาด\n- **สลับ ci กับ co:** บรรทัดค่าธรรมเนียม **แรก** คือ ci (ลงจอด) บรรทัดที่สองคือ co (บินออก)\n- **คิดค่าต่อสนามบินที่ผ่าน ไม่ใช่ต่อเที่ยวบิน:** แต่ละเที่ยวบินจ่ายค่าบินออกหนึ่งครั้งและค่าลงจอดหนึ่งครั้ง สนามบินที่แวะผ่านจึงจ่ายทั้งค่าลงจอดและค่าบินออกของมัน\n- **คิดค่าลงจอดของสนามบิน 0:** เราเริ่มที่นั่น คำตอบของมันคือ 0\n- **input ช้า:** ตัวเลข 8 ล้านตัวด้วย `cin` ธรรมดาใช้ราวหนึ่งวินาที\n- **Dijkstra แบบ heap กับ adjacency list:** ใช้ได้ แต่ใช้หน่วยความจำและเวลามากกว่ามากเมื่อ m ≈ 4 × 10⁶\n\n## 6. ความรู้พื้นฐาน\nบทที่ 17 ค่าที่อยู่บนปมย้ายไปไว้บนเส้นได้เสมอ (ข้อนี้: ค่าบินออกที่ต้นเส้น ค่าลงจอดที่ปลายเส้น) เหมือนข้อ [Columbia](#ex06e3_columbia) และ [Hacking](#a58_q3_p3a_hacking) กราฟหนาแน่น → Dijkstra แบบอาร์เรย์ แบบเดียวกับข้อ [Farthest](#a61_q2_farthest)"}}, {"id": "da66_f1_sea_bridge", "group": "final", "lesson": "16 · Graphs: multi-source BFS on a huge grid", "stars": 3, "complexity": "O(R · C)", "kind": "program", "tags": ["multi-source BFS", "layers", "grid", "25 million cells", "fread", "one byte per cell"], "title": {"en": "Sea bridge", "th": "สะพานข้ามทะเล (Sea Bridge)"}, "blurb": {"en": "Pick the fewest grid cells (no volcanoes) forming a connected road that touches both country 1 and country 2. That is the shortest path from any 1-cell to any 2-cell, counted in cells: one multi-source BFS.", "th": "เลือกช่องในตารางให้น้อยที่สุด (ห้ามภูเขาไฟ) เป็นถนนที่ต่อกันและแตะทั้งประเทศ 1 และประเทศ 2 นั่นคือเส้นทางสั้นสุดจากช่อง 1 ใดก็ได้ไปช่อง 2 ใดก็ได้ นับเป็นจำนวนช่อง: BFS หลายจุดเริ่มครั้งเดียว"}, "tests": {"en": "all 6 PDF samples and a 5×5 corner-to-corner map; 300 random maps (up to 6×6) against a Python BFS from every 1-cell; a 5,000 × 5,000 map with the two countries in opposite corners (answer 9,999, about 50 MB of input) in 0.38 s.", "th": "ตัวอย่างทั้ง 6 ชุดใน PDF และแผนที่ 5×5 มุมถึงมุม; สุ่ม 300 แผนที่ (ถึง 6×6) เทียบกับ BFS จากทุกช่อง 1 ใน Python; แผนที่ 5,000 × 5,000 ที่สองประเทศอยู่มุมตรงข้ามกัน (คำตอบ 9,999 input ราว 50 MB) ใช้ 0.38 วินาที"}, "files": [{"name": "main.cpp", "src": "#include <cstdio>\n#include <vector>\nusing namespace std;\n\n// R, C <= 5,000 -> up to 25,000,000 cells (about 50 MB of input).\n// We read the input in big chunks with fread and keep ONE BYTE per cell.\nstatic char buf[1 << 16];\nint bufLen = 0, bufPos = 0;\nint readChar() {\n    if (bufPos == bufLen) { bufLen = fread(buf, 1, sizeof(buf), stdin); bufPos = 0; if (bufLen <= 0) return -1; }\n    return buf[bufPos++];\n}\nint readInt() {\n    int c = readChar();\n    while (c < '0' || c > '9') c = readChar();\n    int x = 0;\n    while (c >= '0' && c <= '9') { x = x * 10 + (c - '0'); c = readChar(); }\n    return x;\n}\n\nint main() {\n    int R = readInt(), C = readInt();\n    // cell (r, c) lives at index r*C + c\n    vector<char> g((size_t)R * C);\n    vector<int> q;                     // BFS queue stored in a plain array\n    q.reserve((size_t)R * C);\n    // read every cell; every country-1 cell is a starting point (a road of length 1)\n    for (int i = 0; i < R * C; i++) {\n        g[i] = readInt();\n        if (g[i] == 1) { q.push_back(i); g[i] = 3; }   // 3 = \"blocked\": volcano OR already visited\n    }\n    // Multi-source BFS, one LAYER at a time. Layer L holds the cells whose shortest\n    // road (counted in cells, both ends included) has length L. Layer 1 = all country-1 cells.\n    size_t head = 0;\n    // layers L = 1, 2, 3, ... until a country-2 cell is reached\n    for (int L = 1; head < q.size(); L++) {\n        size_t layerEnd = q.size();    // cells q[head .. layerEnd-1] form layer L\n        while (head < layerEnd) {\n            int u = q[head++];\n            int r = u / C, c = u % C;\n            // the 4 neighbours: up, down, left, right (only those inside the map)\n            int nb[4], cnt = 0;\n            if (r > 0)     nb[cnt++] = u - C;\n            if (r < R - 1) nb[cnt++] = u + C;\n            if (c > 0)     nb[cnt++] = u - 1;\n            if (c < C - 1) nb[cnt++] = u + 1;\n            for (int k = 0; k < cnt; k++) {\n                int v = nb[k];\n                if (g[v] == 3) continue;                          // volcano or already visited\n                if (g[v] == 2) { printf(\"%d\\n\", L + 1); return 0; } // first country-2 cell: done\n                g[v] = 3;                                         // mark visited\n                q.push_back(v);\n            }\n        }\n    }\n    printf(\"-1\\n\");                    // cannot happen: the PDF guarantees a road exists\n}\n"}], "body": {"en": "## 1. What the problem says\nA sea is an R × C grid (1 ≤ R, C ≤ 5,000). Each cell is **0** sea, **1** country 1, **2** country 2, or **3** a volcano. Choose some cells to build a road such that\n1. no chosen cell is a volcano,\n2. the chosen cells are connected through side-sharing neighbours,\n3. at least one chosen cell is country 1 and at least one is country 2.\n\nPrint the **minimum number of cells**. A road always exists, and the input is huge (use fast I/O).\n\nSample 1 → **4**: the 1-cell, two sea cells, and the 2-cell in a row.\n\n## 2. What it really means\nA smallest connected set that contains a 1-cell and a 2-cell is just a **path** from some 1-cell to some 2-cell (any extra cell could be dropped). Its size is the number of cells on the path, both ends included. So:\n\n> answer = 1 + (shortest number of steps from **any** 1-cell to **any** 2-cell), walking only on non-volcano cells.\n\n\"From any of many starts\" is a **multi-source BFS**: all 1-cells together form layer 1.\n\n```text\nsample 6 (answer 16): the only way round the volcano walls\n\n   0 2 0 0 0        . 2 ─ ─ ┐\n   3 3 3 3 0        3 3 3 3 │\n   0 0 0 0 0        ┌ ─ ─ ─ ┘\n   0 3 3 3 3        │ 3 3 3 3\n   0 0 0 0 1        └ ─ ─ ─ 1          16 cells from 1 to 2\n```\n\n:::hint Hint 1\nWhy can the best road be assumed to be a simple path? What happens to a cell that is not between the two ends?\n:::\n:::hint Hint 2\nStart a BFS from **every** 1-cell at once. The first time the BFS touches a 2-cell, you have the answer.\n:::\n\n## 3. What, why, how\n- **What:** multi-source BFS on the grid, processed one layer at a time, stopping at the first 2-cell.\n- **Why BFS:** every cell costs exactly 1, so \"fewest cells\" = \"fewest steps\", the thing BFS finds.\n- **Why stopping early is safe:** BFS finishes all of layer L before layer L + 1. The first 2-cell seen belongs to the smallest possible layer.\n- **Why passing through other 1- or 2-cells needs no special care:** a shortest path never passes through another 1-cell (it could start there instead) and stops at its first 2-cell.\n- **Memory:** 25,000,000 cells. A vector of `int` distances would be 100 MB, and `vector<vector<int>>` far worse. The solution keeps **one byte per cell**, marks a visited cell by overwriting it with 3 (\"blocked\"), and stores the layer number in a single variable. The queue is a flat array of cell indices r·C + c.\n- **Input:** 25 million numbers ≈ 50 MB. Read it with a small `fread` buffer.\n\n## 4. Solution\n{{code}}\n{{tests}}\n\n**Trace**: sample 2 (5 × 5). Country 1 cells: (1,3) (1,4) (2,4) (4,3) (4,4).\n\n| loop L | cells in layer L (being expanded) | what expanding them finds |\n|---|---|---|\n| 1 | the five 1-cells | layer 2: (0,3) (0,4) (1,2) (2,3) (3,3) (3,4) (4,2); no 2-cell |\n| 2 | the seven cells above | (0,3) has the neighbour (0,2), a **2** → print L + 1 = **3** |\n\nThe road found: (1,3) – (0,3) – (0,2), 3 cells. The PDF draws (1,3) – (1,2) – (0,2), another road of the same length.\n\n## 5. Traps\n- **Counting steps instead of cells:** cells = steps + 1.\n- **BFS from each 1-cell separately:** up to 25 million BFS runs.\n- **`int` distances or `vector<vector<int>>` for 25 million cells:** memory and cache misses; one byte per cell is enough.\n- **Recursion (DFS flood fill):** the depth can reach millions; it also does not find shortest paths.\n- **Slow input:** plain `cin` on 50 MB is too slow; even `scanf` is borderline.\n- **A 1-cell right next to a 2-cell:** answer 2 (sample 4).\n\n## 6. Background\nLesson 16. Same idea as [Pandemic](#a62_q2a_pandemic): many sources in one queue. The \"shortest road between two regions\" pattern is a classic exam favourite (it is also the core of \"shortest bridge\" problems). For huge grids, think about bytes per cell before writing any code.", "th": "## 1. โจทย์บอกอะไร\nทะเลเป็นตาราง R × C (1 ≤ R, C ≤ 5,000) แต่ละช่องเป็น **0** ทะเล, **1** ประเทศ 1, **2** ประเทศ 2 หรือ **3** ภูเขาไฟ ให้เลือกช่องบางช่องมาสร้างถนนโดย\n1. ห้ามเลือกช่องภูเขาไฟ\n2. ช่องที่เลือกต้องต่อกันผ่านช่องที่มีด้านติดกัน\n3. ต้องมีช่องของประเทศ 1 อย่างน้อยหนึ่งช่อง และของประเทศ 2 อย่างน้อยหนึ่งช่อง\n\nให้พิมพ์ **จำนวนช่องที่น้อยที่สุด** รับประกันว่าสร้างถนนได้เสมอ และ input ใหญ่มาก (ใช้ fast I/O)\n\nตัวอย่างที่ 1 → **4**: ช่อง 1, ช่องทะเลสองช่อง และช่อง 2 เรียงกัน\n\n## 2. จริง ๆ แล้วถามอะไร\nเซตเชื่อมต่อที่เล็กที่สุดที่มีช่อง 1 และช่อง 2 ก็คือ **เส้นทาง** จากช่อง 1 บางช่องไปช่อง 2 บางช่อง (ช่องเกินตัดทิ้งได้) ขนาดของมันคือจำนวนช่องบนเส้นทาง นับทั้งสองปลาย ดังนั้น:\n\n> คำตอบ = 1 + (จำนวนก้าวที่น้อยที่สุดจากช่อง 1 **ใดก็ได้** ไปช่อง 2 **ใดก็ได้**) โดยเดินเฉพาะช่องที่ไม่ใช่ภูเขาไฟ\n\n\"จากจุดเริ่มหลายจุด\" คือ **BFS หลายจุดเริ่ม**: ช่อง 1 ทุกช่องรวมกันเป็นชั้นที่ 1\n\n```text\nsample 6 (answer 16): the only way round the volcano walls\n\n   0 2 0 0 0        . 2 ─ ─ ┐\n   3 3 3 3 0        3 3 3 3 │\n   0 0 0 0 0        ┌ ─ ─ ─ ┘\n   0 3 3 3 3        │ 3 3 3 3\n   0 0 0 0 1        └ ─ ─ ─ 1          16 cells from 1 to 2\n```\n\n:::hint คำใบ้ 1\nทำไมจึงสมมติได้ว่าถนนที่ดีที่สุดเป็นเส้นทางธรรมดา ช่องที่ไม่ได้อยู่ระหว่างสองปลายจะเป็นอย่างไร\n:::\n:::hint คำใบ้ 2\nเริ่ม BFS จาก **ทุก** ช่อง 1 พร้อมกัน ครั้งแรกที่ BFS แตะช่อง 2 ก็ได้คำตอบแล้ว\n:::\n\n## 3. อะไร ทำไม อย่างไร\n- **อะไร:** BFS หลายจุดเริ่มบนตาราง ทำทีละชั้น และหยุดที่ช่อง 2 ช่องแรก\n- **ทำไม BFS:** ทุกช่องมีค่า 1 พอดี \"ช่องน้อยที่สุด\" = \"ก้าวน้อยที่สุด\" ซึ่งคือสิ่งที่ BFS หา\n- **ทำไมหยุดก่อนได้:** BFS ทำชั้น L ให้เสร็จก่อนชั้น L + 1 ช่อง 2 ช่องแรกที่เจอจึงอยู่ในชั้นที่เล็กที่สุดที่เป็นไปได้\n- **ทำไมการผ่านช่อง 1 หรือ 2 อื่นไม่ต้องดูแลพิเศษ:** เส้นทางสั้นสุดไม่ผ่านช่อง 1 อื่น (เริ่มที่นั่นแทนได้) และหยุดที่ช่อง 2 แรก\n- **หน่วยความจำ:** 25,000,000 ช่อง vector ของระยะแบบ `int` จะเป็น 100 MB และ `vector<vector<int>>` แย่กว่านั้นมาก เฉลยเก็บ **หนึ่งไบต์ต่อช่อง** ทำเครื่องหมายว่าเยี่ยมแล้วโดยเขียนทับเป็น 3 (\"กั้น\") และเก็บหมายเลขชั้นในตัวแปรตัวเดียว คิวเป็นอาร์เรย์แบนของดัชนีช่อง r·C + c\n- **input:** ตัวเลข 25 ล้านตัว ≈ 50 MB อ่านด้วยบัฟเฟอร์ `fread` เล็ก ๆ\n\n## 4. โค้ดเฉลย\n{{code}}\n{{tests}}\n\n**ไล่ค่า**: ตัวอย่างที่ 2 (5 × 5) ช่องประเทศ 1: (1,3) (1,4) (2,4) (4,3) (4,4)\n\n| รอบ L | ช่องในชั้น L (กำลังขยาย) | การขยายเจออะไร |\n|---|---|---|\n| 1 | ช่อง 1 ทั้งห้า | ชั้น 2: (0,3) (0,4) (1,2) (2,3) (3,3) (3,4) (4,2); ไม่มีช่อง 2 |\n| 2 | เจ็ดช่องข้างบน | (0,3) มีเพื่อนบ้าน (0,2) ซึ่งเป็น **2** → พิมพ์ L + 1 = **3** |\n\nถนนที่หาได้: (1,3) – (0,3) – (0,2) 3 ช่อง ส่วน PDF วาด (1,3) – (1,2) – (0,2) ซึ่งเป็นอีกถนนที่ยาวเท่ากัน\n\n## 5. จุดที่มักพลาด\n- **นับก้าวแทนนับช่อง:** ช่อง = ก้าว + 1\n- **BFS จากช่อง 1 ทีละช่อง:** อาจถึง 25 ล้านครั้ง\n- **ระยะแบบ `int` หรือ `vector<vector<int>>` สำหรับ 25 ล้านช่อง:** เปลืองหน่วยความจำและ cache miss หนึ่งไบต์ต่อช่องก็พอ\n- **recursion (flood fill แบบ DFS):** ลึกได้หลายล้านชั้น และไม่ได้หาเส้นทางสั้นสุดด้วย\n- **input ช้า:** `cin` ธรรมดากับ 50 MB ช้าเกินไป แม้ `scanf` ก็เฉียดฉิว\n- **ช่อง 1 อยู่ติดช่อง 2:** คำตอบ 2 (ตัวอย่างที่ 4)\n\n## 6. ความรู้พื้นฐาน\nบทที่ 16 ไอเดียเดียวกับ [Pandemic](#a62_q2a_pandemic): จุดเริ่มหลายจุดในคิวเดียว รูปแบบ \"ถนนที่สั้นที่สุดระหว่างสองพื้นที่\" เป็นโจทย์ที่ออกสอบบ่อย (เป็นแก่นของโจทย์แบบ \"shortest bridge\") สำหรับตารางขนาดมหึมา ให้คิดเรื่องจำนวนไบต์ต่อช่องก่อนเขียนโค้ด"}}, {"id": "da66_f2_grid_loop", "group": "final", "lesson": "16 · Graphs: walking a degree-≤2 graph", "stars": 3, "complexity": "O(R · C)", "kind": "program", "tags": ["implicit graph", "pipe tiles", "direction tables", "cycles in a degree-2 graph", "simulation"], "title": {"en": "Grid loop", "th": "ถนนวงวนในตาราง (Grid Loop)"}, "blurb": {"en": "Every cell holds one of 6 road tiles, each joining two sides. Count the closed loops and the length of the longest one. Each cell has at most two real connections, so just follow each road until it closes or breaks.", "th": "ทุกช่องมีแผ่นถนนหนึ่งใน 6 แบบ แต่ละแบบเชื่อมสองด้าน ให้นับจำนวนวงวนที่ปิด และความยาวของวงที่ยาวที่สุด แต่ละช่องมีการเชื่อมจริงไม่เกินสองทาง จึงแค่เดินตามถนนแต่ละเส้นจนกว่าจะปิดวงหรือขาด"}, "tests": {"en": "all 3 PDF samples, a 1×1 map, and a 2×2 ring; 300 random maps (up to 5×5) against a Python brute force that builds the graph and finds cycles with union-find; a 1,000 × 1,000 map with one loop round the border (3,996 cells) and a random 1,000 × 1,000 map checked against the brute force, in 0.07–0.09 s.", "th": "ตัวอย่างทั้ง 3 ชุดใน PDF, แผนที่ 1×1 และวงแหวน 2×2; สุ่ม 300 แผนที่ (ถึง 5×5) เทียบกับ brute force ใน Python ที่สร้างกราฟแล้วหาวงด้วย union-find; แผนที่ 1,000 × 1,000 ที่มีวงเดียวรอบขอบ (3,996 ช่อง) และแผนที่สุ่ม 1,000 × 1,000 ที่เทียบกับ brute force ใช้ 0.07–0.09 วินาที"}, "files": [{"name": "main.cpp", "src": "#include <cstdio>\n#include <vector>\nusing namespace std;\n\n// Directions: 0 = up, 1 = right, 2 = down, 3 = left.\nconst int DR[4] = {-1, 0, 1, 0}, DC[4] = {0, 1, 0, -1};\n// OPEN[t] = the two sides that road type t (1..6) connects\nconst int OPEN[7][2] = {\n    {0, 0},      // (unused)\n    {3, 1},      // 1: left  - right\n    {0, 2},      // 2: up    - down\n    {0, 1},      // 3: up    - right\n    {1, 2},      // 4: right - down\n    {2, 3},      // 5: down  - left\n    {3, 0},      // 6: left  - up\n};\n\nint R, C;\nvector<vector<int>> g;\n\nbool opens(int r, int c, int dir) {          // does cell (r, c) have an exit towards dir?\n    return OPEN[g[r][c]][0] == dir || OPEN[g[r][c]][1] == dir;\n}\n\nint main() {\n    if (scanf(\"%d %d\", &R, &C) != 2) return 0;\n    g.assign(R, vector<int>(C));\n    for (int r = 0; r < R; r++)\n        for (int c = 0; c < C; c++)\n            if (scanf(\"%d\", &g[r][c]) != 1) return 0;\n\n    // Every cell has exactly 2 exits, so every cell has at most 2 real connections.\n    // A graph where every node has degree <= 2 splits into simple PATHS and simple CYCLES.\n    // We walk each piece once: it is a loop exactly when the walk comes back to its start.\n    vector<vector<bool>> seen(R, vector<bool>(C, false));\n    int loops = 0, longest = 0;\n    // try every cell as a starting point, row by row\n    for (int sr = 0; sr < R; sr++) {\n        for (int sc = 0; sc < C; sc++) {\n            if (seen[sr][sc]) continue;\n            // walk forward starting through the cell's first exit\n            int r = sr, c = sc, dir = OPEN[g[sr][sc]][0], len = 0;\n            bool closed = false;\n            seen[sr][sc] = true;\n            // each step: leave (r, c) through dir, enter the neighbour, then leave by its other exit\n            while (true) {\n                len++;\n                int nr = r + DR[dir], nc = c + DC[dir];\n                int back = (dir + 2) % 4;                            // the side we enter the neighbour from\n                if (nr < 0 || nr >= R || nc < 0 || nc >= C) break;   // road runs off the map\n                if (!opens(nr, nc, back)) break;                     // neighbour does not connect back\n                if (nr == sr && nc == sc) { closed = true; break; }  // back at the start: a loop\n                if (seen[nr][nc]) break;                             // cannot happen; safety only\n                seen[nr][nc] = true;\n                dir = (OPEN[g[nr][nc]][0] == back) ? OPEN[g[nr][nc]][1] : OPEN[g[nr][nc]][0];\n                r = nr; c = nc;\n            }\n            if (closed) {\n                loops++;\n                if (len > longest) longest = len;\n            } else {\n                // not a loop: also walk the other way from the start, just to mark that\n                // half of the path as seen (so we never start inside it again)\n                r = sr; c = sc; dir = OPEN[g[sr][sc]][1];\n                while (true) {\n                    int nr = r + DR[dir], nc = c + DC[dir];\n                    int back = (dir + 2) % 4;\n                    if (nr < 0 || nr >= R || nc < 0 || nc >= C) break;\n                    if (!opens(nr, nc, back) || seen[nr][nc]) break;\n                    seen[nr][nc] = true;\n                    dir = (OPEN[g[nr][nc]][0] == back) ? OPEN[g[nr][nc]][1] : OPEN[g[nr][nc]][0];\n                    r = nr; c = nc;\n                }\n            }\n        }\n    }\n    if (loops == 0) printf(\"0\\n\");\n    else printf(\"%d %d\\n\", loops, longest);\n}\n"}], "body": {"en": "## 1. What the problem says\nAn R × C grid (R, C ≤ 1,000) is filled with road tiles, types 1–6. Each type joins two sides of its cell:\n\n| type | joins | drawing |\n|---|---|---|\n| 1 | left – right | ─ |\n| 2 | up – down | │ |\n| 3 | up – right | └ |\n| 4 | right – down | ┌ |\n| 5 | down – left | ┐ |\n| 6 | left – up | ┘ |\n\nA **loop** is a road that, followed from some cell, comes back to that cell. Its length is the number of cells on it. Print **the number of loops and the length of the longest**, or just **0** if there are none.\n\nSample 1 (2 × 3): rows `4 1 5` and `3 1 6` draw one closed rectangle of 6 cells → `1 6`.\n\n## 2. What it really means\nTwo neighbouring cells are **really connected** only if **both** tiles open towards each other. Each cell has 2 openings, so each cell has **at most 2 real connections**. A graph where every node has degree ≤ 2 falls apart into simple **paths** and simple **cycles**, nothing else.\n\nSo: pick an unvisited cell, walk along the road in one direction, and see what happens:\n- you come back to the start → a **loop** (count it, record its length);\n- the road runs off the map, or into a tile that does not open back → a **path**, not a loop.\n\n```text\nsample 2 (4 × 4) → \"2 12\"\n   tiles        drawn\n   4 5 4 5      ┌ ┐ ┌ ┐      loop A,  4 cells: (0,2) (0,3) (1,3) (1,2)\n   2 2 3 6      │ │ └ ┘      loop B, 12 cells: (0,0) (0,1) (1,1) (2,1) (2,2) (2,3)\n   2 3 1 5      │ └ ─ ┐                        (3,3) (3,2) (3,1) (3,0) (2,0) (1,0)\n   3 1 1 6      └ ─ ─ ┘\n```\n\n:::hint Hint 1\nHow many neighbours can one cell really be connected to? What do graphs with that property look like?\n:::\n:::hint Hint 2\nStore each tile's two exits as directions 0–3 (up, right, down, left). Entering a cell from side `back`, you leave through its **other** exit.\n:::\n\n## 3. What, why, how\n- **What:** walk each component of an implicit degree-≤2 graph once.\n- **Direction tables:** DR = {−1, 0, 1, 0}, DC = {0, 1, 0, −1} for up, right, down, left. The side you enter from is `(dir + 2) % 4`. OPEN[t] lists the two exits of type t.\n- **One step:** from (r, c) moving in `dir`, go to (nr, nc). Stop if it is off the map or if the tile there does not open towards `back`. Otherwise the new `dir` is that tile's exit that is not `back`.\n- **Loop or path:** if a walk returns to its start, it is a loop of `len` cells. If not, walk the other way from the start too, only to mark the rest of the path as seen, so no later start lands inside it.\n- **Cost:** every cell is visited a constant number of times: O(R · C) = 10⁶. No recursion, no explicit graph.\n\n## 4. Solution\n{{code}}\n{{tests}}\n\n**Trace**: sample 1, starting at (0,0) (type 4 ┌, first exit = right):\n\n| step | enter cell | its type | entered from | leave towards | len |\n|---|---|---|---|---|---|\n| 1 | (0,1) | 1 ─ | left | right | 1 |\n| 2 | (0,2) | 5 ┐ | left | down | 2 |\n| 3 | (1,2) | 6 ┘ | up | left | 3 |\n| 4 | (1,1) | 1 ─ | right | left | 4 |\n| 5 | (1,0) | 3 └ | right | up | 5 |\n| 6 | (0,0) | start! | down | | **6** |\n\nBack at the start after 6 cells: one loop of length 6 → `1 6`.\n\n## 5. Traps\n- **Trusting one side only:** (r, c) opening right is not enough; the neighbour must open left.\n- **\"No loop\" output:** print a single `0`, not `0 0`.\n- **Recursive DFS:** a loop can have up to 10⁶ cells; recursion that deep can crash.\n- **Starting in the middle of a path:** walking only one way leaves the other half unseen; a later start would walk it again (still correct but wasteful) unless you mark both halves.\n- **Mixing up types 3–6:** copy the table from the PDF carefully: 3 = up–right, 4 = right–down, 5 = down–left, 6 = left–up.\n\n## 6. Background\nLesson 16. Grids are implicit graphs; direction arrays and an \"opposite side\" rule replace an adjacency list. Degree ≤ 2 makes cycle-finding a simple walk, compare [Line graph](#a62_q2a_line_graph), where the same \"max degree ≤ 2\" structure decides the answer. For a graph with exactly one cycle see [Cycle in a tree](#a59_q3_cycle).", "th": "## 1. โจทย์บอกอะไร\nตาราง R × C (R, C ≤ 1,000) ถูกเติมด้วยแผ่นถนนแบบ 1–6 แต่ละแบบเชื่อมสองด้านของช่อง:\n\n| แบบ | เชื่อม | รูป |\n|---|---|---|\n| 1 | ซ้าย – ขวา | ─ |\n| 2 | บน – ล่าง | │ |\n| 3 | บน – ขวา | └ |\n| 4 | ขวา – ล่าง | ┌ |\n| 5 | ล่าง – ซ้าย | ┐ |\n| 6 | ซ้าย – บน | ┘ |\n\n**วงวน** คือถนนที่ถ้าเดินตามจากช่องหนึ่งแล้วกลับมาที่ช่องนั้นได้ ความยาวคือจำนวนช่องบนวง ให้พิมพ์ **จำนวนวงวน และความยาวของวงที่ยาวที่สุด** หรือแค่ **0** ถ้าไม่มีเลย\n\nตัวอย่างที่ 1 (2 × 3): แถว `4 1 5` และ `3 1 6` วาดเป็นสี่เหลี่ยมปิดหนึ่งรูป 6 ช่อง → `1 6`\n\n## 2. จริง ๆ แล้วถามอะไร\nช่องสองช่องที่อยู่ติดกัน **เชื่อมกันจริง** ก็ต่อเมื่อแผ่นถนน **ทั้งคู่** เปิดเข้าหากัน แต่ละช่องมี 2 ทางเปิด จึงมี **การเชื่อมจริงไม่เกิน 2 ทาง** กราฟที่ทุกปมมีดีกรี ≤ 2 แยกออกเป็น **เส้นทาง** ธรรมดาและ **วงวน** ธรรมดาเท่านั้น ไม่มีแบบอื่น\n\nดังนั้น: เลือกช่องที่ยังไม่เคยเยี่ยม เดินตามถนนไปทางหนึ่ง แล้วดูว่าเกิดอะไร:\n- กลับมาที่จุดเริ่ม → **วงวน** (นับ และจดความยาว)\n- ถนนวิ่งออกนอกแผนที่ หรือชนแผ่นที่ไม่เปิดกลับมา → **เส้นทาง** ไม่ใช่วงวน\n\n```text\nsample 2 (4 × 4) → \"2 12\"\n   tiles        drawn\n   4 5 4 5      ┌ ┐ ┌ ┐      loop A,  4 cells: (0,2) (0,3) (1,3) (1,2)\n   2 2 3 6      │ │ └ ┘      loop B, 12 cells: (0,0) (0,1) (1,1) (2,1) (2,2) (2,3)\n   2 3 1 5      │ └ ─ ┐                        (3,3) (3,2) (3,1) (3,0) (2,0) (1,0)\n   3 1 1 6      └ ─ ─ ┘\n```\n\n:::hint คำใบ้ 1\nช่องหนึ่งช่องเชื่อมกับเพื่อนบ้านจริง ๆ ได้กี่ช่อง กราฟที่มีคุณสมบัตินี้มีหน้าตาอย่างไร\n:::\n:::hint คำใบ้ 2\nเก็บทางออกสองทางของแต่ละแบบเป็นทิศ 0–3 (บน ขวา ล่าง ซ้าย) เมื่อเข้าช่องจากด้าน `back` ให้ออกทางออก **อีกทาง** ของมัน\n:::\n\n## 3. อะไร ทำไม อย่างไร\n- **อะไร:** เดินทุกชิ้นส่วนของกราฟแฝงที่ดีกรี ≤ 2 ชิ้นละครั้ง\n- **ตารางทิศ:** DR = {−1, 0, 1, 0}, DC = {0, 1, 0, −1} สำหรับ บน ขวา ล่าง ซ้าย ด้านที่เราเดินเข้าคือ `(dir + 2) % 4` OPEN[t] คือทางออกสองทางของแบบ t\n- **หนึ่งก้าว:** จาก (r, c) เดินไปทาง `dir` ถึง (nr, nc) หยุดถ้าออกนอกแผนที่ หรือแผ่นตรงนั้นไม่เปิดหา `back` ไม่อย่างนั้น `dir` ใหม่คือทางออกของแผ่นนั้นที่ไม่ใช่ `back`\n- **วงหรือเส้นทาง:** ถ้าเดินแล้วกลับมาจุดเริ่ม คือวงยาว `len` ช่อง ถ้าไม่ ให้เดินอีกทางจากจุดเริ่มด้วย แค่เพื่อทำเครื่องหมายส่วนที่เหลือของเส้นทาง จะได้ไม่มีจุดเริ่มภายหลังตกลงไปข้างใน\n- **ต้นทุน:** ทุกช่องถูกเยี่ยมจำนวนครั้งคงที่: O(R · C) = 10⁶ ไม่มี recursion ไม่ต้องสร้างกราฟจริง\n\n## 4. โค้ดเฉลย\n{{code}}\n{{tests}}\n\n**ไล่ค่า**: ตัวอย่างที่ 1 เริ่มที่ (0,0) (แบบ 4 ┌ ทางออกแรก = ขวา):\n\n| ก้าว | เข้าช่อง | แบบ | เข้าจาก | ออกไปทาง | len |\n|---|---|---|---|---|---|\n| 1 | (0,1) | 1 ─ | ซ้าย | ขวา | 1 |\n| 2 | (0,2) | 5 ┐ | ซ้าย | ล่าง | 2 |\n| 3 | (1,2) | 6 ┘ | บน | ซ้าย | 3 |\n| 4 | (1,1) | 1 ─ | ขวา | ซ้าย | 4 |\n| 5 | (1,0) | 3 └ | ขวา | บน | 5 |\n| 6 | (0,0) | จุดเริ่ม! | ล่าง | | **6** |\n\nกลับมาจุดเริ่มหลัง 6 ช่อง: วงเดียวยาว 6 → `1 6`\n\n## 5. จุดที่มักพลาด\n- **เชื่อฝั่งเดียว:** (r, c) เปิดไปทางขวายังไม่พอ เพื่อนบ้านต้องเปิดมาทางซ้ายด้วย\n- **ผลลัพธ์เมื่อ \"ไม่มีวง\":** พิมพ์ `0` ตัวเดียว ไม่ใช่ `0 0`\n- **DFS แบบ recursive:** วงหนึ่งมีได้ถึง 10⁶ ช่อง recursion ลึกขนาดนั้นอาจพัง\n- **เริ่มกลางเส้นทาง:** เดินแค่ทางเดียวทำให้อีกครึ่งยังไม่ถูกเห็น จุดเริ่มภายหลังจะเดินซ้ำ (ยังถูกแต่เปลือง) ถ้าไม่ทำเครื่องหมายทั้งสองครึ่ง\n- **สลับแบบ 3–6:** คัดตารางจาก PDF ให้ดี: 3 = บน–ขวา, 4 = ขวา–ล่าง, 5 = ล่าง–ซ้าย, 6 = ซ้าย–บน\n\n## 6. ความรู้พื้นฐาน\nบทที่ 16 ตารางคือกราฟแฝง อาร์เรย์ทิศกับกฎ \"ด้านตรงข้าม\" ใช้แทน adjacency list ดีกรี ≤ 2 ทำให้การหาวงเป็นแค่การเดิน เทียบกับข้อ [Line graph](#a62_q2a_line_graph) ที่โครงสร้าง \"ดีกรีสูงสุด ≤ 2\" แบบเดียวกันเป็นตัวตัดสินคำตอบ สำหรับกราฟที่มีวงพอดีหนึ่งวงดู [วงวนในต้นไม้](#a59_q3_cycle)"}}, {"id": "da66_f2_new_game_plus", "group": "final", "lesson": "14 · Dynamic programming (state = position + last move)", "stars": 3, "complexity": "O(R · C)", "kind": "program", "tags": ["counting DP", "extra state for \"last door\"", "column by column", "mod 100000007"], "title": {"en": "New Game Plus", "th": "นิวเกมพลัส (New Game Plus)"}, "blurb": {"en": "Walk a maze from column 1 to column C, each step going up-right, right or down-right, never using the same door twice in a row, avoiding blocked rooms. Count the routes mod 100,000,007 with a DP whose state remembers the last door.", "th": "เดินเขาวงกตจากคอลัมน์ 1 ไปคอลัมน์ C แต่ละก้าวไปขวาบน ขวา หรือขวาล่าง ห้ามใช้ประตูเดิมสองครั้งติดกัน และหลบห้องห้ามเข้า นับจำนวนเส้นทาง mod 100,000,007 ด้วย DP ที่ state จำประตูล่าสุดไว้"}, "tests": {"en": "all 7 PDF samples, including the 25 × 25 empty maze (543,099,714 routes → 43,099,679); 300 random mazes (up to 5 × 6) against a Python brute force that enumerates every route; a 500 × 500 maze with 10 % blocked rooms in 0.02 s.", "th": "ตัวอย่างทั้ง 7 ชุดใน PDF รวมถึงเขาวงกตว่าง 25 × 25 (543,099,714 เส้นทาง → 43,099,679); สุ่ม 300 เขาวงกต (ถึง 5 × 6) เทียบกับ brute force ใน Python ที่ไล่ทุกเส้นทาง; เขาวงกต 500 × 500 ที่มีห้องห้ามเข้า 10 % ใช้ 0.02 วินาที"}, "files": [{"name": "main.cpp", "src": "#include <cstdio>\n#include <vector>\nusing namespace std;\n\nconst int MOD = 100000007;\n\nint main() {\n    int R, C;\n    if (scanf(\"%d %d\", &R, &C) != 2) return 0;\n    vector<vector<int>> blocked(R, vector<int>(C));\n    for (int r = 0; r < R; r++)\n        for (int c = 0; c < C; c++)\n            if (scanf(\"%d\", &blocked[r][c]) != 1) return 0;\n\n    // State = (row, the door we used to ENTER this room). Doors: 0 = X (up-right),\n    // 1 = Y (right), 2 = Z (down-right). The next door must differ from it.\n    // cur[r][d] = number of different room lists that end in room (r, c) and entered it by door d.\n    // For column 0 nobody entered by a door yet: we use d = 3 for \"start\" (no restriction).\n    const int DROW[3] = {-1, 0, +1};\n    vector<vector<long long>> cur(R, vector<long long>(4, 0)), nxt;\n    // column 0: start in any open room\n    for (int r = 0; r < R; r++)\n        if (!blocked[r][0]) cur[r][3] = 1;\n    // move column by column: c -> c+1, for c = 0 .. C-2\n    for (int c = 0; c + 1 < C; c++) {\n        nxt.assign(R, vector<long long>(4, 0));\n        // every room (r, c) and every way d we entered it\n        for (int r = 0; r < R; r++)\n            for (int d = 0; d < 4; d++) {\n                if (cur[r][d] == 0) continue;\n                // try the three doors e; door e may not repeat door d\n                for (int e = 0; e < 3; e++) {\n                    if (e == d) continue;\n                    int nr = r + DROW[e];\n                    if (nr < 0 || nr >= R || blocked[nr][c + 1]) continue;\n                    nxt[nr][e] = (nxt[nr][e] + cur[r][d]) % MOD;\n                }\n            }\n        cur.swap(nxt);\n    }\n    long long total = 0;\n    // every room in the last column, entered by any door\n    for (int r = 0; r < R; r++)\n        for (int d = 0; d < 4; d++) total = (total + cur[r][d]) % MOD;\n    printf(\"%lld\\n\", total);\n}\n"}], "body": {"en": "## 1. What the problem says\nA maze is an R × C grid of rooms (2 ≤ R, C ≤ 500); 1 marks a blocked room. You start in **any open room of column 1** and must reach **any room of column C**. Each room has three doors:\n- **X** → (r − 1, c + 1), up-right\n- **Y** → (r, c + 1), right\n- **Z** → (r + 1, c + 1), down-right\n\nRules: you may **not use the same door as the previous step** (X then X is forbidden, X then Y then X is fine); you cannot enter blocked rooms or leave the grid. Two plays differ if their **lists of rooms** differ. Print the number of plays **mod 100,000,007**.\n\nSample 2 (2 × 3, room (1,2) blocked) → **3**. The route (2,1) → (2,2) → (2,3) is not allowed: Y twice in a row.\n\n## 2. What it really means\nEvery step moves one column right, so a play has exactly C rooms, one per column, and a room list is the same as a door sequence plus the starting row. We are **counting paths** in a DAG of columns: a counting DP like [chocolate](#a62_q1b_chocolate), built column by column like [table no 11](#a64_q2_table_no_11).\n\nThe catch is the rule \"not the same door twice\". Whether a door is allowed depends on **how we got here**. So the state must remember it:\n\n> ways[r][d] = number of valid room lists that end in room (r, current column) and **entered it through door d**.\n\nFor column 1 nobody used a door yet; give it a fourth value d = \"start\" that forbids nothing.\n\n```text\ntransition (column c → c+1):\n   ways_next[r + Δ(e)][e] += ways[r][d]      for every door e ≠ d,\n                                             Δ(X) = −1, Δ(Y) = 0, Δ(Z) = +1,\n                                             if the target room is inside and open\n```\n\n:::hint Hint 1\nCounting paths column by column is easy without the door rule. What extra fact do you need about a path to know which doors it may use next?\n:::\n:::hint Hint 2\nUse 4 counters per room: entered by X, by Y, by Z, or \"started here\". Then each counter feeds the 2 or 3 doors that differ from it.\n:::\n\n## 3. What, why, how\n- **What:** a counting DP over columns with state (row, last door).\n- **Why the state is enough:** the future (which doors are allowed next, which rooms can be reached) depends only on the current room and the last door, not on the earlier history. That is exactly the \"memoryless\" condition a DP state needs.\n- **Why counts add up correctly:** two room lists that differ anywhere stay different when extended, so adding counts never double-counts.\n- **How:** cur[r][start] = 1 for every open room in column 0. For c = 0..C−2, build nxt from cur by the transition above, then swap. The answer is the sum of all cur[r][d] in the last column, mod 100,000,007.\n- **Cost:** R · C · 4 · 3 ≈ 3 × 10⁶ updates. Memory: two columns of R × 4 numbers.\n- **Mod:** reduce after every addition; values stay below 2 × 10⁸, safe in `long long`.\n\n## 4. Solution\n{{code}}\n{{tests}}\n\n**Trace**: sample 2. Rooms (row, column) 0-based; (0,1) is blocked. Counters are [X, Y, Z, start].\n\n| column | row 0 | row 1 | comment |\n|---|---|---|---|\n| 0 | [0, 0, 0, 1] | [0, 0, 0, 1] | start anywhere open |\n| 1 | blocked | [0, 1, 1, 0] | row 0 can only go Z (Y is blocked); row 1 goes Y (X is blocked) |\n| 2 | [2, 0, 0, 0] | [0, 1, 0, 0] | from \"entered by Z\": X up or Y right; from \"entered by Y\": only X up (Z is off the grid) |\n\nTotal 2 + 1 = **3**.\n\n## 5. Traps\n- **State without the last door:** you cannot enforce the rule.\n- **Forbidding the same door at the very first step:** there is no previous door for column 1.\n- **Starting from blocked rooms in column 1** or counting blocked rooms in column C: both are forbidden.\n- **Mod only at the end:** the true count for 500 × 500 is astronomically large.\n- **Recursion over all routes:** exponential (the 25 × 25 sample alone has 543 million routes).\n\n## 6. Background\nLesson 14. \"Add the last move to the state\" is the standard way to handle rules such as \"no two equal moves in a row\". The same idea appears in [table no 11](#a64_q2_table_no_11), where the state remembers what is in the previous row. Summing the counts of all predecessors is the pattern of [chocolate](#a62_q1b_chocolate); moving through a grid one layer at a time, choosing among a few next cells, is the shape of [triangle](#ex02m1_triangle).", "th": "## 1. โจทย์บอกอะไร\nเขาวงกตเป็นตารางห้อง R × C (2 ≤ R, C ≤ 500) เลข 1 คือห้องห้ามเข้า เราเริ่มที่ **ห้องเปิดใดก็ได้ในคอลัมน์ 1** และต้องไปถึง **ห้องใดก็ได้ในคอลัมน์ C** แต่ละห้องมีสามประตู:\n- **X** → (r − 1, c + 1) ขวาบน\n- **Y** → (r, c + 1) ขวา\n- **Z** → (r + 1, c + 1) ขวาล่าง\n\nกฎ: **ห้ามใช้ประตูเดียวกับก้าวก่อนหน้า** (X แล้ว X ห้าม แต่ X แล้ว Y แล้ว X ได้) ห้ามเข้าห้องห้ามเข้าหรือออกนอกตาราง การเล่นสองแบบต่างกันถ้า **รายการห้อง** ต่างกัน ให้พิมพ์จำนวนรูปแบบการเล่น **mod 100,000,007**\n\nตัวอย่างที่ 2 (2 × 3, ห้อง (1,2) ห้ามเข้า) → **3** เส้นทาง (2,1) → (2,2) → (2,3) ไม่ได้: ใช้ Y สองครั้งติดกัน\n\n## 2. จริง ๆ แล้วถามอะไร\nทุกก้าวขยับไปขวาหนึ่งคอลัมน์ การเล่นหนึ่งแบบจึงมี C ห้องพอดี คอลัมน์ละห้อง และรายการห้องก็เท่ากับลำดับประตูบวกแถวเริ่มต้น เรากำลัง **นับเส้นทาง** ใน DAG ของคอลัมน์: DP นับจำนวนแบบข้อ [chocolate](#a62_q1b_chocolate) ที่สร้างทีละคอลัมน์แบบข้อ [table no 11](#a64_q2_table_no_11)\n\nจุดยากคือกฎ \"ห้ามประตูเดิมสองครั้ง\" ประตูไหนใช้ได้ขึ้นกับว่า **เรามาถึงที่นี่อย่างไร** state จึงต้องจำสิ่งนี้ไว้:\n\n> ways[r][d] = จำนวนรายการห้องที่ถูกกฎซึ่งจบที่ห้อง (r, คอลัมน์ปัจจุบัน) และ **เข้ามาทางประตู d**\n\nคอลัมน์ 1 ยังไม่มีใครใช้ประตู ให้ค่าที่สี่ d = \"เริ่ม\" ซึ่งไม่ห้ามอะไรเลย\n\n```text\ntransition (column c → c+1):\n   ways_next[r + Δ(e)][e] += ways[r][d]      for every door e ≠ d,\n                                             Δ(X) = −1, Δ(Y) = 0, Δ(Z) = +1,\n                                             if the target room is inside and open\n```\n\n:::hint คำใบ้ 1\nถ้าไม่มีกฎประตู การนับเส้นทางทีละคอลัมน์ง่ายมาก เราต้องรู้ข้อมูลอะไรเพิ่มเกี่ยวกับเส้นทาง เพื่อจะรู้ว่าก้าวต่อไปใช้ประตูไหนได้\n:::\n:::hint คำใบ้ 2\nใช้ตัวนับ 4 ตัวต่อห้อง: เข้าทาง X, ทาง Y, ทาง Z หรือ \"เริ่มที่นี่\" แล้วตัวนับแต่ละตัวส่งต่อให้ประตู 2 หรือ 3 บานที่ไม่ซ้ำกับมัน\n:::\n\n## 3. อะไร ทำไม อย่างไร\n- **อะไร:** DP นับจำนวนทีละคอลัมน์ ด้วย state (แถว, ประตูล่าสุด)\n- **ทำไม state นี้พอ:** อนาคต (ประตูไหนใช้ได้ต่อ ห้องไหนไปถึงได้) ขึ้นกับแค่ห้องปัจจุบันและประตูล่าสุด ไม่ขึ้นกับประวัติก่อนหน้า ซึ่งคือเงื่อนไข \"ไม่ต้องจำอดีต\" ที่ state ของ DP ต้องมี\n- **ทำไมการบวกจำนวนถูกต้อง:** รายการห้องสองรายการที่ต่างกันตรงไหนสักที่ จะยังต่างกันเมื่อต่อยาวออกไป การบวกจึงไม่นับซ้ำ\n- **อย่างไร:** cur[r][เริ่ม] = 1 สำหรับทุกห้องเปิดในคอลัมน์ 0 สำหรับ c = 0..C−2 สร้าง nxt จาก cur ด้วย transition ข้างบน แล้วสลับ คำตอบคือผลรวมของ cur[r][d] ทั้งหมดในคอลัมน์สุดท้าย mod 100,000,007\n- **ต้นทุน:** R · C · 4 · 3 ≈ 3 × 10⁶ การอัปเดต หน่วยความจำ: สองคอลัมน์ ขนาด R × 4\n- **mod:** ลดหลังทุกการบวก ค่าอยู่ต่ำกว่า 2 × 10⁸ ปลอดภัยใน `long long`\n\n## 4. โค้ดเฉลย\n{{code}}\n{{tests}}\n\n**ไล่ค่า**: ตัวอย่างที่ 2 ห้อง (แถว, คอลัมน์) เริ่มที่ 0; (0,1) ห้ามเข้า ตัวนับคือ [X, Y, Z, เริ่ม]\n\n| คอลัมน์ | แถว 0 | แถว 1 | หมายเหตุ |\n|---|---|---|---|\n| 0 | [0, 0, 0, 1] | [0, 0, 0, 1] | เริ่มที่ห้องเปิดใดก็ได้ |\n| 1 | ห้ามเข้า | [0, 1, 1, 0] | แถว 0 ไปได้แค่ Z (Y ห้ามเข้า); แถว 1 ไป Y (X ห้ามเข้า) |\n| 2 | [2, 0, 0, 0] | [0, 1, 0, 0] | จาก \"เข้าทาง Z\": X ขึ้น หรือ Y ขวา; จาก \"เข้าทาง Y\": ได้แค่ X ขึ้น (Z ออกนอกตาราง) |\n\nรวม 2 + 1 = **3**\n\n## 5. จุดที่มักพลาด\n- **state ไม่มีประตูล่าสุด:** บังคับกฎไม่ได้\n- **ห้ามประตูซ้ำตั้งแต่ก้าวแรก:** คอลัมน์ 1 ยังไม่มีประตูก่อนหน้า\n- **เริ่มจากห้องห้ามเข้าในคอลัมน์ 1** หรือนับห้องห้ามเข้าในคอลัมน์ C: ห้ามทั้งคู่\n- **mod แค่ตอนท้าย:** จำนวนจริงของ 500 × 500 ใหญ่มหาศาล\n- **recursion ไล่ทุกเส้นทาง:** เอกซ์โพเนนเชียล (แค่ตัวอย่าง 25 × 25 ก็มี 543 ล้านเส้นทาง)\n\n## 6. ความรู้พื้นฐาน\nบทที่ 14 \"ใส่ท่าล่าสุดลงใน state\" คือวิธีมาตรฐานสำหรับกฎแบบ \"ห้ามท่าเดิมสองครั้งติดกัน\" ไอเดียเดียวกันอยู่ในข้อ [table no 11](#a64_q2_table_no_11) ที่ state จำว่าแถวก่อนหน้ามีอะไร การบวกจำนวนจากทุกตัวก่อนหน้าคือรูปแบบของข้อ [chocolate](#a62_q1b_chocolate) ส่วนการเดินผ่านตารางทีละชั้นโดยเลือกจากช่องถัดไปไม่กี่ช่องคือรูปร่างของข้อ [triangle](#ex02m1_triangle)"}}], "intro": {"en": "## Which technique? Read the statement for these signals\n| the statement says … | think of … | chapter |\n|---|---|---|\n| \"print **all** …\", \"in lexicographic order\", n ≤ 10–20 | backtracking | [1 · Brute force](#ch-brute) |\n| \"the k-th smallest\", huge input described by groups | sort + prefix sums + binary search | [2 · Sorting](#ch-sort) |\n| sorted data, \"largest value ≤ x\", n up to 10⁹ with a repeated operation, sizes 2ᵏ | binary search, fast power, recurse on halves | [3 · Divide & conquer](#ch-dc) |\n| \"how many ways … mod M\", \"maximum sum of a route\" | dynamic programming | [4 · DP](#ch-dp) |\n| \"connected\", \"spread\", \"fewest steps\", \"is there a cycle\" | BFS, DFS, union-find | [5 · Graph 1](#ch-graph1) |\n| \"connect everything as cheaply as possible\" | Prim or Kruskal | [6 · MST](#ch-mst) |\n| \"minimum cost from A to B\", negative weights, \"after each new node\" | Dijkstra, Bellman–Ford, Floyd–Warshall | [7 · Shortest paths](#ch-sp) |\n\nStart each chapter with its **primer** (the technique, a code template, how to spot it), then work through the problems in order. Try the two hints on each page before you open the code. Chapter 8 mixes everything, exactly like the exam.", "th": "## ใช้เทคนิคไหนดี ลองหาสัญญาณเหล่านี้ในโจทย์\n| โจทย์พูดว่า … | ให้นึกถึง … | บท |\n|---|---|---|\n| \"พิมพ์ **ทุก** …\", \"เรียงตามพจนานุกรม\", n ≤ 10–20 | backtracking | [1 · Brute force](#ch-brute) |\n| \"ตัวที่ k ที่น้อยที่สุด\", input ใหญ่ที่บรรยายเป็นกลุ่ม | sort + prefix sum + binary search | [2 · การเรียงลำดับ](#ch-sort) |\n| ข้อมูลเรียงแล้ว, \"ค่ามากสุดที่ ≤ x\", n ถึง 10⁹ กับการดำเนินการซ้ำ, ขนาด 2ᵏ | binary search, ยกกำลังเร็ว, เรียกซ้ำบนครึ่ง | [3 · แบ่งแยกและเอาชนะ](#ch-dc) |\n| \"มีกี่วิธี … mod M\", \"ผลรวมมากสุดของเส้นทาง\" | dynamic programming | [4 · DP](#ch-dp) |\n| \"เชื่อมกัน\", \"แพร่\", \"ก้าวน้อยที่สุด\", \"มีวงวนไหม\" | BFS, DFS, union-find | [5 · กราฟ 1](#ch-graph1) |\n| \"เชื่อมทุกอย่างให้ถูกที่สุด\" | Prim หรือ Kruskal | [6 · MST](#ch-mst) |\n| \"ค่าใช้จ่ายน้อยสุดจาก A ไป B\", น้ำหนักติดลบ, \"หลังเพิ่มปมใหม่ทุกครั้ง\" | Dijkstra, Bellman–Ford, Floyd–Warshall | [7 · เส้นทางสั้นสุด](#ch-sp) |\n\nเริ่มแต่ละบทด้วย **บทนำ** (เทคนิค โครงโค้ด และวิธีสังเกต) แล้วทำโจทย์ตามลำดับ ลองคำใบ้สองข้อในแต่ละหน้าก่อนเปิดดูโค้ด บทที่ 8 ผสมทุกอย่างเข้าด้วยกัน เหมือนข้อสอบจริง"}};

const KW = new Set('if else for while do return break continue new delete class struct public private protected template typename const static void auto true false nullptr this namespace using operator sizeof switch case default inline virtual friend NULL'.split(' '));
const TY = new Set('tuple ll Mat Edge int char bool double float long short unsigned size_t string vector list map set queue stack deque pair priority_queue unordered_map unordered_set iterator T node std CP KeyT MappedT ValueT Comp greater less multiset tuple'.split(' '));
function hl(line) {
  let out = '', m;
  const re = /(\/\/.*$)|(^\s*#\w+.*$)|("(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*')|(\b\d+(?:\.\d+)?\b)|([A-Za-z_]\w*)|(\s+)|(.)/g;
  while ((m = re.exec(line))) {
    if (m[1]) out += '<span class="tk-c">' + esc(m[1]) + '</span>';
    else if (m[2]) out += '<span class="tk-d">' + esc(m[2]) + '</span>';
    else if (m[3]) out += '<span class="tk-s">' + esc(m[3]) + '</span>';
    else if (m[4]) out += '<span class="tk-n">' + m[4] + '</span>';
    else if (m[5]) out += KW.has(m[5]) ? '<span class="tk-k">' + m[5] + '</span>' : TY.has(m[5]) ? '<span class="tk-t">' + m[5] + '</span>' : esc(m[5]);
    else if (m[6]) out += m[6];
    else out += (m[7] === '*' || m[7] === '&') ? '<span class="tk-p">' + esc(m[7]) + '</span>' : esc(m[7]);
  }
  return out;
}
function codeBlock(src) {
  // block comments /* */ are rare in our code; handle line by line
  return '<pre class="code">' + src.replace(/\s+$/, '').split('\n').map((l, i) => '<span class="ln"><span class="no">' + (i + 1) + '</span><span>' + (hl(l) || ' ') + '</span></span>').join('') + '</pre>';
}

function inline(s) {
  s = esc(s);
  // keep code spans out of the bold rule (code may contain * such as *this or T*)
  const codes = [];
  s = s.replace(/`([^`]+)`/g, (_, c) => { codes.push('<code>' + c + '</code>'); return '\u0000' + (codes.length - 1) + '\u0000'; });
  s = s.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
  s = s.replace(/\u0000(\d+)\u0000/g, (_, k) => codes[+k]);
  s = s.replace(/\[([^\]]+)\]\((#[^)]+)\)/g, '<a href="$2">$1</a>');
  return s;
}
function md(text, ctx) {

  while (i < lines.length) {
    const ln = lines[i];
    if (/^```/.test(ln)) {
      flush();
      const lang = ln.slice(3).trim(); const buf = []; i++;
      while (i < lines.length && !/^```/.test(lines[i])) buf.push(lines[i++]);
      i++;
      out += lang === 'cpp' ? '<div class="panel">' + codeBlock(buf.join('\n')) + '</div>' : '<pre class="dia">' + esc(buf.join('\n')) + '</pre>';
      continue;
    }
    if (/^:::(hint|note)\b/.test(ln)) {
      flush();
      const m2 = ln.match(/^:::(hint|note)\s*(.*)$/); const buf = []; i++;
      while (i < lines.length && !/^:::\s*$/.test(lines[i])) buf.push(lines[i++]);
      i++;
      const inner = md(buf.join('\n'), { code: '', tests: '', heads: [] });
      out += m2[1] === 'hint' ? '<details class="hint"><summary>' + inline(m2[2] || 'Hint') + '</summary><div class="hb">' + inner + '</div></details>' : '<div class="note">' + inner + '</div>';
      continue;
    }
    if (/^\{\{code\}\}\s*$/.test(ln)) { flush(); out += ctx.code; i++; continue; }
    if (/^\{\{tests\}\}\s*$/.test(ln)) { flush(); out += ctx.tests; i++; continue; }
    let h = ln.match(/^(#{2,3})\s+(.*)$/);
    if (h) { flush(); const lv = h[1].length; const id = lv === 2 ? 's' + (ctx.sec = (ctx.sec || 0) + 1) : ''; if (lv === 2) ctx.heads.push([id, h[2]]); out += '<h' + lv + (id ? ' id="' + id + '"' : '') + '>' + inline(h[2]) + '</h' + lv + '>'; i++; continue; }
    if (/^---\s*$/.test(ln)) { flush(); out += '<hr>'; i++; continue; }
    if (/^\|/.test(ln)) {
      flush(); const rows = [];
      while (i < lines.length && /^\|/.test(lines[i])) rows.push(lines[i++]);
      const cells = r => r.trim().replace(/^\|/, '').replace(/\|$/, '').split(/(?<!\\)\|/).map(c => inline(c.trim().replace(/\\\|/g, '|')));
      let t = '<table><thead><tr>' + cells(rows[0]).map(c => '<th>' + c + '</th>').join('') + '</tr></thead><tbody>';
      rows.slice(/^\|[\s:|-]+\|?\s*$/.test(rows[1] || '') ? 2 : 1).forEach(r => { t += '<tr>' + cells(r).map(c => '<td>' + c + '</td>').join('') + '</tr>'; });
      out += t + '</tbody></table>'; continue;
    }
    if (/^>\s?/.test(ln)) {
      flush(); const buf = [];
      while (i < lines.length && /^>\s?/.test(lines[i])) buf.push(lines[i++].replace(/^>\s?/, ''));
      let cls = '';
      if (/^\[!ok\]/.test(buf[0])) { cls = ' class="ok"'; buf[0] = buf[0].replace(/^\[!ok\]\s*/, ''); }
      else if (/^\[!bad\]/.test(buf[0])) { cls = ' class="bad"'; buf[0] = buf[0].replace(/^\[!bad\]\s*/, ''); }
      out += '<blockquote' + cls + '>' + md(buf.join('\n'), { code: '', tests: '', heads: [] }) + '</blockquote>'; continue;
    }
    if (/^\s*([-*]|\d+\.)\s+/.test(ln)) {
      flush();
      const ordered = /^\s*\d+\./.test(ln);
      let t = ordered ? '<ol>' : '<ul>';
      while (i < lines.length && /^\s*([-*]|\d+\.)\s+/.test(lines[i])) {
        const ind = lines[i].match(/^\s*/)[0].length;
        let item = lines[i].replace(/^\s*([-*]|\d+\.)\s+/, ''); i++;
        // continuation lines (indented, not a new bullet)
        while (i < lines.length && /^\s{2,}\S/.test(lines[i]) && !/^\s*([-*]|\d+\.)\s+/.test(lines[i])) item += ' ' + lines[i++].trim();
        // nested bullets
        let sub = '';
        if (i < lines.length && /^\s+([-*]|\d+\.)\s+/.test(lines[i]) && lines[i].match(/^\s*/)[0].length > ind) {
          const buf = [];
          while (i < lines.length && /^\s+\S/.test(lines[i]) && lines[i].match(/^\s*/)[0].length > ind) buf.push(lines[i++].replace(/^\s{2,4}/, ''));
          sub = md(buf.join('\n'), { code: '', tests: '', heads: [] });
        }
        t += '<li>' + inline(item) + sub + '</li>';
      }
      out += t + (ordered ? '</ol>' : '</ul>'); continue;
    }
    if (/^\s*$/.test(ln)) { flush(); i++; continue; }
    para.push(ln.trim()); i++;
  }
  flush();
  return out;
}

// ---------- state ----------
const PROBS = DATA.problems;
const GROUPS = DATA.groups;
GROUPS.forEach((g, gi) => { g.no = gi + 1; g.probs = PROBS.filter(p => p.group === g.id); g.probs.forEach((p, pi) => p.no = g.no + '.' + (pi + 1)); });
// one reading order: chapter primer, its problems, next primer, ...
const SEQ = [];
GROUPS.forEach(g => { SEQ.push({ kind: 'ch', g, id: 'ch-' + g.id }); g.probs.forEach(p => SEQ.push({ kind: 'p', p, id: p.id })); });
const seqTitle = s => s.kind === 'ch' ? tr(UI.chapter) + ' ' + s.g.no + ' · ' + tr(s.g.title) : s.p.no + ' · ' + tr(s.p.title);
const KEY = 'fdag-';
let DONE = {};
try { DONE = JSON.parse(localStorage.getItem(KEY + 'done') || '{}'); } catch (e) { }
const saveDone = () => { try { localStorage.setItem(KEY + 'done', JSON.stringify(DONE)); } catch (e) { } };
let QUERY = '';
const stars = n => '★'.repeat(n) + '☆'.repeat(Math.max(0, 3 - n));
const matches = p => !QUERY || (p.id + ' ' + p.title.en + ' ' + p.title.th + ' ' + (p.tags || []).join(' ') + ' ' + p.blurb.en + ' ' + p.blurb.th).toLowerCase().includes(QUERY);

function pager(id) {
  const i = SEQ.findIndex(s => s.id === id);
  const pv = SEQ[i - 1], nx = SEQ[i + 1];
  return '<div class="pager">' + (pv ? '<a href="#' + pv.id + '"><small>← ' + tr(UI.prev) + '</small>' + esc(seqTitle(pv)) + '</a>' : '<span></span>') +
    (nx ? '<a class="next" href="#' + nx.id + '"><small>' + tr(UI.next) + ' →</small>' + esc(seqTitle(nx)) + '</a>' : '<span></span>') + '</div>';
}

function renderSide(cur) {
  let h = '<a class="home-link" href="#home"' + (cur ? '' : ' aria-current="page"') + '>' + tr(UI.home) + '</a>';
  GROUPS.forEach(g => {
    const ps = g.probs.filter(matches);
    if (QUERY && !ps.length) return;
    const nd = g.probs.filter(p => DONE[p.id]).length;
    h += '<a class="chap" href="#ch-' + g.id + '"' + (cur === 'ch-' + g.id ? ' aria-current="page"' : '') + '><span class="cn">' + g.no + '</span><span>' + esc(tr(g.title)) + '<span class="id">' + esc(tr(g.sub)) + '</span></span><span class="cp">' + nd + '/' + g.probs.length + '</span></a>';
    ps.forEach(p => {
      h += '<a class="pl" href="#' + p.id + '"' + (cur === p.id ? ' aria-current="page"' : '') + '><span class="dn">' + (DONE[p.id] ? '✓' : p.no) + '</span><span>' + esc(tr(p.title)) + '<span class="id">' + p.id + '</span></span><span class="st">' + stars(p.stars) + '</span></a>';
    });
  });
  if (QUERY && !PROBS.some(matches)) h += '<p class="empty" style="padding:10px">' + tr(UI.noRes) + '</p>';
  document.getElementById('side').innerHTML = h;
  const a = document.querySelector('.side a[aria-current="page"]');
  if (a && a.scrollIntoViewIfNeeded) a.scrollIntoViewIfNeeded();
}

function card(p) {
  return '<a class="card' + (DONE[p.id] ? ' done' : '') + '" href="#' + p.id + '"><span class="k">' + p.no + ' · ' + p.id + (DONE[p.id] ? ' · ✓' : '') + '</span><span class="t">' + esc(tr(p.title)) + '</span><span class="s">' + inline(tr(p.blurb)) + '</span><span class="m"><span class="st">' + stars(p.stars) + '</span>' + (p.complexity ? '<code>' + esc(p.complexity) + '</code>' : '') + '</span></a>';
}

function renderHome() {
  const nDone = PROBS.filter(p => DONE[p.id]).length;
  let h = '<div class="page"><div class="hero"><p class="kicker">2110327 · DataAlgo grader</p><h1>' + tr(UI.brand) + '</h1><p class="lede">' + tr(UI.lede) + '</p></div>';
  h += '<div class="stats"><div class="stat"><b>' + PROBS.length + '</b>' + tr(UI.problems) + '</div><div class="stat"><b>' + GROUPS.length + '</b>' + tr(UI.chapters) + '</div><div class="stat"><b>' + PROBS.filter(p => p.tests).length + '</b>' + tr(UI.tested) + '</div><div class="stat"><b>' + nDone + '</b>' + tr(UI.done) + '</div></div>';
  h += '<p class="mono" style="font-size:12.5px;color:var(--muted)"><b>' + tr(UI.how) + ':</b> ' + tr(UI.howList) + '</p>';
  if (DATA.intro) h += '<div class="md">' + md(tr(DATA.intro), { code: '', tests: '', heads: [] }) + '</div>';
  GROUPS.forEach(g => {
    const ps = g.probs.filter(matches);
    if (QUERY && !ps.length) return;
    h += '<section class="grp"><h2><a href="#ch-' + g.id + '"><span class="chno">' + g.no + '</span>' + esc(tr(g.title)) + '</a></h2><p class="gs">' + esc(tr(g.sub)) + ' · <a href="#ch-' + g.id + '">' + tr(UI.readPrimer) + ' →</a></p><div class="cards">';
    ps.forEach(p => { h += card(p); });
    h += '</div></section>';
  });
  return h + '</div>';
}

function renderChapter(g) {
  const ctx = { code: '', tests: '', heads: [] };
  const body = md(tr(g.intro) || '', ctx);
  let h = '<div class="page">';
  h += '<div class="crumbs"><a href="#home">' + tr(UI.home) + '</a><span>' + tr(UI.chapter) + ' ' + g.no + '</span><span>' + tr(UI.primer) + '</span></div>';
  h += '<h1 class="ptitle"><span class="chno big">' + g.no + '</span>' + esc(tr(g.title)) + '</h1><p class="lede2">' + esc(tr(g.sub)) + '</p>';
  if (ctx.heads.length) h += '<nav class="toc">' + ctx.heads.map(([id, t]) => '<a href="#ch-' + g.id + '/' + id + '">' + inline(t.replace(/^\d+\.\s*/, '')) + '</a>').join('') + '</nav>';
  h += '<article class="md">' + body + '</article>';
  h += '<section class="grp"><h2>' + tr(UI.inThis) + '</h2><div class="cards">' + g.probs.map(card).join('') + '</div></section>';
  return h + pager('ch-' + g.id) + '</div>';
}

function renderProblem(p) {
  const g = GROUPS.find(x => x.id === p.group);
  const files = p.files.map(f =>
    '<div class="panel"><div class="ph">' + tr(UI.code) + ' <span class="sub">' + esc(f.name) + '</span><button class="iconbtn copybtn" data-f="' + esc(f.name) + '">' + tr(UI.copy) + '</button></div>' + codeBlock(f.src) + '</div>').join('');
  const tests = p.tests ? '<div class="tests"><b>' + tr(UI.tests) + ':</b> ' + inline(tr(p.tests)) + '</div>' : '';
  const ctx = { code: files, tests, heads: [] };
  const body = md(tr(p.body) || '', ctx);
  let h = '<div class="page">';
  h += '<div class="crumbs"><a href="#ch-' + g.id + '">' + tr(UI.chapter) + ' ' + g.no + ' · ' + esc(tr(g.title)) + '</a><span>' + tr(UI.lesson) + ' ' + esc(p.lesson) + '</span><span>' + p.id + '</span></div>';
  h += '<h1 class="ptitle"><span class="pno">' + p.no + '</span>' + esc(tr(p.title)) + '</h1>';
  h += '<div class="tags"><span class="tag kind">' + (p.kind === 'program' ? tr(UI.kindProg) : tr(UI.submit) + ' ' + esc(p.kind)) + '</span><span class="tag stars">' + stars(p.stars) + '</span>' + (p.complexity ? '<span class="tag cx">' + esc(p.complexity) + '</span>' : '') + (p.tags || []).map(t => '<span class="tag">' + esc(t) + '</span>').join('') + '</div>';
  h += '<nav class="toc">' + ctx.heads.map(([id, t]) => '<a href="#' + p.id + '/' + id + '">' + inline(t.replace(/^\d+\.\s*/, '')) + '</a>').join('') + '<button class="donebtn" id="donebtn" aria-pressed="' + (DONE[p.id] ? 'true' : 'false') + '">' + (DONE[p.id] ? tr(UI.isDone) : tr(UI.markDone)) + '</button></nav>';
  h += '<article class="md">' + body + '</article>';
  return h + pager(p.id) + '</div>';
}

function route() {
  const hash = decodeURIComponent(location.hash.slice(1));
  const [id, sec] = hash.split('/');
  const p = PROBS.find(x => x.id === id);
  const g = id && id.startsWith('ch-') ? GROUPS.find(x => 'ch-' + x.id === id) : null;
  const main = document.getElementById('main');
  main.innerHTML = p ? renderProblem(p) : g ? renderChapter(g) : renderHome();
  renderSide(p ? p.id : g ? id : null);
  document.title = (p ? p.no + ' ' + tr(p.title) + ' · ' : g ? tr(g.title) + ' · ' : '') + tr(UI.brand);
  document.getElementById('side').classList.remove('open');
  document.querySelectorAll('.copybtn').forEach(b => b.onclick = () => {
    const f = p.files.find(x => x.name === b.dataset.f);
    navigator.clipboard && navigator.clipboard.writeText(f.src).then(() => { b.textContent = tr(UI.copied); setTimeout(() => b.textContent = tr(UI.copy), 1500); });
  });
  const db = document.getElementById('donebtn');
  if (p && db) db.onclick = () => { DONE[p.id] = !DONE[p.id]; if (!DONE[p.id]) delete DONE[p.id]; saveDone(); db.setAttribute('aria-pressed', DONE[p.id] ? 'true' : 'false'); db.textContent = DONE[p.id] ? tr(UI.isDone) : tr(UI.markDone); renderSide(p.id); };
  if (sec) { const el = document.getElementById(sec); if (el) el.scrollIntoView(); } else window.scrollTo(0, 0);
}

function setLang(l) {
  LANG = l;
  try { localStorage.setItem(KEY + 'lang', l); } catch (e) { }
  document.documentElement.lang = l === 'th' ? 'th' : 'en';
  document.querySelectorAll('#lang button').forEach(b => b.setAttribute('aria-pressed', b.dataset.l === l ? 'true' : 'false'));
  document.getElementById('brandtxt').textContent = tr(UI.brandShort);
  document.getElementById('q').placeholder = tr(UI.search);
  document.getElementById('menubtn').textContent = tr(UI.menu);
  const y = window.scrollY; route(); if (location.hash.split('/').length < 2) window.scrollTo(0, y);
}
function setTheme(t) {
  if (t) document.documentElement.setAttribute('data-theme', t); else document.documentElement.removeAttribute('data-theme');
  try { localStorage.setItem(KEY + 'theme', t || ''); } catch (e) { }
}
(function init() {
  try { const l = localStorage.getItem(KEY + 'lang'); if (l) LANG = l; const t = localStorage.getItem(KEY + 'theme'); if (t) setTheme(t); } catch (e) { }
  document.querySelectorAll('#lang button').forEach(b => b.onclick = () => setLang(b.dataset.l));
  document.getElementById('theme').onclick = () => {
    const cur = document.documentElement.getAttribute('data-theme');
    const dark = cur ? cur === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
    setTheme(dark ? 'light' : 'dark');
  };
  document.getElementById('menubtn').onclick = () => document.getElementById('side').classList.toggle('open');
  document.getElementById('q').oninput = e => { QUERY = e.target.value.trim().toLowerCase(); const hash = location.hash.slice(1).split('/')[0]; if (!hash || hash === 'home') route(); else renderSide(hash); };
  window.addEventListener('hashchange', route);
  setLang(LANG);
})();
</script>
