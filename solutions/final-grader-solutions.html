le says \"เมืองใกล้สุด\" (nearest city), but the explanation and the sample both ask for the **largest** shortest distance.\n\n## 2. What it really means\n\"Shortest distance from one source, positive weights\" is exactly **Dijkstra**. Then take the maximum over all cities, and check that none is still ∞.\n\n```text\nroads in the sample (from → to : length)\n   1 → 2 : 1      2 → 3 : 2      3 → 4 : 4      4 → 2 : 4      5 → 4 : 4\n   1 → 5 : 7      2 → 4 : 3                     4 → 3 : 2\n                  2 → 5 : 5\n\nshortest distances from city 1\n   city 2 : 1    (1 → 2)\n   city 3 : 3    (1 → 2 → 3)\n   city 4 : 4    (1 → 2 → 4)\n   city 5 : 6    (1 → 2 → 5, cheaper than the direct road of 7)   ← farthest\n```\n\n:::hint Hint 1\nThe input is already a matrix with up to 1,000,000 entries. Which Dijkstra suits a matrix best?\n:::\n:::hint Hint 2\nUse the O(N²) version: each round, scan all N cities for the closest unfinished one. No heap needed.\n:::\n\n## 3. What, why, how\n- **What:** Dijkstra, array (dense) version.\n- **Why Dijkstra:** all road lengths are positive. Then the unfinished city with the smallest tentative distance can never be improved later: any other route would go through a city that is at least as far already.\n- **Why the dense version:** reading the matrix already costs N². A heap would add a log factor and an edge list, and gains nothing when E can be close to N².\n- **How:** dist[0] = 0, others ∞. N rounds: pick the unfinished u with the smallest finite dist (stop if none), mark it done, and relax every v with w[u][v] > 0. At the end, any ∞ → print −1; otherwise print the max.\n- **Sizes:** a path can have 999 roads of length < 10⁶: under 10⁹, so `int` would just fit, but `long long` costs nothing here.\n\n## 4. Solution\n{{code}}\n{{tests}}\n\n**Trace**: the sample (cities numbered 1..5 as in the PDF; ∞ = not reached yet).\n\n| round | finalise | dist after relaxing (1 2 3 4 5) |\n|---|---|---|\n| 1 | city 1 (0) | 0 1 ∞ ∞ 7 |\n| 2 | city 2 (1) | 0 1 3 4 6 |\n| 3 | city 3 (3) | 0 1 3 4 6 |\n| 4 | city 4 (4) | 0 1 3 4 6 |\n| 5 | city 5 (6) | 0 1 3 4 6 |\n\nNo ∞ remains, the largest is **6**.\n\n## 5. Traps\n- **Treating −1 as an edge of length −1:** only positive entries are roads. The code tests `w[u][v] > 0`, which also skips the diagonal 0.\n- **Printing the nearest city:** the title misleads; the sample's answer is the largest distance.\n- **Forgetting the −1 case:** one unreachable city makes the whole answer −1.\n- **Picking an unreached city (dist = ∞) as u:** guard it, or stop when no finite dist is left.\n- **Reading the matrix with slow `cin`:** a million numbers; use `scanf` or fast I/O.\n\n## 6. Background\nLesson 17. Dijkstra comes in two shapes: **dense** O(V²) with a matrix, as here, and **heap** O(E log V) with adjacency lists, as in [Columbia](#ex06e3_columbia) and [Hacking](#a58_q3_p3a_hacking). With negative edges Dijkstra breaks: see [Shortest path](#ex06e2_shortest) for Bellman–Ford. The dense loop is the same shape as Prim in [Cable company](#ex06e1_cable).", "th": "## 1. โจทย์บอกอะไร\nประเทศอัลกอมี N เมือง (2 ≤ N ≤ 1,000) และถนน **ทางเดียว** จาก a ไป b อย่างมากหนึ่งเส้น แต่ละเส้นยาวเป็นจำนวนเต็มบวก < 1,000,000 ระยะทางจากเมืองหลวง (เมือง 1) ไปเมือง c คือความยาวของเส้นทางที่ **สั้นที่สุด** input เป็น adjacency matrix ขนาด N × N: ช่อง (i, j) คือถนน i → j **−1** คือไม่มีถนน และแนวทแยงเป็น 0\n\nให้พิมพ์ระยะทางจากเมืองหลวงไปเมืองที่ **ไกลที่สุด** คือค่ามากที่สุดของระยะสั้นสุดเหล่านี้ ถ้ามีเมือง **ใดก็ได้** ที่ไปไม่ถึง ให้พิมพ์ **−1**\n\nตัวอย่าง → **6** (ระยะ 1, 3, 4, 6 ไปเมือง 2, 3, 4, 5)\n\n> ชื่อภาษาไทยเขียนว่า \"เมืองใกล้สุด\" แต่คำอธิบายและตัวอย่างถามหาระยะสั้นสุดที่ **มากที่สุด**\n\n## 2. จริง ๆ แล้วถามอะไร\n\"ระยะสั้นสุดจากจุดเริ่มเดียว น้ำหนักเป็นบวก\" คือ **Dijkstra** พอดี แล้วหาค่ามากสุดจากทุกเมือง และเช็กว่าไม่มีเมืองไหนยังเป็น ∞\n\n```text\nroads in the sample (from → to : length)\n   1 → 2 : 1      2 → 3 : 2      3 → 4 : 4      4 → 2 : 4      5 → 4 : 4\n   1 → 5 : 7      2 → 4 : 3                     4 → 3 : 2\n                  2 → 5 : 5\n\nshortest distances from city 1\n   city 2 : 1    (1 → 2)\n   city 3 : 3    (1 → 2 → 3)\n   city 4 : 4    (1 → 2 → 4)\n   city 5 : 6    (1 → 2 → 5, cheaper than the direct road of 7)   ← farthest\n```\n\n:::hint คำใบ้ 1\ninput เป็นเมทริกซ์อยู่แล้ว ถึง 1,000,000 ช่อง Dijkstra แบบไหนเหมาะกับเมทริกซ์ที่สุด\n:::\n:::hint คำใบ้ 2\nใช้แบบ O(N²): ทุกรอบไล่ดูทั้ง N เมืองเพื่อหาเมืองที่ยังไม่เสร็จและใกล้ที่สุด ไม่ต้องใช้ heap\n:::\n\n## 3. อะไร ทำไม อย่างไร\n- **อะไร:** Dijkstra แบบอาร์เรย์ (หนาแน่น)\n- **ทำไม Dijkstra:** ถนนทุกเส้นยาวเป็นบวก เมืองที่ยังไม่เสร็จและมีระยะชั่วคราวน้อยที่สุดจะไม่มีทางถูกปรับให้ดีขึ้นอีก เพราะเส้นทางอื่นต้องผ่านเมืองที่ไกลอย่างน้อยเท่ากันอยู่แล้ว\n- **ทำไมแบบหนาแน่น:** แค่อ่านเมทริกซ์ก็ใช้ N² แล้ว heap จะเพิ่ม log และต้องมีรายการเส้น โดยไม่ได้อะไรเพิ่มเมื่อ E เกือบเท่า N²\n- **อย่างไร:** dist[0] = 0 ที่เหลือ ∞ ทำ N รอบ: เลือก u ที่ยังไม่เสร็จและ dist จำกัดน้อยที่สุด (หยุดถ้าไม่มี) ทำเครื่องหมายว่าเสร็จ แล้ว relax ทุก v ที่ w[u][v] > 0 สุดท้ายถ้ามี ∞ → พิมพ์ −1 ไม่อย่างนั้นพิมพ์ค่ามากสุด\n- **ขนาด:** เส้นทางมีถนนได้ 999 เส้น แต่ละเส้น < 10⁶: ต่ำกว่า 10⁹ `int` พอดีใส่ได้ แต่ `long long` ไม่เสียอะไรในข้อนี้\n\n## 4. โค้ดเฉลย\n{{code}}\n{{tests}}\n\n**ไล่ค่า**: ตัวอย่าง (ใช้เลขเมือง 1..5 ตาม PDF; ∞ = ยังไปไม่ถึง)\n\n| รอบ | ปิดเมือง | dist หลัง relax (1 2 3 4 5) |\n|---|---|---|\n| 1 | เมือง 1 (0) | 0 1 ∞ ∞ 7 |\n| 2 | เมือง 2 (1) | 0 1 3 4 6 |\n| 3 | เมือง 3 (3) | 0 1 3 4 6 |\n| 4 | เมือง 4 (4) | 0 1 3 4 6 |\n| 5 | เมือง 5 (6) | 0 1 3 4 6 |\n\nไม่มี ∞ เหลือ ค่ามากสุดคือ **6**\n\n## 5. จุดที่มักพลาด\n- **มอง −1 เป็นเส้นยาว −1:** เฉพาะค่าบวกเท่านั้นที่เป็นถนน โค้ดเช็ก `w[u][v] > 0` ซึ่งข้ามแนวทแยงที่เป็น 0 ด้วย\n- **พิมพ์เมืองที่ใกล้ที่สุด:** ชื่อโจทย์ชวนให้หลง คำตอบของตัวอย่างคือระยะที่มากที่สุด\n- **ลืมกรณี −1:** เมืองเดียวที่ไปไม่ถึงทำให้คำตอบทั้งหมดเป็น −1\n- **เลือกเมืองที่ยังไปไม่ถึง (dist = ∞) เป็น u:** ต้องกันไว้ หรือหยุดเมื่อไม่มี dist จำกัดเหลือ\n- **อ่านเมทริกซ์ด้วย `cin` ที่ช้า:** ล้านตัวเลข ใช้ `scanf` หรือ fast I/O\n\n## 6. ความรู้พื้นฐาน\nบทที่ 17 Dijkstra มีสองแบบ: **หนาแน่น** O(V²) กับเมทริกซ์ แบบข้อนี้ และ **heap** O(E log V) กับ adjacency list แบบข้อ [Columbia](#ex06e3_columbia) และ [Hacking](#a58_q3_p3a_hacking) ถ้ามีเส้นติดลบ Dijkstra ใช้ไม่ได้: ดูข้อ [Shortest path](#ex06e2_shortest) ที่ใช้ Bellman–Ford ลูปแบบหนาแน่นมีรูปเดียวกับ Prim ในข้อ [บริษัทสายเคเบิล](#ex06e1_cable)"}}, {"id": "ex06e3_columbia", "group": "sp", "lesson": "17 · Shortest paths: Dijkstra (heap) on a grid", "stars": 2, "complexity": "O(RC · log(RC))", "kind": "program", "tags": ["Dijkstra with a heap", "grid graph", "cost on the cell you enter"], "title": {"en": "Columbia", "th": "เมืองโคลัมเบีย (Columbia)"}, "blurb": {"en": "Entering each block of a grid city costs that block's fee. Print the cheapest cost from the top-left block to every block: Dijkstra on a grid, where each edge's weight is the fee of the cell it enters.", "th": "การเข้าแต่ละบล็อกของเมืองตารางต้องจ่ายค่าผ่านของบล็อกนั้น พิมพ์ค่าใช้จ่ายถูกที่สุดจากบล็อกมุมซ้ายบนไปทุกบล็อก: Dijkstra บนตาราง โดยน้ำหนักของเส้นคือค่าผ่านของช่องที่เดินเข้าไป"}, "tests": {"en": "the PDF sample and a 1×1 city; 300 random grids (up to 6×6, fees 0..9) against a Bellman–Ford-style relaxation in Python; 400 × 500 = 200,000 blocks in 0.04 s.", "th": "ตัวอย่างใน PDF และเมือง 1×1; สุ่มตาราง 300 ชุด (ถึง 6×6 ค่าผ่าน 0..9) เทียบกับการ relax แบบ Bellman–Ford ใน Python; 400 × 500 = 200,000 บล็อก ใช้ 0.04 วินาที"}, "files": [{"name": "main.cpp", "src": "#include <cstdio>\n#include <vector>\n#include <queue>\nusing namespace std;\n\nint main() {\n    int R, C;\n    if (scanf(\"%d %d\", &R, &C) != 2) return 0;\n    vector<vector<int>> fee(R, vector<int>(C));\n    // read the entrance fee of every block, row by row\n    for (int r = 0; r < R; r++)\n        for (int c = 0; c < C; c++)\n            if (scanf(\"%d\", &fee[r][c]) != 1) return 0;\n\n    // Dijkstra on the grid: entering block (r, c) costs fee[r][c].\n    // So the \"edge\" into a block weighs that block's fee.\n    const int INF = 2e9;\n    vector<vector<int>> dist(R, vector<int>(C, INF));\n    // min-heap of (distance, r, c)\n    priority_queue<tuple<int,int,int>, vector<tuple<int,int,int>>, greater<tuple<int,int,int>>> pq;\n    dist[0][0] = 0;                          // our own block is free\n    pq.push({0, 0, 0});\n    const int dr[4] = {-1, 1, 0, 0}, dc[4] = {0, 0, -1, 1};\n    // pop blocks in increasing order of cost\n    while (!pq.empty()) {\n        auto [d, r, c] = pq.top(); pq.pop();\n        if (d > dist[r][c]) continue;        // an old, outdated entry: skip it\n        // the 4 neighbouring blocks: up, down, left, right\n        for (int k = 0; k < 4; k++) {\n            int nr = r + dr[k], nc = c + dc[k];\n            if (nr < 0 || nr >= R || nc < 0 || nc >= C) continue;\n            int nd = d + fee[nr][nc];\n            if (nd < dist[nr][nc]) {\n                dist[nr][nc] = nd;\n                pq.push({nd, nr, nc});\n            }\n        }\n    }\n    // print the R x C table of minimum costs\n    for (int r = 0; r < R; r++) {\n        for (int c = 0; c < C; c++) printf(c ? \" %d\" : \"%d\", dist[r][c]);\n        printf(\"\\n\");\n    }\n}\n"}], "body": {"en": "## 1. What the problem says\nThe city is an R × C grid of blocks (R · C ≤ 200,000). To **enter** a block you pay its fee (0..1,000). You live in the **top-left** block and do not pay for it. You may move up, down, left or right. Print an R × C table: the minimum total fee to reach each block.\n\nSample (4 × 4):\n\n```text\nfees          answer\n1 1 1 1       0 1 2  3\n9 8 7 1       9 9 9  4\n1 1 1 1       8 7 6  5\n1 2 4 9       9 9 10 14\n```\n\n## 2. What it really means\nMake every block a node and join side-sharing blocks. Moving from a to b costs fee[b], so each **directed** edge a → b has weight **fee[b]**. All weights are ≥ 0: single-source shortest paths with non-negative weights is **Dijkstra**.\n\nLook at block (1, 0), fee 9: going straight down costs 9, but the detour around the top row and back along row 2 costs 1+1+1+1+1+1+1+1+1 = 9 too. Dijkstra simply tries everything in the right order.\n\n:::hint Hint 1\nBFS is not enough: fees differ, so \"fewest steps\" is not \"cheapest\". What do you use when edges have different non-negative weights?\n:::\n:::hint Hint 2\nYou never need an edge list. From cell (r, c) the 4 neighbours are computed on the spot, and the weight is the fee of the neighbour.\n:::\n\n## 3. What, why, how\n- **What:** Dijkstra with a min-heap (priority queue) of (distance, r, c), lazy deletion.\n- **Why it works with a cost on the cell:** a \"vertex cost\" is just an edge cost on every edge *into* that vertex. Fees are ≥ 0, so Dijkstra's greedy choice is safe (zero fees are fine; only negative ones break it).\n- **Why a heap, not the O(V²) scan:** V = 200,000, so V² = 4 × 10¹⁰ is far too slow. The graph is sparse (≤ 4 edges per node), so the heap gives O(V log V).\n- **How:** dist = ∞, dist[0][0] = 0, push (0, 0, 0). Pop (d, r, c); if d > dist[r][c] it is an outdated copy: skip. Otherwise for each neighbour (nr, nc): nd = d + fee[nr][nc]; if better, store and push.\n- **Lazy deletion:** instead of a \"decrease key\", push a new pair and ignore old ones when they come out. The heap may hold up to about 4V entries: still fine.\n\n## 4. Solution\n{{code}}\n{{tests}}\n\n**Trace**: the order Dijkstra finalises the 16 blocks of the sample (distance, row, column):\n\n| pops 1–8 | pops 9–16 |\n|---|---|\n| 0 (0,0) | 8 (2,0) |\n| 1 (0,1) | 9 (1,0) |\n| 2 (0,2) | 9 (1,1) |\n| 3 (0,3) | 9 (1,2) |\n| 4 (1,3) | 9 (3,0) |\n| 5 (2,3) | 9 (3,1) |\n| 6 (2,2) | 10 (3,2) |\n| 7 (2,1) | **14** (3,3) |\n\nThe cheap path goes along the top, down the right column, and back left along row 2. (3,3) costs 5 + 9 = 14 from (2,3), but 10 + 9 = 19 from (3,2).\n\n## 5. Traps\n- **Paying for the start block:** dist[0][0] = 0.\n- **Putting the fee on the cell you leave instead of the one you enter:** gives wrong numbers, e.g. (0,1) would cost 1 from the start's fee.\n- **BFS or DP that only moves right/down:** the cheapest route can go up and left (see row 2 in the sample).\n- **No outdated-entry check:** still correct, but much slower.\n- **Output format:** one row per line, numbers separated by single spaces.\n\n## 6. Background\nLesson 17. Grids are graphs with implicit edges; the same 4-direction loop is used in [Pandemic](#a62_q2a_pandemic) (BFS, all weights 1). When the cost is on the vertex, Dijkstra still works: see also [Hacking](#a58_q3_p3a_hacking), which adds many sources. Compare with dense Dijkstra in [Farthest](#a61_q2_farthest).", "th": "## 1. โจทย์บอกอะไร\nเมืองเป็นตารางบล็อก R × C (R · C ≤ 200,000) การ **เข้า** บล็อกหนึ่งต้องจ่ายค่าผ่านของบล็อกนั้น (0..1,000) เราอยู่บล็อก **มุมซ้ายบน** และไม่ต้องจ่ายค่าบล็อกตัวเอง เดินได้ บน ล่าง ซ้าย ขวา ให้พิมพ์ตาราง R × C: ค่าผ่านรวมน้อยที่สุดเพื่อไปถึงแต่ละบล็อก\n\nตัวอย่าง (4 × 4):\n\n```text\nfees          answer\n1 1 1 1       0 1 2  3\n9 8 7 1       9 9 9  4\n1 1 1 1       8 7 6  5\n1 2 4 9       9 9 10 14\n```\n\n## 2. จริง ๆ แล้วถามอะไร\nให้ทุกบล็อกเป็นปม และต่อบล็อกที่มีด้านติดกัน การเดินจาก a ไป b เสีย fee[b] ดังนั้นเส้น **มีทิศ** a → b มีน้ำหนัก **fee[b]** น้ำหนักทุกเส้น ≥ 0: ระยะสั้นสุดจากจุดเดียวที่น้ำหนักไม่ติดลบคือ **Dijkstra**\n\nลองดูบล็อก (1, 0) ค่าผ่าน 9: เดินลงตรง ๆ เสีย 9 ส่วนทางอ้อมไปตามแถวบนแล้วกลับมาตามแถว 2 เสีย 1+1+1+1+1+1+1+1+1 = 9 เท่ากัน Dijkstra แค่ลองทุกทางตามลำดับที่ถูกต้อง\n\n:::hint คำใบ้ 1\nBFS ไม่พอ: ค่าผ่านไม่เท่ากัน \"ก้าวน้อยสุด\" จึงไม่ใช่ \"ถูกที่สุด\" ถ้าเส้นมีน้ำหนักไม่ติดลบที่ต่างกัน เราใช้อะไร\n:::\n:::hint คำใบ้ 2\nไม่ต้องมีรายการเส้นเลย จากช่อง (r, c) เพื่อนบ้าน 4 ช่องคำนวณได้ทันที และน้ำหนักคือค่าผ่านของเพื่อนบ้าน\n:::\n\n## 3. อะไร ทำไม อย่างไร\n- **อะไร:** Dijkstra ที่ใช้ min-heap (priority queue) ของ (ระยะ, r, c) พร้อมการลบแบบขี้เกียจ (lazy deletion)\n- **ทำไมใช้ได้เมื่อค่าอยู่ที่ช่อง:** \"ค่าของปม\" ก็คือค่าบนทุกเส้นที่ *เข้า* ปมนั้น ค่าผ่าน ≥ 0 การเลือกแบบละโมบของ Dijkstra จึงปลอดภัย (ค่า 0 ไม่เป็นไร มีแค่ค่าติดลบที่ทำให้พัง)\n- **ทำไมใช้ heap ไม่ใช่การไล่ O(V²):** V = 200,000 ดังนั้น V² = 4 × 10¹⁰ ช้าเกินไป กราฟเบาบาง (≤ 4 เส้นต่อปม) heap จึงให้ O(V log V)\n- **อย่างไร:** dist = ∞, dist[0][0] = 0 ใส่ (0, 0, 0) ดึง (d, r, c); ถ้า d > dist[r][c] แปลว่าเป็นสำเนาเก่า ข้ามไป ไม่อย่างนั้นสำหรับเพื่อนบ้าน (nr, nc): nd = d + fee[nr][nc]; ถ้าดีกว่า เก็บแล้วใส่ heap\n- **ลบแบบขี้เกียจ:** แทนที่จะ \"ลดค่า key\" ให้ใส่คู่ใหม่ไปเลย แล้วข้ามคู่เก่าตอนมันออกมา heap อาจมีถึงราว 4V รายการ ก็ยังไหว\n\n## 4. โค้ดเฉลย\n{{code}}\n{{tests}}\n\n**ไล่ค่า**: ลำดับที่ Dijkstra ปิด 16 บล็อกของตัวอย่าง (ระยะ, แถว, คอลัมน์):\n\n| ดึงครั้งที่ 1–8 | ดึงครั้งที่ 9–16 |\n|---|---|\n| 0 (0,0) | 8 (2,0) |\n| 1 (0,1) | 9 (1,0) |\n| 2 (0,2) | 9 (1,1) |\n| 3 (0,3) | 9 (1,2) |\n| 4 (1,3) | 9 (3,0) |\n| 5 (2,3) | 9 (3,1) |\n| 6 (2,2) | 10 (3,2) |\n| 7 (2,1) | **14** (3,3) |\n\nทางที่ถูกไปตามแถวบน ลงคอลัมน์ขวา แล้ววกกลับซ้ายตามแถว 2 ช่อง (3,3) เสีย 5 + 9 = 14 ถ้ามาจาก (2,3) แต่เสีย 10 + 9 = 19 ถ้ามาจาก (3,2)\n\n## 5. จุดที่มักพลาด\n- **จ่ายค่าบล็อกเริ่มต้น:** dist[0][0] = 0\n- **คิดค่าผ่านที่ช่องที่ออก แทนช่องที่เข้า:** ได้ตัวเลขผิด เช่น (0,1) จะเสีย 1 จากค่าของช่องเริ่ม\n- **BFS หรือ DP ที่เดินได้แค่ขวา/ลง:** ทางที่ถูกที่สุดอาจเดินขึ้นและไปทางซ้าย (ดูแถว 2 ในตัวอย่าง)\n- **ไม่เช็กสำเนาเก่า:** ยังถูกต้อง แต่ช้าลงมาก\n- **รูปแบบผลลัพธ์:** หนึ่งแถวต่อหนึ่งบรรทัด คั่นตัวเลขด้วยช่องว่างหนึ่งช่อง\n\n## 6. ความรู้พื้นฐาน\nบทที่ 17 ตารางคือกราฟที่มีเส้นแบบแฝง ลูป 4 ทิศแบบเดียวกันใช้ในข้อ [Pandemic](#a62_q2a_pandemic) (BFS น้ำหนักเป็น 1 หมด) เมื่อค่าอยู่ที่ปม Dijkstra ก็ยังใช้ได้: ดูข้อ [Hacking](#a58_q3_p3a_hacking) ที่เพิ่มจุดเริ่มหลายจุด เทียบกับ Dijkstra แบบหนาแน่นในข้อ [Farthest](#a61_q2_farthest)"}}, {"id": "a58_q3_p3a_hacking", "group": "sp", "lesson": "17 · Shortest paths: multi-source Dijkstra", "stars": 3, "complexity": "O((n + m) log n)", "kind": "program", "tags": ["multi-source Dijkstra", "vertex weights", "max of shortest times"], "title": {"en": "Hacking", "th": "แฮกเครือข่าย (Hacking)"}, "blurb": {"en": "A virus starts on k servers; breaking into server i takes c[i] seconds, then it spreads along cables. When has every server fallen? Multi-source Dijkstra with the cost on the vertex, then take the maximum.", "th": "ไวรัสเริ่มที่เซิร์ฟเวอร์ k เครื่อง การเจาะเครื่อง i ใช้ c[i] วินาที แล้วแพร่ไปตามสาย เมื่อไหร่ทุกเครื่องจะถูกเจาะ: Dijkstra หลายจุดเริ่มที่ค่าอยู่บนปม แล้วหาค่ามากสุด"}, "tests": {"en": "the 3 PDF samples; 300 random connected graphs (n ≤ 9) against an event simulation in Python; n = 10,000, m = 40,000, k = 50 in 0.01 s.", "th": "ตัวอย่าง 3 ชุดใน PDF; สุ่มกราฟเชื่อมกัน 300 ชุด (n ≤ 9) เทียบกับการจำลองเหตุการณ์ใน Python; n = 10,000, m = 40,000, k = 50 ใช้ 0.01 วินาที"}, "files": [{"name": "main.cpp", "src": "#include <cstdio>\n#include <vector>\n#include <queue>\nusing namespace std;\n\nint main() {\n    int n, m, k;\n    if (scanf(\"%d %d %d\", &n, &m, &k) != 3) return 0;\n    vector<int> start(k);\n    // the k servers attacked first\n    for (int i = 0; i < k; i++) if (scanf(\"%d\", &start[i]) != 1) return 0;\n    vector<int> c(n);\n    // c[i] = seconds needed to break into server i\n    for (int i = 0; i < n; i++) if (scanf(\"%d\", &c[i]) != 1) return 0;\n    vector<vector<int>> adj(n);\n    // the m cables (the PDF text says n-1 lines, but the samples have m lines)\n    for (int i = 0; i < m; i++) {\n        int a, b;\n        if (scanf(\"%d %d\", &a, &b) != 2) return 0;\n        adj[a].push_back(b);\n        adj[b].push_back(a);\n    }\n    // t[v] = earliest time server v is hacked.\n    // An attacked-first server falls at time c[s]; from an infected u, a neighbour v\n    // falls at t[u] + c[v]. That is Dijkstra where the cost sits on the VERTEX we enter.\n    const int INF = 2e9;\n    vector<int> t(n, INF);\n    priority_queue<pair<int,int>, vector<pair<int,int>>, greater<pair<int,int>>> pq;\n    // all k starting servers go into the heap together (multi-source)\n    for (int i = 0; i < k; i++) {\n        int s = start[i];\n        if (c[s] < t[s]) { t[s] = c[s]; pq.push({t[s], s}); }\n    }\n    // pop servers in order of the time they are hacked\n    while (!pq.empty()) {\n        auto [d, u] = pq.top(); pq.pop();\n        if (d > t[u]) continue;              // outdated entry\n        // try to hack every neighbour from u\n        for (int v : adj[u]) {\n            if (d + c[v] < t[v]) {\n                t[v] = d + c[v];\n                pq.push({t[v], v});\n            }\n        }\n    }\n    int answer = 0;\n    // all servers are hacked once the LAST one falls\n    for (int v = 0; v < n; v++) if (t[v] > answer) answer = t[v];\n    printf(\"%d\\n\", answer);\n}\n"}], "body": {"en": "## 1. What the problem says\nThere are n servers (n ≤ 10,000) and m two-way cables (n − 1 ≤ m ≤ 40,000). A hacker attacks k servers at time 0. Breaking into server i takes **c[i]** seconds (1..1,000). Once a server is hacked, the virus immediately starts attacking all its neighbours. Print the **earliest time at which every server is hacked**.\n\nInput: n m k; the k starting servers; c[0..n−1]; then the cables.\n\nSample 2: n = 4, start at 0, c = 2 5 3 1 → **7**.\n\n> Two mistakes in the PDF: it says \"the next **n − 1** lines\" are cables, but the samples have **m** lines (sample 2 has 4 cables for 4 servers). And the Output section (\"n lines … choke point\") is copied from another problem: the samples print **one number**.\n\n## 2. What it really means\nLet t[v] be the time server v falls.\n- A starting server s falls at t[s] = c[s].\n- From a hacked u, a neighbour v can fall at t[u] + c[v].\n- t[v] is the minimum over all ways, so it is a **shortest path** where the cost sits on the **vertex you enter**, and there are **k sources**.\n\nThe answer is max over v of t[v], because everything is hacked when the **last** server falls.\n\n```text\nsample 2:  c = [2, 5, 3, 1]        times\n   0 ── 1                           t[0] = 2         (attacked first)\n   │    │                           t[2] = 2+3 = 5   (via 0)\n   2 ── 3                           t[3] = 5+1 = 6   (via 2)\n                                    t[1] = 2+5 = 7   (via 0; via 3 would be 6+5 = 11)\n                                    answer = max = 7\n```\n\n:::hint Hint 1\nHow would you handle k starting servers in one run instead of k runs?\n:::\n:::hint Hint 2\nPush every starting server into the heap at time c[s] before the loop starts. Then it is ordinary Dijkstra, with edge weight c[v] for an edge into v.\n:::\n\n## 3. What, why, how\n- **What:** Dijkstra with a binary heap, started from k sources at once.\n- **Why multi-source is correct:** add a virtual node joined to each start s by an edge of weight c[s]. One Dijkstra from it gives every server its fastest time from the nearest start. Pushing all starts first is the same thing.\n- **Why Dijkstra:** all c[i] ≥ 1 > 0, so the earliest unfinished server can never be reached earlier later on.\n- **How:** t = ∞. For each start s: t[s] = c[s], push. Pop (d, u); skip if d > t[u]. For each neighbour v: if d + c[v] < t[v], update and push. Print the max of t.\n- **Cost:** O((n + m) log n) ≈ 50,000 · 14. Measured 0.01 s.\n- **Sizes:** a time is at most 10,000 · 1,000 = 10⁷: `int` is safe.\n\n## 4. Solution\n{{code}}\n{{tests}}\n\n**Trace**: sample 2 (heap entries are (time, server)).\n\n| pop | action | t[0..3] | heap afterwards |\n|---|---|---|---|\n| start | push server 0 at c[0] = 2 | 2 ∞ ∞ ∞ | (2,0) |\n| (2,0) | t[1] = 2+5, t[2] = 2+3 | 2 7 5 ∞ | (5,2) (7,1) |\n| (5,2) | t[3] = 5+1 | 2 7 5 6 | (6,3) (7,1) |\n| (6,3) | 6+5 = 11 > 7: no change | 2 7 5 6 | (7,1) |\n| (7,1) | 7+1 = 8 > 6: no change | 2 7 5 6 | empty |\n\nmax(2, 7, 5, 6) = **7**.\n\n## 5. Traps\n- **Reading n − 1 cable lines:** follow the samples and read **m**.\n- **Starting the sources at time 0:** the first attack also takes c[s] seconds (sample 1: server 1 falls at 5, not 0).\n- **Printing n lines:** print one number.\n- **One Dijkstra per source:** k can be n; that is O(n · m log n), too slow.\n- **A start listed twice:** harmless; the code only pushes if it improves t[s].\n\n## 6. Background\nLesson 17. Cost on a vertex = cost on every edge into it. Many sources = one virtual source. Both tricks also appear in [Columbia](#ex06e3_columbia) (vertex costs) and [Pandemic](#a62_q2a_pandemic) (many sources, BFS). \"Time when everything is done\" = the maximum shortest distance, like [Farthest](#a61_q2_farthest).", "th": "## 1. โจทย์บอกอะไร\nมีเซิร์ฟเวอร์ n เครื่อง (n ≤ 10,000) และสายสองทาง m เส้น (n − 1 ≤ m ≤ 40,000) แฮกเกอร์โจมตีเซิร์ฟเวอร์ k เครื่องตอนเวลา 0 การเจาะเครื่อง i ใช้เวลา **c[i]** วินาที (1..1,000) เมื่อเครื่องไหนถูกเจาะแล้ว ไวรัสจะเริ่มโจมตีเพื่อนบ้านทุกเครื่องทันที ให้พิมพ์ **เวลาที่เร็วที่สุดที่ทุกเครื่องถูกเจาะ**\n\ninput: n m k; เครื่องเริ่มต้น k เครื่อง; c[0..n−1]; แล้วตามด้วยสาย\n\nตัวอย่างที่ 2: n = 4 เริ่มที่ 0, c = 2 5 3 1 → **7**\n\n> PDF ผิดสองจุด: เขียนว่า \"อีก **n − 1** บรรทัด\" เป็นสาย แต่ตัวอย่างมี **m** บรรทัด (ตัวอย่างที่ 2 มีสาย 4 เส้นสำหรับ 4 เครื่อง) และส่วน Output (\"n บรรทัด … choke point\") ถูกคัดลอกมาจากโจทย์อื่น ตัวอย่างพิมพ์ **ตัวเลขตัวเดียว**\n\n## 2. จริง ๆ แล้วถามอะไร\nให้ t[v] คือเวลาที่เครื่อง v ถูกเจาะ\n- เครื่องเริ่มต้น s ถูกเจาะที่ t[s] = c[s]\n- จากเครื่อง u ที่ถูกเจาะแล้ว เพื่อนบ้าน v ถูกเจาะได้ที่ t[u] + c[v]\n- t[v] คือค่าน้อยสุดของทุกทาง จึงเป็น **ระยะสั้นสุด** ที่ค่าอยู่ที่ **ปมที่เดินเข้า** และมี **จุดเริ่ม k จุด**\n\nคำตอบคือ max ของ t[v] ทุก v เพราะทุกเครื่องถูกเจาะเมื่อเครื่อง **สุดท้าย** ล้ม\n\n```text\nsample 2:  c = [2, 5, 3, 1]        times\n   0 ── 1                           t[0] = 2         (attacked first)\n   │    │                           t[2] = 2+3 = 5   (via 0)\n   2 ── 3                           t[3] = 5+1 = 6   (via 2)\n                                    t[1] = 2+5 = 7   (via 0; via 3 would be 6+5 = 11)\n                                    answer = max = 7\n```\n\n:::hint คำใบ้ 1\nจะจัดการจุดเริ่ม k จุดในการรันครั้งเดียวแทนที่จะรัน k ครั้งได้อย่างไร\n:::\n:::hint คำใบ้ 2\nใส่เครื่องเริ่มต้นทุกเครื่องลง heap ด้วยเวลา c[s] ก่อนเริ่มลูป แล้วก็เป็น Dijkstra ธรรมดา โดยเส้นที่เข้า v มีน้ำหนัก c[v]\n:::\n\n## 3. อะไร ทำไม อย่างไร\n- **อะไร:** Dijkstra กับ binary heap เริ่มจาก k จุดพร้อมกัน\n- **ทำไมหลายจุดเริ่มถูกต้อง:** เพิ่มปมเสมือนที่ต่อกับจุดเริ่ม s แต่ละจุดด้วยเส้นน้ำหนัก c[s] Dijkstra ครั้งเดียวจากปมนี้ให้เวลาที่เร็วที่สุดจากจุดเริ่มที่ใกล้ที่สุดกับทุกเครื่อง การใส่ทุกจุดเริ่มก่อนก็คือสิ่งเดียวกัน\n- **ทำไม Dijkstra:** c[i] ทุกตัว ≥ 1 > 0 เครื่องที่ยังไม่เสร็จและเร็วที่สุดจะไม่มีทางถูกเจาะเร็วกว่านี้ภายหลัง\n- **อย่างไร:** t = ∞ ทุกจุดเริ่ม s: t[s] = c[s] แล้วใส่ heap ดึง (d, u); ข้ามถ้า d > t[u] เพื่อนบ้าน v: ถ้า d + c[v] < t[v] อัปเดตแล้วใส่ heap พิมพ์ค่ามากสุดของ t\n- **ต้นทุน:** O((n + m) log n) ≈ 50,000 · 14 วัดได้ 0.01 วินาที\n- **ขนาด:** เวลาไม่เกิน 10,000 · 1,000 = 10⁷: `int` ปลอดภัย\n\n## 4. โค้ดเฉลย\n{{code}}\n{{tests}}\n\n**ไล่ค่า**: ตัวอย่างที่ 2 (รายการใน heap คือ (เวลา, เครื่อง))\n\n| ดึง | ทำอะไร | t[0..3] | heap หลังขั้นนี้ |\n|---|---|---|---|\n| เริ่ม | ใส่เครื่อง 0 ที่ c[0] = 2 | 2 ∞ ∞ ∞ | (2,0) |\n| (2,0) | t[1] = 2+5, t[2] = 2+3 | 2 7 5 ∞ | (5,2) (7,1) |\n| (5,2) | t[3] = 5+1 | 2 7 5 6 | (6,3) (7,1) |\n| (6,3) | 6+5 = 11 > 7: ไม่เปลี่ยน | 2 7 5 6 | (7,1) |\n| (7,1) | 7+1 = 8 > 6: ไม่เปลี่ยน | 2 7 5 6 | ว่าง |\n\nmax(2, 7, 5, 6) = **7**\n\n## 5. จุดที่มักพลาด\n- **อ่านสาย n − 1 บรรทัด:** ทำตามตัวอย่าง อ่าน **m** บรรทัด\n- **ให้จุดเริ่มมีเวลา 0:** การโจมตีครั้งแรกก็ใช้ c[s] วินาทีเช่นกัน (ตัวอย่างที่ 1: เครื่อง 1 ล้มที่ 5 ไม่ใช่ 0)\n- **พิมพ์ n บรรทัด:** พิมพ์ตัวเลขตัวเดียว\n- **Dijkstra หนึ่งครั้งต่อหนึ่งจุดเริ่ม:** k อาจเท่ากับ n จะได้ O(n · m log n) ช้าเกินไป\n- **จุดเริ่มซ้ำกัน:** ไม่เป็นไร โค้ดใส่ heap เฉพาะเมื่อ t[s] ดีขึ้น\n\n## 6. ความรู้พื้นฐาน\nบทที่ 17 ค่าบนปม = ค่าบนทุกเส้นที่เข้าปมนั้น หลายจุดเริ่ม = จุดเริ่มเสมือนจุดเดียว ทั้งสองท่าพบอีกในข้อ [Columbia](#ex06e3_columbia) (ค่าบนปม) และ [Pandemic](#a62_q2a_pandemic) (หลายจุดเริ่ม ใช้ BFS) \"เวลาที่ทุกอย่างเสร็จ\" = ระยะสั้นสุดที่มากที่สุด เหมือนข้อ [Farthest](#a61_q2_farthest)"}}, {"id": "ex06e2_shortest", "group": "sp", "lesson": "17 · Shortest paths: Bellman–Ford, negative cycles", "stars": 3, "complexity": "O(N · E)", "kind": "program", "tags": ["Bellman–Ford", "negative edges", "negative-cycle detection", "virtual source"], "title": {"en": "Shortest path with negative edges", "th": "เส้นทางสั้นสุดที่มีเส้นติดลบ (Shortest path)"}, "blurb": {"en": "Shortest distances from s in a directed graph whose edges may be negative, or -1 if the graph has a negative cycle. Bellman–Ford twice: once from a virtual source to find any negative cycle, once from s.", "th": "ระยะสั้นสุดจาก s ในกราฟมีทิศที่เส้นอาจติดลบ หรือ -1 ถ้ากราฟมีวงวนติดลบ ใช้ Bellman–Ford สองครั้ง: ครั้งแรกจากจุดเริ่มเสมือนเพื่อหาวงวนติดลบที่ใดก็ได้ ครั้งที่สองจาก s"}, "tests": {"en": "the 2 PDF samples, a 3-vertex graph where a negative edge beats a direct one, and N = 1; 300 random graphs (N ≤ 7, weights −5..9) against Floyd–Warshall with negative-cycle detection in Python; N = 100 with 10,000 edges in 0.01 s.", "th": "ตัวอย่าง 2 ชุดใน PDF, กราฟ 3 ปมที่เส้นติดลบชนะเส้นตรง และ N = 1; สุ่มกราฟ 300 ชุด (N ≤ 7 น้ำหนัก −5..9) เทียบกับ Floyd–Warshall ที่ตรวจวงวนติดลบใน Python; N = 100 กับ 10,000 เส้น ใช้ 0.01 วินาที"}, "files": [{"name": "main.cpp", "src": "#include <iostream>\n#include <vector>\nusing namespace std;\n\nstruct Edge { int a, b, c; };\n\nint main() {\n    int n, e, s;\n    cin >> n >> e >> s;\n    vector<Edge> E;\n    int a, b, c;\n    // read \"a b c\" until the input ends: same as reading E lines, and still\n    // correct if the E on the first line does not match the real edge count\n    while (cin >> a >> b >> c) E.push_back({a, b, c});\n\n    // Step 1: is there a negative cycle ANYWHERE? (sample 2 has one that s cannot\n    // even reach, and the answer is still -1.)  Start every vertex at 0, as if a\n    // hidden source had a 0-edge to each of them, and run Bellman-Ford.\n    vector<long long> h(n, 0);\n    bool changed = true;\n    // at most n rounds of relaxing every edge; stop early when nothing changes\n    for (int round = 0; round < n && changed; round++) {\n        changed = false;\n        for (const Edge &x : E)\n            if (h[x.a] + x.c < h[x.b]) { h[x.b] = h[x.a] + x.c; changed = true; }\n    }\n    if (changed) {            // still improving after n rounds -> a negative cycle exists\n        cout << -1 << \"\\n\";\n        return 0;\n    }\n\n    // Step 2: ordinary Bellman-Ford from s. No negative cycle, so n-1 rounds suffice.\n    const long long INF = 1e18;\n    vector<long long> dist(n, INF);\n    dist[s] = 0;\n    // rounds 1 .. n-1: after round i, every shortest path of <= i edges is found\n    for (int round = 1; round <= n - 1; round++) {\n        bool any = false;\n        for (const Edge &x : E)\n            if (dist[x.a] != INF && dist[x.a] + x.c < dist[x.b]) { dist[x.b] = dist[x.a] + x.c; any = true; }\n        if (!any) break;\n    }\n    // print vertex 0 .. n-1 (the PDF does not say what to print for an unreachable\n    // vertex; we never saw one in the samples, see the \"Traps\" section)\n    for (int v = 0; v < n; v++) {\n        if (v > 0) cout << ' ';\n        cout << dist[v];\n    }\n    cout << \"\\n\";\n}\n"}], "body": {"en": "## 1. What the problem says\nA directed graph has N vertices (N ≤ 100) and E weighted edges a → b with weight c, where **−1,000 ≤ c ≤ 1,000**. Print the shortest distance from s to every vertex 0..N−1 on one line. If the graph has a **negative cycle**, print only **−1**.\n\nSample 1 → `0 -1 0 4`. Sample 2 → `-1`: the cycle 1 → 2 → 3 → 1 has total weight −3.\n\n## 2. What it really means\nDijkstra assumes that once a vertex is the closest, nothing can make it closer. A negative edge breaks that. **Bellman–Ford** makes no such assumption: it simply relaxes **every** edge, round after round.\n\nLook closely at sample 2: s = 0, but vertex 0 has **no edges at all**, so s cannot reach the cycle. The expected answer is still −1. So we must detect a negative cycle **anywhere in the graph**, not only one reachable from s.\n\n```text\nsample 2:   0 (s, alone)        1 ──(−1)──▶ 2\n                                ▲            │\n                              (−1)         (−1)\n                                └──── 3 ◀────┘     cycle total −3 < 0  →  print −1\n```\n\n:::hint Hint 1\nA shortest path without a negative cycle uses at most N − 1 edges. What does it mean if a distance still improves in round N?\n:::\n:::hint Hint 2\nTo catch a cycle that s cannot reach, start **every** vertex at distance 0, as if a hidden source had a 0-edge to each of them.\n:::\n\n## 3. What, why, how\n- **What:** Bellman–Ford, used twice.\n- **Why N − 1 rounds are enough:** with no negative cycle, some shortest path is simple, so it has ≤ N − 1 edges. After round i, every shortest path with ≤ i edges is correct (induction on i).\n- **Why round N detects a cycle:** if something still improves in round N, there is a \"shortest path\" with N edges, which must repeat a vertex: a cycle that lowers the cost, a negative cycle.\n- **Step 1 (any negative cycle):** h[v] = 0 for all v, i.e. a virtual source joined to every vertex. Relax all edges up to N rounds. Still changing in round N → print −1.\n- **Step 2 (the distances):** dist[s] = 0, others ∞; relax all edges N − 1 times, skipping edges out of ∞ vertices. Stop early when a round changes nothing.\n- **Cost:** O(N · E) per step. With N = 100 that is tiny.\n\n## 4. Solution\n{{code}}\n{{tests}}\n\n**Trace A**: sample 2, step 1 (h starts at 0 everywhere; edges in input order 1→2, 2→3, 3→1):\n\n| round | h[0] h[1] h[2] h[3] | changed? |\n|---|---|---|\n| 1 | 0 −3 −1 −2 | yes |\n| 2 | 0 −6 −4 −5 | yes |\n| 3 | 0 −9 −7 −8 | yes |\n| 4 = N | 0 −12 −10 −11 | **yes → −1** |\n\n**Trace B**: sample 1, step 2 from s = 0 (edges 0→1 −1, 1→2 +1, 2→3 +4):\n\n| round | dist[0..3] |\n|---|---|\n| start | 0 ∞ ∞ ∞ |\n| 1 | 0 −1 0 4 |\n| 2 | no change, stop |\n\nOutput `0 -1 0 4`.\n\n## 5. Traps\n- **Using Dijkstra:** wrong with negative edges, even without a cycle (the third test: 2→1 costs 7 directly but 5 − 3 = 2 via 0).\n- **Only checking cycles reachable from s:** sample 2 says the answer is −1 anyway.\n- **Relaxing from an ∞ vertex in step 2:** ∞ + (−5) looks smaller than ∞; skip edges whose start is still ∞.\n- **Unreachable vertices:** the PDF does not say what to print. This solution prints the INF value (10¹⁸); no sample has the case.\n- **The edge count:** reading until end of input is equivalent to reading E lines, and safe if E is off.\n\n## 6. Background\nLesson 17. Bellman–Ford is the tool for negative weights, and its \"one more round\" test is the standard negative-cycle detector. [Exchange](#ex06m2_exchange) turns currency arbitrage into exactly this negative-cycle question. The \"virtual source with 0-edges\" idea is also how Johnson's algorithm starts. For non-negative weights use [Dijkstra](#a61_q2_farthest) instead; it is much faster.", "th": "## 1. โจทย์บอกอะไร\nกราฟมีทิศมี N ปม (N ≤ 100) และเส้นมีน้ำหนัก E เส้น a → b น้ำหนัก c โดย **−1,000 ≤ c ≤ 1,000** ให้พิมพ์ระยะสั้นสุดจาก s ไปทุกปม 0..N−1 ในบรรทัดเดียว ถ้ากราฟมี **วงวนติดลบ** ให้พิมพ์แค่ **−1**\n\nตัวอย่างที่ 1 → `0 -1 0 4` ตัวอย่างที่ 2 → `-1`: วงวน 1 → 2 → 3 → 1 มีผลรวม −3\n\n## 2. จริง ๆ แล้วถามอะไร\nDijkstra ถือว่าเมื่อปมหนึ่งใกล้ที่สุดแล้ว จะไม่มีอะไรทำให้มันใกล้ขึ้นได้อีก เส้นติดลบทำลายข้อนี้ **Bellman–Ford** ไม่ได้สมมติแบบนั้น มันแค่ relax **ทุก** เส้น ทีละรอบ\n\nดูตัวอย่างที่ 2 ดี ๆ: s = 0 แต่ปม 0 **ไม่มีเส้นเลย** s จึงไปไม่ถึงวงวน แต่คำตอบที่ต้องการก็ยังเป็น −1 ดังนั้นเราต้องหาวงวนติดลบ **ที่ใดก็ได้ในกราฟ** ไม่ใช่แค่วงที่ s ไปถึง\n\n```text\nsample 2:   0 (s, alone)        1 ──(−1)──▶ 2\n                                ▲            │\n                              (−1)         (−1)\n                                └──── 3 ◀────┘     cycle total −3 < 0  →  print −1\n```\n\n:::hint คำใบ้ 1\nเส้นทางสั้นสุดที่ไม่มีวงวนติดลบใช้เส้นไม่เกิน N − 1 เส้น ถ้าระยะยังดีขึ้นได้ในรอบที่ N แปลว่าอะไร\n:::\n:::hint คำใบ้ 2\nเพื่อจับวงที่ s ไปไม่ถึง ให้ทุกปมเริ่มที่ระยะ 0 เหมือนมีจุดเริ่มซ่อนอยู่ที่มีเส้นน้ำหนัก 0 ไปทุกปม\n:::\n\n## 3. อะไร ทำไม อย่างไร\n- **อะไร:** Bellman–Ford ใช้สองครั้ง\n- **ทำไม N − 1 รอบพอ:** ถ้าไม่มีวงวนติดลบ จะมีเส้นทางสั้นสุดที่ไม่ซ้ำปม จึงมี ≤ N − 1 เส้น หลังรอบที่ i เส้นทางสั้นสุดทุกเส้นที่มี ≤ i เส้นจะถูกต้อง (อุปนัยบน i)\n- **ทำไมรอบที่ N ตรวจวงวนได้:** ถ้ายังมีอะไรดีขึ้นในรอบที่ N แปลว่ามี \"เส้นทางสั้นสุด\" ที่ใช้ N เส้น ซึ่งต้องซ้ำปม: วงที่ทำให้ค่าลดลง คือวงวนติดลบ\n- **ขั้นที่ 1 (วงวนติดลบที่ใดก็ได้):** h[v] = 0 ทุก v คือจุดเริ่มเสมือนที่ต่อกับทุกปม relax ทุกเส้นไม่เกิน N รอบ ถ้ายังเปลี่ยนในรอบที่ N → พิมพ์ −1\n- **ขั้นที่ 2 (ระยะทาง):** dist[s] = 0 ที่เหลือ ∞; relax ทุกเส้น N − 1 ครั้ง โดยข้ามเส้นที่ออกจากปมที่เป็น ∞ หยุดก่อนได้ถ้ารอบนั้นไม่มีอะไรเปลี่ยน\n- **ต้นทุน:** O(N · E) ต่อขั้น เมื่อ N = 100 ถือว่าน้อยมาก\n\n## 4. โค้ดเฉลย\n{{code}}\n{{tests}}\n\n**ไล่ค่า A**: ตัวอย่างที่ 2 ขั้นที่ 1 (h เริ่มเป็น 0 ทุกปม; เส้นตามลำดับ input 1→2, 2→3, 3→1):\n\n| รอบ | h[0] h[1] h[2] h[3] | เปลี่ยนไหม |\n|---|---|---|\n| 1 | 0 −3 −1 −2 | ใช่ |\n| 2 | 0 −6 −4 −5 | ใช่ |\n| 3 | 0 −9 −7 −8 | ใช่ |\n| 4 = N | 0 −12 −10 −11 | **ใช่ → −1** |\n\n**ไล่ค่า B**: ตัวอย่างที่ 1 ขั้นที่ 2 จาก s = 0 (เส้น 0→1 −1, 1→2 +1, 2→3 +4):\n\n| รอบ | dist[0..3] |\n|---|---|\n| เริ่ม | 0 ∞ ∞ ∞ |\n| 1 | 0 −1 0 4 |\n| 2 | ไม่เปลี่ยน หยุด |\n\nผลลัพธ์ `0 -1 0 4`\n\n## 5. จุดที่มักพลาด\n- **ใช้ Dijkstra:** ผิดเมื่อมีเส้นติดลบ แม้ไม่มีวงวน (ชุดทดสอบที่ 3: 2→1 ตรง ๆ เสีย 7 แต่ผ่าน 0 เสีย 5 − 3 = 2)\n- **เช็กเฉพาะวงที่ s ไปถึง:** ตัวอย่างที่ 2 บอกว่าคำตอบก็ยังเป็น −1\n- **relax จากปมที่เป็น ∞ ในขั้นที่ 2:** ∞ + (−5) ดูเหมือนน้อยกว่า ∞ ต้องข้ามเส้นที่จุดเริ่มยังเป็น ∞\n- **ปมที่ไปไม่ถึง:** PDF ไม่ได้บอกว่าให้พิมพ์อะไร เฉลยนี้พิมพ์ค่า INF (10¹⁸) ไม่มีตัวอย่างไหนมีกรณีนี้\n- **จำนวนเส้น:** การอ่านจนจบ input เท่ากับการอ่าน E บรรทัด และปลอดภัยถ้า E ผิด\n\n## 6. ความรู้พื้นฐาน\nบทที่ 17 Bellman–Ford คือเครื่องมือสำหรับน้ำหนักติดลบ และการทดสอบ \"อีกหนึ่งรอบ\" คือวิธีมาตรฐานในการตรวจวงวนติดลบ ข้อ [Exchange](#ex06m2_exchange) แปลงการค้ากำไรจากค่าเงินให้เป็นคำถามเรื่องวงวนติดลบแบบนี้พอดี ไอเดีย \"จุดเริ่มเสมือนที่มีเส้น 0\" ก็เป็นวิธีเริ่มต้นของอัลกอริทึม Johnson ถ้าน้ำหนักไม่ติดลบ ให้ใช้ [Dijkstra](#a61_q2_farthest) ซึ่งเร็วกว่ามาก"}}, {"id": "ex06m2_exchange", "group": "sp", "lesson": "17 · Shortest paths: negative cycles (arbitrage)", "stars": 4, "complexity": "O(K · N³) worst case, usually far less", "kind": "program", "tags": ["arbitrage", "−log weights", "Bellman–Ford", "negative-cycle detection", "floating point"], "title": {"en": "Exchange", "th": "แลกเงิน (Exchange)"}, "blurb": {"en": "Can a chain of currency exchanges that returns to the start make money? Taking −log of each rate turns \"product > 1\" into \"sum < 0\", so the question becomes: is there a negative cycle?", "th": "มีลำดับการแลกเงินที่วนกลับมาสกุลเดิมแล้วได้เงินเพิ่มไหม การใส่ −log ให้อัตราแลกเปลี่ยนเปลี่ยน \"ผลคูณ > 1\" เป็น \"ผลรวม < 0\" คำถามจึงกลายเป็น: มีวงวนติดลบหรือไม่"}, "tests": {"en": "the PDF sample, single-currency and \"no profit\" tables, and the PDF's own 1 → 2 → 3 → 1 example (rates 0 mean no exchange); 300 random tables (N ≤ 6) against a brute force that tries every simple cycle; 20 tables of N = 500 without and with a hidden loop in 0.8–0.9 s (mostly reading 5 million numbers); a 50-currency ring whose profit is only 0.05 % in total, both ways.", "th": "ตัวอย่างใน PDF, ตารางสกุลเดียวและตาราง \"ไม่มีกำไร\" และตัวอย่าง 1 → 2 → 3 → 1 ของ PDF เอง (อัตรา 0 คือแลกไม่ได้); สุ่ม 300 ตาราง (N ≤ 6) เทียบกับ brute force ที่ลองทุกวงที่ไม่ซ้ำปม; 20 ตารางขนาด N = 500 แบบไม่มีและมีวงซ่อน ใช้ 0.8–0.9 วินาที (ส่วนใหญ่คือการอ่านตัวเลข 5 ล้านตัว); วงแหวน 50 สกุลที่กำไรรวมแค่ 0.05 % ทั้งสองแบบ"}, "files": [{"name": "main.cpp", "src": "#include <cstdio>\n#include <cmath>\n#include <vector>\nusing namespace std;\n\nint n;\nvector<int> par;   // par[v] = the currency we last improved v from (-1 = none)\n\n// Does the \"parent graph\" (v -> par[v]) contain a cycle?\n// With strict improvements, a cycle there can only be a negative cycle.\nbool parentCycle() {\n    vector<int> state(n, 0);   // 0 = unvisited, 1 = on the current walk, 2 = finished\n    // start a walk from every currency v = 0 .. n-1\n    for (int v = 0; v < n; v++) {\n        if (state[v]) continue;\n        int x = v;\n        // follow parent pointers while they lead somewhere new\n        while (x != -1 && state[x] == 0) { state[x] = 1; x = par[x]; }\n        if (x != -1 && state[x] == 1) return true;     // walked back into this walk: a loop\n        // mark this walk finished: v, par[v], ... up to where we stopped\n        x = v;\n        while (x != -1 && state[x] == 1) { state[x] = 2; x = par[x]; }\n    }\n    return false;\n}\n\nint main() {\n    int K;\n    if (scanf(\"%d\", &K) != 1) return 0;\n    // the K tables are independent\n    for (int t = 0; t < K; t++) {\n        if (scanf(\"%d\", &n) != 1) return 0;\n        // Money MULTIPLIES along a route: 1 unit of a becomes R[a][b] units of b.\n        // With w = -log(R), products turn into sums, and\n        //     product > 1   <=>   sum of log(R) > 0   <=>   sum of w < 0.\n        // So \"infinite money\" is exactly a NEGATIVE CYCLE for the weights w.\n        vector<vector<double>> w(n, vector<double>(n));\n        for (int i = 0; i < n; i++)\n            for (int j = 0; j < n; j++) {\n                double r;\n                if (scanf(\"%lf\", &r) != 1) return 0;\n                w[i][j] = (r > 0) ? -log(r) : INFINITY;   // a rate of 0 = no exchange at all\n            }\n        // Bellman-Ford from a hidden source joined to every currency with weight 0:\n        // start all h[v] = 0, then relax every pair (u, v) round after round.\n        const double EPS = 1e-12;            // ignore improvements smaller than rounding noise\n        vector<double> h(n, 0.0);\n        par.assign(n, -1);\n        bool profit = false;\n        // at most n rounds; stop early if nothing changes (no cycle) or a cycle is seen\n        for (int round = 1; round <= n; round++) {\n            bool changed = false;\n            // every ordered pair: u = 0..n-1, v = 0..n-1\n            for (int u = 0; u < n; u++)\n                for (int v = 0; v < n; v++)\n                    if (h[u] + w[u][v] < h[v] - EPS) {\n                        h[v] = h[u] + w[u][v];\n                        par[v] = u;\n                        changed = true;\n                    }\n            if (!changed) break;                         // converged: no negative cycle\n            if (round == n || parentCycle()) { profit = true; break; }\n        }\n        printf(profit ? \"YES\\n\" : \"NO\\n\");\n    }\n}\n"}], "body": {"en": "## 1. What the problem says\nAn exchanger deals in N currencies (N ≤ 500). R[a][b] is how many units of b you get for **one unit** of a. R[a][b] need not be 1 / R[b][a]. If some chain X → Y → Z → … → X ends with **more** money than it started with, you can make infinite money. For each of K tables (K ≤ 20), print **YES** if that is possible, otherwise **NO**.\n\nThe PDF's example: R[1][2] = 0.7, R[2][3] = 2, R[3][1] = 0.75 → 1 · 0.7 · 2 · 0.75 = **1.05** > 1.\n\nSample → `YES` then `NO`.\n\n## 2. What it really means\nAlong a chain, money **multiplies**: x units become x · R[a][b] · R[b][c] · …. We want a **cycle whose product of rates is > 1**.\n\nTake logarithms: log turns products into sums, and log is increasing:\n\n```text\nR1 · R2 · … · Rk  > 1\n⇔  log R1 + log R2 + … + log Rk  > 0\n⇔  (−log R1) + (−log R2) + … + (−log Rk)  < 0\n```\n\nSo with edge weights **w(a, b) = −log R[a][b]**, a profit loop is exactly a **negative cycle**. That is the question [Bellman–Ford](#ex06e2_shortest) answers.\n\nSample 1: currencies 1 and 2 give 2 · 0.7 = 1.4 > 1, so w = −log 2 − log 0.7 ≈ −0.693 + 0.357 = **−0.336 < 0** → YES.\n\n:::hint Hint 1\nHow do you turn \"multiply along the path\" into \"add along the path\"?\n:::\n:::hint Hint 2\nAfter the −log transform, you only need to know whether **some** negative cycle exists, from any start. Start every currency at distance 0.\n:::\n\n## 3. What, why, how\n- **What:** −log transform + Bellman–Ford with a virtual source (h[v] = 0 for all v).\n- **Why the virtual source:** a profit loop may start at any currency. A hidden node with 0-edges to everyone reaches every cycle.\n- **Basic test:** relax all N² pairs; if a value still improves in round N, there is a negative cycle. That alone is O(N³) = 1.25 × 10⁸ per table, and K = 20 tables: too slow if every table needs all N rounds.\n- **Faster early exit:** keep par[v] = the currency that last improved v. If the parent pointers ever form a **cycle**, that cycle is negative (each strict improvement along it lowered the total). Checking after each round costs O(N) and usually finds a profit loop within a few rounds.\n- **Early \"NO\":** if a round changes nothing, distances are final and there is no negative cycle.\n- **Rate 0:** you cannot exchange at all; use w = +∞ (no edge).\n- **Floating point:** −log values are inexact. Only count an improvement if it is bigger than EPS = 10⁻¹², so that rounding noise on a \"product exactly 1\" loop does not look like profit.\n\n## 4. Solution\n{{code}}\n{{tests}}\n\n**Trace**: sample table 1 (rows as given). w = −ln R, rounded to 3 decimals:\n\n| | 0 | 1 | 2 |\n|---|---|---|---|\n| **0** | 0 | 0.357 | −0.182 |\n| **1** | −0.095 | 0 | −0.693 |\n| **2** | 0.288 | 0.357 | 0 |\n\nRound 1 from h = (0, 0, 0), pairs in order u = 0..2, v = 0..2:\n\n| step | relax | h afterwards | par |\n|---|---|---|---|\n| 0 → 2 | 0 − 0.182 | (0, 0, −0.182) | par[2] = 0 |\n| 1 → 0 | 0 − 0.095 | (−0.095, 0, −0.182) | par[0] = 1 |\n| 1 → 2 | 0 − 0.693 | (−0.095, 0, −0.693) | par[2] = 1 |\n| 2 → 0 | −0.693 + 0.288 | (−0.405, 0, −0.693) | par[0] = 2 |\n| 2 → 1 | −0.693 + 0.357 | (−0.405, −0.336, −0.693) | par[1] = 2 |\n\nNow par[1] = 2 and par[2] = 1: the parent pointers form the cycle 1 → 2 → 1, worth 2 · 0.7 = 1.4 > 1 → **YES**.\n\nTable 2: the only loop is 0 → 1 → 0 with 0.7 · 1.2 = 0.84 < 1; the rounds settle, nothing changes → **NO**.\n\n## 5. Traps\n- **Multiplying rates around every cycle:** there are exponentially many cycles.\n- **Using `log` without the minus:** then you look for a **positive** cycle, which shortest-path algorithms cannot find.\n- **Exact comparisons with doubles:** a loop whose product is exactly 1 can come out as −1e−16; use an EPS.\n- **A rate of 0:** log 0 = −∞ breaks everything; treat it as \"no edge\".\n- **Row/column order:** the PDF says the i-th number of line j is R[i][j] (a transposed table). Reversing every edge reverses every cycle, which keeps each cycle's product, so the YES/NO answer is the same either way.\n- **Floyd–Warshall per table:** also correct (look for d[i][i] < 0), but 20 × 500³ was measured at about 3 s.\n\n## 6. Background\nLesson 17. Currency arbitrage is the classic application of \"log turns products into sums\". The same trick works for \"most reliable path\" (product of probabilities: maximise ⇔ minimise −log). The parent-cycle check is a well-known speed-up for Bellman–Ford, also used in SPFA. See [Shortest path](#ex06e2_shortest) for the plain round-N test.", "th": "## 1. โจทย์บอกอะไร\nร้านแลกเงินมี N สกุล (N ≤ 500) R[a][b] คือจำนวนหน่วยของ b ที่ได้ต่อ **หนึ่งหน่วย** ของ a และ R[a][b] ไม่จำเป็นต้องเท่ากับ 1 / R[b][a] ถ้ามีลำดับ X → Y → Z → … → X ที่จบด้วยเงิน **มากกว่า** ตอนเริ่ม ก็สร้างเงินได้ไม่จำกัด สำหรับตาราง K ตาราง (K ≤ 20) ให้พิมพ์ **YES** ถ้าทำได้ ไม่อย่างนั้น **NO**\n\nตัวอย่างใน PDF: R[1][2] = 0.7, R[2][3] = 2, R[3][1] = 0.75 → 1 · 0.7 · 2 · 0.75 = **1.05** > 1\n\nตัวอย่าง → `YES` แล้ว `NO`\n\n## 2. จริง ๆ แล้วถามอะไร\nตามลำดับการแลก เงิน **คูณกัน**: x หน่วยกลายเป็น x · R[a][b] · R[b][c] · … เราต้องการ **วงที่ผลคูณของอัตรา > 1**\n\nใส่ log: log เปลี่ยนผลคูณเป็นผลบวก และ log เป็นฟังก์ชันเพิ่ม:\n\n```text\nR1 · R2 · … · Rk  > 1\n⇔  log R1 + log R2 + … + log Rk  > 0\n⇔  (−log R1) + (−log R2) + … + (−log Rk)  < 0\n```\n\nดังนั้นถ้าให้น้ำหนักเส้น **w(a, b) = −log R[a][b]** วงที่ได้กำไรก็คือ **วงวนติดลบ** พอดี ซึ่งเป็นคำถามที่ [Bellman–Ford](#ex06e2_shortest) ตอบได้\n\nตัวอย่างที่ 1: สกุล 1 และ 2 ให้ 2 · 0.7 = 1.4 > 1 ดังนั้น w = −log 2 − log 0.7 ≈ −0.693 + 0.357 = **−0.336 < 0** → YES\n\n:::hint คำใบ้ 1\nจะเปลี่ยน \"คูณไปตามทาง\" ให้เป็น \"บวกไปตามทาง\" ได้อย่างไร\n:::\n:::hint คำใบ้ 2\nหลังแปลงด้วย −log เราแค่ต้องรู้ว่ามีวงวนติดลบ **สักวง** หรือไม่ จากจุดเริ่มใดก็ได้ ให้ทุกสกุลเริ่มที่ระยะ 0\n:::\n\n## 3. อะไร ทำไม อย่างไร\n- **อะไร:** แปลงด้วย −log + Bellman–Ford กับจุดเริ่มเสมือน (h[v] = 0 ทุก v)\n- **ทำไมต้องมีจุดเริ่มเสมือน:** วงกำไรอาจเริ่มที่สกุลไหนก็ได้ ปมซ่อนที่มีเส้น 0 ไปทุกสกุลไปถึงทุกวงได้\n- **การทดสอบพื้นฐาน:** relax ทุกคู่ N² คู่ ถ้ายังมีค่าดีขึ้นในรอบที่ N แปลว่ามีวงวนติดลบ แค่นี้ก็ O(N³) = 1.25 × 10⁸ ต่อตาราง และมี K = 20 ตาราง: ช้าเกินไปถ้าทุกตารางต้องใช้ครบ N รอบ\n- **ออกก่อนแบบเร็ว:** เก็บ par[v] = สกุลที่ทำให้ v ดีขึ้นครั้งล่าสุด ถ้า pointer พ่อเหล่านี้กลายเป็น **วง** เมื่อไหร่ วงนั้นติดลบแน่นอน (การปรับให้ดีขึ้นแบบเข้มงวดทุกครั้งตามวงทำให้ผลรวมลดลง) การเช็กหลังทุกรอบใช้ O(N) และปกติจะเจอวงกำไรภายในไม่กี่รอบ\n- **ตอบ \"NO\" ก่อน:** ถ้ารอบไหนไม่มีอะไรเปลี่ยน ระยะคงที่แล้วและไม่มีวงวนติดลบ\n- **อัตรา 0:** แลกไม่ได้เลย ใช้ w = +∞ (ไม่มีเส้น)\n- **ทศนิยม:** ค่า −log ไม่แม่นยำ นับว่าดีขึ้นเฉพาะเมื่อดีขึ้นมากกว่า EPS = 10⁻¹² เพื่อไม่ให้ความคลาดเคลื่อนจากการปัดเศษบนวงที่ \"ผลคูณเท่ากับ 1 พอดี\" ดูเหมือนกำไร\n\n## 4. โค้ดเฉลย\n{{code}}\n{{tests}}\n\n**ไล่ค่า**: ตารางตัวอย่างที่ 1 (แถวตามที่ให้มา) w = −ln R ปัดเป็นทศนิยม 3 ตำแหน่ง:\n\n| | 0 | 1 | 2 |\n|---|---|---|---|\n| **0** | 0 | 0.357 | −0.182 |\n| **1** | −0.095 | 0 | −0.693 |\n| **2** | 0.288 | 0.357 | 0 |\n\nรอบที่ 1 จาก h = (0, 0, 0) ไล่คู่ตามลำดับ u = 0..2, v = 0..2:\n\n| ขั้น | relax | h หลังขั้นนี้ | par |\n|---|---|---|---|\n| 0 → 2 | 0 − 0.182 | (0, 0, −0.182) | par[2] = 0 |\n| 1 → 0 | 0 − 0.095 | (−0.095, 0, −0.182) | par[0] = 1 |\n| 1 → 2 | 0 − 0.693 | (−0.095, 0, −0.693) | par[2] = 1 |\n| 2 → 0 | −0.693 + 0.288 | (−0.405, 0, −0.693) | par[0] = 2 |\n| 2 → 1 | −0.693 + 0.357 | (−0.405, −0.336, −0.693) | par[1] = 2 |\n\nตอนนี้ par[1] = 2 และ par[2] = 1: pointer พ่อเป็นวง 1 → 2 → 1 มีค่า 2 · 0.7 = 1.4 > 1 → **YES**\n\nตารางที่ 2: วงเดียวคือ 0 → 1 → 0 ได้ 0.7 · 1.2 = 0.84 < 1 รอบต่าง ๆ นิ่ง ไม่มีอะไรเปลี่ยน → **NO**\n\n## 5. จุดที่มักพลาด\n- **คูณอัตรารอบทุกวง:** จำนวนวงเพิ่มแบบเอกซ์โพเนนเชียล\n- **ใช้ `log` โดยไม่ใส่ลบ:** จะกลายเป็นหาวง **บวก** ซึ่งอัลกอริทึมเส้นทางสั้นสุดหาไม่ได้\n- **เทียบ double แบบตรงเป๊ะ:** วงที่ผลคูณเท่ากับ 1 พอดีอาจออกมาเป็น −1e−16 ต้องใช้ EPS\n- **อัตรา 0:** log 0 = −∞ ทำให้ทุกอย่างพัง ให้ถือว่า \"ไม่มีเส้น\"\n- **ลำดับแถว/คอลัมน์:** PDF บอกว่าตัวที่ i ของบรรทัด j คือ R[i][j] (ตารางกลับด้าน) การกลับทิศทุกเส้นทำให้ทุกวงกลับทิศ ซึ่งผลคูณของแต่ละวงไม่เปลี่ยน คำตอบ YES/NO จึงเหมือนกันทั้งสองแบบ\n- **Floyd–Warshall ทุกตาราง:** ก็ถูก (หา d[i][i] < 0) แต่ 20 × 500³ วัดได้ราว 3 วินาที\n\n## 6. ความรู้พื้นฐาน\nบทที่ 17 การค้ากำไรจากค่าเงิน (arbitrage) คือตัวอย่างคลาสสิกของ \"log เปลี่ยนผลคูณเป็นผลบวก\" ท่าเดียวกันใช้กับ \"เส้นทางที่น่าเชื่อถือที่สุด\" (ผลคูณความน่าจะเป็น: ทำให้มากที่สุด ⇔ ทำให้ −log น้อยที่สุด) การเช็กวงของ pointer พ่อเป็นท่าเร่ง Bellman–Ford ที่รู้จักกันดี ใช้ใน SPFA ด้วย ดูข้อ [Shortest path](#ex06e2_shortest) สำหรับการทดสอบรอบที่ N แบบธรรมดา"}}, {"id": "a65_q3a_expressway", "group": "sp", "lesson": "17 · Shortest paths: Floyd–Warshall (the k-loop's meaning)", "stars": 4, "complexity": "O(n³)", "kind": "program", "tags": ["Floyd–Warshall", "intermediate vertices ≤ k", "online answers", "undirected"], "title": {"en": "Expressway", "th": "ทางด่วน (Expressway)"}, "blurb": {"en": "Each year a new province joins with roads to older provinces only; after every year print the cheapest 1 → 2 cost. Floyd–Warshall adds stop-over provinces in exactly that order, so d[1][2] after phase k is year k's answer.", "th": "ทุกปีมีจังหวัดใหม่ที่สร้างทางด่วนเชื่อมไปยังจังหวัดเก่าเท่านั้น หลังแต่ละปีให้พิมพ์ค่าเดินทาง 1 → 2 ที่ถูกที่สุด Floyd–Warshall เพิ่มจังหวัดแวะพักตามลำดับนั้นพอดี d[1][2] หลังเฟส k จึงเป็นคำตอบของปีที่ k"}, "tests": {"en": "the PDF sample and n = 3 with no new roads; 300 random inputs (n ≤ 9) against a fresh Dijkstra after every year in Python; n = 700 with every possible road (about 245,000 roads) in 0.26 s.", "th": "ตัวอย่างใน PDF และ n = 3 ที่ไม่มีถนนใหม่; สุ่ม 300 ชุด (n ≤ 9) เทียบกับการรัน Dijkstra ใหม่ทุกปีใน Python; n = 700 ที่มีถนนครบทุกคู่ (ราว 245,000 เส้น) ใช้ 0.26 วินาที"}, "files": [{"name": "main.cpp", "src": "#include <cstdio>\n#include <vector>\nusing namespace std;\n\nint main() {\n    int n, c12;\n    if (scanf(\"%d %d\", &n, &c12) != 2) return 0;\n    // d[a][b] = cost between provinces a and b (1-based); INF = no road (yet)\n    const int INF = 1e9;\n    vector<vector<int>> d(n + 1, vector<int>(n + 1, INF));\n    // a province is at distance 0 from itself\n    for (int i = 1; i <= n; i++) d[i][i] = 0;\n    d[1][2] = d[2][1] = c12;\n    // year i = 3 .. n: read the k roads from province i to older provinces t < i\n    for (int i = 3; i <= n; i++) {\n        int k;\n        if (scanf(\"%d\", &k) != 1) return 0;\n        for (int j = 0; j < k; j++) {\n            int t, p;\n            if (scanf(\"%d %d\", &t, &p) != 2) return 0;\n            if (p < d[i][t]) d[i][t] = d[t][i] = p;\n        }\n    }\n    // Floyd-Warshall, adding provinces as \"allowed stop-overs\" in the order 1, 2, 3, ...\n    // After phase k, d[a][b] = cheapest a->b route whose stop-overs are all <= k.\n    // A 1->2 route with stop-overs <= k uses only provinces 1..k, which is exactly\n    // the network that exists after year k. So after phase k, d[1][2] is year k's answer.\n    // phases k = 1 .. n\n    for (int k = 1; k <= n; k++) {\n        // all pairs (a, b), a = 1..n, b = 1..n\n        for (int a = 1; a <= n; a++) {\n            int dak = d[a][k];\n            if (dak == INF) continue;\n            for (int b = 1; b <= n; b++)\n                if (dak + d[k][b] < d[a][b]) d[a][b] = dak + d[k][b];\n        }\n        if (k >= 3) printf(k < n ? \"%d \" : \"%d\\n\", d[1][2]);\n    }\n}\n"}], "body": {"en": "## 1. What the problem says\nA country has n provinces (3 ≤ n ≤ 700). In years 1–2 the only expressway is 1 – 2 with toll c[1][2] (≤ 1,000,000). In year i ≥ 3, the government builds k[i] expressways from province **i to older provinces t < i**, each with a toll p (0..1,000). Roads are two-way. Somchai travels from province 1 to province 2 every year. For each year 3..n, after that year's roads are built, print the cheapest toll from 1 to 2.\n\nInput: `n c12`, then one line per year i: `k t1 p1 t2 p2 …`.\n\nSample (n = 5, c12 = 10) → `10 9 7`.\n\n## 2. What it really means\nRecomputing a shortest path every year costs n Dijkstras: 700 × (E log V), with E up to 245,000: around 10⁹ to 2 × 10⁹. Too slow.\n\nThe key is the meaning of Floyd–Warshall's outer loop. After phase k:\n\n> d[a][b] = the cheapest a → b route whose **stop-overs** (inner vertices) are all in {1, …, k}.\n\nA route from 1 to 2 that only stops at provinces ≤ k uses only provinces 1..k, and every road between two provinces ≤ k exists by year k (a road built in year i joins i to something older). So **d[1][2] after phase k is exactly the answer for year k**.\n\n```text\nsample:  year 3: 3–1 (6), 3–2 (7)\n         year 4: 4–1 (1), 4–3 (1), 4–2 (9)\n         year 5: 5–1 (2), 5–2 (5)\n\n   year 3: 1 → 2 direct            = 10\n   year 4: 1 → 4 → 3 → 2  1+1+7    = 9\n   year 5: 1 → 5 → 2      2+5      = 7\n```\n\n:::hint Hint 1\nFloyd–Warshall's loop `for k` adds one vertex at a time as an allowed stop-over. In what order are the provinces \"added\" to the country?\n:::\n:::hint Hint 2\nRead every road first. Then run Floyd–Warshall once with k = 1, 2, …, n, and print d[1][2] at the end of each phase k ≥ 3.\n:::\n\n## 3. What, why, how\n- **What:** one ordinary Floyd–Warshall, reading off an answer after each phase.\n- **Why reading all roads in advance is safe:** in phase k, a road to a province j > k can only appear as the **first or last** step of d[a][b] with a = j or b = j. It is never used inside a 1 → 2 route until phase j, because j is not yet an allowed stop-over.\n- **Why the invariant holds:** before phase k, d[a][b] uses stop-overs < k. A best route with stop-overs ≤ k either avoids k (already counted) or passes k once: d[a][k] + d[k][b]. That is the Floyd update.\n- **How:** d = INF, d[i][i] = 0, fill the roads (keep the cheaper one if a pair repeats). For k = 1..n: for all a, b: d[a][b] = min(d[a][b], d[a][k] + d[k][b]); if k ≥ 3 print d[1][2].\n- **Cost:** n³ = 3.4 × 10⁸ simple additions; skipping rows with d[a][k] = INF helps. Measured 0.26 s.\n- **Sizes:** a path costs at most 1,000,000 + 700 · 1,000 < 2 × 10⁹: `int` works, with INF = 10⁹ and the INF row skip preventing INF + INF overflow.\n\n## 4. Solution\n{{code}}\n{{tests}}\n\n**Trace**: the sample. Values of d[1][2] and the entries that make it change:\n\n| phase k | new stop-over | relevant values | d[1][2] | printed |\n|---|---|---|---|---|\n| 1 | province 1 | d[2][3] = min(7, 10+6) = 7 | 10 | |\n| 2 | province 2 | nothing better for 1 → 2 | 10 | |\n| 3 | province 3 | d[1][3] + d[3][2] = 6 + 7 = 13; d[4][2] = min(9, 1+7) = 8 | 10 | **10** |\n| 4 | province 4 | d[1][4] + d[4][2] = 1 + 8 = 9 | 9 | **9** |\n| 5 | province 5 | d[1][5] + d[5][2] = 2 + 5 = 7 | 7 | **7** |\n\n## 5. Traps\n- **One Dijkstra per year:** correct but too slow at n = 700 with dense roads.\n- **Running Floyd–Warshall every year:** O(n⁴), far too slow.\n- **Floyd with the k-loop inside:** the order of the three loops matters; k must be **outermost**, otherwise the invariant is gone.\n- **Tolls of 0:** allowed; Floyd handles them.\n- **Repeated pair (a, b):** keep the smaller toll.\n- **Overflow with INF + INF:** skip rows where d[a][k] is INF (the code does), or use `long long`.\n\n## 6. Background\nLesson 17. Floyd–Warshall is DP over \"which vertices may be used as stop-overs\". This problem rewards knowing that **invariant**, not just the code. The same idea answers \"shortest path using only vertices ≤ k\" or \"add vertices one at a time\" questions in O(n³) total. For a single source with non-negative weights use [Dijkstra](#a61_q2_farthest); for negative weights use [Bellman–Ford](#ex06e2_shortest).", "th": "## 1. โจทย์บอกอะไร\nประเทศหนึ่งมี n จังหวัด (3 ≤ n ≤ 700) ในปีที่ 1–2 มีทางด่วนเส้นเดียวคือ 1 – 2 ค่าผ่าน c[1][2] (≤ 1,000,000) ในปีที่ i ≥ 3 รัฐบาลสร้างทางด่วน k[i] เส้นจากจังหวัด **i ไปยังจังหวัดเก่า t < i** แต่ละเส้นมีค่าผ่าน p (0..1,000) ทางด่วนเป็นสองทาง สมชายเดินทางจากจังหวัด 1 ไปจังหวัด 2 ทุกปี สำหรับปี 3..n หลังสร้างทางด่วนของปีนั้นเสร็จ ให้พิมพ์ค่าผ่านที่ถูกที่สุดจาก 1 ไป 2\n\ninput: `n c12` แล้วปีละหนึ่งบรรทัด: `k t1 p1 t2 p2 …`\n\nตัวอย่าง (n = 5, c12 = 10) → `10 9 7`\n\n## 2. จริง ๆ แล้วถามอะไร\nการหาเส้นทางสั้นสุดใหม่ทุกปีคือ Dijkstra n ครั้ง: 700 × (E log V) โดย E ถึง 245,000: ราว 10⁹ ถึง 2 × 10⁹ ช้าเกินไป\n\nกุญแจคือความหมายของลูปนอกสุดของ Floyd–Warshall หลังเฟส k:\n\n> d[a][b] = เส้นทาง a → b ที่ถูกที่สุดซึ่ง **จุดแวะ** (ปมด้านใน) ทั้งหมดอยู่ใน {1, …, k}\n\nเส้นทางจาก 1 ไป 2 ที่แวะเฉพาะจังหวัด ≤ k ใช้แค่จังหวัด 1..k และถนนทุกเส้นระหว่างจังหวัด ≤ k มีอยู่แล้วในปีที่ k (ถนนที่สร้างในปี i เชื่อม i กับจังหวัดที่เก่ากว่า) ดังนั้น **d[1][2] หลังเฟส k คือคำตอบของปีที่ k พอดี**\n\n```text\nsample:  year 3: 3–1 (6), 3–2 (7)\n         year 4: 4–1 (1), 4–3 (1), 4–2 (9)\n         year 5: 5–1 (2), 5–2 (5)\n\n   year 3: 1 → 2 direct            = 10\n   year 4: 1 → 4 → 3 → 2  1+1+7    = 9\n   year 5: 1 → 5 → 2      2+5      = 7\n```\n\n:::hint คำใบ้ 1\nลูป `for k` ของ Floyd–Warshall เพิ่มปมทีละปมเป็นจุดแวะที่อนุญาต จังหวัดถูก \"เพิ่ม\" เข้าประเทศตามลำดับไหน\n:::\n:::hint คำใบ้ 2\nอ่านถนนทั้งหมดก่อน แล้วรัน Floyd–Warshall ครั้งเดียวด้วย k = 1, 2, …, n และพิมพ์ d[1][2] ตอนจบทุกเฟส k ≥ 3\n:::\n\n## 3. อะไร ทำไม อย่างไร\n- **อะไร:** Floyd–Warshall ธรรมดาครั้งเดียว อ่านคำตอบออกหลังแต่ละเฟส\n- **ทำไมอ่านถนนทั้งหมดล่วงหน้าได้:** ในเฟส k ถนนที่ไปจังหวัด j > k จะปรากฏได้แค่เป็นก้าว **แรกหรือก้าวสุดท้าย** ของ d[a][b] ที่ a = j หรือ b = j มันไม่ถูกใช้ข้างในเส้นทาง 1 → 2 จนถึงเฟส j เพราะ j ยังไม่ใช่จุดแวะที่อนุญาต\n- **ทำไม invariant ถูกต้อง:** ก่อนเฟส k, d[a][b] ใช้จุดแวะ < k เส้นทางที่ดีที่สุดที่จุดแวะ ≤ k จะไม่ผ่าน k (นับไว้แล้ว) หรือผ่าน k หนึ่งครั้ง: d[a][k] + d[k][b] นี่คือการอัปเดตของ Floyd\n- **อย่างไร:** d = INF, d[i][i] = 0 ใส่ถนน (ถ้าคู่ซ้ำ เก็บอันที่ถูกกว่า) สำหรับ k = 1..n: ทุก a, b: d[a][b] = min(d[a][b], d[a][k] + d[k][b]); ถ้า k ≥ 3 พิมพ์ d[1][2]\n- **ต้นทุน:** n³ = 3.4 × 10⁸ การบวกง่าย ๆ การข้ามแถวที่ d[a][k] = INF ช่วยได้ วัดได้ 0.26 วินาที\n- **ขนาด:** ค่าเส้นทางไม่เกิน 1,000,000 + 700 · 1,000 < 2 × 10⁹: `int` ใช้ได้ โดยมี INF = 10⁹ และการข้ามแถว INF กันไม่ให้ INF + INF ล้น\n\n## 4. โค้ดเฉลย\n{{code}}\n{{tests}}\n\n**ไล่ค่า**: ตัวอย่าง ค่าของ d[1][2] และช่องที่ทำให้มันเปลี่ยน:\n\n| เฟส k | จุดแวะใหม่ | ค่าที่เกี่ยวข้อง | d[1][2] | พิมพ์ |\n|---|---|---|---|---|\n| 1 | จังหวัด 1 | d[2][3] = min(7, 10+6) = 7 | 10 | |\n| 2 | จังหวัด 2 | ไม่มีอะไรดีขึ้นสำหรับ 1 → 2 | 10 | |\n| 3 | จังหวัด 3 | d[1][3] + d[3][2] = 6 + 7 = 13; d[4][2] = min(9, 1+7) = 8 | 10 | **10** |\n| 4 | จังหวัด 4 | d[1][4] + d[4][2] = 1 + 8 = 9 | 9 | **9** |\n| 5 | จังหวัด 5 | d[1][5] + d[5][2] = 2 + 5 = 7 | 7 | **7** |\n\n## 5. จุดที่มักพลาด\n- **Dijkstra หนึ่งครั้งต่อปี:** ถูกต้องแต่ช้าเกินไปเมื่อ n = 700 และถนนหนาแน่น\n- **รัน Floyd–Warshall ทุกปี:** O(n⁴) ช้าเกินไปมาก\n- **Floyd ที่ลูป k อยู่ข้างใน:** ลำดับของสามลูปสำคัญ k ต้องอยู่ **นอกสุด** ไม่อย่างนั้น invariant หายไป\n- **ค่าผ่าน 0:** อนุญาต Floyd จัดการได้\n- **คู่ (a, b) ซ้ำ:** เก็บค่าที่น้อยกว่า\n- **ล้นจาก INF + INF:** ข้ามแถวที่ d[a][k] เป็น INF (โค้ดทำแล้ว) หรือใช้ `long long`\n\n## 6. ความรู้พื้นฐาน\nบทที่ 17 Floyd–Warshall คือ DP บน \"ปมไหนใช้เป็นจุดแวะได้บ้าง\" ข้อนี้ให้รางวัลกับคนที่เข้าใจ **invariant** นี้ ไม่ใช่แค่จำโค้ด ไอเดียเดียวกันตอบคำถามแบบ \"เส้นทางสั้นสุดที่ใช้เฉพาะปม ≤ k\" หรือ \"เพิ่มปมทีละปม\" ได้ใน O(n³) รวม ถ้ามีจุดเริ่มเดียวและน้ำหนักไม่ติดลบใช้ [Dijkstra](#a61_q2_farthest) ถ้ามีน้ำหนักติดลบใช้ [Bellman–Ford](#ex06e2_shortest)"}}, {"id": "da66_f1_linear_recurrence", "group": "final", "lesson": "14 · Dynamic programming I (bottom-up table)", "stars": 2, "complexity": "O(n · k)", "kind": "program", "tags": ["bottom-up DP", "recurrence", "modular arithmetic", "long long products"], "title": {"en": "Linear recurrence", "th": "ความสัมพันธ์เวียนเกิดเชิงเส้น (Linear Recurrence)"}, "blurb": {"en": "R(n) = c1·R(n−1) + … + ck·R(n−k), with R(0..k−1) given; print R(n) mod 32717. Fill a table from left to right: each value needs only the k before it.", "th": "R(n) = c1·R(n−1) + … + ck·R(n−k) โดยให้ R(0..k−1) มา ให้พิมพ์ R(n) mod 32717 เติมตารางจากซ้ายไปขวา แต่ละค่าใช้แค่ k ค่าก่อนหน้า"}, "tests": {"en": "all 5 PDF samples, Fibonacci F(10) = 55, and n < k (answer = a_n); 300 random inputs against a Python big-integer evaluation taken mod 32717 at the end; k = n = 1,000 (the largest case) in 0.005 s.", "th": "ตัวอย่างทั้ง 5 ชุดใน PDF, Fibonacci F(10) = 55 และกรณี n < k (คำตอบ = a_n); สุ่ม 300 ชุดเทียบกับการคำนวณด้วยจำนวนเต็มใหญ่ใน Python แล้ว mod 32717 ตอนท้าย; k = n = 1,000 (กรณีใหญ่สุด) ใช้ 0.005 วินาที"}, "files": [{"name": "main.cpp", "src": "#include <iostream>\n#include <vector>\nusing namespace std;\n\nconst int MOD = 32717;\n\nint main() {\n    int k, n;\n    cin >> k >> n;\n    vector<int> c(k + 1), R(max(n, k - 1) + 1);\n    // c[1] .. c[k]: the coefficients\n    for (int i = 1; i <= k; i++) cin >> c[i];\n    // R[0] .. R[k-1] = a[0] .. a[k-1]: the starting values (reduced mod 32717)\n    for (int i = 0; i < k; i++) { cin >> R[i]; R[i] %= MOD; }\n    // Bottom-up DP: R[i] for i = k, k+1, ..., n, each from the k values before it\n    for (int i = k; i <= n; i++) {\n        long long sum = 0;\n        // j = 1 .. k: add c[j] * R[i-j]\n        for (int j = 1; j <= k; j++) sum = (sum + (long long)c[j] * R[i - j]) % MOD;\n        R[i] = sum;\n    }\n    cout << R[n] << \"\\n\";\n}\n"}], "body": {"en": "## 1. What the problem says\nCompute R(n), where\n\n```text\nR(n) = c1·R(n−1) + c2·R(n−2) + … + ck·R(n−k)    if n ≥ k\nR(n) = a_n                                       if n < k\n```\n\nThe values can be huge, so print **R(n) mod 32717**. With k = 2, c1 = c2 = 1, a0 = 0, a1 = 1 this is Fibonacci.\n\nInput: `k n`, then c1..ck, then a0..a(k−1) (all 0..1,000). Limits: k ≤ 1,000 and n ≤ 1,000.\n\nSample 1: k = 2, n = 4, c = (2, 10), a = (2, 3) → **424**.\n\n## 2. What it really means\nEvery R(i) depends on the k values right before it, and those are smaller indices. So compute R(0), R(1), R(2), … in order, and each one is ready when you need it. That is **bottom-up DP**, the same pattern as [Fibonacci](#ex02e1_fibo), with k terms instead of 2.\n\n```text\nindex:   0    1    2              3              4\nR:       2    3    2·3+10·2=26    2·26+10·3=82   2·82+10·26 = 424\n                   ╰── uses R1, R0 ╰── R2, R1     ╰── R3, R2\n```\n\n:::hint Hint 1\nPlain recursion recomputes the same R(i) many times: exponential. What if you store every R(i) once?\n:::\n:::hint Hint 2\nTake mod after every multiplication and addition. A product c · R is at most 1,000 · 32,716 ≈ 3.3 × 10⁷, so it fits easily; use `long long` for the running sum anyway.\n:::\n\n## 3. What, why, how\n- **What:** a 1-D DP table R[0..n], filled left to right.\n- **Why mod at every step is allowed:** (x + y) mod m = ((x mod m) + (y mod m)) mod m and (x · y) mod m = ((x mod m)(y mod m)) mod m. So reducing early never changes the final remainder, and it keeps every number small.\n- **How:** R[i] = a_i mod 32717 for i < k. For i = k..n: sum = Σ_{j=1..k} c_j · R[i − j], reduced mod 32717 after each term. Print R[n].\n- **Cost:** O(n · k) = 10⁶ multiplications: instant.\n- **n < k:** the loop does nothing and R[n] is just a_n (mod 32717). Make the array big enough for both n and k − 1.\n- **Why not matrix power:** a k × k matrix to the power n costs k³ log n ≈ 10¹⁰ here. Matrix power only wins when n is huge and k tiny, like [matmod](#a60_q1_matmod).\n\n## 4. Solution\n{{code}}\n{{tests}}\n\n**Trace**: sample 3 (k = 3, n = 4, c = (7, 3, 2), a = (4, 4, 2)):\n\n| i | c1·R[i−1] + c2·R[i−2] + c3·R[i−3] | R[i] |\n|---|---|---|\n| 0, 1, 2 | given | 4, 4, 2 |\n| 3 | 7·2 + 3·4 + 2·4 = 14 + 12 + 8 | 34 |\n| 4 | 7·34 + 3·2 + 2·4 = 238 + 6 + 8 | **252** |\n\n## 5. Traps\n- **Mixing up the order of c:** c1 multiplies R(n−1), the **closest** value, not R(n−k).\n- **Not reducing a_i:** a_i ≤ 1,000 < 32,717, so it does not matter here, but reducing is the safe habit.\n- **Array too small when n < k:** allocate max(n, k − 1) + 1 cells.\n- **Recursion without memo:** about kⁿ calls.\n- **Taking mod only at the end:** the true values have hundreds of digits.\n\n## 6. Background\nLesson 14. A linear recurrence is the simplest DP: the state is the index, the transition is the formula. When n becomes astronomically large (say 10¹⁸), the same recurrence is solved by **raising its companion matrix to the n-th power** with divide and conquer, as in [matmod](#a60_q1_matmod). See also [Fibonacci](#ex02e1_fibo) and [C(n, k)](#ex02e2_cnk).", "th": "## 1. โจทย์บอกอะไร\nคำนวณ R(n) โดย\n\n```text\nR(n) = c1·R(n−1) + c2·R(n−2) + … + ck·R(n−k)    if n ≥ k\nR(n) = a_n                                       if n < k\n```\n\nค่าอาจใหญ่มาก ให้พิมพ์ **R(n) mod 32717** ถ้า k = 2, c1 = c2 = 1, a0 = 0, a1 = 1 ก็คือ Fibonacci\n\ninput: `k n` ตามด้วย c1..ck แล้ว a0..a(k−1) (ทุกตัว 0..1,000) ขอบเขต: k ≤ 1,000 และ n ≤ 1,000\n\nตัวอย่างที่ 1: k = 2, n = 4, c = (2, 10), a = (2, 3) → **424**\n\n## 2. จริง ๆ แล้วถามอะไร\nR(i) ทุกตัวขึ้นกับ k ค่าก่อนหน้ามันพอดี ซึ่งมีดัชนีน้อยกว่า ดังนั้นคำนวณ R(0), R(1), R(2), … ตามลำดับ แต่ละค่าจะพร้อมใช้เมื่อเราต้องการ นี่คือ **DP แบบ bottom-up** รูปแบบเดียวกับ [Fibonacci](#ex02e1_fibo) แค่มี k พจน์แทน 2\n\n```text\nindex:   0    1    2              3              4\nR:       2    3    2·3+10·2=26    2·26+10·3=82   2·82+10·26 = 424\n                   ╰── uses R1, R0 ╰── R2, R1     ╰── R3, R2\n```\n\n:::hint คำใบ้ 1\nrecursion ธรรมดาคำนวณ R(i) ตัวเดิมซ้ำหลายครั้ง: เอกซ์โพเนนเชียล ถ้าเก็บ R(i) ทุกตัวไว้ครั้งเดียวล่ะ\n:::\n:::hint คำใบ้ 2\nmod หลังทุกการคูณและการบวก ผลคูณ c · R ไม่เกิน 1,000 · 32,716 ≈ 3.3 × 10⁷ ใส่ได้สบาย แต่ใช้ `long long` สำหรับผลรวมไว้ก็ดี\n:::\n\n## 3. อะไร ทำไม อย่างไร\n- **อะไร:** ตาราง DP หนึ่งมิติ R[0..n] เติมจากซ้ายไปขวา\n- **ทำไม mod ทุกขั้นได้:** (x + y) mod m = ((x mod m) + (y mod m)) mod m และ (x · y) mod m = ((x mod m)(y mod m)) mod m การลดค่าเร็วจึงไม่เปลี่ยนเศษสุดท้าย และทำให้ทุกตัวเลขเล็ก\n- **อย่างไร:** R[i] = a_i mod 32717 สำหรับ i < k สำหรับ i = k..n: sum = Σ_{j=1..k} c_j · R[i − j] mod 32717 หลังทุกพจน์ พิมพ์ R[n]\n- **ต้นทุน:** O(n · k) = 10⁶ การคูณ: ทันที\n- **n < k:** ลูปไม่ทำอะไร R[n] ก็คือ a_n (mod 32717) ต้องจองอาร์เรย์ให้พอทั้ง n และ k − 1\n- **ทำไมไม่ใช้ matrix power:** เมทริกซ์ k × k ยกกำลัง n ใช้ k³ log n ≈ 10¹⁰ ในข้อนี้ matrix power ชนะเฉพาะเมื่อ n ใหญ่มากและ k เล็ก แบบข้อ [matmod](#a60_q1_matmod)\n\n## 4. โค้ดเฉลย\n{{code}}\n{{tests}}\n\n**ไล่ค่า**: ตัวอย่างที่ 3 (k = 3, n = 4, c = (7, 3, 2), a = (4, 4, 2)):\n\n| i | c1·R[i−1] + c2·R[i−2] + c3·R[i−3] | R[i] |\n|---|---|---|\n| 0, 1, 2 | ให้มา | 4, 4, 2 |\n| 3 | 7·2 + 3·4 + 2·4 = 14 + 12 + 8 | 34 |\n| 4 | 7·34 + 3·2 + 2·4 = 238 + 6 + 8 | **252** |\n\n## 5. จุดที่มักพลาด\n- **สลับลำดับของ c:** c1 คูณกับ R(n−1) ซึ่งเป็นค่าที่ **ใกล้ที่สุด** ไม่ใช่ R(n−k)\n- **ไม่ลด a_i:** a_i ≤ 1,000 < 32,717 ข้อนี้จึงไม่เป็นไร แต่การลดเป็นนิสัยที่ปลอดภัย\n- **อาร์เรย์เล็กไปเมื่อ n < k:** จอง max(n, k − 1) + 1 ช่อง\n- **recursion ไม่มี memo:** ประมาณ kⁿ ครั้ง\n- **mod แค่ตอนท้าย:** ค่าจริงมีหลายร้อยหลัก\n\n## 6. ความรู้พื้นฐาน\nบทที่ 14 linear recurrence คือ DP ที่ง่ายที่สุด: state คือดัชนี transition คือสูตร ถ้า n ใหญ่มหาศาล (เช่น 10¹⁸) recurrence เดียวกันแก้ได้ด้วยการ **ยกกำลังเมทริกซ์ประกอบ (companion matrix)** แบบแบ่งแยกและเอาชนะ เหมือนข้อ [matmod](#a60_q1_matmod) ดูเพิ่มที่ [Fibonacci](#ex02e1_fibo) และ [C(n, k)](#ex02e2_cnk)"}}, {"id": "da66_f1_map_walk", "group": "final", "lesson": "11 · Recursion & backtracking", "stars": 2, "complexity": "O(number of explored partial paths)", "kind": "program", "tags": ["grid DFS", "backtracking", "visited", "alphabetical order", "32 MB"], "title": {"en": "Map Walk", "th": "เดินบนแผนที่ (Map Walk)"}, "blurb": {"en": "List every command string (A right, B down, C up) that walks from the top-left to the bottom-right without revisiting cells. Depth-first search trying A, B, C in that order.", "th": "แจกแจงทุกลำดับคำสั่ง (A ขวา, B ลง, C ขึ้น) ที่เดินจากมุมซ้ายบนไปมุมขวาล่างโดยไม่กลับไปช่องเดิม ใช้ DFS ลอง A, B, C ตามลำดับ"}, "tests": {"en": "all 5 PDF samples plus a 1×1 map; 300 random maps up to 3×3 / 2×4 / 1×5 with random walls, compared with a brute force that simulates every string over {A,B,C} up to length R·C−1 and sorts the valid ones; a 10×10 map with 25% walls (5,508 paths) in 0.005 s. On an empty R×R map the answer count is R^(R−1) (checked for 6×6 and 7×7). Memory stays constant: answers go through a 64 KB buffer.", "th": "ตัวอย่างทั้ง 5 ชุดใน PDF และแผนที่ 1×1; สุ่ม 300 แผนที่ขนาดถึง 3×3 / 2×4 / 1×5 พร้อมช่องห้ามเข้าสุ่ม เทียบกับ brute force ที่จำลองทุกสตริงจาก {A,B,C} ยาวถึง R·C−1 แล้วเรียงเฉพาะแบบที่ถูก; แผนที่ 10×10 ที่มีช่องห้ามเข้า 25% (5,508 เส้นทาง) ใช้ 0.005 วินาที บนแผนที่ว่าง R×R จำนวนคำตอบคือ R^(R−1) (เช็กแล้วกับ 6×6 และ 7×7) หน่วยความจำคงที่ เพราะคำตอบผ่านบัฟเฟอร์ 64 KB"}, "files": [{"name": "main.cpp", "src": "#include <cstdio>\n#include <cstring>\n\nint R, C;\nint blocked[12][12];     // 1 = \"no entry\" cell (1-based rows/columns)\nbool visited[12][12];    // cells already on the current path\nchar path[128];          // the commands of the current path (at most R*C - 1 moves)\n\n// Memory limit is only 32 MB and the number of answers can be large,\n// so answers are written through a small fixed buffer instead of being stored.\nchar buf[1 << 16];\nint blen = 0;\nvoid flush_buf() { fwrite(buf, 1, blen, stdout); blen = 0; }\nvoid emit(const char *s, int len) {\n    if (blen + len + 1 > (int)sizeof(buf)) flush_buf();\n    memcpy(buf + blen, s, len);\n    blen += len;\n    buf[blen++] = '\\n';\n}\n\n// The three moves, in ALPHABETICAL order of their letter:\n// A = right (c+1), B = down (r+1), C = up (r-1).\nconst char LETTER[3] = {'A', 'B', 'C'};\nconst int  DR[3]     = { 0,  +1, -1 };\nconst int  DC[3]     = {+1,   0,  0 };\n\n// We stand on (r, c); path[0 .. len-1] are the commands used to get here.\nvoid walk(int r, int c, int len) {\n    if (r == R && c == C) {               // reached the goal: the game ends immediately\n        emit(path, len);\n        return;\n    }\n    for (int k = 0; k < 3; k++) {         // k = 0, 1, 2 -> try A, then B, then C\n        int nr = r + DR[k], nc = c + DC[k];\n        if (nr < 1 || nr > R || nc < 1 || nc > C) continue;   // rule 1: stay inside the map\n        if (visited[nr][nc]) continue;                         // rule 2: never revisit a cell\n        if (blocked[nr][nc]) continue;                         // rule 4: no-entry cell\n        visited[nr][nc] = true;\n        path[len] = LETTER[k];\n        walk(nr, nc, len + 1);\n        visited[nr][nc] = false;                               // undo: free the cell for other paths\n    }\n}\n\nint main() {\n    if (scanf(\"%d %d\", &R, &C) != 2) return 0;\n    for (int r = 1; r <= R; r++)\n        for (int c = 1; c <= C; c++)\n            if (scanf(\"%d\", &blocked[r][c]) != 1) return 0;\n    visited[1][1] = true;\n    walk(1, 1, 0);\n    flush_buf();\n    printf(\"DONE\\n\");\n}\n"}], "body": {"en": "## 1. What the problem says\nA map has R rows and C columns (1 ≤ R, C ≤ 10); cell (r, c) is row r from the top, column c from the left. A character starts at **(1,1)** and wants to reach **(R,C)**. Commands:\n- **A** = move right to (r, c+1); **B** = move down to (r+1, c); **C** = move up to (r−1, c).\n\nRules: never leave the map; **never enter a cell visited before**; never enter a **no-entry** cell (marked 1 in the input); the game **ends immediately** when (R,C) is reached.\n\nPrint **every** different command string that reaches (R,C), one per line, **in alphabetical order**, then a line `DONE`. Memory limit **32 MB**. Subtasks: 10% R, C ≤ 2 without walls; 10% R, C ≤ 3 without walls; 15% R, C ≤ 3; 25% no answer contains C; 40% nothing else.\n\n## 2. What it really means\nEnumerate all **simple paths** from the top-left to the bottom-right using only right / down / up steps. Sample 2 (2 × 3, no walls):\n\n```text\n  (1,1) (1,2) (1,3)          AAB    → → ↓\n  (2,1) (2,2) (2,3)          ABA    → ↓ →\n                             BAA    ↓ → →\n                             BACAB  ↓ → ↑ → ↓\n```\n\nSince there is no \"left\" move, the path crosses each column once: in each column it goes up or down for a while, then steps right.\n\n:::hint Hint 1\nYou need **every** path in alphabetical order. Which search explores the paths one at a time, and in which order should it try the three moves?\n:::\n:::hint Hint 2\nDFS: mark the cell, write the letter, recurse, then unmark. Trying A, B, C in that order prints the answers in alphabetical order automatically.\n:::\n\n## 3. What, why, how\n- **DFS with backtracking:** `walk(r, c, len)` stands on (r,c) with `len` commands so far. If (r,c) is the goal, output the path and **return** (the game ends). Otherwise try the 3 moves; for each legal one, mark the new cell visited, write the letter, recurse, then **unmark** (so other paths may use the cell).\n- **Alphabetical order for free:** try moves in the order **A, B, C**. Two different answers first differ at some step, and at that step DFS explored the smaller letter first. No answer is a prefix of another (the game stops at the goal), so this is exactly alphabetical order.\n- **Why `visited` must be undone:** a cell used by one path may be needed by another path later (BAA and BACAB both use (2,2)).\n- **Memory 32 MB:** the number of answers can be huge (on an empty R×R map it is R^(R−1): every column except the last can be left from any row). Never store all answers; print each one when found. A small buffer keeps it fast.\n- **Cost:** proportional to the number of explored partial paths; the tests keep the output printable.\n\n## 4. Solution\n{{code}}\n{{tests}}\n\n**Trace of sample 2** (2 × 3; visited cells shown as the path):\n\n| path so far | at | try A | try B | try C |\n|---|---|---|---|---|\n| (empty) | (1,1) | → (1,2) | → (2,1) | outside |\n| A | (1,2) | → (1,3) | → (2,2) | outside |\n| AA | (1,3) | outside | → (2,3) goal: **AAB** | outside |\n| AB | (2,2) | → (2,3) goal: **ABA** | outside | (1,2) visited |\n| B | (2,1) | → (2,2) | outside | (1,1) visited |\n| BA | (2,2) | → (2,3) goal: **BAA** | outside | → (1,2) |\n| BAC | (1,2) | → (1,3) | (2,2) visited | outside |\n| BACA | (1,3) | outside | → (2,3) goal: **BACAB** | outside |\n\nThen `DONE`.\n\n## 5. Traps\n- **Continuing after reaching the goal:** the rule says the game ends. Without the early `return`, a path that reaches (R,C) from the left could go on upward (C) and then never get back, which wastes time, or, with other move sets, produce extra answers. Stop at the goal.\n- **Forgetting to unmark `visited`:** later paths miss cells and answers disappear.\n- **Collecting all answers in a vector and sorting:** memory explodes on big outputs (32 MB) and it's unnecessary because DFS order is already alphabetical.\n- **Forgetting `DONE`**, also when there is no path (sample 3).\n- **1 × 1 map:** start = goal, so there is one answer, the empty command string, printed as an empty line before `DONE`.\n\n## 6. Background\nLesson 11: **backtracking on a grid** (mark, recurse, unmark) and **output in a required order by ordering the choices**. With only right/down moves (the 25% subtask), the count could be found with DP; with the up move and no revisits, enumeration by DFS is the natural tool. For \"shortest path\" instead of \"all paths\", BFS is the right tool (Lesson 16, see Dungeon). This problem sits in the final-preparation chapter, but its technique is the one from the [brute-force chapter](#ch-brute), see [Generate barcode](#ex00e4) and [Consecutive ones](#ex00e5). For shortest paths on a grid see [Pandemic](#a62_q2a_pandemic) and [Sea bridge](#da66_f1_sea_bridge).", "th": "## 1. โจทย์บอกอะไร\nแผนที่มี R แถว C คอลัมน์ (1 ≤ R, C ≤ 10) ช่อง (r, c) คือแถวที่ r นับจากบน คอลัมน์ที่ c นับจากซ้าย ตัวละครเริ่มที่ **(1,1)** และต้องการไป **(R,C)** คำสั่ง:\n- **A** = เดินไปขวา (r, c+1); **B** = เดินลง (r+1, c); **C** = เดินขึ้น (r−1, c)\n\nกฎ: ห้ามเดินออกนอกแผนที่; **ห้ามเข้าช่องที่เคยไปแล้ว**; ห้ามเข้า **ช่องห้ามเข้า** (ค่า 1 ในข้อมูลนำเข้า); เมื่อถึง (R,C) **เกมจบทันที**\n\nพิมพ์ลำดับคำสั่ง **ทุกแบบ** ที่ไปถึง (R,C) บรรทัดละแบบ **เรียงตามตัวอักษร** แล้วปิดท้ายด้วยบรรทัด `DONE` หน่วยความจำจำกัด **32 MB** ชุดทดสอบ: 10% R, C ≤ 2 ไม่มีช่องห้ามเข้า; 10% R, C ≤ 3 ไม่มีช่องห้ามเข้า; 15% R, C ≤ 3; 25% ไม่มีคำตอบที่มีคำสั่ง C; 40% ไม่มีเงื่อนไขอื่น\n\n## 2. จริง ๆ แล้วถามอะไร\nแจกแจง **เส้นทางที่ไม่ซ้ำช่อง** ทั้งหมดจากมุมซ้ายบนไปมุมขวาล่าง โดยใช้แค่ ขวา / ลง / ขึ้น ตัวอย่างที่ 2 (2 × 3 ไม่มีช่องห้ามเข้า):\n\n```text\n  (1,1) (1,2) (1,3)          AAB    → → ↓\n  (2,1) (2,2) (2,3)          ABA    → ↓ →\n                             BAA    ↓ → →\n                             BACAB  ↓ → ↑ → ↓\n```\n\nเพราะไม่มีคำสั่ง \"ซ้าย\" เส้นทางจึงผ่านแต่ละคอลัมน์ครั้งเดียว: ในแต่ละคอลัมน์จะขึ้นหรือลงไปช่วงหนึ่ง แล้วก้าวไปทางขวา (เหมือนเดินในเขาวงกตที่ประตูหมุนให้เดินไปทางขวาได้อย่างเดียว)\n\n:::hint คำใบ้ 1\nต้องการ **ทุก** เส้นทางเรียงตามตัวอักษร การค้นแบบไหนที่ไล่เส้นทางทีละเส้น และควรลองสามท่าตามลำดับไหน\n:::\n:::hint คำใบ้ 2\nDFS: ทำเครื่องหมายช่อง เขียนตัวอักษร เรียกซ้ำ แล้วลบเครื่องหมาย การลอง A, B, C ตามลำดับนี้ทำให้คำตอบออกมาเรียงตามตัวอักษรเอง\n:::\n\n## 3. อะไร ทำไม อย่างไร\n- **DFS แบบ backtracking:** `walk(r, c, len)` ยืนอยู่ที่ (r,c) มีคำสั่งแล้ว `len` ตัว ถ้า (r,c) คือเป้าหมาย พิมพ์เส้นทางแล้ว **return** (เกมจบ) ไม่งั้นลอง 3 ทาง ทางที่ถูกกฎ: ทำเครื่องหมายช่องใหม่ว่าไปแล้ว เขียนตัวอักษร เรียกเวียนเกิด แล้ว **ลบเครื่องหมายออก** (ให้เส้นทางอื่นใช้ช่องนั้นได้)\n- **เรียงตามตัวอักษรได้ฟรี:** ลองตามลำดับ **A, B, C** คำตอบสองแบบที่ต่างกันจะต่างกันครั้งแรกที่ขั้นหนึ่ง และที่ขั้นนั้น DFS สำรวจตัวอักษรที่น้อยกว่าก่อน ไม่มีคำตอบไหนเป็นส่วนต้นของอีกคำตอบ (เกมหยุดที่เป้าหมาย) จึงได้ลำดับตัวอักษรพอดี\n- **ทำไมต้องลบเครื่องหมาย `visited`:** ช่องที่เส้นทางหนึ่งใช้ อาจจำเป็นสำหรับเส้นทางอื่นในภายหลัง (BAA และ BACAB ใช้ (2,2) ทั้งคู่)\n- **หน่วยความจำ 32 MB:** จำนวนคำตอบอาจมหาศาล (บนแผนที่ว่าง R×R มี R^(R−1) แบบ: ทุกคอลัมน์ยกเว้นคอลัมน์สุดท้ายออกได้จากทุกแถว) ห้ามเก็บคำตอบทั้งหมด ให้พิมพ์ทันทีที่เจอ บัฟเฟอร์เล็ก ๆ ช่วยให้เร็ว\n- **เวลา:** แปรผันตามจำนวนเส้นทางบางส่วนที่สำรวจ ชุดทดสอบออกแบบให้ผลลัพธ์พิมพ์ได้ทัน\n\n## 4. โค้ดเฉลย\n{{code}}\n{{tests}}\n\n**ไล่ตัวอย่างที่ 2** (2 × 3):\n\n| เส้นทางตอนนี้ | อยู่ที่ | ลอง A | ลอง B | ลอง C |\n|---|---|---|---|---|\n| (ว่าง) | (1,1) | → (1,2) | → (2,1) | นอกแผนที่ |\n| A | (1,2) | → (1,3) | → (2,2) | นอกแผนที่ |\n| AA | (1,3) | นอกแผนที่ | → (2,3) ถึงเป้า: **AAB** | นอกแผนที่ |\n| AB | (2,2) | → (2,3) ถึงเป้า: **ABA** | นอกแผนที่ | (1,2) ไปแล้ว |\n| B | (2,1) | → (2,2) | นอกแผนที่ | (1,1) ไปแล้ว |\n| BA | (2,2) | → (2,3) ถึงเป้า: **BAA** | นอกแผนที่ | → (1,2) |\n| BAC | (1,2) | → (1,3) | (2,2) ไปแล้ว | นอกแผนที่ |\n| BACA | (1,3) | นอกแผนที่ | → (2,3) ถึงเป้า: **BACAB** | นอกแผนที่ |\n\nแล้วพิมพ์ `DONE`\n\n## 5. จุดที่มักพลาด\n- **เดินต่อหลังถึงเป้าหมาย:** กฎบอกว่าเกมจบ ถ้าไม่ `return` ทันที เส้นทางอาจผ่านเป้าหมายแล้วไปต่อ ทำให้ได้คำตอบเกิน\n- **ลืมลบเครื่องหมาย `visited`:** เส้นทางต่อ ๆ ไปจะใช้ช่องไม่ได้ คำตอบหาย\n- **เก็บคำตอบทั้งหมดใน vector แล้ว sort:** หน่วยความจำระเบิดเมื่อผลลัพธ์เยอะ (32 MB) และไม่จำเป็นเพราะลำดับของ DFS เรียงตามตัวอักษรอยู่แล้ว\n- **ลืม `DONE`** รวมถึงตอนที่ไม่มีเส้นทางเลย (ตัวอย่างที่ 3)\n- **แผนที่ 1 × 1:** จุดเริ่ม = เป้าหมาย มีคำตอบเดียวคือลำดับคำสั่งว่าง พิมพ์เป็นบรรทัดว่างก่อน `DONE`\n\n## 6. ความรู้พื้นฐาน\nบทที่ 11: **backtracking บนตาราง** (ทำเครื่องหมาย เวียนเกิด ลบเครื่องหมาย) และ **ได้ผลลัพธ์ตามลำดับท
