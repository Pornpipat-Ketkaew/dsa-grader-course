t Hint 2\nBefore writing a 0, check that the places left after it can still hold every 1 you still need. Write a 1 only while you still need one.\n:::\n\n## 3. What, why, how\n- `gen(pos, ones)`: the first `pos` characters are fixed and contain `ones` ones.\n  - If `pos == B`, print.\n  - Try `0` **only if** the remaining `B − pos − 1` places can still hold the `A − ones` ones we need.\n  - Try `1` **only if** we still need one (`ones < A`).\n- **Why prune:** without the two checks we would generate all 2^B strings and filter; with them, every branch we enter leads to at least one answer, so the work is proportional to the output: O(C(B,A) · B).\n- 2^20 ≈ 10⁶ would also be fast enough here, but pruning is the habit to learn.\n- **Output:** up to 184,756 lines; collect them in one string and print once.\n\n## 4. Solution\n{{code}}\n{{tests}}\n\n**Trace for `1 3`** (this program's order is 0 before 1):\n\n| call | cur | need ones | places left | try 0? | try 1? |\n|---|---|---|---|---|---|\n| gen(0,0) | ??? | 1 | 3 | 1 ≤ 2 yes | yes |\n| gen(1,0) | 0?? | 1 | 2 | 1 ≤ 1 yes | yes |\n| gen(2,0) | 00? | 1 | 1 | 1 ≤ 0 **no** | yes → **001** |\n| gen(2,1) | 01? | 0 | 1 | yes → **010** | no |\n| gen(1,1) | 1?? | 0 | 2 | yes | no |\n| gen(2,1) | 10? | 0 | 1 | yes → **100** | no |\n\nOutput: 001, 010, 100 (the PDF shows another order, which is also accepted).\n\n## 5. Traps\n- **A = 0 or A = B:** exactly one line (`00…0` or `11…1`). **B = 0** (A = 0): one empty line, C(0,0) = 1.\n- **Duplicates:** generating \"choose positions\" with nested loops in the wrong way (e.g. picking positions in any order) prints each combination A! times. Choosing character by character never repeats.\n- **`endl` per line:** flushes 184,756 times. Use `'\\n'` and one big output.\n- Reading the order requirement: **any** order is fine here, unlike Consecutive Ones (next problem) where the order is fixed.\n\n## 6. Background\nLesson 11: **backtracking** = depth-first search over a decision tree with **pruning** (don't enter a branch that can't lead to a valid answer). Generating combinations, permutations and subsets all follow this skeleton: a recursive `gen(pos, state)`, a base case that records the answer, and a loop/branches over choices with feasibility checks. In this book: the next page, [Consecutive ones](#ex00e5), keeps a fixed order and carries extra state; [Permutation with constraint](#a64_q1_permu_before) uses the same skeleton for permutations.", "th": "## 1. โจทย์บอกอะไร\nบาร์โค้ดเป็นสตริงของ `0` (แท่งดำ) และ `1` (แท่งขาว) บาร์โค้ดแบบ \"interleaved A of B\" มี **B แท่ง ขาวพอดี A แท่ง** รับ A และ B (0 ≤ A ≤ B ≤ 20) แล้วพิมพ์บาร์โค้ดแบบนั้น **ทุกแบบ** บรรทัดละหนึ่งแบบ: ต้องมี C(B, A) บรรทัดที่ไม่ซ้ำกัน **เรียงลำดับใดก็ได้**\n\nตัวอย่าง: `2 5` → สตริงยาว 5 ที่มีเลข 1 สองตัวทั้ง 10 แบบ; `1 3` → 001, 100, 010; `0 2` → 00\n\n## 2. จริง ๆ แล้วถามอะไร\nเลือกว่า **ตำแหน่งไหน A ตำแหน่งจาก B ตำแหน่ง** จะเป็น `1` ก็คือการแจกแจงการจัดหมู่ (combination) ทั้งหมด นึกภาพเป็นต้นไม้การตัดสินใจ: ทุกตำแหน่งเลือก 0 หรือ 1 (เหมือนเดินทางแยก ที่ทุกแยกเลือกซ้ายหรือขวา)\n\n```text\nA = 1, B = 3                       \"???\"   need one 1\n                             0 /           \\ 1\n                         \"0??\"               \"1??\"   need no more 1s\n                       0 /     \\ 1            0 |     (1 not allowed)\n                   \"00?\"       \"01?\"          \"10?\"\n                 0 ✗   \\ 1       0 |            0 |\n          (no room       001     010            100\n           for the 1)\n```\n\nกิ่งที่มี ✗ ถูกตัดทิ้ง: ถ้าใส่ `0` ตรงนั้นจะเหลือที่ไม่พอสำหรับเลข `1` ที่ยังต้องใส่\n\n:::hint คำใบ้ 1\nสร้างบาร์โค้ดทีละแท่งจากซ้ายไปขวา แต่ละตำแหน่งมีสองทางเลือกอะไร และเมื่อไหร่ที่แต่ละทางเป็นไปไม่ได้\n:::\n:::hint คำใบ้ 2\nก่อนเขียน 0 ให้เช็กว่าตำแหน่งที่เหลือหลังจากนั้นยังพอใส่เลข 1 ที่ยังต้องการได้ทั้งหมด และเขียน 1 เฉพาะเมื่อยังต้องการอยู่\n:::\n\n## 3. อะไร ทำไม อย่างไร\n- `gen(pos, ones)`: ตัวอักษร `pos` ตัวแรกถูกกำหนดแล้ว มีเลข 1 อยู่ `ones` ตัว\n  - ถ้า `pos == B` พิมพ์\n  - ลองใส่ `0` **เฉพาะเมื่อ** ที่ที่เหลือ `B − pos − 1` ช่องยังพอใส่เลข 1 ที่ยังขาดอีก `A − ones` ตัว\n  - ลองใส่ `1` **เฉพาะเมื่อ** ยังขาดเลข 1 อยู่ (`ones < A`)\n- **ทำไมต้องตัดกิ่ง:** ถ้าไม่เช็กสองข้อนี้ เราจะสร้างทั้ง 2^B แบบแล้วค่อยกรอง แต่ถ้าเช็ก ทุกกิ่งที่เข้าไปจะได้คำตอบอย่างน้อยหนึ่งตัวเสมอ งานจึงเป็นสัดส่วนกับผลลัพธ์: O(C(B,A) · B)\n- ข้อนี้ 2^20 ≈ 10⁶ ก็ยังเร็วพอ แต่การตัดกิ่งเป็นนิสัยที่ควรฝึก\n- **การพิมพ์:** มากถึง 184,756 บรรทัด เก็บรวมใน string เดียวแล้วพิมพ์ครั้งเดียว\n\n## 4. โค้ดเฉลย\n{{code}}\n{{tests}}\n\n**ไล่กรณี `1 3`** (โปรแกรมนี้ลอง 0 ก่อน 1):\n\n| การเรียก | cur | ยังขาดเลข 1 | ช่องที่เหลือ | ลอง 0? | ลอง 1? |\n|---|---|---|---|---|---|\n| gen(0,0) | ??? | 1 | 3 | 1 ≤ 2 ได้ | ได้ |\n| gen(1,0) | 0?? | 1 | 2 | 1 ≤ 1 ได้ | ได้ |\n| gen(2,0) | 00? | 1 | 1 | 1 ≤ 0 **ไม่ได้** | ได้ → **001** |\n| gen(2,1) | 01? | 0 | 1 | ได้ → **010** | ไม่ได้ |\n| gen(1,1) | 1?? | 0 | 2 | ได้ | ไม่ได้ |\n| gen(2,1) | 10? | 0 | 1 | ได้ → **100** | ไม่ได้ |\n\nผลลัพธ์: 001, 010, 100 (PDF แสดงลำดับอื่น ซึ่งก็ถูกเหมือนกัน)\n\n## 5. จุดที่มักพลาด\n- **A = 0 หรือ A = B:** มีบรรทัดเดียวพอดี (`00…0` หรือ `11…1`) **B = 0** (A = 0): บรรทัดว่างหนึ่งบรรทัด C(0,0) = 1\n- **คำตอบซ้ำ:** ถ้า \"เลือกตำแหน่ง\" ด้วยลูปซ้อนแบบผิด ๆ (เช่นเลือกตำแหน่งเรียงแบบไหนก็ได้) แต่ละแบบจะถูกพิมพ์ A! ครั้ง การเลือกทีละตัวอักษรไม่มีวันซ้ำ\n- **`endl` ทุกบรรทัด:** flush 184,756 ครั้ง ใช้ `'\\n'` และพิมพ์ทีเดียว\n- อ่านเงื่อนไขลำดับให้ดี: ข้อนี้ลำดับ **อะไรก็ได้** ต่างจากข้อ Consecutive Ones (ข้อถัดไป) ที่กำหนดลำดับไว้\n\n## 6. ความรู้พื้นฐาน\nบทที่ 11: **backtracking** = ค้นหาแบบลึกก่อน (DFS) บนต้นไม้การตัดสินใจ พร้อม **ตัดกิ่ง** (ไม่เข้ากิ่งที่ไม่มีทางได้คำตอบที่ถูก) การสร้าง combination, permutation และ subset ใช้โครงเดียวกันหมด: ฟังก์ชันเวียนเกิด `gen(pos, state)`, กรณีฐานที่บันทึกคำตอบ และลูป/ทางเลือกพร้อมเงื่อนไขว่ายังเป็นไปได้ ในหนังสือเล่มนี้: หน้าถัดไป [Consecutive ones](#ex00e5) ต้องเรียงตามลำดับและพกสถานะเพิ่ม ส่วน [Permutation with constraint](#a64_q1_permu_before) ใช้โครงเดียวกันกับ permutation"}}, {"id": "ex00e5", "group": "brute", "lesson": "11 · Recursion & backtracking", "stars": 1, "complexity": "O(2ⁿ · n)", "kind": "program", "tags": ["binary strings", "recursion order", "state passed down"], "title": {"en": "Consecutive Ones", "th": "เลข 1 ติดกัน (Consecutive Ones)"}, "blurb": {"en": "All n-bit strings, in increasing order, that contain at least k consecutive 1s. Recurse 0-then-1 and carry the current run length.", "th": "สตริง n บิตทุกตัวที่มีเลข 1 ติดกันอย่างน้อย k ตัว เรียงจากน้อยไปมาก เวียนเกิดโดยลอง 0 ก่อน 1 และพกความยาวช่วง 1 ปัจจุบันไปด้วย"}, "tests": {"en": "all 3 PDF samples (the PDF's third sample is missing 11100, which does contain three 1s in a row; the program prints it); 12 more (n, k) pairs including k = 0, k = n, n = 0 and n = 20, compared line by line with a Python brute force over all 2ⁿ numbers; n = 20, k = 0 (1,048,576 lines) in 0.05 s.", "th": "ตัวอย่างทั้ง 3 ชุดใน PDF (ตัวอย่างที่สามใน PDF ขาด 11100 ซึ่งมีเลข 1 ติดกันสามตัว โปรแกรมนี้พิมพ์ออกมาด้วย); อีก 12 คู่ (n, k) รวม k = 0, k = n, n = 0 และ n = 20 เทียบทีละบรรทัดกับ brute force ใน Python ที่ไล่ทุกเลข 2ⁿ ตัว; n = 20, k = 0 (1,048,576 บรรทัด) ใช้ 0.05 วินาที"}, "files": [{"name": "main.cpp", "src": "#include <iostream>\n#include <string>\nusing namespace std;\n\nint n, k;\nstring cur;      // the n-bit string being built\nstring out;      // all answers, printed once at the end (up to 2^20 lines)\n\n// pos  = how many bits are decided (cur[0 .. pos-1])\n// run  = length of the block of '1's that ends at position pos-1 (0 if the last bit is '0')\n// ok   = have we ALREADY seen k consecutive '1's somewhere in cur[0 .. pos-1]?\nvoid gen(int pos, int run, bool ok) {\n    if (pos == n) {\n        if (ok) { out += cur; out += '\\n'; }\n        return;\n    }\n    // '0' first, then '1': this visits the strings in increasing numeric order\n    cur[pos] = '0';\n    gen(pos + 1, 0, ok);                          // a '0' breaks the current run\n    cur[pos] = '1';\n    gen(pos + 1, run + 1, ok || run + 1 >= k);    // a '1' extends it; reaching k sets ok forever\n}\n\nint main() {\n    ios_base::sync_with_stdio(false); cin.tie(0);\n    cin >> n >> k;\n    cur.assign(n, '0');\n    gen(0, 0, k == 0);                            // k = 0: every string qualifies (a run of 0 ones always exists)\n    cout << out;\n}\n"}], "body": {"en": "## 1. What the problem says\nPrint every **n-bit binary number** that contains **at least k consecutive 1s**, one per line, **from smallest to largest**. Input: `n k` with 0 ≤ k ≤ n ≤ 20.\n\nSamples: `3 2` → 011, 110, 111. `4 2` → 0011 0110 0111 1011 1100 1101 1110 1111. `5 3` → 00111 01110 01111 10111 11100 11101 11110 11111.\n\n**Note:** the PDF's third sample leaves out `11100`, but it clearly has three 1s in a row. That is a typo in the PDF; the correct output includes it.\n\n## 2. What it really means\nTwo parts: **generate** all 2ⁿ strings in numeric order, and **filter** by \"has a block of k ones\".\n\nFor fixed-length binary strings, numeric order = dictionary order, and a recursion that tries `0` before `1` at each position produces exactly that order:\n\n```text\nn = 3:     0 → 0 → 0  = 000\n                 → 1  = 001\n             → 1 → 0  = 010\n                 → 1  = 011  ✓ (k = 2)\n           1 → 0 → 0  = 100\n                 → 1  = 101\n             → 1 → 0  = 110  ✓\n                 → 1  = 111  ✓\n```\n\n:::hint Hint 1\nThe output must be in increasing order. If you build the string left to right, which character should you try first at each position?\n:::\n:::hint Hint 2\nPass two extra facts down the recursion: the length of the run of 1s at the end so far, and whether a run of length k has already appeared.\n:::\n\n## 3. What, why, how\n- `gen(pos, run, ok)`:\n  - `run` = length of the block of 1s at the end of what we have so far;\n  - `ok` = whether a block of length ≥ k has **already** appeared.\n- Placing `0` resets `run` to 0. Placing `1` makes `run + 1`, and if that reaches k, `ok` becomes true and **stays true** (we pass `ok || run + 1 >= k`).\n- At `pos == n`: print if `ok`.\n- **k = 0:** every string qualifies (zero consecutive ones always exist), so start with `ok = true`.\n- **Cost:** 2ⁿ leaves, O(2ⁿ · n) characters printed at most: ≈ 2·10⁷ for n = 20. Collect output in one string; printing a million lines with `endl` would be the slow part.\n- Simple alternative: loop v from 0 to 2ⁿ − 1, build the string, check with `s.find(string(k,'1'))`. Also O(2ⁿ · n) and accepted; the recursion avoids re-scanning.\n\n## 4. Solution\n{{code}}\n{{tests}}\n\n**Trace for `3 2`** (only the leaves):\n\n| string | runs of 1s while building | ok at the end | printed? |\n|---|---|---|---|\n| 000 | 0,0,0 | no | |\n| 001 | 0,0,1 | no | |\n| 010 | 0,1,0 | no | |\n| 011 | 0,1,**2** | yes | 011 |\n| 100 | 1,0,0 | no | |\n| 101 | 1,0,1 | no | |\n| 110 | 1,**2**,0 | yes (stays yes after the 0) | 110 |\n| 111 | 1,**2**,3 | yes | 111 |\n\n## 5. Traps\n- **Checking only the run at the end:** \"110\" ends with run 0 but qualifies. That's why `ok` must remember the past.\n- **Trying `1` before `0`:** prints in decreasing order.\n- **k = 0** and **n = 0:** with k = 0 all 2ⁿ strings print; n = 0 gives one empty line.\n- **Leading zeros:** the numbers must be printed with all n bits (`0011`, not `11`).\n- **Trusting the PDF sample literally** (it lacks 11100): the rule in the statement wins.\n\n## 6. Background\nLesson 11: **generate in order by choosing the smaller option first**, and **carry the state you need for the filter** down the recursion (here: current run length and a \"seen\" flag). The same pattern lists strings without two adjacent 1s, balanced parentheses, and so on. When the state is small, the count (instead of the list) can be found with DP over (pos, run, ok), Lesson 14. Compare [Generate barcode](#ex00e4) (any order, pruning) and, for walking a grid in alphabetical order, [Map walk](#da66_f1_map_walk) in the final-preparation chapter.", "th": "## 1. โจทย์บอกอะไร\nพิมพ์ **เลขฐานสองขนาด n บิต** ทุกตัวที่มี **เลข 1 ติดกันอย่างน้อย k ตัว** บรรทัดละตัว **เรียงจากน้อยไปมาก** ข้อมูลนำเข้า: `n k` โดย 0 ≤ k ≤ n ≤ 20\n\nตัวอย่าง: `3 2` → 011, 110, 111 `4 2` → 0011 0110 0111 1011 1100 1101 1110 1111 `5 3` → 00111 01110 01111 10111 11100 11101 11110 11111\n\n**หมายเหตุ:** ตัวอย่างที่สามใน PDF ไม่มี `11100` ทั้งที่มันมีเลข 1 ติดกันสามตัวชัดเจน เป็นการพิมพ์ตกใน PDF คำตอบที่ถูกต้องต้องมีบรรทัดนี้\n\n## 2. จริง ๆ แล้วถามอะไร\nมีสองส่วน: **สร้าง** สตริงทั้ง 2ⁿ แบบตามลำดับตัวเลข และ **กรอง** ด้วยเงื่อนไข \"มีช่วงเลข 1 ยาว k\"\n\nสำหรับสตริงไบนารีความยาวเท่ากัน ลำดับตัวเลข = ลำดับพจนานุกรม และการเวียนเกิดที่ลอง `0` ก่อน `1` ทุกตำแหน่งจะได้ลำดับนั้นพอดี (เหมือนมาตรวัดระยะทางในรถที่หมุนจากหลักขวาสุด):\n\n```text\nn = 3:     0 → 0 → 0  = 000\n                 → 1  = 001\n             → 1 → 0  = 010\n                 → 1  = 011  ✓ (k = 2)\n           1 → 0 → 0  = 100\n                 → 1  = 101\n             → 1 → 0  = 110  ✓\n                 → 1  = 111  ✓\n```\n\n:::hint คำใบ้ 1\nผลลัพธ์ต้องเรียงจากน้อยไปมาก ถ้าสร้างสตริงจากซ้ายไปขวา แต่ละตำแหน่งควรลองตัวอักษรไหนก่อน\n:::\n:::hint คำใบ้ 2\nส่งข้อมูลเพิ่มสองอย่างลงไปใน recursion: ความยาวของช่วงเลข 1 ที่ท้ายสตริงตอนนี้ และว่าเคยมีช่วงยาว k ปรากฏแล้วหรือยัง\n:::\n\n## 3. อะไร ทำไม อย่างไร\n- `gen(pos, run, ok)`:\n  - `run` = ความยาวช่วงเลข 1 ที่อยู่ท้ายสุดของส่วนที่สร้างแล้ว\n  - `ok` = เคยเจอช่วงยาว ≥ k **มาแล้ว** หรือยัง\n- ใส่ `0` → `run` กลับเป็น 0 ใส่ `1` → `run + 1` และถ้าถึง k แล้ว `ok` เป็นจริงและ **จริงตลอดไป** (ส่ง `ok || run + 1 >= k`)\n- เมื่อ `pos == n`: พิมพ์ถ้า `ok`\n- **k = 0:** ทุกสตริงผ่าน (ช่วงเลข 1 ยาว 0 มีอยู่เสมอ) จึงเริ่มด้วย `ok = true`\n- **เวลา:** มีใบ 2ⁿ ใบ พิมพ์ไม่เกิน O(2ⁿ · n) ตัวอักษร ≈ 2·10⁷ สำหรับ n = 20 รวมผลลัพธ์ใน string เดียว การพิมพ์หนึ่งล้านบรรทัดด้วย `endl` จะเป็นส่วนที่ช้าที่สุด\n- วิธีง่ายอีกแบบ: วน v จาก 0 ถึง 2ⁿ − 1 สร้างสตริง แล้วเช็กด้วย `s.find(string(k,'1'))` ก็ O(2ⁿ · n) และผ่านเหมือนกัน การเวียนเกิดแค่ไม่ต้องสแกนซ้ำ\n\n## 4. โค้ดเฉลย\n{{code}}\n{{tests}}\n\n**ไล่กรณี `3 2`** (เฉพาะใบ):\n\n| สตริง | ความยาวช่วง 1 ระหว่างสร้าง | ok ตอนจบ | พิมพ์? |\n|---|---|---|---|\n| 000 | 0,0,0 | ไม่ | |\n| 001 | 0,0,1 | ไม่ | |\n| 010 | 0,1,0 | ไม่ | |\n| 011 | 0,1,**2** | ใช่ | 011 |\n| 100 | 1,0,0 | ไม่ | |\n| 101 | 1,0,1 | ไม่ | |\n| 110 | 1,**2**,0 | ใช่ (ยังใช่หลังเจอ 0) | 110 |\n| 111 | 1,**2**,3 | ใช่ | 111 |\n\n## 5. จุดที่มักพลาด\n- **เช็กแค่ช่วงท้ายสุด:** \"110\" จบด้วยช่วงยาว 0 แต่ผ่านเงื่อนไข นี่คือเหตุผลที่ `ok` ต้องจำอดีตไว้\n- **ลอง `1` ก่อน `0`:** ได้ลำดับจากมากไปน้อย\n- **k = 0** และ **n = 0:** k = 0 พิมพ์ครบ 2ⁿ ตัว; n = 0 ได้บรรทัดว่างหนึ่งบรรทัด\n- **เลข 0 นำหน้า:** ต้องพิมพ์ครบ n บิต (`0011` ไม่ใช่ `11`)\n- **เชื่อตัวอย่างใน PDF ตามตัวอักษร** (ขาด 11100): กฎในโจทย์สำคัญกว่า\n\n## 6. ความรู้พื้นฐาน\nบทที่ 11: **สร้างตามลำดับโดยเลือกทางที่เล็กกว่าก่อน** และ **พกสถานะที่ต้องใช้กรองลงไปในการเวียนเกิด** (ในข้อนี้คือความยาวช่วงปัจจุบันและธง \"เคยเจอแล้ว\") รูปแบบเดียวกันใช้แจกแจงสตริงที่ไม่มี 1 ติดกัน วงเล็บที่สมดุล ฯลฯ ถ้าถามแค่ \"จำนวน\" (ไม่ต้องแจกแจง) และสถานะเล็ก ใช้ DP บน (pos, run, ok) ได้ ดูบทที่ 14 เทียบกับ [Generate barcode](#ex00e4) (ลำดับใดก็ได้ มีการตัดกิ่ง) และการเดินบนตารางตามลำดับตัวอักษรในข้อ [Map walk](#da66_f1_map_walk) ในบทเตรียมสอบปลายภาค"}}, {"id": "ex07e1_nqueen", "group": "brute", "lesson": "11 · Recursion & backtracking", "stars": 1, "complexity": "about O(N!) with heavy pruning", "kind": "program", "tags": ["n-queens", "backtracking", "one queen per row", "diagonals r+c and r-c", "pruning"], "title": {"en": "n-Queen", "th": "วางราชินี n ตัว (n-Queen)"}, "blurb": {"en": "Count the ways to put N ≤ 12 queens on an N × N board with no two attacking. One queen per row; for each row try every column that is not attacked, using three boolean arrays for columns and both diagonals.", "th": "นับจำนวนวิธีวางราชินี N ≤ 12 ตัวบนกระดาน N × N โดยไม่มีคู่ไหนกินกันได้ วางแถวละหนึ่งตัว แต่ละแถวลองทุกคอลัมน์ที่ไม่ถูกโจมตี โดยใช้อาเรย์ bool สามตัวสำหรับคอลัมน์และแนวทแยงทั้งสองทิศ"}, "tests": {"en": "both PDF samples and every N = 1..12 against the known counts (1, 0, 0, 2, 10, 4, 40, 92, 352, 724, 2,680, 14,200); N = 1..8 against a Python brute force over all permutations; N = 12 in 0.05 s.", "th": "ตัวอย่างทั้งสองชุดใน PDF และทุก N = 1..12 เทียบกับค่าที่รู้กันอยู่แล้ว (1, 0, 0, 2, 10, 4, 40, 92, 352, 724, 2,680, 14,200); N = 1..8 เทียบกับ brute force ใน Python ที่ลองทุก permutation; N = 12 ใช้ 0.05 วินาที"}, "files": [{"name": "main.cpp", "src": "#include <iostream>\nusing namespace std;\n\nint n, ways = 0;\nbool colUsed[12], diag1[23], diag2[23];  // diag1 index r + c, diag2 index r - c + n - 1\n\n// place one queen in each row r, r+1, ..., n-1\nvoid place(int r) {\n    if (r == n) { ways++; return; }          // all n rows have a queen: one more solution\n    // try every column of row r\n    for (int c = 0; c < n; c++) {\n        if (colUsed[c] || diag1[r + c] || diag2[r - c + n - 1]) continue;   // attacked\n        colUsed[c] = diag1[r + c] = diag2[r - c + n - 1] = true;\n        place(r + 1);\n        colUsed[c] = diag1[r + c] = diag2[r - c + n - 1] = false;           // undo\n    }\n}\n\nint main() {\n    cin >> n;\n    place(0);\n    cout << ways << \"\\n\";\n}\n"}], "body": {"en": "## 1. What the problem says\nPlace N queens on an N × N chessboard so that no queen attacks another. A queen attacks along its row, its column and both diagonals. Print the **number of different placements** (1 ≤ N ≤ 12).\n\nSamples: N = 4 → **2**, N = 8 → **92**.\n\n## 2. What it really means\nNo two queens share a row, so there is **exactly one queen per row**. Decide row by row which column gets the queen. A square (r, c) is attacked by an earlier queen if that queen is in column c, or on the same \"↘\" diagonal (same r − c), or the same \"↙\" diagonal (same r + c).\n\n```text\nN = 4, one of the 2 answers          the two diagonal labels of each square\n. Q . .     row 0 → column 1         r+c:  0 1 2 3      r-c:  0 -1 -2 -3\n. . . Q     row 1 → column 3               1 2 3 4            1  0 -1 -2\nQ . . .     row 2 → column 0               2 3 4 5            2  1  0 -1\n. . Q .     row 3 → column 2               3 4 5 6            3  2  1  0\n```\n\n:::hint Hint 1\nTwo queens can never be in the same row. So instead of choosing N squares out of N², choose one column for each row.\n:::\n:::hint Hint 2\nKeep three boolean arrays: column used, diagonal r + c used, diagonal r − c used. A square is free when all three are false. Place, recurse to the next row, then remove the queen.\n:::\n\n## 3. What, why, how\n- **What:** backtracking `place(r)` that tries every column of row r; when r reaches N one placement is complete.\n- **Why it is fast enough:** the rows-and-columns rule alone already limits the search to N! orders, and the diagonal checks cut it far more. For N = 12 the search visits about 860,000 nodes (12! is 479 million); it runs in 0.05 s.\n- **How:**\n  - `colUsed[c]`, `diag1[r + c]` (values 0..2N−2), `diag2[r − c + N − 1]` (shift so the index is never negative).\n  - A square is free if all three flags are false; mark them, call `place(r + 1)`, unmark them.\n  - The checks are O(1), not a loop over earlier queens.\n- **Cost:** a little more than the number of nodes in the pruned tree; nothing else.\n\n## 4. Solution\n{{code}}\n{{tests}}\n\n**Trace**: N = 4 (column chosen for rows 0, 1, 2, 3; \"✗\" = every column of the next row is attacked).\n\n| path of columns | what happens |\n|---|---|\n| 0 → 2 | row 2: columns 0, 1, 2, 3 all attacked ✗ |\n| 0 → 3 → 1 | row 3: all attacked ✗ |\n| 1 → 3 → 0 → 2 | all 4 rows filled: **solution 1** |\n| 2 → 0 → 3 → 1 | **solution 2** |\n| 3 → 0 → 2 | row 3: all attacked ✗ |\n| 3 → 1 | row 2: all attacked ✗ |\n\nCount **2**. The two solutions are mirror images of each other.\n\n## 5. Traps\n- **Negative index** for the r − c diagonal: shift by N − 1, and size the arrays 2N − 1.\n- **Forgetting to undo** the three flags after the recursive call: later branches see phantom queens and the count is too small.\n- **Scanning all earlier queens** for each square works but costs an extra factor N; fine for N ≤ 12, slower for bigger N.\n- **Choosing squares instead of rows:** C(144, 12) candidates for N = 12 is hopeless.\n- **N = 2 and N = 3** have 0 solutions, not an error.\n\n## 6. Background\nLesson 11. N-queens is the classic backtracking example. Faster versions use **bit masks**: the free columns of the next row are `~(cols | d1 | d2)` with d1 shifted left and d2 shifted right by one each row, which handles N up to about 16 in a second. Exploiting the mirror symmetry (only try the first half of the columns in row 0, then double) halves the time again.", "th": "## 1. โจทย์บอกอะไร\nวางราชินี N ตัวบนกระดานหมากรุก N × N โดยไม่มีราชินีตัวไหนกินตัวอื่นได้ ราชินีกินได้ตามแถว คอลัมน์ และแนวทแยงทั้งสองทิศ ให้พิมพ์ **จำนวนวิธีวางที่แตกต่างกัน** (1 ≤ N ≤ 12)\n\nตัวอย่าง: N = 4 → **2**, N = 8 → **92**\n\n## 2. จริง ๆ แล้วถามอะไร\nราชินีสองตัวอยู่แถวเดียวกันไม่ได้ จึงมี **ราชินีแถวละหนึ่งตัวพอดี** ตัดสินใจทีละแถวว่าราชินีอยู่คอลัมน์ไหน ช่อง (r, c) ถูกโจมตีโดยราชินีก่อนหน้า ถ้าราชินีนั้นอยู่คอลัมน์ c หรืออยู่บนแนวทแยง \"↘\" เดียวกัน (r − c เท่ากัน) หรือแนวทแยง \"↙\" เดียวกัน (r + c เท่ากัน)\n\n```text\nN = 4, one of the 2 answers          the two diagonal labels of each square\n. Q . .     row 0 → column 1         r+c:  0 1 2 3      r-c:  0 -1 -2 -3\n. . . Q     row 1 → column 3               1 2 3 4            1  0 -1 -2\nQ . . .     row 2 → column 0               2 3 4 5            2  1  0 -1\n. . Q .     row 3 → column 2               3 4 5 6            3  2  1  0\n```\n\n:::hint คำใบ้ 1\nราชินีสองตัวอยู่แถวเดียวกันไม่ได้แน่ ๆ ดังนั้นแทนที่จะเลือก N ช่องจาก N² ช่อง ให้เลือกคอลัมน์ให้แต่ละแถว\n:::\n:::hint คำใบ้ 2\nเก็บอาเรย์ bool สามตัว: คอลัมน์ถูกใช้, แนวทแยง r + c ถูกใช้, แนวทแยง r − c ถูกใช้ ช่องว่างเมื่อทั้งสามเป็น false วางราชินี เรียกแถวถัดไป แล้วยกราชินีออก\n:::\n\n## 3. อะไร ทำไม อย่างไร\n- **อะไร:** backtracking `place(r)` ที่ลองทุกคอลัมน์ของแถว r เมื่อ r ถึง N ก็ได้การวางครบหนึ่งแบบ\n- **ทำไมเร็วพอ:** กฎแถวกับคอลัมน์อย่างเดียวก็จำกัดการค้นหาเหลือ N! ลำดับแล้ว และการเช็กแนวทแยงตัดได้อีกมาก สำหรับ N = 12 การค้นหาเยี่ยมราว 860,000 ปม (ขณะที่ 12! คือ 479 ล้าน) ใช้ 0.05 วินาที\n- **อย่างไร:**\n  - `colUsed[c]`, `diag1[r + c]` (ค่า 0..2N−2), `diag2[r − c + N − 1]` (เลื่อนเพื่อไม่ให้ index ติดลบ)\n  - ช่องว่างถ้าธงทั้งสามเป็น false ตั้งธง เรียก `place(r + 1)` แล้วเอาธงออก\n  - การเช็กเป็น O(1) ไม่ต้องวนดูราชินีก่อนหน้าทุกตัว\n- **ต้นทุน:** มากกว่าจำนวนปมในต้นไม้ที่ถูกตัดกิ่งแล้วเพียงเล็กน้อย ไม่มีอย่างอื่น\n\n## 4. โค้ดเฉลย\n{{code}}\n{{tests}}\n\n**ไล่ค่า**: N = 4 (คอลัมน์ที่เลือกสำหรับแถว 0, 1, 2, 3; \"✗\" = ทุกคอลัมน์ของแถวถัดไปถูกโจมตี)\n\n| ลำดับคอลัมน์ | เกิดอะไรขึ้น |\n|---|---|\n| 0 → 2 | แถว 2: คอลัมน์ 0, 1, 2, 3 ถูกโจมตีหมด ✗ |\n| 0 → 3 → 1 | แถว 3: ถูกโจมตีหมด ✗ |\n| 1 → 3 → 0 → 2 | ครบ 4 แถว: **คำตอบที่ 1** |\n| 2 → 0 → 3 → 1 | **คำตอบที่ 2** |\n| 3 → 0 → 2 | แถว 3: ถูกโจมตีหมด ✗ |\n| 3 → 1 | แถว 2: ถูกโจมตีหมด ✗ |\n\nได้ **2** วิธี ทั้งสองแบบเป็นภาพสะท้อนของกันและกัน\n\n## 5. จุดที่มักพลาด\n- **index ติดลบ** ของแนวทแยง r − c: เลื่อนด้วย N − 1 และให้อาเรย์ยาว 2N − 1\n- **ลืมเอาธงออก** ทั้งสามหลังเรียก recursion: กิ่งต่อ ๆ ไปจะเห็นราชินีผี และนับได้น้อยไป\n- **วนดูราชินีก่อนหน้าทุกตัว** สำหรับทุกช่องก็ใช้ได้ แต่เสียเพิ่มอีกเท่าตัว N พอไหวสำหรับ N ≤ 12 แต่ช้าลงเมื่อ N ใหญ่ขึ้น\n- **เลือกช่องแทนการเลือกแถว:** C(144, 12) แบบสำหรับ N = 12 ไม่มีทางทันเวลา\n- **N = 2 และ N = 3** มี 0 วิธี ไม่ใช่ข้อผิดพลาด\n\n## 6. ความรู้พื้นฐาน\nบทที่ 11 N-queens เป็นตัวอย่าง backtracking คลาสสิก เวอร์ชันที่เร็วกว่าใช้ **bit mask**: คอลัมน์ว่างของแถวถัดไปคือ `~(cols | d1 | d2)` โดยเลื่อน d1 ไปทางซ้ายและ d2 ไปทางขวาหนึ่งบิตทุกแถว ทำได้ถึง N ประมาณ 16 ในหนึ่งวินาที การใช้สมมาตรแบบกระจก (ลองแค่ครึ่งแรกของคอลัมน์ในแถว 0 แล้วคูณสอง) ลดเวลาลงอีกครึ่ง"}}, {"id": "a64_q1_permu_before", "group": "brute", "lesson": "11 · Recursion & backtracking", "stars": 2, "complexity": "O(answers · n²) in the worst case", "kind": "program", "tags": ["permutations", "lexicographic order", "pruning", "used[]"], "title": {"en": "Permutation with Constraint", "th": "การเรียงสับเปลี่ยนแบบมีเงื่อนไข (Permutation with Constraint)"}, "blurb": {"en": "All permutations of 0..n−1 in lexicographic order where each rule \"a before b\" holds. Never place b while a is still unused.", "th": "การเรียงสับเปลี่ยนทั้งหมดของ 0..n−1 ตามลำดับพจนานุกรม ที่ทุกกฎ \"a มาก่อน b\" เป็นจริง ห้ามวาง b ตราบใดที่ยังไม่ได้วาง a"}, "tests": {"en": "all 5 PDF samples plus a contradictory pair (0 before 1 and 1 before 0 → no output); 300 random cases (n ≤ 7, random rules) compared line by line with Python itertools.permutations + filter; n = 11 with 5 rules (1,247,400 lines) in 0.23 s; n = 20 with a 19-rule chain in 0.006 s thanks to pruning.", "th": "ตัวอย่างทั้ง 5 ชุดใน PDF และคู่ที่ขัดกัน (0 ก่อน 1 และ 1 ก่อน 0 → ไม่มีผลลัพธ์); สุ่ม 300 ชุด (n ≤ 7 กฎสุ่ม) เทียบทีละบรรทัดกับ itertools.permutations + กรอง ใน Python; n = 11 กับกฎ 5 ข้อ (1,247,400 บรรทัด) ใช้ 0.23 วินาที; n = 20 กับกฎต่อกันเป็นสาย 19 ข้อ ใช้ 0.006 วินาทีเพราะตัดกิ่ง"}, "files": [{"name": "main.cpp", "src": "#include <iostream>\n#include <string>\n#include <vector>\nusing namespace std;\n\nint n, m;\nint pred[20];        // pred[b] = the number that must appear before b, or -1 if none\n                     // (each b appears in at most one pair, so one slot is enough)\nbool used[20];       // used[v] = v is already placed in the permutation\nint perm[20];        // perm[0 .. pos-1] = the numbers placed so far\nstring out;\n\nvoid gen(int pos) {\n    if (pos == n) {                                    // a full permutation that obeys every rule\n        for (int i = 0; i < n; i++) {                  // i = 0 .. n-1: print left to right\n            out += to_string(perm[i]);\n            out += (i + 1 < n ? ' ' : '\\n');\n        }\n        return;\n    }\n    // Try values in increasing order 0, 1, ..., n-1 -> permutations come out in lexicographic order.\n    for (int v = 0; v < n; v++) {\n        if (used[v]) continue;                         // already in the permutation\n        if (pred[v] != -1 && !used[pred[v]]) continue; // its \"before\" number is not placed yet:\n                                                       // putting v here would break the rule -> prune\n        used[v] = true;\n        perm[pos] = v;\n        gen(pos + 1);\n        used[v] = false;                               // undo, so the next v can use this position\n    }\n}\n\nint main() {\n    ios_base::sync_with_stdio(false); cin.tie(NULL);\n    cin >> n >> m;\n    for (int i = 0; i < n; i++) { pred[i] = -1; used[i] = false; }\n    for (int i = 0; i < m; i++) {                      // m rules \"a before b\"\n        int a, b;\n        cin >> a >> b;\n        pred[b] = a;\n    }\n    gen(0);\n    cout << out;\n}\n"}], "body": {"en": "## 1. What the problem says\nPrint **all permutations of 0 … n−1** in **lexicographic order** (compare position by position; the first differing position decides), but only those that satisfy **m rules \"a[i] appears before b[i]\"**. The b values are all different; a values may repeat.\n\n- Input: `n m` (1 ≤ n ≤ 20, the samples also use m = 0), then m lines `a b`.\n- Output: one permutation per line, n numbers.\n- Subtasks: 20% n ≤ 4 and m = 0; 30% n ≤ 10; 50% no other limits.\n- Hint from the PDF: for the last 50%, **stop the recursion as soon as a rule is broken** (if 2 must come before 1, never build [1,2,…] or [1,0,2,…]). The inputs are chosen so that this is fast enough.\n\n## 2. What it really means\nStandard \"generate permutations by recursion\" with a filter applied **while building**, not at the end. Sample 4 (n = 4, rules 3 before 2, 2 before 1, so 3 → 2 → 1 in that order; 0 can go anywhere):\n\n```text\nposition:  0    1    2    3\n           0    3    2    1      ← 0 first, then the chain\n           3    0    2    1\n           3    2    0    1\n           3    2    1    0\n```\n\nOnly 4 of the 24 permutations survive.\n\n:::hint Hint 1\nGenerate permutations in lexicographic order the usual way: fill position by position, trying the values in increasing order. When exactly can a rule \"a before b\" be broken?\n:::\n:::hint Hint 2\nOnly when you are about to place b while a is still unused. Store pred[b] = a and skip b in that case.\n:::\n\n## 3. What, why, how\n- **Lexicographic order:** fill positions left to right and at each position try values **0, 1, …, n−1 in increasing order**. The first permutation found has the smallest first element, and so on.\n- **The rule check is local:** a rule \"a before b\" can only be broken at the moment we place b while a is **not yet placed**. So when trying v at the current position, skip it if `pred[v]` exists and is unused. That's all.\n- Because each b has **at most one** a (the b values are distinct), one array `pred[b] = a` stores all rules.\n- **Why pruning is enough:** every branch we skip would only lead to invalid permutations. Without pruning, n = 20 means 20! ≈ 2.4·10¹⁸ leaves; with it, work is proportional to the answers (when the rules have no cycle, every partial permutation we keep can be completed).\n- `used[]` + undo after the recursive call (`used[v] = false`) is the backtracking step.\n\n## 4. Solution\n{{code}}\n{{tests}}\n\n**Trace for sample 2** (n = 3, rule 1 before 2, so `pred[2] = 1`):\n\n| pos | placed so far | try v | decision |\n|---|---|---|---|\n| 0 | — | 0 | ok |\n| 1 | 0 | 1 | ok |\n| 2 | 0 1 | 2 | pred 1 used → ok → **0 1 2** |\n| 1 | 0 | 2 | pred 1 **not used → skip** |\n| 0 | — | 1 | ok |\n| 1 | 1 | 0 | ok → then 2 (pred used) → **1 0 2** |\n| 1 | 1 | 2 | ok → then 0 → **1 2 0** |\n| 0 | — | 2 | pred 1 **not used → skip** (all of 2 _ _ is cut at once) |\n\n## 5. Traps\n- **Generating everything and filtering at the end:** passes only the small subtasks (the PDF says so).\n- **Using `next_permutation` with a final check:** same problem, 20! permutations.\n- **Forgetting to undo `used[v]`** after the recursive call: later branches think v is still placed.\n- **Printing format:** the PDF shows digits stuck together (`012`), but with n up to 20 numbers like 10 and 1,0 would be ambiguous, so print them separated by spaces.\n- **Contradictory rules** (a cycle such as 0 before 1 and 1 before 0): no permutation is valid, and the pruning naturally prints nothing.\n\n## 6. Background\nLesson 11: **permutations with a `used[]` array**, the most common backtracking template, plus **pruning by a partial check**. The rules \"a before b\" form a precedence graph; the valid permutations are exactly its **topological orders** (Lesson 16), and this program lists all of them in lexicographic order. In this book, the generation skeleton is the one from [Generate barcode](#ex00e4); the precedence idea comes back as degree counting in [Cycle in a tree](#a59_q3_cycle).", "th": "## 1. โจทย์บอกอะไร\nพิมพ์ **การเรียงสับเปลี่ยนทั้งหมดของ 0 … n−1** ตาม **ลำดับพจนานุกรม** (เทียบทีละตำแหน่ง ตำแหน่งแรกที่ต่างกันเป็นตัวตัดสิน) แต่เอาเฉพาะแบบที่ทำตาม **กฎ m ข้อ \"a[i] ต้องปรากฏก่อน b[i]\"** ค่า b ไม่ซ้ำกันเลย ส่วน a ซ้ำได้\n\n- ข้อมูลนำเข้า: `n m` (1 ≤ n ≤ 20 ตัวอย่างใช้ m = 0 ด้วย) แล้วตามด้วย m บรรทัด `a b`\n- ผลลัพธ์: บรรทัดละหนึ่งการเรียงสับเปลี่ยน มีตัวเลข n ตัว\n- ชุดทดสอบ: 20% n ≤ 4 และ m = 0; 30% n ≤ 10; 50% ไม่มีข้อกำหนดอื่น\n- คำแนะนำใน PDF: สำหรับ 50% สุดท้าย ให้ **หยุดการเวียนเกิดทันทีที่รู้ว่าผิดกฎ** (ถ้า 2 ต้องมาก่อน 1 อย่าสร้าง [1,2,…] หรือ [1,0,2,…]) ข้อมูลทดสอบถูกเลือกให้วิธีนี้เร็วพอ\n\n## 2. จริง ๆ แล้วถามอะไร\nการ \"สร้าง permutation ด้วยการเวียนเกิด\" แบบมาตรฐาน แต่กรองตั้งแต่ **ระหว่างสร้าง** ไม่ใช่ตอนจบ ตัวอย่างที่ 4 (n = 4 กฎ 3 ก่อน 2 และ 2 ก่อน 1 จึงต้องเป็น 3 → 2 → 1 ตามลำดับ ส่วน 0 อยู่ตรงไหนก็ได้) เหมือนการเข้าแถวที่บางคนต้องยืนหลังคนที่กำหนด:\n\n```text\nposition:  0    1    2    3\n           0    3    2    1      ← 0 first, then the chain\n           3    0    2    1\n           3    2    0    1\n           3    2    1    0\n```\n\nจาก 24 แบบเหลือแค่ 4 แบบ\n\n:::hint คำใบ้ 1\nสร้าง permutation ตามลำดับพจนานุกรมแบบปกติ: เติมทีละตำแหน่ง ลองค่าจากน้อยไปมาก กฎ \"a มาก่อน b\" จะถูกละเมิดได้ตอนไหนพอดี\n:::\n:::hint คำใบ้ 2\nเฉพาะตอนที่กำลังจะวาง b ขณะที่ a ยังไม่ถูกใช้ เก็บ pred[b] = a แล้วข้าม b ในกรณีนั้น\n:::\n\n## 3. อะไร ทำไม อย่างไร\n- **ลำดับพจนานุกรม:** เติมตำแหน่งจากซ้ายไปขวา และทุกตำแหน่งลองค่า **0, 1, …, n−1 จากน้อยไปมาก** แบบแรกที่ได้จึงมีตัวแรกเล็กที่สุด และต่อไปเรื่อย ๆ\n- **การเช็กกฎทำได้เฉพาะจุด:** กฎ \"a ก่อน b\" จะผิดได้แค่ตอนที่เราวาง b ขณะที่ a **ยังไม่ถูกวาง** ดังนั้นตอนลองวาง v ที่ตำแหน่งปัจจุบัน ให้ข้ามถ้า `pred[v]` มีอยู่และยังไม่ถูกใช้ แค่นั้นเอง\n- เพราะแต่ละ b มี a **ได้อย่างมากตัวเดียว** (ค่า b ไม่ซ้ำ) อาร์เรย์เดียว `pred[b] = a` จึงเก็บกฎได้ทั้งหมด\n- **ทำไมตัดกิ่งแค่นี้พอ:** ทุกกิ่งที่เราข้ามนำไปสู่แบบที่ผิดเท่านั้น ถ้าไม่ตัดกิ่ง n = 20 มีใบ 20! ≈ 2.4·10¹⁸ ใบ ถ้าตัด งานเป็นสัดส่วนกับจำนวนคำตอบ (เมื่อกฎไม่เป็นวงวน ทุกการเรียงบางส่วนที่เราเก็บไว้เติมให้ครบได้เสมอ)\n- `used[]` + ยกเลิกหลังเรียกเวียนเกิด (`used[v] = false`) คือขั้น backtracking\n\n## 4. โค้ดเฉลย\n{{code}}\n{{tests}}\n\n**ไล่ตัวอย่างที่ 2** (n = 3 กฎ 1 ก่อน 2 ดังนั้น `pred[2] = 1`):\n\n| pos | วางแล้ว | ลอง v | ตัดสิน |\n|---|---|---|---|\n| 0 | — | 0 | ได้ |\n| 1 | 0 | 1 | ได้ |\n| 2 | 0 1 | 2 | pred 1 ถูกใช้แล้ว → ได้ → **0 1 2** |\n| 1 | 0 | 2 | pred 1 **ยังไม่ถูกใช้ → ข้าม** |\n| 0 | — | 1 | ได้ |\n| 1 | 1 | 0 | ได้ → แล้ว 2 (pred ใช้แล้ว) → **1 0 2** |\n| 1 | 1 | 2 | ได้ → แล้ว 0 → **1 2 0** |\n| 0 | — | 2 | pred 1 **ยังไม่ถูกใช้ → ข้าม** (ตัด 2 _ _ ทั้งหมดในครั้งเดียว) |\n\n## 5. จุดที่มักพลาด\n- **สร้างทุกแบบแล้วค่อยกรองตอนจบ:** ผ่านแค่ชุดทดสอบเล็ก (PDF บอกไว้แล้ว)\n- **ใช้ `next_permutation` แล้วเช็กตอนจบ:** ปัญหาเดียวกัน 20! แบบ\n- **ลืมยกเลิก `used[v]`** หลังเรียกเวียนเกิด: กิ่งต่อ ๆ ไปจะคิดว่า v ยังถูกวางอยู่\n- **รูปแบบการพิมพ์:** PDF แสดงตัวเลขติดกัน (`012`) แต่ n ถึง 20 ตัวเลขอย่าง 10 กับ 1,0 จะกำกวม จึงพิมพ์คั่นด้วยช่องว่าง\n- **กฎที่ขัดกันเอง** (วงวน เช่น 0 ก่อน 1 และ 1 ก่อน 0): ไม่มีแบบไหนถูก การตัดกิ่งจะไม่พิมพ์อะไรเลยโดยอัตโนมัติ\n\n## 6. ความรู้พื้นฐาน\nบทที่ 11: **permutation ด้วยอาร์เรย์ `used[]`** แม่แบบ backtracking ที่พบบ่อยที่สุด บวก **การตัดกิ่งด้วยการเช็กบางส่วน** กฎ \"a ก่อน b\" ประกอบเป็นกราฟลำดับก่อนหลัง การเรียงที่ถูกทั้งหมดก็คือ **topological order** ทั้งหมดของกราฟนั้น (บทที่ 16) และโปรแกรมนี้แจกแจงทั้งหมดตามลำดับพจนานุกรม ในหนังสือเล่มนี้ โครงการสร้างคือแบบเดียวกับ [Generate barcode](#ex00e4) ส่วนไอเดียลำดับก่อนหลังจะกลับมาเป็นการนับดีกรีในข้อ [วงวนในต้นไม้](#a59_q3_cycle)"}}, {"id": "a65_q1_tower_defense", "group": "brute", "lesson": "11 · Recursion & backtracking", "stars": 2, "complexity": "O((m + 1)ᵏ) worst case, k, m ≤ 8", "kind": "program", "tags": ["backtracking", "assignment", "each tower picks a target", "pruning by upper bound", "ignore n"], "title": {"en": "Tower defense", "th": "ป้อมปืนยิงมอนสเตอร์ (Tower Defense)"}, "blurb": {"en": "k ≤ 8 towers each shoot one monster within distance w, taking 1 power off it (never below 0). Minimise the total power left. Try every target for every tower with backtracking, counting only useful hits, and prune when even all remaining towers cannot beat the best.", "th": "ป้อมปืน k ≤ 8 ป้อม แต่ละป้อมยิงมอนสเตอร์หนึ่งตัวที่อยู่ห่างไม่เกิน w ลดพลังลง 1 (ไม่ต่ำกว่า 0) ให้พลังรวมที่เหลือน้อยที่สุด ลองทุกเป้าของทุกป้อมด้วย backtracking นับเฉพาะการยิงที่มีผล และตัดกิ่งเมื่อต่อให้ป้อมที่เหลือยิงโดนหมดก็ไม่ดีกว่าคำตอบที่ดีที่สุด"}, "tests": {"en": "all three PDF samples; 300 random inputs (k, m ≤ 5, w ≤ 4, powers 0..3) against a Python brute force over every target choice of every tower; n = 10⁶ with m = k = 8 and w = n for powers 1000 (answer 7,992), all 1 (answer 0) and 1,1,1,1,1,1,1,0 (only 7 useful hits, so the \"all hit\" shortcut never fires), each in under 0.01 s.", "th": "ตัวอย่างทั้งสามชุดใน PDF; สุ่ม 300 ชุด (k, m ≤ 5, w ≤ 4, พลัง 0..3) เทียบกับ brute force ใน Python ที่ลองทุกการเลือกเป้าของทุกป้อม; n = 10⁶ กับ m = k = 8 และ w = n โดยพลังเป็น 1000 (คำตอบ 7,992), เป็น 1 หมด (คำตอบ 0) และ 1,1,1,1,1,1,1,0 (ยิงมีผลได้แค่ 7 ครั้ง ทางลัด \"ยิงโดนหมด\" จึงไม่เคยทำงาน) แต่ละชุดใช้ไม่ถึง 0.01 วินาที"}, "files": [{"name": "main.cpp", "src": "#include <iostream>\n#include <vector>\n#include <cstdlib>\nusing namespace std;\n\nint n, m, k, w;\nvector<int> p, h, t;\nint best = 0;                // most useful hits found so far\n\n// decide the target of towers i, i+1, ..., k-1; hits = useful hits made so far\n// h[] holds the power each monster still has\nvoid shoot(int i, int hits) {\n    if (hits + (k - i) <= best) return;       // even if every remaining tower hits, no improvement\n    if (i == k) { best = hits; return; }\n    // choice 1..m: tower i shoots monster j (only useful if j is in range and still alive)\n    for (int j = 0; j < m; j++) {\n        if (h[j] > 0 && abs(p[j] - t[i]) <= w) {\n            h[j]--;\n            shoot(i + 1, hits + 1);\n            h[j]++;                           // undo\n        }\n    }\n    // choice 0: tower i makes no useful hit (nothing in range, or it hits a monster already at 0)\n    shoot(i + 1, hits);\n}\n\nint main() {\n    cin >> n >> m >> k >> w;\n    p.resize(m); h.resize(m); t.resize(k);\n    long long total = 0;\n    // monster positions, then their powers, then the tower positions\n    for (int j = 0; j < m; j++) cin >> p[j];\n    for (int j = 0; j < m; j++) { cin >> h[j]; total += h[j]; }\n    for (int i = 0; i < k; i++) cin >> t[i];\n    shoot(0, 0);\n    cout << total - best << \"\\n\";\n}\n"}], "body": {"en": "## 1. What the problem says\nA road has n cells (n ≤ 10⁶). m monsters stand on cells p[i] with power h[i] (several may share a cell). k towers stand on distinct cells t[i]. A tower at x may shoot **one** monster on cells x − w … x + w, once. A hit lowers that monster's power by 1, but **never below 0**. Choose the targets so that the **total power left** is as small as possible, and print it.\n\nInput: `n m k w`, then the m positions p, then the m powers h, then the k tower cells t. In every subtask m, k ≤ 8.\n\nSamples: `10 1 2 1` (monster at 1 with power 10, towers at 2 and 5) → **9**; the same with w = 4 → **8**; `100 3 3 1` (monsters at 80 70 60, power 1 each, towers at 70 71 69) → **2**.\n\n## 2. What it really means\nTotal left = (sum of all powers) − (number of **useful** hits). A hit is useful if the monster still has power when it lands. So: assign each tower to a monster in its range, where monster j can absorb at most h[j] useful hits, and maximise the number of useful hits. With at most 8 towers and 8 monsters there are at most 9⁸ ≈ 4.3 × 10⁷ assignments, and pruning removes almost all of them.\n\n```text\nsample 3, w = 1\ncell:      ...  60  ...  69  70  71  ...  80\nmonster:        M3           M2           M1        power 1 each\ntower:                   T3  T1  T2\n\nT1 (70), T2 (71), T3 (69) can all reach only M2 (cell 70)\nM2 absorbs 1 useful hit, the other two shots are wasted\nleft = 3 − 1 = 2\n```\n\n:::hint Hint 1\nn can be 10⁶, but it plays no role: only the k tower cells and m monster cells matter. Look at how small k and m are.\n:::\n:::hint Hint 2\nRecurse over the towers. Tower i either shoots a monster that is in range and still alive (lower its power, recurse, restore it), or makes no useful hit. Track the number of useful hits, and stop a branch when hits + (towers left) cannot beat the best so far.\n:::\n\n## 3. What, why, how\n- **What:** backtracking `shoot(i, hits)` over towers 0..k−1; the answer is Σh − (most useful hits).\n- **Why brute force:** k, m ≤ 8 is the hint. Every tower has at most m + 1 choices, so even the full tree is at most 9⁸ leaves.\n- **Why \"no useful hit\" is one choice:** shooting a dead monster, shooting nothing, or having nothing in range all change nothing, so they collapse into one branch.\n- **How:**\n  - Read powers into `h` and keep the sum `total` (it fits in `long long` easily).\n  - In `shoot(i, hits)`: first the bound `if (hits + (k − i) <= best) return;`. Then, at i = k, record `best = hits`.\n  - For each monster j with `h[j] > 0` and `|p[j] − t[i]| ≤ w`: `h[j]--`, recurse with hits + 1, `h[j]++`.\n  - Finally the \"no useful hit\" branch: `shoot(i + 1, hits)`.\n- **Order matters for speed:** trying hits before the \"no hit\" branch finds a large `best` early, so the bound cuts more.\n- **Cost:** at most (m + 1)ᵏ leaves; measured under 0.01 s on the worst inputs we could build.\n\n## 4. Solution\n{{code}}\n{{tests}}\n\n**Trace**: sample 3. Towers in input order T1 = 70, T2 = 71, T3 = 69; M2 = the monster at 70; the bound is \"hits + towers left ≤ best → prune\".\n\n| call | M2 power | what happens |\n|---|---|---|\n| shoot(0, 0) | 1 | bound 0 + 3 > 0; T1 shoots M2 |\n| shoot(1, 1) | 0 | T2: M2 is dead, nothing else in range → no useful hit |\n| shoot(2, 1) | 0 | T3: same → no useful hit |\n| shoot(3, 1) | 0 | all towers decided: **best = 1** |\n| back in shoot(0, 0) | 1 | M2 restored; now T1 makes no useful hit |\n| shoot(1, 0) | 1 | bound 0 + 2 > 1; T2 shoots M2 |\n| shoot(2, 1) | 0 | bound 1 + 1 > 1; T3: no useful hit |\n| shoot(3, 1) | 0 | bound 1 + 0 ≤ 1: pruned |\n| shoot(2, 0) | 1 | bound 0 + 1 ≤ 1: pruned |\n\nMost useful hits = 1, so the answer is 3 − 1 = **2**.\n\n## 5. Traps\n- **Allocating an array of size n** for the road: unnecessary, and 10⁶ cells per test is a waste. Only positions matter.\n- **Letting power go below 0:** without the `h[j] > 0` check, sample 3 would print 0 instead of 2.\n- **Counting hits on dead monsters** as progress: the bound and `best` must count only useful hits.\n- **Range test with the wrong sign:** use `abs(p − t) <= w`; a tower may stand on a monster's cell (distance 0).\n- **Greedy \"each tower, in input order, shoots the strongest monster in range\":** `5 2 2 1`, monsters at 2 and 4 with power 1 each, towers at 3 and 1. The tower at 3 reaches both and takes the first one (cell 2); the tower at 1 can only reach cell 2, which is now dead, so 1 power is left. The best is 0: tower 3 shoots cell 4, tower 1 shoots cell 2. Brute force needs no such case analysis.\n\n## 6. Background\nLesson 11. The underlying problem is a **bipartite b-matching** (towers on one side, monsters with capacity h on the other), which max flow solves in polynomial time for any size. With m, k ≤ 8 the exam expects the backtracking. Spotting that the big number (n = 10⁶) is irrelevant and the small ones (8) decide the method is the real lesson here.", "th": "## 1. โจทย์บอกอะไร\nถนนมี n ช่อง (n ≤ 10⁶) มีมอนสเตอร์ m ตัวอยู่ที่ช่อง p[i] พลัง h[i] (หลายตัวอยู่ช่องเดียวกันได้) มีป้อมปืน k ป้อมอยู่คนละช่อง t[i] ป้อมที่ช่อง x ยิงมอนสเตอร์ **หนึ่งตัว** ในช่อง x − w … x + w ได้ครั้งเดียว การยิงโดนลดพลังมอนสเตอร์ตัวนั้นลง 1 แต่ **ไม่ต่ำกว่า 0** ให้เลือกเป้าให้ **พลังรวมที่เหลือ** น้อยที่สุดแล้วพิมพ์ออกมา\n\ninput: `n m k w` แล้วตำแหน่ง p ทั้ง m ค่า แล้วพลัง h ทั้ง m ค่า แล้วช่องของป้อม t ทั้ง k ค่า ทุกชุดทดสอบ m, k ≤ 8\n\nตัวอย่าง: `10 1 2 1` (มอนสเตอร์ที่ 1 พลัง 10 ป้อมที่ 2 และ 5) → **9**; แบบเดียวกันแต่ w = 4 → **8**; `100 3 3 1` (มอนสเตอร์ที่ 80 70 60 พลังตัวละ 1 ป้อมที่ 70 71 69) → **2**\n\n## 2. จริง ๆ แล้วถามอะไร\nพลังที่เหลือ = (ผลรวมพลังทั้งหมด) − (จำนวนการยิงที่ **มีผล**) การยิงมีผลถ้ามอนสเตอร์ยังมีพลังตอนโดน ดังนั้น: จับคู่ป้อมแต่ละป้อมกับมอนสเตอร์ในระยะ โดยมอนสเตอร์ j รับการยิงที่มีผลได้ไม่เกิน h[j] ครั้ง แล้วทำให้จำนวนการยิงที่มีผลมากที่สุด เมื่อมีป้อมไม่เกิน 8 และมอนสเตอร์ไม่เกิน 8 การจับคู่มีไม่เกิน 9⁸ ≈ 4.3 × 10⁷ แบบ และการตัดกิ่งตัดเกือบทั้งหมดทิ้ง\n\n```text\nsample 3, w = 1\ncell:      ...  60  ...  69  70  71  ...  80\nmonster:        M3           M2           M1        power 1 each\ntower:                   T3  T1  T2\n\nT1 (70), T2 (71), T3 (69) can all reach only M2 (cell 70)\nM2 absorbs 1 useful hit, the other two shots are wasted\nleft = 3 − 1 = 2\n```\n\n:::hint คำใบ้ 1\nn อาจเป็น 10⁶ แต่ไม่มีผลอะไรเลย สิ่งที่สำคัญมีแค่ช่องของป้อม k ช่องกับช่องของมอนสเตอร์ m ช่อง ดูว่า k กับ m เล็กแค่ไหน\n:::\n:::hint คำใบ้ 2\nrecursion ไล่ทีละป้อม ป้อม i จะยิงมอนสเตอร์ที่อยู่ในระยะและยังมีพลัง (ลดพลัง เรียกต่อ แล้วคืนพลัง) หรือไม่ยิงโดนอะไรที่มีผล เก็บจำนวนการยิงที่มีผลไว้ และหยุดกิ่งเมื่อ hits + (จำนวนป้อมที่เหลือ) ไม่มีทางชนะคำตอบที่ดีที่สุด\n:::\n\n## 3. อะไร ทำไม อย่างไร\n- **อะไร:** backtracking `shoot(i, hits)` ไล่ป้อม 0..k−1 คำตอบคือ Σh − (จำนวนการยิงที่มีผลมากที่สุด)\n- **ทำไม brute force:** k, m ≤ 8 คือคำใบ้ แต่ละป้อมมีทางเลือกไม่เกิน m + 1 แบบ ต้นไม้เต็มจึงมีใบไม่เกิน 9⁸ ใบ\n- **ทำไม \"ไม่ยิงโดนอะไรที่มีผล\" เป็นทางเลือกเดียว:** ยิงตัวที่ตายแล้ว ไม่ยิง หรือไม่มีอะไรในระยะ ล้วนไม่เปลี่ยนอะไร จึงรวมเป็นกิ่งเดียวได้\n- **อย่างไร:**\n  - อ่านพลังลง `h` และเก็บผลรวม `total` (ใส่ `long long` ได้สบาย)\n  - ใน `shoot(i, hits)`: เช็กขอบเขตก่อน `if (hits + (k − i) <= best) return;` แล้วเมื่อ i = k บันทึก `best = hits`\n  - สำหรับมอนสเตอร์ j ที่ `h[j] > 0` และ `|p[j] − t[i]| ≤ w`: `h[j]--` เรียกต่อด้วย hits + 1 แล้ว `h[j]++`\n  - สุดท้ายกิ่ง \"ไม่มีผล\": `shoot(i + 1, hits)`\n- **ลำดับมีผลต่อความเร็ว:** ลองยิงก่อนกิ่ง \"ไม่ยิง\" ทำให้เจอ `best` ค่ามากเร็ว การตัดกิ่งจึงตัดได้มากขึ้น\n- **ต้นทุน:** ใบไม่เกิน (m + 1)ᵏ ใบ วัดได้ไม่ถึง 0.01 วินาทีกับ input ที่แย่ที่สุดที่เราสร้างได้\n\n## 4. โค้ดเฉลย\n{{code}}\n{{tests}}\n\n**ไล่ค่า**: ตัวอย่างที่ 3 ป้อมตามลำดับ input T1 = 70, T2 = 71, T3 = 69; M2 = มอนสเตอร์ที่ช่อง 70; ขอบเขตคือ \"hits + ป้อมที่เหลือ ≤ best → ตัดกิ่ง\"\n\n| การเรียก | พลัง M2 | เกิดอะไรขึ้น |\n|---|---|---|\n| shoot(0, 0) | 1 | ขอบเขต 0 + 3 > 0; T1 ยิง M2 |\n| shoot(1, 1) | 0 | T2: M2 ตายแล้ว ไม่มีตัวอื่นในระยะ → ไม่มีผล |\n| shoot(2, 1) | 0 | T3: เหมือนกัน → ไม่มีผล |\n| shoot(3, 1) | 0 | ตัดสินใจครบทุกป้อม: **best = 1** |\n| กลับมาที่ shoot(0, 0) | 1 | คืนพลัง M2; ตอนนี้ T1 ไม่ยิงที่มีผล |\n| shoot(1, 0) | 1 | ขอบเขต 0 + 2 > 1; T2 ยิง M2 |\n| shoot(2, 1) | 0 | ขอบเขต 1 + 1 > 1; T3: ไม่มีผล |\n| shoot(3, 1) | 0 | ขอบเขต 1 + 0 ≤ 1: ตัดกิ่ง |\n| shoot(2, 0) | 1 | ขอบเขต 0 + 1 ≤ 1: ตัดกิ่ง |\n\nยิงมีผลได้มากที่สุด 1 ครั้ง คำตอบคือ 3 − 1 = **2**\n\n## 5. จุดที่มักพลาด\n- **สร้างอาเรย์ขนาด n** แทนถนน: ไม่จำเป็น และ 10⁶ ช่องต่อชุดทดสอบเป็นการเปลือง ตำแหน่งเท่านั้นที่สำคัญ\n- **ปล่อยให้พลังต่ำกว่า 0:** ถ้าไม่เช็ก `h[j] > 0` ตัวอย่างที่ 3 จะได้ 0 แทน 2\n- **นับการยิงตัวที่ตายแล้ว** เป็นความคืบหน้า: ขอบเขตและ `best` ต้องนับเฉพาะการยิงที่มีผล\n- **เช็กระยะผิดเครื่องหมาย:** ใช้ `abs(p − t) <= w` ป้อมอยู่ช่องเดียวกับมอนสเตอร์ได้ (ระยะ 0)\n- **greedy แบบ \"ไล่ป้อมตามลำดับ input แต่ละป้อมยิงตัวที่พลังมากที่สุดในระยะ\":** `5 2 2 1` มอนสเตอร์ที่ช่อง 2 และ 4 พลังตัวละ 1 ป้อมที่ช่อง 3 และ 1 ป้อมที่ 3 ถึงทั้งสองตัวและเลือกตัวแรก (ช่อง 2) ส่วนป้อมที่ 1 ถึงได้แค่ช่อง 2 ซึ่งตายไปแล้ว จึงเหลือพลัง 1 แต่ดีที่สุดคือ 0: ป้อมที่ 3 ยิงช่อง 4 ป้อมที่ 1 ยิงช่อง 2 brute force ไม่ต้องวิเคราะห์กรณีแบบนี้เลย\n\n## 6. ความรู้พื้นฐาน\nบทที่ 11 ปัญหาที่อยู่เบื้องหลังคือ **bipartite b-matching** (ป้อมฝั่งหนึ่ง มอนสเตอร์ที่มีความจุ h อีกฝั่ง) ซึ่ง max flow แก้ได้ในเวลาพหุนามสำหรับขนาดใดก็ได้ แต่เมื่อ m, k ≤ 8 ข้อสอบคาดหวัง backtracking บทเรียนที่แท้จริงของข้อนี้คือการเห็นว่าตัวเลขใหญ่ (n = 10⁶) ไม่เกี่ยว และตัวเลขเล็ก (8) เป็นตัวกำหนดวิธี"}}, {"id": "a66_q1a_day_cover", "group": "brute", "lesson": "11 · Recursion & backtracking (subsets)", "stars": 2, "complexity": "O(2ᵐ · n / 64)", "kind": "program", "tags": ["set cover", "all subsets", "invite or skip", "bitset", "pruning"], "title": {"en": "Day cover", "th": "หาคนช่วยงานให้ครบทุกวัน (Day Cover)"}, "blurb": {"en": "Choose the fewest of m ≤ 20 students so that every one of n days has at least one helper. With m ≤ 20 you can try every group: invite-or-skip recursion, each student's days as a bitset.", "th": "เลือกนิสิตจาก m ≤ 20 คนให้น้อยที่สุด โดยทุกวันใน n วันมีคนช่วยงานอย่างน้อยหนึ่งคน เมื่อ m ≤ 20 ลองได้ทุกกลุ่ม: recursion แบบชวนหรือข้าม และเก็บวันว่างของแต่ละคนเป็น bitset"}, "tests": {"en": "both PDF samples and n = m = 1; 300 random inputs (n ≤ 12, m ≤ 8) against a Python brute force that tries all groups from the smallest size up; n = 1,000, m = 20 with answers 20 (no pruning possible), 1, 20 and 10 (1,024 optimal groups), each in under 0.02 s.", "th": "ตัวอย่างทั้งสองชุดใน PDF และ n = m = 1; สุ่ม 300 ชุด (n ≤ 12, m ≤ 8) เทียบกับ brute force ใน Python ที่ลองทุกกลุ่มจากขนาดเล็กไปใหญ่; n = 1,000, m = 20 ที่คำตอบเป็น 20 (ตัดกิ่งไม่ได้เลย), 1, 20 และ 10 (กลุ่มที่ดีที่สุด 1,024 กลุ่ม) แต่ละชุดใช้ไม่ถึง 0.02 วินาที"}, "files": [{"name": "main.cpp", "src": "#include <cstdio>\n#include <bitset>\n#include <vector>\nusing namespace std;\n\nconst int MAXN = 1000;\nint n, m, best;\nvector<bitset<MAXN>> avail;   // avail[s] bit d-1 = student s is free on day d\nbitset<MAXN> full;            // bits 0 .. n-1 set: \"every day is covered\"\n\n// Decide for students i, i+1, ..., m-1 whether to invite them.\n// used = how many are invited so far, cover = the days they cover together.\nvoid pick(int i, int used, const bitset<MAXN> &cover) {\n    if (used >= best) return;                 // cannot beat the best answer found: prune\n    if (cover == full) { best = used; return; }  // every day covered: inviting more never helps\n    if (i == m) return;                       // no students left and some day is still empty\n    pick(i + 1, used + 1, cover | avail[i]);  // choice 1: invite student i\n    pick(i + 1, used, cover);                 // choice 2: skip student i\n}\n\nint main() {\n    if (scanf(\"%d %d\", &n, &m) != 2) return 0;\n    avail.assign(m, bitset<MAXN>());\n    // student s = 0 .. m-1: k free days, then the k day numbers (1-based)\n    for (int s = 0; s < m; s++) {\n        int k;\n        if (scanf(\"%d\", &k) != 1) return 0;\n        // read the k days and switch on their bits\n        for (int j = 0; j < k; j++) {\n            int d;\n            if (scanf(\"%d\", &d) != 1) return 0;\n            avail[s][d - 1] = 1;\n        }\n    }\n    // the target: days 1 .. n, i.e. bits 0 .. n-1\n    for (int d = 0; d < n; d++) full[d] = 1;\n    best = m + 1;                             // larger than any real answer\n    pick(0, 0, bitset<MAXN>());\n    printf(\"%d\\n\", best);\n}\n"}], "body": {"en": "## 1. What the problem says\nAn exhibition runs for n days (n ≤ 1,000), numbered 1..n. Every day needs **at least one** student helper. m students (m ≤ 20) volunteered; student i lists the days they are free (k numbers, sorted, distinct). Print the **smallest number of students** that together cover every day. An answer always exists.\n\nInput: `n m`, then one line per student: `k d1 d2 … dk`.\n\nSample 2: n = 5, m = 4 with free days {1,3,5}, {1,2,3}, {2,5}, {3,4} → **3** (for example students 1, 3, 4).\n\n## 2. What it really means\nThis is **set cover**: pick the fewest sets whose union is {1, …, n}. In general there is no fast algorithm for it, so the limit is the hint: **m ≤ 20** means only 2²⁰ ≈ 10⁶ possible groups of students. Try them all.\n\n```text\nstudent:   1     2     3     4         each student = a row of n bits\nday 1..5:  10101 11100 01001 00110\n\ninvite 1, 3, 4:   10101\n               OR 01001\n               OR 00110\n               =  11111   → every day covered, 3 students\n```\n\n:::hint Hint 1\nCompare m with n. Which one is small enough to enumerate every possibility over?\n:::\n:::hint Hint 2\nFor each student make one decision: invite or skip. Carry the set of covered days down the recursion, and stop a branch once it already uses as many students as the best answer so far.\n:::\n\n## 3. What, why, how\n- **What:** enumerate all 2ᵐ subsets of students with an invite-or-skip recursion (a binary decision tree, as in [Generate barcode](#ex00e4)).\n- **Why brute force is right here:** set cover is NP-hard, so no clever polynomial idea is expected. The limits (m ≤ 20, a 1-second limit) are chosen exactly so that 2ᵐ works.\n- **Bitset:** store each student's free days as `bitset<1000>`. Combining a group is `cover | avail[i]`, which handles 64 days per machine instruction. Checking \"all days covered\" is `cover == full`.\n- **How:** `pick(i, used, cover)` decides students i..m−1.\n  - If `used >= best`, stop: this branch cannot improve the answer.\n  - If `cover == full`, record `best = used` and stop: adding more students only makes it worse.\n  - If i == m, stop: students ran out with a day still empty.\n  - Otherwise try **invite** i, then **skip** i.\n- **Why invite first:** it finds a complete cover quickly, so `best` becomes small early and the pruning cuts more of the tree.\n- **Cost:** at most 2ᵐ⁺¹ calls, each with an O(n/64) bitset operation: about 2 × 10⁶ × 16 word operations. Measured under 0.02 s even when pruning never helps (answer = 20).\n\n## 4. Solution\n{{code}}\n{{tests}}\n\n**Trace**: sample 2 (✓ = invite, ✗ = skip; students in input order).\n\n| decisions so far | days covered | used | what happens |\n|---|---|---|---|\n| ✓1 ✓2 ✓3 ✓4 | 1 2 3 4 5 | 4 | all covered → best = 4 |\n| ✓1 ✓2 ✓3 ✗4 | 1 2 3 5 | 3 | out of students, day 4 empty |\n| ✓1 ✓2 ✗3 ✓4 | 1 2 3 4 5 | 3 | all covered → **best = 3** |\n| ✓1 ✓2 ✗3 ✗4 | 1 2 3 5 | 2 | out of students |\n| ✓1 ✗2 ✓3 ✓4 | | 3 | used ≥ best: pruned |\n| ✓1 ✗2 ✓3 ✗4 | 1 2 3 5 | 2 | out of students |\n| ✓1 ✗2 ✗3 ✓4 | 1 3 4 5 | 2 | out of students |\n| ✓1 ✗2 ✗3 ✗4 | 1 3 5 | 1 | out of students |\n| ✗1 … | | | every branch either runs out or reaches 3 students and is pruned |\n\nAnswer **3**. The group found is students 1, 2, 4; the PDF lists 1, 3, 4 and 2, 3, 4, which are equally good.\n\n## 5. Traps\n- **Greedy \"take the student covering most new days\":** not always optimal for set cover. With sets {1–4}, {1,2,5}, {3,4,6}, greedy takes {1–4} first and needs 3 students; the best is 2.\n- **Days are 1-based:** day d goes to bit d − 1.\n- **Checking \"all covered\" with a loop over n days at every leaf:** O(2ᵐ · n) = 10⁹; use the bitset comparison.\n- **`vector<bool>` or `bool[1000]` per state, copied each call:** works but is about 64 times slower than a bitset.\n- **Forgetting the guarantee:** an answer always exists, so `best` is always set; starting it at m + 1 is a safe \"infinity\".\n\n## 6. Background\nLesson 11. \"Try every subset\" is the brute force for problems over a small set of items (m ≤ 20–25): each item is in or out. Bitsets make the set operations cheap. The same idea appears as bit-mask DP when the state is the set itself. For the other generators in this chapter see [Generate barcode](#ex00e4) (subsets of a fixed size) and [Permutation with constraint](#a64_q1_permu_before) (orderings).", "th": "## 1. โจทย์บอกอะไร\nนิทรรศการจัดทั้งหมด n วัน (n ≤ 1,000) เลขวัน 1..n ทุกวันต้องมีนิสิตมาช่วยงาน **อย่างน้อยหนึ่งคน** มีนิสิตอาสา m คน (m ≤ 20) นิสิตคนที่ i ให้รายการวันที่ว่าง (k ตัว เรียงแล้วและไม่ซ้ำ) ให้พิมพ์ **จำนวนนิสิตที่น้อยที่สุด** ที่รวมกันแล้วครอบคลุมทุกวัน รับประกันว่ามีคำตอบเสมอ\n\ninput: `n m` แล้วนิสิตคนละบรรทัด: `k d1 d2 … dk`\n\nตัวอย่างที่ 2: n = 5, m = 4 วันว่างคือ {1,3,5}, {1,2,3}, {2,5}, {3,4} → **3** (เช่นนิสิตคนที่ 1, 3, 4)\n\n## 2. จริง ๆ แล้วถามอะไร\nนี่คือ **set cover**: เลือกเซตให้น้อยที่สุดโดยยูเนียนของมันคือ {1, …, n} โดยทั่วไปไม่มีอัลกอริทึมที่เร็วสำหรับปัญหานี้ ขอบเขตจึงเป็นคำใบ้: **m ≤ 20** แปลว่ากลุ่มนิสิตที่เป็นไปได้มีแค่ 2²⁰ ≈ 10⁶ กลุ่ม ลองทุกกลุ่มเลย\n\n```text\nstudent:   1     2     3     4         each student = a row of n bits\nday 1..5:  10101 11100 01001 00110\n\ninvite 1, 3, 4:   10101\n               OR 01001\n               OR 00110\n               =  11111   → every day covered, 3 students\n```\n\n:::hint คำใบ้ 1\nเทียบ m กับ n ตัวไหนเล็กพอที่จะไล่ทุกความเป็นไปได้\n:::\n:::hint คำใบ้ 2\nนิสิตแต่ละคนตัดสินใจครั้งเดียว: ชวนหรือข้าม ส่งเซตของวันที่ครอบคลุมแล้วลงไปใน recursion และหยุดกิ่งทันทีที่ใช้นิสิตเท่ากับคำตอบที่ดีที่สุดที่เจอแล้ว\n:::\n\n## 3. อะไร ทำไม อย่างไร\n- **อะไร:** ไล่ทุกเซตย่อย 2ᵐ แบบของนิสิตด้วย recursion แบบชวนหรือข้าม (ต้นไม้การตัดสินใจแบบสองทาง เหมือนข้อ [Generate barcode](#ex00e4))\n- **ทำไม brute force ถูกทางในข้อนี้:** set cover เป็นปัญหา NP-hard จึงไม่มีไอเดียฉลาดแบบพหุนามที่โจทย์คาดหวัง ขอบเขต (m ≤ 20 เวลา 1 วินาที) ถูกเลือกมาให้ 2ᵐ ผ่านพอดี\n- **Bitset:** เก็บวันว่างของแต่ละคนเป็น `bitset<1000>` การรวมกลุ่มคือ `cover | avail[i]` ซึ่งทำ 64 วันต่อหนึ่งคำสั่งเครื่อง การเช็ก \"ครอบคลุมทุกวัน\" คือ `cover == full`\n- **อย่างไร:** `pick(i, used, cover)` ตัดสินใจนิสิต i..m−1\n  - ถ้า `used >= best` หยุด: กิ่งนี้ทำให้คำตอบดีขึ้นไม่ได้\n  - ถ้า `cover == full` บันทึก `best = used` แล้วหยุด: เพิ่มคนอีกมีแต่แย่ลง\n  - ถ้า i == m หยุด: นิสิตหมดแล้วแต่ยังมีวันว่าง\n  - ไม่อย่างนั้นลอง **ชวน** i ก่อน แล้วค่อย **ข้าม** i\n- **ทำไมชวนก่อน:** จะเจอชุดที่ครอบคลุมครบเร็ว `best` จึงเล็กลงตั้งแต่ต้น และการตัดกิ่งตัดต้นไม้ได้มากขึ้น\n- **ต้นทุน:** เรียกไม่เกิน 2ᵐ⁺¹ ครั้ง แต่ละครั้งมีการดำเนินการ bitset O(n/64): ราว 2 × 10⁶ × 16 คำสั่ง วัดได้ไม่ถึง 0.02 วินาที แม้ในกรณีที่ตัดกิ่งไม่ได้เลย (คำตอบ = 20)\n\n## 4. โค้ดเฉลย\n{{code}}\n{{tests}}\n\n**ไล่ค่า**: ตัวอย่างที่ 2 (✓ = ชวน, ✗ = ข้าม; นิสิตตามลำดับ input)\n\n| การตัดสินใจจนถึงตอนนี้ | วันที่ครอบคลุม | used | เกิดอะไรขึ้น |\n|---|---|---|---|\n| ✓1 ✓2 ✓3 ✓4 | 1 2 3 4 5 | 4 | ครบทุกวัน → best = 4 |\n| ✓1 ✓2 ✓3 ✗4 | 1 2 3 5 | 3 | นิสิตหมด วันที่ 4 ยังว่าง |\n| ✓1 ✓2 ✗3 ✓4 | 1 2 3 4 5 | 3 | ครบทุกวัน → **best = 3** |\n| ✓1 ✓2 ✗3 ✗4 | 1 2 3 5 | 2 | นิสิตหมด |\n| ✓1 ✗2 ✓3 ✓4 | | 3 | used ≥ best: ตัดกิ่ง |\n| ✓1 ✗2 ✓3 ✗4 | 1 2 3 5 | 2 | นิสิตหมด |\n| ✓1 ✗2 ✗3 ✓4 | 1 3 4 5 | 2 | นิสิตหมด |\n| ✓1 ✗2 ✗3 ✗4 | 1 3 5 | 1 | นิสิตหมด |\n| ✗1 … | | | ทุกกิ่งไม่นิสิตหมดก็ถึง 3 คนแล้วถูกตัด |\n\nคำตอบ **3** กลุ่มที่เจอคือนิสิต 1, 2, 4 ส่วน PDF ให้ 1, 3, 4 และ 2, 3, 4 ซึ่งดีเท่ากัน\n\n## 5. จุดที่มักพลาด\n- **ละโมบแบบ \"เลือกคนที่ครอบคลุมวันใหม่มากที่สุด\":** ไม่ได้คำตอบดีที่สุดเสมอสำหรับ set cover เช่นเซต {1–4}, {1,2,5}, {3,4,6} ละโมบเลือก {1–4} ก่อนแล้วต้องใช้ 3 คน แต่ที่ดีที่สุดคือ 2\n- **วันเริ่มที่ 1:** วัน d เก็บที่บิต d − 1\n- **เช็ก \"ครบทุกวัน\" ด้วยลูป n วันทุกใบ:** O(2ᵐ · n) = 10⁹ ใช้การเทียบ bitset แทน\n- **`vector<bool>` หรือ `bool[1000]` ต่อ state แล้วคัดลอกทุกครั้ง:** ใช้ได้แต่ช้ากว่า bitset ราว 64 เท่า\n- **ลืมข้อรับประกัน:** มีคำตอบเสมอ `best` จึงถูกตั้งค่าแน่นอน การเริ่มที่ m + 1 เป็น \"อนันต์\" ที่ปลอดภัย\n\n## 6. ความรู้พื้นฐาน\nบทที่ 11 \"ลองทุกเซตย่อย\" คือ brute force สำหรับปัญหาบนสิ่งของจำนวนน้อย (m ≤ 20–25): สิ่งของแต่ละชิ้นอยู่หรือไม่อยู่ bitset ทำให้การดำเนินการบนเซตถูก ไอเดียเดียวกันปรากฏเป็น bit-mask DP เมื่อ state คือตัวเซตเอง ตัวสร้างแบบอื่นในบทนี้ดูที่ [Generate barcode](#ex00e4) (เซตย่อยขนาดคงที่) และ [Permutation with constraint](#a64_q1_permu_before) (การเรียงลำดับ)"}}, {"id": "a64_q4_path_sum", "group": "brute", "lesson": "11 · Recursion & backtracking (simple paths)", "stars": 3, "complexity": "exponential in n (n ≤ 20), cut down by bounds", "kind": "program", "tags": ["simple path", "DFS backtracking", "path sum", "pruning by upper bound", "early exit", "NP-hard"], "title": {"en": "Path sum", "th": "ผลรวมบนเส้นทาง (Path Sum)"}, "blurb": {"en": "An undirected weighted graph with n ≤ 20 nodes and 8 target sums K. For each K, is there a simple path (no repeated node) whose edge weights add up to exactly K? DFS over all simple paths from every start, cutting a branch when no open K can still be reached, and stopping once all 8 are answered.", "th": "กราฟไม่มีทิศทางมีน้ำหนัก n ≤ 20 ปม และค่าเป้าหมาย K อีก 8 ค่า สำหรับแต่ละ K มี simple path (ไม่ผ่านปมซ้ำ) ที่ผลรวมน้ำหนักเท่ากับ K พอดีไหม ใช้ DFS ไล่ทุก simple path จากทุกจุดเริ่ม ตัดกิ่งเมื่อไม่มี K ที่ยังเปิดอยู่ตัวไหนเอื้อมถึงแล้ว และหยุดทันทีที่ตอบครบทั้ง 8 ค่า"}, "tests": {"en": "the PDF sample, a single node with a self-loop line; 300 random graphs (n ≤ 7) against a Python DFS that lists every simple path sum; n = 20 complete graph with random weights and random K (0.47 s); the same graph with K = 1, 2, 3, 4, 5, 19998, 19999, 20000 (0.005 s); a 20-node path of weight-1000 edges. Over 40 more random n = 20 graphs most ran under 0.5 s; the slowest took 3.4 s (see Traps).", "th": "ตัวอย่างใน PDF และกราฟปมเดียวที่มีบรรทัดเส้นวนกลับหาตัวเอง; สุ่มกราฟ 300 ชุด (n ≤ 7) เทียบกับ DFS ใน Python ที่แจกแจงผลรวมของทุก simple path; กราฟสมบูรณ์ n = 20 น้ำหนักสุ่มและ K สุ่ม (0.47 วินาที); กราฟเดียวกันกับ K = 1, 2, 3, 4, 5, 19998, 19999, 20000 (0.005 วินาที); เส้นทางตรง 20 ปมน้ำหนัก 1000 ทุกเส้น ทดลองกับกราฟสุ่ม n = 20 อีก 40 ชุด ส่วนใหญ่ใช้ไม่ถึง 0.5 วินาที ชุดที่ช้าที่สุดใช้ 3.4 วินาที (ดูหัวข้อจุดที่มักพลาด)"}, "files": [{"name": "main.cpp", "src": "#include <iostream>\n#include <vector>\n#include <algorithm>\nusing namespace std;\n\nint n, m;\nint K[8];\nbool found[8];\nint unanswered = 8;          // how many of the 8 queries are still \"NO so far\"\nvector<pair<int, int>> adj[20];   // adj[u] = (v, w)\nbool onPath[20];\nint heaviest[20];            // heaviest[v] = weight of the heaviest edge touching v\nint restMax = 0;             // sum of heaviest[v] over nodes NOT on the path:\n                             // the path can never grow by more than this\n\n// is there an open query K with lo <= K <= hi?\nbool openIn(int lo, int hi) {\n    // look at every query that is still open\n    for (int q = 0; q < 8; q++)\n        if (!found[q] && lo <= K[q] && K[q] <= hi) return true;\n    return false;\n}\n\n// we are at node u, the simple path so far has weight sum\nvoid dfs(int u, int sum) {\n    if (!openIn(sum, sum + restMax)) return;  // no open query is reachable from here: prune\n    // does this path answer any open query?\n    for (int q = 0; q < 8; q++) {\n        if (!found[q] && K[q] == sum) {\n            found[q] = true;\n            unanswered--;\n        }\n    }\n    // extend the path by one edge to a node that is not on it yet\n    for (int e = 0; e < (int)adj[u].size(); e++) {\n        if (unanswered == 0) return;          // all 8 answered: stop everything\n        int v = adj[u][e].first, w = adj[u][e].second;\n        if (onPath[v]) continue;              // a simple path may not come back\n        onPath[v] = true; restMax -= heaviest[v];\n        dfs(v, sum + w);\n        onPath[v] = false; restMax += heaviest[v];   // undo\n    }\n}\n\nint main() {\n    cin >> n >> m;\n    // read the 8 queries\n    for (int q = 0; q < 8; q++) cin >> K[q];\n    // read the m undirected edges\n    for (int i = 0; i < m; i++) {\n        int a, b, w;\n        cin >> a >> b >> w;\n        adj[a].push_back({b, w});\n        adj[b].push_back({a, w});\n        heaviest[a] = max(heaviest[a], w);\n        heaviest[b] = max(heaviest[b], w);\n    }\n    // at the start no node is on the path\n    for (int v = 0; v < n; v++) restMax += heaviest[v];\n    // a path may start anywhere: start one search from every node\n    for (int s = 0; s < n && unanswered > 0; s++) {\n        onPath[s] = true; restMax -= heaviest[s];\n        dfs(s, 0);\n        onPath[s] = false; restMax += heaviest[s];\n    }\n    // print the 8 answers in input order\n    for (int q = 0; q < 8; q++) cout << (found[q] ? \"YES\" : \"NO\") << \"\\n\";\n}\n"}], "body": {"en": "## 1. What the problem says\nAn undirected graph has n nodes (numbered 0..n−1, n ≤ 20) and m weighted edges (m ≤ 200, weights 1..1000). You get 8 values K₁..K₈ (each 1..20,000). For each one, print **YES** if some **simple path** (a path that never visits a node twice) has edge weights adding up to exactly Kᵢ, otherwise **NO**. A path may start at any node.\n\nInput: `n m`, the 8 values K, then m lines `a b w`.\n\nSample: edges 0–1 (10), 0–2 (15), 1–2 (5), 0–3 (35); K = 10 20 … 80 → **YES YES NO NO YES NO NO NO**. Note 0→1→2→0 sums to 30 but repeats node 0, so 30 is NO.\n\n## 2. What it really means\nGenerate every simple path, collect the sums, answer the 8 questions. A simple path is built one node at a time, never returning to a node already on it: that is backtracking with an `onPath[]` array, started from every node.\n\n```text\n    10           paths from 0:    0-1 = 10 ✓K   0-1-2 = 15     0-2 = 15\n 0 ──── 1                         0-2-1 = 20 ✓K 0-3 = 35\n │ ╲    │        paths from 2:    2-0-3 = 50 ✓K\n35  15  5        30 needs 0-1-2-0: not simple\n │    ╲ │        sums that exist: 5 10 15 20 25 35 45 50 55\n 3      2        → 10 YES, 20 YES, 30 NO, 40 NO, 50 YES, 60 NO, 70 NO, 80 NO\n```\n\nThere is no polynomial shortcut to hope for: with all weights equal to w, \"is there a path of sum (n−1)·w\" asks for a **Hamiltonian path**, a famous NP-complete problem. The limit n ≤ 20 is the hint that a search is expected, and the work is in making the search skip hopeless branches.\n\n:::hint Hint 1\nn ≤ 20 and you need paths that never repeat a node. Write the DFS that extends a path by one unused neighbour at a time, starting once from every node, and record every sum you see.\n:::\n:::hint Hint 2\nTwo cuts make it fast. (1) Stop everything as soon as all 8 queries are answered. (2) Before going deeper, ask: can this path still grow into any K that is still open? The path can gain at most the heaviest edge of each node not yet on it, so if no open K lies in [sum, sum + that bound], return.\n:::\n\n## 3. What, why, how\n- **What:** `dfs(u, sum)` over simple paths, from every start node, answering queries as their sums appear.\n- **Why a bound is safe:** every node added to the path is entered through one edge touching it, and that edge weighs at most `heaviest[v]`. So the path can never gain more than `restMax` = Σ heaviest[v] over nodes not on the path. If no unanswered K lies in [sum, sum + restMax], nothing below this call can answer anything.\n- **How:**\n  - Read the edges into adjacency lists; compute `heaviest[v]`; `restMax` starts as the sum over all nodes.\n  - On entering a node, subtract its `heaviest` from `restMax`; on leaving, add it back (like `onPath`).\n  - In `dfs`: first the bound check, then mark every open K equal to `sum` as YES, then try each neighbour that is not on the path.\n  - Keep `unanswered`; when it hits 0, return immediately everywhere.\n- **Why every start node:** a path's sum is the same in both directions, but the path must be generated from one of its two ends; starting from every node covers all of them.\n- **Cost:** exponential in the worst case. With the two cuts, typical random inputs with n = 20 take well under a second; the measurements are in the \"Verified\" box.\n\n## 4. Solution\n{{code}}\n{{tests}}\n\n**Trace**: the sample. `heaviest` = 35, 10, 15, 35 for nodes 0..3. Open K at the start: 10 20 30 40 50 60 70 80.\n\n| path | sum | restMax | open K in [sum, sum + restMax]? | answered here |\n|---|---|---|---|---|\n| 0 | 0 | 60 | yes (10 … 60) | |\n| 0-1 | 10 | 50 | yes | **10** |\n| 0-1-2 | 15 | 35 | yes (20 … 50) | |\n| 0-2 | 15 | 45 | yes | |\n| 0-2-1 | 20 | 35 | yes | **20** |\n| 0-3 | 35 | 25 | yes (40 … 60), but node 3 has no other neighbour | |\n| 1 … | | | 25, 45, 5, 20 found, nothing new | |\n| 1-2-0-3 | 55 | 0 | no (55 is not open) → pruned | |\n| 2-0-3 | 50 | 10 | yes | **50** |\n| 2-1-0-3 | 50 | 0 | no (50 already answered) → pruned | |\n| 3-0-1-2, 3-0-2-1 | 50, 55 | 0 | no → pruned | |\n\nAll searches end with 10, 20, 50 found: **YES YES NO NO YES NO NO NO**.\n\n## 5. Traps\n- **Forgetting \"simple\":** a plain DFS with a global `visited[]` that is never cleared finds only one path per start. The mark must be undone when the DFS returns (backtracking), so other paths through the same node are still tried.\n- **Allowing node repeats:** the 0→1→2→0 cycle would make 30 a YES.\n- **A path of one node** has sum 0, and every K ≥ 1, so it never answers anything; it is just the start of the search.\n- **The worst case is still exponential.** Our slowest random case (n = 20, m = 80, one K just below the longest path sum, so it is never found and never cut) took 3.4 s. A K that cannot be reached but is not ruled out by the bound forces the search through almost every path. Whether the grader data contain such a case is not known; the point is to understand why these inputs are slow, since no method avoids them completely.\n- **Not stopping early** after all 8 answers: on dense graphs that is the difference between milliseconds and minutes.\n- **Output:** 8 lines, in the order of the queries, words in capitals.\n\n## 6. Background\nLesson 11. Path problems split sharply: shortest paths are easy (Dijkstra), but **longest** or **exact-sum** simple paths are NP-hard. For n ≤ 20 the general exact method is a bit-mask DP over (set of visited nodes, last node), 2ⁿ · n states; here each state would have to carry a whole set of reachable sums (20,001 bits), about 2²⁰ · 20 · 2.5 KB, far too much memory. That is why the backtracking with bounds is the practical answer. Compare [Day cover](#a66_q1a_day_cover) for the \"try all subsets, prune by the best so far\" pattern.", "th": "## 1. โจทย์บอกอะไร\nกราฟไม่มีทิศทางมี n ปม (เลข 0..n−1, n ≤ 20) และเส้นเชื่อมมีน้ำหนัก m เส้น (m ≤ 200 น้ำหนัก 1..1000) มีค่า K₁..K₈ ให้ 8 ค่า (แต่ละค่า 1..20,000) สำหรับแต่ละค่า ให้พิมพ์ **YES** ถ้ามี **simple path** (เส้นทางที่ไม่ผ่านปมซ้ำ) ที่ผลรวมน้ำหนักเท่ากับ Kᵢ พอดี ไม่อย่างนั้นพิมพ์ **NO** เส้นทางเริ่มที่ปมไหนก็ได้\n\ninput: `n m` แล้วค่า K ทั้ง 8 ค่า แล้วอีก m บรรทัด `a b w`\n\nตัวอย่าง: เส้น 0–1 (10), 0–2 (15), 1–2 (5), 0–3 (35); K = 10 20 … 80 → **YES YES NO NO YES NO NO NO** สังเกตว่า 0→1→2→0 รวมได้ 30 แต่ผ่านปม 0 ซ้ำ 30 จึงเป็น NO\n\n## 2. จริง ๆ แล้วถามอะไร\nสร้างทุก simple path เก็บผลรวม แล้วตอบทั้ง 8 คำถาม simple path สร้างได้ทีละปมโดยไม่ย้อนกลับไปปมที่อยู่บนเส้นทางแล้ว นั่นคือ backtracking ที่ใช้อาเรย์ `onPath[]` และเริ่มจากทุกปม\n\n```text\n    10           paths from 0:    0-1 = 10 ✓K   0-1-2 = 15     0-2 = 15\n 0 ──── 1                         0-2-1 = 20 ✓K 0-3 = 35\n │ ╲    │        paths from 2:    2-0-3 = 50 ✓K\n35  15  5        30 needs 0-1-2-0: not simple\n │    ╲ │        sums that exist: 5 10 15 20 25 35 45 50 55\n 3      2        → 10 YES, 20 YES, 30 NO, 40 NO, 50 YES, 60 NO, 70 NO, 80 NO\n```\n\nอย่าหวังทางลัดแบบพหุนาม: ถ้าน้ำหนักเท่ากันหมดเป็น w คำถาม \"มีเส้นทางผลรวม (n−1)·w ไหม\" ก็คือการถามหา **Hamiltonian path** ซึ่งเป็นปัญหา NP-complete ชื่อดัง ขอบเขต n ≤ 20 บอกว่าโจทย์คาดหวังการค้นหา และงานอยู่ที่การทำให้การค้นหาข้ามกิ่งที่ไม่มีหวัง\n\n:::hint คำใบ้ 1\nn ≤ 20 และต้องการเส้นทางที่ไม่ผ่านปมซ้ำ เขียน DFS ที่ต่อเส้นทางทีละเพื่อนบ้านที่ยังไม่ได้ใช้ เริ่มหนึ่งครั้งจากทุกปม แล้วบันทึกทุกผลรวมที่เห็น\n:::\n:::hint คำใบ้ 2\nมีสองจุดตัดที่ทำให้เร็ว (1) หยุดทุกอย่างทันทีที่ตอบครบ 8 คำถาม (2) ก่อนลงลึก ถามว่าเส้นทางนี้ยังโตไปเป็น K ที่ยังเปิดอยู่ได้ไหม เส้นทางได้เพิ่มไม่เกินเส้นที่หนักที่สุดของแต่ละปมที่ยังไม่อยู่บนเส้นทาง ถ้าไม่มี K ที่เปิดอยู่ใน [sum, sum + ขอบเขตนั้น] ให้ return\n:::\n\n## 3. อะไร ทำไม อย่างไร\n- **อะไร:** `dfs(u, sum)` บน simple path จากทุกปมเริ่มต้น ตอบคำถามเมื่อผลรวมของมันปรากฏ\n- **ทำไมขอบเขตปลอดภัย:** ทุกปมที่ถูกเพิ่มเข้าเส้นทางเข้ามาทางเส้นหนึ่งเส้นที่แตะมัน และเส้นนั้นหนักไม่เกิน `heaviest[v]` เส้นทางจึงเพิ่มได้ไม่เกิน `restMax` = ผลรวม heaviest[v] ของปมที่ยังไม่อยู่บนเส้นทาง ถ้าไม่มี K ที่ยังไม่ได้ตอบอยู่ใน [sum, sum + restMax] ทุกอย่างใต้การเรียกนี้ก็ตอบอะไรไม่ได้\n- **อย่างไร:**\n  - อ่านเส้นเชื่อมลง adjacency list คำนวณ `heaviest[v]` และ `restMax` เริ่มเป็นผลรวมของทุกปม\n  - เมื่อเข้าปม ลบ `heaviest` ของมันออกจาก `restMax` เมื่อออกก็บวกคืน (เหมือน `onPath`)\n  - ใน `dfs`: เช็กขอบเขตก่อน แล้วตั้ง K ที่เปิดอยู่และเท่ากับ `sum` เป็น YES แล้วลองเพื่อนบ้านแต่ละตัวที่ไม่อยู่บนเส้นทาง\n  - เก็บ `unanswered` ไว้ เมื่อเป็น 0 ให้ return ทันทีทุกระดับ\n- **ทำไมต้องเริ่มทุกปม:** ผลรวมของเส้นทางเท่ากันทั้งสองทิศ แต่เส้นทางต้องถูกสร้างจากปลายข้างใดข้างหนึ่ง การเริ่มจากทุกปมจึงครอบคลุมทุกเส้นทาง\n- **ต้นทุน:** แย่สุดเป็นเลขชี้กำลัง เมื่อมีสองจุดตัด input สุ่มทั่วไปที่ n = 20 ใช้เวลาไม่ถึงวินาทีสบาย ๆ ตัวเลขที่วัดได้อยู่ในกล่อง \"ตรวจสอบแล้ว\"\n\n## 4. โค้ดเฉลย\n{{code}}\n{{tests}}\n\n**ไล่ค่า**: ตัวอย่างใน PDF `heaviest` = 35, 10, 15, 35 สำหรับปม 0..3 K ที่เปิดอยู่ตอนเริ่ม: 10 20 30 40 50 60 70 80\n\n| เส้นทาง | sum | restMax | มี K เปิดใน [sum, sum + restMax]? | ตอบได้ตรงนี้ |\n|---|---|---|---|---|\n| 0 | 0 | 60 | มี (10 … 60) | |\n| 0-1 | 10 | 50 | มี | **10** |\n| 0-1-2 | 15 | 35 | มี (20 … 50) | |\n| 0-2 | 15 | 45 | มี | |\n| 0-2-1 | 20 | 35 | มี | **20** |\n| 0-3 | 35 | 25 | มี (40 … 60) แต่ปม 3 ไม่มีเพื่อนบ้านอื่น | |\n| 1 … | | | เจอ 25, 45, 5, 20 ไม่มีอะไรใหม่ | |\n| 1-2-0-3 | 55 | 0 | ไม่มี (55 ไม่ได้เปิด) → ตัดกิ่ง | |\n| 2-0-3 | 50 | 10 | มี | **50** |\n| 2-1-0-3 | 50 | 0 | ไม่มี (50 ตอบไปแล้ว) → ตัดกิ่ง | |\n| 3-0-1-2, 3-0-2-1 | 50, 55 | 0 | ไม่มี → ตัดกิ่ง | |\n\nการค้นหาทั้งหมดจบโดยเจอ 10, 20, 50: **YES YES NO NO YES NO NO NO**\n\n## 5. จุดที่มักพลาด\n- **ลืมว่าต้อง \"simple\":** DFS ธรรมดาที่ใช้ `visited[]` ทั่วทั้งโปรแกรมโดยไม่ล้างเลย จะเจอเส้นทางเดียวต่อจุดเริ่ม ต้องเอาเครื่องหมายออกตอน DFS กลับ (backtracking) เส้นทางอื่นที่ผ่านปมเดียวกันจึงยังถูกลอง\n- **ยอมให้ผ่านปมซ้ำ:** วง 0→1→2→0 จะทำให้ 30 กลายเป็น YES\n- **เส้นทางปมเดียว** มีผลรวม 0 และทุก K ≥ 1 จึงไม่เคยตอบอะไร เป็นแค่จุดเริ่มของการค้นหา\n- **กรณีแย่สุดยังเป็นเลขชี้กำลัง** กรณีสุ่มที่ช้าที่สุดของเรา (n = 20, m = 80 และ K ตัวหนึ่งต่ำกว่าผลรวมเส้นทางที่ยาวที่สุดนิดเดียว จึงไม่เคยเจอและไม่เคยถูกตัด) ใช้ 3.4 วินาที K ที่ไปไม่ถึงแต่ขอบเขตตัดไม่ได้บังคับให้การค้นหาวิ่งผ่านเกือบทุกเส้นทาง ไม่รู้ว่าข้อมูลของ grader มีกรณีแบบนี้หรือไม่ ประเด็นคือเข้าใจว่าทำไม input แบบนี้ถึงช้า เพราะไม่มีวิธีไหนเลี่ยงได้หมด\n- **ไม่หยุดก่อน** เมื่อตอบครบ 8 ข้อแล้ว: บนกราฟหนาแน่นนี่คือความต่างระหว่างมิลลิวินาทีกับหลายนาที\n- **output:** 8 บรรทัด ตามลำดับคำถาม เป็นตัวพิมพ์ใหญ่\n\n## 6. ความรู้พื้นฐาน\nบทที่ 11 ปัญหาเส้นทางแบ่งกันชัดเจน: เส้นทางสั้นที่สุดง่าย (Dijkstra) แต่ simple path ที่ **ยาวที่สุด** หรือ **ผลรวมพอดี** เป็น NP-hard สำหรับ n ≤ 20 วิธีแม่นตรงทั่วไปคือ bit-mask DP บน (เซตของปมที่เยี่ยมแล้ว, ปมสุดท้าย) 2ⁿ · n state แต่ข้อนี้แต่ละ state ต้องพกเซตของผลรวมที่ไปถึงได้ทั้งเซต (20,001 บิต) ราว 2²⁰ · 20 · 2.5 KB ใช้หน่วยความจำมากเกินไป backtracking กับขอบเขตจึงเป็นคำตอบที่ใช้ได้จริง เทียบกับข้อ [Day cover](#a66_q1a_day_cover) สำหรับรูปแบบ \"ลองทุกเซตย่อย ตัดกิ่งด้วยคำตอบที่ดีที่สุดจนถึงตอนนี้\""}}, {"id": "ex07e3_coloring", "group": "brute", "lesson": "11 · Recursion & backtracking (branch and bound)", "stars": 3, "complexity": "exponential worst case; fast in practice for N ≤ 50", "kind": "program", "tags": ["graph coloring", "chromatic number", "branch and bound", "DSATUR", "symmetry breaking", "NP-hard"], "title": {"en": "Graph coloring", "th": "ระบายสีกราฟ (Graph Coloring)"}, "blurb": {"en": "Find the fewest colours for the N ≤ 50 vertices so that adjacent vertices differ. Branch and bound: always colour next the vertex with the most different neighbour colours (DSATUR), try only colours already used plus one new colour, and cut any branch that already uses as many colours as the best answer.", "th": "หาจำนวนสีน้อยที่สุดสำหรับจุดยอด N ≤ 50 จุด โดยจุดที่อยู่ติดกันต้องสีต่างกัน ใช้ branch and bound: ระบายจุดที่เพื่อนบ้านมีสีต่างกันมากที่สุดก่อนเสมอ (DSATUR) ลองเฉพาะสีที่ใช้แล้วกับสีใหม่อีกหนึ่งสี และตัดกิ่งที่ใช้สีเท่ากับคำตอบที่ดีที่สุดแล้ว"}, "tests": {"en": "the PDF sample (K₄), one vertex, the 5-cycle; 300 random graphs (N ≤ 8) against a Python brute force over all colourings with k = 1, 2, …; N = 50 random graphs with edge probability 10, 30, 50, 70, 90 % (answers 4, 6, 10, 13, 21, each in under 0.02 s), each answer re-checked by an independent backtracking program (k colours possible, k − 1 impossible); the Mycielski graph M₅ (23 vertices, no triangle, needs 5 colours) in 0.005 s.", "th": "ตัวอย่างใน PDF (K₄), จุดเดียว, วงห้าจุด; สุ่มกราฟ 300 ชุด (N ≤ 8) เทียบกับ brute force ใน Python ที่ลองทุกการระบายด้วย k = 1, 2, …; กราฟสุ่ม N = 50 ความน่าจะเป็นของเส้น 10, 30, 50, 70, 90 % (คำตอบ 4, 6, 10, 13, 21 แต่ละชุดไม่ถึง 0.02 วินาที) และตรวจทุกคำตอบซ้ำด้วยโปรแกรม backtracking อีกตัวที่เขียนแยก (ระบาย k สีได้ แต่ k − 1 สีไม่ได้); กราฟ Mycielski M₅ (23 จุด ไม่มีสามเหลี่ยม แต่ต้องใช้ 5 สี) ใช้ 0.005 วินาที"}, "files": [{"name": "main.cpp", "src": "#include <iostream>\n#include <vector>\nusing namespace std;\n\nint n, e;\nbool adj[50][50];\nint color[50];               // 0 = not coloured yet, otherwise 1..k\nint usedBy[50][51];          // usedBy[v][c] = how many coloured neighbours of v have colour c\nint satur[50];               // number of different colours among v's coloured neighbours\nint deg[50];\nint best;                    // fewest colours found so far\n\nvoid setColor(int v, int c) {\n    color[v] = c;\n    // tell every neighbour of v that colour c is now next to it\n    for (int u = 0; u < n; u++)\n        if (adj[v][u] && usedBy[u][c]++ == 0) satur[u]++;\n}\nvoid unsetColor(int v) {\n    int c = color[v];\n    color[v] = 0;\n    // take colour c back from every neighbour of v\n    for (int u = 0; u < n; u++)\n        if (adj[v][u] && --usedBy[u][c] == 0) satur[u]--;\n}\n\n// colored vertices so far, k = colours in use (always 1..k)\nvoid solve(int colored, int k) {\n    if (k >= best) return;                    // already as bad as the best: prune\n    if (colored == n) { best = k; return; }\n    // DSATUR: branch on the uncoloured vertex with the most distinct neighbour colours\n    int v = -1;\n    for (int u = 0; u < n; u++) {\n        if (color[u]) continue;\n        if (v == -1 || satur[u] > satur[v] || (satur[u] == satur[v] && deg[u] > deg[v])) v = u;\n    }\n    // try every colour already in use that no neighbour has\n    for (int c = 1; c <= k; c++) {\n        if (usedBy[v][c]) continue;\n        setColor(v, c);\n        solve(colored + 1, k);\n        unsetColor(v);\n    }\n    // or open one new colour k+1 (all new colours are alike, so one try is enough)\n    if (k + 1 < best) {\n        setColor(v, k + 1);\n        solve(colored + 1, k + 1);\n        unsetColor(v);\n    }\n}\n\nint main() {\n    cin >> n >> e;\n    // read the edges (ignore self-loops and repeats)\n    for (int i = 0; i < e; i++) {\n        int a, b;\n        cin >> a >> b;\n        if (a == b || adj[a][b]) continue;\n        adj[a][b] = adj[b][a] = true;\n        deg[a]++; deg[b]++;\n    }\n    best = n + 1;                             // n colours always work\n    solve(0, 0);\n    cout << best << \"\\n\";\n}\n"}], "body": {"en": "## 1. What the problem says\nAn undirected graph has N vertices (0..N−1, N ≤ 50) and E edges. Colour the vertices so that the two ends of every edge get **different** colours. Print the **smallest number of colours** that makes this possible (the chromatic number).\n\nInput: `N E`, then E lines `a b`.\n\nSample: 4 vertices, all 6 edges (a complete graph K₄) → **4**.\n\n## 2. What it really means\nDeciding whether a graph can be coloured with 3 colours is already NP-complete, so no fast formula exists. N ≤ 50 is too big for trying all colourings (kᴺ), but a well-ordered **branch and bound** search solves graphs of this size quickly. Three ideas do the work:\n\n```text\n1. bound      stop a branch that already uses as many colours as the best answer found\n2. symmetry   colours are interchangeable: a vertex may take any colour already in use,\n              or ONE new colour (trying colour 5 and colour 6 as \"new\" is the same thing)\n3. order      colour next the vertex whose neighbours already show the most different\n              colours (its \"saturation\"); it has the fewest options, so mistakes show early\n\n5-cycle 0-1-2-3-4-0:   0 ← 1, 1 ← 2, 2 ← 1, 3 ← 2, then 4 sees colours 1 and 2 → needs 3\n```\n\n:::hint Hint 1\nColour the vertices one at a time and backtrack. Each vertex can take a colour that none of its coloured neighbours has. Keep the best (smallest) number of colours found, and stop any branch that already uses that many.\n:::\n:::hint Hint 2\nTwo tricks make it fast. Never try two different \"new\" colours for the same vertex: all unused colours are alike. And always pick next the uncoloured vertex that sees the most different colours among its neighbours (break ties by degree).\n:::\n\n## 3. What, why, how\n- **What:** `solve(colored, k)` where k colours (1..k) are in use; at the end `best` is the answer.\n- **Why the symmetry rule is safe:** in any colouring you can rename the colours so that they appear in the order they are first used. So it is enough to try colours 1..k and the single new colour k + 1.\n- **Why DSATUR order:** a vertex that already sees many colours has the fewest choices. Colouring it early makes dead ends appear high in the tree, where cutting them removes the most work. It is also an excellent greedy order, so the first comple
