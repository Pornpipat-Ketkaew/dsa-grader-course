<style>
:root {
  --bg: #eef0f4; --panel: #ffffff; --panel-2: #f6f7fa; --ink: #161a24; --muted: #5b6375; --line: #d9dde6;
  --stack: #2a64d6; --stack-tint: #e9f0fd; --heap: #b56d00; --heap-tint: #fdf3e2; --ptr: #d02f67;
  --acc: #0b8f7d; --acc-tint: #dff4f0; --chg: #ffe066; --bad: #d6402b; --bad-tint: #fbe9e6; --new: #1f9d55; --code-bg: #fbfbfd;
  --font-display: "Bricolage Grotesque", "IBM Plex Sans Thai", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", "IBM Plex Sans Thai", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", "IBM Plex Mono", ui-monospace, "Cascadia Code", Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1117; --panel: #161b24; --panel-2: #1b212c; --ink: #e7eaf0; --muted: #9aa3b5; --line: #2a3242;
    --stack: #7aa7ff; --stack-tint: #172338; --heap: #f2b64f; --heap-tint: #2a2215; --ptr: #ff6f9f;
    --acc: #3fd0b9; --acc-tint: #12302c; --chg: #8a6d00; --bad: #ff7b66; --bad-tint: #321a17; --new: #4ccf83; --code-bg: #12161e;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1117; --panel: #161b24; --panel-2: #1b212c; --ink: #e7eaf0; --muted: #9aa3b5; --line: #2a3242;
  --stack: #7aa7ff; --stack-tint: #172338; --heap: #f2b64f; --heap-tint: #2a2215; --ptr: #ff6f9f;
  --acc: #3fd0b9; --acc-tint: #12302c; --chg: #8a6d00; --bad: #ff7b66; --bad-tint: #321a17; --new: #4ccf83; --code-bg: #12161e;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15.5px; line-height: 1.6; }
code, .mono { font-family: var(--font-mono); font-size: .9em; }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; }
h1, h2, h3, h4 { font-family: var(--font-display); text-wrap: balance; line-height: 1.25; }
a { color: var(--stack); }

/* top bar */
.topbar { position: sticky; top: 0; z-index: 30; display: flex; align-items: center; gap: 12px; padding: 8px 16px; background: var(--panel); border-bottom: 1px solid var(--line); height: 50px; }
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--font-display); font-weight: 700; font-size: 17px; color: var(--ink); text-decoration: none; white-space: nowrap; }
.brand-mark { display: grid; grid-template-columns: repeat(4, 7px); gap: 2px; }
.brand-mark i { width: 7px; height: 7px; border-radius: 1.5px; background: var(--stack); opacity: .9; }
.brand-mark i:nth-child(2n) { background: var(--heap); }
.brand-mark i:nth-child(3) { background: var(--ptr); }
.spacer { flex: 1; }
.search { width: min(320px, 40vw); padding: 5px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel-2); font-size: 14px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; flex: 0 0 auto; }
.seg button { border: 0; background: transparent; padding: 4px 10px; cursor: pointer; font-size: 13px; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--panel); }
.iconbtn { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 4px 10px; cursor: pointer; font-size: 13px; }
.menu-btn { display: none; }

/* shell */
.app { display: grid; grid-template-columns: 290px minmax(0, 1fr); }
.side { border-right: 1px solid var(--line); background: var(--panel); padding: 10px 10px 40px; position: sticky; top: 50px; height: calc(100vh - 50px); overflow-y: auto; }

.side a:hover { background: var(--panel-2); }
.side a[aria-current="page"] { background: var(--acc-tint); font-weight: 600; box-shadow: inset 3px 0 0 var(--acc); }
.side a .dn { color: var(--new); font-size: 12px; }
.side a .st { font-size: 10px; color: var(--heap); letter-spacing: -1px; }

.toc .donebtn[aria-pressed="true"] { background: var(--new); color: #fff; border-color: var(--new); }

.md td code, .md th code { white-space: nowrap; }

.md blockquote { margin: 10px 0; border-left: 3px solid var(--heap); background: var(--heap-tint); padding: 8px 14px; border-radius: 0 8px 8px 0; }
.md blockquote.ok { border-color: var(--acc); background: var(--acc-tint); }
.md blockquote.bad { border-color: var(--bad); background: var(--bad-tint); }
.md blockquote p { margin: 4px 0; }
.md hr { border: 0; border-top: 1px dashed var(--line); margin: 18px 0; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; margin: 12px 0; overflow: hidden; }
.panel .ph { display: flex; align-items: center; gap: 8px; padding: 7px 12px; border-bottom: 1px solid var(--line); font-size: 12px; font-weight: 600; color: var(--muted); letter-spacing: .04em; text-transform: uppercase; }

.tests { border-left: 3px solid var(--new); background: color-mix(in srgb, var(--new) 10%, transparent); padding: 8px 14px; border-radius: 0 8px 8px 0; margin: 10px 0; font-size: 14.5px; }

.pager { display: flex; justify-content: space-between; gap: 10px; margin-top: 34px; }
.pager a { flex: 1; padding: 10px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); text-decoration: none; color: var(--ink); font-size: 14px; }
.pager a:hover { border-color: var(--acc); }
.pager a small { display: block; color: var(--muted); font-size: 12px; }

/* final-book additions */
code, .code, pre.dia, .mono { font-variant-ligatures: none; font-feature-settings: 'liga' 0, 'calt' 0; }
.side a.chap { grid-template-columns: 22px 1fr auto; margin-top: 12px; padding: 6px 8px; font-weight: 700; font-family: var(--font-display); font-size: 14px; background: var(--panel-2); }

.chno.big { min-width: 40px; height: 40px; font-size: 22px; border-radius: 10px; vertical-align: 4px; }
.grp h2 a { color: var(--ink); text-decoration: none; }
.pno { font-family: var(--font-mono); font-size: .62em; color: var(--acc); margin-right: 12px; vertical-align: .18em; }
.lede2 { color: var(--muted); margin: 0 0 8px; }
.crumbs a { color: var(--muted); }
.card .m { display: flex; justify-content: space-between; align-items: center; margin-top: 4px; font-size: 11px; }
.card .m .st { color: var(--heap); letter-spacing: -1px; }
.card .m code { color: var(--muted); font-size: 10.5px; }
.tag.cx { border-color: var(--acc); color: var(--acc); font-family: var(--font-mono); }
details.hint { margin: 8px 0; border: 1px solid var(--line); border-left: 3px solid var(--stack); border-radius: 0 10px 10px 0; background: var(--stack-tint); max-width: 82ch; }

details.hint summary::before { content: '▸ '; }
details.hint[open] summary::before { content: '▾ '; }
details.hint .hb { padding: 0 14px 8px; }
.md .note { border: 1px dashed var(--acc); background: var(--acc-tint); border-radius: 10px; padding: 6px 14px; margin: 10px 0; max-width: 82ch; }
@media print { details.hint > *:not(summary) { display: block; } details.hint { break-inside: avoid; } .md h2 { break-after: avoid; } }

@media (max-width: 900px) {
  .app { grid-template-columns: 1fr; }

  .side.open { transform: none; }

}

<script>
const DATA = {"groups": [{"id": "brute", "title": {"en": "Brute force & backtracking", "th": "ค้นหาทุกกรณี (Brute force) และ backtracking"}, "sub": {"en": "generate every candidate in order, prune the branches that cannot work", "th": "สร้างทุกตัวเลือกตามลำดับ และตัดกิ่งที่ไม่มีทางเป็นคำตอบ"}, "intro": {"en": "## 1. The idea\n**Brute force** means: list every candidate answer and check each one. It is the first solution to think of, and often the right one when the input is small (n ≤ 10 for permutations, n ≤ 20 for subsets).\n\n**Backtracking** is brute force done carefully. Build the candidate one choice at a time (a decision tree), and **stop a branch as soon as it can no longer succeed** (pruning). The work then becomes proportional to the answers instead of to all candidates.\n\n```text\n           choose position 0\n          /        |        \\\n    choose 1    choose 1   choose 1        each level = one decision\n     / | \\       / | \\      / | \\          a leaf = one complete candidate\n   ...  ✗ ...   ...  ...   ✗  ...          ✗ = pruned: cannot lead to an answer\n```\n\n## 2. The template\n```cpp\nint n;\nvector<int> cur;            // the partial answer, one entry per decided level\nvector<bool> used;          // which values are taken (for permutations)\n\nvoid gen(int pos) {\n    if (pos == n) {         // every level decided: record or print the answer\n        print(cur);\n        return;\n    }\n    // try every choice for this level, in the order the output needs (smallest first)\n    for (int v = 0; v < n; v++) {\n        if (used[v] || !canPlace(v, pos)) continue;   // pruning: skip impossible branches\n        used[v] = true;  cur[pos] = v;                // make the choice\n        gen(pos + 1);                                 // decide the rest\n        used[v] = false;                              // undo it (backtrack)\n    }\n}\n```\n\nThree parts: a **base case** that records the answer, a **loop over choices** in the required order, and **make / recurse / undo**.\n\n## 3. How to recognise it\n- \"Print **all** …\", \"list every …\", \"in lexicographic / alphabetical order\".\n- Small limits: n ≤ 8–11 for permutations (n! up to 4 × 10⁷), n ≤ 20 for subsets or binary strings (2²⁰ ≈ 10⁶).\n- The output itself is huge: then you **must** enumerate, and the only question is how fast you print.\n\n## 4. Cost and pitfalls\n- Without pruning: n! or 2ⁿ leaves times O(n) per leaf. With good pruning: about O(answers · n).\n- **Order for free:** trying choices smallest-first gives lexicographic output, as long as no answer is a prefix of another.\n- **Undo** every change after the recursive call (used[], visited cells, counters).\n- **Output speed:** collect lines in a buffer or a `string`; never `endl` per line.\n- **Recursion depth** equals the number of levels; fine for n ≤ 10⁴, dangerous beyond that.\n\n## 5. In this chapter\n- [Generate barcode](#ex00e4): binary strings with exactly A ones, pruning by \"is there still room?\".\n- [Consecutive ones](#ex00e5): all n-bit strings in order, carrying the current run length as extra state.\n- [n-Queen](#ex07e1_nqueen): one queen per row, O(1) attack checks with three boolean arrays.\n- [Permutation with constraint](#a64_q1_permu_before): permutations in lexicographic order with \"a before b\" rules, a used[] array and a local check.\n- [Tower defense](#a65_q1_tower_defense): every tower picks a target; a huge n that does not matter and a tiny k that does.\n- [Day cover](#a66_q1a_day_cover): try every subset of at most 20 students (invite or skip), with bitsets and pruning by the best answer so far.\n- [Path sum](#a64_q4_path_sum): every simple path in a 20-node graph, cut by an upper bound and an early exit.\n- [Graph coloring](#ex07e3_coloring): branch and bound with symmetry breaking and the DSATUR order.\n\n[Map walk](#da66_f1_map_walk), [ABC permutation](#da67_f_abc_permutation) and [ABCD permutation](#da68_f_abcd_permutation), in the final chapters, use the same technique.", "th": "## 1. ไอเดีย\n**Brute force** คือ: แจกแจงทุกคำตอบที่เป็นไปได้แล้วตรวจทีละตัว เป็นวิธีแรกที่ควรนึกถึง และมักเป็นวิธีที่ถูกเมื่อ input เล็ก (n ≤ 10 สำหรับ permutation, n ≤ 20 สำหรับเซตย่อย)\n\n**Backtracking** คือ brute force ที่ทำอย่างระวัง สร้างคำตอบทีละการตัดสินใจ (ต้นไม้การตัดสินใจ) และ **หยุดกิ่งทันทีที่รู้ว่าไปต่อไม่สำเร็จแน่** (การตัดกิ่ง หรือ pruning) งานที่ทำจะเป็นสัดส่วนกับจำนวนคำตอบ แทนที่จะเป็นจำนวนตัวเลือกทั้งหมด\n\n```text\n           choose position 0\n          /        |        \\\n    choose 1    choose 1   choose 1        each level = one decision\n     / | \\       / | \\      / | \\          a leaf = one complete candidate\n   ...  ✗ ...   ...  ...   ✗  ...          ✗ = pruned: cannot lead to an answer\n```\n\n## 2. โครงโค้ด\n```cpp\nint n;\nvector<int> cur;            // the partial answer, one entry per decided level\nvector<bool> used;          // which values are taken (for permutations)\n\nvoid gen(int pos) {\n    if (pos == n) {         // every level decided: record or print the answer\n        print(cur);\n        return;\n    }\n    // try every choice for this level, in the order the output needs (smallest first)\n    for (int v = 0; v < n; v++) {\n        if (used[v] || !canPlace(v, pos)) continue;   // pruning: skip impossible branches\n        used[v] = true;  cur[pos] = v;                // make the choice\n        gen(pos + 1);                                 // decide the rest\n        used[v] = false;                              // undo it (backtrack)\n    }\n}\n```\n\nมีสามส่วน: **กรณีฐาน** ที่บันทึกคำตอบ, **ลูปทางเลือก** ตามลำดับที่ผลลัพธ์ต้องการ และ **เลือก / เรียกซ้ำ / ย้อนคืน**\n\n## 3. ดูอย่างไรว่าใช่\n- \"พิมพ์ **ทุก** …\", \"แจกแจงทุก …\", \"เรียงตามลำดับพจนานุกรม / ตัวอักษร\"\n- ขอบเขตเล็ก: n ≤ 8–11 สำหรับ permutation (n! ถึง 4 × 10⁷), n ≤ 20 สำหรับเซตย่อยหรือสตริงไบนารี (2²⁰ ≈ 10⁶)\n- ผลลัพธ์ใหญ่มากเอง: แบบนี้ **ต้อง** แจกแจง คำถามเดียวคือพิมพ์ให้เร็วแค่ไหน\n\n## 4. ต้นทุนและจุดพลาด\n- ไม่ตัดกิ่ง: n! หรือ 2ⁿ ใบ คูณ O(n) ต่อใบ ตัดกิ่งดี: ราว O(จำนวนคำตอบ · n)\n- **ได้ลำดับฟรี:** ลองทางเลือกจากน้อยไปมาก ผลลัพธ์จะเรียงตามพจนานุกรม ตราบที่ไม่มีคำตอบไหนเป็น prefix ของอีกคำตอบ\n- **ย้อนคืน** ทุกการเปลี่ยนแปลงหลังเรียกซ้ำ (used[], ช่องที่เยี่ยมแล้ว, ตัวนับ)\n- **ความเร็วการพิมพ์:** เก็บบรรทัดไว้ใน buffer หรือ `string` อย่าใช้ `endl` ทุกบรรทัด\n- **ความลึกของ recursion** เท่ากับจำนวนชั้น n ≤ 10⁴ ไม่เป็นไร เกินนั้นอันตราย\n\n## 5. ในบทนี้\n- [Generate barcode](#ex00e4): สตริงฐานสองที่มีเลข 1 พอดี A ตัว ตัดกิ่งด้วยคำถาม \"ยังมีที่เหลือไหม\"\n- [Consecutive ones](#ex00e5): ทุกสตริง n บิตตามลำดับ โดยพกความยาวของช่วงเลข 1 ปัจจุบันเป็น state เพิ่ม\n- [n-Queen](#ex07e1_nqueen): ราชินีแถวละตัว เช็กการโจมตีใน O(1) ด้วยอาเรย์ bool สามตัว\n- [Permutation with constraint](#a64_q1_permu_before): permutation ตามลำดับพจนานุกรมพร้อมกฎ \"a มาก่อน b\" ใช้อาเรย์ used[] และการเช็กเฉพาะจุด\n- [Tower defense](#a65_q1_tower_defense): ป้อมแต่ละป้อมเลือกเป้า n ที่ใหญ่มากไม่มีผล แต่ k ที่เล็กมากเป็นตัวกำหนด\n- [Day cover](#a66_q1a_day_cover): ลองทุกเซตย่อยของนิสิตไม่เกิน 20 คน (ชวนหรือข้าม) ด้วย bitset และตัดกิ่งด้วยคำตอบที่ดีที่สุดจนถึงตอนนี้\n- [Path sum](#a64_q4_path_sum): ทุก simple path ในกราฟ 20 ปม ตัดด้วยขอบบนและการหยุดก่อน\n- [Graph coloring](#ex07e3_coloring): branch and bound พร้อมการตัดสมมาตรและลำดับ DSATUR\n\n[Map walk](#da66_f1_map_walk), [ABC permutation](#da67_f_abc_permutation) และ [ABCD permutation](#da68_f_abcd_permutation) ในบทข้อสอบปลายภาคใช้เทคนิคเดียวกัน"}}, {"id": "sort", "title": {"en": "Sorting", "th": "การเรียงลำดับ (Sorting)"}, "sub": {"en": "sort first, then count or search; understand what a sort does step by step", "th": "เรียงก่อนแล้วค่อยนับหรือค้นหา และเข้าใจว่าการเรียงทำอะไรทีละขั้น"}, "intro": {"en": "## 1. The idea\nSorting is rarely the whole answer. It is the **first step** that makes the rest easy: after sorting, equal values sit together, the k-th smallest is at index k − 1, and \"how many are smaller than x\" is a binary search.\n\nExam questions on sorting come in two flavours:\n- **Use** a sort: sort (often something compressed, such as groups or pairs), then scan or binary-search.\n- **Understand** a sort: given the code of insertion sort, bubble sort or merge sort, count how often a line runs or how far an element moves.\n\n## 2. The templates\n```cpp\n// sort pairs by value, then build prefix counts\nsort(g.begin(), g.end());                          // by .first, then .second\nvector<long long> last(g.size());\n// i = 0 .. size-1: last[i] = total count of groups 0..i\nfor (int i = 0; i < (int)g.size(); i++)\n    last[i] = (i ? last[i - 1] : 0) + g[i].second;\n// the group that holds position p (1-based): first last[i] >= p\nint idx = lower_bound(last.begin(), last.end(), p) - last.begin();\n```\n\n```cpp\n// Fenwick tree: \"how many seen values are <= v\", point add in O(log n)\nvector<int> bit(n + 1, 0);\nvoid add(int v)  { for (int i = v; i <= n; i += i & -i) bit[i]++; }        // climb to the parents\nint  sum(int v)  { int s = 0; for (int i = v; i > 0; i -= i & -i) s += bit[i]; return s; }  // walk down\n```\n\n## 3. How to recognise it\n- The input is too big to expand, but its **description** is small (groups, ranges).\n- \"The k-th smallest\", \"the median\", \"how many are below / above\".\n- Code of a classic sort is printed in the statement, with a line number to count: think **inversions**.\n\n## 4. Cost and pitfalls\n- `std::sort` is O(n log n); never write bubble sort for real data.\n- Insertion sort's work = number of inversions: Θ(n²) in the worst case (reversed input).\n- Counts and positions can pass 2³¹ − 1: use `long long`.\n- `lower_bound` = first element ≥ x; `upper_bound` = first element > x. Mixing them up is an off-by-one.\n\n## 5. In this chapter\n- [3 values sort](#ex04m1_sort): the fewest swaps, found by counting values per zone instead of sorting.\n- [Huge array](#a65_q2a_huge_array): sort compressed groups, prefix sums, one binary search per query.\n- [Insertion sort count](#a66_q2a_insertion_count): what insertion sort really does, counted per element with a Fenwick tree.\n\n[Remaining merge](#da68_f2_remaining_merge) in the da68 final runs merge sort with a counter. The binary search here leads straight into the next chapter, [Divide & conquer](#ch-dc).", "th": "## 1. ไอเดีย\nการเรียงลำดับไม่ค่อยเป็นคำตอบทั้งหมด มันคือ **ขั้นแรก** ที่ทำให้ส่วนที่เหลือง่าย: หลังเรียงแล้ว ค่าที่เท่ากันอยู่ติดกัน ตัวที่ k อยู่ที่ index k − 1 และ \"มีกี่ตัวที่น้อยกว่า x\" ก็คือ binary search\n\nข้อสอบเรื่องการเรียงมีสองแบบ:\n- **ใช้** การเรียง: เรียง (มักเป็นข้อมูลที่ถูกบีบอัด เช่นกลุ่มหรือคู่) แล้วไล่หรือ binary search\n- **เข้าใจ** การเรียง: ให้โค้ด insertion sort, bubble sort หรือ merge sort มา แล้วนับว่าบรรทัดหนึ่งทำงานกี่ครั้ง หรือสมาชิกหนึ่งตัวเลื่อนไปไกลแค่ไหน\n\n## 2. โครงโค้ด\n```cpp\n// sort pairs by value, then build prefix counts\nsort(g.begin(), g.end());                          // by .first, then .second\nvector<long long> last(g.size());\n// i = 0 .. size-1: last[i] = total count of groups 0..i\nfor (int i = 0; i < (int)g.size(); i++)\n    last[i] = (i ? last[i - 1] : 0) + g[i].second;\n// the group that holds position p (1-based): first last[i] >= p\nint idx = lower_bound(last.begin(), last.end(), p) - last.begin();\n```\n\n```cpp\n// Fenwick tree: \"how many seen values are <= v\", point add in O(log n)\nvector<int> bit(n + 1, 0);\nvoid add(int v)  { for (int i = v; i <= n; i += i & -i) bit[i]++; }        // climb to the parents\nint  sum(int v)  { int s = 0; for (int i = v; i > 0; i -= i & -i) s += bit[i]; return s; }  // walk down\n```\n\n## 3. ดูอย่างไรว่าใช่\n- input ใหญ่เกินจะขยายออกมา แต่ **คำบรรยาย** มันเล็ก (กลุ่ม, ช่วง)\n- \"ตัวที่ k ที่น้อยที่สุด\", \"มัธยฐาน\", \"มีกี่ตัวที่น้อยกว่า / มากกว่า\"\n- โจทย์พิมพ์โค้ดการเรียงแบบคลาสสิกมาให้ พร้อมเลขบรรทัดที่ต้องนับ: ให้คิดถึง **inversion**\n\n## 4. ต้นทุนและจุดพลาด\n- `std::sort` เป็น O(n log n) อย่าเขียน bubble sort กับข้อมูลจริง\n- งานของ insertion sort = จำนวน inversion: Θ(n²) ในกรณีแย่สุด (input กลับด้าน)\n- จำนวนและตำแหน่งอาจเกิน 2³¹ − 1: ใช้ `long long`\n- `lower_bound` = ตัวแรกที่ ≥ x; `upper_bound` = ตัวแรกที่ > x สลับกันเมื่อไหร่ก็คลาดไปหนึ่ง\n\n## 5. ในบทนี้\n- [3 values sort](#ex04m1_sort): จำนวนการสลับน้อยที่สุด หาได้จากการนับค่าในแต่ละโซนแทนการเรียงจริง\n- [Huge array](#a65_q2a_huge_array): เรียงกลุ่มที่ถูกบีบอัด ทำ prefix sum แล้ว binary search หนึ่งครั้งต่อคำถาม\n- [Insertion sort count](#a66_q2a_insertion_count): insertion sort ทำอะไรจริง ๆ นับแยกรายตัวด้วย Fenwick tree\n\n[Remaining merge](#da68_f2_remaining_merge) ใน da68 final รัน merge sort พร้อมตัวนับ ส่วน binary search ในบทนี้พาไปสู่บทถัดไป [แบ่งแยกและเอาชนะ](#ch-dc) โดยตรง"}}, {"id": "dc", "title": {"en": "Divide & conquer", "th": "แบ่งแยกและเอาชนะ (Divide & Conquer)"}, "sub": {"en": "binary search, fast power, problems defined by halves", "th": "binary search, การยกกำลังแบบเร็ว, โจทย์ที่นิยามด้วยการแบ่งครึ่ง"}, "intro": {"en": "## 1. The idea\n**Divide and conquer** splits a problem into smaller copies of itself, solves them (usually recursively), and combines the results.\n\nThree shapes appear again and again in the grader:\n\n| shape | split | combine | cost |\n|---|---|---|---|\n| **binary search** | keep one half | nothing | O(log n) |\n| **fast power** | Aⁿ from A^(n/2) | one or two multiplications | O(log n) multiplications |\n| **defined by halves** | a 2ᵏ object = two 2ᵏ⁻¹ objects | check / build both halves | O(n log n) or O(n) |\n\n## 2. The templates\n```cpp\n// binary search for the LAST index with a[i] <= x  (a sorted ascending)\nint lo = 0, hi = n - 1, ans = -1;\n// shrink [lo, hi] until it is empty; ans remembers the best index seen\nwhile (lo <= hi) {\n    int mid = lo + (hi - lo) / 2;\n    if (a[mid] <= x) { ans = mid; lo = mid + 1; }   // fits: remember it, look further right\n    else hi = mid - 1;                             // too big: look left\n}\n```\n\n```cpp\n// fast power: A^n mod k, recursively\nMat power(Mat A, long long n) {\n    if (n == 1) return A;\n    Mat h = power(A, n / 2);       // solve the half-size problem once\n    Mat r = mul(h, h);             // combine: A^(2·(n/2))\n    return (n % 2) ? mul(r, A) : r;  // odd n needs one more A\n}\n```\n\n```cpp\n// a problem defined on halves: solve [lo, hi) from [lo, mid) and [mid, hi)\nbool check(int lo, int hi) {\n    if (hi - lo == 1) return base(lo);          // size 1 (or 2): decide directly\n    int mid = (lo + hi) / 2;\n    return check(lo, mid) && check(mid, hi) && fits(lo, mid, hi);\n}\n```\n\n## 3. How to recognise it\n- **Sorted** data, or a quantity that only grows (prefix sums, cost by distance): binary search.\n- n up to 10⁹ or 10¹⁸ with a **repeated operation** (power, linear recurrence): fast exponentiation.\n- Sizes are **powers of two** and the definition talks about \"the first half\" and \"the second half\": recurse on halves.\n\n## 4. Cost and pitfalls\n- Write `mid = lo + (hi - lo) / 2` and decide **before coding** which invariant [lo, hi] keeps; most binary-search bugs are off-by-one.\n- Comparing with a **real** query value (e.g. 3.5) needs a `double`; see [Binary search near](#ex01e3).\n- Fast power: compute the half power **once** and square it; calling `power(n/2)` twice turns O(log n) back into O(n).\n- Recursion on halves of size 2ᵏ has depth k, tiny; total work is O(n log n) if each level scans everything, O(n) if a level only combines two answers.\n\n## 5. In this chapter\n- [Binary search near](#ex01e3) and [Binary search near repeat](#ex02e3_bs): the invariant, then duplicates.\n- [Restaurant](#ex01m3): binary search on the answer (the time), with a monotone count of seated customers.\n- [Recursive matrix](#a62_q1a_recur): build an object quarter by quarter.\n- [Matrix modulo](#a60_q1_matmod): fast power of a 2 × 2 matrix.\n- [Lawn mowing](#a64_q1_lawn_mowing): prefix sums + binary search on the answer.\n- [Virus detection](#a62_q1b_virus) and [Virus 2](#a63_q1b_virus2): definitions by halves, returning a value up the recursion.", "th": "## 1. ไอเดีย\n**แบ่งแยกและเอาชนะ (Divide and conquer)** แบ่งปัญหาเป็นปัญหาแบบเดียวกันที่เล็กลง แก้มัน (มักแบบเวียนเกิด) แล้วรวมผล\n\nมีสามรูปแบบที่เจอบ่อยใน grader:\n\n| รูปแบบ | แบ่ง | รวม | ต้นทุน |\n|---|---|---|---|\n| **binary search** | เก็บไว้ครึ่งเดียว | ไม่ต้องรวม | O(log n) |\n| **ยกกำลังแบบเร็ว** | Aⁿ จาก A^(n/2) | คูณหนึ่งหรือสองครั้ง | O(log n) ครั้ง |\n| **นิยามด้วยครึ่ง** | วัตถุขนาด 2ᵏ = วัตถุ 2ᵏ⁻¹ สองชิ้น | ตรวจ / สร้างทั้งสองครึ่ง | O(n log n) หรือ O(n) |\n\n## 2. โครงโค้ด\n```cpp\n// binary search for the LAST index with a[i] <= x  (a sorted ascending)\nint lo = 0, hi = n - 1, ans = -1;\n// shrink [lo, hi] until it is empty; ans remembers the best index seen\nwhile (lo <= hi) {\n    int mid = lo + (hi - lo) / 2;\n    if (a[mid] <= x) { ans = mid; lo = mid + 1; }   // fits: remember it, look further right\n    else hi = mid - 1;                             // too big: look left\n}\n```\n\n```cpp\n// fast power: A^n mod k, recursively\nMat power(Mat A, long long n) {\n    if (n == 1) return A;\n    Mat h = power(A, n / 2);       // solve the half-size problem once\n    Mat r = mul(h, h);             // combine: A^(2·(n/2))\n    return (n % 2) ? mul(r, A) : r;  // odd n needs one more A\n}\n```\n\n```cpp\n// a problem defined on halves: solve [lo, hi) from [lo, mid) and [mid, hi)\nbool check(int lo, int hi) {\n    if (hi - lo == 1) return base(lo);          // size 1 (or 2): decide directly\n    int mid = (lo + hi) / 2;\n    return check(lo, mid) && check(mid, hi) && fits(lo, mid, hi);\n}\n```\n\n## 3. ดูอย่างไรว่าใช่\n- ข้อมูล **เรียงแล้ว** หรือปริมาณที่เพิ่มขึ้นอย่างเดียว (prefix sum, ค่าใช้จ่ายตามระยะ): binary search\n- n ถึง 10⁹ หรือ 10¹⁸ พร้อม **การดำเนินการซ้ำ ๆ** (ยกกำลัง, linear recurrence): ยกกำลังแบบเร็ว\n- ขนาดเป็น **กำลังของสอง** และนิยามพูดถึง \"ครึ่งแรก\" กับ \"ครึ่งหลัง\": เรียกซ้ำบนครึ่ง\n\n## 4. ต้นทุนและจุดพลาด\n- เขียน `mid = lo + (hi - lo) / 2` และตัดสินใจ **ก่อนเขียนโค้ด** ว่า [lo, hi] รักษา invariant อะไร บั๊ก binary search ส่วนใหญ่คือคลาดไปหนึ่ง\n- การเทียบกับค่าคำถามที่เป็น **จำนวนจริง** (เช่น 3.5) ต้องใช้ `double` ดู [Binary search near](#ex01e3)\n- ยกกำลังแบบเร็ว: คำนวณกำลังครึ่ง **ครั้งเดียว** แล้วยกกำลังสอง การเรียก `power(n/2)` สองครั้งทำให้ O(log n) กลับเป็น O(n)\n- การเรียกซ้ำบนครึ่งของขนาด 2ᵏ ลึกแค่ k งานรวมเป็น O(n log n) ถ้าแต่ละชั้นไล่ทุกตัว และ O(n) ถ้าแต่ละชั้นแค่รวมคำตอบสองค่า\n\n## 5. ในบทนี้\n- [Binary search near](#ex01e3) และ [Binary search near repeat](#ex02e3_bs): invariant แล้วตามด้วยข้อมูลซ้ำ\n- [Restaurant](#ex01m3): binary search บนคำตอบ (เวลา) โดยจำนวนลูกค้าที่ได้นั่งเพิ่มขึ้นทางเดียว\n- [Recursive matrix](#a62_q1a_recur): สร้างวัตถุทีละส่วนสี่\n- [Matrix modulo](#a60_q1_matmod): ยกกำลังเมทริกซ์ 2 × 2 แบบเร็ว\n- [Lawn mowing](#a64_q1_lawn_mowing): prefix sum + binary search บนคำตอบ\n- [Virus detection](#a62_q1b_virus) และ [Virus 2](#a63_q1b_virus2): นิยามด้วยครึ่ง และส่งค่ากลับขึ้นมาตาม recursion"}}, {"id": "greedy", "title": {"en": "Greedy", "th": "อัลกอริทึมละโมบ (Greedy)"}, "sub": {"en": "sort by the right key, take the best choice now, prove it with an exchange argument", "th": "เรียงตามคีย์ที่ถูก เลือกสิ่งที่ดีที่สุดตอนนี้ แล้วพิสูจน์ด้วยการสลับ (exchange argument)"}, "intro": {"en": "## 1. The idea\nA **greedy** algorithm builds the answer one piece at a time and, at every step, takes the choice that looks best **right now**. It never goes back to change an earlier choice. That makes it short and fast, usually just \"sort, then one loop\".\n\nThe catch: greedy is only correct when you can prove that the locally best choice is **always part of some optimal answer**. The standard proof is an **exchange argument**: take any optimal answer that disagrees with the greedy choice, swap in the greedy choice, and show the answer is not worse.\n\n```text\nclasses sorted by finish time:   [1────5]\n                                      [4───7]          skip: starts before 5\n                                         [6────10]     keep: starts at 6 ≥ 5\ntake the class that ends first: it leaves the most room for everything after it\n```\n\n## 2. The template\n```cpp\n// 1. decide the order in which items are considered\nsort(items.begin(), items.end(), byGreedyKey);   // finish time, value per kg, position, ...\n\n// 2. one pass: take each item if it still fits, never undo\nState s = empty;\nfor (int i = 0; i < n; i++) {\n    if (fits(s, items[i])) s = add(s, items[i]);\n}\n```\n\nEverything clever is in **the sort key**. The loop itself is trivial.\n\n## 3. How to recognise it\n- \"Maximum number of …\" or \"minimum number of …\" with intervals, points or deadlines on a line.\n- Items can be **split** (fractional knapsack). If they cannot be split, greedy is usually wrong and you need [DP](#ch-dp).\n- A choice that \"obviously can't hurt\": the leftmost uncovered point must be covered by something, so cover it as far to the right as possible.\n- The limits are large (n up to 10⁵ or more), so only O(n log n) fits.\n\n## 4. Cost and pitfalls\n- Cost: O(n log n) for the sort plus O(n) for the pass.\n- **Wrong key:** \"shortest class first\" or \"earliest start first\" fail for interval scheduling. Test a key on a small counter-example before trusting it.\n- **0/1 knapsack is not greedy:** best ratio first fails when items cannot be split (W = 10, items (6 kg, 7), (5 kg, 5), (5 kg, 5): the ratio picks 7, the answer is 10).\n- **Proof or brute force:** if you cannot argue an exchange, compare with a brute force on random small inputs, as every page here does.\n- **Ties** in the sort key: check whether the order among equal keys matters.\n\n## 5. In this chapter\n- [Class selection](#ex04e1_interval): the classic activity selection, earliest finish first. It is also **a58_m_p4**.\n- [Buffet line](#a60b_mid_p1_buffet): cover points with intervals of fixed length, placing each lamp as far right as it can go.\n- [Fractional knapsack](#ex04e2_fknapsack): best value per kilogram first, the last item cut to fit.\n\n[3 values sort](#ex04m1_sort) in the sorting chapter and [Game of trade](#da68_f_game_of_trades) in the da68 final are greedy too.", "th": "## 1. ไอเดีย\nอัลกอริทึม **ละโมบ (greedy)** สร้างคำตอบทีละชิ้น และทุกขั้นจะเลือกสิ่งที่ดูดีที่สุด **ณ ตอนนั้น** โดยไม่ย้อนกลับไปแก้การเลือกก่อนหน้าเลย จึงสั้นและเร็ว ส่วนใหญ่เป็นแค่ \"เรียง แล้ววนลูปรอบเดียว\"\n\nข้อควรระวัง: greedy ถูกต้องก็ต่อเมื่อพิสูจน์ได้ว่าการเลือกที่ดีที่สุดเฉพาะหน้า **เป็นส่วนหนึ่งของคำตอบที่ดีที่สุดบางคำตอบเสมอ** วิธีพิสูจน์มาตรฐานคือ **exchange argument**: หยิบคำตอบที่ดีที่สุดใด ๆ ที่ไม่ตรงกับการเลือกแบบ greedy แล้วสลับเอาตัวที่ greedy เลือกเข้าไปแทน และแสดงว่าคำตอบไม่แย่ลง\n\n```text\nclasses sorted by finish time:   [1────5]\n                                      [4───7]          skip: starts before 5\n                                         [6────10]     keep: starts at 6 ≥ 5\ntake the class that ends first: it leaves the most room for everything after it\n```\n\n## 2. โครงโค้ด\n```cpp\n// 1. decide the order in which items are considered\nsort(items.begin(), items.end(), byGreedyKey);   // finish time, value per kg, position, ...\n\n// 2. one pass: take each item if it still fits, never undo\nState s = empty;\nfor (int i = 0; i < n; i++) {\n    if (fits(s, items[i])) s = add(s, items[i]);\n}\n```\n\nความฉลาดทั้งหมดอยู่ที่ **เกณฑ์การเรียง** ส่วนลูปนั้นง่ายมาก\n\n## 3. ดูอย่างไรว่าใช่\n- \"จำนวนมากที่สุดของ …\" หรือ \"จำนวนน้อยที่สุดของ …\" กับช่วงเวลา จุด หรือกำหนดส่งบนเส้นตรง\n- ของ **แบ่งได้** (fractional knapsack) ถ้าแบ่งไม่ได้ greedy มักผิด ต้องใช้ [DP](#ch-dp)\n- การเลือกที่ \"ไม่มีทางเสียหาย\" ชัด ๆ: จุดซ้ายสุดที่ยังไม่ถูกครอบคลุมต้องมีอะไรมาครอบมันแน่ ๆ จึงครอบมันโดยวางให้ไปทางขวามากที่สุด\n- ขอบเขตใหญ่ (n ถึง 10⁵ หรือมากกว่า) จึงทำได้แค่ O(n log n)\n\n## 4. ต้นทุนและจุดพลาด\n- ต้นทุน: O(n log n) สำหรับการเรียง บวก O(n) สำหรับลูป\n- **เกณฑ์ผิด:** \"คาบสั้นสุดก่อน\" หรือ \"เริ่มก่อนก่อน\" ใช้ไม่ได้กับการจัดห้องเรียน ลองเกณฑ์กับตัวอย่างค้านเล็ก ๆ ก่อนเชื่อ\n- **0/1 knapsack ไม่ใช่ greedy:** เลือกอัตราส่วนดีที่สุดก่อนผิดเมื่อแบ่งของไม่ได้ (W = 10 ของ (6 kg, 7), (5 kg, 5), (5 kg, 5): อัตราส่วนเลือก 7 แต่คำตอบคือ 10)\n- **พิสูจน์ หรือเทียบกับ brute force:** ถ้าอธิบาย exchange ไม่ได้ ให้เทียบกับ brute force บน input เล็กแบบสุ่ม เหมือนที่ทุกหน้าในหนังสือนี้ทำ\n- **ค่าเท่ากัน** ในเกณฑ์การเรียง: เช็กว่าลำดับระหว่างตัวที่เท่ากันมีผลหรือไม่\n\n## 5. ในบทนี้\n- [Class selection](#ex04e1_interval): การเลือกกิจกรรมแบบคลาสสิก เลือกคาบที่จบก่อนก่อน และเป็นข้อเดียวกับ **a58_m_p4**\n- [Buffet line](#a60b_mid_p1_buffet): ครอบจุดด้วยช่วงยาวคงที่ วางหลอดไฟแต่ละดวงให้ไปทางขวามากที่สุดเท่าที่ทำได้\n- [Fractional knapsack](#ex04e2_fknapsack): เลือกมูลค่าต่อกิโลกรัมสูงสุดก่อน ชิ้นสุดท้ายตัดให้พอดี\n\n[3 values sort](#ex04m1_sort) ในบทการเรียงลำดับ และ [Game of trade](#da68_f_game_of_trades) ในบท da68 final ก็เป็น greedy เช่นกัน"}}, {"id": "dp", "title": {"en": "Dynamic programming", "th": "กำหนดการพลวัต (Dynamic Programming)"}, "sub": {"en": "name the sub-problem, write the recurrence, fill the table in the right order", "th": "ตั้งชื่อปัญหาย่อย เขียนความสัมพันธ์เวียนเกิด แล้วเติมตารางตามลำดับที่ถูก"}, "intro": {"en": "## 1. The idea\n**Dynamic programming** = recursion where the same sub-problems come back again and again, so you solve each one **once** and store it.\n\nEvery DP answer has four parts. Write them down before writing code:\n1. **State:** what does `dp[i]` (or `dp[i][j]`) mean, in one sentence?\n2. **Transition:** how is a state computed from smaller states?\n3. **Base cases:** the smallest states, known directly.\n4. **Order:** fill the table so that every state's inputs are ready (or use memoised recursion and let the calls decide).\n\n```text\nplain recursion for F(5)            with a table\n          F5                         F0 F1 F2 F3 F4 F5\n        /    \\                        0  1  1  2  3  5\n      F4      F3                      each computed once, left to right\n     /  \\    /  \\\n   F3   F2  F2  F1     F3 twice, F2 three times, ...  →  exponential\n```\n\n## 2. The templates\n```cpp\n// top-down: recursion + memo\nlong long memo[MAXN];               // -1 = not computed yet\nlong long f(int i) {\n    if (i <= 1) return i;           // base cases\n    if (memo[i] != -1) return memo[i];\n    return memo[i] = f(i - 1) + f(i - 2);   // transition, stored on the way out\n}\n```\n\n```cpp\n// bottom-up: fill the table in an order where the inputs are ready\ndp[0] = 1;                                      // base case\n// i = 1 .. n: every dp[i - s] with s >= 1 is already filled\nfor (int i = 1; i <= n; i++) {\n    dp[i] = 0;\n    // add every way the last step can look\n    for (int s : steps)\n        if (i - s >= 0) dp[i] = (dp[i] + dp[i - s]) % MOD;\n}\n```\n\n## 3. How to recognise it\n- **Counting** (\"how many ways\"), often \"mod something\": DP that adds.\n- **Best** (\"maximum sum\", \"minimum cost\") over choices that build on each other: DP that takes max/min.\n- A brute force would try exponentially many sequences, but the future depends only on a **small summary** of the past (the position, the last move, the last column).\n- A rule like \"not the same move twice\" or \"no two adjacent 1s\": add the **last choice** to the state.\n\n## 4. Cost and pitfalls\n- Cost = (number of states) × (work per transition). Estimate it before coding.\n- Counting answers grow fast: take the mod after **every** addition and multiplication; use `long long` for products.\n- In-place updates can read a value that was already overwritten in the same round; when in doubt, keep two rows (`cur` / `nxt`).\n- Recursion with memo is easy to write but can be deep; bottom-up avoids stack overflow.\n\n## 5. In this chapter\n- [Fibonacci](#ex02e1_fibo) and [Binomial coefficient](#ex02e2_cnk): memoisation, from exponential to tiny.\n- [Increasing sequence sum](#ex07e2_iss): partitions of N, the coin-change counting DP.\n- [Number triangle](#ex02m1_triangle): a \"best path\" DP, filled bottom-up.\n- [Longest common subsequence](#ex03e1_lcs): the two-string table on prefixes.\n- [Chocolate](#a62_q1b_chocolate): counting sequences, mod.\n- [Table without 11](#a64_q2_table_no_11): a state that remembers the last column.\n- [Diagonal sum](#a60b_q1_diagsum): Kadane's \"best sum ending here\".\n\nMore DP in the final chapters: [Linear recurrence](#da66_f1_linear_recurrence), [New Game Plus](#da66_f2_new_game_plus), [One two apart](#da67_f_one_two_apart), [Hidden palindrome](#da68_f_hidden_palindrome), [0-1 subset sum](#da68_f2_zero_one_subset_sum) and [SackKnap](#da68_f2_sackknap).", "th": "## 1. ไอเดีย\n**กำหนดการพลวัต (Dynamic programming)** = recursion ที่ปัญหาย่อยเดิมกลับมาซ้ำแล้วซ้ำอีก จึงแก้แต่ละปัญหา **ครั้งเดียว** แล้วเก็บไว้\n\nคำตอบ DP ทุกข้อมีสี่ส่วน เขียนออกมาก่อนเขียนโค้ด:\n1. **State:** `dp[i]` (หรือ `dp[i][j]`) หมายถึงอะไร ในประโยคเดียว\n2. **Transition:** state หนึ่งคำนวณจาก state ที่เล็กกว่าอย่างไร\n3. **กรณีฐาน:** state ที่เล็กที่สุด ซึ่งรู้ค่าได้ทันที\n4. **ลำดับ:** เติมตารางให้ทุก state มีข้อมูลที่ต้องใช้พร้อม (หรือใช้ recursion กับ memo แล้วปล่อยให้การเรียกเป็นตัวกำหนด)\n\n```text\nplain recursion for F(5)            with a table\n          F5                         F0 F1 F2 F3 F4 F5\n        /    \\                        0  1  1  2  3  5\n      F4      F3                      each computed once, left to right\n     /  \\    /  \\\n   F3   F2  F2  F1     F3 twice, F2 three times, ...  →  exponential\n```\n\n## 2. โครงโค้ด\n```cpp\n// top-down: recursion + memo\nlong long memo[MAXN];               // -1 = not computed yet\nlong long f(int i) {\n    if (i <= 1) return i;           // base cases\n    if (memo[i] != -1) return memo[i];\n    return memo[i] = f(i - 1) + f(i - 2);   // transition, stored on the way out\n}\n```\n\n```cpp\n// bottom-up: fill the table in an order where the inputs are ready\ndp[0] = 1;                                      // base case\n// i = 1 .. n: every dp[i - s] with s >= 1 is already filled\nfor (int i = 1; i <= n; i++) {\n    dp[i] = 0;\n    // add every way the last step can look\n    for (int s : steps)\n        if (i - s >= 0) dp[i] = (dp[i] + dp[i - s]) % MOD;\n}\n```\n\n## 3. ดูอย่างไรว่าใช่\n- **นับ** (\"มีกี่วิธี\") มักมี \"mod อะไรสักอย่าง\": DP แบบบวก\n- **ดีที่สุด** (\"ผลรวมมากสุด\", \"ค่าใช้จ่ายน้อยสุด\") จากทางเลือกที่ต่อยอดกัน: DP แบบ max/min\n- brute force ต้องลองลำดับจำนวนเอกซ์โพเนนเชียล แต่อนาคตขึ้นกับแค่ **สรุปสั้น ๆ** ของอดีต (ตำแหน่ง, ท่าล่าสุด, คอลัมน์ล่าสุด)\n- กฎแบบ \"ห้ามท่าเดิมสองครั้ง\" หรือ \"ห้ามมี 1 ติดกัน\": ใส่ **ทางเลือกล่าสุด** ลงใน state\n\n## 4. ต้นทุนและจุดพลาด\n- ต้นทุน = (จำนวน state) × (งานต่อ transition) ประเมินก่อนเขียนโค้ด\n- คำตอบแบบนับโตเร็ว: mod หลัง **ทุก** การบวกและคูณ ใช้ `long long` สำหรับผลคูณ\n- การอัปเดตทับที่เดิมอาจอ่านค่าที่ถูกเขียนทับไปแล้วในรอบเดียวกัน ถ้าไม่แน่ใจให้ใช้สองแถว (`cur` / `nxt`)\n- recursion กับ memo เขียนง่ายแต่อาจลึก bottom-up เลี่ยง stack overflow ได้\n\n## 5. ในบทนี้\n- [Fibonacci](#ex02e1_fibo) และ [Binomial coefficient](#ex02e2_cnk): memoization จากเอกซ์โพเนนเชียลเหลือนิดเดียว\n- [Increasing sequence sum](#ex07e2_iss): partition ของ N ด้วย DP นับแบบแลกเหรียญ\n- [Number triangle](#ex02m1_triangle): DP แบบ \"เส้นทางดีที่สุด\" เติมจากล่างขึ้นบน\n- [Longest common subsequence](#ex03e1_lcs): ตารางของสองสตริงบน prefix\n- [Chocolate](#a62_q1b_chocolate): นับลำดับ พร้อม mod\n- [Table without 11](#a64_q2_table_no_11): state ที่จำคอลัมน์ล่าสุด\n- [Diagonal sum](#a60b_q1_diagsum): \"ผลรวมดีที่สุดที่จบตรงนี้\" ของ Kadane\n\nDP เพิ่มเติมในบทข้อสอบปลายภาค: [Linear recurrence](#da66_f1_linear_recurrence), [New Game Plus](#da66_f2_new_game_plus), [One two apart](#da67_f_one_two_apart), [Hidden palindrome](#da68_f_hidden_palindrome), [0-1 subset sum](#da68_f2_zero_one_subset_sum) และ [SackKnap](#da68_f2_sackknap)"}}, {"id": "graph1", "title": {"en": "Graph 1: BFS, DFS, components, cycles", "th": "กราฟ 1: BFS, DFS, component และวงวน"}, "sub": {"en": "store the graph, walk it, count what you find", "th": "เก็บกราฟ เดินสำรวจ แล้วนับสิ่งที่พบ"}, "intro": {"en": "## 1. The idea\nA **graph** is nodes plus edges. Almost every graph question starts the same way: **store** the graph, **walk** it, and **count** what you meet.\n\n- **Store:** an adjacency list `vector<vector<int>> adj` for sparse graphs; an adjacency matrix when the input already is one or the graph is dense; nothing at all for a **grid**, where the neighbours of (r, c) are computed on the spot.\n- **Walk:** DFS goes deep first (good for \"which nodes are connected\"); BFS goes layer by layer (good for \"**fewest steps**\").\n- **Count:** components, degrees, cycles, distances.\n\n```text\nBFS from s: layers by distance          DFS from s: one branch to the end, then back\n      s                                       s\n    / | \\      layer 1                        |\n   a  b  c                                    a ── d ── g      (then back up to try b, c)\n   |     |     layer 2\n   d     e\n```\n\n## 2. The templates\n```cpp\n// BFS: shortest number of edges from s (several sources: push them all first)\nvector<int> dist(n, -1);\nqueue<int> q;\ndist[s] = 0; q.push(s);\n// pop nodes in order of distance\nwhile (!q.empty()) {\n    int u = q.front(); q.pop();\n    // every neighbour not seen yet is one step further\n    for (int v : adj[u])\n        if (dist[v] == -1) { dist[v] = dist[u] + 1; q.push(v); }\n}\n```\n\n```cpp\n// counting components with an iterative DFS (no deep recursion)\nvector<bool> seen(n, false);\nint comps = 0;\n// every node 0..n-1 that is still unseen starts a new component\nfor (int s = 0; s < n; s++) {\n    if (seen[s]) continue;\n    comps++;\n    vector<int> st = {s}; seen[s] = true;\n    // pop and expand until the whole component is marked\n    while (!st.empty()) {\n        int u = st.back(); st.pop_back();\n        for (int v : adj[u]) if (!seen[v]) { seen[v] = true; st.push_back(v); }\n    }\n}\n```\n\n```cpp\n// union-find with path compression: \"are a and b already connected?\"\nint find(int x) { return par[x] == x ? x : par[x] = find(par[x]); }\nbool unite(int a, int b) { a = find(a); b = find(b); if (a == b) return false; par[a] = b; return true; }\n```\n\n## 3. How to recognise it\n- \"Connected\", \"reach\", \"group\", \"spread\", \"friends of friends\": components or BFS.\n- \"Minimum number of steps / days / moves\", all moves cost the same: **BFS**. Many starting points: **multi-source BFS**.\n- \"Does it contain a cycle?\": union-find (an edge inside one set closes a cycle) or degree counting.\n- n nodes and n edges, connected: a tree plus **one** extra edge, exactly one cycle.\n\n## 4. Cost and pitfalls\n- BFS and DFS are O(V + E) with adjacency lists, O(V²) with a matrix.\n- Undirected edges: store **both** directions.\n- Recursive DFS on 10⁵–10⁶ nodes can overflow the stack; use an explicit stack or BFS.\n- 10⁶+ numbers of input: use `scanf`, `ios::sync_with_stdio(false)`, or a `fread` reader.\n- Grids: keep direction arrays `dr[] = {-1, 1, 0, 0}`, `dc[] = {0, 0, -1, 1}` and check bounds before reading a cell.\n\n## 5. In this chapter\n- [Degrees](#a65_q0_degrees): the simplest graph fact, and fast input.\n- [Component count](#a60a_q3_component): DFS marks one component at a time.\n- [Detecting a cycle](#ex05m1_cycle): union-find.\n- [Line graph count](#a62_q2a_line_graph): components plus a degree test.\n- [Connection](#ex05m2_connection): BFS from every node with a depth limit.\n- [Pandemic](#a62_q2a_pandemic): multi-source BFS on a grid, stop at day T.\n- [Cycle in a tree](#a59_q3_cycle): peel leaves until only the cycle is left.\n\nIn the final chapters, [Border extend](#da67_f_border_extend) is a multi-source BFS limited to k layers, and [K connected city](#da68_f_k_connected_city) takes the first K cities of a BFS.", "th": "## 1. ไอเดีย\n**กราฟ** คือปมกับเส้นเชื่อม โจทย์กราฟเกือบทุกข้อเริ่มเหมือนกัน: **เก็บ** กราฟ **เดิน** สำรวจ แล้ว **นับ** สิ่งที่เจอ\n\n- **เก็บ:** adjacency list `vector<vector<int>> adj` สำหรับกราฟเบาบาง; adjacency matrix เมื่อ input เป็นเมทริกซ์อยู่แล้วหรือกราฟหนาแน่น; และไม่ต้องเก็บอะไรเลยสำหรับ **ตาราง** ที่เพื่อนบ้านของ (r, c) คำนวณได้ทันที\n- **เดิน:** DFS ลงลึกก่อน (เหมาะกับ \"ปมไหนเชื่อมกันบ้าง\") BFS ไปทีละชั้น (เหมาะกับ \"**ก้าวน้อยที่สุด**\")\n- **นับ:** component, ดีกรี, วงวน, ระยะทาง\n\n```text\nBFS from s: layers by distance          DFS from s: one branch to the end, then back\n      s                                       s\n    / | \\      layer 1                        |\n   a  b  c                                    a ── d ── g      (then back up to try b, c)\n   |     |     layer 2\n   d     e\n```\n\n## 2. โครงโค้ด\n```cpp\n// BFS: shortest number of edges from s (several sources: push them all first)\nvector<int> dist(n, -1);\nqueue<int> q;\ndist[s] = 0; q.push(s);\n// pop nodes in order of distance\nwhile (!q.empty()) {\n    int u = q.front(); q.pop();\n    // every neighbour not seen yet is one step further\n    for (int v : adj[u])\n        if (dist[v] == -1) { dist[v] = dist[u] + 1; q.push(v); }\n}\n```\n\n```cpp\n// counting components with an iterative DFS (no deep recursion)\nvector<bool> seen(n, false);\nint comps = 0;\n// every node 0..n-1 that is still unseen starts a new component\nfor (int s = 0; s < n; s++) {\n    if (seen[s]) continue;\n    comps++;\n    vector<int> st = {s}; seen[s] = true;\n    // pop and expand until the whole component is marked\n    while (!st.empty()) {\n        int u = st.back(); st.pop_back();\n        for (int v : adj[u]) if (!seen[v]) { seen[v] = true; st.push_back(v); }\n    }\n}\n```\n\n```cpp\n// union-find with path compression: \"are a and b already connected?\"\nint find(int x) { return par[x] == x ? x : par[x] = find(par[x]); }\nbool unite(int a, int b) { a = find(a); b = find(b); if (a == b) return false; par[a] = b; return true; }\n```\n\n## 3. ดูอย่างไรว่าใช่\n- \"เชื่อมกัน\", \"ไปถึง\", \"กลุ่ม\", \"แพร่กระจาย\", \"เพื่อนของเพื่อน\": component หรือ BFS\n- \"จำนวนก้าว / วัน / ครั้งที่น้อยที่สุด\" ทุกก้าวราคาเท่ากัน: **BFS** ถ้ามีจุดเริ่มหลายจุด: **BFS หลายจุดเริ่ม**\n- \"มีวงวนไหม\": union-find (เส้นที่อยู่ในเซตเดียวกันปิดวง) หรือนับดีกรี\n- n ปม n เส้น และเชื่อมกันหมด: ต้นไม้บวกเส้นเพิ่ม **หนึ่ง** เส้น มีวงพอดีหนึ่งวง\n\n## 4. ต้นทุนและจุดพลาด\n- BFS และ DFS เป็น O(V + E) กับ adjacency list และ O(V²) กับเมทริกซ์\n- เส้นไม่มีทิศ: เก็บ **ทั้งสอง** ทิศ\n- DFS แบบ recursive บน 10⁵–10⁶ ปมอาจทำให้ stack ล้น ใช้ stack เองหรือ BFS\n- input 10⁶ ตัวขึ้นไป: ใช้ `scanf`, `ios::sync_with_stdio(false)` หรือตัวอ่าน `fread`\n- ตาราง: เก็บอาร์เรย์ทิศ `dr[] = {-1, 1, 0, 0}`, `dc[] = {0, 0, -1, 1}` และเช็กขอบก่อนอ่านช่อง\n\n## 5. ในบทนี้\n- [Degrees](#a65_q0_degrees): ข้อเท็จจริงของกราฟที่ง่ายที่สุด และการอ่าน input ให้เร็ว\n- [Component count](#a60a_q3_component): DFS ทำเครื่องหมายทีละ component\n- [Detecting a cycle](#ex05m1_cycle): union-find\n- [Line graph count](#a62_q2a_line_graph): component บวกการทดสอบดีกรี\n- [Connection](#ex05m2_connection): BFS จากทุกปมพร้อมจำกัดความลึก\n- [Pandemic](#a62_q2a_pandemic): BFS หลายจุดเริ่มบนตาราง หยุดที่วัน T\n- [วงวนในต้นไม้](#a59_q3_cycle): ลอกใบจนเหลือแต่วงวน\n\nในบทข้อสอบปลายภาค [Border extend](#da67_f_border_extend) คือ BFS หลายจุดเริ่มที่จำกัด k ชั้น และ [K connected city](#da68_f_k_connected_city) ใช้ K เมืองแรกของ BFS"}}, {"id": "mst", "title": {"en": "Minimum spanning tree", "th": "ต้นไม้แผ่กว้างน้อยสุด (MST)"}, "sub": {"en": "connect everything as cheaply (or as richly) as possible: Prim and Kruskal", "th": "เชื่อมทุกจุดให้ถูกที่สุด (หรือได้ค่ามากสุด) ด้วย Prim และ Kruskal"}, "intro": {"en": "## 1. The idea\nA **spanning tree** connects all V nodes with exactly V − 1 edges and no cycle. The **minimum spanning tree (MST)** is the one with the smallest total weight: the cheapest way to connect everything.\n\nBoth classic algorithms are greedy, and both are correct because of one fact:\n\n> **Cut property.** Split the nodes into two non-empty groups. The cheapest edge crossing between the groups belongs to some MST.\n\n- **Prim:** grow one tree from a start node; each round add the cheapest edge leaving the tree.\n- **Kruskal:** sort all edges; add each edge unless it would close a cycle (checked with union-find).\n\n```text\nPrim, round by round                    Kruskal, edge by edge (sorted)\n  tree = {0}                              1: 0–1  add\n  cheapest edge out: 0–1 (1)  add 1       2: 1–2  add\n  cheapest edge out: 1–2 (2)  add 2       3: 0–2  skip (0 and 2 already connected)\n  cheapest edge out: 0–3 (4)  add 3       4: 0–3  add  → 3 edges, done\n```\n\n## 2. The templates\n```cpp\n// Prim O(V^2), best for dense / complete graphs (w = adjacency matrix)\nvector<long long> best(n, INF);        // cheapest edge from v into the tree\nvector<bool> inTree(n, false);\nbest[0] = 0;\nlong long total = 0;\n// n rounds, one node joins per round\nfor (int round = 0; round < n; round++) {\n    int u = -1;\n    // pick the outside node with the cheapest connection\n    for (int v = 0; v < n; v++)\n        if (!inTree[v] && (u == -1 || best[v] < best[u])) u = v;\n    inTree[u] = true; total += best[u];\n    // u's edges may be cheaper connections for the others\n    for (int v = 0; v < n; v++)\n        if (!inTree[v] && w[u][v] < best[v]) best[v] = w[u][v];\n}\n```\n\n```cpp\n// Kruskal O(E log E), best for sparse graphs given as an edge list\nsort(edges.begin(), edges.end());      // (weight, a, b) by weight\n// try the edges from cheapest to most expensive\nfor (auto [c, a, b] : edges)\n    if (unite(a, b)) total += c;       // unite() is the union-find from Graph 1\n```\n\n## 3. How to recognise it\n- \"Connect all …\", \"every pair must be able to communicate (directly or through others)\", \"minimum total cost of cables / roads\".\n- Exactly V − 1 edges must be chosen and the result must be connected.\n- \"**Maximum** total\" with the same shape: flip every comparison; the same algorithms give a maximum spanning tree.\n\n## 4. Cost and pitfalls\n- Dense or complete graph (E ≈ V²): **array Prim**, O(V²), no edge list needed.\n- Sparse graph: Kruskal O(E log E) or heap Prim O(E log V).\n- The MST is not a shortest-path tree: it minimises the **total**, not the distance from one node.\n- Totals can exceed `int`: up to (V − 1) × max weight.\n- Weights computed from the nodes (e.g. x XOR y): compute them on the fly instead of storing V² numbers.\n\n## 5. In this chapter\n- [Cable company](#ex06e1_cable): textbook MST on a complete graph, array Prim.\n- [Beautiful roads (XOR)](#a60a_q3_xor_road): a maximum spanning tree with weights computed on the fly.\n\n[Internet provider](#da68_f_internet_provider) in the da68 final is an MST with its K − 1 heaviest edges removed.", "th": "## 1. ไอเดีย\n**Spanning tree** เชื่อมทุก V ปมด้วยเส้น V − 1 เส้นพอดีโดยไม่มีวงวน **Minimum spanning tree (MST)** คือต้นที่น้ำหนักรวมน้อยที่สุด: วิธีที่ถูกที่สุดในการเชื่อมทุกอย่าง\n\nอัลกอริทึมคลาสสิกทั้งสองเป็นแบบละโมบ และถูกต้องเพราะข้อเท็จจริงข้อเดียว:\n\n> **Cut property.** แบ่งปมเป็นสองกลุ่มที่ไม่ว่าง เส้นที่ถูกที่สุดที่ข้ามระหว่างสองกลุ่มอยู่ใน MST บางต้นแน่นอน\n\n- **Prim:** ปลูกต้นไม้ต้นเดียวจากปมเริ่ม ทุกรอบเพิ่มเส้นที่ถูกที่สุดที่ออกจากต้นไม้\n- **Kruskal:** เรียงเส้นทั้งหมด แล้วเพิ่มทีละเส้นถ้ามันไม่ปิดวง (เช็กด้วย union-find)\n\n```text\nPrim, round by round                    Kruskal, edge by edge (sorted)\n  tree = {0}                              1: 0–1  add\n  cheapest edge out: 0–1 (1)  add 1       2: 1–2  add\n  cheapest edge out: 1–2 (2)  add 2       3: 0–2  skip (0 and 2 already connected)\n  cheapest edge out: 0–3 (4)  add 3       4: 0–3  add  → 3 edges, done\n```\n\n## 2. โครงโค้ด\n```cpp\n// Prim O(V^2), best for dense / complete graphs (w = adjacency matrix)\nvector<long long> best(n, INF);        // cheapest edge from v into the tree\nvector<bool> inTree(n, false);\nbest[0] = 0;\nlong long total = 0;\n// n rounds, one node joins per round\nfor (int round = 0; round < n; round++) {\n    int u = -1;\n    // pick the outside node with the cheapest connection\n    for (int v = 0; v < n; v++)\n        if (!inTree[v] && (u == -1 || best[v] < best[u])) u = v;\n    inTree[u] = true; total += best[u];\n    // u's edges may be cheaper connections for the others\n    for (int v = 0; v < n; v++)\n        if (!inTree[v] && w[u][v] < best[v]) best[v] = w[u][v];\n}\n```\n\n```cpp\n// Kruskal O(E log E), best for sparse graphs given as an edge list\nsort(edges.begin(), edges.end());      // (weight, a, b) by weight\n// try the edges from cheapest to most expensive\nfor (auto [c, a, b] : edges)\n    if (unite(a, b)) total += c;       // unite() is the union-find from Graph 1\n```\n\n## 3. ดูอย่างไรว่าใช่\n- \"เชื่อมทุก …\", \"ทุกคู่ต้องติดต่อกันได้ (ตรง ๆ หรือผ่านจุดอื่น)\", \"ค่าสายเคเบิล / ถนนรวมน้อยที่สุด\"\n- ต้องเลือกเส้น V − 1 เส้นพอดี และผลลัพธ์ต้องเชื่อมกันหมด\n- \"ผลรวม **มากที่สุด**\" ในรูปเดียวกัน: กลับการเปรียบเทียบทุกจุด อัลกอริทึมเดิมให้ maximum spanning tree\n\n## 4. ต้นทุนและจุดพลาด\n- กราฟหนาแน่นหรือสมบูรณ์ (E ≈ V²): **Prim แบบอาร์เรย์** O(V²) ไม่ต้องมีรายการเส้น\n- กราฟเบาบาง: Kruskal O(E log E) หรือ Prim แบบ heap O(E log V)\n- MST ไม่ใช่ต้นไม้เส้นทางสั้นสุด: มันทำให้ **ผลรวม** น้อยที่สุด ไม่ใช่ระยะจากปมเดียว\n- ผลรวมอาจเกิน `int`: ถึง (V − 1) × น้ำหนักสูงสุด\n- น้ำหนักที่คำนวณจากปม (เช่น x XOR y): คำนวณตอนใช้ แทนการเก็บ V² ค่า\n\n## 5. ในบทนี้\n- [บริษัทสายเคเบิล](#ex06e1_cable): MST แบบตำราบนกราฟสมบูรณ์ ด้วย Prim แบบอาร์เรย์\n- [ถนนสวย (XOR)](#a60a_q3_xor_road): maximum spanning tree ที่คำนวณน้ำหนักระหว่างทาง\n\n[Internet provider](#da68_f_internet_provider) ใน da68 final คือ MST ที่ตัดเส้นที่หนักที่สุด K − 1 เส้นออก"}}, {"id": "sp", "title": {"en": "Shortest paths", "th": "เส้นทางสั้นที่สุด (Shortest Path)"}, "sub": {"en": "Dijkstra, Bellman-Ford, Floyd-Warshall, and which one to pick", "th": "Dijkstra, Bellman-Ford, Floyd-Warshall และควรเลือกตัวไหน"}, "intro": {"en": "## 1. The idea\nA **shortest path** minimises the total weight of a route. Which algorithm to use depends on two questions: **how many sources** and **can weights be negative?**\n\n| situation | algorithm | cost |\n|---|---|---|\n| all weights equal | BFS (Graph 1) | O(V + E) |\n| one source, weights ≥ 0, dense graph | Dijkstra, array version | O(V²) |\n| one source, weights ≥ 0, sparse graph | Dijkstra with a heap | O(E log V) |\n| negative weights, or \"detect a negative cycle\" | Bellman–Ford | O(V · E) |\n| **all pairs**, V ≤ ~700 | Floyd–Warshall | O(V³) |\n\nAll of them repeat one step, **relaxation**: if going through u is better, take it.\n\n```text\ndist[v] > dist[u] + w(u, v)   →   dist[v] = dist[u] + w(u, v)\n```\n\n## 2. The templates\n```cpp\n// Dijkstra with a heap and lazy deletion\nvector<long long> dist(n, INF);\npriority_queue<pair<long long,int>, vector<pair<long long,int>>, greater<>> pq;\ndist[s] = 0; pq.push({0, s});\n// pop nodes in increasing order of distance\nwhile (!pq.empty()) {\n    auto [d, u] = pq.top(); pq.pop();\n    if (d > dist[u]) continue;                 // an outdated copy\n    // relax every edge u -> v\n    for (auto [v, w] : adj[u])\n        if (d + w < dist[v]) { dist[v] = d + w; pq.push({dist[v], v}); }\n}\n```\n\n```cpp\n// Bellman-Ford: n-1 rounds, then one more round to detect a negative cycle\ndist[s] = 0;\n// rounds 1 .. n-1: after round i, every shortest path with <= i edges is correct\nfor (int round = 1; round <= n - 1; round++)\n    for (auto [a, b, c] : edges)\n        if (dist[a] != INF && dist[a] + c < dist[b]) dist[b] = dist[a] + c;\nbool negCycle = false;\n// round n: any further improvement means a negative cycle\nfor (auto [a, b, c] : edges)\n    if (dist[a] != INF && dist[a] + c < dist[b]) negCycle = true;\n```\n\n```cpp\n// Floyd-Warshall: k MUST be the outermost loop\n// after phase k, d[a][b] uses only stop-overs from {0..k}\nfor (int k = 0; k < n; k++)\n    for (int a = 0; a < n; a++)\n        for (int b = 0; b < n; b++)\n            if (d[a][k] + d[k][b] < d[a][b]) d[a][b] = d[a][k] + d[k][b];\n```\n\n## 3. How to recognise it\n- \"Minimum cost / time / distance from … to …\" with different costs per step.\n- A cost on **cells or nodes** instead of edges: put it on every edge **into** that node.\n- Several starting points at once: push them all first (multi-source), or add a virtual source.\n- Products of rates (\"exchange\", \"probability\"): take −log and look for a negative cycle.\n- \"After each new node is added\": think of what Floyd–Warshall's phase k means.\n\n## 4. Cost and pitfalls\n- Dijkstra is **wrong** with negative edges, even without a negative cycle.\n- Use `long long` for distances, and a large INF such as 10¹⁸; never add to INF.\n- Unreachable nodes: decide what to print (−1? INF?) and test it.\n- Read the input format twice: matrices with −1 for \"no edge\", 1-based vs 0-based, edge counts that do not match the text.\n- Floyd–Warshall needs d[i][i] = 0 and the k loop outside.\n\n## 5. In this chapter\n- [Farthest city](#a61_q2_farthest): Dijkstra O(V²) on a matrix; the maximum of the distances.\n- [Columbia](#ex06e3_columbia): heap Dijkstra on a grid with costs on the cells.\n- [Hacking](#a58_q3_p3a_hacking): multi-source Dijkstra with vertex costs.\n- [Shortest path with negative edges](#ex06e2_shortest): Bellman–Ford and negative cycles anywhere.\n- [Shortest start](#a64_q3_shortest_start): Bellman–Ford from many starts at once, with an early stop.\n- [Exchange](#ex06m2_exchange): arbitrage as a negative cycle after −log.\n- [Expressway](#a65_q3a_expressway): reading an answer after every Floyd–Warshall phase.\n\nIn the final chapters, [Travelling tourist](#da67_f_travelling_tourist) runs Dijkstra from each site, and [Closed city](#da68_f2_closed_city) deletes closed nodes before Dijkstra.", "th": "## 1. ไอเดีย\n**เส้นทางสั้นสุด** ทำให้น้ำหนักรวมของเส้นทางน้อยที่สุด จะใช้อัลกอริทึมไหนขึ้นกับสองคำถาม: **มีจุดเริ่มกี่จุด** และ **น้ำหนักติดลบได้ไหม**\n\n| สถานการณ์ | อัลกอริทึม | ต้นทุน |\n|---|---|---|\n| น้ำหนักเท่ากันหมด | BFS (กราฟ 1) | O(V + E) |\n| จุดเริ่มเดียว น้ำหนัก ≥ 0 กราฟหนาแน่น | Dijkstra แบบอาร์เรย์ | O(V²) |\n| จุดเริ่มเดียว น้ำหนัก ≥ 0 กราฟเบาบาง | Dijkstra กับ heap | O(E log V) |\n| น้ำหนักติดลบ หรือ \"ตรวจวงวนติดลบ\" | Bellman–Ford | O(V · E) |\n| **ทุกคู่** V ≤ ~700 | Floyd–Warshall | O(V³) |\n\nทุกตัวทำซ้ำขั้นตอนเดียวคือ **relaxation**: ถ้าผ่าน u แล้วดีกว่า ก็ใช้ทางนั้น\n\n```text\ndist[v] > dist[u] + w(u, v)   →   dist[v] = dist[u] + w(u, v)\n```\n\n## 2. โครงโค้ด\n```cpp\n// Dijkstra with a heap and lazy deletion\nvector<long long> dist(n, INF);\npriority_queue<pair<long long,int>, vector<pair<long long,int>>, greater<>> pq;\ndist[s] = 0; pq.push({0, s});\n// pop nodes in increasing order of distance\nwhile (!pq.empty()) {\n    auto [d, u] = pq.top(); pq.pop();\n    if (d > dist[u]) continue;                 // an outdated copy\n    // relax every edge u -> v\n    for (auto [v, w] : adj[u])\n        if (d + w < dist[v]) { dist[v] = d + w; pq.push({dist[v], v}); }\n}\n```\n\n```cpp\n// Bellman-Ford: n-1 rounds, then one more round to detect a negative cycle\ndist[s] = 0;\n// rounds 1 .. n-1: after round i, every shortest path with <= i edges is correct\nfor (int round = 1; round <= n - 1; round++)\n    for (auto [a, b, c] : edges)\n        if (dist[a] != INF && dist[a] + c < dist[b]) dist[b] = dist[a] + c;\nbool negCycle = false;\n// round n: any further improvement means a negative cycle\nfor (auto [a, b, c] : edges)\n    if (dist[a] != INF && dist[a] + c < dist[b]) negCycle = true;\n```\n\n```cpp\n// Floyd-Warshall: k MUST be the outermost loop\n// after phase k, d[a][b] uses only stop-overs from {0..k}\nfor (int k = 0; k < n; k++)\n    for (int a = 0; a < n; a++)\n        for (int b = 0; b < n; b++)\n            if (d[a][k] + d[k][b] < d[a][b]) d[a][b] = d[a][k] + d[k][b];\n```\n\n## 3. ดูอย่างไรว่าใช่\n- \"ค่าใช้จ่าย / เวลา / ระยะทางน้อยที่สุดจาก … ไป …\" โดยแต่ละก้าวราคาไม่เท่ากัน\n- ค่าอยู่บน **ช่องหรือปม** แทนที่จะอยู่บนเส้น: ใส่ค่านั้นบนทุกเส้นที่ **เข้า** ปมนั้น\n- มีจุดเริ่มหลายจุดพร้อมกัน: ใส่ทั้งหมดก่อน (multi-source) หรือเพิ่มจุดเริ่มเสมือน\n- ผลคูณของอัตรา (\"แลกเงิน\", \"ความน่าจะเป็น\"): ใส่ −log แล้วหาวงวนติดลบ\n- \"หลังเพิ่มปมใหม่ทุกครั้ง\": คิดถึงความหมายของเฟส k ใน Floyd–Warshall\n\n## 4. ต้นทุนและจุดพลาด\n- Dijkstra **ผิด** เมื่อมีเส้นติดลบ แม้ไม่มีวงวนติดลบ\n- ใช้ `long long` สำหรับระยะ และ INF ใหญ่ ๆ เช่น 10¹⁸ อย่าบวกอะไรเข้ากับ INF\n- ปมที่ไปไม่ถึง: ตัดสินใจว่าจะพิมพ์อะไร (−1? INF?) แล้วทดสอบมัน\n- อ่านรูปแบบ input สองรอบ: เมทริกซ์ที่ใช้ −1 แทน \"ไม่มีเส้น\", เริ่มที่ 1 หรือ 0, จำนวนเส้นที่ไม่ตรงกับคำบรรยาย\n- Floyd–Warshall ต้องมี d[i][i] = 0 และลูป k อยู่นอกสุด\n\n## 5. ในบทนี้\n- [Farthest city](#a61_q2_farthest): Dijkstra O(V²) บนเมทริกซ์ แล้วหาค่ามากสุดของระยะ\n- [Columbia](#ex06e3_columbia): Dijkstra แบบ heap บนตารางที่ค่าอยู่บนช่อง\n- [Hacking](#a58_q3_p3a_hacking): Dijkstra หลายจุดเริ่มที่ค่าอยู่บนปม\n- [Shortest path with negative edges](#ex06e2_shortest): Bellman–Ford และวงวนติดลบที่ใดก็ได้\n- [Shortest start](#a64_q3_shortest_start): Bellman–Ford จากหลายจุดเริ่มพร้อมกัน และหยุดก่อนเมื่อไม่มีอะไรเปลี่ยน\n- [Exchange](#ex06m2_exchange): การค้ากำไรเป็นวงวนติดลบหลังใส่ −log\n- [Expressway](#a65_q3a_expressway): อ่านคำตอบหลังทุกเฟสของ Floyd–Warshall\n\nในบทข้อสอบปลายภาค [Travelling tourist](#da67_f_travelling_tourist) รัน Dijkstra จากทุกสถานที่ และ [Closed city](#da68_f2_closed_city) ลบเมืองปิดออกก่อน Dijkstra"}}, {"id": "final", "title": {"en": "Final preparation (da66 final exam)", "th": "เตรียมสอบปลายภาค (ข้อสอบ da66 final)"}, "sub": {"en": "the six da66_f problems: mixed techniques, exam conditions", "th": "โจทย์ da66_f ทั้ง 6 ข้อ: เทคนิคผสมกัน สภาพเหมือนวันสอบ"}, "intro": {"en": "## 1. How to use this chapter\nThese are the six problems of the **da66 final exam**. Unlike the earlier chapters, the technique is **not** given by the chapter title, which is exactly the situation in the exam room. Before reading a solution, try this routine on each problem:\n\n1. **Read the limits first.** They tell you the allowed complexity (see the table below).\n2. **Name the objects.** Cells? Airports? Sequences? Is it a graph, a table to fill, or a list to enumerate?\n3. **Name the question type.** \"All …\" → enumeration. \"How many ways\" → counting DP. \"Fewest / cheapest\" → BFS or Dijkstra. \"Connected?\" → DFS or union-find.\n4. **Write the state or the graph on paper**, then the cost estimate, then code.\n5. **Test the samples and an edge case** (n = 1, nothing reachable, the largest input) before you submit.\n\n| n is about … | you can afford … | typical tools |\n|---|---|---|\n| 10–12 | O(n!) | permutations, backtracking |\n| 20–25 | O(2ⁿ · n) | subsets, bit masks |\n| 500–700 | O(n³) | Floyd–Warshall, 3 nested loops |\n| 2,000–5,000 | O(n²) | dense Dijkstra / Prim, 2-D DP |\n| 10⁵–10⁶ | O(n log n) | sort, heap, binary search |\n| 10⁷ and more | O(n), small constant | one BFS pass, fast input, 1 byte per cell |\n\n## 2. Map of this chapter\n| problem | what it really is | technique from |\n|---|---|---|\n| [Linear recurrence](#da66_f1_linear_recurrence) | fill a 1-D table | [DP](#ch-dp) |\n| [Map walk](#da66_f1_map_walk) | list every path in alphabetical order | [Brute force](#ch-brute) |\n| [Buffet flight](#da66_f1_buffet_flight) | vertex fees turned into edge weights | [Shortest paths](#ch-sp) |\n| [Sea bridge](#da66_f1_sea_bridge) | shortest path between two regions | [Graph 1](#ch-graph1) |\n| [Grid loop](#da66_f2_grid_loop) | cycles in a degree-≤2 graph | [Graph 1](#ch-graph1) |\n| [New Game Plus](#da66_f2_new_game_plus) | path counting with \"last move\" in the state | [DP](#ch-dp) |\n\n## 3. Exam habits that save points\n- **Fast input** whenever the input has more than about 10⁶ numbers: Buffet flight and Sea bridge cannot pass without it, and Grid loop reads a million numbers too.\n- **Memory:** count bytes for big grids (25 million cells × 4 bytes = 100 MB).\n- **Mod** after every addition and multiplication in counting problems.\n- **No deep recursion** on inputs with 10⁵+ steps: iterate instead.\n- Statements have **mistakes** (swapped labels, wrong line counts). When the text and the samples disagree, trust the samples, and read the warnings on each page here.\n\nAfter this paper, practise on the next two exams: the [da67 final](#ch-final67) and the [da68 final](#ch-final68).", "th": "## 1. วิธีใช้บทนี้\nนี่คือโจทย์ทั้งหกข้อของ **ข้อสอบปลายภาค da66** ต่างจากบทก่อน ๆ เพราะ **ไม่มี** ชื่อบทบอกเทคนิค ซึ่งก็คือสถานการณ์จริงในห้องสอบ ก่อนอ่านเฉลย ลองทำตามขั้นตอนนี้กับทุกข้อ:\n\n1. **อ่านขอบเขตก่อน** มันบอกความซับซ้อนที่ยอมรับได้ (ดูตารางข้างล่าง)\n2. **ตั้งชื่อสิ่งของ** ช่อง? สนามบิน? ลำดับ? เป็นกราฟ ตารางที่ต้องเติม หรือรายการที่ต้องแจกแจง\n3. **ตั้งชื่อประเภทคำถาม** \"ทุก …\" → แจกแจง \"มีกี่วิธี\" → DP นับจำนวน \"น้อยที่สุด / ถูกที่สุด\" → BFS หรือ Dijkstra \"เชื่อมกันไหม\" → DFS หรือ union-find\n4. **เขียน state หรือกราฟลงกระดาษ** แล้วประเมินต้นทุน แล้วค่อยเขียนโค้ด\n5. **ทดสอบตัวอย่างและกรณีขอบ** (n = 1, ไปไม่ถึงเลย, input ใหญ่สุด) ก่อนส่ง\n\n| n ประมาณ … | ทำได้ถึง … | เครื่องมือที่มักใช้ |\n|---|---|---|\n| 10–12 | O(n!) | permutation, backtracking |\n| 20–25 | O(2ⁿ · n) | เซตย่อย, bit mask |\n| 500–700 | O(n³) | Floyd–Warshall, ลูปซ้อน 3 ชั้น |\n| 2,000–5,000 | O(n²) | Dijkstra / Prim แบบหนาแน่น, DP 2 มิติ |\n| 10⁵–10⁶ | O(n log n) | sort, heap, binary search |\n| 10⁷ ขึ้นไป | O(n) ค่าคงที่เล็ก | BFS รอบเดียว, input เร็ว, 1 ไบต์ต่อช่อง |\n\n## 2. แผนที่ของบทนี้\n| โจทย์ | จริง ๆ แล้วคืออะไร | เทคนิคจากบท |\n|---|---|---|\n| [Linear recurrence](#da66_f1_linear_recurrence) | เติมตาราง 1 มิติ | [DP](#ch-dp) |\n| [Map walk](#da66_f1_map_walk) | แจกแจงทุกเส้นทางตามลำดับตัวอักษร | [Brute force](#ch-brute) |\n| [Buffet flight](#da66_f1_buffet_flight) | เปลี่ยนค่าบนปมเป็นน้ำหนักเส้น | [เส้นทางสั้นสุด](#ch-sp) |\n| [Sea bridge](#da66_f1_sea_bridge) | เส้นทางสั้นสุดระหว่างสองพื้นที่ | [กราฟ 1](#ch-graph1) |\n| [Grid loop](#da66_f2_grid_loop) | วงวนในกราฟที่ดีกรี ≤ 2 | [กราฟ 1](#ch-graph1) |\n| [New Game Plus](#da66_f2_new_game_plus) | นับเส้นทางโดยใส่ \"ท่าล่าสุด\" ใน state | [DP](#ch-dp) |\n\n## 3. นิสัยในห้องสอบที่ช่วยเก็บคะแนน\n- **input เร็ว** เมื่อ input มีตัวเลขเกินราว 10⁶ ตัว: Buffet flight กับ Sea bridge ผ่านไม่ได้ถ้าไม่มี และ Grid loop ก็อ่านตัวเลขเป็นล้านตัว\n- **หน่วยความจำ:** นับไบต์สำหรับตารางใหญ่ (25 ล้านช่อง × 4 ไบต์ = 100 MB)\n- **mod** หลังทุกการบวกและคูณในโจทย์นับจำนวน\n- **ไม่ใช้ recursion ลึก** กับ input ที่มีขั้นตอน 10⁵ ขึ้นไป: ใช้ลูปแทน\n- โจทย์มี **ข้อผิดพลาด** (ป้ายสลับกัน, จำนวนบรรทัดผิด) เมื่อข้อความกับตัวอย่างขัดกัน ให้เชื่อตัวอย่าง และอ่านคำเตือนในแต่ละหน้าของหนังสือนี้\n\nเมื่อทำชุดนี้เสร็จแล้ว ให้ฝึกต่อกับข้อสอบอีกสองชุด: [da67 final](#ch-final67) และ [da68 final](#ch-final68)"}}, {"id": "final67", "title": {"en": "Final preparation (da67 final exam)", "th": "เตรียมสอบปลายภาค (ข้อสอบ da67 final)"}, "sub": {"en": "the four da67_f problems: one textbook technique each, in a light story", "th": "โจทย์ da67_f ทั้ง 4 ข้อ: ข้อละหนึ่งเทคนิคตามตำราในเรื่องเล่าบาง ๆ"}, "intro": {"en": "## 1. How to use this chapter\nThese are the four problems of the **da67 final exam**. As in the [da66 final](#ch-final), the chapter title does not tell you the technique. Use the same routine: read the limits, name the objects, name the question type, write the state or graph on paper, then code and test the samples plus one edge case.\n\nThe four problems cover four different chapters, and each one is a textbook technique in a light story. The skill being tested is **recognition**: once you see what the problem really is, each solution is 30–60 lines.\n\n## 2. Map of this chapter\n| problem | the signal in the statement | what it really is | technique from |\n|---|---|---|---|\n| [ABC permutation](#da67_f_abc_permutation) | \"print all … in dictionary order\", N ≤ 12 | strings with at most i A's, j B's, k C's | [Brute force](#ch-brute) |\n| [Border extend](#da67_f_border_extend) | \"distance to the nearest land\", grid 1000 × 1000 | multi-source BFS limited to k layers | [Graph 1](#ch-graph1) |\n| [One two apart](#da67_f_one_two_apart) | \"how many arrays … mod\", n ≤ 10⁶ | counting DP, state = last two cells | [DP](#ch-dp) |\n| [Travelling tourist](#da67_f_travelling_tourist) | \"visit all k sites\", k ≤ 8, n ≤ 500 | k Dijkstra runs + bit-mask TSP | [Shortest paths](#ch-sp) |\n\n## 3. Exam habits for this paper\n- **Read the samples before the story.** ABC permutation says \"permutation\" but the samples show the counts are upper limits.\n- **Check the modulus digit by digit.** One two apart uses 100,000,007, not 1,000,000,007.\n- **Small numbers are the hint.** k ≤ 8 sites (Travelling tourist) means \"try all orders\" is affordable after the shortest paths are known.\n- **Big output needs a buffer.** ABC permutation can print half a million lines and Border extend a million numbers: build a string or use `'\\n'` with sync turned off.", "th": "## 1. วิธีใช้บทนี้\nนี่คือโจทย์ทั้งสี่ข้อของ **ข้อสอบปลายภาค da67** เหมือนบท [da66 final](#ch-final) ชื่อบทไม่ได้บอกเทคนิค ให้ใช้ขั้นตอนเดิม: อ่านขอบเขต ตั้งชื่อสิ่งของ ตั้งชื่อประเภทคำถาม เขียน state หรือกราฟลงกระดาษ แล้วค่อยเขียนโค้ดและทดสอบตัวอย่างพร้อมกรณีขอบหนึ่งกรณี\n\nโจทย์ทั้งสี่ข้อมาจากสี่บทที่ต่างกัน และแต่ละข้อเป็นเทคนิคตามตำราที่ห่อด้วยเรื่องเล่าบาง ๆ ทักษะที่ข้อสอบวัดคือ **การมองออก**: เมื่อเห็นว่าโจทย์จริง ๆ คืออะไร เฉลยแต่ละข้อยาวแค่ 30–60 บรรทัด\n\n## 2. แผนที่ของบทนี้\n| โจทย์ | สัญญาณในโจทย์ | จริง ๆ แล้วคืออะไร | เทคนิคจากบท |\n|---|---|---|---|\n| [ABC permutation](#da67_f_abc_permutation) | \"พิมพ์ทุก … ตามลำดับพจนานุกรม\", N ≤ 12 | สตริงที่มี A ไม่เกิน i, B ไม่เกิน j, C ไม่เกิน k ตัว | [Brute force](#ch-brute) |\n| [Border extend](#da67_f_border_extend) | \"ระยะไปยังดินที่ใกล้ที่สุด\", ตาราง 1000 × 1000 | BFS หลายจุดเริ่มที่จำกัด k ชั้น | [กราฟ 1](#ch-graph1) |\n| [One two apart](#da67_f_one_two_apart) | \"มีกี่อาเรย์ … mod\", n ≤ 10⁶ | DP นับจำนวน state = สองช่องสุดท้าย | [DP](#ch-dp) |\n| [Travelling tourist](#da67_f_travelling_tourist) | \"เที่ยวครบ k แห่ง\", k ≤ 8, n ≤ 500 | Dijkstra k ครั้ง + TSP แบบ bit-mask | [เส้นทางสั้นสุด](#ch-sp) |\n\n## 3. นิสัยในห้องสอบสำหรับชุดนี้\n- **อ่านตัวอย่างก่อนเรื่องเล่า** ABC permutation บอกว่า \"permutation\" แต่ตัวอย่างแสดงว่าจำนวนตัวอักษรเป็นแค่ขอบบน\n- **เช็กตัว mod ทีละหลัก** One two apart ใช้ 100,000,007 ไม่ใช่ 1,000,000,007\n- **ตัวเลขเล็กคือคำใบ้** สถานที่ k ≤ 8 แห่ง (Travelling tourist) แปลว่า \"ลองทุกลำดับ\" ทำได้ หลังรู้เส้นทางสั้นสุดแล้ว\n- **output ใหญ่ต้องมี buffer** ABC permutation พิมพ์ได้ถึงครึ่งล้านบรรทัด และ Border extend พิมพ์ตัวเลขเป็นล้านตัว: สร้าง string หรือใช้ `'\\n'` และปิด sync"}}, {"id": "final68", "title": {"en": "Final preparation (da68 final exam)", "th": "เตรียมสอบปลายภาค (ข้อสอบ da68 final)"}, "sub": {"en": "the nine da68_f and da68_f2 problems: standard techniques with one twist", "th": "โจทย์ da68_f และ da68_f2 ทั้ง 9 ข้อ: เทคนิคมาตรฐานที่บิดหนึ่งจุด"}, "intro": {"en": "## 1. How to use this chapter\nThese are the nine problems of the **da68 final exam**, from its two papers: five `da68_f` problems and four `da68_f2` problems. Treat each one as in the exam room: no chapter title to tell you the technique. The routine from the [da66 final](#ch-final) still applies: limits first, then objects, question type, state or graph on paper, cost, code, samples and an edge case.\n\nMost problems here are a standard technique with **one twist**: knapsack turned around (exact weight, minimum price), MST plus free modems, BFS where any valid answer is accepted, a merge sort with a counter. Spotting the twist is the whole difficulty.\n\n## 2. Map of this chapter\n| problem | the signal in the statement | what it really is | technique from |\n|---|---|---|---|\n| [ABCD permutation](#da68_f_abcd_permutation) | \"print all … in dictionary order\", N ≤ 9 | last year's ABC with a fourth letter | [Brute force](#ch-brute) |\n| [Hidden palindrome](#da68_f_hidden_palindrome) | \"choose some, keep the order, palindrome\", N ≤ 3000 | longest palindromic subsequence, O(N²) | [DP](#ch-dp) |\n| [K connected city](#da68_f_k_connected_city) | \"any K cities, connected\", any answer accepted | the first K cities of a BFS | [Graph 1](#ch-graph1) |\n| [Internet provider](#da68_f_internet_provider) | \"connect all cities\", K free modems | MST minus its K − 1 heaviest edges | [MST](#ch-mst) |\n| [Game of trade](#da68_f_game_of_trades) | \"at most K units\", independent prices | best and second-best buyer, take the K best units | [Greedy](#ch-greedy) |\n| [0-1 subset sum](#da68_f2_zero_one_subset_sum) | \"how many ways\", N ≤ 15, S ≤ 150 | dice-sum counting DP over the number of 1s | [DP](#ch-dp) |\n| [Remaining merge](#da68_f2_remaining_merge) | \"how many times lines 11 and 14 run\" | run the given merge sort and count | [Sorting](#ch-sort) |\n| [Closed city](#da68_f2_closed_city) | \"shortest path that avoids K cities\" | delete the closed cities, then Dijkstra | [Shortest paths](#ch-sp) |\n| [SackKnap](#da68_f2_sackknap) | \"weight exactly V, smallest price\", n, V ≤ 10⁴ | 0/1 knapsack with min and INF start | [DP](#ch-dp) |\n\n## 3. Exam habits for this paper\n- **Know the knapsack family by heart:** \"at most W, max\", \"exactly V, min\", \"how many ways\". They differ only in the starting row and in max / min / +. SackKnap and 0-1 subset sum test exactly that.\n- **\"Any valid answer\" problems** (K connected city) are checked by a special judge. Prove your construction is valid instead of trying to match the sample output.\n- **Count bytes and overflow:** Game of trade reads 3 million numbers and its profit reaches 10¹²; SackKnap's prices reach 10¹³.\n- **Implement given pseudocode exactly** (Remaining merge): the tie rule `≤` changes the answer.\n- **Statements with unknown limits** (Closed city) deserve `long long` and an O((N + M) log N) algorithm by default.", "th": "## 1. วิธีใช้บทนี้\nนี่คือโจทย์ทั้งเก้าข้อของ **ข้อสอบปลายภาค da68** จากสองชุด: `da68_f` ห้าข้อและ `da68_f2` สี่ข้อ ให้ทำแต่ละข้อเหมือนอยู่ในห้องสอบ ไม่มีชื่อบทบอกเทคนิค ขั้นตอนจากบท [da66 final](#ch-final) ยังใช้ได้: ขอบเขตก่อน แล้วสิ่งของ ประเภทคำถาม state หรือกราฟบนกระดาษ ต้นทุน โค้ด ตัวอย่าง และกรณีขอบ\n\nโจทย์ส่วนใหญ่ในชุดนี้เป็นเทคนิคมาตรฐานที่ **บิดหนึ่งจุด**: knapsack กลับด้าน (น้ำหนักพอดี ราคาน้อยสุด), MST บวก Modem ฟรี, BFS ที่รับคำตอบใดก็ได้, merge sort ที่มีตัวนับ การมองเห็นจุดที่บิดคือความยากทั้งหมด\n\n## 2. แผนที่ของบทนี้\n| โจทย์ | สัญญาณในโจทย์ | จริง ๆ แล้วคืออะไร | เทคนิคจากบท |\n|---|---|---|---|\n| [ABCD permutation](#da68_f_abcd_permutation) | \"พิมพ์ทุก … ตามลำดับพจนานุกรม\", N ≤ 9 | ABC ของปีที่แล้วที่เพิ่มตัวอักษรที่สี่ | [Brute force](#ch-brute) |\n| [Hidden palindrome](#da68_f_hidden_palindrome) | \"เลือกบางตัว คงลำดับ เป็นพาลินโดรม\", N ≤ 3000 | ลำดับย่อยพาลินโดรมยาวที่สุด O(N²) | [DP](#ch-dp) |\n| [K connected city](#da68_f_k_connected_city) | \"K เมืองใดก็ได้ที่เชื่อมกัน\", รับคำตอบใดก็ได้ | K เมืองแรกของ BFS | [กราฟ 1](#ch-graph1) |\n| [Internet provider](#da68_f_internet_provider) | \"เชื่อมทุกเมือง\", Modem ฟรี K เครื่อง | MST ลบเส้นที่หนักที่สุด K − 1 เส้น | [MST](#ch-mst) |\n| [Game of trade](#da68_f_game_of_trades) | \"ไม่เกิน K ชิ้น\", ราคาเป็นอิสระต่อกัน | ผู้ซื้ออันดับหนึ่งและสอง แล้วหยิบ K ชิ้นที่ดีที่สุด | [Greedy](#ch-greedy) |\n| [0-1 subset sum](#da68_f2_zero_one_subset_sum) | \"มีกี่วิธี\", N ≤ 15, S ≤ 150 | DP นับผลรวมลูกเต๋าตามจำนวนเลข 1 | [DP](#ch-dp) |\n| [Remaining merge](#da68_f2_remaining_merge) | \"บรรทัด 11 และ 14 ทำงานกี่ครั้ง\" | รัน merge sort ที่ให้มาแล้วนับ | [การเรียงลำดับ](#ch-sort) |\n| [Closed city](#da68_f2_closed_city) | \"เส้นทางสั้นสุดที่ไม่ผ่าน K เมือง\" | ลบเมืองปิดออก แล้ว Dijkstra | [เส้นทางสั้นสุด](#ch-sp) |\n| [SackKnap](#da68_f2_sackknap) | \"น้ำหนักพอดี V ราคาน้อยสุด\", n, V ≤ 10⁴ | 0/1 knapsack ใช้ min และเริ่มที่ INF | [DP](#ch-dp) |\n\n## 3. นิสัยในห้องสอบสำหรับชุดนี้\n- **จำตระกูล knapsack ให้ขึ้นใจ:** \"ไม่เกิน W, มากสุด\", \"พอดี V, น้อยสุด\", \"มีกี่วิธี\" ต่างกันแค่แถวเริ่มต้นและ max / min / + ข้อ SackKnap และ 0-1 subset sum ทดสอบเรื่องนี้ตรง ๆ\n- **โจทย์ \"คำตอบที่ถูกแบบใดก็ได้\"** (K connected city) ตรวจด้วย special judge ให้พิสูจน์ว่าวิธีสร้างของเราถูก แทนที่จะพยายามให้ตรงกับ output ตัวอย่าง\n- **นับไบต์และระวังล้น:** Game of trade อ่านตัวเลข 3 ล้านตัวและกำไรถึง 10¹² ส่วนราคาใน SackKnap ถึง 10¹³\n- **เขียนตาม pseudocode ที่ให้มาให้ตรงเป๊ะ** (Remaining merge): กฎเท่ากัน `≤` เปลี่ยนคำตอบได้\n- **โจทย์ที่ไม่บอกขอบเขต** (Closed city) ควรใช้ `long long` และอัลกอริทึม O((N + M) log N) ไว้ก่อน"}}], "problems": [{"id": "ex00e4", "group": "brute", "lesson": "11 · Recursion & backtracking", "stars": 1, "complexity": "O(C(B, A) · B)", "kind": "program", "tags": ["combinations", "backtracking", "pruning"], "title": {"en": "Generate Barcode", "th": "สร้างบาร์โค้ด (Generate Barcode)"}, "blurb": {"en": "Print every length-B binary string with exactly A ones: choose each character recursively and prune branches that can no longer finish.", "th": "พิมพ์สตริงไบนารียาว B ทุกแบบที่มีเลข 1 พอดี A ตัว: เลือกทีละตัวอักษรแบบเวียนเกิด และตัดกิ่งที่ไม่มีทางจบได้"}, "tests": {"en": "all 4 PDF samples plus A = 0, A = B, B = 0 and larger cases, compared (sorted, since any order is accepted) with Python itertools.combinations, and checked for duplicates; the line count equals C(20, A) for every A = 0..20; the largest case C(20,10) = 184,756 lines in 0.01 s.", "th": "ตัวอย่างทั้ง 4 ชุดใน PDF และกรณี A = 0, A = B, B = 0 และกรณีใหญ่ขึ้น เทียบ (หลัง sort เพราะลำดับใดก็ได้) กับ itertools.combinations ของ Python และเช็กว่าไม่มีบรรทัดซ้ำ; จำนวนบรรทัดเท่ากับ C(20, A) ทุก A = 0..20; กรณีใหญ่สุด C(20,10) = 184,756 บรรทัดใช้ 0.01 วินาที"}, "files": [{"name": "main.cpp", "src": "#include <iostream>\n#include <string>\nusing namespace std;\n\nint A, B;\nstring cur;      // the barcode being built, one character per level of recursion\nstring out;      // all answers, printed once at the end (fast output)\n\n// pos  = how many characters are already decided (cur[0 .. pos-1])\n// ones = how many of them are '1'\nvoid gen(int pos, int ones) {\n    if (pos == B) {                       // all B characters chosen\n        out += cur;                       // ones == A is guaranteed by the pruning below\n        out += '\\n';\n        return;\n    }\n    int left = B - pos;                   // characters still to choose\n    int needOnes = A - ones;              // '1's still to place\n    // put '0' here only if the remaining left-1 places can still hold all needed '1's\n    if (needOnes <= left - 1) {\n        cur[pos] = '0';\n        gen(pos + 1, ones);\n    }\n    // put '1' here only if we still need a '1'\n    if (needOnes > 0) {\n        cur[pos] = '1';\n        gen(pos + 1, ones + 1);\n    }\n}\n\nint main() {\n    ios_base::sync_with_stdio(false); cin.tie(0);\n    cin >> A >> B;\n    cur.assign(B, '0');\n    gen(0, 0);\n    cout << out;\n}\n"}], "body": {"en": "## 1. What the problem says\nA barcode is a string of `0` (black bar) and `1` (white bar). An \"interleaved A of B\" barcode has **B bars, exactly A of them white**. Given A and B (0 ≤ A ≤ B ≤ 20), print **all** such barcodes, one per line: exactly C(B, A) distinct lines, **in any order**.\n\nSamples: `2 5` → the 10 strings of length 5 with two 1s; `1 3` → 001, 100, 010; `0 2` → 00.\n\n## 2. What it really means\nChoose **which A positions out of B** get a `1`, i.e. list all combinations. Picture it as a binary decision tree: at each position decide 0 or 1.\n\n```text\nA = 1, B = 3                       \"???\"   need one 1\n                             0 /           \\ 1\n                         \"0??\"               \"1??\"   need no more 1s\n                       0 /     \\ 1            0 |     (1 not allowed)\n                   \"00?\"       \"01?\"          \"10?\"\n                 0 ✗   \\ 1       0 |            0 |\n          (no room       001     010            100\n           for the 1)\n```\n\nThe branch marked ✗ is cut: a `0` there would leave too few places for the remaining `1`s.\n\n:::hint Hint 1\nBuild the barcode one bar at a time, left to right. At each position, what are the two choices, and when is each one impossible?\n:::\n:::hin
