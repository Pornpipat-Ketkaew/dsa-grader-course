 return mData[(mFront + k) % mCap];\n}\n\n#endif\n"}], "body": {"en": "## 1. What the problem says\nOverride `operator[](int k)` for CP::queue: return the element at **position k** (front = 0, …, back = n−1). **Negative k** counts from the back: −1 = back, −2 = the one before it, …, −n = front.\n\n- Must not change the queue (no push/pop, no member changes).\n- Commands: `a x` push, `d` pop, `k idx` print \"Data at idx is …\", `p` print, `q` quit. 50% of tests use only k ≥ 0.\n\n## 2. What it really means\nTwo conversions, like Python's `list[k]` on a circular buffer:\n\n```text\nqueue (front→back):  10 20 30 40 50        n = 5\nk:                    0  1  2  3  4\nnegative k:          -5 -4 -3 -2 -1        position = n + k\nphysical slot = (mFront + position) % mCap\n```\n\n## 3. What, why, how\n1. If k < 0, `k = n + k` (−1 → n−1, −n → 0).\n2. Return `mData[(mFront + k) % mCap]`. O(1).\n\n## 4. Solution\n{{code}}\n{{tests}}\n\n**Trace of sample 2** after two pops (mCap = 8, mFront = 2, queue 30 40 50):\n\n| k | position | slot (2 + pos) % 8 | value |\n|---|---|---|---|\n| 0 | 0 | 2 | 30 |\n| 1 | 1 | 3 | 40 |\n| −1 | 3 + (−1) = 2 | 4 | 50 |\n\n## 5. Traps\n- **`(mFront + k) % mCap` with negative k:** with mFront = 2, k = −1 gives slot 1 — the slot **before the front**, which is garbage. In C++ `%` of a negative number is negative too, so it can even become an invalid index. Always convert to a non-negative position first.\n- **Forgetting mFront** (`mData[k]`) fails after any pop.\n- **`% mSize`** instead of `% mCap`.\n\n## 6. Background\nLesson 04: logical ↔ physical index in a circular array. Negative indices from the back are Python's convention; here they're just `n + k`. C++'s `%` keeps the sign of the left operand — a classic source of bugs.", "th": "## 1. โจทย์บอกอะไร\noverride `operator[](int k)` ให้ CP::queue: คืนข้อมูลที่ **ตำแหน่ง k** (หัวคิว = 0, …, ท้ายคิว = n−1) ถ้า **k ติดลบ** ให้นับจากท้าย: −1 = ท้ายคิว, −2 = ตัวก่อนท้าย, …, −n = หัวคิว\n\n- ห้ามเปลี่ยนคิว (ห้าม push/pop ห้ามแก้ member)\n- คำสั่ง: `a x` push, `d` pop, `k idx` พิมพ์ \"Data at idx is …\", `p` พิมพ์, `q` จบ ชุดทดสอบ 50% ใช้แค่ k ≥ 0\n\n## 2. จริง ๆ แล้วถามอะไร\nแปลงสองขั้น เหมือน `list[k]` ของ Python บนบัฟเฟอร์วงกลม:\n\n```text\nqueue (front→back):  10 20 30 40 50        n = 5\nk:                    0  1  2  3  4\nnegative k:          -5 -4 -3 -2 -1        position = n + k\nphysical slot = (mFront + position) % mCap\n```\n\n## 3. อะไร ทำไม อย่างไร\n1. ถ้า k < 0 ให้ `k = n + k` (−1 → n−1, −n → 0)\n2. คืน `mData[(mFront + k) % mCap]` เวลา O(1)\n\n## 4. โค้ดเฉลย\n{{code}}\n{{tests}}\n\n**ไล่ตัวอย่างที่ 2** หลัง pop สองครั้ง (mCap = 8, mFront = 2, คิว 30 40 50):\n\n| k | ตำแหน่ง | ช่องจริง (2 + pos) % 8 | ค่า |\n|---|---|---|---|\n| 0 | 0 | 2 | 30 |\n| 1 | 1 | 3 | 40 |\n| −1 | 3 + (−1) = 2 | 4 | 50 |\n\n## 5. จุดที่มักพลาด\n- **ใช้ `(mFront + k) % mCap` ตรง ๆ กับ k ติดลบ:** ถ้า mFront = 2, k = −1 จะได้ช่อง 1 — ช่อง **ก่อนหัวคิว** ซึ่งเป็นขยะ และใน C++ `%` ของเลขลบก็ได้เลขลบ อาจกลายเป็น index ที่ใช้ไม่ได้ ต้องแปลงเป็นตำแหน่งที่ไม่ติดลบก่อนเสมอ\n- **ลืม mFront** (`mData[k]`) ผิดทันทีหลัง pop\n- **ใช้ `% mSize`** แทน `% mCap`\n\n```text\nผิด:  k = -1, mFront = 2 → ช่อง 1  ✗ (อยู่ก่อนหัวคิว)\nถูก:  pos = 3 + (-1) = 2 → ช่อง (2 + 2) % 8 = 4  ✓ (= 50)\n```\n\n## 6. ความรู้พื้นฐาน\nบทที่ 04: แปลง index ตามความหมาย ↔ ช่องจริงในอาร์เรย์วงกลม index ติดลบนับจากท้ายเป็นธรรมเนียมของ Python ในข้อนี้แค่ `n + k` ส่วน `%` ของ C++ ให้ผลมีเครื่องหมายตามตัวตั้ง — ต้นเหตุบั๊กคลาสสิก"}}, {"id": "d64_q3b_queue_reverse", "group": "stackqueue", "lesson": "04 · Queue (circular array)", "stars": 1, "kind": "student.h", "tags": ["CP::queue", "two pointers", "circular index"], "title": {"en": "Queue Reverse", "th": "กลับลำดับช่วงในคิว (Queue Reverse)"}, "blurb": {"en": "Reverse positions a..b of a circular queue — the usual two-pointer swap, but every position goes through (mFront + i) % mCap.", "th": "กลับลำดับตำแหน่ง a..b ในคิววงกลม — สลับด้วยพอยน์เตอร์สองตัวตามปกติ แต่ทุกตำแหน่งต้องผ่าน (mFront + i) % mCap"}, "tests": {"en": "the PDF example via the starter main; a harness that pushes and pops dummies first so mFront ≠ 0 and data wraps; 300 random cases against Python slicing. ASan + UBSan clean.", "th": "ตัวอย่างใน PDF ผ่าน main เริ่มต้น; โปรแกรมทดสอบที่ push/pop ข้อมูลหลอกก่อนเพื่อให้ mFront ≠ 0 และข้อมูลวนรอบ; สุ่ม 300 ชุดเทียบกับการ slice ใน Python ไม่พบข้อผิดพลาดจาก ASan + UBSan"}, "files": [{"name": "student.h", "src": "#ifndef __STUDENT_H_\n#define __STUDENT_H_\n\n#include <algorithm>\n\ntemplate <typename T>\nvoid CP::queue<T>::reverse(int a,int b) {\n  int left  = a;     // logical index from the front: 0 = the front of the queue\n  int right = b;\n\n  // Two pointers walking toward each other:\n  // left visits a, a+1, a+2, ...   right visits b, b-1, b-2, ...\n  // stop when they meet (odd length: the middle element stays) or cross (even length).\n  while (left < right) {\n    // logical index i lives at physical slot (mFront + i) % mCap  (the array is circular)\n    int pl = (mFront + left)  % mCap;\n    int pr = (mFront + right) % mCap;\n    std::swap(mData[pl], mData[pr]);\n    left++;\n    right--;\n  }\n}\n\n#endif\n"}], "body": {"en": "## 1. What the problem says\nAdd `void reverse(int a, int b)` to CP::queue: reverse the elements at positions a..b (position x = the front after x pops). {A,B,C,D,E,F,G,H,I}, `reverse(1,4)` → {A,**E,D,C,B**,F,G,H,I}. 0 ≤ a ≤ b ≤ size−1.\n\n- Warning in the PDF: the starter main always has mFront = 0; **in the grader mFront can be anything**.\n\n## 2. What it really means\nTwo-pointer reverse (like Reverse Vector 2) on logical positions, then map to slots:\n\n```text\npositions:  0  1  2  3  4  5          reverse(1,4)\n            A [B  C  D  E] F\n             left→      ←right\nswap 1↔4, 2↔3 → A E D C B F\nslot of position i = (mFront + i) % mCap\n```\n\n## 3. What, why, how\n- left = a, right = b; while left < right: swap slots `(mFront+left)%mCap` and `(mFront+right)%mCap`, then left++, right−−.\n- ⌊(b−a+1)/2⌋ swaps → O(b − a).\n\n## 4. Solution\n{{code}}\n{{tests}}\n\n**Trace with wrap-around** (mCap = 8, mFront = 6; queue A B C D E F occupies slots 6 7 0 1 2 3), reverse(1,4):\n\n| left | right | slots | after swap |\n|---|---|---|---|\n| 1 | 4 | 7 ↔ 2 | A **E** C D **B** F |\n| 2 | 3 | 0 ↔ 1 | A E **D C** B F |\n| 3 | 2 | — | stop |\n\n## 5. Traps\n- **`mData[a]` / `mData[b]` without mFront** — passes the starter main, fails the grader.\n- **Converting a, b to slots first and then walking slots** (`pl++`, `pr--`): the slots wrap, so `pl < pr` is meaningless. Walk **positions**, convert each time.\n- **`left != right`** fails for even lengths.\n\n## 6. Background\nLesson 04 circular indexing + Lesson 02 two-pointer reverse. Rule: **do the logic in logical positions, convert to physical slots only when touching mData.**", "th": "## 1. โจทย์บอกอะไร\nเพิ่ม `void reverse(int a, int b)` ให้ CP::queue: กลับลำดับข้อมูลที่ตำแหน่ง a..b (ตำแหน่ง x = ตัวที่จะอยู่หัวคิวหลัง pop x ครั้ง) {A,B,C,D,E,F,G,H,I} เรียก `reverse(1,4)` → {A,**E,D,C,B**,F,G,H,I} รับประกัน 0 ≤ a ≤ b ≤ size−1\n\n- PDF เตือน: main เริ่มต้นมี mFront = 0 เสมอ **แต่ใน grader mFront เป็นค่าอื่นได้**\n\n## 2. จริง ๆ แล้วถามอะไร\nกลับลำดับด้วยพอยน์เตอร์สองตัว (เหมือนข้อ Reverse Vector 2) บนตำแหน่งตามความหมาย แล้วแปลงเป็นช่องจริง:\n\n```text\npositions:  0  1  2  3  4  5          reverse(1,4)\n            A [B  C  D  E] F\n             left→      ←right\nswap 1↔4, 2↔3 → A E D C B F\nslot of position i = (mFront + i) % mCap\n```\n\n## 3. อะไร ทำไม อย่างไร\n- left = a, right = b; ขณะที่ left < right: สลับช่อง `(mFront+left)%mCap` กับ `(mFront+right)%mCap` แล้ว left++, right−−\n- สลับ ⌊(b−a+1)/2⌋ ครั้ง → O(b − a)\n\n```text\nช่องจริง:  0  1  2  3  4  5  6  7      mFront = 6\nข้อมูล:    C  D  E  F  .  .  A  B\nตำแหน่ง:   2  3  4  5        0  1      ← ตำแหน่ง 2 วนมาอยู่ช่อง 0\n```\n\n## 4. โค้ดเฉลย\n{{code}}\n{{tests}}\n\n**ไล่ตัวอย่างที่วนรอบ** (mCap = 8, mFront = 6; คิว A B C D E F อยู่ช่อง 6 7 0 1 2 3) reverse(1,4):\n\n| left | right | ช่อง | หลังสลับ |\n|---|---|---|---|\n| 1 | 4 | 7 ↔ 2 | A **E** C D **B** F |\n| 2 | 3 | 0 ↔ 1 | A E **D C** B F |\n| 3 | 2 | — | หยุด |\n\n## 5. จุดที่มักพลาด\n- **ใช้ `mData[a]` / `mData[b]` โดยไม่มี mFront** — ผ่าน main เริ่มต้นแต่ผิดใน grader\n- **แปลง a, b เป็นช่องจริงก่อนแล้วเดินบนช่องจริง** (`pl++`, `pr--`): ช่องวนรอบ ทำให้ `pl < pr` ไม่มีความหมาย ให้เดินบน **ตำแหน่ง** แล้วแปลงทุกครั้ง\n- **`left != right`** ผิดเมื่อความยาวเป็นเลขคู่\n\n## 6. ความรู้พื้นฐาน\nบทที่ 04 index วงกลม + บทที่ 02 กลับลำดับด้วยพอยน์เตอร์สองตัว กฎ: **คิดด้วยตำแหน่งตามความหมาย แปลงเป็นช่องจริงเฉพาะตอนแตะ mData**"}}, {"id": "d62_q1a_vote", "group": "search", "lesson": "02 · STL (map)", "stars": 1, "kind": "program", "tags": ["map counting", "sort descending"], "title": {"en": "Election Winner", "th": "หาผู้ชนะเลือกตั้ง (Vote)"}, "blurb": {"en": "Count ballots per name with a map, sort the counts from high to low, the answer is the K-th count (or the last one if fewer than K got votes).", "th": "นับคะแนนแต่ละชื่อด้วย map, sort คะแนนจากมากไปน้อย คำตอบคือคะแนนลำดับที่ K (หรือตัวสุดท้ายถ้ามีคนได้คะแนนน้อยกว่า K คน)"}, "tests": {"en": "both PDF samples; 300 random elections (ties, everybody equal, fewer than K candidates) against Python Counter.", "th": "ตัวอย่างใน PDF ทั้งสองชุด; สุ่มการเลือกตั้ง 300 ชุด (คะแนนเสมอ, ทุกคนเท่ากัน, ผู้สมัครน้อยกว่า K) เทียบกับ Counter ใน Python"}, "files": [{"name": "main.cpp", "src": "#include <iostream>\n#include <map>\n#include <vector>\n#include <string>\n#include <algorithm>\nusing namespace std;\n\nint main() {\n    ios_base::sync_with_stdio(false); cin.tie(0);\n\n    int n, k;\n    cin >> n >> k;\n\n    // 1) Count the votes: cnt[name] = how many ballots have that name.\n    map<string, int> cnt;\n    // i visits 0, 1, ..., n-1: read one ballot each time and add 1 to that name.\n    for (int i = 0; i < n; i++) {\n        string name;\n        cin >> name;\n        cnt[name]++;                 // a new name starts at 0, then becomes 1\n    }\n\n    // 2) Copy only the vote counts (we don't need the names any more).\n    vector<int> votes;\n    // a map has no int index: this range-for visits every (name, count) pair once, in name order\n    for (auto &p : cnt) {\n        votes.push_back(p.second);\n    }\n\n    // 3) Sort from MOST votes to FEWEST.\n    sort(votes.begin(), votes.end(), greater<int>());\n\n    // 4) The K-th place (index k-1) is the weakest winner.\n    //    If fewer than K people got votes, everyone wins -> the weakest is the last one.\n    int m = votes.size();\n    int last = min(k, m) - 1;\n    cout << votes[last] << '\\n';\n}\n"}], "body": {"en": "## 1. What the problem says\nN ballots, each with a candidate's name. The top **K** candidates by votes are elected (each needs ≥ 1 vote). Print **how many votes the weakest elected candidate has**.\n\n- If fewer than K candidates got votes, all of them are elected.\n- Ties with the K-th place are all elected — but that doesn't change the answer (they have the same count).\n- 1 ≤ K ≤ N ≤ 1,000; names are lowercase, ≤ 20 letters.\n\n## 2. What it really means\n\"The K-th largest vote count\", clamped to the number of candidates.\n\n```text\nvotes: somchai 3, adisak 2, yingyos 2, direk 1     K = 2\nsorted desc: 3 2 2 1  → index K−1 = 1 → 2\nK = 3 in sample 2: counts 4 1 → only 2 candidates → last one → 1\n```\n\n## 3. What, why, how\n- `map<string,int> cnt; cnt[name]++` counts the ballots (a new name starts at 0).\n- Copy the counts into a vector, `sort(..., greater<int>())`.\n- Answer = `votes[min(K, size) − 1]`. O(N log N).\n\n## 4. Solution\n{{code}}\n{{tests}}\n\n**Trace of sample 1:**\n\n| step | state |\n|---|---|\n| count | adisak 2, direk 1, somchai 3, yingyos 2 (map order = alphabetical) |\n| vector | 2 1 3 2 |\n| sort desc | 3 2 2 1 |\n| min(K=2, 4) − 1 = 1 | votes[1] = **2** |\n\n## 5. Traps\n- **`vector<int> votes(n)` + `push_back`:** the constructor already makes n zeros, push_back adds after them → the vector has n extra zeros and the K-th largest may be 0. Use an empty vector (or index assignment).\n- **Fewer than K candidates:** `votes[K − 1]` reads past the end. Clamp with `min`.\n- **Sorting ascending** and taking index K−1 gives the K-th *smallest*.\n\n## 6. Background\nLesson 02 (STL): **map as a counter** (`cnt[key]++`). Then \"k-th largest\" = sort descending and index, or `nth_element`, or a min-heap of size K (see Heap K-th).", "th": "## 1. โจทย์บอกอะไร\nมีบัตรเลือกตั้ง N ใบ แต่ละใบเขียนชื่อผู้สมัคร ผู้ได้คะแนนสูงสุด **K** คนได้รับเลือก (ต้องได้อย่างน้อย 1 คะแนน) ให้พิมพ์ **คะแนนของคนที่ได้น้อยที่สุดในบรรดาผู้ได้รับเลือก**\n\n- ถ้าผู้ที่ได้คะแนนมีไม่ถึง K คน ทุกคนได้รับเลือก\n- ถ้ามีคนคะแนนเท่ากับอันดับที่ K ได้รับเลือกทั้งหมด — แต่คำตอบไม่เปลี่ยน (คะแนนเท่ากัน)\n- 1 ≤ K ≤ N ≤ 1,000 ชื่อเป็นตัวพิมพ์เล็ก ยาวไม่เกิน 20 ตัว\n\n## 2. จริง ๆ แล้วถามอะไร\n\"คะแนนที่มากเป็นอันดับ K\" แต่ถ้ามีผู้สมัครไม่ถึง K คนให้ใช้คนสุดท้าย\n\n```text\nvotes: somchai 3, adisak 2, yingyos 2, direk 1     K = 2\nsorted desc: 3 2 2 1  → index K−1 = 1 → 2\nK = 3 in sample 2: counts 4 1 → only 2 candidates → last one → 1\n```\n\n## 3. อะไร ทำไม อย่างไร\n- `map<string,int> cnt; cnt[name]++` นับบัตร (ชื่อใหม่เริ่มที่ 0)\n- คัดลอกคะแนนลง vector แล้ว `sort(..., greater<int>())`\n- คำตอบ = `votes[min(K, size) − 1]` เวลา O(N log N)\n\n```text\nmap cnt (กระดานนับคะแนน):\n  adisak  ││        2\n  direk   │         1\n  somchai │││       3\n  yingyos ││        2\n```\n\n## 4. โค้ดเฉลย\n{{code}}\n{{tests}}\n\n**ไล่ตัวอย่างที่ 1:**\n\n| ขั้น | สถานะ |\n|---|---|\n| นับ | adisak 2, direk 1, somchai 3, yingyos 2 (map เรียงตามตัวอักษร) |\n| vector | 2 1 3 2 |\n| sort มากไปน้อย | 3 2 2 1 |\n| min(K=2, 4) − 1 = 1 | votes[1] = **2** |\n\n## 5. จุดที่มักพลาด\n- **`vector<int> votes(n)` + `push_back`:** constructor สร้างเลข 0 ไว้ n ตัวแล้ว push_back ไปต่อท้าย → มี 0 เกินมา n ตัว คะแนนอันดับ K อาจกลายเป็น 0 ให้เริ่มจาก vector ว่าง (หรือใช้การกำหนดค่าด้วย index)\n- **ผู้สมัครไม่ถึง K คน:** `votes[K − 1]` อ่านเลยท้าย ต้องจำกัดด้วย `min`\n- **sort จากน้อยไปมาก** แล้วเอา index K−1 จะได้ค่าที่น้อยเป็นอันดับ K\n\n## 6. ความรู้พื้นฐาน\nบทที่ 02 (STL): **ใช้ map นับ** (`cnt[key]++`) แล้ว \"ค่ามากเป็นอันดับ k\" = sort มากไปน้อยแล้วใช้ index, หรือ `nth_element`, หรือ min-heap ขนาด K (ดูข้อ Heap K-th)"}}, {"id": "d58_q2_custom", "group": "heap", "lesson": "06 · priority_queue & comparators", "stars": 2, "kind": "song.h", "tags": ["CP::priority_queue", "functor comparator", "multi-key"], "title": {"en": "Custom Order", "th": "เรียงลำดับตามที่กำหนด (Custom Order)"}, "blurb": {"en": "Two priority queues of songs with different multi-key orders — remember that the comparator says who has LOWER priority, so it's the reverse of a sort.", "th": "priority queue ของเพลงสองตัวที่เรียงหลายคีย์ต่างกัน — จำไว้ว่า comparator บอกว่าใคร \"สำคัญน้อยกว่า\" จึงกลับด้านกับ sort"}, "tests": {"en": "the PDF sample; 300 random song lists (same artist, same count, ties on two keys) against Python sorted() with the two key orders. ASan + UBSan clean.", "th": "ตัวอย่างใน PDF; สุ่มรายการเพลง 300 ชุด (ศิลปินซ้ำ, ยอดขายซ้ำ, เท่ากันสองคีย์) เทียบกับ sorted() ใน Python ตามลำดับคีย์ทั้งสองแบบ ไม่พบข้อผิดพลาดจาก ASan + UBSan"}, "files": [{"name": "song.h", "src": "#ifndef __SONG_H__\n#define __SONG_H__\n\n#include <iostream>\n#include <queue>\n#include <string>\n#include <vector>\n#include \"priority_queue.h\"\n\nusing namespace std;\n\nclass Song {\n  public:\n    std::string artist,title;\n    int count;\n\n    Song() { }\n    Song(const Song &s) : artist(s.artist), title(s.title), count(s.count) { }\n    Song(std::string artist,std::string title,int count) :  artist(artist), title(title), count(count) { }\n\n    friend std::ostream& operator<<(std::ostream &out,const Song &s) {\n      return out << \"Artist: \" << s.artist << \" Title: \" << s.title << \" count: \" << s.count;\n    }\n\n};\n\n\n//  you have to write something below this line \n//  you *MIGHT* have to change the declaration of pq1 and pq2\n\n// HOW CP::priority_queue USES A COMPARATOR\n//   cmp(a, b) == true  means  \"a has LOWER priority than b\"  (a is popped AFTER b).\n//   top() is the element nobody beats.\n\n// pq1: pop in order artist ASC, then title ASC, then count ASC.\n//   The smallest (artist, title, count) must come out first,\n//   so \"a has lower priority\" when a is BIGGER  ->  use > on each field.\nclass CompArtistTitleCount {\n  public:\n    bool operator()(const Song &a, const Song &b) const {\n      if (a.artist != b.artist) return a.artist > b.artist;   // later artist name -> popped later\n      if (a.title  != b.title)  return a.title  > b.title;    // same artist: later title -> later\n      return a.count > b.count;                               // same both: bigger count -> later\n    }\n};\n\n// pq2: pop in order count DESC, then artist ASC, then title ASC.\nclass CompCountArtistTitle {\n  public:\n    bool operator()(const Song &a, const Song &b) const {\n      if (a.count  != b.count)  return a.count  < b.count;    // SMALLER count -> lower priority (DESC)\n      if (a.artist != b.artist) return a.artist > b.artist;   // tie: later artist -> later (ASC)\n      return a.title > b.title;                               // tie: later title -> later (ASC)\n    }\n};\n\nCP::priority_queue<Song, CompArtistTitleCount> pq1;\nCP::priority_queue<Song, CompCountArtistTitle> pq2;\n\n#endif\n"}], "body": {"en": "## 1. What the problem says\nClass `Song` has artist, title, count. `main` pushes n songs into `pq1` and `pq2` (declared in song.h) and prints each queue by popping.\n\n- **pq1** must pop by **artist ascending**, then **title ascending**, then **count ascending**.\n- **pq2** must pop by **count descending**, then **artist ascending**, then **title ascending**.\n- (artist, title) pairs are unique. Edit only song.h: write comparators and change the declarations; pq1/pq2 must stay `CP::priority_queue`.\n\n## 2. What it really means\n`CP::priority_queue<T, Comp>` pops the element that **nobody beats**, where `Comp(a, b) == true` means **\"a has lower priority than b\"** (a comes out later). So to pop the *smallest* first, the comparator must say \"a is lower priority when a is *bigger*\" → use `>`.\n\n```text\nstd::sort(v, cmp):        cmp(a,b) true → a goes FIRST\npriority_queue<T, cmp>:   cmp(a,b) true → a comes out LATER\n→ the same comparator gives OPPOSITE orders\n```\n\n## 3. What, why, how\nFor each key in order: if the keys differ, decide; otherwise go to the next key.\n\n- pq1 (all ascending): `a.artist > b.artist`, then `a.title > b.title`, then `a.count > b.count`.\n- pq2: count **descending** → smaller count is lower priority: `a.count < b.count`; then `a.artist > b.artist`; then `a.title > b.title`.\n\n## 4. Solution\n{{code}}\n{{tests}}\n\n**Sample check for pq2** (count desc, then artist, then title):\n\n| song | count | position |\n|---|---|---|\n| TSquare Takarajima | 15 | 1st |\n| Queen Bohemian | 10 | 2nd (Queen < TSquare, Bohemian < Jazz) |\n| Queen Jazz | 10 | 3rd |\n| TSquare Omen | 10 | 4th |\n| Beatles Yesterday | 3 | 5th |\n\n## 5. Traps\n- **Writing the comparator like a sort comparator** (`a.artist < b.artist`) → pq1 comes out in reverse.\n- **Only the first key**: ties on artist must fall through to title, then count.\n- **`main` reads `title artist count` but calls `Song(title, artist, count)`** whose constructor is `(artist, title, count)` — so the first word ends up as `artist`. The printed output confirms it (\"Artist: Queen Title: Jazz\").\n- **Changing pq1/pq2 to `std::priority_queue`** or a vector + sort — forbidden.\n\n## 6. Background\nLesson 06: comparator direction. `std::priority_queue` has the same convention as CP (default `less` → max-heap). Multi-key comparator template: `if (a.k1 != b.k1) return …; if (a.k2 != b.k2) return …; return …;`. See also Heap K-th (`mLess(b, a)` to sort by priority).", "th": "## 1. โจทย์บอกอะไร\nคลาส `Song` มี artist, title, count ส่วน `main` push เพลง n เพลงลง `pq1` และ `pq2` (ประกาศใน song.h) แล้วพิมพ์แต่ละคิวด้วยการ pop\n\n- **pq1** ต้อง pop ตาม **ศิลปินน้อยไปมาก** แล้ว **ชื่อเพลงน้อยไปมาก** แล้ว **ยอดขายน้อยไปมาก**\n- **pq2** ต้อง pop ตาม **ยอดขายมากไปน้อย** แล้ว **ศิลปินน้อยไปมาก** แล้ว **ชื่อเพลงน้อยไปมาก**\n- คู่ (ศิลปิน, ชื่อเพลง) ไม่ซ้ำกัน แก้ได้แค่ song.h: เขียน comparator และแก้การประกาศ แต่ pq1/pq2 ต้องเป็น `CP::priority_queue`\n\n## 2. จริง ๆ แล้วถามอะไร\n`CP::priority_queue<T, Comp>` จะ pop ตัวที่ **ไม่มีใครชนะ** โดย `Comp(a, b) == true` แปลว่า **\"a สำคัญน้อยกว่า b\"** (a ออกทีหลัง) ถ้าอยากให้ตัว *เล็กสุด* ออกก่อน comparator ต้องบอกว่า \"a สำคัญน้อยกว่าเมื่อ a *ใหญ่กว่า*\" → ใช้ `>`\n\n```text\nstd::sort(v, cmp):        cmp(a,b) true → a goes FIRST\npriority_queue<T, cmp>:   cmp(a,b) true → a comes out LATER\n→ the same comparator gives OPPOSITE orders\n```\n\n## 3. อะไร ทำไม อย่างไร\nทีละคีย์ตามลำดับ: ถ้าคีย์ต่างกันก็ตัดสินเลย ถ้าเท่ากันไปดูคีย์ถัดไป\n\n- pq1 (น้อยไปมากทั้งหมด): `a.artist > b.artist` แล้ว `a.title > b.title` แล้ว `a.count > b.count`\n- pq2: ยอดขาย **มากไปน้อย** → ยอดขายน้อยกว่าสำคัญน้อยกว่า: `a.count < b.count` แล้ว `a.artist > b.artist` แล้ว `a.title > b.title`\n\n```text\ncomparator ของ pq2 ถามว่า \"a ควรออกทีหลัง b ไหม?\"\n  count ต่างกัน?   → a ออกทีหลังถ้า a.count น้อยกว่า\n  artist ต่างกัน?  → a ออกทีหลังถ้า a.artist มาทีหลังในพจนานุกรม\n  ไม่อย่างนั้น     → a ออกทีหลังถ้า a.title มาทีหลัง\n```\n\n## 4. โค้ดเฉลย\n{{code}}\n{{tests}}\n\n**ตรวจตัวอย่างของ pq2** (ยอดขายมากไปน้อย แล้วศิลปิน แล้วชื่อเพลง):\n\n| เพลง | ยอดขาย | ลำดับ |\n|---|---|---|\n| TSquare Takarajima | 15 | 1 |\n| Queen Bohemian | 10 | 2 (Queen < TSquare, Bohemian < Jazz) |\n| Queen Jazz | 10 | 3 |\n| TSquare Omen | 10 | 4 |\n| Beatles Yesterday | 3 | 5 |\n\n## 5. จุดที่มักพลาด\n- **เขียน comparator แบบ sort** (`a.artist < b.artist`) → pq1 ออกมากลับด้าน\n- **ดูแค่คีย์แรก**: ศิลปินเท่ากันต้องไปดูชื่อเพลง แล้วยอดขาย\n- **`main` อ่าน `title artist count` แต่เรียก `Song(title, artist, count)`** ซึ่ง constructor คือ `(artist, title, count)` — คำแรกจึงกลายเป็น `artist` ผลที่พิมพ์ยืนยันว่าเป็นแบบนั้น (\"Artist: Queen Title: Jazz\")\n- **เปลี่ยน pq1/pq2 เป็น `std::priority_queue`** หรือ vector + sort — ห้าม\n\n## 6. ความรู้พื้นฐาน\nบทที่ 06: ทิศทางของ comparator `std::priority_queue` ใช้ธรรมเนียมเดียวกับ CP (ค่าเริ่มต้น `less` → max-heap) แม่แบบ comparator หลายคีย์: `if (a.k1 != b.k1) return …; if (a.k2 != b.k2) return …; return …;` ดูข้อ Heap K-th ด้วย (`mLess(b, a)` เพื่อเรียงตามความสำคัญ)"}}, {"id": "d64_q3a_heap_kth", "group": "heap", "lesson": "06 · Binary heap", "stars": 2, "kind": "student.h", "tags": ["CP::priority_queue", "const", "top levels", "lambda [this]"], "title": {"en": "Heap K-th", "th": "ค่าที่จะถูก pop เป็นลำดับที่ k (Heap K-th)"}, "blurb": {"en": "get_kth(k) for k ≤ 3 without changing the heap — the k-th best is always within the first k levels, so sort at most 7 candidates.", "th": "get_kth(k) สำหรับ k ≤ 3 โดยไม่แก้ฮีป — ตัวที่ดีเป็นอันดับ k อยู่ใน k ชั้นแรกเสมอ จึง sort แค่ไม่เกิน 7 ตัว"}, "tests": {"en": "hand examples for less and greater; 300 random heaps of int / string / greater<int> (with duplicates) against Python sorting; the starter's random mode (10⁵ items, 10⁶ rounds × 3 calls) in 0.44 s.", "th": "ตัวอย่างที่คิดเองทั้ง less และ greater; สุ่มฮีป 300 ชุดของ int / string / greater<int> (มีค่าซ้ำ) เทียบกับการ sort ใน Python; โหมดสุ่มของ main (10⁵ ตัว, 10⁶ รอบ × 3 ครั้ง) ใช้ 0.44 วินาที"}, "files": [{"name": "student.h", "src": "#ifndef __STUDENT_H__\n#define __STUDENT_H__\n\n#include <algorithm>\n#include <vector>\n#include \"priority_queue.h\"\n\ntemplate <typename T,typename Comp >\nT CP::priority_queue<T,Comp>::get_kth(size_t k) const {\n  // For k <= 3 the answer is always inside the top 3 levels of the heap:\n  // indices 0 (root), 1..2 (depth 1), 3..6 (depth 2)  ->  at most 7 candidates.\n  int limit = std::min((int)mSize, 7);\n\n  // copy the candidates (we must not touch mData: the function is const)\n  std::vector<T> cand;\n  // i visits 0, 1, ..., limit-1 (left to right): the first three levels of the heap array.\n  for (int i = 0; i < limit; i++) {\n    cand.push_back(mData[i]);\n  }\n\n  // Sort from HIGHEST priority to lowest, using the heap's own comparator.\n  // mLess(a,b) == true means \"a has LOWER priority than b\",\n  // so \"a comes first\" when b is less than a  ->  mLess(b, a).\n  std::sort(cand.begin(), cand.end(),\n            [this](const T &a, const T &b) { return mLess(b, a); });\n\n  return cand[k - 1];   // k = 1 -> the top, k = 2 -> second pop, k = 3 -> third pop\n}\n\n#endif\n"}], "body": {"en": "## 1. What the problem says\nAdd `T get_kth(size_t k) const` to CP::priority_queue: return the value that **would come out on the k-th pop** (k = 1 → top()). The order is the heap's comparator.\n\n- **1 ≤ k ≤ 3**, and k ≤ mSize. The function is `const`: it must not change the heap.\n- The grader calls it up to 10⁶ times (random mode), so it must be fast.\n\n## 2. What it really means\nIn a heap every parent beats its children. The 2nd best must be a **child of the root**; the 3rd best is a child of the root or a child of the 2nd best. So the top 3 are always inside the **first 3 levels** — indices 0..6.\n\n```text\nlevel 0:            [0]\nlevel 1:        [1]     [2]\nlevel 2:      [3] [4] [5] [6]\nk-th best (k ≤ 3) is always one of these 7 slots\n```\n\n## 3. What, why, how\n- Copy `mData[0 .. min(mSize,7)−1]` into a small vector (we can't touch mData — const).\n- Sort it from **highest to lowest priority** using the heap's own comparator: \"a first\" ⇔ `mLess(b, a)`.\n- Return `cand[k−1]`. Cost: sorting ≤ 7 items → O(1) per call.\n- The lambda needs `[this]` because `mLess` is a member of the object.\n\n## 4. Solution\n{{code}}\n{{tests}}\n\n**Example** — push 5 1 9 3 7 2 8 into a max-heap. mData = 9 7 8 1 3 2 5.\n\n| step | values |\n|---|---|\n| first 7 slots | 9 7 8 1 3 2 5 |\n| sort by priority | 9 8 7 5 3 2 1 |\n| k = 1, 2, 3 | 9, 8, 7 |\n\nWith `greater<int>` (min-heap) the same code returns 1, 2, 3.\n\n## 5. Traps\n- **Looping to a fixed `i < 7`** — reads garbage when mSize < 7. Use `limit = min(mSize, 7)`.\n- **Assuming mData[1] is the 2nd best** — the 2nd best is the better of mData[1] and mData[2]; and the 3rd best can be at level 2.\n- **Sorting with `<`** ignores the comparator; fails for `greater<int>` and for custom types.\n- **Copying the whole heap and popping** — correct but O(n) per call → TLE with 10⁶ calls.\n- **Sorting mData itself** — breaks `const` (won't compile) and the heap.\n\n## 6. Background\nLesson 06: heap = complete binary tree in an array, children of i at 2i+1, 2i+2. **The k-th best lies within depth k−1** — useful for small k. Lambdas: `[this]` captures the object so the body can call `mLess`.", "th": "## 1. โจทย์บอกอะไร\nเพิ่ม `T get_kth(size_t k) const` ให้ CP::priority_queue: คืนค่าที่ **จะออกมาตอน pop ครั้งที่ k** (k = 1 → top()) ลำดับใช้ comparator ของฮีป\n\n- **1 ≤ k ≤ 3** และ k ≤ mSize ฟังก์ชันเป็น `const`: ห้ามเปลี่ยนฮีป\n- grader เรียกได้ถึง 10⁶ ครั้ง (โหมดสุ่ม) จึงต้องเร็ว\n\n## 2. จริง ๆ แล้วถามอะไร\nในฮีป พ่อชนะลูกเสมอ ตัวที่ดีอันดับ 2 ต้องเป็น **ลูกของราก** ตัวที่ดีอันดับ 3 เป็นลูกของราก หรือลูกของอันดับ 2 ดังนั้น 3 อันดับแรกอยู่ใน **3 ชั้นแรก** เสมอ — index 0..6\n\n```text\nlevel 0:            [0]\nlevel 1:        [1]     [2]\nlevel 2:      [3] [4] [5] [6]\nk-th best (k ≤ 3) is always one of these 7 slots\n```\n\nเหมือนการแข่งขันแบบแพ้คัดออก: ผู้ชนะอันดับ 2 ต้องเคยแพ้แชมป์โดยตรงเท่านั้น จึงไม่ต้องไปหาที่ชั้นล่าง ๆ\n\n## 3. อะไร ทำไม อย่างไร\n- คัดลอก `mData[0 .. min(mSize,7)−1]` ลง vector เล็ก ๆ (แตะ mData ไม่ได้ — const)\n- sort จาก **ความสำคัญมากไปน้อย** ด้วย comparator ของฮีปเอง: \"a มาก่อน\" ⇔ `mLess(b, a)`\n- คืน `cand[k−1]` เวลา: sort ไม่เกิน 7 ตัว → O(1) ต่อครั้ง\n- lambda ต้องใช้ `[this]` เพราะ `mLess` เป็นสมาชิกของออบเจกต์\n\n## 4. โค้ดเฉลย\n{{code}}\n{{tests}}\n\n**ตัวอย่าง** — push 5 1 9 3 7 2 8 ลง max-heap ได้ mData = 9 7 8 1 3 2 5\n\n| ขั้น | ค่า |\n|---|---|\n| 7 ช่องแรก | 9 7 8 1 3 2 5 |\n| sort ตามความสำคัญ | 9 8 7 5 3 2 1 |\n| k = 1, 2, 3 | 9, 8, 7 |\n\nถ้าใช้ `greater<int>` (min-heap) โค้ดเดียวกันคืน 1, 2, 3\n\n## 5. จุดที่มักพลาด\n- **ลูปถึง `i < 7` ตายตัว** — อ่านขยะเมื่อ mSize < 7 ต้องใช้ `limit = min(mSize, 7)`\n- **คิดว่า mData[1] คืออันดับ 2** — อันดับ 2 คือตัวที่ดีกว่าระหว่าง mData[1] กับ mData[2] และอันดับ 3 อาจอยู่ชั้นที่ 2\n- **sort ด้วย `<`** ไม่สนใจ comparator → ผิดกับ `greater<int>` และชนิดข้อมูลที่กำหนดเอง\n- **คัดลอกทั้งฮีปแล้ว pop** — ถูกแต่ O(n) ต่อครั้ง → TLE เมื่อเรียก 10⁶ ครั้ง\n- **sort mData ตรง ๆ** — ผิด `const` (คอมไพล์ไม่ผ่าน) และทำฮีปพัง\n\n## 6. ความรู้พื้นฐาน\nบทที่ 06: ฮีป = ต้นไม้ไบนารีสมบูรณ์ในอาร์เรย์ ลูกของ i อยู่ที่ 2i+1, 2i+2 **ตัวที่ดีอันดับ k อยู่ลึกไม่เกิน k−1** — มีประโยชน์เมื่อ k เล็ก ส่วน lambda: `[this]` จับออบเจกต์ไว้เพื่อให้ข้างในเรียก `mLess` ได้"}}, {"id": "ds03_heap_erase", "group": "heap", "lesson": "06 · Binary heap", "stars": 2, "kind": "whole file (erase only)", "tags": ["CP::priority_queue", "fixUp", "fixDown", "erase"], "title": {"en": "Heap Erase", "th": "ลบข้อมูลออกจากฮีป (Heap Erase)"}, "blurb": {"en": "Find v, move the last element into its slot, shrink, then fixUp and fixDown — the moved element may need to go either way.", "th": "หา v แล้วย้ายตัวสุดท้ายมาแทนที่ ลดขนาด แล้ว fixUp และ fixDown — ตัวที่ย้ายมาอาจต้องขึ้นหรือลงก็ได้"}, "tests": {"en": "all 3 PDF samples, the worked example in the PDF text (→ 5 1), erasing a missing value; 300 random i / d / x scripts against a Python set model. The program's own check_and_print verifies the heap property after every script.", "th": "ตัวอย่างทั้ง 3 ชุดใน PDF, ตัวอย่างที่อธิบายในเนื้อโจทย์ (→ 5 1), ลบค่าที่ไม่มีอยู่; สุ่มชุดคำสั่ง i / d / x 300 ชุดเทียบกับโมเดล set ใน Python และ check_and_print ของโปรแกรมตรวจคุณสมบัติฮีปทุกครั้ง"}, "files": [{"name": "attachment.h", "src": "#include <stdio.h>\n#include <stdlib.h>\n#include <algorithm>\n#include <functional>\n#include <iostream>\n#include <stdexcept>\n\n\nnamespace CP {\n\ntemplate <typename T,typename Comp = std::less<T> >\nclass priority_queue\n{\n  protected:\n    T *mData;\n    size_t mCap;\n    size_t mSize;\n    Comp mLess;\n\n    void expand(size_t capacity) {\n      T *arr = new T[capacity]();\n      for (size_t i = 0;i < mSize;i++) {\n        arr[i] = mData[i];\n      }\n      delete [] mData;\n      mData = arr;\n      mCap = capacity;\n    }\n\n    void fixUp(size_t idx) {\n      T tmp = mData[idx];\n      while (idx > 0) {\n        size_t p = (idx - 1) / 2;\n        if ( mLess(tmp,mData[p]) ) break;\n        mData[idx] = mData[p];\n        idx = p;\n      }\n      mData[idx] = tmp;\n    }\n\n    void fixDown(size_t idx) {\n      T tmp = mData[idx];\n      size_t c;\n      while ((c = 2 * idx + 1) < mSize) {\n        if (c + 1 < mSize && mLess(mData[c],mData[c + 1]) ) c++;\n        if ( mLess(mData[c],tmp) ) break;\n        mData[idx] = mData[c];\n        idx = c;\n      }\n      mData[idx] = tmp;\n    }\n\n    void print() {\n      for (size_t i = 0;i < mSize;i++)\n        std::cout << mData[i] << \" \";\n      std::cout << std::endl;\n    }\n\n  public:\n    //-------------- constructor ----------\n\n    // copy constructor\n    priority_queue(priority_queue<T,Comp>& a) :\n      mData(new T[a.mCap]()), mCap(a.mCap), mSize(a.mSize), mLess(a.mLess)\n    {\n      for (size_t i = 0; i < a.mCap;i++) {\n        mData[i] = a.mData[i];\n      }\n    }\n\n    // default constructor\n    priority_queue(const Comp& c = Comp() ) :\n       mData( new T[1]() ),\n       mCap( 1 ),\n       mSize( 0 ),\n       mLess( c )\n    { }\n\n\n    // copy assignment operator\n    priority_queue<T,Comp>& operator=(priority_queue<T,Comp> other) {\n      using std::swap;\n      swap(mSize,other.mSize);\n      swap(mCap,other.mCap);\n      swap(mData,other.mData);\n      swap(mLess,other.mLess);\n      return *this;\n    }\n\n    ~priority_queue() {\n      delete [] mData;\n    }\n\n    //------------- capacity function -------------------\n    bool empty() const {\n      return mSize == 0;\n    }\n\n    size_t size() const {\n      return mSize;\n    }\n\n    //----------------- access -----------------\n    const T& top() {\n      if (size() == 0) throw std::out_of_range(\"index of out range\") ;\n      return mData[0];\n    }\n\n    //----------------- modifier -------------\n    void push(const T& element) {\n      if (mSize + 1 > mCap)\n        expand(mCap * 2);\n      mData[mSize] = element;\n      mSize++;\n      fixUp(mSize-1);\n    }\n\n    void pop() {\n      if (size() == 0) throw std::out_of_range(\"index of out range\");\n      mData[0] = mData[mSize-1];\n      mSize--;\n      fixDown(0);\n    }\n\n    void erase(const T& v) {\n      //erase v from the heap (if exists)\n      //write your code here\n\n      // 1) FIND v. A heap is not sorted, so we must scan.\n      //    i visits 0, 1, ..., mSize-1 (left to right) until v is found.\n      //    \"equal\" is written with mLess only: neither is less than the other.\n      int n = mSize;\n      int idx = -1;\n      for (int i = 0; i < n; i++) {\n        if (!mLess(mData[i], v) && !mLess(v, mData[i])) {\n          idx = i;\n          break;\n        }\n      }\n      if (idx == -1) return;                 // v is not in the heap: nothing to do\n\n      // 2) REMOVE: move the LAST element into the hole, and shrink.\n      //    (Removing from the end keeps the tree shape complete.)\n      mData[idx] = mData[n - 1];\n      mSize--;\n      if (idx == n - 1) return;              // we erased the last element itself: done\n\n      // 3) REPAIR: the moved element may be too big for its new place (go up)\n      //    or too small (go down). It can only be wrong in ONE direction,\n      //    and the other call simply does nothing, so call both.\n      fixUp(idx);\n      fixDown(idx);\n    }\n\n    void check_and_print() {\n      //check HEAP\n      for (int i =1;i < mSize;i++) {\n        int p = (i-1)/2;\n        if (mLess(mData[p],mData[i])) {\n          printf(\"NOT A HEAP\\n\");\n          return ;\n        }\n      }\n\n      //print the heap\n      while (!empty()) {\n        std::cout << top() << \" \";\n        pop();\n      }\n      std::cout << std::endl;\n    }\n};\n\n}\n\n//---------------------------------------------\nint main(int argc, char *argv[]) {\n\n\tchar c = 0;\n  CP::priority_queue<int> h;\n\tscanf(\"%c\", &c);\n  int v;\n\twhile (c != 'q') {\n\t\tif (c == 'i') {\n\t\t\t// insert\n\t\t\tscanf(\"%d\", &v);\n      h.push(v);\n\t\t} else\n\t\tif (c == 'x') {\n\t\t\t// remove min\n      h.pop();\n\t\t} else\n\t\tif (c == 'd') {\n\t\t\t// remove data\n\t\t\tscanf(\"%d\", &v);\n      h.erase(v);\n\t\t}\n\t\tscanf(\"%c\", &c);\n\t}\n\th.check_and_print();\n  return 0;\n}\n"}], "body": {"en": "## 1. What the problem says\nCP::priority_queue (a binary heap) has no way to delete an arbitrary value. Write `void erase(T v)`: find v and remove it so the array **is still a valid binary heap**. All values are distinct.\n\n- The file contains the whole class and `main`; fill in `erase` only.\n- Commands: `i v` push, `x` pop the max, `d v` erase v, `q` quit → `check_and_print` verifies the heap and prints by popping.\n- Example from the text: insert 5 3 7 1 2, erase 3, insert 13, pop twice (13, 7), erase 2 → prints `5 1`.\n\n## 2. What it really means\nRemoving from the **end** of the array keeps the tree complete. So: put the last element into the hole, shrink by one, and repair just that one position.\n\n```text\nmax-heap:       15                erase 10:        15                after fixDown:   15\n              /    \\              last = 3 → hole  /    \\                           /    \\\n            10      5                             3      5                         3      5\n           /  \\    /                             / \\                              / \\\n          1    2  3                             1   2                            1   2\narray: 15 10 5 1 2 3            array: 15 3 5 1 2       (3 ≥ 1, 3 ≥ 2: already fine)\n```\n\n## 3. What, why, how\n1. **Find** v: a heap isn't sorted, so scan all slots (O(n)). Test equality with the comparator: `!mLess(a,v) && !mLess(v,a)`.\n2. If not found → do nothing.\n3. `mData[idx] = mData[mSize−1]; mSize−−`.\n4. The moved element came from a different branch — it may be **bigger than its new parent** (go up) or **smaller than a child** (go down). Call **both** `fixUp(idx)` and `fixDown(idx)`; the one that isn't needed does nothing.\n\n## 4. Solution\n{{code}}\n{{tests}}\n\n**Trace of the PDF example** (max-heap):\n\n| op | array after |\n|---|---|\n| i 5, 3, 7, 1, 2 | 7 3 5 1 2 |\n| d 3 (idx 1): last = 2 moves in | 7 **2** 5 1 → fixDown: child 1 < 2 → stays → 7 2 5 1 |\n| i 13 | 13 7 5 1 2 |\n| x, x | 5 2 1 |\n| d 2 (idx 1): last = 1 moves in | 5 1 |\n| print | **5 1** |\n\n## 5. Traps\n- **Shifting everything left after idx** (like a vector erase) changes parent/child relations of many nodes → the result is usually **not a heap**.\n- **Only `fixDown`**: when the moved element is larger than its new parent (it came from another subtree), it must go **up**. Example: heap 100 / 50 90 / 10 20 80 85 — erase 10 → 85 moves to slot 3, its parent 50 < 85 → needs fixUp.\n- **Not handling \"v not found\"**: without the check, `idx` stays at a default value and you delete the wrong element.\n- **Erasing the last element itself**: after `mSize−−` there is nothing to fix — return early (fixUp/fixDown on idx = mSize would read past the end).\n\n## 6. Background\nLesson 06: heap operations = \"break one spot, then repair along one path\": push = add at end + fixUp, pop = move last to root + fixDown, **erase = move last to the hole + fixUp + fixDown**. With an index map (value → slot) the search becomes O(1) and erase is O(log n) — that's how Dijkstra's decrease-key heaps work.", "th": "## 1. โจทย์บอกอะไร\nCP::priority_queue (binary heap) ไม่มีฟังก์ชันลบค่าใด ๆ ออก ให้เขียน `void erase(T v)`: หา v แล้วลบออก โดยอาร์เรย์ **ยังเป็นฮีปที่ถูกต้อง** ค่าทุกตัวไม่ซ้ำกัน\n\n- ไฟล์มีทั้งคลาสและ `main` แล้ว เติมแค่ `erase`\n- คำสั่ง: `i v` push, `x` pop ค่ามากสุด, `d v` ลบ v, `q` จบ → `check_and_print` ตรวจฮีปแล้วพิมพ์ด้วยการ pop\n- ตัวอย่างในเนื้อโจทย์: ใส่ 5 3 7 1 2, ลบ 3, ใส่ 13, pop สองครั้ง (13, 7), ลบ 2 → พิมพ์ `5 1`\n\n## 2. จริง ๆ แล้วถามอะไร\nการลบจาก **ท้าย** อาร์เรย์ทำให้ต้นไม้ยังสมบูรณ์ ดังนั้น: เอาตัวสุดท้ายมาใส่ช่องที่ว่าง ลดขนาดหนึ่ง แล้วซ่อมแค่ตำแหน่งนั้น\n\n```text\nmax-heap:       15                erase 10:        15                after fixDown:   15\n              /    \\              last = 3 → hole  /    \\                           /    \\\n            10      5                             3      5                         3      5\n           /  \\    /                             / \\                              / \\\n          1    2  3                             1   2                            1   2\narray: 15 10 5 1 2 3            array: 15 3 5 1 2       (3 ≥ 1, 3 ≥ 2: already fine)\n```\n\nเหมือนพนักงานลาออกกลางองค์กร: ดึงคนจากตำแหน่งท้ายสุดมาแทน แล้วค่อยเลื่อนขั้นขึ้นหรือลดขั้นลงจนเข้าที่\n\n## 3. อะไร ทำไม อย่างไร\n1. **หา** v: ฮีปไม่ได้เรียง ต้องไล่ทุกช่อง (O(n)) เช็กเท่ากันด้วย comparator: `!mLess(a,v) && !mLess(v,a)`\n2. ถ้าไม่เจอ → ไม่ทำอะไร\n3. `mData[idx] = mData[mSize−1]; mSize−−`\n4. ตัวที่ย้ายมาเคยอยู่คนละกิ่ง — อาจ **ใหญ่กว่าพ่อใหม่** (ต้องขึ้น) หรือ **เล็กกว่าลูก** (ต้องลง) ให้เรียก **ทั้ง** `fixUp(idx)` และ `fixDown(idx)` ตัวที่ไม่จำเป็นจะไม่ทำอะไร\n\n## 4. โค้ดเฉลย\n{{code}}\n{{tests}}\n\n**ไล่ตัวอย่างใน PDF** (max-heap):\n\n| คำสั่ง | อาร์เรย์หลังทำ |\n|---|---|\n| i 5, 3, 7, 1, 2 | 7 3 5 1 2 |\n| d 3 (idx 1): ตัวสุดท้าย 2 ย้ายมา | 7 **2** 5 1 → fixDown: ลูก 1 < 2 → อยู่ที่เดิม → 7 2 5 1 |\n| i 13 | 13 7 5 1 2 |\n| x, x | 5 2 1 |\n| d 2 (idx 1): ตัวสุดท้าย 1 ย้ายมา | 5 1 |\n| พิมพ์ | **5 1** |\n\n## 5. จุดที่มักพลาด\n- **เลื่อนทุกตัวหลัง idx ไปซ้าย** (แบบ erase ของ vector) ทำให้ความสัมพันธ์พ่อ-ลูกของหลายโหนดเปลี่ยน → ผลมักจะ **ไม่เป็นฮีป**\n- **เรียกแค่ `fixDown`**: ถ้าตัวที่ย้ายมาใหญ่กว่าพ่อใหม่ (มาจากอีกกิ่ง) ต้อง **ขึ้น** ตัวอย่าง: ฮีป 100 / 50 90 / 10 20 80 85 — ลบ 10 → 85 ย้ายมาช่อง 3 พ่อคือ 50 < 85 → ต้อง fixUp\n- **ไม่จัดการกรณี \"ไม่เจอ v\"**: ถ้าไม่เช็ก `idx` จะเป็นค่าเริ่มต้นและไปลบผิดตัว\n- **ลบตัวสุดท้ายเอง**: หลัง `mSize−−` ไม่มีอะไรต้องซ่อม — return เลย (fixUp/fixDown ที่ idx = mSize จะอ่านเลยท้าย)\n\n## 6. ความรู้พื้นฐาน\nบทที่ 06: การทำงานของฮีป = \"ทำให้เสียหนึ่งจุด แล้วซ่อมตามเส้นทางเดียว\": push = ใส่ท้าย + fixUp, pop = ย้ายตัวสุดท้ายไปราก + fixDown, **erase = ย้ายตัวสุดท้ายไปช่องว่าง + fixUp + fixDown** ถ้ามีตาราง (ค่า → ช่อง) การค้นหาจะเป็น O(1) และ erase เป็น O(log n) — แบบที่ heap ของ Dijkstra ใช้ทำ decrease-key"}}, {"id": "d62_q3a_heap_descendant", "group": "heap", "lesson": "06 · Binary heap (array layout)", "stars": 2, "kind": "program", "tags": ["heap indices", "2i+1 / 2i+2", "level ranges"], "title": {"en": "Heap Descendant", "th": "ลูกหลานในฮีป (Heap Descendant)"}, "blurb": {"en": "List node a and all its descendants in an n-node array heap — each level of descendants is one contiguous range [lo, hi] → [2lo+1, 2hi+2].", "th": "แสดงโหนด a และลูกหลานทั้งหมดในฮีปขนาด n — ลูกหลานแต่ละชั้นเป็นช่วงติดกัน [lo, hi] → [2lo+1, 2hi+2]"}, "tests": {"en": "all 5 PDF samples (including n = 5478, a = 214 → 31 nodes); 300 random (n, a) against a brute force that walks every node up to its ancestors; n = 200,000, a = 0 in 0.01 s.", "th": "ตัวอย่างทั้ง 5 ชุดใน PDF (รวม n = 5478, a = 214 → 31 โหนด); สุ่ม (n, a) 300 ชุดเทียบกับ brute force ที่เดินจากทุกโหนดขึ้นไปหาบรรพบุรุษ; n = 200,000, a = 0 ใช้ 0.01 วินาที"}, "files": [{"name": "main.cpp", "src": "#include <iostream>\n#include <vector>\nusing namespace std;\n\nint main() {\n    ios_base::sync_with_stdio(false); cin.tie(0);\n\n    long long n, a;\n    cin >> n >> a;\n\n    // In an array heap the children of i are 2i+1 and 2i+2.\n    // So the descendants of a, ONE LEVEL AT A TIME, are contiguous ranges:\n    //   level 0: [a, a]\n    //   level 1: [2a+1, 2a+2]\n    //   level 2: [2(2a+1)+1, 2(2a+2)+2] = [4a+3, 4a+6]   ...\n    // In general, if one level is [lo, hi], the next is [2*lo+1, 2*hi+2].\n    // Every range starts after the previous one ends, so printing level by level\n    // already gives the indices in increasing order.\n    vector<long long> ans;\n    long long lo = a, hi = a;\n    while (lo < n) {                         // a level that starts inside the heap\n        long long last = (hi < n - 1) ? hi : n - 1;   // the bottom level may be cut short by n\n        // i visits lo, lo+1, ..., last (left to right): every node of this level that exists\n        for (long long i = lo; i <= last; i++) {\n            ans.push_back(i);\n        }\n        lo = 2 * lo + 1;                     // leftmost child of the leftmost node\n        hi = 2 * hi + 2;                     // rightmost child of the rightmost node\n    }\n\n    cout << ans.size() << '\\n';\n    // k visits 0, 1, ..., ans.size()-1: print the indices separated by spaces\n    for (int k = 0; k < (int)ans.size(); k++) {\n        if (k > 0) cout << ' ';\n        cout << ans[k];\n    }\n    cout << '\\n';\n}\n"}], "body": {"en": "## 1. What the problem says\nA binary heap stored in an array with the root at index 0. Node a is an **ancestor** of b if a is b's parent, or the parent of b's parent, and so on; then b is a **descendant** of a. Given n and a (0 ≤ a < n ≤ 200,000), print the count m of a and all its descendants, then their indices in increasing order.\n\n## 2. What it really means\nChildren of i are 2i+1 and 2i+2. Going down one level from a contiguous range of nodes gives another contiguous range:\n\n```text\nn = 7, a = 2                     index layout\nlevel 0: [2, 2]                        0\nlevel 1: [5, 6]                     1     2\nlevel 2: [11, 14] → beyond n=7     3 4   5 6\nanswer: 3 / 2 5 6\n```\n\n## 3. What, why, how\n- Start with `lo = hi = a`. While `lo < n`: output `lo .. min(hi, n−1)`, then `lo = 2·lo + 1`, `hi = 2·hi + 2`.\n- Each new range starts after the previous one ends, so the output is already sorted.\n- O(m) — only the answer is touched. (A brute force that checks every b by walking up is O(n log n), also fine for n = 2·10⁵, but this is cleaner.)\n- Use `long long` for lo/hi: hi doubles every level and can overshoot int before the loop stops.\n\n## 4. Solution\n{{code}}\n{{tests}}\n\n**Trace for n = 5478, a = 214:**\n\n| level | lo | hi | printed |\n|---|---|---|---|\n| 0 | 214 | 214 | 214 |\n| 1 | 429 | 430 | 429 430 |\n| 2 | 859 | 862 | 859 … 862 |\n| 3 | 1719 | 1726 | 1719 … 1726 |\n| 4 | 3439 | 3454 | 3439 … 3454 |\n| 5 | 6879 ≥ n | | stop → 1+2+4+8+16 = 31 |\n\n## 5. Traps\n- **Forgetting a itself** — the count includes a.\n- **Recursion with printing** visits nodes depth-first: 214, 429, 859, … — not sorted.\n- **Cutting the last level** at n−1 (sample `6 2` → only 5, not 6).\n\n## 6. Background\nLesson 06: array heap arithmetic — parent (i−1)/2, children 2i+1 and 2i+2. The descendants at depth d below a form the range [2ᵈ(a+1)−1, 2ᵈ(a+2)−2]. The same level-range idea solves Heap Before Node.", "th": "## 1. โจทย์บอกอะไร\nฮีปแบบไบนารีเก็บในอาร์เรย์โดยรากอยู่ index 0 โหนด a เป็น **บรรพบุรุษ** ของ b ถ้า a เป็นพ่อของ b หรือพ่อของพ่อของ b ไปเรื่อย ๆ แล้ว b เรียกว่า **ลูกหลาน** (descendant) ของ a ให้ n และ a (0 ≤ a < n ≤ 200,000) พิมพ์จำนวน m ของ a รวมลูกหลานทั้งหมด แล้วพิมพ์ index เรียงจากน้อยไปมาก\n\n## 2. จริง ๆ แล้วถามอะไร\nลูกของ i คือ 2i+1 และ 2i+2 ถ้าลงไปหนึ่งชั้นจากช่วงโหนดที่ติดกัน ก็จะได้อีกช่วงที่ติดกัน:\n\n```text\nn = 7, a = 2                     index layout\nlevel 0: [2, 2]                        0\nlevel 1: [5, 6]                     1     2\nlevel 2: [11, 14] → beyond n=7     3 4   5 6\nanswer: 3 / 2 5 6\n```\n\nเหมือนผังตระกูล: ลูกหลานรุ่นเดียวกันของ a นั่งติดกันเป็นแถวในอาร์เรย์เสมอ\n\n## 3. อะไร ทำไม อย่างไร\n- เริ่ม `lo = hi = a` ขณะที่ `lo < n`: พิมพ์ `lo .. min(hi, n−1)` แล้ว `lo = 2·lo + 1`, `hi = 2·hi + 2`\n- ช่วงใหม่เริ่มหลังช่วงเก่าจบเสมอ ผลลัพธ์จึงเรียงอยู่แล้ว\n- O(m) — แตะเฉพาะคำตอบ (brute force ที่เช็กทุก b โดยเดินขึ้นไปเป็น O(n log n) ก็ผ่านสำหรับ n = 2·10⁵ แต่วิธีนี้สะอาดกว่า)\n- ใช้ `long long` กับ lo/hi เพราะ hi เพิ่มเท่าตัวทุกชั้น อาจเกิน int ก่อนลูปหยุด\n\n## 4. โค้ดเฉลย\n{{code}}\n{{tests}}\n\n**ไล่ n = 5478, a = 214:**\n\n| ชั้น | lo | hi | พิมพ์ |\n|---|---|---|---|\n| 0 | 214 | 214 | 214 |\n| 1 | 429 | 430 | 429 430 |\n| 2 | 859 | 862 | 859 … 862 |\n| 3 | 1719 | 1726 | 1719 … 1726 |\n| 4 | 3439 | 3454 | 3439 … 3454 |\n| 5 | 6879 ≥ n | | หยุด → 1+2+4+8+16 = 31 |\n\n## 5. จุดที่มักพลาด\n- **ลืมนับ a เอง** — จำนวนรวม a ด้วย\n- **ใช้ recursion แล้วพิมพ์ทันที** จะได้ลำดับแบบลงลึกก่อน: 214, 429, 859, … — ไม่เรียง\n- **ตัดชั้นสุดท้าย** ที่ n−1 (ตัวอย่าง `6 2` → มีแค่ 5 ไม่มี 6)\n\n## 6. ความรู้พื้นฐาน\nบทที่ 06: เลขคณิตของฮีปในอาร์เรย์ — พ่อ (i−1)/2, ลูก 2i+1 และ 2i+2 ลูกหลานที่ลึกลงไป d ชั้นใต้ a คือช่วง [2ᵈ(a+1)−1, 2ᵈ(a+2)−2] แนวคิดช่วงต่อชั้นนี้ใช้แก้ข้อ Heap Before Node ด้วย"}}, {"id": "d63_q3a_rank_in_heap", "group": "heap", "lesson": "06 · Binary heap", "stars": 2, "kind": "student.h", "tags": ["CP::priority_queue", "const", "heap property", "pruned DFS"], "title": {"en": "Rank in Heap", "th": "ลำดับของข้อมูลในฮีป (Rank in Heap)"}, "blurb": {"en": "get_rank(pos) = how many pops until top() equals mData[pos] = how many elements are strictly more important. Count them by walking only the part of the heap that beats x.", "th": "get_rank(pos) = ต้อง pop กี่ครั้งกว่า top() จะเท่ากับ mData[pos] = จำนวนตัวที่สำคัญกว่าอย่างเคร่งครัด นับโดยเดินเฉพาะส่วนของฮีปที่ชนะ x"}, "tests": {"en": "the PDF sample and the all-equal example; a self-check on 6,000 random heaps (many duplicates, less and greater) comparing every position against actually popping a copy. ASan + UBSan clean.", "th": "ตัวอย่างใน PDF และตัวอย่างที่ค่าเท่ากันหมด; ตรวจตัวเองกับฮีปสุ่ม 6,000 ชุด (ค่าซ้ำเยอะ ทั้ง less และ greater) เทียบทุกตำแหน่งกับการ pop สำเนาจริง ไม่พบข้อผิดพลาดจาก ASan + UBSan"}, "files": [{"name": "student.h", "src": "#ifndef __STUDENT_H_\n#define __STUDENT_H_\n\n#include <vector>\nusing namespace std;\n\ntemplate <typename T,typename Comp>\nsize_t CP::priority_queue<T,Comp>::get_rank(size_t pos) const {\n  // x will be at the top after we pop every element that has HIGHER priority than x.\n  // So the answer = how many elements y have higher priority than x,\n  // i.e. mLess(x, y) is true  (\"x is less important than y\").\n  // Equal elements do NOT count: once only equals of x are left, top() already equals x.\n  const T &x = mData[pos];\n\n  // Heap property: a parent is never less important than its child.\n  // So if a node is NOT more important than x, none of its descendants is either:\n  // all nodes we must count form a connected piece hanging from the root.\n  // Walk that piece only (depth-first, with our own stack of indices) -> O(answer) time.\n  size_t count = 0;\n  std::vector<int> st;\n  if (mSize > 0 && mLess(x, mData[0])) st.push_back(0);\n  while (!st.empty()) {\n    int i = st.back();\n    st.pop_back();\n    count++;                                    // mData[i] is more important than x\n    int c1 = 2 * i + 1, c2 = 2 * i + 2;         // children of i in the array heap\n    if (c1 < (int)mSize && mLess(x, mData[c1])) st.push_back(c1);\n    if (c2 < (int)mSize && mLess(x, mData[c2])) st.push_back(c2);\n  }\n  return count;\n}\n\n#endif\n"}], "body": {"en": "## 1. What the problem says\nAdd `size_t get_rank(size_t pos) const`: let x = mData[pos]; return **how many pop()s are needed until top() equals x**. Don't change the heap. 0 ≤ pos ≤ mSize−1.\n\n- mData = [50,40,30,20,10]: get_rank(0) = 0, get_rank(3) = 3 (pop 50, 40, 30 → top 20).\n- Only the **value** matters: with [1,1,1,1,1] every rank is 0.\n- `main`: n m, the n values (pushed), then m positions; prints get_rank for each.\n\n## 2. What it really means\ntop() becomes equal to x as soon as every element **strictly more important** than x is gone. So the rank is a **count**: `#{ y : mLess(x, y) }`.\n\n```text\npush 1 2 3 4 5 → mData = 5 4 2 1 3\npos:   0  1  2  3  4\nx:     5  4  2  1  3\nrank:  0  1  3  4  2     (how many values are bigger)\n```\n\n## 3. What, why, how\n- **Simple O(n):** scan all of mData and count `mLess(x, mData[i])`. Correct and usually enough.\n- **Better (used here):** by the heap property, if a node does not beat x, none of its descendants does. So the nodes that beat x form a connected piece at the top. Walk only that piece with a small stack of indices: **O(rank)** time.\n- Use `mLess`, not `<`, so it works with any comparator.\n\n## 4. Solution\n{{code}}\n{{tests}}\n\n**Trace of get_rank(4)** — x = 3, mData = 5 4 2 1 3:\n\n| pop from stack | value | beats 3? | push children |\n|---|---|---|---|\n| start | | 5 > 3 | 0 |\n| 0 | 5 | count = 1 | 1 (4 > 3); 2 (2) no |\n| 1 | 4 | count = 2 | 3 (1) no; 4 (3) no — equal |\n| empty | | | **2** |\n\n## 5. Traps\n- **Counting `>=`** (or `!mLess(y, x)`) also counts equals and x itself → [1,1,1,1,1] would give 4, not 0.\n- **Actually popping** a copy works but costs O(n log n) per query.\n- **Returning `pos`** — slot index ≠ rank (the sample has pos 2 → rank 3).\n- **Using `<` instead of `mLess`** breaks min-heaps.\n\n## 6. Background\nLesson 06: the heap property means \"everything better than x\" is an **upper set** containing the root — a pruned traversal finds it in time proportional to its size. The same pruning gives \"list all elements > x in a heap\" in O(answer).", "th": "## 1. โจทย์บอกอะไร\nเพิ่ม `size_t get_rank(size_t pos) const`: ให้ x = mData[pos] คืน **จำนวนครั้งที่ต้อง pop() จนกว่า top() จะเท่ากับ x** ห้ามเปลี่ยนฮีป 0 ≤ pos ≤ mSize−1\n\n- mData = [50,40,30,20,10]: get_rank(0) = 0, get_rank(3) = 3 (pop 50, 40, 30 → top เป็น 20)\n- สนใจแค่ **ค่า**: ถ้าเป็น [1,1,1,1,1] ทุกตำแหน่งได้ 0\n- `main`: n m, ค่า n ตัว (push), แล้วตำแหน่ง m ตัว พิมพ์ get_rank ของแต่ละตัว\n\n## 2. จริง ๆ แล้วถามอะไร\ntop() จะเท่ากับ x ทันทีที่ทุกตัวที่ **สำคัญกว่า x อย่างเคร่งครัด** ถูก pop ออกหมด คำตอบจึงเป็น **การนับ**: `#{ y : mLess(x, y) }`\n\n```text\npush 1 2 3 4 5 → mData = 5 4 2 1 3\npos:   0  1  2  3  4\nx:     5  4  2  1  3\nrank:  0  1  3  4  2     (how many values are bigger)\n```\n\n## 3. อะไร ทำไม อย่างไร\n- **แบบง่าย O(n):** ไล่ mData ทั้งหมด นับ `mLess(x, mData[i])` ถูกและมักจะพอ\n- **แบบดีกว่า (ที่ใช้ในเฉลย):** ตามคุณสมบัติฮีป ถ้าโหนดหนึ่งไม่ชนะ x ลูกหลานของมันก็ไม่ชนะ x เช่นกัน ดังนั้นโหนดที่ชนะ x เป็นก้อนเดียวที่ติดอยู่ด้านบน เดินเฉพาะก้อนนั้นด้วยสแตกของ index: เวลา **O(rank)**\n- ใช้ `mLess` ไม่ใช่ `<` เพื่อให้ใช้ได้กับ comparator ใดก็ได้\n\n```text\n          5   ← ชนะ 3 ✓\n        /   \\\n   ✓  4      2  ✗ (ไม่ชนะ → ไม่ต้องลงไปดูลูกของมัน)\n     / \\\n    1   3   ✗ ✗\nนับได้ 2 ตัว → rank = 2\n```\n\n## 4. โค้ดเฉลย\n{{code}}\n{{tests}}\n\n**ไล่ get_rank(4)** — x = 3, mData = 5 4 2 1 3:\n\n| หยิบจากสแตก | ค่า | ชนะ 3? | ใส่ลูก |\n|---|---|---|---|\n| เริ่ม | | 5 > 3 | 0 |\n| 0 | 5 | count = 1 | 1 (4 > 3); 2 (2) ไม่ |\n| 1 | 4 | count = 2 | 3 (1) ไม่; 4 (3) ไม่ — เท่ากัน |\n| ว่าง | | | **2** |\n\n## 5. จุดที่มักพลาด\n- **นับ `>=`** (หรือ `!mLess(y, x)`) จะนับตัวที่เท่ากันและ x เองด้วย → [1,1,1,1,1] จะได้ 4 แทนที่จะเป็น 0\n- **pop สำเนาจริง** ใช้ได้แต่ O(n log n) ต่อคำถาม\n- **คืน `pos`** — index ช่องไม่ใช่ลำดับ (ตัวอย่าง pos 2 → rank 3)\n- **ใช้ `<` แทน `mLess`** ผิดกับ min-heap\n\n## 6. ความรู้พื้นฐาน\nบทที่ 06: คุณสมบัติฮีปทำให้ \"ทุกตัวที่ดีกว่า x\" เป็น **เซตบน** ที่มีรากอยู่ การเดินแบบตัดกิ่งจึงหาได้ในเวลาเท่ากับขนาดของมัน เทคนิคเดียวกันใช้ \"แสดงทุกค่าที่ > x ในฮีป\" ได้ใน O(คำตอบ)"}}, {"id": "d58_q3_list_replace", "group": "list", "lesson": "05 · Linked list", "stars": 2, "kind": "replace.h", "tags": ["CP::list", "insert / erase", "safe iteration"], "title": {"en": "List Replace", "th": "แทนที่ข้อมูลในลิสต์ (List Replace)"}, "blurb": {"en": "Replace every x in the list with a copy of all of y — remember the next ORIGINAL node before changing anything, so the inserted copies are never re-scanned.", "th": "แทนทุก x ในลิสต์ด้วยสำเนาของ y ทั้งหมด — จำโหนด \"เดิม\" ตัวถัดไปไว้ก่อนแก้อะไร เพื่อไม่ให้กลับไปตรวจสำเนาที่เพิ่งแทรก"}, "tests": {"en": "the starter main prints \"Right\"; 300 random lists (x at the front / end / everywhere, y empty, y containing x) checked forward, backward and by size against Python; also `l.replace(x, l)`. ASan + UBSan clean (no leaks, no use-after-free).", "th": "main เริ่มต้นพิมพ์ \"Right\"; สุ่ม 300 ลิสต์ (x อยู่หน้า/ท้าย/ทุกที่, y ว่าง, y มี x อยู่ด้วย) ตรวจทั้งเดินหน้า เดินถอยหลัง และขนาด เทียบกับ Python; รวมกรณี `l.replace(x, l)` ไม่พบข้อผิดพลาดจาก ASan + UBSan (ไม่ leak ไม่ใช้หน่วยความจำที่คืนแล้ว)"}, "files": [{"name": "replace.h", "src": "void replace(const T& x, list<T>& y) {\n  // This file is #included INSIDE class CP::list, so we can use node, mHeader, insert, erase directly.\n  // The list is circular with a header: the real nodes are mHeader->next ... mHeader->prev,\n  // and walking ->next from the last real node brings us back to mHeader.\n\n  if (&y == this) {                    // l.replace(x, l): copy y first, or we would loop forever\n    list<T> copy(y);\n    replace(x, copy);\n    return;\n  }\n\n  node *p = mHeader->next;             // p walks the ORIGINAL nodes from the first to the last\n  while (p != mHeader) {\n    node *nextOld = p->next;           // remember where to continue BEFORE we touch p\n    if (p->data == x) {\n      // Insert a copy of every element of y just before p, in y's order.\n      // q visits y's nodes from first (y.mHeader->next) to last, stopping at y's header.\n      for (node *q = y.mHeader->next; q != y.mHeader; q = q->next) {\n        insert(iterator(p), q->data);  // insert() links a new node between p->prev and p, mSize++\n      }\n      erase(iterator(p));              // unlink and delete p itself, mSize--\n    }\n    p = nextOld;                       // continue with the next ORIGINAL node:\n                                       // the copies of y we just inserted are never re-checked,\n                                       // so a y that contains x (e.g. y = 3 2 1, x = 2) is safe\n  }\n}\n"}], "body": {"en": "## 1. What the problem says\nAdd `replace(const T& x, list<T>& y)` to CP::list (a **circular doubly linked list with a header**): every element equal to x is replaced by **all elements of y**, in order. l = {9,2,2,4,2,7}, x = 2, y = {3,2,1} → {9,**3,2,1**,**3,2,1**,4,**3,2,1**,7}.\n\n- Write the code in `replace.h`, which is `#include`d **inside** the class.\n- No STL and no other CP classes — only CP::list.\n\n## 2. What it really means\nWalk the original nodes once. At each node equal to x: insert copies of y **before** it, then erase it.\n\n```text\nheader ⇄ 9 ⇄ [2] ⇄ 2 ⇄ 4 ⇄ 2 ⇄ 7 ⇄ header        p = the first 2\ninsert y before p:   9 ⇄ 3 ⇄ 2 ⇄ 1 ⇄ [2] ⇄ 2 ⇄ ...\nerase p:             9 ⇄ 3 ⇄ 2 ⇄ 1 ⇄ 2 ⇄ ...\ncontinue at the NEXT ORIGINAL node (the second 2), not at the inserted \"2\"\n```\n\n## 3. What, why, how\n- Save `nextOld = p->next` **before** touching p — after `erase(p)` the node is deleted and `p->next` is garbage.\n- Inserting before p never changes `nextOld`, so the copies of y are skipped automatically. This matters because y may contain x itself (y = {3,**2**,1}): re-scanning would loop forever.\n- `insert(iterator(p), v)` and `erase(iterator(p))` are the list's own members, so mSize stays correct.\n- Cost O(n + (#x)·|y|).\n- Edge case `l.replace(x, l)`: y is the list being modified — copy it first.\n\n## 4. Solution\n{{code}}\n{{tests}}\n\n**Trace** (l = 9 2 2 4 2 7, y = 3 2 1):\n\n| p | p->data == 2? | action | list after |\n|---|---|---|---|\n| 9 | no | — | 9 2 2 4 2 7 |\n| 2 (1st) | yes | insert 3 2 1, erase | 9 3 2 1 2 4 2 7 |\n| 2 (2nd) | yes | insert, erase | 9 3 2 1 3 2 1 4 2 7 |\n| 4 | no | — | |\n| 2 (3rd) | yes | insert, erase | 9 3 2 1 3 2 1 4 3 2 1 7 |\n| 7 | no | — | done |\n\n## 5. Traps\n- **`p = p->next` after erasing p** — use-after-free.\n- **Scanning with an iterator that also visits the inserted nodes** — with y containing x it never ends.\n- **Linking y's own nodes** into l instead of copies — y must stay intact (and its nodes would be in two lists).\n- **Forgetting mSize** when re-linking by hand; using insert/erase avoids this.\n\n## 6. Background\nLesson 05: in a circular list with a header, `mHeader->next` is the first node, `mHeader->prev` the last, and \"end\" is the header itself — no NULL checks needed. Rule for modifying while iterating: **save the next pointer first**.", "th": "## 1. โจทย์บอกอะไร\nเพิ่ม `replace(const T& x, list<T>& y)` ให้ CP::list (**ลิสต์สองทางแบบวงกลมที่มี header**): ทุกตัวที่เท่ากับ x ให้แทนด้วย **ข้อมูลทั้งหมดของ y** ตามลำดับ l = {9,2,2,4,2,7}, x = 2, y = {3,2,1} → {9,**3,2,1**,**3,2,1**,4,**3,2,1**,7}\n\n- เขียนโค้ดใน `replace.h` ซึ่งถูก `#include` **อยู่ในคลาส**\n- ห้ามใช้ STL และคลาส CP อื่น — ใช้ได้แค่ CP::list\n\n## 2. จริง ๆ แล้วถามอะไร\nเดินผ่านโหนดเดิมรอบเดียว ที่โหนดที่เท่ากับ x: แทรกสำเนาของ y **ก่อน** มัน แล้วลบมันทิ้ง\n\n```text\nheader ⇄ 9 ⇄ [2] ⇄ 2 ⇄ 4 ⇄ 2 ⇄ 7 ⇄ header        p = the first 2\ninsert y before p:   9 ⇄ 3 ⇄ 2 ⇄ 1 ⇄ [2] ⇄ 2 ⇄ ...\nerase p:             9 ⇄ 3 ⇄ 2 ⇄ 1 ⇄ 2 ⇄ ...\ncontinue at the NEXT ORIGINAL node (the second 2), not at the inserted \"2\"\n```\n\nเหมือนรถไฟ: ปลดตู้ที่ต้องเปลี่ยนออก แล้วต่อขบวนตู้ใหม่เข้าไปแทน แต่ต้องจดไว้ก่อนว่าตู้ถัดไปของขบวนเดิมคือคันไหน\n\n## 3. อะไร ทำไม อย่างไร\n- เก็บ `nextOld = p->next` **ก่อน** แตะ p — หลัง `erase(p)` โหนดถูก delete แล้ว `p->next` เป็นขยะ\n- การแทรกก่อน p ไม่เปลี่ยน `nextOld` สำเนาของ y จึงถูกข้ามโดยอัตโนมัติ สำคัญมากเพราะ y อาจมี x อยู่ด้วย (y = {3,**2**,1}): ถ้ากลับไปตรวจจะวนไม่จบ\n- `insert(iterator(p), v)` และ `erase(iterator(p))` เป็นฟังก์ชันของลิสต์เอง mSize จึงถูกต้องเสมอ\n- เวลา O(n + (จำนวน x)·|y|)\n- กรณีพิเศษ `l.replace(x, l)`: y คือลิสต์ที่กำลังแก้อยู่ — คัดลอกก่อน\n\n## 4. โค้ดเฉลย\n{{code}}\n{{tests}}\n\n**ไล่ตัวอย่าง** (l = 9 2 2 4 2 7, y = 3 2 1):\n\n| p | p->data == 2? | ทำอะไร | ลิสต์หลังทำ |\n|---|---|---|---|\n| 9 | ไม่ | — | 9 2 2 4 2 7 |\n| 2 (ตัวที่ 1) | ใช่ | แทรก 3 2 1, ลบ | 9 3 2 1 2 4 2 7 |\n| 2 (ตัวที่ 2) | ใช่ | แทรก, ลบ | 9 3 2 1 3 2 1 4 2 7 |\n| 4 | ไม่ | — | |\n| 2 (ตัวที่ 3) | ใช่ | แทรก, ลบ | 9 3 2 1 3 2 1 4 3 2 1 7 |\n| 7 | ไม่ | — | เสร็จ |\n\n## 5. จุดที่มักพลาด\n- **`p = p->next` หลังลบ p** — ใช้หน่วยความจำที่คืนไปแล้ว\n- **เดินด้วย iterator ที่ไปเจอโหนดที่เพิ่งแทรก** — ถ้า y มี x จะไม่มีวันจบ\n- **เอาโหนดของ y มาต่อตรง ๆ** แทนการคัดลอก — y ต้องอยู่ครบเหมือนเดิม (และโหนดจะอยู่สองลิสต์พร้อมกัน)\n- **ลืมแก้ mSize** ตอนต่อพอยน์เตอร์เอง การใช้ insert/erase ช่วยเลี่ยงปัญหานี้\n\n## 6. ความรู้พื้นฐาน\nบทที่ 05: ในลิสต์วงกลมที่มี header `mHeader->next` คือโหนดแรก `mHeader->prev` คือโหนดสุดท้าย และ \"end\" คือ header เอง — ไม่ต้องเช็ก NULL กฎการแก้ไขขณะเดินลิสต์: **เก็บพอยน์เตอร์ตัวถัดไปไว้ก่อนเสมอ**"}}, {"id": "d61_q2_splitlist", "group": "list", "lesson": "05 · Linked list", "stars": 2, "kind": "student.h", "tags": ["CP::list", "pointer surgery", "no new nodes"], "title": {"en": "Split List", "th": "แบ่งลิสต์ (Split List)"}, "blurb": {"en": "Move the first half of *this to the end of list1 and the second half to the end of list2 — only by re-linking the existing nodes.", "th": "ย้ายครึ่งแรกของ *this ไปต่อท้าย list1 และครึ่งหลังไปต่อท้าย list2 — ด้วยการต่อพอยน์เตอร์ของโหนดเดิมเท่านั้น"}, "tests": {"en": "the PDF example; 300 random triples of lists (empty *this, size 1, odd / even, empty targets) checked forward, backward and by size; the harness also checks that the node addresses before and after are exactly the same (no node created or destroyed). ASan + UBSan clean.", "th": "ตัวอย่างใน PDF; สุ่มลิสต์สามตัว 300 ชุด (*this ว่าง, ขนาด 1, คี่ / คู่, ลิสต์ปลายทางว่าง) ตรวจทั้งเดินหน้า ถอยหลัง และขนาด; โปรแกรมทดสอบยังเช็กว่าที่อยู่ของโหนดก่อนและหลังเหมือนกันทุกตัว (ไม่มีการสร้างหรือลบโหนด) ไม่พบข้อผิดพลาดจาก ASan + UBSan"}, "files": [{"name": "student.h", "src": "void splitList(list<T>& list1, list<T>& list2) {\n    // No new nodes allowed: we only re-link existing ones.\n    // Circular list with header: real nodes are mHeader->next ... mHeader->prev.\n    int n = mSize;\n    if (n == 0) return;                       // nothing to move\n    int k = (n + 1) / 2;                      // first half (the bigger one when n is odd)\n\n    // 1) Find the last node of the first half.\n    //    i visits 1, 2, ..., k-1: each step moves lastA one node forward from the first node.\n    node *firstA = mHeader->next;\n    node *lastA  = firstA;\n    for (int i = 1; i <= k - 1; i++) {\n        lastA = lastA->next;\n    }\n    node *firstB = lastA->next;               // == mHeader when n == 1 (second half empty)\n    node *lastB  = mHeader->prev;\n\n    // 2) Hang firstA .. lastA after the current last node of list1.\n    node *t1 = list1.mHeader->prev;           // list1's last node (or its header if list1 is empty)\n    t1->next = firstA;\n    firstA->prev = t1;\n    lastA->next = list1.mHeader;\n    list1.mHeader->prev = lastA;\n    list1.mSize += k;\n\n    // 3) Hang firstB .. lastB after the current last node of list2 (only if the second half exists).\n    if (n - k > 0) {\n        node *t2 = list2.mHeader->prev;\n        t2->next = firstB;\n        firstB->prev = t2;\n        lastB->next = list2.mHeader;\n        list2.mHeader->prev = lastB;\n        list2.mSize += n - k;\n    }\n\n    // 4) *this is now empty: its header points to itself both ways.\n    mHeader->next = mHeader;\n    mHeader->prev = mHeader;\n    mSize = 0;\n}\n"}], "body": {"en": "## 1. What the problem says\nAdd `void splitList(list<T>& list1, list<T>& list2)`: move the **first half** of *this to the end of list1 and the **second half** to the end of list2. If the size is odd, **list1 gets the extra one**. Afterwards *this is empty.\n\n- x = ⟨1,7,9,10,2,6,3⟩, a = ⟨1,2⟩, b = ⟨3,4,5⟩ → a = ⟨1,2,1,7,9,10⟩, b = ⟨3,4,5,2,6,3⟩, x = ⟨⟩.\n- **No new nodes**, directly or indirectly (no new, insert, push_back, no new list) → score 0. Only pointer changes. ≤ 100,000 elements.\n\n## 2. What it really means\nCut the ring of *this into two chains and splice each chain onto the end of another ring.\n\n```text\nthis:  H ⇄ 1 ⇄ 7 ⇄ 9 ⇄ 10 ⇄ 2 ⇄ 6 ⇄ 3 ⇄ H        n = 7, k = 4\n            firstA        lastA  firstB     lastB\nlist1: H1 ⇄ 1 ⇄ 2 ⇄ H1   →   H1 ⇄ 1 ⇄ 2 ⇄ [1 ⇄ 7 ⇄ 9 ⇄ 10] ⇄ H1\nlist2: H2 ⇄ 3 ⇄ 4 ⇄ 5 ⇄ H2 → H2 ⇄ 3 ⇄ 4 ⇄ 5 ⇄ [2 ⇄ 6 ⇄ 3] ⇄ H2\nthis:  H ⇄ H (empty)\n```\n\n## 3. What, why, how\n1. k = ⌈n/2⌉ = (n+1)/2. Walk k−1 steps from the first node to get lastA; firstB = lastA->next; lastB = mHeader->prev.\n2. Splicing a chain [f..l] after the last node t of a list with header H takes **4 pointer writes**: `t->next = f; f->prev = t; l->next = H; H->prev = l;` plus updating mSize.\n3. Do it for list1 (always) and list2 (only if n − k > 0).\n4. Reset *this: `mHeader->next = mHeader->prev = mHeader; mSize = 0`.\n- O(n) for finding the middle; the moves themselves are O(1).\n\n## 4. Solution\n{{code}}\n{{tests}}\n\n**Pointer writes for list1 in the example** (t = node \"2\" of list1):\n\n| write | meaning |\n|---|---|\n| t->next = firstA (1) | list1's old last now points to the moved chain |\n| firstA->prev = t | the chain points back |\n| lastA (10)->next = H1 | the chain ends at list1's header |\n| H1->prev = lastA | list1's new last is 10 |\n\n## 5. Traps\n- **Using push_back / insert** — creates nodes, scores 0.\n- **Odd sizes:** k = n/2 gives the extra element to list2 — wrong; use (n+1)/2.\n- **n = 1:** the second half is empty; firstB is the header itself — don't splice it.\n- **Forgetting mSize** of list1, list2 and *this.\n- **Leaving the header of `*this` pointing to moved nodes** → printing *this walks into list1.\n\n## 6. Background\nLesson 05: the strength of linked lists is **O(1) splicing** — moving a whole chain costs a constant number of pointer writes, whatever its length. `std::list::splice` does exactly this.", "th": "## 1. โจทย์บอกอะไร\nเพิ่ม `void splitList(list<T>& list1, list<T>& list2)`: ย้าย **ครึ่งแรก** ของ *this ไปต่อท้าย list1 และ **ครึ่งหลัง** ไปต่อท้าย list2 ถ้าจำนวนเป็นคี่ **list1 ได้มากกว่าหนึ่งตัว** หลังทำแล้ว *this ว่าง\n\n- x = ⟨1,7,9,10,2,6,3⟩, a = ⟨1,2⟩, b = ⟨3,4,5⟩ → a = ⟨1,2,1,7,9,10⟩, b = ⟨3,4,5,2,6,3⟩, x = ⟨⟩\n- **ห้ามสร้างโหนดใหม่** ทั้งทางตรงและทางอ้อม (ห้าม new, insert, push_back, ห้ามสร้าง list ใหม่) → ได้ 0 ทำได้แค่แก้พอยน์เตอร์ ข้อมูลไม่เกิน 100,000 ตัว\n\n## 2. จริง ๆ แล้วถามอะไร\nตัดวงของ *this เป็นสองสาย แล้วเอาแต่ละสายไปต่อท้ายวงของอีกลิสต์\n\n```text\nthis:  H ⇄ 1 ⇄ 7 ⇄ 9 ⇄ 10 ⇄ 2 ⇄ 6 ⇄ 3 ⇄ H        n = 7, k = 4\n            firstA        lastA  firstB     lastB\nlist1: H1 ⇄ 1 ⇄ 2 ⇄ H1   →   H1 ⇄ 1 ⇄ 2 ⇄ [1 ⇄ 7 ⇄ 9 ⇄ 10] ⇄ H1\nlist2: H2 ⇄ 3 ⇄ 4 ⇄ 5 ⇄ H2 → H2 ⇄ 3 ⇄ 4 ⇄ 5 ⇄ [2 ⇄ 6 ⇄ 3] ⇄ H2\nthis:  H ⇄ H (empty)\n```\n\nเหมือนตัดสร้อยลูกปัดเป็นสองท่อน แล้วเอาแต่ละท่อนไปต่อปลายสร้อยอีกเส้น ไม่มีลูกปัดใหม่เกิดขึ้นเลย\n\n## 3. อะไร ทำไม อย่างไร\n1. k = ⌈n/2⌉ = (n+1)/2 เดิน k−1 ก้าวจากโหนดแรกได้ lastA; firstB = lastA->next; lastB = mHeader->prev\n2. การต่อสาย [f..l] หลังโหนดสุดท้าย t ของลิสต์ที่มี header H ใช้ **เขียนพอยน์เตอร์ 4 ครั้ง**: `t->next = f; f->prev = t; l->next = H; H->prev = l;` แล้วแก้ mSize\n3. ทำกับ list1 (เสมอ) และ list2 (เฉพาะเมื่อ n − k > 0)\n4. รีเซ็ต *this: `mHeader->next = mHeader->prev = mHeader; mSize = 0`\n- O(n) สำหรับหาจุดกึ่งกลาง ส่วนการย้ายเป็น O(1)\n\n## 4. โค้ดเฉลย\n{{code}}\n{{tests}}\n\n**การเขียนพอยน์เตอร์ของ list1 ในตัวอย่าง** (t = โหนด \"2\" ของ list1):\n\n| เขียน | ความหมาย |\n|---|---|\n| t->next = firstA (1) | ตัวสุดท้ายเดิมของ list1 ชี้ไปที่สายที่ย้ายมา |\n| firstA->prev = t | สายชี้ย้อนกลับ |\n| lastA (10)->next = H1 | สายจบที่ header ของ list1 |\n| H1->prev = lastA | ตัวสุดท้ายใหม่ของ list1 คือ 10 |\n\n## 5. จุดที่มักพลาด\n- **ใช้ push_back / insert** — สร้างโหนด ได้ 0\n- **จำนวนคี่:** k = n/2 ทำให้ list2 ได้ตัวเกิน — ผิด ต้องใช้ (n+1)/2\n- **n = 1:** ครึ่งหลังว่าง firstB คือ header เอง — อย่าเอาไปต่อ\n- **ลืมแก้ mSize** ของ list1, list2 และ *this\n- **ปล่อยให้ header ของ *this ยังชี้ไปที่โหนดที่ย้ายแล้ว** → พิมพ์ *this จะเดินเข้าไปใน list1\n\n## 6. ความรู้พื้นฐาน\nบทที่ 05: จุดเด่นของลิสต์โยงคือ **ต่อ/ตัดได้ใน O(1)** — ย้ายทั้งสายใช้การเขียนพอยน์เตอร์จำนวนคงที่ ไม่ว่าสายจะยาวแค่ไหน `std::list::splice` ทำแบบนี้พอดี"}}, {"id": "d57_q3_zuma", "group": "list", "lesson": "05 · Linked list / two pointers", "stars": 3, "kind": "program", "tags": ["simulation", "two pointers", "chain reaction"], "title": {"en": "Zuma", "th": "เกมซูมา (Zuma)"}, "blurb": {"en": "Shoot one bead into a string of up to 10⁶ beads and simulate the chain of explosions — the result is always \"a prefix + a suffix\", so two pointers moving outward solve it in O(N).", "th": "ยิงลูกปัดหนึ่งลูกเข้าไปในสายลูกปัดยาวถึง 10⁶ แล้วจำลองการระเบิดต่อเนื่อง — ผลลัพธ์คือ \"ส่วนหน้า + ส่วนหลัง\" เสมอ จึงใช้ตัวชี้สองตัวเดินออกด้านนอกได้ใน O(N)"}, "tests": {"en": "all 4 PDF samples (including one where everything explodes → empty line); 400 random strings with few colours against a direct Python simulation that really deletes beads; N = 10⁶ in 0.08 s.", "th": "ตัวอย่างทั้ง 4 ชุดใน PDF (รวมกรณีที่ระเบิดหมด → บรรทัดว่าง); สุ่มสายที่มีไม่กี่สี 400 ชุด เทียบกับการจำลองใน Python ที่ลบลูกปัดจริง; N = 10⁶ ใช้ 0.08 วินาที"}, "files": [{"name": "main.cpp", "src": "#include <iostream>\n#include <vector>\nusing namespace std;\n\nint main() {\n    ios_base::sync_with_stdio(false); cin.tie(0);\n\n    int n, k, v;\n    cin >> n >> k >> v;\n    vector<int> a(n);\n    // i visits 0 .. n-1: read the beads from first to last\n    for (int i = 0; i < n; i++) cin >> a[i];\n\n    // We never really insert: the new bead sits \"between a[k-1] and a[k]\".\n    // The final string is always   a[0 .. L]  +  a[R .. n-1]   (with the new bead in the\n    // middle only if nothing explodes). L = last kept bead on the left, R = first kept on the right.\n\n    // 1) The run of colour v around the new bead.\n    int l = k - 1;                         // l walks LEFT from k-1 while the bead has colour v\n    while (l >= 0 && a[l] == v) l--;\n    int r = k;                             // r walks RIGHT from k while the bead has colour v\n    while (r < n && a[r] == v) r++;\n    int run = (k - 1 - l) + (r - k) + 1;   // left part + right part + the new bead\n\n    if (run < 3) {\n        // nothing explodes: print a[0..k-1], v, a[k..n-1]\n        // i visits 0 .. n (n+1 beads in total); position k is the new bead\n        bool first = true;\n        for (int i = 0; i <= n; i++) {\n            int x = (i < k) ? a[i] : (i == k ? v : a[i - 1]);\n            if (!first) cout << ' ';\n            cout << x;\n            first = false;\n        }\n        cout << '\\n';\n        return 0;\n    }\n\n    // 2) The run exploded: the two sides slide together. Keep exploding while the two\n    //    beads that meet have the SAME colour and that colour now forms a run of >= 3.\n    int L = l, R = r;\n    while (L >= 0 && R < n && a[L] == a[R]) {\n        int c = a[L];\n        int l2 = L;                        // l2 walks left over the run of colour c\n        while (l2 >= 0 && a[l2] == c) l2--;\n        int r2 = R;                        // r2 walks right over the run of colour c\n        while (r2 < n && a[r2] == c) r2++;\n        if ((L - l2) + (r2 - R) < 3) break;   // they meet, but only 2 beads: no explosion\n        L = l2;                            // the whole run disappears\n        R = r2;\n    }\n\n    // 3) Print a[0..L] then a[R..n-1]. Every bead is visited at most a constant number of times: O(n).\n    bool first = true;\n    for (int i = 0; i <= L; i++) {         // i visits 0 .. L (left part, left to right)\n        if (!first) cout << ' ';\n        cout << a[i];\n        first = false;\n    }\n    for (int i = R; i < n; i++) {          // i visits R .. n-1 (right part, left to right)\n        if (!first) cout << ' ';\n        cout << a[i];\n        first = false;\n    }\n    cout << '\\n';\n}\n"}], "body": {"en": "## 1. What the problem says\nA string of N coloured beads (N ≤ 10⁶). A bead of colour V is shot in at position K (0 ≤ K ≤ N: it goes before bead K). Then:\n\n- If the new bead is part of a run of **≥ 3 beads of the same colour**, that run explodes and the two sides slide together.\n- If the two beads that **meet** have the same colour and their combined run is ≥ 3, that run explodes too — repeatedly.\n- Runs of ≥ 3 that existed from the start, or that meet with **different** colours, do **not** explode.\n- Print the remaining beads (an empty line if none).\n\n## 2. What it really means\nEverything that explodes is one contiguous block around the shot. The answer is always `a[0..L]` + `a[R..N−1]`.\n\n```text\n1 3 1 4 4 1 1 5 5 5,  shoot 4 at K = 5\n1 3 1 4 4 [4] 1 1 5 5 5   run of 4s = 3   → explode\n1 3 1 | 1 1 5 5 5         1 meets 1, run = 3 → explode\n1 3 | 5 5 5               3 meets 5: different → stop\nanswer: 1 3 5 5 5\n```\n\n## 3. What, why, how\n- **Don't delete anything.** Keep L = last surviving index on the left, R = first surviving index on the right.\n- Step 1: from the shot, extend left over beads == V and right over beads == V. If the run (with the new bead) < 3, nothing explodes — print the string with V inserted.\n- Step 2: while `a[L] == a[R]`: extend over that colour on both sides; if the combined run ≥ 3, move L and R past it; else stop.\n- Each bead is passed over at most once → **O(N)**. A real `std::list` simulation also works (erase is O(1)), but you'd still need the same \"only where they meet\" logic.\n\n## 4. Solution\n{{code}}\n{{tests}}\n\n**Trace of sample 3** (`1 1 4 4 4 1 1`, shoot 4 at K = 2):\n\n| step | L | R | meeting colours | run | result |\n|---|---|---|---|---|---|\n| shot: 4s at 2,3,4 + new | 1 | 5 | — | 4 | explode |\n| a[1]=1, a[5]=1 | −1 | 7 | 1 = 1 | 2 + 2 = 4 | explode |\n| L < 0 | | | | | stop → **empty** |\n\n## 5. Traps\n- **Exploding pre-existing runs** (`1 1 1 1 1`, shoot 4 → nothing happens).\n- **Checking only the shot run** — misses the chain reaction.\n- **Chain with different colours meeting:** `3 | 5 5 5` must not explode even though 5 5 5 is a run.\n- **Copying vectors on every explosion** (`erase` on a vector) → O(N²) for long chains.\n- **Printing a trailing space / nothing for the empty result** — print an empty line.\n\n## 6. Background\nTwo pointers moving outward from a centre (like expanding a palindrome). The key observation — \"the removed part is one contiguous block\" — turns a simulation that looks like it needs deletions into pure index arithmetic.", "th": "## 1. โจทย์บอกอะไร\nสายลูกปัดสีต่าง ๆ N ลูก (N ≤ 10⁶) ยิงลูกปัดสี V เข้าไปที่ตำแหน่ง K (0 ≤ K ≤ N: ไปอยู่ก่อนลูกที่ K) แล้ว:\n\n- ถ้าลูกใหม่อยู่ในกลุ่ม **สีเดียวกันติดกัน ≥ 3 ลูก** กลุ่มนั้นระเบิด และสองฝั่งไหลมาชนกัน\n- ถ้าลูกปัดสองลูกที่ **ชนกัน** สีเดียวกันและรวมกันเป็นกลุ่ม ≥ 3 ก็ระเบิดต่อ — ไปเรื่อย ๆ\n- กลุ่ม ≥ 3 ที่มีอยู่แต่แรก หรือที่ชนกันแต่ **คนละสี** จะ **ไม่** ระเบิด\n- พิมพ์ลูกปัดที่เหลือ (ถ้าไม่เหลือให้พิมพ์บรรทัดว่าง)\n\n## 2. จริง ๆ แล้วถามอะไร\nทุกอย่างที่ระเบิดเป็นก้อนเดียวติดกันรอบจุดที่ยิง คำตอบจึงเป็น `a[0..L]` + `a[R..N−1]` เสมอ\n\n```text\n1 3 1 4 4 1 1 5 5 5,  shoot 4 at K = 5\n1 3 1 4 4 [4] 1 1 5 5 5   run of 4s = 3   → explode\n1 3 1 | 1 1 5 5 5         1 meets 1, run = 3 → explode\n1 3 | 5 5 5               3 meets 5: different → stop\nanswer: 1 3 5 5 5\n```\n\nเหมือนรูที่ค่อย ๆ ขยายออกทั้งสองข้าง: L ถอยไปซ้าย R ถอยไปขวา จนกว่าสองฝั่งที่ชนกันจะคนละสีหรือไม่ครบ 3\n\n## 3. อะไร ทำไม อย่างไร\n- **ไม่ต้องลบอะไรจริง** เก็บแค่ L = index สุดท้ายที่รอดฝั่งซ้าย และ R = index แรกที่รอดฝั่งขวา\n- ขั้น 1: จากจุดยิง ขยายไปซ้ายบนลูกที่เป็นสี V และไปขวาบนลูกที่เป็นสี V ถ้ากลุ่ม (รวมลูกใหม่) < 3 ไม่มีอะไรระเบิด — พิมพ์สายที่แทรก V แล้ว\n- ขั้น 2: ขณะที่ `a[L] == a[R]`: ขยายบนสีนั้นทั้งสองฝั่ง ถ้ารวมกัน ≥ 3 ให้ขยับ L และ R ข้ามไป ไม่อย่างนั้นหยุด\n- แต่ละลูกถูกข้ามไม่เกินหนึ่งครั้ง → **O(N)** ใช้ `std::list` จำลองจริงก็ได้ (erase เป็น O(1)) แต่ก็ยังต้องใช้ตรรกะ \"เฉพาะจุดที่ชนกัน\" แบบเดียวกัน\n\n## 4. โค้ดเฉลย\n{{code}}\n{{tests}}\n\n**ไล่ตัวอย่างที่ 3** (`1 1 4 4 4 1 1` ยิง 4 ที่ K = 2):\n\n| ขั้น | L | R | สีที่ชนกัน | ขนาดกลุ่ม | ผล |\n|---|---|---|---|---|---|\n| ยิง: 4 ที่ 2,3,4 + ลูกใหม่ | 1 | 5 | — | 4 | ระเบิด |\n| a[1]=1, a[5]=1 | −1 | 7 | 1 = 1 | 2 + 2 = 4 | ระเบิด |\n| L < 0 | | | | | หยุด → **ว่าง** |\n\n## 5. จุดที่มักพลาด\n- **ให้กลุ่มที่มีอยู่แต่แรกระเบิด** (`1 1 1 1 1` ยิง 4 → ไม่มีอะไรเกิดขึ้น)\n- **เช็กแค่กลุ่มที่ยิง** — พลาดการระเบิดต่อเนื่อง\n- **ชนกันแต่คนละสี:** `3 | 5 5 5` ต้องไม่ระเบิด แม้ 5 5 5 จะติดกันสามลูก\n- **คัดลอก vector ทุกครั้งที่ระเบิด** (`erase` ใน vector) → O(N²) เมื่อระเบิดต่อเนื่องยาว\n- **ไม่พิมพ์อะไรเลยเมื่อว่าง** — ต้องพิมพ์บรรทัดว่าง\n\n## 6. ความรู้พื้นฐาน\nตัวชี้สองตัวที่เดินออกจากจุดกลาง (เหมือนการขยายหา palindrome) ข้อสังเกตสำคัญ — \"ส่วนที่หายไปเป็นก้อนเดียวติดกัน\" — ทำให้การจำลองที่ดูเหมือนต้องลบข้อมูล กลายเป็นการคำนวณ index ล้วน ๆ"}}, {"id": "ds04_playlist", "group": "list", "lesson": "05 · Linked list", "stars": 2, "kind": "whole file (reorder only)", "tags": ["CP::list", "unlink / relink", "stable order"], "title": {"en": "Playlist Management", "th": "จัดการเพลย์ลิสต์ (Playlist)"}, "blurb": {"en": "Move the songs at the selected positions so they sit, in order, at position pos — find the target node first, then unlink each selected node and link it just before the target.", "th": "ย้ายเพลงที่ตำแหน่งที่เลือกไปไว้ที่ตำแหน่ง pos ตามลำดับเดิม — หาโหนดเป้าหมายก่อน แล้วปลดแต่ละโหนดที่เลือกไปต่อก่อนเป้าหมาย"}, "tests": {"en": "the PDF sample and all 4 examples in the text; 300 random playlists, selections and valid pos values against a Python model. The program's own `check()` verifies every prev/next link, and the list is printed both ways.", "th": "ตัวอย่างใน PDF และตัวอย่างทั้ง 4 ในเนื้อโจทย์; สุ่มเพลย์ลิสต์ การเลือก และ pos ที่ถูกต้อง 300 ชุดเทียบกับโมเดล Python; `check()` ของโปรแกรมตรวจลิงก์ prev/next ทุกตัว และพิมพ์ลิสต์ทั้งสองทิศ"}, "files": [{"name": "attachment.h", "src": "/*\nTASK: ds55b_quiz1_photolist\n*/\n\n#include <stdio.h>\n#include <stdlib.h>\n#include <iostream>\n#include <string>\n#include <vector>\n#include <algorithm>\n\nnamespace CP {\n\ntemplate <typename T>\nclass list\n{\n  protected:\n    class node {\n      friend class list;\n      public:\n        T data;\n        node *prev;\n        node *next;\n\n        node() :\n          data( T() ), prev( this ), next( this ) { }\n\n        node(const T& data,node* prev, node* next) :\n          data ( T(data) ), prev( prev ), next( next ) { }\n    };\n\n    class list_iterator {\n      friend class list;\n      protected:\n        node* ptr;\n      public:\n\n        list_iterator() : ptr( NULL ) { }\n\n        list_iterator(node *a) : ptr(a) { }\n\n        list_iterator& operator++() {\n          ptr = ptr->next;\n          return (*this);\n        }\n\n        list_iterator& operator--() {\n          ptr = ptr->prev;\n          return (*this);\n        }\n\n        list_iterator operator++(int) {\n          list_iterator tmp(*this);\n          operator++();\n          return tmp;\n\n        }\n        list_iterator operator--(int) {\n          list_iterator tmp(*this);\n          operator--();\n          return tmp;\n        }\n\n        T& operator*() { return ptr->data; }\n        T* operator->() { return &(ptr->data); }\n        bool operator==(const list_iterator& other) { return other.ptr == ptr; }\n        bool operator!=(const list_iterator& other) { return other.ptr != ptr; }\n    };\n\n  public:\n    typedef list_iterator iterator;\n\n  protected:\n    node *mHeader; // pointer to a header node\n    size_t mSize;\n\n\n  public:\n    //-------------- constructor & copy operator ----------\n\n    // copy constructor\n    list(list<T>& a) :\n      mHeader( new node() ), mSize( 0 ) {\n      for (iterator it = a.begin();it != a.end();it++) {\n        push_back(*it);\n      }\n    }\n\n    // default constructor\n    list() :\n      mHeader( new node() ), mSize( 0 ) { }\n\n    // copy assignment operator using copy-and-swap idiom\n    list<T>& operator=(list<T> other) {\n      // other is copy-constructed which will be destruct at the end of this scope\n      // we swa
