h a smaller size.", "th": "## 1. โจทย์บอกอะไร\n`mData` อาจมี **ช่องมากกว่าจำนวนข้อมูล** ให้เขียน `void compress()` ที่ทำให้ `mData` เป็นอาร์เรย์ขนาด **เท่ากับ mSize พอดี** และข้อมูลเหมือนเดิมทุกตัวตามลำดับเดิม อาจต้องจอง `mData` ใหม่และแก้ `mCap` (และอาจ `mSize`)\n\n- **ห้าม** ใช้ `operator=` หรือ copy constructor ของ CP::vector ใน `compress` แต่แก้ `mData`, `mCap`, `mSize` ได้โดยตรง\n- `main` push_back n ตัว เรียก `compress()` แล้วพิมพ์ `mSize`, `mCap` และข้อมูล\n\n## 2. จริง ๆ แล้วถามอะไร\nหลัง `push_back` capacity จะเพิ่มทีละเท่าตัว จึงมักใหญ่เกินกว่าที่ใช้:\n\n```text\nbefore:  mData ──► [ 1 | 2 | 3 | 4 | 5 | ? | ? | ? ]   mSize 5, mCap 8\nafter:   mData ──► [ 1 | 2 | 3 | 4 | 5 ]               mSize 5, mCap 5\n         (old 8-slot array is deleted)\n```\n\nเปรียบเหมือนย้ายของจากกล่องใหญ่ 8 ช่อง ไปใส่กล่องใหม่ 5 ช่องที่พอดี แล้วทิ้งกล่องเก่า\n\n## 3. อะไร ทำไม อย่างไร\n- อาร์เรย์ **หดในที่เดิมไม่ได้** — `new[]` ได้ขนาดตายตัว จึงต้อง: จองอาร์เรย์ใหม่ขนาด mSize, คัดลอกข้อมูล, `delete[]` อาร์เรย์เก่า, ให้ `mData` ชี้อาร์เรย์ใหม่, ตั้ง `mCap = mSize`\n- `mSize` **ไม่เปลี่ยน** เพราะเราเก็บข้อมูลทุกตัว\n- ถ้า `mCap == mSize` อยู่แล้วก็ return เลย (ไม่ต้องคัดลอก)\n- เวลา O(mSize) และคืนหน่วยความจำได้ `mCap − mSize` ช่อง\n\n## 4. โค้ดเฉลย\n{{code}}\n{{tests}}\n\n**ไล่ตัวอย่าง** (ข้อมูล `5` / `1 2 3 4 5`): push_back ทำให้ capacity โต 1 → 2 → 4 → 8\n\n| ขั้น | mData | mSize | mCap |\n|---|---|---|---|\n| ก่อน | เก่า: 1 2 3 4 5 ? ? ? | 5 | 8 |\n| `arr = new int[5]()` | arr: 0 0 0 0 0 | 5 | 8 |\n| คัดลอก i = 0..4 | arr: 1 2 3 4 5 | 5 | 8 |\n| `delete[] mData; mData = arr; mCap = mSize` | 1 2 3 4 5 | 5 | **5** |\n\n## 5. จุดที่มักพลาด\n- **ลืม `delete[] mData`** → memory leak (grader ไม่เห็น แต่คนตรวจเห็น)\n- **ใช้ `delete` แทน `delete[]`** กับอาร์เรย์ → undefined behaviour\n- **delete ก่อนคัดลอก** → คัดลอกจากหน่วยความจำที่คืนไปแล้ว\n- **เปลี่ยน `mSize`**: ต้องเท่าเดิม\n- **ใช้ `*this = ...` หรือ copy constructor** โจทย์ห้าม\n\n## 6. ความรู้พื้นฐาน\nบทที่ 03: CP::vector = **mData (อาร์เรย์บน heap) + mSize (ใช้อยู่) + mCap (จองไว้)** การขยายแบบเพิ่มเท่าตัวทำให้ `push_back` เฉลี่ย O(1) แต่แลกกับพื้นที่ที่อาจเปล่าถึง 50% `compress` ก็คือ `std::vector::shrink_to_fit` ขั้นตอน จอง–คัดลอก–ลบ–ย้ายพอยน์เตอร์ เหมือนที่ `expand` ทำ แค่ขนาดเล็กลง"}}, {"id": "d60_q1_v_uniq", "group": "vector", "lesson": "03 · Vector internals + 02 · STL (set)", "stars": 2, "kind": "student.h", "tags": ["CP::vector", "std::set", "compaction"], "title": {"en": "Vector Unique", "th": "ทำให้เวกเตอร์ไม่มีตัวซ้ำ (Vector Unique)"}, "blurb": {"en": "Remove later repeats while keeping the first occurrence and the order — compaction plus a set of \"seen\" values.", "th": "ลบตัวที่ซ้ำทีหลังออก โดยเก็บตัวที่เจอครั้งแรกและลำดับเดิมไว้ — บีบอัดอาร์เรย์ + set ของค่าที่เคยเห็น"}, "tests": {"en": "all 3 PDF samples and an empty vector; 300 random vectors with many repeats against a Python model; also tested with `string` and `float` (the real grader uses them) and 10⁶ ints in 0.05 s. ASan + UBSan clean.", "th": "ตัวอย่างทั้ง 3 ชุดใน PDF และเวกเตอร์ว่าง; สุ่ม 300 ชุดที่มีค่าซ้ำเยอะเทียบกับโมเดล Python; ทดสอบกับ `string` และ `float` ด้วย (grader จริงใช้) และ int 10⁶ ตัวใช้ 0.05 วินาที ไม่พบข้อผิดพลาดจาก ASan + UBSan"}, "files": [{"name": "student.h", "src": "#ifndef __STUDENT_H_\n#define __STUDENT_H_\n\n#include <set>\n\ntemplate <typename T>\nvoid CP::vector<T>::uniq() {\n  std::set<T> seen;        // every value we have already KEPT (works for int, float, string: they have <)\n  int n = mSize;           // old size, saved before we start shrinking\n  int w = 0;               // write index: next slot for a kept value\n\n  // r visits 0, 1, ..., n-1 (left to right) so the FIRST copy of each value is the one we meet first.\n  // w <= r always, so mData[w] = mData[r] only overwrites a slot we have already read.\n  for (int r = 0; r < n; r++) {\n    if (seen.count(mData[r]) == 0) {   // first time we see this value -> keep it\n      seen.insert(mData[r]);\n      mData[w] = mData[r];             // move it left into the next free slot\n      w++;\n    }\n    // else: a later repeat -> skip it (do not copy)\n  }\n\n  mSize = w;               // kept values are mData[0 .. w-1]; mCap is unchanged\n}\n\n#endif\n"}], "body": {"en": "## 1. What the problem says\nAdd `void uniq()` to CP::vector: after the call no value appears twice. If a value appears more than once, **the copies that appear later are removed**. Example: {5,1,2,3,1,1,4,1,1,2,3,5} → {5,1,2,3,4}.\n\n- It only has to work for **string, int, float** — all three can be compared with `<`.\n- The grader's `main` differs from yours: it also tests float and string.\n\n## 2. What it really means\nWalk left to right and keep a value **only the first time** you meet it. The kept values stay in their original order.\n\n```text\nv:     5  1  2  3  1  1  4  1  1  2  3  5\nkeep?  ✓  ✓  ✓  ✓  ✗  ✗  ✓  ✗  ✗  ✗  ✗  ✗\nresult 5  1  2  3  4\n```\n\n## 3. What, why, how\n- **Naive:** for each element, scan everything before it to check for a copy → O(n²). With n around 10⁵–10⁶ that is too slow.\n- **Sort + `std::unique`:** fast, but **destroys the order** (the answer must be 5 1 2 3 4, not 1 2 3 4 5).\n- **Right idea:** a `std::set<T> seen` answers \"have I kept this value already?\" in O(log n). Combine it with the **read/write compaction** from Erase Many: read index r, write index w ≤ r.\n- `set` works for all three types because it only needs `<` — that is the hint in the problem.\n- Cost: O(n log n) time, O(number of distinct values) extra memory.\n\n## 4. Solution\n{{code}}\n{{tests}}\n\n**Trace of sample 2** (`3 2 1 2 3`):\n\n| r | mData[r] | in seen? | action | w | mData[0..w−1] |\n|---|---|---|---|---|---|\n| 0 | 3 | no | keep → mData[0] | 1 | 3 |\n| 1 | 2 | no | keep → mData[1] | 2 | 3 2 |\n| 2 | 1 | no | keep → mData[2] | 3 | 3 2 1 |\n| 3 | 2 | yes | skip | 3 | 3 2 1 |\n| 4 | 3 | yes | skip | 3 | 3 2 1 |\n\n`mSize = 3` → `3 2 1`.\n\n## 5. Traps\n- **Sorting** changes the order → wrong answer.\n- **`unordered_set`** needs a hash; it works for these three types but `set` is the safe choice the hint points to.\n- **Erasing in place with `erase`** for every repeat → O(n²) shifting.\n- **Comparing floats with `==` in a nested loop** is what the set avoids; the set treats two floats as equal when neither is `<` the other.\n- Forgetting `#include <set>` at the top of `student.h`.\n\n## 6. Background\nLesson 03 compaction (read r, write w) + Lesson 02 (STL) **set as a \"seen\" table**. The same pair — \"first occurrence wins, keep order\" — shows up in many problems; with a hash set it is expected O(n).", "th": "## 1. โจทย์บอกอะไร\nเพิ่ม `void uniq()` ให้ CP::vector หลังเรียกแล้วจะไม่มีค่าใดซ้ำ ถ้าค่าใดมีมากกว่า 1 ตัว **ตัวที่ปรากฏทีหลังต้องหายไป** ตัวอย่าง: {5,1,2,3,1,1,4,1,1,2,3,5} → {5,1,2,3,4}\n\n- ต้องใช้ได้กับ **string, int, float** เท่านั้น — ทั้งสามแบบเปรียบเทียบด้วย `<` ได้\n- `main` ใน grader ต่างจากที่ได้รับ: ทดสอบ float และ string ด้วย\n\n## 2. จริง ๆ แล้วถามอะไร\nไล่จากซ้ายไปขวา เก็บค่าไว้ **เฉพาะครั้งแรก** ที่เจอ ค่าที่เก็บไว้ยังเรียงตามลำดับเดิม\n\n```text\nv:     5  1  2  3  1  1  4  1  1  2  3  5\nkeep?  ✓  ✓  ✓  ✓  ✗  ✗  ✓  ✗  ✗  ✗  ✗  ✗\nresult 5  1  2  3  4\n```\n\nเหมือนจดรายชื่อคนเข้างาน: ใครมาครั้งแรกจดชื่อ ใครเดินผ่านประตูซ้ำไม่ต้องจดอีก\n\n## 3. อะไร ทำไม อย่างไร\n- **วิธีตรง ๆ:** แต่ละตัวไล่ดูทุกตัวก่อนหน้าว่าซ้ำไหม → O(n²) ถ้า n ราว 10⁵–10⁶ ช้าเกินไป\n- **sort + `std::unique`:** เร็ว แต่ **ทำลายลำดับ** (คำตอบต้องเป็น 5 1 2 3 4 ไม่ใช่ 1 2 3 4 5)\n- **แนวคิดที่ถูก:** ใช้ `std::set<T> seen` ตอบว่า \"ค่านี้เก็บไปแล้วหรือยัง?\" ใน O(log n) ร่วมกับ **การบีบอัดแบบอ่าน/เขียน** จากข้อ Erase Many: index อ่าน r, index เขียน w ≤ r\n- `set` ใช้ได้กับทั้งสามชนิดเพราะต้องการแค่ `<` — นี่คือคำใบ้ในโจทย์\n- เวลา O(n log n) หน่วยความจำเพิ่ม O(จำนวนค่าที่ไม่ซ้ำ)\n\n```text\nseen = { }            r อ่านทีละตัว\nr=0: 3 ไม่อยู่ใน seen → เก็บ, seen = {3}\nr=1: 2 ไม่อยู่        → เก็บ, seen = {2,3}\nr=3: 2 อยู่แล้ว        → ข้าม\n```\n\n## 4. โค้ดเฉลย\n{{code}}\n{{tests}}\n\n**ไล่ตัวอย่างที่ 2** (`3 2 1 2 3`):\n\n| r | mData[r] | อยู่ใน seen? | ทำอะไร | w | mData[0..w−1] |\n|---|---|---|---|---|---|\n| 0 | 3 | ไม่ | เก็บ → mData[0] | 1 | 3 |\n| 1 | 2 | ไม่ | เก็บ → mData[1] | 2 | 3 2 |\n| 2 | 1 | ไม่ | เก็บ → mData[2] | 3 | 3 2 1 |\n| 3 | 2 | ใช่ | ข้าม | 3 | 3 2 1 |\n| 4 | 3 | ใช่ | ข้าม | 3 | 3 2 1 |\n\n`mSize = 3` → `3 2 1`\n\n## 5. จุดที่มักพลาด\n- **sort** ทำให้ลำดับเปลี่ยน → ผิด\n- **`unordered_set`** ต้องมี hash ใช้ได้กับสามชนิดนี้ แต่ `set` ปลอดภัยกว่าและตรงกับคำใบ้\n- **เรียก `erase` ทีละตัวที่ซ้ำ** → เลื่อนข้อมูล O(n²)\n- ลืม `#include <set>` ที่ด้านบนของ `student.h`\n\n## 6. ความรู้พื้นฐาน\nบทที่ 03 การบีบอัด (อ่าน r, เขียน w) + บทที่ 02 (STL) **ใช้ set เป็นตาราง \"เคยเห็นแล้ว\"** คู่นี้ — \"ตัวแรกชนะ เก็บลำดับเดิม\" — พบในโจทย์หลายข้อ ถ้าใช้ hash set จะเป็น O(n) โดยเฉลี่ย"}}, {"id": "d61_q1_ordered_set", "group": "search", "lesson": "02 · STL (set)", "stars": 1, "kind": "student.h", "tags": ["std::set", "templates", "order-preserving"], "title": {"en": "Union, Intersection of Ordered Set", "th": "ยูเนียนและอินเตอร์เซกชันของเซตแบบมีลำดับ (Ordered Set)"}, "blurb": {"en": "Union keeps A's order then B's leftovers; Intersect keeps A's order — a std::set gives O(log n) membership tests.", "th": "Union เก็บลำดับของ A แล้วต่อด้วยตัวที่เหลือของ B; Intersect เก็บลำดับของ A — ใช้ std::set เช็กสมาชิกใน O(log n)"}, "tests": {"en": "the starter main (expected `4 6 9 0 7 3 2 5` / `9 1 6`); 300 random pairs of sets (including empty ones) through a reading harness against a Python model; also instantiated with `string`. ASan + UBSan clean.", "th": "main เริ่มต้น (ผลที่ควรได้ `4 6 9 0 7 3 2 5` / `9 1 6`); สุ่มเซต 300 คู่ (รวมเซตว่าง) ผ่านโปรแกรมทดสอบเทียบกับโมเดล Python; ทดสอบกับ `string` ด้วย ไม่พบข้อผิดพลาดจาก ASan + UBSan"}, "files": [{"name": "student.h", "src": "#include <vector>\n#include <set>\nusing namespace std;\n\ntemplate <typename T>\nvector<T> Union(const vector<T>& A, const vector<T>& B) {\n    vector<T> v(A.begin(), A.end());          // 1) everything in A, in A's order\n    set<T> inA(A.begin(), A.end());           // fast \"is x in A?\" lookups, O(log n) each\n\n    // 2) i visits 0, 1, ..., B.size()-1 (B's order): append B[i] only if A does not have it.\n    //    B itself has no repeats (it is a set), so each value is appended at most once.\n    for (int i = 0; i < (int)B.size(); i++) {\n        if (inA.count(B[i]) == 0) v.push_back(B[i]);\n    }\n    return v;\n}\n\ntemplate <typename T>\nvector<T> Intersect(const vector<T>& A, const vector<T>& B) {\n    vector<T> v;\n    set<T> inB(B.begin(), B.end());           // fast \"is x in B?\" lookups\n\n    // i visits 0, 1, ..., A.size()-1 (A's order, because the answer must follow A's order):\n    // keep A[i] only if B also has it.\n    for (int i = 0; i < (int)A.size(); i++) {\n        if (inB.count(A[i]) > 0) v.push_back(A[i]);\n    }\n    return v;\n}\n"}], "body": {"en": "## 1. What the problem says\nAn **ordered set** is a list with no repeats where order matters (stored in `std::vector`). Write:\n\n- `Union(A,B)`: everything in A or B, and **A's items come before items only in B**. `Union(<4,6,9,0,7>, <0,3,2,4,5>) = <4,6,9,0,7,3,2,5>`.\n- `Intersect(A,B)`: items in both, **in A's order**. `Intersect(<3,9,0,1,6>, <4,6,9,1,7>) = <9,1,6>`.\n- A and B have ≤ 100,000 items; 5 s limit. Each test checks only one function. You may add includes/helpers in `student.h`.\n\n## 2. What it really means\nBoth are \"walk one list in order, and ask **is x in the other list?**\". That question must be fast.\n\n```text\nA = 4 6 9 0 7      B = 0 3 2 4 5\nUnion:     4 6 9 0 7 | 3 2 5      (B's items that A lacks, in B's order)\nIntersect of <3,9,0,1,6> and <4,6,9,1,7>:  9 1 6   (A's order)\n```\n\n## 3. What, why, how\n- **Naive:** for each x, scan the other vector → O(|A|·|B|) = 10¹⁰. Too slow even with 5 s.\n- **Right idea:** put the other list into a `std::set<T>` (O(n log n)), then each membership test is O(log n). Total O((|A| + |B|) log n).\n- **Don't sort the answer** — the order is part of the answer. The set is only a lookup table.\n- Works for any T with `<` (it's a template).\n\n## 4. Solution\n{{code}}\n{{tests}}\n\n**Trace of Union** (inA = {0,4,6,7,9}):\n\n| i | B[i] | in A? | v after |\n|---|---|---|---|\n| — | start | | 4 6 9 0 7 |\n| 0 | 0 | yes | skip |\n| 1 | 3 | no | 4 6 9 0 7 **3** |\n| 2 | 2 | no | … 3 **2** |\n| 3 | 4 | yes | skip |\n| 4 | 5 | no | … 3 2 **5** |\n\n## 5. Traps\n- **Using `set_union` / `set_intersection`**: they need *sorted* input and produce sorted output — wrong order.\n- **Returning a `set`** instead of a `vector` loses the order.\n- **Intersect in B's order**: the spec says A's order (`Intersect(A,B) ≠ Intersect(B,A)` in general).\n- **O(n·m) with `std::find`** passes small tests only.\n\n## 6. Background\nLesson 02 (STL): **set = fast membership**. Pattern: \"keep the order from a vector, answer 'have I seen it?' from a set\". Same idea as Vector Unique.", "th": "## 1. โจทย์บอกอะไร\n**เซตแบบมีลำดับ** คือรายการที่ไม่มีตัวซ้ำและลำดับมีความหมาย (เก็บใน `std::vector`) ให้เขียน:\n\n- `Union(A,B)`: ทุกตัวที่อยู่ใน A หรือ B โดย **ตัวของ A มาก่อนตัวที่มีแค่ใน B** `Union(<4,6,9,0,7>, <0,3,2,4,5>) = <4,6,9,0,7,3,2,5>`\n- `Intersect(A,B)`: ตัวที่อยู่ทั้งสองเซต **ตามลำดับของ A** `Intersect(<3,9,0,1,6>, <4,6,9,1,7>) = <9,1,6>`\n- A และ B มีไม่เกิน 100,000 ตัว เวลา 5 วินาที แต่ละชุดทดสอบตรวจแค่ฟังก์ชันเดียว เพิ่ม include/ฟังก์ชันช่วยใน `student.h` ได้\n\n## 2. จริง ๆ แล้วถามอะไร\nทั้งสองฟังก์ชันคือ \"ไล่ลิสต์หนึ่งตามลำดับ แล้วถามว่า **x อยู่ในอีกลิสต์ไหม?**\" คำถามนี้ต้องตอบเร็ว\n\n```text\nA = 4 6 9 0 7      B = 0 3 2 4 5\nUnion:     4 6 9 0 7 | 3 2 5      (B's items that A lacks, in B's order)\nIntersect of <3,9,0,1,6> and <4,6,9,1,7>:  9 1 6   (A's order)\n```\n\n## 3. อะไร ทำไม อย่างไร\n- **วิธีตรง ๆ:** แต่ละ x ไล่หาในอีก vector → O(|A|·|B|) = 10¹⁰ ช้าเกินแม้ให้ 5 วินาที\n- **แนวคิดที่ถูก:** ใส่อีกลิสต์ลง `std::set<T>` (O(n log n)) แล้วเช็กสมาชิกแต่ละครั้ง O(log n) รวม O((|A| + |B|) log n)\n- **อย่า sort คำตอบ** — ลำดับเป็นส่วนหนึ่งของคำตอบ set เป็นแค่ตารางสำหรับค้น\n- ใช้ได้กับ T ใดก็ได้ที่มี `<` (เป็น template)\n\n```text\nvector A (เก็บลำดับ)      set inA (ค้นเร็ว)\n[4][6][9][0][7]     →     {0, 4, 6, 7, 9}  ← เรียงในตัว ใช้ถาม \"มีไหม?\"\n```\n\n## 4. โค้ดเฉลย\n{{code}}\n{{tests}}\n\n**ไล่ Union** (inA = {0,4,6,7,9}):\n\n| i | B[i] | อยู่ใน A? | v หลังทำ |\n|---|---|---|---|\n| — | เริ่ม | | 4 6 9 0 7 |\n| 0 | 0 | ใช่ | ข้าม |\n| 1 | 3 | ไม่ | 4 6 9 0 7 **3** |\n| 2 | 2 | ไม่ | … 3 **2** |\n| 3 | 4 | ใช่ | ข้าม |\n| 4 | 5 | ไม่ | … 3 2 **5** |\n\n## 5. จุดที่มักพลาด\n- **ใช้ `set_union` / `set_intersection`**: ต้องการข้อมูลที่ *เรียงแล้ว* และให้ผลที่เรียงแล้ว — ลำดับผิด\n- **คืน `set`** แทน `vector` ทำให้ลำดับหาย\n- **Intersect ตามลำดับของ B**: โจทย์บอกให้ใช้ลำดับของ A (`Intersect(A,B) ≠ Intersect(B,A)` โดยทั่วไป)\n- **O(n·m) ด้วย `std::find`** ผ่านแค่ชุดเล็ก\n\n## 6. ความรู้พื้นฐาน\nบทที่ 02 (STL): **set = เช็กสมาชิกเร็ว** รูปแบบ: \"เก็บลำดับจาก vector ตอบว่า 'เคยเห็นไหม' จาก set\" แนวคิดเดียวกับข้อ Vector Unique"}}, {"id": "d62_q2b_vector_insert_many", "group": "vector", "lesson": "03 · Vector internals", "stars": 3, "kind": "student.h", "tags": ["CP::vector", "sort", "merge", "new array"], "title": {"en": "Insert Many to Vector", "th": "แทรกข้อมูลหลายตำแหน่ง (Insert Many)"}, "blurb": {"en": "Insert many (position, value) pairs given in ORIGINAL positions — sort them, then merge with the old array into a new one.", "th": "แทรกคู่ (ตำแหน่ง, ค่า) หลายคู่ที่อ้างตำแหน่ง \"เดิม\" — sort คู่เหล่านั้นแล้ว merge กับอาร์เรย์เดิมลงอาร์เรย์ใหม่"}, "tests": {"en": "the PDF sample and inserting into an empty vector; 300 random cases (all positions 0..n, any subset, unsorted) against a Python model; n = m = 10⁵ in 0.10 s. ASan + UBSan clean.", "th": "ตัวอย่างใน PDF และแทรกในเวกเตอร์ว่าง; สุ่ม 300 ชุด (ตำแหน่ง 0..n เลือกบางส่วน ไม่เรียง) เทียบกับโมเดล Python; n = m = 10⁵ ใช้ 0.10 วินาที ไม่พบข้อผิดพลาดจาก ASan + UBSan"}, "files": [{"name": "student.h", "src": "#ifndef __STUDENT_H_\n#define __STUDENT_H_\n\n#include <algorithm>\n\ntemplate <typename T>\nvoid CP::vector<T>::insert_many(CP::vector<std::pair<int,T>> data) {\n  // 1) Sort the requests by position (.first), so we can meet them in order while scanning v.\n  std::sort(data.begin(), data.end(),\n            [](const std::pair<int,T> &a, const std::pair<int,T> &b) {\n              return a.first < b.first;\n            });\n\n  int n = mSize;            // old size of v\n  int m = data.size();      // number of values to insert\n  T *arr = new T[n + m];    // new array, exactly big enough for old + new values\n\n  int j = 0;                // j = next request in data not inserted yet\n  int k = 0;                // k = next empty slot in arr\n\n  // 2) Merge. i visits 0, 1, ..., n-1 (left to right): every OLD index once.\n  //    Before copying old element i, first emit every request whose position is i\n  //    (positions refer to the ORIGINAL v, so \"position i\" means \"just before old element i\").\n  for (int i = 0; i < n; i++) {\n    // emit requests at position i (at most one, since positions are distinct; while is safe anyway)\n    while (j < m && data[j].first == i) {\n      arr[k] = data[j].second;\n      k++;\n      j++;\n    }\n    arr[k] = mData[i];      // then the old element i itself\n    k++;\n  }\n\n  // 3) Requests with position == n (insert at the very end) are still left.\n  //    j visits the remaining requests in order.\n  while (j < m) {\n    arr[k] = data[j].second;\n    k++;\n    j++;\n  }\n\n  // 4) Replace the old storage (no leak), update the members.\n  delete [] mData;\n  mData = arr;\n  mSize = n + m;\n  mCap  = n + m;\n}\n\n#endif\n"}], "body": {"en": "## 1. What the problem says\nAdd `void insert_many(CP::vector<pair<int,T>> data)`. Each pair means \"insert `.second` at position `.first`\", and **positions are positions in v before any insertion**. Example: v = {A,B,C,D,E,F}, data = {{0,X},{6,Y},{2,Z}} → {X,A,B,Z,C,D,E,F,Y}.\n\n- Positions are all different; a position may equal `v.size()` (insert at the end).\n- data is **not sorted**.\n- Input: n, the n values, m, then m lines `position value`. Output: the new v.\n\n## 2. What it really means\n\"Position p\" = \"just before old element p\". So read the old array once, and **before copying old element i, emit the new value whose position is i** (if any). Position n means \"after everything\".\n\n```text\nold v:      A   B   C   D   E   F\nindex:      0   1   2   3   4   5   6(end)\nrequests:   X       Z                Y\nresult:   X A   B Z C   D   E   F Y\n```\n\n## 3. What, why, how\n- **Naive:** call `insert` once per pair. Two problems: (1) every insert shifts the tail → O(n·m); (2) after the first insert, the old positions move, so you must insert from the **largest** position first.\n- **Right idea — merge:** sort data by position (O(m log m)), then fill a **new array of size n + m** with two pointers: i over the old elements, j over the sorted requests. Total O(n + m log m).\n- **How:**\n  1. `sort` data by `.first`.\n  2. `arr = new T[n + m]`; k = next free slot.\n  3. For i = 0 .. n−1: while `data[j].first == i`, put `data[j].second`; then put `mData[i]`.\n  4. Put the remaining requests (position n).\n  5. `delete[] mData`, `mData = arr`, `mSize = mCap = n + m`.\n\n## 4. Solution\n{{code}}\n{{tests}}\n\n**Trace of the sample** (v = 1 2 3 4 5 6; sorted data = (0,10) (2,12) (6,11)):\n\n| i | requests with pos = i | arr after this step |\n|---|---|---|\n| 0 | 10 | 10 **1** |\n| 1 | — | 10 1 **2** |\n| 2 | 12 | 10 1 2 12 **3** |\n| 3, 4, 5 | — | 10 1 2 12 3 **4 5 6** |\n| after loop | 11 (pos 6) | 10 1 2 12 3 4 5 6 **11** |\n\n## 5. Traps\n- **`k` and `j` must advance after each write** (`arr[k] = ...; k++; j++;`). If you write `arr[k] = data[j].second` without `k++`, the next write overwrites it; without `j++` the while never ends.\n- **Forgetting requests at position n** → the \"insert at end\" values disappear.\n- **Not sorting** → requests out of order are skipped by the merge.\n- **Inserting front-to-back with `insert`** → positions drift.\n- **Leaking** the old `mData`.\n\n## 6. Background\nLesson 03 + the **merge** step of merge sort: two sorted streams, two indices, one output. When updates are given relative to the original array, \"sort the updates, then sweep once\" is the standard trick (also Erase Many).", "th": "## 1. โจทย์บอกอะไร\nเพิ่ม `void insert_many(CP::vector<pair<int,T>> data)` แต่ละคู่แปลว่า \"แทรก `.second` ที่ตำแหน่ง `.first`\" โดย **ตำแหน่งคือตำแหน่งใน v ก่อนมีการแทรกใด ๆ** ตัวอย่าง: v = {A,B,C,D,E,F}, data = {{0,X},{6,Y},{2,Z}} → {X,A,B,Z,C,D,E,F,Y}\n\n- ตำแหน่งไม่ซ้ำกัน และอาจเท่ากับ `v.size()` (แทรกท้ายสุด)\n- data **ไม่ได้เรียงมา**\n- ข้อมูลนำเข้า: n, ค่า n ตัว, m แล้ว m บรรทัด `ตำแหน่ง ค่า` ผลลัพธ์: v ใหม่\n\n## 2. จริง ๆ แล้วถามอะไร\n\"ตำแหน่ง p\" = \"ก่อนข้อมูลเดิมตัวที่ p\" ดังนั้นอ่านอาร์เรย์เดิมรอบเดียว และ **ก่อนคัดลอกข้อมูลเดิมตัวที่ i ให้ใส่ค่าใหม่ที่ตำแหน่งเป็น i ก่อน** (ถ้ามี) ตำแหน่ง n คือ \"ต่อท้ายทั้งหมด\"\n\n```text\nold v:      A   B   C   D   E   F\nindex:      0   1   2   3   4   5   6(end)\nrequests:   X       Z                Y\nresult:   X A   B Z C   D   E   F Y\n```\n\nเหมือนสลับไพ่สองกอง: กองหนึ่งคือข้อมูลเดิม อีกกองคือคำขอที่เรียงตามตำแหน่งแล้ว หยิบลงกองใหม่ทีละใบตามลำดับ\n\n## 3. อะไร ทำไม อย่างไร\n- **วิธีตรง ๆ:** เรียก `insert` ทีละคู่ มีสองปัญหา: (1) ทุกครั้งต้องเลื่อนส่วนท้าย → O(n·m) (2) หลังแทรกตัวแรก ตำแหน่งเดิมจะคลาด ต้องแทรกจากตำแหน่ง **มากสุด** ก่อน\n- **แนวคิดที่ถูก — merge:** sort data ตามตำแหน่ง (O(m log m)) แล้วเติม **อาร์เรย์ใหม่ขนาด n + m** ด้วยตัวชี้สองตัว: i ไล่ข้อมูลเดิม j ไล่คำขอที่เรียงแล้ว รวม O(n + m log m)\n- **ขั้นตอน:**\n  1. `sort` data ตาม `.first`\n  2. `arr = new T[n + m]`; k = ช่องว่างถัดไป\n  3. i = 0 .. n−1: ขณะที่ `data[j].first == i` ใส่ `data[j].second` ก่อน แล้วค่อยใส่ `mData[i]`\n  4. ใส่คำขอที่เหลือ (ตำแหน่ง n)\n  5. `delete[] mData`, `mData = arr`, `mSize = mCap = n + m`\n\n## 4. โค้ดเฉลย\n{{code}}\n{{tests}}\n\n**ไล่ตัวอย่าง** (v = 1 2 3 4 5 6; data ที่เรียงแล้ว = (0,10) (2,12) (6,11)):\n\n| i | คำขอที่ pos = i | arr หลังขั้นนี้ |\n|---|---|---|\n| 0 | 10 | 10 **1** |\n| 1 | — | 10 1 **2** |\n| 2 | 12 | 10 1 2 12 **3** |\n| 3, 4, 5 | — | 10 1 2 12 3 **4 5 6** |\n| หลังลูป | 11 (pos 6) | 10 1 2 12 3 4 5 6 **11** |\n\n## 5. จุดที่มักพลาด\n- **`k` และ `j` ต้องเพิ่มหลังเขียนทุกครั้ง** (`arr[k] = ...; k++; j++;`) ถ้าไม่ `k++` ครั้งต่อไปจะเขียนทับช่องเดิม ถ้าไม่ `j++` ลูป while จะไม่จบ\n- **ลืมคำขอที่ตำแหน่ง n** → ค่าที่ต้องต่อท้ายหายไป\n- **ไม่ sort** → คำขอที่ไม่เรียงจะถูก merge ข้ามไป\n- **แทรกจากหน้าไปหลังด้วย `insert`** → ตำแหน่งคลาด\n- **ไม่ delete** `mData` เก่า → leak\n\n## 6. ความรู้พื้นฐาน\nบทที่ 03 + ขั้นตอน **merge** ของ merge sort: สองสายที่เรียงแล้ว สอง index หนึ่งผลลัพธ์ เมื่อคำสั่งแก้ไขอ้างอิงอาร์เรย์เดิม \"sort คำสั่งแล้วไล่ครั้งเดียว\" คือเทคนิคมาตรฐาน (เหมือนข้อ Erase Many)"}}, {"id": "d63_q1a_hiatus", "group": "search", "lesson": "08 · Binary search", "stars": 2, "kind": "program", "tags": ["encoding (year", "month)", "sort", "lower_bound"], "title": {"en": "Hiatus", "th": "นักเขียนหยุดพัก (Hiatus)"}, "blurb": {"en": "For each asked month: published that month → 0 0; before the first issue → −1 −1; else the latest issue before it. Encode months as one number, sort, lower_bound.", "th": "แต่ละเดือนที่ถาม: ตีพิมพ์เดือนนั้น → 0 0; ก่อนตอนแรก → −1 −1; ไม่อย่างนั้นตอบตอนล่าสุดก่อนหน้า แปลงปี-เดือนเป็นเลขเดียว sort แล้ว lower_bound"}, "tests": {"en": "both PDF samples; 300 random cases (asks before, between, after and exactly on issues) against a brute-force Python max(); n = m = 200,000 in 0.12 s.", "th": "ตัวอย่างใน PDF ทั้งสองชุด; สุ่ม 300 ชุด (ถามก่อน ระหว่าง หลัง และตรงเดือนที่ตีพิมพ์) เทียบกับ brute force ด้วย max() ใน Python; n = m = 200,000 ใช้ 0.12 วินาที"}, "files": [{"name": "main.cpp", "src": "#include <iostream>\n#include <vector>\n#include <algorithm>\nusing namespace std;\n\nint main() {\n    std::ios_base::sync_with_stdio(false); std::cin.tie(0);\n\n    int n, m;\n    cin >> n >> m;\n\n    // Encode (year, month) as ONE number that sorts in time order:\n    // key = year * 12 + (month - 1)   -> months of the same year are consecutive,\n    // and Dec of year y (y*12+11) is just before Jan of year y+1 ((y+1)*12+0).\n    vector<long long> pub(n);\n    // i visits 0, 1, ..., n-1: read each published (year, month) and encode it.\n    for (int i = 0; i < n; i++) {\n        long long a, b;\n        cin >> a >> b;\n        pub[i] = a * 12 + (b - 1);\n    }\n    sort(pub.begin(), pub.end());          // the input is NOT sorted (see sample 2)\n\n    // q visits 0, 1, ..., m-1: answer each question in input order.\n    for (int q = 0; q < m; q++) {\n        long long a, b;\n        cin >> a >> b;\n        long long key = a * 12 + (b - 1);\n\n        // idx = first published month that is >= the asked month\n        int idx = lower_bound(pub.begin(), pub.end(), key) - pub.begin();\n\n        if (idx < n && pub[idx] == key) {\n            cout << \"0 0\";                         // published exactly that month\n        } else if (idx == 0) {\n            cout << \"-1 -1\";                       // asked month is before the first publication\n        } else {\n            long long k = pub[idx - 1];            // latest publication strictly before the asked month\n            cout << k / 12 << ' ' << k % 12 + 1;   // decode back to year, month\n        }\n        if (q < m - 1) cout << ' ';\n    }\n    cout << '\\n';\n}\n"}], "body": {"en": "## 1. What the problem says\nA monthly comic author often skips months. You know the n (year, month) pairs when an issue was published (not sorted). For each of m questions (year, month):\n\n- if an issue was published **that month** → print `0 0`;\n- if the month is **before the first issue** → print `-1 -1`;\n- otherwise print the year and month of the **latest issue before** it.\n\nAll 2·m numbers go on **one line**, separated by spaces. 2 ≤ n, m ≤ 200,000; year 1..1,000,000.\n\n## 2. What it really means\n\"Find the predecessor of a value in a set\" — a classic binary-search job once the months are on one number line.\n\n```text\npublished: 2019-10, 2020-01, 2020-08\ntimeline:  ... 2019-10 ──── 2020-01 ──────── 2020-08 ────►\nask 2019-12:          ▲ latest before = 2019-10\nask 2020-11:                                     ▲ latest before = 2020-08\nask 2018-01: ▲ nothing before → -1 -1\n```\n\n## 3. What, why, how\n- **Encode** (year, month) as `key = year·12 + (month − 1)`. Then comparing keys = comparing dates, and Dec of year y (y·12+11) is right before Jan of y+1. Decode with `key / 12` and `key % 12 + 1`.\n- **Sort** the n keys (the input isn't sorted).\n- For each question: `idx = lower_bound(key)` = first issue **≥ key**.\n  - `pub[idx] == key` → `0 0`.\n  - `idx == 0` → no issue before → `-1 -1`.\n  - else → `pub[idx − 1]` is the last issue **< key**.\n- O((n + m) log n).\n\n## 4. Solution\n{{code}}\n{{tests}}\n\n**Trace of sample 1** (keys: 2019-10 → 24237, 2020-01 → 24240, 2020-08 → 24247):\n\n| ask | key | idx = first ≥ key | case | answer |\n|---|---|---|---|---|\n| 2020 1 | 24240 | 1 (24240) | equal | 0 0 |\n| 2019 12 | 24239 | 1 (24240) | pub[0] = 24237 | 2019 10 |\n| 2020 11 | 24250 | 3 (end) | pub[2] = 24247 | 2020 8 |\n| 2018 1 | 24216 | 0 | idx = 0 | −1 −1 |\n\n## 5. Traps\n- **No space between answers:** printing `0 0` then `2019 10` with no separator glues the numbers (`0 02019 10`). Put a space between answers.\n- **Encoding `year·100 + month`** also sorts correctly, but then \"the month before January\" isn't key − 1 — only use it for comparisons.\n- **Forgetting to sort** (sample 2 is unsorted).\n- **`upper_bound` by mistake**: `upper_bound(key) − 1` is the last ≤ key, which mixes the \"equal\" case into the predecessor case. Check equality first with lower_bound.\n\n## 6. Background\nLesson 08: **predecessor query = `lower_bound(x) − 1`** (last element < x). Turning a multi-part key (year, month) into one integer that preserves order is a handy trick (minutes since midnight, row·W + col, …). `std::set::lower_bound` does the same if updates are mixed with queries.", "th": "## 1. โจทย์บอกอะไร\nนักเขียนการ์ตูนรายเดือนชอบหยุดพัก เรารู้ (ปี, เดือน) ที่มีการตีพิมพ์ n ตอน (ไม่เรียง) สำหรับคำถาม m ข้อ (ปี, เดือน):\n\n- ถ้าเดือนนั้น **มีการตีพิมพ์** → พิมพ์ `0 0`\n- ถ้าเดือนนั้นอยู่ **ก่อนตอนแรก** → พิมพ์ `-1 -1`\n- ไม่อย่างนั้นพิมพ์ปีและเดือนของ **ตอนล่าสุดก่อนหน้า**\n\nตัวเลขทั้ง 2·m ตัวอยู่ใน **บรรทัดเดียว** คั่นด้วยช่องว่าง 2 ≤ n, m ≤ 200,000 ปี 1..1,000,000\n\n## 2. จริง ๆ แล้วถามอะไร\n\"หาตัวก่อนหน้า (predecessor) ของค่าหนึ่งในเซต\" — งานถนัดของ binary search เมื่อวางเดือนทั้งหมดไว้บนเส้นจำนวนเส้นเดียว\n\n```text\npublished: 2019-10, 2020-01, 2020-08\ntimeline:  ... 2019-10 ──── 2020-01 ──────── 2020-08 ────►\nask 2019-12:          ▲ latest before = 2019-10\nask 2020-11:                                     ▲ latest before = 2020-08\nask 2018-01: ▲ nothing before → -1 -1\n```\n\n## 3. อะไร ทำไม อย่างไร\n- **แปลง** (ปี, เดือน) เป็น `key = ปี·12 + (เดือน − 1)` แล้วการเทียบ key = การเทียบวันที่ และธันวาคมของปี y (y·12+11) อยู่ติดกับมกราคมของปี y+1 พอดี แปลงกลับด้วย `key / 12` และ `key % 12 + 1`\n- **sort** key ทั้ง n ตัว (ข้อมูลไม่ได้เรียงมา)\n- แต่ละคำถาม: `idx = lower_bound(key)` = ตอนแรกที่ **≥ key**\n  - `pub[idx] == key` → `0 0`\n  - `idx == 0` → ไม่มีตอนก่อนหน้า → `-1 -1`\n  - ไม่อย่างนั้น → `pub[idx − 1]` คือตอนสุดท้ายที่ **< key**\n- เวลา O((n + m) log n)\n\n```text\npub (sorted): [24237][24240][24247]\n                 0      1      2\nถาม 24239: lower_bound → idx = 1 (ค่า 24240 ≠ 24239)\n           ตัวก่อนหน้า = pub[0] = 24237 → 2019 เดือน 10\n```\n\n## 4. โค้ดเฉลย\n{{code}}\n{{tests}}\n\n**ไล่ตัวอย่างที่ 1** (key: 2019-10 → 24237, 2020-01 → 24240, 2020-08 → 24247):\n\n| ถาม | key | idx = ตัวแรกที่ ≥ key | กรณี | คำตอบ |\n|---|---|---|---|---|\n| 2020 1 | 24240 | 1 (24240) | เท่ากัน | 0 0 |\n| 2019 12 | 24239 | 1 (24240) | pub[0] = 24237 | 2019 10 |\n| 2020 11 | 24250 | 3 (ท้าย) | pub[2] = 24247 | 2020 8 |\n| 2018 1 | 24216 | 0 | idx = 0 | −1 −1 |\n\n## 5. จุดที่มักพลาด\n- **ไม่มีช่องว่างระหว่างคำตอบ:** พิมพ์ `0 0` ต่อด้วย `2019 10` โดยไม่คั่น ตัวเลขจะติดกัน (`0 02019 10`) ต้องใส่ช่องว่างระหว่างคำตอบ\n- **แปลงเป็น `ปี·100 + เดือน`** ก็เรียงถูก แต่ \"เดือนก่อนมกราคม\" จะไม่ใช่ key − 1 ใช้ได้แค่เปรียบเทียบ\n- **ลืม sort** (ตัวอย่างที่ 2 ไม่เรียง)\n- **ใช้ `upper_bound` ผิดที่:** `upper_bound(key) − 1` คือตัวสุดท้ายที่ ≤ key ทำให้กรณี \"เท่ากัน\" ปนกับกรณีตัวก่อนหน้า ให้เช็กเท่ากันก่อนด้วย lower_bound\n\n## 6. ความรู้พื้นฐาน\nบทที่ 08: **หาตัวก่อนหน้า = `lower_bound(x) − 1`** (ตัวสุดท้ายที่ < x) การแปลง key หลายส่วน (ปี, เดือน) เป็นจำนวนเต็มตัวเดียวที่ยังเรียงถูกเป็นเทคนิคที่ใช้บ่อย (นาทีนับจากเที่ยงคืน, แถว·W + คอลัมน์, …) ถ้ามีการเพิ่มข้อมูลสลับกับคำถาม ใช้ `std::set::lower_bound` ได้แบบเดียวกัน"}}, {"id": "d65_q1c_ice_cream", "group": "search", "lesson": "08 · Prefix sums + binary search", "stars": 3, "kind": "program", "tags": ["prefix sum", "lower_bound", "offline reasoning"], "title": {"en": "Saving for Ice Cream", "th": "เก็บเงินซื้อไอศกรีม (Saving for Ice Cream)"}, "blurb": {"en": "Build S[d] = savings by day d once; each question becomes one lower_bound — either on P or on P + S[X] after the scam.", "th": "สร้าง S[d] = เงินสะสมถึงวัน d ครั้งเดียว แต่ละคำถามเหลือ lower_bound ครั้งเดียว — หา P หรือ P + S[X] หลังโดนหลอก"}, "tests": {"en": "all 3 PDF samples; 300 random cases against a day-by-day simulation; n = 40,000, m = 100,000 in 0.05 s.", "th": "ตัวอย่างทั้ง 3 ชุดใน PDF; สุ่ม 300 ชุดเทียบกับการจำลองทีละวัน; n = 40,000, m = 100,000 ใช้ 0.05 วินาที"}, "files": [{"name": "main.cpp", "src": "#include <iostream>\n#include <vector>\n#include <algorithm>\nusing namespace std;\n\nconst int MAXD = 100000;          // answers never exceed day 100,000\n\nint main() {\n    std::ios_base::sync_with_stdio(false); std::cin.tie(0);\n\n    int n, m;\n    long long start;\n    cin >> n >> m >> start;\n\n    // newRate[d] = the new daily amount if Dae changes his mind on day d, or 0 if no change that day.\n    vector<long long> newRate(MAXD + 1, 0);\n    // c visits 0, 1, ..., n-1: read each \"from day a, save s per day\" line.\n    for (int c = 0; c < n; c++) {\n        int a; long long s;\n        cin >> a >> s;\n        newRate[a] = s;\n    }\n\n    // S[d] = total money at the END of day d, if nobody ever scams him.\n    vector<long long> S(MAXD + 1);\n    long long rate = start;\n    // d visits 0, 1, ..., MAXD (left to right): apply a change on day d first, then save that day.\n    for (int d = 0; d <= MAXD; d++) {\n        if (newRate[d] != 0) rate = newRate[d];\n        if (d == 0) S[d] = rate;\n        else        S[d] = S[d - 1] + rate;\n    }\n    // S is STRICTLY increasing (every rate >= 1), so we can binary search on it.\n\n    // q visits 0, 1, ..., m-1: answer each question independently, in input order.\n    for (int q = 0; q < m; q++) {\n        long long P; int X;\n        cin >> P >> X;\n\n        int ans;\n        if (S[X] >= P) {\n            // he already has P by the end of day X (buying beats the scam on day X):\n            // the first day with S[d] >= P is the answer, and it is <= X.\n            ans = lower_bound(S.begin(), S.end(), P) - S.begin();\n        } else {\n            // not enough by day X -> on day X all money is lost, and he restarts from 0.\n            // money at end of day d (> X) = S[d] - S[X].  Need S[d] - S[X] >= P  <=>  S[d] >= P + S[X].\n            ans = lower_bound(S.begin(), S.end(), P + S[X]) - S.begin();\n        }\n        cout << ans;\n        if (q < m - 1) cout << ' ';\n    }\n    cout << '\\n';\n}\n"}], "body": {"en": "## 1. What the problem says\nDae saves money every day starting on day 0 at `start` baht/day. On some days a he changes his mind: \"from today on I save s baht/day\". On day X a scam takes **all** his money (including that day's saving) and he starts again from 0 the next day. If he has enough on a day — even day X — he buys first.\n\n- For each question (P, X) print the **first day** his money reaches P. Questions are independent.\n- 0 ≤ n ≤ 40,000; 1 ≤ m ≤ 100,000; rates 1..1,000; a, X ≤ 100,000; the answer is never above 100,000. One line of answers.\n\n## 2. What it really means\nMoney without the scam is a running total S[d]. The scam just subtracts S[X] from everything after day X.\n\n```text\nrate 3, change day 4 → 2, day 6 → 5\nday:    0  1  2  3  4  5  6  7  8\nsaved:  3  3  3  3  2  2  5  5  5\nS[d]:   3  6  9 12 14 16 21 26 31\n\nP = 13, X = 3: S[3] = 12 < 13 → scammed, restart.\n   after day 3 money = S[d] − 12;  need S[d] ≥ 25  → day 7 (26 − 12 = 14 ≥ 13)\n```\n\n## 3. What, why, how\n- **Simulating each question** day by day costs up to 10⁵ per question → 10¹⁰. Too slow.\n- **Prefix sums:** build `S[0..100000]` once (O(10⁵)). Every rate ≥ 1, so S is **strictly increasing** → binary search works.\n- **Per question:**\n  - If `S[X] ≥ P`: he reaches P on or before day X → answer = first d with `S[d] ≥ P`.\n  - Else: all money is lost on day X; money on day d > X is `S[d] − S[X]` → answer = first d with `S[d] ≥ P + S[X]`.\n- Each is one `lower_bound` → O(log 10⁵) per question.\n\n## 4. Solution\n{{code}}\n{{tests}}\n\n**Trace of sample 2** (S = 3 6 9 12 14 16 21 26 31 …, all questions have X = 3 or more):\n\n| P | X | S[X] | S[X] ≥ P? | search for | answer |\n|---|---|---|---|---|---|\n| 11 | 3 | 12 | yes | first S ≥ 11 | 3 |\n| 12 | 3 | 12 | yes (exactly — buys before the scam) | first S ≥ 12 | 3 |\n| 13 | 3 | 12 | no | first S ≥ 25 | 7 |\n| 200 | 4 | 14 | no | first S ≥ 214 | 45 |\n| 200 | 5 | 16 | no | first S ≥ 216 | 45 |\n\n## 5. Traps\n- **Declaring `rate` inside the loop** resets it every day, so a change only lasts one day. It must live **outside** the loop.\n- **Reading `S[d − 1]` at d = 0** → `S[−1]`, out of bounds. Handle day 0 separately.\n- **Skipping the saving on a change day:** the new rate applies **that same day** — first update the rate, then add it.\n- **`S[X] ≥ P` vs `>`:** equal means he buys before the scam (sample: P = 12, X = 3 → 3).\n- **Overflow:** S can reach 10⁵ · 1000 = 10⁸, plus P up to 2³⁰ ≈ 1.07·10⁹ → fits in `int` but barely; `long long` is safe.\n\n## 6. Background\nLesson 08: **prefix sum + binary search on a monotone array**. \"Reset to zero at X\" becomes \"subtract S[X]\" — prefix sums turn range totals into one subtraction. Because S is strictly increasing, `lower_bound` finds the first day reaching any target.", "th": "## 1. โจทย์บอกอะไร\nนายแด้เก็บเงินทุกวันเริ่มวันที่ 0 วันละ `start` บาท ในบางวัน a เขาเปลี่ยนใจ \"ตั้งแต่วันนี้เก็บวันละ s บาท\" ในวันที่ X มีแก๊ง call center หลอกเอาเงิน **ทั้งหมด** (รวมของวันนั้น) แล้วเขาเริ่มเก็บใหม่จาก 0 ในวันถัดไป ถ้าวันไหนเงินพอ — แม้จะเป็นวัน X — เขาจะซื้อก่อนโดนหลอก\n\n- แต่ละคำถาม (P, X) ให้พิมพ์ **วันแรก** ที่มีเงินถึง P แต่ละคำถามแยกกัน\n- 0 ≤ n ≤ 40,000; 1 ≤ m ≤ 100,000; อัตรา 1..1,000; a, X ≤ 100,000; คำตอบไม่เกิน 100,000 พิมพ์คำตอบในบรรทัดเดียว\n\n## 2. จริง ๆ แล้วถามอะไร\nเงินถ้าไม่โดนหลอกคือผลรวมสะสม S[d] การโดนหลอกเท่ากับ \"ลบ S[X] ออก\" จากทุกวันหลังวัน X\n\n```text\nrate 3, change day 4 → 2, day 6 → 5\nday:    0  1  2  3  4  5  6  7  8\nsaved:  3  3  3  3  2  2  5  5  5\nS[d]:   3  6  9 12 14 16 21 26 31\n\nP = 13, X = 3: S[3] = 12 < 13 → scammed, restart.\n   after day 3 money = S[d] − 12;  need S[d] ≥ 25  → day 7 (26 − 12 = 14 ≥ 13)\n```\n\nเหมือนกระปุกออมสินที่มีตัวเลขบอกยอดสะสมตั้งแต่วันแรก ถ้าโดนขโมยวัน X เงินจริงหลังจากนั้นคือ \"ยอดสะสม − ยอดสะสมวัน X\"\n\n## 3. อะไร ทำไม อย่างไร\n- **จำลองทีละวันทุกคำถาม** อาจถึง 10⁵ วันต่อคำถาม → 10¹⁰ ช้าเกินไป\n- **Prefix sum:** สร้าง `S[0..100000]` ครั้งเดียว (O(10⁵)) อัตราทุกค่า ≥ 1 ดังนั้น S **เพิ่มขึ้นเรื่อย ๆ อย่างเคร่งครัด** → ใช้ binary search ได้\n- **แต่ละคำถาม:**\n  - ถ้า `S[X] ≥ P`: ถึง P ภายในวัน X → คำตอบ = d แรกที่ `S[d] ≥ P`\n  - ไม่อย่างนั้น: เงินหายหมดในวัน X เงินในวัน d > X คือ `S[d] − S[X]` → คำตอบ = d แรกที่ `S[d] ≥ P + S[X]`\n- แต่ละกรณีคือ `lower_bound` ครั้งเดียว → O(log 10⁵) ต่อคำถาม\n\n## 4. โค้ดเฉลย\n{{code}}\n{{tests}}\n\n**ไล่ตัวอย่างที่ 2** (S = 3 6 9 12 14 16 21 26 31 …):\n\n| P | X | S[X] | S[X] ≥ P? | หาอะไร | คำตอบ |\n|---|---|---|---|---|---|\n| 11 | 3 | 12 | ใช่ | S แรกที่ ≥ 11 | 3 |\n| 12 | 3 | 12 | ใช่ (พอดี — ซื้อก่อนโดนหลอก) | S แรกที่ ≥ 12 | 3 |\n| 13 | 3 | 12 | ไม่ | S แรกที่ ≥ 25 | 7 |\n| 200 | 4 | 14 | ไม่ | S แรกที่ ≥ 214 | 45 |\n| 200 | 5 | 16 | ไม่ | S แรกที่ ≥ 216 | 45 |\n\n## 5. จุดที่มักพลาด\n- **ประกาศ `rate` ในลูป** ทำให้รีเซ็ตทุกวัน การเปลี่ยนใจจะมีผลแค่วันเดียว ต้องประกาศ **นอก** ลูป\n- **อ่าน `S[d − 1]` ตอน d = 0** → `S[−1]` เลยขอบ ต้องจัดการวันที่ 0 แยก\n- **ข้ามการเก็บเงินในวันที่เปลี่ยนใจ:** อัตราใหม่ใช้ **วันนั้นเลย** — อัปเดตอัตราก่อน แล้วค่อยบวก\n- **`S[X] ≥ P` กับ `>`:** เท่ากันแปลว่าซื้อทันก่อนโดนหลอก (ตัวอย่าง: P = 12, X = 3 → 3)\n- **Overflow:** S ได้ถึง 10⁵ · 1000 = 10⁸ บวก P ได้ถึง 2³⁰ ≈ 1.07·10⁹ → ยังพอ `int` แต่เฉียด `long long` ปลอดภัยกว่า\n\n## 6. ความรู้พื้นฐาน\nบทที่ 08: **prefix sum + binary search บนอาร์เรย์ที่เพิ่มขึ้นเรื่อย ๆ** \"รีเซ็ตเป็นศูนย์ที่วัน X\" กลายเป็น \"ลบ S[X]\" — prefix sum เปลี่ยนผลรวมช่วงให้เป็นการลบครั้งเดียว และเพราะ S เพิ่มขึ้นอย่างเคร่งครัด `lower_bound` จึงหาวันแรกที่ถึงเป้าได้ทันที"}}, {"id": "d64_q2a_vector_block_swap", "group": "vector", "lesson": "03 · Vector internals", "stars": 1, "kind": "student.h", "tags": ["CP::vector", "iterators", "validation", "swap"], "title": {"en": "Vector Block Swap", "th": "สลับข้อมูลเป็นบล็อก (Vector Block Swap)"}, "blurb": {"en": "Swap two equal-length blocks — but first check that both are inside the vector, m > 0, and they don't overlap.", "th": "สลับบล็อกสองบล็อกที่ยาวเท่ากัน — แต่ต้องเช็กก่อนว่าอยู่ในเวกเตอร์, m > 0 และไม่ทับกัน"}, "tests": {"en": "every row of the PDF table; 300 random (a, b, m) including negative starts, m = 0, overlaps and blocks that run past the end, against a Python model. ASan + UBSan clean.", "th": "ทุกแถวในตารางของ PDF; สุ่ม (a, b, m) 300 ชุด รวมจุดเริ่มติดลบ, m = 0, บล็อกทับกัน และบล็อกที่เลยท้าย เทียบกับโมเดล Python ไม่พบข้อผิดพลาดจาก ASan + UBSan"}, "files": [{"name": "student.h", "src": "#ifndef __STUDENT_H_\n#define __STUDENT_H_\n\n#include <algorithm>\n\ntemplate <typename T>\nbool CP::vector<T>::block_swap(iterator a, iterator b, size_t m) {\n  // Turn the iterators (pointers into mData) into INDICES. Use long long so\n  // \"before begin()\" shows up as a negative number instead of wrapping around.\n  long long ia = a - begin();          // block A = indices ia .. ia+m-1\n  long long ib = b - begin();          // block B = indices ib .. ib+m-1\n  long long len = (long long)m;\n  long long n = (long long)mSize;\n\n  // ---- 1) validate: if anything is wrong, return false and touch nothing ----\n  if (len <= 0) return false;                          // m must be > 0\n  if (ia < 0 || ib < 0) return false;                  // block starts before the vector\n  if (ia + len > n || ib + len > n) return false;      // last index ia+m-1 / ib+m-1 must be <= n-1\n  bool disjoint = (ia + len <= ib) || (ib + len <= ia); // A ends before B starts, or B ends before A starts\n  if (!disjoint) return false;                         // blocks overlap\n\n  // ---- 2) swap element by element ----\n  // k visits 0, 1, ..., m-1 (left to right): the k-th element of block A\n  // trades places with the k-th element of block B.\n  for (int k = 0; k < (int)len; k++) {\n    std::swap(mData[ia + k], mData[ib + k]);\n  }\n  return true;\n}\n\n#endif\n"}], "body": {"en": "## 1. What the problem says\nAdd `bool block_swap(iterator a, iterator b, size_t m)`: swap the m elements `a .. a+m−1` with the m elements `b .. b+m−1`. Example: v = {10,…,80}, a = begin()+5, b = begin()+1, m = 2 → {10,**60,70**,40,50,**20,30**,80}.\n\n- It only works when **a, b, a+m−1, b+m−1 are valid iterators of v**, the two blocks **don't overlap**, and **m > 0**. Then return `true`.\n- Otherwise return `false` and **change nothing**.\n- The grader's `main` is different from the starter's.\n\n## 2. What it really means\nTwo jobs: **validate**, then **swap pairwise**. The validation is where marks are lost.\n\n```text\nv = 1 2 3 4 5           a=1, b=3, m=2\nblock A = [1..2] = 2 3   block B = [3..4] = 4 5   disjoint ✓\nresult    1 4 5 2 3\n\na=1, b=2, m=2: A = [1..2], B = [2..3] share index 2 → overlap → false\n```\n\n## 3. What, why, how\n- Convert to indices: `ia = a − begin()`, `ib = b − begin()`. Use a **signed** type: if a is before `begin()`, the difference is negative.\n- Valid when:\n  - `m > 0`;\n  - `ia ≥ 0` and `ib ≥ 0`;\n  - `ia + m ≤ n` and `ib + m ≤ n` (the last index `ia + m − 1 ≤ n − 1`);\n  - **disjoint**: `ia + m ≤ ib` (A ends before B) **or** `ib + m ≤ ia` (B ends before A).\n- Then for k = 0 .. m−1 swap `mData[ia+k]` and `mData[ib+k]`. O(m).\n\n## 4. Solution\n{{code}}\n{{tests}}\n\n**The PDF table checked against the conditions** (v = {1,2,3,4,5}, n = 5):\n\n| a | b | m | in range? | disjoint? | result |\n|---|---|---|---|---|---|\n| 0 | 1 | 0 | — | — | false (m = 0) |\n| 0 | 1 | 1 | ✓ | 0+1 ≤ 1 ✓ | true → 2 1 3 4 5 |\n| 1 | 3 | 2 | ✓ | 1+2 ≤ 3 ✓ | true → 1 4 5 2 3 |\n| 1 | 4 | 2 | 4+2 = 6 > 5 ✗ | | false |\n| 3 | 0 | 2 | ✓ | 0+2 ≤ 3 ✓ | true → 4 5 3 1 2 |\n| 0 | 3 | 3 | 3+3 = 6 > 5 ✗ | | false |\n| 0 | 2 | 3 (n=7) | ✓ | 0+3 ≤ 2 ✗, 2+3 ≤ 0 ✗ | false (overlap) |\n\n## 5. Traps\n- **`size_t` arithmetic:** `a − begin()` stored in `size_t` turns −1 into a huge number, and `m − 1` with m = 0 wraps to 2⁶⁴−1. Use signed integers.\n- **Checking only one order** for overlap: blocks can be given with b < a (row `3 0 2`).\n- **Off-by-one in the range test:** the condition is `ia + m ≤ n`, not `< n`.\n- **Swapping before validating** → when the answer is false the vector has already changed.\n\n## 6. Background\nLesson 03: iterator − `begin()` = index. Interval overlap test: two half-open intervals [x, x+m) and [y, y+m) are disjoint **iff** `x + m ≤ y || y + m ≤ x`. Validate everything first, then act — the same \"all or nothing\" rule as many container operations.", "th": "## 1. โจทย์บอกอะไร\nเพิ่ม `bool block_swap(iterator a, iterator b, size_t m)` ที่สลับข้อมูล m ตัว `a .. a+m−1` กับ m ตัว `b .. b+m−1` ตัวอย่าง: v = {10,…,80}, a = begin()+5, b = begin()+1, m = 2 → {10,**60,70**,40,50,**20,30**,80}\n\n- ทำงานได้เฉพาะเมื่อ **a, b, a+m−1, b+m−1 เป็น iterator ที่ถูกต้องของ v**, สองบล็อก **ไม่ทับกัน** และ **m > 0** แล้วคืน `true`\n- ไม่อย่างนั้นคืน `false` และ **ไม่เปลี่ยนอะไรเลย**\n- `main` ใน grader ต่างจากในไฟล์เริ่มต้น\n\n## 2. จริง ๆ แล้วถามอะไร\nมีสองงาน: **ตรวจความถูกต้อง** แล้ว **สลับทีละคู่** ส่วนที่คนเสียคะแนนคือการตรวจ\n\n```text\nv = 1 2 3 4 5           a=1, b=3, m=2\nblock A = [1..2] = 2 3   block B = [3..4] = 4 5   disjoint ✓\nresult    1 4 5 2 3\n\na=1, b=2, m=2: A = [1..2], B = [2..3] share index 2 → overlap → false\n```\n\n## 3. อะไร ทำไม อย่างไร\n- แปลงเป็น index: `ia = a − begin()`, `ib = b − begin()` ใช้ชนิด **มีเครื่องหมาย** ถ้า a อยู่ก่อน `begin()` ผลต่างจะติดลบ\n- ถูกต้องเมื่อ:\n  - `m > 0`\n  - `ia ≥ 0` และ `ib ≥ 0`\n  - `ia + m ≤ n` และ `ib + m ≤ n` (index สุดท้าย `ia + m − 1 ≤ n − 1`)\n  - **ไม่ทับกัน**: `ia + m ≤ ib` (A จบก่อน B เริ่ม) **หรือ** `ib + m ≤ ia` (B จบก่อน A เริ่ม)\n\n```text\nไม่ทับ:   A [■■]     B [■■]        ia+m ≤ ib\nไม่ทับ:   B [■■]     A [■■]        ib+m ≤ ia\nทับ:      A [■■■]\n              B [■■■]               ทั้งสองเงื่อนไขเป็นเท็จ\n```\n\n- จากนั้น k = 0 .. m−1 สลับ `mData[ia+k]` กับ `mData[ib+k]` เวลา O(m)\n\n## 4. โค้ดเฉลย\n{{code}}\n{{tests}}\n\n**ตรวจตารางใน PDF ด้วยเงื่อนไข** (v = {1,2,3,4,5}, n = 5):\n\n| a | b | m | อยู่ในช่วง? | ไม่ทับ? | ผล |\n|---|---|---|---|---|---|\n| 0 | 1 | 0 | — | — | false (m = 0) |\n| 0 | 1 | 1 | ✓ | 0+1 ≤ 1 ✓ | true → 2 1 3 4 5 |\n| 1 | 3 | 2 | ✓ | 1+2 ≤ 3 ✓ | true → 1 4 5 2 3 |\n| 1 | 4 | 2 | 4+2 = 6 > 5 ✗ | | false |\n| 3 | 0 | 2 | ✓ | 0+2 ≤ 3 ✓ | true → 4 5 3 1 2 |\n| 0 | 3 | 3 | 3+3 = 6 > 5 ✗ | | false |\n| 0 | 2 | 3 (n=7) | ✓ | 0+3 ≤ 2 ✗, 2+3 ≤ 0 ✗ | false (ทับกัน) |\n\n## 5. จุดที่มักพลาด\n- **คำนวณด้วย `size_t`:** เก็บ `a − begin()` ใน `size_t` จะทำให้ −1 กลายเป็นเลขมหาศาล และ `m − 1` ตอน m = 0 จะวนเป็น 2⁶⁴−1 ใช้จำนวนเต็มแบบมีเครื่องหมาย\n- **เช็กการทับแค่ทิศเดียว:** b อาจน้อยกว่า a ได้ (แถว `3 0 2`)\n- **ขอบเขตเกินหนึ่ง:** เงื่อนไขคือ `ia + m ≤ n` ไม่ใช่ `< n`\n- **สลับก่อนตรวจ** → ตอนที่คำตอบเป็น false เวกเตอร์ถูกเปลี่ยนไปแล้ว\n\n## 6. ความรู้พื้นฐาน\nบทที่ 03: iterator − `begin()` = index การเช็กช่วงทับกัน: ช่วงครึ่งเปิด [x, x+m) กับ [y, y+m) ไม่ทับกัน **ก็ต่อเมื่อ** `x + m ≤ y || y + m ≤ x` ตรวจทุกอย่างก่อนแล้วค่อยลงมือ — กฎ \"ทำทั้งหมดหรือไม่ทำเลย\" แบบเดียวกับการทำงานของ container หลายตัว"}}, {"id": "d62_q2b_stack_deep_push", "group": "stackqueue", "lesson": "04 · Stack", "stars": 1, "kind": "student.h", "tags": ["CP::stack", "top = mData[mSize-1]", "shift right"], "title": {"en": "Stack Deep Push", "th": "ดันข้อมูลลงลึกในสแตก (Stack Deep Push)"}, "blurb": {"en": "Push a value pos slots below the top — convert \"below the top\" into an array index, then shift and insert.", "th": "push ค่าลงไปลึก pos ช่องจาก top — แปลง \"ใต้ top\" เป็น index ในอาร์เรย์ แล้วเลื่อนและแทรก"}, "tests": {"en": "the PDF command script; 300 random u / o / d / p scripts (pos from 0 to size) against a Python list model. ASan + UBSan clean.", "th": "ชุดคำสั่งใน PDF; สุ่มชุดคำสั่ง u / o / d / p 300 ชุด (pos ตั้งแต่ 0 ถึง size) เทียบกับโมเดล list ใน Python ไม่พบข้อผิดพลาดจาก ASan + UBSan"}, "files": [{"name": "student.h", "src": "#ifndef __STUDENT_H_\n#define __STUDENT_H_\n\n\ntemplate <typename T>\nvoid CP::stack<T>::deep_push(size_t pos,const T& value) {\n  // The stack is stored bottom -> top in mData[0 .. mSize-1]; the TOP is mData[mSize-1].\n  // \"pos slots below the top\" = array index idx = mSize - pos.\n  //   pos = 0      -> idx = mSize  (above the top: a normal push)\n  //   pos = mSize  -> idx = 0      (under the bottom)\n  int n   = mSize;\n  int idx = n - (int)pos;\n\n  ensureCapacity(mSize + 1);        // make room for one more (may reallocate; we use indices, so it's safe)\n\n  // Open a gap at idx: shift mData[idx .. n-1] one step right (toward the top).\n  // i visits n-1, n-2, ..., idx (RIGHT to LEFT), so nothing is overwritten before it moves.\n  for (int i = n - 1; i >= idx; i--) {\n    mData[i + 1] = mData[i];\n  }\n\n  mData[idx] = value;               // drop the value into the gap\n  mSize++;\n}\n\n#endif\n"}], "body": {"en": "## 1. What the problem says\nAdd `void deep_push(size_t pos, T value)` to CP::stack: push value so that it ends up **pos places below the top**. `deep_push(0, v)` is a normal push; on {10,20,30} (top on the right) `deep_push(3, v)` gives {v,10,20,30}. pos ≤ size().\n\n- `main` commands: `u x` push, `o` pop, `d pos v` deep_push, `p` print bottom → top, `q` quit.\n\n## 2. What it really means\nCP::stack stores bottom → top in `mData[0 .. mSize−1]`; the **top is the last slot**. \"pos below the top\" is array index **idx = mSize − pos**.\n\n```text\nmData:  [ 1 | 2 | 3 | 4 ]        mSize = 4\nindex:    0   1   2   3 ← top\npos:      4   3   2   1   0 (= above the top)\nd 0 10 → idx 4 → [1 2 3 4 10]\nd 5 11 → idx 0 → [11 1 2 3 4 10]\n```\n\n## 3. What, why, how\n- It's \"insert at index idx\" in a vector: make room for one, shift `mData[idx .. n−1]` right by 1 (**right to left**), write the value, `mSize++`.\n- `ensureCapacity(mSize + 1)` may reallocate — we use indices, not pointers, so that's safe.\n- Cost O(pos): only the pos elements above idx move.\n\n## 4. Solution\n{{code}}\n{{tests}}\n\n**Trace of `d 5 11`** on [1 2 3 4 10] (n = 5, idx = 0):\n\n| i | action | mData |\n|---|---|---|\n| 4 | mData[5] = 10 | 1 2 3 4 10 **10** |\n| 3 | mData[4] = 4 | 1 2 3 4 **4** 10 |\n| 2, 1, 0 | shift | 1 **1 2 3** 4 10 |\n| — | mData[0] = 11 | **11** 1 2 3 4 10 |\n\n## 5. Traps\n- **Counting from the bottom:** idx = pos is wrong; pos is measured from the **top**.\n- **idx = mSize − pos − 1** puts the value one slot too low (deep_push(0) would land under the top instead of on it).\n- **Shifting left to right** duplicates one element and loses the rest.\n- **Forgetting `ensureCapacity`** writes past the array when it is full.\n\n## 6. Background\nLesson 04: a CP::stack is a vector where only the end is used. Any \"k-th from the top\" is `mData[mSize − 1 − k]`. Deep push = vector insert at `mSize − pos` (see Multiple Add for the shift pattern, Mitosis for a harder version).", "th": "## 1. โจทย์บอกอะไร\nเพิ่ม `void deep_push(size_t pos, T value)` ให้ CP::stack: push value ให้ไปอยู่ **ลึกลงไปจาก top pos ช่อง** `deep_push(0, v)` คือ push ปกติ; ถ้า stack เป็น {10,20,30} (top อยู่ขวา) `deep_push(3, v)` จะได้ {v,10,20,30} รับประกันว่า pos ≤ size()\n\n- คำสั่งใน `main`: `u x` push, `o` pop, `d pos v` deep_push, `p` พิมพ์จาก bottom → top, `q` จบ\n\n## 2. จริง ๆ แล้วถามอะไร\nCP::stack เก็บข้อมูลจาก bottom → top ใน `mData[0 .. mSize−1]` **top คือช่องสุดท้าย** ดังนั้น \"ลึกจาก top pos ช่อง\" คือ index **idx = mSize − pos**\n\n```text\nmData:  [ 1 | 2 | 3 | 4 ]        mSize = 4\nindex:    0   1   2   3 ← top\npos:      4   3   2   1   0 (= above the top)\nd 0 10 → idx 4 → [1 2 3 4 10]\nd 5 11 → idx 0 → [11 1 2 3 4 10]\n```\n\nนึกภาพกองจาน: deep_push(2, v) คือยกจาน 2 ใบบนสุดขึ้น วางจาน v ลงไป แล้ววางสองใบกลับ\n\n## 3. อะไร ทำไม อย่างไร\n- นี่คือ \"แทรกที่ index idx\" ของ vector: เพิ่มที่หนึ่งช่อง, เลื่อน `mData[idx .. n−1]` ไปขวา 1 ช่อง (**จากขวาไปซ้าย**), เขียนค่า, `mSize++`\n- `ensureCapacity(mSize + 1)` อาจจองที่ใหม่ แต่เราใช้ index ไม่ใช่พอยน์เตอร์ จึงปลอดภัย\n- เวลา O(pos): ขยับแค่ pos ตัวที่อยู่เหนือ idx\n\n## 4. โค้ดเฉลย\n{{code}}\n{{tests}}\n\n**ไล่ `d 5 11`** บน [1 2 3 4 10] (n = 5, idx = 0):\n\n| i | ทำอะไร | mData |\n|---|---|---|\n| 4 | mData[5] = 10 | 1 2 3 4 10 **10** |\n| 3 | mData[4] = 4 | 1 2 3 4 **4** 10 |\n| 2, 1, 0 | เลื่อน | 1 **1 2 3** 4 10 |\n| — | mData[0] = 11 | **11** 1 2 3 4 10 |\n\n## 5. จุดที่มักพลาด\n- **นับจาก bottom:** idx = pos ผิด pos นับจาก **top**\n- **idx = mSize − pos − 1** ทำให้ค่าต่ำไปหนึ่งช่อง (deep_push(0) จะไปอยู่ใต้ top แทนที่จะอยู่บน top)\n- **เลื่อนจากซ้ายไปขวา** ทำให้ข้อมูลตัวหนึ่งซ้ำและที่เหลือหาย\n- **ลืม `ensureCapacity`** จะเขียนเลยอาร์เรย์ตอนเต็ม\n\n## 6. ความรู้พื้นฐาน\nบทที่ 04: CP::stack คือ vector ที่ใช้แค่ปลายด้านเดียว \"ตัวที่ k จาก top\" คือ `mData[mSize − 1 − k]` เสมอ deep push = แทรกใน vector ที่ `mSize − pos` (รูปแบบการเลื่อนดูข้อ Multiple Add ส่วนเวอร์ชันยากกว่าดูข้อ Mitosis)"}}, {"id": "d65_q2a_mitosis", "group": "stackqueue", "lesson": "04 · Stack", "stars": 3, "kind": "student.h", "tags": ["CP::stack", "expand once", "shift right", "duplicate block"], "title": {"en": "Stack Mitosis", "th": "แบ่งตัวในสแตก (Stack Mitosis)"}, "blurb": {"en": "Duplicate every element from a-th to b-th from the top, each copy right next to its original — grow once, move every element once, top-down.", "th": "ทำสำเนาทุกตัวตั้งแต่ตัวที่ a ถึง b จาก top ให้ติดกับตัวเดิม — ขยายครั้งเดียว ย้ายแต่ละตัวครั้งเดียว ไล่จากบนลงล่าง"}, "tests": {"en": "the PDF samples; 300 random stacks with up to 5 chained mitosis calls against a Python model (whole stack, a = 0, b = size−1). ASan + UBSan clean.", "th": "ตัวอย่างใน PDF; สุ่ม 300 ชุดที่เรียก mitosis ต่อกันได้ถึง 5 ครั้ง เทียบกับโมเดล Python (ทั้งสแตก, a = 0, b = size−1) ไม่พบข้อผิดพลาดจาก ASan + UBSan"}, "files": [{"name": "student.h", "src": "#ifndef __STACK_STUDENT_H__\n#define __STACK_STUDENT_H__\n#include \"stack.h\"\n\ntemplate <typename T>\nvoid CP::stack<T>::mitosis(int a, int b)\n{\n    // ---- 1. Turn \"k-th from the top\" into real array indices ----\n    // The top of the stack is the LAST slot, mData[mSize - 1].\n    // So \"the k-th from the top\" is mData[mSize - 1 - k].\n    int top = (int)mSize - 1;   // index of the top element\n    int lo  = top - b;          // index of the b-th from top (the LOWER end of the block)\n    int hi  = top - a;          // index of the a-th from top (the HIGHER end of the block)\n    int c   = b - a + 1;        // how many elements get a copy = how much the stack grows\n    int newSize = (int)mSize + c;\n\n    // ---- 2. Make room ONCE, only if needed ----\n    // Same rule as ensureCapacity: grow to at least double, so later pushes stay cheap.\n    if (newSize > (int)mCap) {\n        int cap = (newSize > 2 * (int)mCap) ? newSize : 2 * (int)mCap;\n        expand(cap);\n    }\n\n    // ---- 3. Move the elements ABOVE the block up by c ----\n    // i walks real indices: from the top (top) down to just above the block (hi + 1).\n    // We go top -> down because every element moves to a HIGHER slot (i + c);\n    // going bottom -> up would overwrite elements we have not copied yet.\n    // If the block already reaches the top (a == 0), then hi + 1 > top and this loop runs 0 times.\n    for (int i = top; i >= hi + 1; i--) {\n        mData[i + c] = mData[i];\n    }\n\n    // ---- 4. Write every element of the block twice ----\n    // i walks real indices from hi down to lo.\n    // The element that is (i - lo) places above lo ends up at\n    //   d = lo + 2 * (i - lo)   and   d + 1   (original + its copy, side by side).\n    // d is always >= i, so again we go top -> down to never overwrite an uncopied element.\n    for (int i = hi; i >= lo; i--) {\n        int d = lo + 2 * (i - lo);\n        mData[d + 1] = mData[i];   // the copy\n        mData[d]     = mData[i];   // the original (may already be in place when i == lo)\n    }\n\n    // ---- 5. Elements below lo did not move. Update the size. ----\n    mSize = newSize;\n}\n\n#endif\n"}], "body": {"en": "## 1. What the problem says\n\"The k-th from the top\" = k elements below the top (top is 0-th). `mitosis(a, b)` makes a copy of every element from the a-th to the b-th from the top, and **each copy sits right next to its original**. 0 ≤ a ≤ b < mSize.\n\n- Example: [10,20,30,40,50] (top on the right), `mitosis(1,2)` → [10,20,**30,30,40,40**,50].\n- Remember to grow mData when needed — but **don't grow more than needed**.\n- `main` reads n t, the n values (bottom first), then t pairs a b, and prints bottom → top.\n\n## 2. What it really means\nIn array terms the block is `mData[lo .. hi]` with `hi = top − a`, `lo = top − b` (top = mSize − 1). It grows by c = b − a + 1.\n\n```text\nindex:  0   1   2   3   4          a = 1, b = 2 → hi = 3, lo = 2, c = 2\n       10  20  30  40  50\n                └─block─┘ └ above the block: moves up by c\nresult: 10  20  30  30  40  40  50\n        ↑ below lo: stays\n```\n\n## 3. What, why, how\nThree regions, each handled once:\n\n1. **Below lo**: doesn't move.\n2. **Above hi** (indices hi+1 .. top): every element moves **up by c**.\n3. **The block**: element at i goes to `d = lo + 2·(i − lo)` and `d + 1`.\n\nEvery destination is **≥ its source**, so go from the **top down** — then nothing is overwritten before it's copied. Grow once before moving: if newSize > mCap, `expand(max(newSize, 2·mCap))` (the same rule as ensureCapacity). Cost O(a + c) moves.\n\n## 4. Solution\n{{code}}\n{{tests}}\n\n**Trace of sample 1** (mitosis(1,2) on 10 20 30 40 50: top = 4, hi = 3, lo = 2, c = 2):\n\n| step | i | writes | mData[0..6] |\n|---|---|---|---|\n| above | 4 | mData[6] = 50 | 10 20 30 40 50 . **50** |\n| block | 3 (d = 4) | mData[5] = mData[4] = 40 | 10 20 30 40 **40 40** 50 |\n| block | 2 (d = 2) | mData[3] = mData[2] = 30 | 10 20 **30 30** 40 40 50 |\n\n## 5. Traps\n- **Bottom-up order** overwrites elements not copied yet (e.g. writing slot 3 before reading old slot 3).\n- **Using `push` in a loop** for each copy: works but may reallocate many times and needs extra storage.\n- **Off-by-one in lo/hi:** the a-th from the top is `mData[mSize − 1 − a]`, not `mData[mSize − a]`.\n- **Growing every call by a fixed amount** or to exactly newSize repeatedly → many reallocations; double like ensureCapacity.\n\n## 6. Background\nLesson 04 + Lesson 03: a stack is an array; any \"k from the top\" is `mSize − 1 − k`. The general rule for in-place moves: **if data moves right, iterate right to left** (and vice versa). Here two regions move right by different amounts, so one top-down pass handles both.", "th": "## 1. โจทย์บอกอะไร\n\"ข้อมูลที่ k จากบน\" = ถัดจาก top ลงไป k ตัว (top คือตัวที่ 0) `mitosis(a, b)` ทำสำเนาทุกตัวตั้งแต่ตัวที่ a ถึงตัวที่ b จากบน และ **สำเนาแต่ละตัวอยู่ติดกับตัวเดิม** รับประกัน 0 ≤ a ≤ b < mSize\n\n- ตัวอย่าง: [10,20,30,40,50] (top อยู่ขวา) `mitosis(1,2)` → [10,20,**30,30,40,40**,50]\n- อย่าลืมขยาย mData เมื่อจำเป็น — แต่ **อย่าขยายเกินจำเป็น**\n- `main` อ่าน n t, ค่า n ตัว (ตัวแรกอยู่ล่างสุด) แล้วอ่านคู่ a b อีก t คู่ แล้วพิมพ์จาก bottom → top\n\n## 2. จริง ๆ แล้วถามอะไร\nในมุมอาร์เรย์ บล็อกคือ `mData[lo .. hi]` โดย `hi = top − a`, `lo = top − b` (top = mSize − 1) และสแตกโตขึ้น c = b − a + 1\n\n```text\nindex:  0   1   2   3   4          a = 1, b = 2 → hi = 3, lo = 2, c = 2\n       10  20  30  40  50\n                └─block─┘ └ above the block: moves up by c\nresult: 10  20  30  30  40  40  50\n        ↑ below lo: stays\n```\n\nเหมือนเซลล์แบ่งตัว: แต่ละตัวในบล็อกแบ่งเป็นสองตัวติดกัน ส่วนที่อยู่ข้างบนต้องถอยขึ้นไปให้ที่\n\n## 3. อะไร ทำไม อย่างไร\nแบ่งเป็นสามส่วน แต่ละส่วนจัดการครั้งเดียว:\n\n1. **ใต้ lo**: ไม่ขยับ\n2. **เหนือ hi** (index hi+1 .. top): ทุกตัว **ขึ้นไป c ช่อง**\n3. **บล็อก**: ตัวที่ index i ไปอยู่ที่ `d = lo + 2·(i − lo)` และ `d + 1`\n\nปลายทางทุกตัว **≥ ต้นทาง** จึงไล่ **จากบนลงล่าง** — จะไม่มีตัวไหนถูกทับก่อนถูกคัดลอก ขยายครั้งเดียวก่อนย้าย: ถ้า newSize > mCap ให้ `expand(max(newSize, 2·mCap))` (กฎเดียวกับ ensureCapacity) ย้ายข้อมูล O(a + c) ครั้ง\n\n```text\nไล่จากบนลงล่าง (i ลดลง):\ni=4 (50)  → ช่อง 6\ni=3 (40)  → ช่อง 4 และ 5\ni=2 (30)  → ช่อง 2 และ 3     ← ช่อง 3 ถูกเขียนหลังจากอ่าน 40 ไปแล้ว ✓\n```\n\n## 4. โค้ดเฉลย\n{{code}}\n{{tests}}\n\n**ไล่ตัวอย่างที่ 1** (mitosis(1,2) บน 10 20 30 40 50: top = 4, hi = 3, lo = 2, c = 2):\n\n| ขั้น | i | เขียน | mData[0..6] |\n|---|---|---|---|\n| เหนือบล็อก | 4 | mData[6] = 50 | 10 20 30 40 50 . **50** |\n| บล็อก | 3 (d = 4) | mData[5] = mData[4] = 40 | 10 20 30 40 **40 40** 50 |\n| บล็อก | 2 (d = 2) | mData[3] = mData[2] = 30 | 10 20 **30 30** 40 40 50 |\n\n## 5. จุดที่มักพลาด\n- **ไล่จากล่างขึ้นบน** จะเขียนทับตัวที่ยังไม่ได้คัดลอก (เช่น เขียนช่อง 3 ก่อนอ่านค่าเดิมของช่อง 3)\n- **ใช้ `push` ในลูป** ทีละสำเนา: ใช้ได้แต่อาจจองที่ใหม่หลายครั้งและต้องใช้ที่เก็บเพิ่ม\n- **lo/hi เกินหนึ่ง:** ตัวที่ a จากบนคือ `mData[mSize − 1 − a]` ไม่ใช่ `mData[mSize − a]`\n- **ขยายทีละนิดทุกครั้ง** หรือขยายเป็น newSize พอดีซ้ำ ๆ → จองใหม่หลายรอบ ให้เพิ่มเท่าตัวแบบ ensureCapacity\n\n## 6. ความรู้พื้นฐาน\nบทที่ 04 + บทที่ 03: สแตกคืออาร์เรย์ \"ตัวที่ k จากบน\" คือ `mSize − 1 − k` กฎทั่วไปของการย้ายในที่เดิม: **ถ้าข้อมูลย้ายไปขวา ให้ไล่จากขวาไปซ้าย** (และกลับกัน) ข้อนี้มีสองส่วนที่ย้ายไปขวาคนละระยะ จึงไล่จากบนลงล่างรอบเดียวได้ทั้งสองส่วน"}}, {"id": "d63_q3a_queue_m2b", "group": "stackqueue", "lesson": "04 · Queue (circular array)", "stars": 2, "kind": "student.h", "tags": ["CP::queue", "circular index", "shift left"], "title": {"en": "Queue Move To Back", "th": "ย้ายไปท้ายคิว (Queue Move To Back)"}, "blurb": {"en": "Move the element at position pos to the back — save it, shift the ones behind it forward by one, put it last. All indices go through (mFront + i) % mCap.", "th": "ย้ายตัวที่ตำแหน่ง pos ไปท้ายคิว — เก็บไว้ก่อน เลื่อนตัวข้างหลังมาข้างหน้าหนึ่งช่อง แล้ววางไว้ท้ายสุด ทุก index ผ่าน (mFront + i) % mCap"}, "tests": {"en": "the PDF script; 300 random u / o / m / p scripts (pops make the data wrap around the array) against a Python list model. ASan + UBSan clean.", "th": "ชุดคำสั่งใน PDF; สุ่มชุดคำสั่ง u / o / m / p 300 ชุด (การ pop ทำให้ข้อมูลวนรอบอาร์เรย์) เทียบกับโมเดล list ใน Python ไม่พบข้อผิดพลาดจาก ASan + UBSan"}, "files": [{"name": "student.h", "src": "#ifndef __STUDENT_H_\n#define __STUDENT_H_\n\n\n\ntemplate <typename T>\nvoid CP::queue<T>::move_to_back(size_t pos) {\n  int n = mSize;\n  int p = pos;\n  if (p < 0 || p >= n) return;              // nothing to move (safety)\n\n  // remember the element at position p (slot = (mFront + p) % mCap)\n  T x = mData[(mFront + p) % mCap];\n\n  // Shift everything AFTER p one step toward the front.\n  // i visits positions p, p+1, ..., n-2 (left to right):\n  // position i receives the element from position i+1.\n  // Left to right is safe: we overwrite position i only after reading it (it was saved in x\n  // or already copied to i-1).\n  for (int i = p; i <= n - 2; i++) {\n    mData[(mFront + i) % mCap] = mData[(mFront + i + 1) % mCap];\n  }\n\n  // the saved element goes to the last position n-1 (the back)\n  mData[(mFront + n - 1) % mCap] = x;\n  // mSize, mFront, mCap are unchanged: same elements, new order.\n}\n\n#endif\n"}], "body": {"en": "## 1. What the problem says\nAdd `move_to_back(size_t pos)` to CP::queue: the element at position pos (front = 0, back = size()−1) moves to the **back**; the others keep their order. <10,20,30,40,50,60>, `move_to_back(3)` → <10,20,30,50,60,**40**>.\n\n- Commands: `u x` push, `o` pop, `m pos`, `p` print (\"Size n: …\"), `q`.\n- For full marks it should take O(n − pos).\n\n## 2. What it really means\nLogical position i lives at **physical slot (mFront + i) % mCap** — the array is circular, so after some pops the queue may wrap past the end of mData.\n\n```text\nlogical:   10 20 30 [40] 50 60\nstep 1: x = 40\nstep 2: 50 → pos 3, 60 → pos 4      (shift the tail LEFT by one)\nstep 3: x → pos 5\nresult:    10 20 30 50 60 40\n```\n\n## 3. What, why, how\n- Save `x` = element at pos.\n- For i = pos .. n−2: position i ← position i+1 (**left to right**, because data moves left).\n- Position n−1 ← x. mSize and mFront don't change.\n- Only n − pos − 1 elements move → O(n − pos).\n\n## 4. Solution\n{{code}}\n{{tests}}\n\n**Trace of the sample** — after `u 1..4`, `o`: queue = 2 3 4 (mFront = 1, mCap = 4).\n\n| call | x | shifts | result |\n|---|---|---|---|\n| m 0 | 2 | pos0 ← 3, pos1 ← 4 | 3 4 **2** |\n| m 1 | 4 | pos1 ← 2 | 3 2 **4** |\n\n## 5. Traps\n- **Using `mData[i]` instead of `mData[(mFront + i) % mCap]`** — works only while mFront = 0 (the starter main), fails in the grader.\n- **`(mFront + i) % mSize`** — the wrap is at the array size **mCap**, not the number of elements.\n- **Shifting right to left** here overwrites the next element before it's read.\n\n## 6. Background\nLesson 04: CP::queue is a **circular array** — `mFront` is the physical slot of the front; logical i ↔ physical `(mFront + i) % mCap`. Pop is O(1) because it only moves mFront. Compare with Move To Front (shift the other part right).", "th": "## 1. โจทย์บอกอะไร\nเพิ่ม `move_to_back(size_t pos)` ให้ CP::queue: ตัวที่ตำแหน่ง pos (หัวคิว = 0, ท้ายคิว = size()−1) ย้ายไป **ท้ายคิว** ตัวอื่นลำดับเหมือนเดิม <10,20,30,40,50,60> เรียก `move_to_back(3)` → <10,20,30,50,60,**40**>\n\n- คำสั่ง: `u x` push, `o` pop, `m pos`, `p` พิมพ์ (\"Size n: …\"), `q`\n- ถ้าจะได้เต็มควรใช้เวลา O(n − pos)\n\n## 2. จริง ๆ แล้วถามอะไร\nตำแหน่ง i ในคิวอยู่ที่ **ช่องจริง (mFront + i) % mCap** — อาร์เรย์เป็นวงกลม หลัง pop ไปบ้าง ข้อมูลอาจวนเลยท้าย mData กลับมาต้นอาร์เรย์\n\n```text\nlogical:   10 20 30 [40] 50 60\nstep 1: x = 40\nstep 2: 50 → pos 3, 60 → pos 4      (shift the tail LEFT by one)\nstep 3: x → pos 5\nresult:    10 20 30 50 60 40\n```\n\n```text\nอาร์เรย์วงกลม mCap = 4, mFront = 1:\nช่องจริง:  [ 0 | 1 | 2 | 3 ]\n            ^    ^ หัวคิว (ตำแหน่ง 0)\n            └ ตำแหน่ง 3 วนกลับมาอยู่ช่อง 0 = (1 + 3) % 4\n```\n\n## 3. อะไร ทำไม อย่างไร\n- เก็บ `x` = ตัวที่ตำแหน่ง pos\n- i = pos .. n−2: ตำแหน่ง i ← ตำแหน่ง i+1 (**ซ้ายไปขวา** เพราะข้อมูลย้ายไปซ้าย)\n- ตำแหน่ง n−1 ← x ส่วน mSize และ mFront ไม่เปลี่ยน\n- ย้ายแค่ n − pos − 1 ตัว → O(n − pos)\n\n## 4. โค้ดเฉลย\n{{code}}\n{{tests}}\n\n**ไล่ตัวอย่าง** — หลัง `u 1..4`, `o`: คิว = 2 3 4 (mFront = 1, mCap = 4)\n\n| คำสั่ง | x | การเลื่อน | ผล |\n|---|---|---|---|\n| m 0 | 2 | pos0 ← 3, pos1 ← 4 | 3 4 **2** |\n| m 1 | 4 | pos1 ← 2 | 3 2 **4** |\n\n## 5. จุดที่มักพลาด\n- **ใช้ `mData[i]` แทน `mData[(mFront + i) % mCap]`** — ถูกแค่ตอน mFront = 0 (main เริ่มต้น) แต่ผิดใน grader\n- **`(mFront + i) % mSize`** — การวนรอบเกิดที่ขนาดอาร์เรย์ **mCap** ไม่ใช่จำนวนข้อมูล\n- **เลื่อนจากขวาไปซ้าย** ในข้อนี้จะทับตัวถัดไปก่อนที่จะอ่าน\n\n## 6. ความรู้พื้นฐาน\nบทที่ 04: CP::queue คือ **อาร์เรย์วงกลม** — `mFront` คือช่องจริงของหัวคิว ตำแหน่ง i ↔ ช่องจริง `(mFront + i) % mCap` pop เป็น O(1) เพราะแค่ขยับ mFront เทียบกับข้อ Move To Front (เลื่อนอีกส่วนไปทางขวา)"}}, {"id": "d65_q3b_queue_total_reverse", "group": "stackqueue", "lesson": "04 · Queue (circular array)", "stars": 3, "kind": "student.h", "tags": ["CP::queue", "O(1) reverse", "direction flag"], "title": {"en": "Queue Total Reverse", "th": "กลับลำดับคิวทั้งคิว (Queue Total Reverse)"}, "blurb": {"en": "reverse() may be called 10⁶ times on 10⁶ elements — don't move data, flip a direction flag (aux) and make push/pop/front/back obey it.", "th": "reverse() อาจถูกเรียก 10⁶ ครั้งกับข้อมูล 10⁶ ตัว — อย่าย้ายข้อมูล ให้สลับธง aux แล้วให้ push/pop/front/back ทำตามทิศนั้น"}, "tests": {"en": "the PDF sample through the starter main; 300 random scripts mixing push / pop / reverse / front / back (with growth and wrap-around) against a Python list; 10⁶ pushes + 5·10⁵ reverse/pop pairs in 0.55 s. ASan + UBSan clean.", "th": "ตัวอย่างใน PDF ผ่าน main เริ่มต้น; สุ่ม 300 ชุดที่ผสม push / pop / reverse / front / back (มีการขยายและการวนรอบ) เทียบกับ list ใน Python; push 10⁶ ครั้ง + reverse/pop 5·10⁵ คู่ ใช้ 0.55 วินาที ไม่พบข้อผิดพลาดจาก ASan + UBSan"}, "files": [{"name": "student.h", "src": "#ifndef _STUDENT_H_INCLUDED\n#define _STUDENT_H_INCLUDED\n#include \"queue.h\"\n\n// aux == 0 : normal   -> logical front is mData[mFront], data runs forward\n// aux == 1 : reversed -> logical front is the PHYSICAL LAST element,\n//                        logical back is mData[mFront]\n\ntemplate <typename T>\nvoid CP::queue<T>::reverse() {\n  aux = 1 - aux;                       // O(1): just flip the direction\n}\n\ntemplate <typename T>\nconst T& CP::queue<T>::front() const {\n  if (aux == 0) return mData[mFront];\n  return mData[(mFront + mSize - 1) % mCap];\n}\n\ntemplate <typename T>\nconst T& CP::queue<T>::back() const {\n  if (aux == 0) return mData[(mFront + mSize - 1) % mCap];\n  return mData[mFront];\n}\n\ntemplate <typename T>\nvoid CP::queue<T>::push(const T& element) {\n  ensureCapacity(mSize + 1);           // expand keeps the physical order, so both modes stay valid\n  if (aux == 0) {\n    mData[(mFront + mSize) % mCap] = element;     // add after the physical end\n  } else {\n    mFront = (mFront + mCap - 1) % mCap;          // add before the physical start\n    mData[mFront] = element;\n  }\n  mSize++;\n}\n\ntemplate <typename T>\nvoid CP::queue<T>::pop() {\n  if (aux == 0) {\n    mFront = (mFront + 1) % mCap;      // remove the physical start\n  }                                    // reversed: removing the physical end needs no index change\n  mSize--;\n}\n\n#endif\n"}], "body": {"en": "## 1. What the problem says\nAdd `CP::queue<T>::reverse()` that reverses the whole queue: if front() gave 10 then 20, after reverse it gives 50 then 40.\n\n- The class has an extra `int aux` (0 in the constructor) you may use freely.\n- push, pop, front, back already work; you **may rewrite them** in student.h.\n- reverse may be called up to **1,000,000 times**; size up to 10⁶; T may not be int.\n\n## 2. What it really means\nReversing by moving data costs O(n) per call → 10¹² in the worst case. Instead, **remember which end is the front**:\n\n```text\nphysical:  mData[mFront] ... mData[(mFront+mSize-1)%mCap]\naux = 0:   front ────────────────────────────► back\naux = 1:   back  ◄──────────────────────────── front\nreverse(): aux = 1 - aux      (O(1), nothing moves)\n```\n\n## 3. What, why, how\nWith aux = 1 the logical front is the **physical last** slot. Each operation picks its end:\n\n| op | aux = 0 | aux = 1 |\n|---|---|---|\n| front | mData[mFront] | mData[(mFront + mSize − 1) % mCap] |\n| back | physical last | mData[mFront] |\n| push | write after the physical last | **mFront−1** (wrapping), write there |\n| pop | mFront++ | just mSize−− (drop physical last) |\n\n`expand` copies in physical order and resets mFront = 0, which is correct for both modes. Every operation stays O(1) (amortised for push).\n\n## 4. Solution\n{{code}}\n{{tests}}\n\n**Trace:** push 1 2 3 (mCap 4, mFront 0) → reverse → push 9 → front/pop.\n\n| op | aux | mFront | physical slots 0..3 | logical queue |\n|---|---|---|---|---|\n| push 1,2,3 | 0 | 0 | 1 2 3 . | 1 2 3 |\n| reverse | 1 | 0 | 1 2 3 . | 3 2 1 |\n| push 9 | 1 | 3 | 1 2 3 **9** | 3 2 1 9 |\n| front | 1 | 3 | | physical last = slot (3+4−1)%4 = 2 → **3** |\n| pop | 1 | 3 | mSize 4 → 3 | 2 1 9 |\n\n## 5. Traps\n- **Swapping elements in reverse()** — O(n) per call, TLE on the 50% subtask.\n- **`mFront − 1` with size_t** underflows when mFront = 0; use `(mFront + mCap − 1) % mCap`.\n- **Forgetting ensureCapacity before the reversed push** — with a full array, mFront−1 is the physical last element and you'd overwrite it.\n- **Rewriting only front/pop**: back and push must also respect aux.\n\n## 6. Background\nLesson 04: a circular buffer can be read in **either direction**. The trick \"store a flag instead of doing the work\" is called **lazy reversal** — the same idea as a `std::deque` with a direction bit, or lazy flags in segment trees.", "th": "## 1. โจทย์บอกอะไร\nเพิ่ม `CP::queue<T>::reverse()` ที่กลับลำดับทั้งคิว: ถ้าเดิม front() ได้ 10 แล้ว 20 หลัง reverse จะได้ 50 แล้ว 40\n\n- คลาสมีตัวแปร `int aux` เพิ่มมา (constructor ตั้งเป็น 0) ใช้ได้ตามใจ\n- push, pop, front, back มีโค้ดที่ทำงานได้แล้ว **เขียนใหม่ได้** ใน student.h\n- reverse อาจถูกเรียกถึง **1,000,000 ครั้ง** ขนาดคิวถึง 10⁶ และ T อาจไม่ใช่ int\n\n## 2. จริง ๆ แล้วถามอะไร\nถ้ากลับลำดับโดยย้ายข้อมูลจริงจะเป็น O(n) ต่อครั้ง → แย่สุด 10¹² แทนที่จะย้าย ให้ **จำว่าหัวคิวอยู่ปลายไหน**:\n\n```text\nphysical:  mData[mFront] ... mData[(mFront+mSize-1)%mCap]\naux = 0:   front ────────────────────────────► back\naux = 1:   back  ◄──────────────────────────── front\nreverse(): aux = 1 - aux      (O(1), nothing moves)\n```\n\nเหมือนแถวคนที่ทุกคนหันหลังกลับพร้อมกัน: ไม่มีใครเดินสลับที่ แค่ \"หัวแถว\" เปลี่ยนไปอยู่อีกฝั่ง\n\n## 3. อะไร ทำไม อย่างไร\nตอน aux = 1 หัวคิวคือ **ช่องจริงตัวสุดท้าย** แต่ละคำสั่งเลือกปลายของตัวเอง:\n\n| คำสั่ง | aux = 0 | aux = 1 |\n|---|---|---|\n| front | mData[mFront] | mData[(mFront + mSize − 1) % mCap] |\n| back | ช่องจริงตัวสุดท้าย | mData[mFront] |\n| push | เขียนต่อจากช่องจริงตัวสุดท้าย | **mFront−1** (วนรอบ) แล้วเขียนที่นั่น |\n| pop | mFront++ | แค่ mSize−− (ทิ้งช่องจริงตัวสุดท้าย) |\n\n`expand` คัดลอกตามลำดับช่องจริงแล้วตั้ง mFront = 0 ซึ่งถูกทั้งสองโหมด ทุกคำสั่งยังเป็น O(1) (push เป็น O(1) เฉลี่ย)\n\n## 4. โค้ดเฉลย\n{{code}}\n{{tests}}\n\n**ไล่ตัวอย่าง:** push 1 2 3 (mCap 4, mFront 0) → reverse → push 9 → front/pop\n\n| คำสั่ง | aux | mFront | ช่องจริง 0..3 | คิวตามความหมาย |\n|---|---|---|---|---|\n| push 1,2,3 | 0 | 0 | 1 2 3 . | 1 2 3 |\n| reverse | 1 | 0 | 1 2 3 . | 3 2 1 |\n| push 9 | 1 | 3 | 1 2 3 **9** | 3 2 1 9 |\n| front | 1 | 3 | | ช่องจริงตัวสุดท้าย = (3+4−1)%4 = 2 → **3** |\n| pop | 1 | 3 | mSize 4 → 3 | 2 1 9 |\n\n## 5. จุดที่มักพลาด\n- **สลับข้อมูลจริงใน reverse()** — O(n) ต่อครั้ง TLE ในชุด 50%\n- **`mFront − 1` กับ size_t** จะติดลบวนเป็นเลขมหาศาลตอน mFront = 0 ใช้ `(mFront + mCap − 1) % mCap`\n- **ลืม ensureCapacity ก่อน push แบบกลับทิศ** — ถ้าอาร์เรย์เต็ม ช่อง mFront−1 คือข้อมูลตัวสุดท้าย จะถูกเขียนทับ\n- **แก้แค่ front/pop**: back และ push ต้องทำตาม aux ด้วย\n\n## 6. ความรู้พื้นฐาน\nบทที่ 04: บัฟเฟอร์วงกลมอ่านได้ **ทั้งสองทิศ** เทคนิค \"เก็บธงไว้แทนการทำงานจริง\" เรียกว่า **lazy reversal** — แนวคิดเดียวกับ deque ที่มีบิตบอกทิศ หรือ lazy flag ใน segment tree"}}, {"id": "d62_q3b_queue_m2f", "group": "stackqueue", "lesson": "04 · Queue (circular array)", "stars": 2, "kind": "student.h", "tags": ["CP::queue", "circular index", "shift right"], "title": {"en": "Queue Move To Front", "th": "ลัดคิว (Queue Move To Front)"}, "blurb": {"en": "The element at pos jumps to the front — save it, shift positions 0..pos−1 back by one (right to left), put it at mFront.", "th": "ตัวที่ตำแหน่ง pos ลัดคิวไปหัวคิว — เก็บไว้ เลื่อนตำแหน่ง 0..pos−1 ไปข้างหลังหนึ่งช่อง (ขวาไปซ้าย) แล้ววางที่ mFront"}, "tests": {"en": "the PDF script; 300 random u / o / m / p scripts (wrapped data, pos = 0, pos = last) against a Python list model. ASan + UBSan clean.", "th": "ชุดคำสั่งใน PDF; สุ่มชุดคำสั่ง u / o / m / p 300 ชุด (ข้อมูลวนรอบ, pos = 0, pos = ตัวสุดท้าย) เทียบกับโมเดล list ใน Python ไม่พบข้อผิดพลาดจาก ASan + UBSan"}, "files": [{"name": "student.h", "src": "#ifndef __STUDENT_H_\n#define __STUDENT_H_\n\ntemplate <typename T>\nvoid CP::queue<T>::move_to_front(size_t pos) {\n  int p = pos;\n  if (p <= 0 || p >= (int)mSize) return;   // pos 0 is already the front (and out-of-range = nothing to do)\n\n  // logical position i lives at physical slot (mFront + i) % mCap  (circular array)\n  T x = mData[(mFront + p) % mCap];        // remember the element that jumps the queue\n\n  // Shift positions 0 .. p-1 one step toward the BACK (each moves from i-1 to i).\n  // i visits p, p-1, ..., 1 (RIGHT to LEFT): slot i is overwritten only after its old value\n  // was saved (i == p, saved in x) or already copied to i+1 in the previous step.\n  for (int i = p; i >= 1; i--) {\n    mData[(mFront + i) % mCap] = mData[(mFront + i - 1) % mCap];\n  }\n\n  mData[mFront] = x;                       // the saved element becomes the new front (position 0)\n  // mSize, mFront and mCap are unchanged: same elements, new order. Cost O(pos).\n}\n\n#endif\n"}], "body": {"en": "## 1. What the problem says\nAdd `move_to_front(size_t pos)` to CP::queue: the element at position pos \"cuts the line\" to the front; the others keep their order. <10,20,30,40,50,60>, `move_to_front(3)` → <**40**,10,20,30,50,60>.\n\n- Commands: `u x`, `o`, `m pos`, `p` (\"Size n: …\"), `q`. Sample: after pushes 1..4 and a pop, `m 1` → `3 2 4`, then `m 2` → `4 3 2`.\n\n## 2. What it really means\nThe mirror image of Move To Back: the part **in front of** pos moves **one step back**.\n\n```text\nlogical:   10 20 30 [40] 50 60\nx = 40\nshift:     _  10 20 30   50 60     positions 0..2 move to 1..3\nput x:     40 10 20 30   50 60\n```\n\n## 3. What, why, how\n- Save x = position pos.\n- For i = pos down to 1: position i ← position i−1 (**right to left**, because data moves right).\n- Position 0 (physical slot mFront) ← x. O(pos).\n- Every logical index goes through `(mFront + i) % mCap`.\n\n## 4. Solution\n{{code}}\n{{tests}}\n\n**Trace of the sample** — queue 2 3 4 (mFront = 1):\n\n| call | x | shifts (right to left) | result |\n|---|---|---|---|\n| m 1 | 3 | pos1 ← 2 | **3** 2 4 |\n| m 2 | 4 | pos2 ← 2, pos1 ← 3 | **4** 3 2 |\n\n## 5. Traps\n- **Left-to-right shift** copies position 0 into every slot up to pos.\n- **Forgetting the circular index** (works only while mFront = 0).\n- A cute alternative: decrement mFront (`(mFront + mCap − 1) % mCap`) and shift the part *before* pos left — same O(pos), more chances for mistakes.\n\n## 6. Background\nLesson 04: circular queue indexing; Lesson 03: direction rule for in-place shifts — **moving right → loop right to left**. Pairs with Move To Back.", "th": "## 1. โจทย์บอกอะไร\nเพิ่ม `move_to_front(size_t pos)` ให้ CP::queue: ตัวที่ตำแหน่ง pos \"ลัดคิว\" ไปอยู่หัวคิว ตัวอื่นลำดับเหมือนเดิม <10,20,30,40,50,60> เรียก `move_to_front(3)` → <**40**,10,20,30,50,60>\n\n- คำสั่ง: `u x`, `o`, `m pos`, `p` (\"Size n: …\"), `q` ตัวอย่าง: push 1..4 แล้ว pop, `m 1` → `3 2 4` แล้ว `m 2` → `4 3 2`\n\n## 2. จริง ๆ แล้วถามอะไร\nกลับด้านกับข้อ Move To Back: ส่วนที่อยู่ **ข้างหน้า** pos ถอย **ไปข้างหลังหนึ่งช่อง**\n\n```text\nlogical:   10 20 30 [40] 50 60\nx = 40\nshift:     _  10 20 30   50 60     positions 0..2 move to 1..3\nput x:     40 10 20 30   50 60\n```\n\nเหมือนคนแซงคิว: คนที่ยืนข้างหน้าเขาต้องถอยหลังคนละหนึ่งก้าว คนข้างหลังเขาไม่ต้องขยับ\n\n## 3. อะไร ทำไม อย่างไร\n- เก็บ x = ตำแหน่ง pos\n- i = pos ลงไปถึง 1: ตำแหน่ง i ← ตำแหน่ง i−1 (**ขวาไปซ้าย** เพราะข้อมูลย้ายไปขวา)\n- ตำแหน่ง 0 (ช่องจริง mFront) ← x เวลา O(pos)\n- ทุก index ต้องผ่าน `(mFront + i) % mCap`\n\n## 4. โค้ดเฉลย\n{{code}}\n{{tests}}\n\n**ไล่ตัวอย่าง** — คิว 2 3 4 (mFront = 1):\n\n| คำสั่ง | x | การเลื่อน (ขวาไปซ้าย) | ผล |\n|---|---|---|---|\n| m 1 | 3 | pos1 ← 2 | **3** 2 4 |\n| m 2 | 4 | pos2 ← 2, pos1 ← 3 | **4** 3 2 |\n\n## 5. จุดที่มักพลาด\n- **เลื่อนจากซ้ายไปขวา** จะคัดลอกตำแหน่ง 0 ไปทุกช่องจนถึง pos\n- **ลืม index วงกลม** (ถูกแค่ตอน mFront = 0)\n- อีกวิธีที่น่ารัก: ลด mFront (`(mFront + mCap − 1) % mCap`) แล้วเลื่อนส่วน *ก่อน* pos ไปซ้าย — O(pos) เหมือนกัน แต่พลาดง่ายกว่า\n\n## 6. ความรู้พื้นฐาน\nบทที่ 04: การใช้ index ของคิววงกลม; บทที่ 03: กฎทิศทางของการเลื่อนในที่เดิม — **ย้ายไปขวา → ไล่จากขวาไปซ้าย** คู่กับข้อ Move To Back"}}, {"id": "d60_q1_qat", "group": "stackqueue", "lesson": "04 · Queue (circular array)", "stars": 1, "kind": "student.h", "tags": ["CP::queue", "operator[]", "negative index"], "title": {"en": "Queue At", "th": "เข้าถึงข้อมูลในคิวด้วย [] (Queue At)"}, "blurb": {"en": "q[k] returns the k-th element from the front; negative k counts from the back (−1 = last). Convert to a position, then to a physical slot.", "th": "q[k] คืนข้อมูลตัวที่ k จากหัวคิว; k ติดลบนับจากท้าย (−1 = ตัวสุดท้าย) แปลงเป็นตำแหน่งก่อน แล้วค่อยแปลงเป็นช่องจริง"}, "tests": {"en": "both PDF scripts; 300 random a / d / k / p scripts with positive and negative k on wrapped queues against Python indexing. ASan + UBSan clean.", "th": "ชุดคำสั่งใน PDF ทั้งสองชุด; สุ่มชุดคำสั่ง a / d / k / p 300 ชุด ทั้ง k บวกและลบ บนคิวที่วนรอบ เทียบกับ index ของ Python ไม่พบข้อผิดพลาดจาก ASan + UBSan"}, "files": [{"name": "student.h", "src": "#ifndef __STUDENT_H_\n#define __STUDENT_H_\n\n\ntemplate <typename T>\nT CP::queue<T>::operator[](int idx) {\n  int n = mSize;\n\n  // Negative idx counts from the back: -1 = last (position n-1), -n = front (position 0).\n  // So a negative idx means position n + idx.\n  int k = idx;\n  if (k < 0) {\n    k = n + k;            // e.g. n = 5: -1 -> 4, -2 -> 3, -5 -> 0\n  }\n\n  // logical position k lives at physical slot (mFront + k) % mCap  (circular array)\n
