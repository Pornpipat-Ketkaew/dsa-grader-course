/* Part II · CP::vector (real code from vector.h in the course folder) */

const VEC_CLASS = `namespace CP {
template <typename T>
class vector {
  public:
    typedef T* iterator;
  protected:
    T *mData;
    size_t mCap;
    size_t mSize;

    void expand(size_t capacity) {
      T *arr = new T[capacity]();
      for (size_t i = 0;i < mSize;i++) {
        arr[i] = mData[i];
      }
      delete [] mData;
      mData = arr;
      mCap = capacity;
    }
    void ensureCapacity(size_t capacity) {
      if (capacity > mCap) {
        size_t s = (capacity > 2 * mCap) ? capacity : 2 * mCap;
        expand(s);
      }
    }
  public:
    vector() {
      int cap = 1;
      mData = new T[cap]();
      mCap = cap;
      mSize = 0;
    }
    ~vector() { delete [] mData; }
    iterator begin() { return &mData[0]; }
    iterator end() { return begin()+mSize; }
    T& operator[](int index) { return mData[index]; }
    void push_back(const T& element) {
      insert(end(),element);
    }
    void pop_back() {
      mSize--;
    }
    iterator insert(iterator it,const T& element) {
      size_t pos = it - begin();
      ensureCapacity(mSize + 1);
      for(size_t i = mSize;i > pos;i--) {
        mData[i] = mData[i-1];
      }
      mData[pos] = element;
      mSize++;
      return begin()+pos;
    }
    void erase(iterator it) {
      while((it+1)!=end()) {
        *it = *(it+1);
        it++;
      }
      mSize--;
    }
};
}
int main() {
  CP::vector<int> v;
`;

function parseVecOps(str) {
  const ops = parseOps(str, 14).map(o => {
    const n = o[0];
    if (['push_back', 'push', 'pb'].includes(n)) { if (typeof o[1] !== 'number') throw userErr(L('push_back needs a number, e.g. "push_back 7".', 'push_back ต้องมีตัวเลข เช่น "push_back 7"')); return ['push_back', o[1]]; }
    if (['pop_back', 'pop'].includes(n)) return ['pop_back'];
    if (n === 'insert') { if (typeof o[1] !== 'number' || typeof o[2] !== 'number') throw userErr(L('insert needs a position and a value, e.g. "insert 1 99".', 'insert ต้องมีตำแหน่งและค่า เช่น "insert 1 99"')); return ['insert', o[1], o[2]]; }
    if (n === 'erase') { if (typeof o[1] !== 'number') throw userErr(L('erase needs a position, e.g. "erase 0".', 'erase ต้องมีตำแหน่ง เช่น "erase 0"')); return ['erase', o[1]]; }
    if (n === 'set') { if (typeof o[1] !== 'number' || typeof o[2] !== 'number') throw userErr(L('set needs an index and a value, e.g. "set 0 5".', 'set ต้องมีดัชนีและค่า เช่น "set 0 5"')); return ['set', o[1], o[2]]; }
    if (n === 'keep') { if (typeof o[1] !== 'number') throw userErr(L('keep needs an index, e.g. "keep 0".', 'keep ต้องมีดัชนี เช่น "keep 0"')); return ['keep', o[1]]; }
    throw userErr(L('Unknown operation "' + n + '". Use push_back, pop_back, insert, erase, set, keep.', 'ไม่รู้จักคำสั่ง "' + n + '" ใช้ได้: push_back, pop_back, insert, erase, set, keep'));
  });
  if (!ops.length) throw userErr(L('Type at least one operation.', 'ใส่คำสั่งอย่างน้อยหนึ่งคำสั่ง'));
  if (ops.filter(o => o[0] === 'keep').length > 1) throw userErr(L('Use keep at most once.', 'ใช้ keep ได้ครั้งเดียว'));
  return ops;
}
function vecOpLine(o) {
  switch (o[0]) {
    case 'push_back': return '  v.push_back(' + o[1] + ');';
    case 'pop_back': return '  v.pop_back();';
    case 'insert': return '  v.insert(v.begin() + ' + o[1] + ', ' + o[2] + ');';
    case 'erase': return '  v.erase(v.begin() + ' + o[1] + ');';
    case 'set': return '  v[' + o[1] + '] = ' + o[2] + ';';
    case 'keep': return '  int* p = &v[' + o[1] + '];   // keep a pointer into the buffer';
  }
}
function vecCode(ops) { return VEC_CLASS + ops.map(vecOpLine).join('\n') + '\n}   // v is destroyed here\n'; }

        '<code>CP::vector&lt;int&gt; v;</code> จอง <b>24 ไบต์</b> ในเฟรมของ main สำหรับฟิลด์ทั้งสาม อ็อบเจกต์เล็ก ๆ นี้คือส่วน<i>ทั้งหมด</i>ของ v ที่อยู่บน stack ข้อมูลจริงจะอยู่บน heap'));

            sim.step(at('void push_back'), L('push_back is one line: insert at end().', 'push_back มีแค่บรรทัดเดียว: insert ที่ end()'));
            sim.rf(v, 'mData'); sim.rf(v, 'mSize');
            sim.step(at('insert(end(),element)'), L('end() = begin() + mSize = ' + hex(buf()) + ' + ' + size + '×4 = ' + hex(buf() + 4 * size) + '.', 'end() = begin() + mSize = ' + hex(buf()) + ' + ' + size + '×4 = ' + hex(buf() + 4 * size)));
            insert(size, o[1], t, true);
            sim.step(at('insert(end(),element)'), L('insert returned.', 'insert คืนค่าแล้ว'));
            sim.ret(undefined, { show: false });
          });
          sim.step(L0, L('Done: v = [' + cellsOf(sim, buf()).slice(0, sim.pf(v, 'mSize')).join(', ') + '], mSize = ' + sim.pf(v, 'mSize') + ', mCap = ' + sim.pf(v, 'mCap') + '. The temporary is gone.', 'เสร็จ: v = [' + cellsOf(sim, buf()).slice(0, sim.pf(v, 'mSize')).join(', ') + '] mSize = ' + sim.pf(v, 'mSize') + ', mCap = ' + sim.pf(v, 'mCap') + ' กล่องชั่วคราวหายไปแล้ว'));
        } else if (o[0] === 'insert') {
          if (o[1] < 0 || o[1] > size) throw userErr(L('insert position ' + o[1] + ' is outside 0…' + size + ' (the current size).', 'ตำแหน่ง insert ' + o[1] + ' อยู่นอกช่วง 0…' + size + ' (ขนาดปัจจุบัน)'));
          withTemp(o[2], t => {

            insert(o[1], o[2], t, false);

          sim.step(L0, L('Done: v = [' + cellsOf(sim, buf()).slice(0, sim.pf(v, 'mSize')).join(', ') + '].', 'เสร็จ: v = [' + cellsOf(sim, buf()).slice(0, sim.pf(v, 'mSize')).join(', ') + ']'));
        } else if (o[0] === 'erase') {
          if (o[1] < 0 || o[1] >= size) throw userErr(L('erase position ' + o[1] + ' is outside 0…' + (size - 1) + '.', 'ตำแหน่ง erase ' + o[1] + ' อยู่นอกช่วง 0…' + (size - 1)));
          sim.step(L0, L('<code>v.erase(v.begin() + ' + o[1] + ')</code>.', '<code>v.erase(v.begin() + ' + o[1] + ')</code>'));

          for (let j = o[1]; j + 1 < size; j++) {
            const b = buf();
            sim.r(itA);
            sim.step(at('while((it+1)!=end())'), L('it + 1 = ' + hex(b + 4 * (j + 1)) + ' is not end() (' + hex(b + 4 * size) + '), so keep shifting.', 'it + 1 = ' + hex(b + 4 * (j + 1)) + ' ยังไม่ใช่ end() (' + hex(b + 4 * size) + ') จึงเลื่อนต่อ'));
            const x = sim.r(b + 4 * (j + 1)); sim.w(b + 4 * j, x);
            sim.step(at('*it = *(it+1)'), L('Copy the right neighbour left: mData[' + j + '] = ' + x + '.', 'คัดลอกเพื่อนบ้านทางขวามาทางซ้าย: mData[' + j + '] = ' + x));

          }
          sim.r(itA);
          sim.step(at('while((it+1)!=end())'), L('it + 1 == end(): stop. The old last value is still physically there, but it will no longer count.', 'it + 1 == end(): หยุด ค่าตัวสุดท้ายเดิมยังอยู่ในหน่วยความจำจริง แต่จะไม่ถูกนับแล้ว'));
          sim.wf(v, 'mSize', size - 1); sync();
          sim.step(at('mSize--;', 2), L('mSize = ' + (size - 1) + '. Erasing at position p costs O(n − p) shifts; the capacity never shrinks.', 'mSize = ' + (size - 1) + ' การลบที่ตำแหน่ง p ต้องเลื่อน O(n − p) ครั้ง ความจุไม่เคยลดลง'));

          sim.ret(undefined, { show: false });
          sim.step(L0, L('Done: v = [' + cellsOf(sim, buf()).slice(0, size - 1).join(', ') + '].', 'เสร็จ: v = [' + cellsOf(sim, buf()).slice(0, size - 1).join(', ') + ']'));
        } else if (o[0] === 'set') {
          if (o[1] < 0 || o[1] >= size) throw userErr(L('index ' + o[1] + ' is outside 0…' + (size - 1) + '. operator[] does not check bounds, so this would be undefined behaviour.', 'ดัชนี ' + o[1] + ' อยู่นอกช่วง 0…' + (size - 1) + ' operator[] ไม่ตรวจขอบเขต จึงเป็น undefined behaviour'));
          sim.rf(v, 'mData'); sim.w(buf() + 4 * o[1], o[2]);
          sim.step(L0, L('<code>v[' + o[1] + ']</code> returns a <b>reference</b> to mData[' + o[1] + '] at ' + hex(buf() + 4 * o[1]) + ', and we write ' + o[2] + ' through it. O(1).', '<code>v[' + o[1] + ']</code> คืน <b>reference</b> ไปยัง mData[' + o[1] + '] ที่ ' + hex(buf() + 4 * o[1]) + ' แล้วเราเขียน ' + o[2] + ' ผ่านมัน O(1)'));
        } else if (o[0] === 'keep') {
          if (o[1] < 0 || o[1] >= size) throw userErr(L('keep index must be inside 0…' + (size - 1) + '.', 'ดัชนีของ keep ต้องอยู่ในช่วง 0…' + (size - 1)));
          keepP = sim.local('p', 'int*', P(buf() + 4 * o[1]));
          sim.step(L0, L('<code>p</code> stores the address ' + hex(buf() + 4 * o[1]) + ' of v[' + o[1] + ']. Fine for now. Watch what happens to p the next time the vector has to grow.', '<code>p</code> เก็บแอดเดรส ' + hex(buf() + 4 * o[1]) + ' ของ v[' + o[1] + '] ตอนนี้ยังใช้ได้ ดูว่าจะเกิดอะไรกับ p ครั้งถัดไปที่ vector ต้องขยาย'));
        }
      });
      const endL = opL(ops.length);
      sim.step(endL, L('End of main. v holds [' + cellsOf(sim, buf()).slice(0, sim.pf(v, 'mSize')).join(', ') + '] with mSize = ' + sim.pf(v, 'mSize') + ' and mCap = ' + sim.pf(v, 'mCap') + '.' + (keepP ? ' Is p still pointing at a live buffer? If it is red, any *p would be undefined behaviour.' : ''), 'จบ main v เก็บ [' + cellsOf(sim, buf()).slice(0, sim.pf(v, 'mSize')).join(', ') + '] โดย mSize = ' + sim.pf(v, 'mSize') + ' และ mCap = ' + sim.pf(v, 'mCap') + (keepP ? ' p ยังชี้ไปยังบัฟเฟอร์ที่ใช้ได้อยู่ไหม? ถ้าเป็นสีแดง การใช้ *p คือ undefined behaviour' : '')));
      sim.call(fn('~vector()')); sim.param('this', 'vector*', P(v));
      sim.free(buf());
      sim.step(at('~vector()'), L('The destructor runs automatically when v goes out of scope: <code>delete [] mData</code>. No leak, and you never wrote delete yourself.', 'destructor ทำงานอัตโนมัติเมื่อ v หมดขอบเขต: <code>delete [] mData</code> ไม่รั่ว และคุณไม่ต้องเขียน delete เอง'));
      sim.ret(undefined, { show: false });
      sim.ret(0, { show: false });
      sim.step(endL, L('main\'s frame is popped. Everything is cleaned up.', 'เฟรมของ main ถูก pop ทุกอย่างถูกเก็บกวาดเรียบร้อย'));
    }
  });

// shared: ensureCapacity + expand for array-backed CP containers.
// opts: {obj, fn, at, label, queue}  (queue → logical copy with mFront and reset mFront = 0)
function cpGrow(sim, need, o) {
  const { obj, fn, at } = o;
  sim.call(fn('ensureCapacity(size_t capacity)'));
  sim.param('this', o.cls + '*', P(obj)); sim.param('capacity', 'size_t', need);
  const cap = sim.rf(obj, 'mCap');
  if (need <= cap) {
    sim.step(at('if (capacity > mCap)'), L(need + ' &gt; mCap (' + cap + ')? No, there is room.', need + ' &gt; mCap (' + cap + ') หรือไม่? ไม่ ยังมีที่ว่าง'));
    sim.ret(undefined, { show: false });
    return false;
  }
  sim.step(at('if (capacity > mCap)'), L(need + ' &gt; mCap (' + cap + ')? <b>Yes</b>: full, so grow.', need + ' &gt; mCap (' + cap + ') หรือไม่? <b>ใช่</b>: เต็มแล้ว ต้องขยาย'));
  const s = need > 2 * cap ? need : 2 * cap;
  sim.local('s', 'size_t', s);
  sim.step(at('size_t s ='), L('New capacity: ' + s + ' (double).', 'ความจุใหม่: ' + s + ' (สองเท่า)'));
  sim.call(fn('expand(size_t capacity)'));
  sim.param('this', o.cls + '*', P(obj)); sim.param('capacity', 'size_t', s);
  const old = sim.pf(obj, 'mData').p;
  const nb = sim.newArray('int', s, 0, { expr: 'new int[' + s + ']()', label: L('arr: the new buffer', 'arr: บัฟเฟอร์ใหม่'), used: 0 });
  sim.local('arr', 'int*', P(nb));
  sim.step(at('T *arr = new T[capacity]()'), L('Allocate a new buffer of ' + s + ' slots.', 'จองบัฟเฟอร์ใหม่ ' + s + ' ช่อง'));
  const n = sim.rf(obj, 'mSize');
  const front = o.queue ? sim.rf(obj, 'mFront') : 0;
  const ia = sim.local('i', 'size_t', 0);
  for (let k = 0; k < n; k++) {
    sim.w(ia, k);
    const src = (front + k) % cap;
    const val = sim.r(old + 4 * src); sim.w(nb + 4 * k, val);
    sim.block(nb).used = k + 1;
    sim.step(at(o.queue ? 'arr[i] = mData[(mFront + i) % mCap]' : 'arr[i] = mData[i]'), o.queue
      ? L('i = ' + k + ': logical element ' + k + ' sits at physical (' + front + ' + ' + k + ') % ' + cap + ' = ' + src + '. Copy ' + val + ' to arr[' + k + '].', 'i = ' + k + ': สมาชิกลำดับที่ ' + k + ' อยู่ที่ตำแหน่งจริง (' + front + ' + ' + k + ') % ' + cap + ' = ' + src + ' คัดลอก ' + val + ' ไป arr[' + k + ']')
      : L('i = ' + k + ': copy ' + val + '.', 'i = ' + k + ': คัดลอก ' + val));
  }
  sim.drop('i');
  sim.free(old);
  sim.step(at('delete [] mData'), L('Free the old buffer.', 'คืนบัฟเฟอร์เก่า'));
  sim.wf(obj, 'mData', P(nb));
  sim.step(at('mData = arr'), L('mData now points at the new buffer.', 'mData ชี้ไปที่บัฟเฟอร์ใหม่'));
  sim.wf(obj, 'mCap', s);
  o.sync && o.sync();
  sim.step(at('mCap = capacity'), L('mCap = ' + s + '.', 'mCap = ' + s));
  if (o.queue) {
    sim.wf(obj, 'mFront', 0); o.sync && o.sync();
    sim.step(at('mFront = 0'), L('<b>mFront = 0</b>: the copy put the elements back in logical order starting at slot 0, so the wrap-around is "undone".', '<b>mFront = 0</b>: การคัดลอกเรียงสมาชิกใหม่ตามลำดับเชิงตรรกะเริ่มที่ช่อง 0 การวนรอบจึงถูก "คลาย" ออก'));
  }
  sim.ret(undefined, { show: false });
  sim.ret(undefined, { show: false });
  return true;
}

// ------------------------------------------------------------------ CP::stack
(() => {
  const CLS = `namespace CP {
template <typename T>
class stack {
  protected:
    T *mData;
    size_t mCap;
    size_t mSize;

    void expand(size_t capacity) {
      T *arr = new T[capacity]();
      for (size_t i = 0;i < mSize;i++) {
        arr[i] = mData[i];
      }
      delete [] mData;
      mData = arr;
      mCap = capacity;
    }
    void ensureCapacity(size_t capacity) {
      if (capacity > mCap) {
        size_t s = (capacity > 2 * mCap) ? capacity : 2 * mCap;
        expand(s);
      }
    }
  public:
    stack() {
      int cap = 1;
      mData = new T[cap]();
      mCap = cap;
      mSize = 0;
    }
    const T& top() const {
      return mData[mSize-1];
    }
    void push(const T& element) {
      ensureCapacity(mSize + 1);
      mData[mSize] = element;
      mSize++;
    }
    void pop() {
      mSize--;
    }
};
}
int main() {
  CP::stack<int> s;
`;
  const parse = str => {
    const ops = parseOps(str, 14).map(o => {
      if (o[0] === 'push') { if (typeof o[1] !== 'number') throw userErr(L('push needs a number.', 'push ต้องมีตัวเลข')); return ['push', o[1]]; }
      if (o[0] === 'pop') return ['pop'];
      if (o[0] === 'top') return ['top'];
      throw userErr(L('Unknown operation "' + o[0] + '". Use push x, pop, top.', 'ไม่รู้จักคำสั่ง "' + o[0] + '" ใช้ได้: push x, pop, top'));
    });
    if (!ops.length) throw userErr(L('Type at least one operation.', 'ใส่คำสั่งอย่างน้อยหนึ่งคำสั่ง'));
    return ops;
  };
  const line = o => o[0] === 'push' ? '  s.push(' + o[1] + ');' : o[0] === 'pop' ? '  s.pop();' : '  cout << s.top() << "\\n";';
  const codeOf = ops => CLS + ops.map(line).join('\n') + '\n}\n';
  const DEF = 'push 10, push 20, push 30, top, pop, push 40, push 50, top';

    id: 'cp-stack', part: 2, lesson: '04', lessonFile: '04-cp-stack-queue.md', dangOK: true,
    title: L('CP::stack: the top is the end of an array', 'CP::stack: top คือท้ายอาร์เรย์'),
    summary: L('CP::stack is a dynamic array where only the last slot is visible. push writes mData[mSize] and pop just does mSize--. The tower on top shows the LIFO picture; the memory below shows that it is really a plain array.',
      'CP::stack คืออาร์เรย์แบบยืดได้ที่มองเห็นแค่ช่องสุดท้าย push เขียนที่ mData[mSize] ส่วน pop แค่ mSize-- ภาพหอคอยด้านบนแสดงแนวคิด LIFO ส่วนหน่วยความจำด้านล่างแสดงว่าจริง ๆ มันคืออาร์เรย์ธรรมดา'),
    blurb: L('push, pop, top and "k-th from the top = mData[mSize-1-k]".', 'push, pop, top และ "ตัวที่ k จากบน = mData[mSize-1-k]"'),
    params: [{ id: 'ops', label: L('Operations', 'คำสั่ง'), value: DEF }],
    paramHint: L('push x · pop · top', 'push x · pop · top'),
    code: codeOf(parse(DEF)),
    codeFn: p => { try { return codeOf(parse(p.ops)); } catch (e) { return CLS + '}\n'; } },
    build(sim, prm) {
      const ops = parse(prm.ops), code = codeOf(ops), at = LN(code);

      const sync = () => { const b = sim.block(buf()); if (b) { b.used = sim.pf(s, 'mSize'); b.label = L('s.mData buffer · mCap = ' + sim.pf(s, 'mCap'), 'บัฟเฟอร์ของ s.mData · mCap = ' + sim.pf(s, 'mCap')); } };

  protected:

    size_t mCap;

      T *arr = new T[capacity]();
      for (size_t i = 0;i < mSize;i++) {
        arr[i] = mData[(mFront + i) % mCap];
      }

      mData = arr;
      mCap = capacity;
      mFront = 0;
    }

      if (capacity > mCap) {
        size_t s = (capacity > 2 * mCap) ? capacity : 2 * mCap;
        expand(s);
      }

    }

/* Part II · CP::list (real code from list.h) */
(() => {
  const CLS = `namespace CP {
template <typename T>
class list {
  protected:
    class node {
      public:
        T data;
        node *prev;
        node *next;
        node() :
          data( T() ), prev( this ), next( this ) { }
        node(const T& data,node* prev, node* next) :
          data ( T(data) ), prev( prev ), next( next ) { }
    };
    class list_iterator {
      public:
        node* ptr;
        list_iterator& operator++() { ptr = ptr->next; return (*this); }
    };
    node *mHeader;   // the sentinel
    size_t mSize;
  public:
    typedef list_iterator iterator;
    list() :
      mHeader( new node() ), mSize( 0 ) { }
    iterator begin() { return iterator(mHeader->next); }
    iterator end()   { return iterator(mHeader); }
    void push_back(const T& element)  { insert(end(),element); }
    void push_front(const T& element) { insert(begin(),element); }
    void pop_front() { erase(begin()); }
    void pop_back()  { erase(iterator(mHeader->prev)); }

    iterator insert(iterator it,const T& element) {
      node *n = new node(element,it.ptr->prev, it.ptr);
      it.ptr->prev->next = n;
      it.ptr->prev = n;
      mSize++;
      return iterator(n);
    }
    iterator erase(iterator it) {
      iterator tmp(it.ptr->next);
      it.ptr->prev->next = it.ptr->next;
      it.ptr->next->prev = it.ptr->prev;
      delete it.ptr;
      mSize--;
      return tmp;
    }
    ~list() { clear(); delete mHeader; }
};
}
int main() {
  CP::list<int> l;
`;

      throw userErr(L('Unknown operation "' + n + '". Use push_back, push_front, insert, erase, pop_front, pop_back.', 'ไม่รู้จักคำสั่ง "' + n + '" ใช้ได้: push_back, push_front, insert, erase, pop_front, pop_back'));
    });
    if (!ops.length) throw userErr(L('Type at least one operation.', 'ใส่คำสั่งอย่างน้อยหนึ่งคำสั่ง'));
    return ops;
  };
  const line = o => {
    if (o[0] === 'push_back' || o[0] === 'push_front') return '  l.' + o[0] + '(' + o[1] + ');';
    if (o[0] === 'insert') return '  { auto it = l.begin(); for (int k = 0; k < ' + o[1] + '; k++) ++it; l.insert(it, ' + o[2] + '); }';
    if (o[0] === 'erase') return '  { auto it = l.begin(); for (int k = 0; k < ' + o[1] + '; k++) ++it; l.erase(it); }';
    return '  l.' + o[0] + '();';
  };
  const codeOf = ops => CLS + ops.map(line).join('\n') + '\n}\n';
  const DEF = 'push_back 10, push_back 20, push_front 5, insert 2 15, erase 1, pop_back';
  def({
    id: 'cp-list', part: 2, lesson: '05', lessonFile: '05-cp-list.md', dangOK: true,
    title: L('CP::list: nodes, a sentinel, and pointer surgery', 'CP::list: โหนด sentinel และการผ่าตัดพอยน์เตอร์'),
    summary: L('Every element is its own heap node holding data, prev and next. The header (sentinel) node holds no data and closes the circle, so insert and erase never need a special case. Watch each pointer assignment of insert and erase, one arrow at a time.',
      'สมาชิกแต่ละตัวเป็นโหนดของตัวเองบน heap ที่เก็บ data, prev และ next โหนด header (sentinel) ไม่เก็บข้อมูลและปิดวงให้ครบ insert และ erase จึงไม่ต้องมีกรณีพิเศษ ดูการกำหนดพอยน์เตอร์ทีละลูกศรใน insert และ erase'),
    blurb: L('Header node, the 4 link updates of insert, unlinking in erase.', 'โหนด header การแก้ลิงก์ 4 จุดของ insert และการปลดโหนดใน erase'),
    params: [{ id: 'ops', label: L('Operations', 'คำสั่ง'), value: DEF }],
    paramHint: L('push_back x · push_front x · insert pos x · erase pos · pop_front · pop_back', 'push_back x · push_front x · insert pos x · erase pos · pop_front · pop_back'),
    code: codeOf(parse(DEF)),
    codeFn: p => { try { return codeOf(parse(p.ops)); } catch (e) { return CLS + '}\n'; } },
    build(sim, prm) {
      const ops = parse(prm.ops), code = codeOf(ops), at = LN(code);
      const mainL = at('int main');
      let l, H;
      const fn = x => 'list<int>::' + x;
      const nodeF = (addr, f) => sim.pf(addr, f);
      const order = () => { const out = []; let p = nodeF(H, 'next').p, guard = 0; while (p !== H && guard++ < 50) { out.push(p); p = nodeF(p, 'next').p; } return out; };
      const vals = () => order().map(a => nodeF(a, 'data'));
      const labelNodes = () => { for (const b of sim.heap) if (b.kind === 'obj' && b.addr !== H) b.label = L('node ' + fmtPlain(b.fields[0].value), 'โหนด ' + fmtPlain(b.fields[0].value)); };

      sim.viewFn = S => {
        if (!H) return null;
        const get = (a, f) => { const b = S.heap.find(x => x.addr === a && !x.freed); return b ? b.fields.find(x => x.name === f).value : null; };
        const nodes = [], seen = new Set(), slot = new Map();
        nodes.push({ addr: H, label: 'header', sub: hex(H), slot: 0, header: true }); seen.add(H); slot.set(H, 0);
        let p = get(H, 'next'), k = 1, guard = 0;
        while (p && p.p !== H && seen.size < 40 && guard++ < 40) {
          const a = p.p; if (seen.has(a) || !S.heap.find(x => x.addr === a && !x.freed)) break;
          seen.add(a); slot.set(a, k); nodes.push({ addr: a, label: fmtPlain(get(a, 'data')), sub: hex(a), slot: k++ });
          p = get(a, 'next');
        }
        // nodes not reachable via next (being inserted or being removed)
        for (const b of S.heap) if (b.kind === 'obj' && !seen.has(b.addr)) {
          const pv = b.fields.find(x => x.name === 'prev').value;
          const base = pv && slot.has(pv.p) ? slot.get(pv.p) + 0.5 : k;
          nodes.push({ addr: b.addr, label: fmtPlain(b.fields[0].value), sub: hex(b.addr), slot: base, row: 1, cls: b.freed ? 'bad' : 'chg' });
          seen.add(b.addr);
        }
        const links = [];
        for (const n of nodes) {
          const b = S.heap.find(x => x.addr === n.addr); if (!b) continue;
          const nx = b.fields.find(x => x.name === 'next').value, pv = b.fields.find(x => x.name === 'prev').value;
          if (nx && seen.has(nx.p)) links.push({ from: n.addr, to: nx.p, kind: 'next' });
          if (pv && seen.has(pv.p)) links.push({ from: n.addr, to: pv.p, kind: 'prev' });
        }
        // highlight the iterator target
        const top = S.top();
        const itv = top && top.vars.find(x => x.name === 'it' && x.kind === 'obj');
        if (itv) { const t = itv.fields[0].value; const nd = nodes.find(x => isP(t) && x.addr === t.p); if (nd) nd.tag = 'it'; }
        const nv = top && top.vars.find(x => x.name === 'n');
        if (nv && isP(nv.value)) { const nd = nodes.find(x => x.addr === nv.value.p); if (nd) nd.tag = (nd.tag ? nd.tag + ',' : '') + 'n'; }
        return { kind: 'chain', title: L('the chain of nodes', 'สายโซ่ของโหนด'), cap: L('Red arcs on top are next pointers; blue arcs below are prev pointers. The last node\'s next and the header\'s prev close the circle. A node being inserted or removed is drawn on the lower row.', 'เส้นโค้งสีแดงด้านบนคือพอยน์เตอร์ next เส้นสีน้ำเงินด้านล่างคือ prev next ของโหนดสุดท้ายและ prev ของ header ปิดวงให้ครบ โหนดที่กำลังถูกแทรกหรือถูกลบจะอยู่แถวล่าง'), nodes, links };
      };

      sim.call('main()');
      sim.step(mainL, L('main starts.', 'main เริ่มทำงาน'));
      l = sim.obj('l', 'CP::list<int>', [['mHeader', 'node*', undefined], ['mSize', 'size_t', undefined]]);
      sim.call(fn('list()')); sim.param('this', 'list*', P(l));
      H = sim.newObj('node', [['data', 'int', 0], ['prev', 'node*', P(0)], ['next', 'node*', P(0)]], { label: L('header (sentinel)', 'header (sentinel)'), expr: 'new node()' });
      sim.wf(H, 'prev', P(H)); sim.wf(H, 'next', P(H));
      sim.wf(l, 'mHeader', P(H)); sim.wf(l, 'mSize', 0);
      sim.step(at('mHeader( new node() )'), L(
        'The constructor allocates the <b>header node</b>. Its <code>node()</code> constructor sets <code>prev = next = this</code>: an empty list is a header that points to itself in both directions. Its data (0) is never used.',
        'คอนสตรักเตอร์จอง<b>โหนด header</b> คอนสตรักเตอร์ <code>node()</code> ของมันตั้งค่า <code>prev = next = this</code> list ว่างคือ header ที่ชี้กลับมาที่ตัวเองทั้งสองทาง data ของมัน (0) ไม่เคยถูกใช้'));
      sim.ret(undefined, { show: false });
      sim.step(mainL + 1, L('l is ready. On the stack it is only 16 bytes: the header\'s address and the size.', 'l พร้อมใช้ บน stack มันมีแค่ 16 ไบต์: แอดเดรสของ header กับขนาด'));

      const insertAt = (target, val, tempA) => {
        sim.call(fn('insert(iterator it, const T& element)'));
        sim.param('this', 'list*', P(l));
        sim.obj('it', 'iterator', [['ptr', 'node*', P(target)]], { param: true });
        sim.ref('element', 'const int', tempA, { param: true });
        sim.step(at('iterator insert'), L('insert(it, ' + val + '): the new node must go <b>before</b> ' + (target === H ? 'the header, i.e. at the very end' : 'the node ' + fmtPlain(nodeF(target, 'data'))) + '. it.ptr = ' + hex(target) + '.', 'insert(it, ' + val + '): โหนดใหม่ต้องอยู่<b>ก่อน</b> ' + (target === H ? 'header ซึ่งก็คือท้ายสุด' : 'โหนด ' + fmtPlain(nodeF(target, 'data'))) + ' it.ptr = ' + hex(target)));
        const before = sim.rf(target, 'prev').p;
        const n = sim.newObj('node', [['data', 'int', val], ['prev', 'node*', P(before)], ['next', 'node*', P(target)]], { expr: 'new node(' + val + ', …)' });
        sim.local('n', 'node*', P(n));
        labelNodes();
        sim.step(at('node *n = new node(element'), L(
          'Allocate a node anywhere on the heap (nodes are <b>not</b> contiguous). Its constructor already sets n->prev = ' + hex(before) + ' (the node before) and n->next = ' + hex(target) + '. Nobody points to n yet, so the list itself is unchanged. (2 of 4 links done.)',
          'จองโหนดที่ไหนก็ได้บน heap (โหนด<b>ไม่ได้</b>อยู่ติดกัน) คอนสตรักเตอร์ตั้ง n->prev = ' + hex(before) + ' (โหนดก่อนหน้า) และ n->next = ' + hex(target) + ' ไว้แล้ว ยังไม่มีใครชี้มาที่ n ดังนั้นตัว list ยังไม่เปลี่ยน (ทำไปแล้ว 2 จาก 4 ลิงก์)'));
        sim.rf(target, 'prev'); sim.wf(before, 'next', P(n));
        sim.step(at('it.ptr->prev->next = n'), L('<code>it.ptr->prev->next = n</code>: the node before (' + hex(before) + ') now points <b>forward</b> to n. (3 of 4.)', '<code>it.ptr->prev->next = n</code>: โหนดก่อนหน้า (' + hex(before) + ') ชี้<b>ไปข้างหน้า</b>ที่ n (3 จาก 4)'));
        sim.wf(target, 'prev', P(n));
        sim.step(at('it.ptr->prev = n;'), L('<code>it.ptr->prev = n</code>: the node after now points <b>back</b> to n. (4 of 4.) The order of these two lines matters: the first one still needed the old it.ptr->prev.', '<code>it.ptr->prev = n</code>: โหนดถัดไปชี้<b>ย้อนกลับ</b>มาที่ n (4 จาก 4) ลำดับของสองบรรทัดนี้สำคัญ บรรทัดแรกยังต้องใช้ค่า it.ptr->prev เดิม'));
        sim.wf(l, 'mSize', sim.rf(l, 'mSize') + 1);
        sim.step(at('mSize++'), L('mSize = ' + sim.pf(l, 'mSize') + '. Total work: O(1), however long the list is. No element moved in memory.', 'mSize = ' + sim.pf(l, 'mSize') + ' งานทั้งหมด O(1) ไม่ว่า list จะยาวแค่ไหน ไม่มีสมาชิกตัวไหนถูกย้ายในหน่วยความจำ'));
        sim.ret(P(n), { type: 'node*', show: false });
      };
      const eraseAt = (target) => {
        sim.call(fn('erase(iterator it)'));
        sim.param('this', 'list*', P(l));
        sim.obj('it', 'iterator', [['ptr', 'node*', P(target)]], { param: true });
        const v0 = fmtPlain(nodeF(target, 'data'));
        sim.step(at('iterator erase'), L('erase the node holding ' + v0 + ' at ' + hex(target) + '.', 'ลบโหนดที่เก็บ ' + v0 + ' ที่ ' + hex(target)));
        const nx = sim.rf(target, 'next').p, pv = sim.rf(target, 'prev').p;
        sim.obj('tmp', 'iterator', [['ptr', 'node*', P(nx)]]);
        sim.step(at('iterator tmp(it.ptr->next)'), L('Remember the next node (' + hex(nx) + ') <b>before</b> anything is destroyed; this is what erase returns.', 'จำโหนดถัดไป (' + hex(nx) + ') ไว้<b>ก่อน</b>ที่อะไรจะถูกทำลาย นี่คือค่าที่ erase จะคืน'));
        sim.wf(pv, 'next', P(nx));
        sim.step(at('it.ptr->prev->next = it.ptr->next'), L('The previous node skips over it: prev->next = ' + hex(nx) + '.', 'โหนดก่อนหน้าข้ามโหนดนี้ไป: prev->next = ' + hex(nx)));
        sim.wf(nx, 'prev', P(pv));
        sim.step(at('it.ptr->next->prev = it.ptr->prev'), L('The next node points back past it: next->prev = ' + hex(pv) + '. Now nobody points to ' + hex(target) + ' (it drops to the lower row), though its own prev/next still hold old addresses.', 'โหนดถัดไปชี้ย้อนข้ามมันไป: next->prev = ' + hex(pv) + ' ตอนนี้ไม่มีใครชี้มาที่ ' + hex(target) + ' แล้ว (มันตกลงไปแถวล่าง) แม้ prev/next ของมันเองยังเก็บแอดเดรสเดิมอยู่'));
        sim.free(target);
        sim.step(at('delete it.ptr'), L('<code>delete it.ptr</code> returns the node\'s 24 bytes. The iterator <code>it</code> is now dangling; that is why erase returns <code>tmp</code>.', '<code>delete it.ptr</code> คืน 24 ไบต์ของโหนด iterator <code>it</code> ตอนนี้ห้อยแล้ว นี่คือเหตุผลที่ erase คืน <code>tmp</code>'));
        sim.wf(l, 'mSize', sim.rf(l, 'mSize') - 1);
        sim.step(at('mSize--'), L('mSize = ' + sim.pf(l, 'mSize') + '. O(1).', 'mSize = ' + sim.pf(l, 'mSize') + ' O(1)'));
        sim.ret(P(nx), { type: 'node*', show: false });
      };

      ops.forEach((o, k) => {
        const L0 = mainL + 2 + k;
        const size = sim.pf(l, 'mSize');
        const nth = i => order()[i];
        if (o[0] === 'push_back' || o[0] === 'push_front') {
          const t = sim.local('temp', 'int', o[1]);
          sim.step(L0, L('<code>l.' + o[0] + '(' + o[1] + ')</code>.', '<code>l.' + o[0] + '(' + o[1] + ')</code>'));
          sim.call(fn(o[0] + '(const T& element)')); sim.param('this', 'list*', P(l)); sim.ref('element', 'const int', t, { param: true });
          const target = o[0] === 'push_back' ? H : sim.rf(H, 'next').p;
          sim.step(at('void ' + o[0]), o[0] === 'push_back'
            ? L('push_back = insert before <b>end()</b>, and end() is the header itself. Inserting before the header means "at the back", because the circle wraps.', 'push_back = insert ก่อน <b>end()</b> และ end() ก็คือ header เอง การแทรกก่อน header คือ "ท้ายสุด" เพราะเป็นวงกลม')
            : L('push_front = insert before <b>begin()</b> = mHeader->next' + (size === 0 ? ', which is the header itself when the list is empty. Same code, no special case.' : '.'), 'push_front = insert ก่อน <b>begin()</b> = mHeader->next' + (size === 0 ? ' ซึ่งตอน list ว่างก็คือ header เอง โค้ดเดียวกัน ไม่มีกรณีพิเศษ' : '')));
          insertAt(target, o[1], t);
          sim.ret(undefined, { show: false }); sim.drop('temp');
        } else if (o[0] === 'insert') {
          if (o[1] < 0 || o[1] > size) throw userErr(L('insert position must be 0…' + size + '.', 'ตำแหน่ง insert ต้องอยู่ในช่วง 0…' + size));
          const t = sim.local('temp', 'int', o[2]);
          const target = o[1] === size ? H : nth(o[1]);
          sim.step(L0, L('Lists have no <code>[ ]</code>: to reach position ' + o[1] + ' we start at begin() and follow next ' + o[1] + ' time(s). That walk is O(k); the insert itself is O(1).', 'list ไม่มี <code>[ ]</code>: จะไปถึงตำแหน่ง ' + o[1] + ' ต้องเริ่มที่ begin() แล้วตาม next ไป ' + o[1] + ' ครั้ง การเดินนี้ใช้ O(k) ส่วน insert เองใช้ O(1)'));
          insertAt(target, o[2], t);
          sim.drop('temp');
        } else if (o[0] === 'erase' || o[0] === 'pop_front' || o[0] === 'pop_back') {
          if (size === 0) throw userErr(L('Cannot erase from an empty list: erase(end()) would delete the header!', 'ลบจาก list ว่างไม่ได้: erase(end()) จะลบ header ทิ้ง!'));
          let idx = o[0] === 'pop_front' ? 0 : o[0] === 'pop_back' ? size - 1 : o[1];
          if (idx < 0 || idx >= size) throw userErr(L('erase position must be 0…' + (size - 1) + '.', 'ตำแหน่ง erase ต้องอยู่ในช่วง 0…' + (size - 1)));
          const target = nth(idx);
          if (o[0] === 'erase') sim.step(L0, L('Walk ' + idx + ' step(s) from begin() to reach the node, then erase it.', 'เดิน ' + idx + ' ก้าวจาก begin() เพื่อไปถึงโหนด แล้วลบมัน'));
          else {
            sim.step(L0, L('<code>l.' + o[0] + '()</code>.', '<code>l.' + o[0] + '()</code>'));
            sim.call(fn(o[0] + '()')); sim.param('this', 'list*', P(l));
            sim.step(at('void ' + o[0]), o[0] === 'pop_back' ? L('The last node is mHeader->prev: O(1), thanks to the circle.', 'โหนดสุดท้ายคือ mHeader->prev: O(1) เพราะเป็นวงกลม') : L('The first node is begin() = mHeader->next.', 'โหนดแรกคือ begin() = mHeader->next'));
          }
          eraseAt(target);
          if (o[0] !== 'erase') sim.ret(undefined, { show: false });
        }
        labelNodes();
        sim.step(L0, L('List now: [' + vals().map(x => fmtPlain(x)).join(', ') + '], mSize = ' + sim.pf(l, 'mSize') + '. In memory the nodes sit wherever the allocator put them; only the pointers define the order.', 'list ตอนนี้: [' + vals().map(x => fmtPlain(x)).join(', ') + '] mSize = ' + sim.pf(l, 'mSize') + ' ในหน่วยความจำ โหนดอยู่ที่ไหนก็ได้ที่ตัวจัดสรรวางไว้ มีแค่พอยน์เตอร์ที่กำหนดลำดับ'));
      });
      const endL = mainL + 2 + ops.length;
      sim.call(fn('~list()')); sim.param('this', 'list*', P(l));
      for (const a of order()) sim.free(a);
      sim.free(H);
      sim.step(at('~list()'), L('At the end of main the destructor runs: <code>clear()</code> erases every node one by one, then the header is deleted. Every <code>new node</code> got its <code>delete</code>.', 'ตอนจบ main destructor ทำงาน: <code>clear()</code> ลบโหนดทีละตัว แล้ว delete header ทุก <code>new node</code> ได้ <code>delete</code> ของมันครบ'));
      sim.ret(undefined, { show: false });
      sim.ret(0, { show: false });
      sim.step(endL, L('Done.', 'เสร็จ'));
    }
  });
})();

/* Part II · CP::priority_queue (real code from priority_queue.h) */
(() => {
  const CLS = `namespace CP {
template <typename T,typename Comp = std::less<T> >
class priority_queue {
  protected:
    T *mData;
    size_t mCap;
    size_t mSize;
    Comp mLess;

    void expand(size_t capacity) {
      T *arr = new T[capacity]();
      for (size_t i = 0;i < mSize;i++) {
        arr[i] = mData[i];
      }
      delete [] mData;
      mData = arr;
      mCap = capacity;
    }
    void fixUp(size_t idx) {
      T tmp = mData[idx];
      while (idx > 0) {
        size_t p = (idx - 1) / 2;
        if ( mLess(tmp,mData[p]) ) break;
        mData[idx] = mData[p];
        idx = p;
      }
      mData[idx] = tmp;
    }
    void fixDown(size_t idx) {
      T tmp = mData[idx];
      size_t c;
      while ((c = 2 * idx + 1) < mSize) {
        if (c + 1 < mSize && mLess(mData[c],mData[c + 1]) ) c++;
        if ( mLess(mData[c],tmp) ) break;
        mData[idx] = mData[c];
        idx = c;
      }
      mData[idx] = tmp;
    }
  public:
    priority_queue(const Comp& c = Comp() ) :
       mData( new T[1]() ), mCap( 1 ), mSize( 0 ), mLess( c ) { }
    const T& top() { return mData[0]; }
    void push(const T& element) {
      if (mSize + 1 > mCap)
        expand(mCap * 2);
      mData[mSize] = element;
      mSize++;
      fixUp(mSize-1);
    }
    void pop() {
      mData[0] = mData[mSize-1];
      mSize--;
      fixDown(0);
    }
};
}
int main() {
`;
  const parse = str => {
    const ops = parseOps(str, 16).map(o => {
      if (o[0] === 'push') { if (typeof o[1] !== 'number') throw userErr(L('push needs a number.', 'push ต้องมีตัวเลข')); return ['push', o[1]]; }
      if (o[0] === 'pop' || o[0] === 'top') return [o[0]];
      throw userErr(L('Unknown operation "' + o[0] + '". Use push x, pop, top.', 'ไม่รู้จักคำสั่ง "' + o[0] + '" ใช้ได้: push x, pop, top'));
    });
    if (!ops.length) throw userErr(L('Type at least one operation.', 'ใส่คำสั่งอย่างน้อยหนึ่งคำสั่ง'));
    return ops;
  };
  const isMin = p => /greater|min/i.test(p.comp || '');

    ops.map(o => o[0] === 'push' ? '  pq.push(' + o[1] + ');' : o[0] === 'pop' ? '  pq.pop();' : '  cout << pq.top() << "\\n";').join('\n') + '\n}\n';

template <typename KeyT, typename MappedT,

  protected:
    typedef std::pair<KeyT,MappedT> ValueT;
    class node {
      public:
        ValueT data;
        node  *left;
        node  *right;
        node  *parent;
        node(const ValueT& data, node* left, node* right, node* parent) :
          data ( data ), left( left ), right( right ), parent( parent ) { }
    };
    node     *mRoot;
    CompareT  mLess;
    size_t    mSize;

    node* &child_link(node* parent, const KeyT& k) {
      if (parent == NULL) return mRoot;
      return mLess(k, parent->data.first) ?
             parent->left : parent->right;
    }
    node* find_node(const KeyT& k,node* r, node* &parent) {
      node *ptr = r;
      while (ptr != NULL) {
        int cmp = compare(k, ptr->data.first);
        if (cmp == 0) return ptr;
        parent = ptr;
        ptr = cmp < 0 ? ptr->left : ptr->right;
      }
      return NULL;
    }
    node* find_min_node(node* r) {
      node *min = r;
      while (min->left != NULL) min = min->left;
      return min;
    }
  public:
    map_bst() : mRoot(NULL), mSize(0) { }

    std::pair<iterator,bool> insert(const ValueT& val) {
      node *parent = NULL;
      node *ptr = find_node(val.first,mRoot,parent);
      bool not_found = (ptr==NULL);
      if (not_found) {
        ptr = new node(val,NULL,NULL,parent);
        child_link(parent, val.first) = ptr;
        mSize++;
      }
      return std::make_pair(iterator(ptr), not_found);
    }
    iterator find(const KeyT &key) {
      node *parent;

/* Part II · a hash table with separate chaining (how unordered_map works in principle) */
(() => {
  const CLS = `struct Node {
  int key;
  int val;
  Node* next;
};
class HashMap {
    Node** table;   // array of bucket heads
    int nb;         // number of buckets
    int n;          // number of keys stored
    int bucketOf(int key) { return key % nb; }
  public:
    HashMap() : table(new Node*[4]()), nb(4), n(0) { }
    void insert(int key, int val) {
      int b = bucketOf(key);
      for (Node* p = table[b]; p != NULL; p = p->next)
        if (p->key == key) { p->val = val; return; }
      if (n + 1 > nb) {          // load factor would pass 1
        rehash(nb * 2);
        b = bucketOf(key);
      }
      table[b] = new Node{key, val, table[b]};
      n++;
    }
    int* find(int key) {
      for (Node* p = table[bucketOf(key)]; p != NULL; p = p->next)
        if (p->key == key) return &p->val;
      return NULL;
    }
    void erase(int key) {
      Node** link = &table[bucketOf(key)];
      while (*link != NULL && (*link)->key != key)
        link = &(*link)->next;
      if (*link == NULL) return;
      Node* dead = *link;
      *link = dead->next;
      delete dead;
      n--;
    }
    void rehash(int newNb) {
      Node** old = table;
      int oldNb = nb;
      table = new Node*[newNb]();
      nb = newNb;
      for (int i = 0; i < oldNb; i++) {
        Node* p = old[i];
        while (p != NULL) {
          Node* nx = p->next;
          int b = bucketOf(p->key);
          p->next = table[b];
          table[b] = p;
          p = nx;
        }
      }
      delete[] old;
    }
    ~HashMap() {
      for (int i = 0; i < nb; i++)
        while (table[i] != NULL) { Node* d = table[i]; table[i] = d->next; delete d; }
      delete[] table;
    }
};
int main() {
  HashMap m;

  mergeSort(a, lo, mid);
  mergeSort(a, mid, hi);
  int* tmp = new int[hi - lo];
  int i = lo, j = mid, k = 0;
  while (i < mid && j < hi)

  while (i < mid) tmp[k++] = a[i++];

        sim.top().line = callLine;
        sim.call('mergeSort(int a[], int lo, int hi)');
        sim.param('a', 'int*', P(A)); sim.param('lo', 'int', lo); sim.param('hi', 'int', hi);
        depth++; maxDepth = Math.max(maxDepth, depth);
        sim.step(at('void mergeSort'), L('mergeSort(' + lo + ', ' + hi + '): a new frame (depth ' + depth + '). Every frame gets its own lo, hi, and pointer a, but they all point at the <b>same</b> array in main.', 'mergeSort(' + lo + ', ' + hi + '): เฟรมใหม่ (ความลึก ' + depth + ') ทุกเฟรมมี lo, hi และพอยน์เตอร์ a ของตัวเอง แต่ทั้งหมดชี้ไปที่อาเรย์<b>เดียวกัน</b>ใน main'));
        if (hi - lo <= 1) {
          tree[id].done = true; tree[id].onStack = false; setCls();
          sim.step(at('if (hi - lo <= 1)'), L('Only ' + (hi - lo) + ' element: already sorted. Return right away (the base case).', 'มีแค่ ' + (hi - lo) + ' ตัว: เรียงอยู่แล้ว คืนกลับทันที (กรณีฐาน)'));
          sim.ret(undefined, { show: false }); depth--; cur = prevCur; setCls(); return;
        }
        const mid = Math.floor((lo + hi) / 2);
        sim.local('mid', 'int', mid);
        sim.step(at('int mid ='), L('mid = ' + mid + ': left half [' + lo + ', ' + mid + '), right half [' + mid + ', ' + hi + ').', 'mid = ' + mid + ': ครึ่งซ้าย [' + lo + ', ' + mid + ') ครึ่งขวา [' + mid + ', ' + hi + ')'));
        ms(lo, mid, id, at('mergeSort(a, lo, mid)'));
        sim.step(at('mergeSort(a, lo, mid)'), L('Back in mergeSort(' + lo + ', ' + hi + '): the left half a[' + lo + '..' + (mid - 1) + '] is sorted. The child frame is gone; this frame was waiting the whole time.', 'กลับมาที่ mergeSort(' + lo + ', ' + hi + '): ครึ่งซ้าย a[' + lo + '..' + (mid - 1) + '] เรียงแล้ว เฟรมลูกหายไป เฟรมนี้รออยู่ตลอด'));
        ms(mid, hi, id, at('mergeSort(a, mid, hi)'));
        sim.step(at('mergeSort(a, mid, hi)'), L('Both halves are sorted. Now merge them.', 'ทั้งสองครึ่งเรียงแล้ว ต่อไปรวมกัน'));
        const T = sim.newArray('int', hi - lo, undefined, { label: 'tmp [' + lo + ',' + hi + ')', expr: 'new int[' + (hi - lo) + ']' });
        sim.local('tmp', 'int*', P(T));
        mg = { lo, mid, hi, tmp: T };
        sim.step(at('int* tmp = new int'), L('<code>new int[' + (hi - lo) + ']</code>: a temporary block on the <b>heap</b> for the merged result. Merging cannot be done safely in place, so merge sort needs O(n) extra memory.', '<code>new int[' + (hi - lo) + ']</code>: บล็อกชั่วคราวบน <b>heap</b> สำหรับผลที่รวมแล้ว การรวมทำในที่เดิมอย่างปลอดภัยไม่ได้ merge sort จึงใช้หน่วยความจำเพิ่ม O(n)'));
        let i = lo, j = mid, k = 0;
        const iA = sim.local('i', 'int', i), jA = sim.local('j', 'int', j), kA = sim.local('k', 'int', 0);
        Object.assign(mg, { i, j, k });
        sim.step(at('int i = lo, j = mid'), L('Two read pointers: i at the start of the left half (' + lo + '), j at the start of the right half (' + mid + '). k is where tmp is written.', 'ตัวชี้อ่านสองตัว: i ที่ต้นครึ่งซ้าย (' + lo + ') j ที่ต้นครึ่งขวา (' + mid + ') k คือตำแหน่งที่จะเขียนใน tmp'));
        const put = (from, which, lineSub, why) => {
          const v = sim.r(A + 4 * from); sim.w(T + 4 * k, v);
          mg.kw = k; mg.w = null;
          if (which === 'i') { i++; sim.w(iA, i); } else { j++; sim.w(jA, j); }
          k++; sim.w(kA, k); Object.assign(mg, { i, j, k });
          sim.step(at(lineSub), why(v));
          mg.kw = null;
        };

          const ai = sim.peek(A + 4 * i), aj = sim.peek(A + 4 * j);

        }

        while (j < hi) put(j, 'j', 'while (j < hi)  tmp', v => L('The left half is used up. Copy the rest of the right: ' + v + '.', 'ฝั่งซ้ายหมดแล้ว คัดลอกที่เหลือของฝั่งขวา: ' + v));
        mg.i = null; mg.j = null; mg.k = null;
        for (let t = 0; t < hi - lo; t++) sim.w(A + 4 * (lo + t), sim.r(T + 4 * t));
        sim.w(kA, hi - lo);
        mg.w = null;
        sim.step(at('for (k = 0; k < hi - lo'), L('Copy tmp back into a[' + lo + '..' + (hi - 1) + '] (all ' + (hi - lo) + ' writes shown at once). This range of main\'s array is now sorted.', 'คัดลอก tmp กลับลง a[' + lo + '..' + (hi - 1) + '] (แสดงการเขียนทั้ง ' + (hi - lo) + ' ครั้งรวมกัน) ช่วงนี้ของอาเรย์ใน main เรียงแล้ว'));
        sim.free(T);
        mg = null;
        sim.step(at('delete[] tmp'), L('<code>delete[] tmp</code> gives the block back. Without it every merge would leak; with it, at most one tmp per stack level is alive at once.', '<code>delete[] tmp</code> คืนบล็อก ถ้าไม่มีบรรทัดนี้ ทุกการรวมจะรั่ว แต่เมื่อมีแล้ว จะมี tmp อยู่พร้อมกันไม่เกินหนึ่งตัวต่อชั้นของ stack'));
        tree[id].done = true; tree[id].onStack = false; tree[id].sub = '';
        sim.ret(undefined, { show: false }); depth--; cur = prevCur; setCls();
      };
      ms(0, n, null, at('mergeSort(a, 0,'));
      cur = null; setCls();
      for (let k = 0; k < n; k++) sim.print(sim.r(A + 4 * k) + ' ');

      sim.ret(0, { show: false });
    }
  });
})();

          sim.step(at('used[v - 1] = true;'), L('v = ' + v + ' is free. <b>Choose</b> it: used[' + (v - 1) + '] = true, cur[' + p + '] = ' + v + '. These writes go through the pointers into main\'s arrays.', 'v = ' + v + ' ว่างอยู่ <b>เลือก</b>มัน: used[' + (v - 1) + '] = true, cur[' + p + '] = ' + v + ' การเขียนเหล่านี้วิ่งผ่านพอยน์เตอร์ไปที่อาเรย์ของ main'), { lines: [at('for (int v = 1')] });
          vSel = null;
          rec(p + 1, id, (prefix || '') + v, at('perm(pos + 1'));
          sim.step(at('perm(pos + 1'), L('Back in perm(' + p + ') with v = ' + v + ': its own v survived the deeper calls, because it lives in this frame.', 'กลับมาที่ perm(' + p + ') โดย v = ' + v + ': v ของเฟรมนี้รอดจากการเรียกที่ลึกกว่า เพราะมันอยู่ในเฟรมนี้'));
          sim.w(U + (v - 1), false); vSel = v;
          sim.step(at('used[v - 1] = false;'), L('<b>Un-choose</b>: used[' + (v - 1) + '] = false, so ' + v + ' is available again for the next branch. (cur[' + p + '] is not cleared; it will just be overwritten.)', '<b>ยกเลิก</b>: used[' + (v - 1) + '] = false ' + v + ' จึงว่างอีกครั้งสำหรับกิ่งถัดไป (cur[' + p + '] ไม่ได้ถูกล้าง แค่จะถูกเขียนทับ)'));
          vSel = null;
        }
        sim.step(at('for (int v = 1'), L('v = ' + (n + 1) + ' &gt; n: every choice for cur[' + p + '] has been tried. Return.', 'v = ' + (n + 1) + ' &gt; n: ลองทุกทางเลือกของ cur[' + p + '] แล้ว คืนกลับ'));
        tree[id].onStack = false; tree[id].done = true;
        sim.ret(undefined, { show: false }); cur = prevCur; pos = prevPos; setCls();
      };
      rec(0, null, '', at('perm(0,'));
      cur = null; setCls();
      sim.step(at('perm(0,'), L('Done: ' + count + ' permutations (n! = ' + count + ') from ' + calls + ' calls. The stack was never deeper than n + 1 = ' + (n + 1) + ' perm frames.', 'เสร็จ: ' + count + ' การเรียง (n! = ' + count + ') จาก ' + calls + ' การเรียก stack ไม่เคยลึกเกิน n + 1 = ' + (n + 1) + ' เฟรมของ perm'));
      sim.ret(0, { show: false });
    }
  });

  // ---------------------------------------------------------------- memoized fibonacci
  const fbCode = n => `long long memo[${n + 1}];          // -1 = not computed yet
long long fib(int k) {
  if (k <= 1) return k;
  if (memo[k] != -1) return memo[k];   // already known: no recursion
  memo[k] = fib(k - 1) + fib(k - 2);
  return memo[k];
}
int main() {
  fill(memo, memo + ${n + 1}, -1);
  cout << fib(${n}) << "\\n";
}
`;
  def({
    id: 'fib-memo', part: 3, lesson: '14', lessonFile: '14-dp-basics.md',
    title: L('Memoization: remember, don\'t recompute', 'Memoization: จำไว้ ไม่ต้องคำนวณซ้ำ'),
    summary: L('Plain recursive fib(n) calls itself about 1.6ⁿ times. With a memo table each fib(k) is computed once; every later call is a single array read. The call tree shows which calls were cut short.',
      'fib(n) แบบเรียกซ้ำธรรมดาเรียกตัวเองราว 1.6ⁿ ครั้ง เมื่อมีตาราง memo แต่ละ fib(k) ถูกคำนวณครั้งเดียว การเรียกครั้งหลังเป็นแค่การอ่านอาเรย์ครั้งเดียว ต้นไม้การเรียกแสดงว่าการเรียกไหนถูกตัดสั้น'),
    blurb: L('Top-down DP: the memo table fills as the stack unwinds.', 'DP แบบบนลงล่าง: ตาราง memo เติมตอน stack คลายตัว'),
    params: [{ id: 'n', label: 'n', value: '6', w: 60 }],
    paramHint: L('n from 2 to 10', 'n ตั้งแต่ 2 ถึง 10'),
    code: fbCode(6),
    codeFn: p => { const n = parseNums(p.n, 1)[0]; return fbCode(n >= 2 && n <= 10 ? n : 6); },
    build(sim, prm) {
      const n = parseNums(prm.n, 1)[0];
      if (!(n >= 2 && n <= 10)) throw userErr(L('n must be 2 to 10.', 'n ต้องอยู่ระหว่าง 2 ถึง 10'));
      const code = fbCode(n), at = LN(code);
      const tree = {}; let cid = 0, cur = null, hit = null;
      const setCls = () => { for (const id in tree) tree[id].cls = id === cur ? 'hl' : (tree[id].onStack ? 'cmp' : (tree[id].memo ? 'chg' : 'ok')); };
      let M = 0;
      sim.viewFn = S => {
        const mv = S.frames[0] && S.frames[0].vars.find(q => q.name === 'memo'); if (!mv) return null;
        return { kind: 'multi', title: L('memo table and call tree', 'ตาราง memo และต้นไม้การเรียก'), parts: [
          { kind: 'array', rows: [{ label: 'memo', cells: mv.cells.map(c => c === undefined ? '?' : fmtPlain(c)), cls: mv.cells.map((c, k) => k === hit ? 'cmp' : (c === -1 || c === undefined ? 'dim' : 'ok')) }] },
          { kind: 'tree', cap: L('Call tree. Teal = running, violet = waiting, green = computed, yellow = answered from memo (its subtree was skipped).', 'ต้นไม้การเรียก ฟ้าอมเขียว = กำลังทำงาน ม่วง = รออยู่ เขียว = คำนวณแล้ว เหลือง = ตอบจาก memo (ข้ามทั้งกิ่งใต้มัน)'), nodes: tree, root: tree.c1 ? 'c1' : null, square: true, gy: 48, gx: 50, r: 15, empty: L('(no calls yet)', '(ยังไม่มีการเรียก)') }] };
      };
      // memo is a global; we show it in main's frame for simplicity
      sim.call('main()');
      M = sim.arr('memo', 'long long', n + 1, undefined);
      sim.step(at('int main'), L('<code>memo</code> is a global array. Globals live in their own static area, not on the stack; here it is drawn inside main\'s frame only to keep the picture small. Globals start at 0, but we will fill them with −1.', '<code>memo</code> เป็นอาเรย์ global ตัวแปร global อยู่ในพื้นที่ static ของมันเอง ไม่ใช่บน stack ที่นี่วาดไว้ในเฟรมของ main แค่เพื่อให้ภาพเล็กลง global เริ่มต้นเป็น 0 แต่เราจะเติม −1'));
      for (let k = 0; k <= n; k++) sim.w(M + 8 * k, -1);
      sim.step(at('fill(memo'), L('Every entry = −1, meaning "not computed yet". (0 would be a bad marker because fib(0) = 0.)', 'ทุกช่อง = −1 หมายถึง "ยังไม่ได้คำนวณ" (0 เป็นเครื่องหมายที่ไม่ดีเพราะ fib(0) = 0)'));
      let calls = 0;
      const fib = (k, parent, callLine) => {
        const id = 'c' + (++cid); calls++;
        tree[id] = { label: 'f(' + k + ')', kids: [], onStack: true };
        if (parent) tree[parent].kids.push(id);
        const prev = cur; cur = id; setCls();
        sim.top().line = callLine;
        sim.call('fib(int k)'); sim.param('k', 'int', k);
        const done = (val, why, line, memoHit) => {
          tree[id].onStack = false; tree[id].memo = memoHit; tree[id].sub = String(val);
          setCls();
          sim.step(line, why);
          hit = null;
          sim.ret(val, { type: 'long long' }); cur = prev; setCls();
          return val;
        };
        if (k <= 1) return done(k, L('fib(' + k + '): base case, return ' + k + '.', 'fib(' + k + '): กรณีฐาน คืน ' + k), at('if (k <= 1)'), false);
        const mk = sim.r(M + 8 * k);
        if (mk !== -1) { hit = k; return done(mk, L('fib(' + k + '): memo[' + k + '] = ' + mk + ' is already known. Return it immediately; the whole subtree below is <b>skipped</b>.', 'fib(' + k + '): memo[' + k + '] = ' + mk + ' รู้อยู่แล้ว คืนทันที กิ่งทั้งหมดข้างล่าง<b>ถูกข้าม</b>'), at('if (memo[k] != -1)'), true); }
        sim.step(at('if (memo[k] != -1)'), L('fib(' + k + '): memo[' + k + '] = −1, not computed yet. We must recurse.', 'fib(' + k + '): memo[' + k + '] = −1 ยังไม่ได้คำนวณ ต้องเรียกซ้ำ'));
        const a = fib(k - 1, id, at('memo[k] = fib(k - 1)'));
        sim.step(at('memo[k] = fib(k - 1)'), L('fib(' + (k - 1) + ') returned ' + a + '. The return value waits in a temporary while fib(' + (k - 2) + ') runs.', 'fib(' + (k - 1) + ') คืน ' + a + ' ค่าที่คืนรออยู่ในตัวแปรชั่วคราวขณะที่ fib(' + (k - 2) + ') ทำงาน'));
        const b = fib(k - 2, id, at('memo[k] = fib(k - 1)'));
        sim.w(M + 8 * k, a + b);
        cur = id; setCls();
        sim.step(at('memo[k] = fib(k - 1)'), L('fib(' + (k - 2) + ') returned ' + b + '. Store memo[' + k + '] = ' + a + ' + ' + b + ' = <b>' + (a + b) + '</b>.', 'fib(' + (k - 2) + ') คืน ' + b + ' เก็บ memo[' + k + '] = ' + a + ' + ' + b + ' = <b>' + (a + b) + '</b>'));
        return done(sim.r(M + 8 * k), L('Return memo[' + k + '] = ' + (a + b) + '.', 'คืน memo[' + k + '] = ' + (a + b)), at('return memo[k];'), false);
      };
      const ans = fib(n, null, at('cout << fib('));
      sim.print(ans + '\n'); cur = null; setCls();
      const plain = (() => { const c = k => k <= 1 ? 1 : 1 + c(k - 1) + c(k - 2); return c(n); })();
      sim.step(at('cout << fib('), L('fib(' + n + ') = ' + ans + ' using ' + calls + ' calls. Without the memo it would take ' + plain + ' calls. With it, each k is computed once: O(n).', 'fib(' + n + ') = ' + ans + ' ใช้ ' + calls + ' การเรียก ถ้าไม่มี memo จะใช้ ' + plain + ' การเรียก เมื่อมี memo แต่ละ k ถูกคำนวณครั้งเดียว: O(n)'));
      sim.ret(0, { show: false });
    }
  });
})();

/* Part III · bottom-up DP on a 2-D table: LCS (lesson 15) and 0/1 knapsack in 1-D (lesson 15) */
(() => {
  const mainVar = (S, nm) => S.frames[0] && S.frames[0].vars.find(q => q.name === nm);

  // ---------------------------------------------------------------- LCS
  const lcsCode = (a, b) => `int main() {
  char a[] = "${a}";
  char b[] = "${b}";
  int n = ${a.length}, m = ${b.length};
  int dp[${a.length + 1}][${b.length + 1}] = {};   // dp[i][j] = LCS length of a[0..i) and b[0..j)
  for (int i = 1; i <= n; i++)
    for (int j = 1; j <= m; j++)
      if (a[i - 1] == b[j - 1]) dp[i][j] = dp[i - 1][j - 1] + 1;
      else dp[i][j] = max(dp[i - 1][j], dp[i][j - 1]);
  cout << dp[n][m] << "\\n";
}
`;
  const lcsParse = p => {
    const a = String(p.a).toUpperCase().replace(/[^A-Z]/g, '').slice(0, 6), b = String(p.b).toUpperCase().replace(/[^A-Z]/g, '').slice(0, 6);
    if (!a.length || !b.length) throw userErr(L('Both strings need 1 to 6 letters.', 'สตริงทั้งสองต้องมี 1 ถึง 6 ตัวอักษร'));
    return { a, b };
  };
  def({
    id: 'lcs', part: 3, lesson: '15', lessonFile: '15-dp-states.md',
    title: L('DP table: longest common subsequence', 'ตาราง DP: ลำดับย่อยร่วมที่ยาวที่สุด (LCS)'),
    summary: L('Each cell dp[i][j] is filled from three neighbours that are already known: up-left, up, and left. Filling row by row guarantees that. In memory the 2-D table is one flat block, row after row (row-major): dp[i][j] lives at base + (i × cols + j) × 4.',
      'แต่ละช่อง dp[i][j] ถูกเติมจากเพื่อนบ้านสามช่องที่รู้ค่าแล้ว: ซ้ายบน บน และซ้าย การเติมทีละแถวรับประกันข้อนี้ ในหน่วยความจำตาราง 2 มิติคือบล็อกแบนก้อนเดียว เรียงแถวต่อแถว (row-major): dp[i][j] อยู่ที่ base + (i × cols + j) × 4'),
    blurb: L('Fill order, dependencies, and how a 2-D array sits in memory.', 'ลำดับการเติม การพึ่งพา และอาเรย์ 2 มิติในหน่วยความจำ'),
    params: [{ id: 'a', label: 'a', value: 'ABCBDA', w: 110 }, { id: 'b', label: 'b', value: 'BDCAB', w: 110 }],
    paramHint: L('letters only, up to 6 each', 'ตัวอักษรเท่านั้น ไม่เกิน 6 ตัวต่อสตริง'),
    code: lcsCode('ABCBDA', 'BDCAB'),
    codeFn: p => { try { const { a, b } = lcsParse(p); return lcsCode(a, b); } catch (e) { return lcsCode('A', 'A'); } },
    build(sim, prm) {
      const { a, b } = lcsParse(prm), n = a.length, m = b.length, cols = m + 1, code = lcsCode(a, b), at = LN(code);
      let ci = null, cj = null, src = null, path = null;
      let D = 0;
      sim.viewFn = S => {
        const dv = mainVar(S, 'dp'); if (!dv) return null;
        const cells = [], cls = [];
        for (let i = 0; i <= n; i++) {
          cells.push([]); cls.push([]);
          for (let j = 0; j <= m; j++) {
            const v = dv.cells[i * cols + j];
            cells[i].push(v === undefined ? '?' : v);
            let c = (i === 0 || j === 0) ? 'dim' : '';
            if (src && src.some(([x, y]) => x === i && y === j)) c = 'cmp';
            if (i === ci && j === cj) c = 'chg';
            if (path && path.some(([x, y]) => x === i && y === j)) c = 'ok';
            cls[i].push(c);
          }
        }
        return { kind: 'table', title: L('dp table', 'ตาราง dp'), corner: 'i\\j', rows: ['0 ·'].concat(a.split('').map((c, k) => (k + 1) + ' ' + c)), cols: ['0 ·'].concat(b.split('').map((c, k) => (k + 1) + ' ' + c)), cells, cls };
      };
      sim.call('main()');
      sim.step(at('int main'), L('main starts.', 'main เริ่มทำงาน'));
      const A = sim.arr('a', 'char', n + 1, a.split('').map(c => CH(c)).concat([CH('\0')]));
      sim.step(at('char a[]'), L('<code>char a[] = "' + a + '"</code> is ' + (n + 1) + ' bytes: one per letter plus the terminating <code>\\0</code>.', '<code>char a[] = "' + a + '"</code> มีขนาด ' + (n + 1) + ' ไบต์: ตัวอักษรละหนึ่งไบต์ บวก <code>\\0</code> ปิดท้าย'));
      const B = sim.arr('b', 'char', m + 1, b.split('').map(c => CH(c)).concat([CH('\0')]));
      sim.step(at('char b[]'), L('Same for b.', 'เช่นเดียวกันกับ b'));
      sim.local('n', 'int', n); sim.local('m', 'int', m);
      sim.step(at('int n ='), L('The lengths.', 'ความยาว'));
      D = sim.arr('dp', 'int', (n + 1) * cols, 0);
      const dv = sim.top().vars.find(v => v.name === 'dp'); dv.type = 'int[' + (n + 1) + '][' + cols + ']'; dv.cols = cols;
      sim.step(at('int dp['), L('<code>int dp[' + (n + 1) + '][' + cols + '] = {}</code>: ' + (n + 1) + ' × ' + cols + ' = ' + ((n + 1) * cols) + ' ints in <b>one flat block</b>. In memory, row 1 starts right after row 0 ends. Row 0 and column 0 (comparing with an empty string) stay 0.', '<code>int dp[' + (n + 1) + '][' + cols + '] = {}</code>: int ' + (n + 1) + ' × ' + cols + ' = ' + ((n + 1) * cols) + ' ตัว ใน<b>บล็อกแบนก้อนเดียว</b> ในหน่วยความจำ แถว 1 เริ่มต่อจากท้ายแถว 0 ทันที แถว 0 และคอลัมน์ 0 (เทียบกับสตริงว่าง) เป็น 0 ตลอด'));
      const iA = sim.local('i', 'int', 1);
      const jA = sim.local('j', 'int', 1);
      const cell = (i, j) => D + 4 * (i * cols + j);
      for (let i = 1; i <= n; i++) {
        sim.w(iA, i);
        for (let j = 1; j <= m; j++) {
          sim.w(jA, j); ci = i; cj = j;
          const x = sim.r(A + i - 1), y = sim.r(B + j - 1);
          const addr = cell(i, j);
          if (x.ch === y.ch) {
            const d = sim.r(cell(i - 1, j - 1));
            src = [[i - 1, j - 1]];
            sim.w(addr, d + 1);
            sim.step(at('if (a[i - 1] == b[j - 1])'), L('dp[' + i + '][' + j + ']: a[' + (i - 1) + '] = \'' + x.ch + '\' equals b[' + (j - 1) + '] = \'' + y.ch + '\'. Extend the diagonal: dp[' + (i - 1) + '][' + (j - 1) + '] + 1 = <b>' + (d + 1) + '</b>. (Address ' + hex(D) + ' + (' + i + '×' + cols + ' + ' + j + ')×4 = ' + hex(addr) + '.)', 'dp[' + i + '][' + j + ']: a[' + (i - 1) + '] = \'' + x.ch + '\' เท่ากับ b[' + (j - 1) + '] = \'' + y.ch + '\' ต่อจากแนวทแยง: dp[' + (i - 1) + '][' + (j - 1) + '] + 1 = <b>' + (d + 1) + '</b> (แอดเดรส ' + hex(D) + ' + (' + i + '×' + cols + ' + ' + j + ')×4 = ' + hex(addr) + ')'), { lines: [at('for (int j')] });
          } else {
            const up = sim.r(cell(i - 1, j)), left = sim.r(cell(i, j - 1));
            src = [[i - 1, j], [i, j - 1]];
            sim.w(addr, Math.max(up, left));
            sim.step(at('else dp[i][j] = max'), L('dp[' + i + '][' + j + ']: \'' + x.ch + '\' ≠ \'' + y.ch + '\'. Drop one letter: best of up (' + up + ') and left (' + left + ') = <b>' + Math.max(up, left) + '</b>.', 'dp[' + i + '][' + j + ']: \'' + x.ch + '\' ≠ \'' + y.ch + '\' ทิ้งตัวอักษรหนึ่งตัว: ค่ามากสุดของบน (' + up + ') กับซ้าย (' + left + ') = <b>' + Math.max(up, left) + '</b>'), { lines: [at('for (int j')] });
          }
        }
      }
      ci = cj = null; src = null;
      sim.drop('j'); sim.drop('i');
      // trace back one LCS (view only)
      path = []; let i = n, j = m, s = '';
      while (i > 0 && j > 0) { if (a[i - 1] === b[j - 1]) { path.push([i, j]); s = a[i - 1] + s; i--; j--; } else if (sim.peek(cell(i - 1, j)) >= sim.peek(cell(i, j - 1))) i--; else j--; }
      const ans = sim.r(cell(n, m));
      sim.print(ans + '\n');
      sim.step(at('cout << dp[n][m]'), L('dp[' + n + '][' + m + '] = <b>' + ans + '</b>. Green cells show one common subsequence found by walking back from the corner: "' + s + '". Time and memory: O(n × m).', 'dp[' + n + '][' + m + '] = <b>' + ans + '</b> ช่องสีเขียวแสดงลำดับย่อยร่วมหนึ่งแบบที่ได้จากการเดินย้อนจากมุม: "' + s + '" เวลาและหน่วยความจำ: O(n × m)'));
      sim.ret(0, { show: false });
    }
  });

  // ---------------------------------------------------------------- 0/1 knapsack, 1-D
  const ksCode = (w, v, W) => `int main() {
  int w[${w.length}] = {${w.join(', ')}};   // weights
  int v[${v.length}] = {${v.join(', ')}};   // values
  int dp[${W + 1}] = {};          // dp[c] = best value with capacity c
  for (int k = 0; k < ${w.length}; k++)
    for (int c = ${W}; c >= w[k]; c--)        // right to left!
      dp[c] = max(dp[c], dp[c - w[k]] + v[k]);
  cout << dp[${W}] << "\\n";
}
`;
  const ksParse = p => {
    const w = parseNums(p.w, 5), v = parseNums(p.v, 5), W = parseNums(p.W, 1)[0];
    if (!w.length || w.length !== v.length) throw userErr(L('Give the same number of weights and values (1 to 5).', 'ใส่น้ำหนักและมูลค่าจำนวนเท่ากัน (1 ถึง 5)'));
    if (w.some(x => x < 1 || x > 10)) throw userErr(L('Weights must be 1 to 10.', 'น้ำหนักต้องอยู่ระหว่าง 1 ถึง 10'));
    if (!(W >= 1 && W <= 10)) throw userErr(L('Capacity must be 1 to 10.', 'ความจุต้องอยู่ระหว่าง 1 ถึง 10'));
    return { w, v, W };
  };
  def({
    id: 'knapsack', part: 3, lesson: '15', lessonFile: '15-dp-states.md',
    title: L('0/1 knapsack with one row', '0/1 knapsack ด้วยแถวเดียว'),
    summary: L('dp[c] = the best value that fits in capacity c using the items seen so far. For each item we sweep c from right to left, so dp[c − w] still holds the value from before this item: every item is used at most once. Sweep left to right and you would get the unbounded version by accident.',

    blurb: L('Space-saving DP and why the loop runs backwards.', 'DP แบบประหยัดพื้นที่ และทำไมลูปต้องวิ่งถอยหลัง'),

    build(sim, prm) {

  function parseEdges(str, weighted, maxN = 8) {
    const parts = String(str).split(/[,;\n]+/).map(x => x.trim()).filter(Boolean).slice(0, 14);
    const edges = [];
    for (const p of parts) {
      const m = p.match(/^(\d+)\s*-\s*(\d+)(?:\s*:\s*(\d+))?$/);
      if (!m) throw userErr(L('Cannot read edge "' + p + '". Write u-v' + (weighted ? ':w' : '') + ', for example 0-1' + (weighted ? ':4' : '') + '.', 'อ่านเส้นเชื่อม "' + p + '" ไม่ได้ ให้เขียน u-v' + (weighted ? ':w' : '') + ' เช่น 0-1' + (weighted ? ':4' : '')));
      const a = +m[1], b = +m[2], w = m[3] != null ? +m[3] : 1;
      if (a >= maxN || b >= maxN) throw userErr(L('Vertices must be 0 to ' + (maxN - 1) + '.', 'จุดยอดต้องอยู่ระหว่าง 0 ถึง ' + (maxN - 1)));

      if (weighted && (w < 1 || w > 99)) throw userErr(L('Weights must be 1 to 99.', 'น้ำหนักต้องอยู่ระหว่าง 1 ถึง 99'));
      edges.push({ a, b, w });
    }
    if (!edges.length) throw userErr(L('Give at least one edge.', 'ใส่เส้นเชื่อมอย่างน้อยหนึ่งเส้น'));
    const n = Math.max(...edges.map(e => Math.max(e.a, e.b))) + 1;
    return { n, edges };

int find(int x) {
  if (parent[x] == x) return x;            // x is a root
  return parent[x] = find(parent[x]);      // path compression
}
int main() {
  int n = ${n};
  int E[${E.length}][3] = {${E.map(e => '{' + e.w + ',' + e.a + ',' + e.b + '}').join(', ')}};   // {w, u, v}, sorted by w

  for (int k = 0; k < ${E.length}; k++) {
    int ru = find(E[k][1]), rv = find(E[k][2]);
    if (ru == rv) continue;                // same component: would make a cycle
    parent[ru] = rv;                       // union
    total += E[k][0];
  }
  cout << total << "\\n";
}
`;

      sim.call('main()');
      const PA = sim.arr('parent', 'int', n, 0);
      sim.step(at('int main'), L('<code>parent</code> is a global (drawn in main\'s frame for compactness), so it starts all zeros.', '<code>parent</code> เป็น global (วาดไว้ในเฟรมของ main เพื่อความกะทัดรัด) จึงเริ่มเป็นศูนย์ทั้งหมด'));
      sim.local('n', 'int', n);
      const EA = sim.arr('E', 'int', E.length * 3, E.flatMap(e => [e.w, e.a, e.b]));
      const ev = sim.top().vars.find(v => v.name === 'E'); ev.type = 'int[' + E.length + '][3]'; ev.cols = 3;
      sim.step(at('int E['), L('The edges as {w, u, v} rows, already sorted by weight (in a real program: <code>sort(E, E + m)</code>).', 'เส้นเชื่อมเป็นแถว {w, u, v} เรียงตามน้ำหนักแล้ว (ในโปรแกรมจริง: <code>sort(E, E + m)</code>)'));
      for (let i = 0; i < n; i++) sim.w(PA + 4 * i, i);
      sim.step(at('parent[i] = i'), L('parent[i] = i: every vertex starts as its own root, a component of size 1.', 'parent[i] = i: ทุกจุดยอดเริ่มเป็นรากของตัวเอง เป็นส่วนที่มีขนาด 1'));
      const totA = sim.local('total', 'int', 0);
      const kA = sim.local('k', 'int', 0);
      const find = (x, callLine) => {
        sim.top().line = callLine;
        sim.call('find(int x)'); sim.param('x', 'int', x);
        const p = sim.r(PA + 4 * x);
        hiV = [x];
        if (p === x) {
          sim.step(at('if (parent[x] == x)'), L('find(' + x + '): parent[' + x + '] = ' + x + ', so ' + x + ' is a root. Return ' + x + '.', 'find(' + x + '): parent[' + x + '] = ' + x + ' ดังนั้น ' + x + ' เป็นราก คืน ' + x));
          sim.ret(x, { type: 'int' }); return x;
        }
        sim.step(at('if (parent[x] == x)'), L('find(' + x + '): parent[' + x + '] = ' + p + ', not a root. Ask find(' + p + ') and wait.', 'find(' + x + '): parent[' + x + '] = ' + p + ' ไม่ใช่ราก ถาม find(' + p + ') แล้วรอ'));
        const r = find(p, at('return parent[x] = find'));
        hiV = [x];
        sim.w(PA + 4 * x, r);
        sim.step(at('return parent[x] = find'), r !== p ? L('Back in find(' + x + '): the root is ' + r + '. <b>Path compression</b>: parent[' + x + '] = ' + r + ' (was ' + p + '), so next time ' + x + ' reaches the root in one hop.', 'กลับมาที่ find(' + x + '): รากคือ ' + r + ' <b>path compression</b>: parent[' + x + '] = ' + r + ' (เดิม ' + p + ') ครั้งหน้า ' + x + ' จะถึงรากในก้าวเดียว') : L('Back in find(' + x + '): the root is ' + r + ', which is already its parent.', 'กลับมาที่ find(' + x + '): รากคือ ' + r + ' ซึ่งเป็น parent ของมันอยู่แล้ว'));
        sim.ret(r, { type: 'int' }); return r;
      };
      let total = 0;
      E.forEach((e, k) => {
        sim.w(kA, k); ck = E.indexOf(e); hiV = [e.a, e.b];
        sim.step(at('for (int k = 0; k <'), L('Edge ' + k + ': ' + e.a + '–' + e.b + ' with weight ' + e.w + ' (the lightest one not tried yet).', 'เส้นที่ ' + k + ': ' + e.a + '–' + e.b + ' น้ำหนัก ' + e.w + ' (เส้นที่เบาที่สุดที่ยังไม่ได้ลอง)'));
        const ru = find(sim.r(EA + 4 * (3 * k + 1)), at('int ru = find'));
        const ruA = sim.local('ru', 'int', ru);
        const rv = find(sim.r(EA + 4 * (3 * k + 2)), at('int ru = find'));
        const rvA = sim.local('rv', 'int', rv);
        hiV = [e.a, e.b];
        sim.step(at('int ru = find'), L('ru = find(' + e.a + ') = ' + ru + ', rv = find(' + e.b + ') = ' + rv + '.', 'ru = find(' + e.a + ') = ' + ru + ', rv = find(' + e.b + ') = ' + rv));
        if (ru === rv) {
          rej.add(k);
          sim.step(at('if (ru == rv) continue'), L('Same root ' + ru + ': ' + e.a + ' and ' + e.b + ' are already connected. Adding this edge would close a cycle. <b>Reject</b>.', 'รากเดียวกัน ' + ru + ': ' + e.a + ' กับ ' + e.b + ' เชื่อมกันอยู่แล้ว ถ้าเพิ่มเส้นนี้จะปิดวงจร <b>ปฏิเสธ</b>'), { cls: 'warn' });
        } else {
          sim.w(PA + 4 * ru, rv); mst.add(k); hiV = [ru, rv];
          sim.step(at('parent[ru] = rv'), L('Different roots. <b>Union</b>: parent[' + ru + '] = ' + rv + '. The whole component of ' + ru + ' now hangs under ' + rv + ' with one write.', 'รากต่างกัน <b>รวม</b>: parent[' + ru + '] = ' + rv + ' ทั้งส่วนของ ' + ru + ' ไปห้อยใต้ ' + rv + ' ด้วยการเขียนครั้งเดียว'));
          total += e.w; sim.w(totA, total);
          sim.step(at('total += E[k][0]'), L('total = ' + total + '.', 'total = ' + total));
        }
        sim.drop('rv'); sim.drop('ru');
      });
      ck = null; hiV = [];
      sim.drop('k');
      sim.print(sim.r(totA) + '\n');
      sim.step(at('cout << total'), L('The minimum spanning tree weighs <b>' + total + '</b> and uses ' + mst.size + ' edges' + (mst.size === n - 1 ? ' (n − 1, as every spanning tree does).' : ' (fewer than n − 1: the graph is not connected).') + ' Sorting costs O(E log E); with path compression each find is almost O(1).', 'ต้นไม้แผ่กว้างน้อยที่สุดหนัก <b>' + total + '</b> และใช้ ' + mst.size + ' เส้น' + (mst.size === n - 1 ? ' (n − 1 เหมือนต้นไม้แผ่กว้างทุกต้น)' : ' (น้อยกว่า n − 1: กราฟไม่เชื่อมกันทั้งหมด)') + ' การเรียงใช้ O(E log E) ด้วย path compression แต่ละ find เกือบเป็น O(1)'));
      sim.ret(0, { show: false });
    }
  });
})();

/* Part III · greedy interval scheduling (lesson 13) */
(() => {
  const code = iv => `struct Iv { int s, e; };              // start, end
int main() {
  Iv a[${iv.length}] = {${iv.map(x => '{' + x[0] + ',' + x[1] + '}').join(', ')}};
  sort(a, a + ${iv.length}, [](const Iv& x, const Iv& y) { return x.e < y.e; });
  int cnt = 0, lastEnd = -1;
  for (int i = 0; i < ${iv.length}; i++)
    if (a[i].s >= lastEnd) {            // fits after the last chosen one
      cnt++;
      lastEnd = a[i].e;
    }
  cout << cnt << "\\n";
}
`;
  const parse = p => {
    const parts = String(p.iv).split(/[,;\n]+/).map(x => x.trim()).filter(Boolean).slice(0, 8);
    const iv = parts.map(x => { const m = x.match(/^(\d+)\s*-\s*(\d+)$/); if (!m || +m[1] >= +m[2] || +m[2] > 20) throw userErr(L('Cannot read "' + x + '". Write start-end with start < end ≤ 20, e.g. 1-4.', 'อ่าน "' + x + '" ไม่ได้ ให้เขียน start-end โดย start < end ≤ 20 เช่น 1-4')); return [+m[1], +m[2]]; });
    if (iv.length < 2) throw userErr(L('Give 2 to 8 intervals.', 'ใส่ช่วง 2 ถึง 8 ช่วง'));
    return iv;
  };
  const DEF = '5-9, 1-4, 6-10, 3-5, 8-11, 0-6, 5-7, 3-9';
  def({
    id: 'interval-greedy', part: 3, lesson: '13', lessonFile: '13-greedy.md',
    title: L('Greedy: pick the interval that ends first', 'Greedy: เลือกช่วงที่จบก่อน'),
    summary: L('To fit the most non-overlapping intervals, sort by end time and take every interval that starts after the last one you took. Ending early leaves the most room for the rest; that exchange argument is why the greedy choice is safe. In memory, an array of structs stores s and e side by side.',
      'เพื่อให้ได้ช่วงที่ไม่ทับกันมากที่สุด ให้เรียงตามเวลาจบ แล้วเลือกทุกช่วงที่เริ่มหลังช่วงสุดท้ายที่เลือกไว้ การจบเร็วเหลือพื้นที่ให้ช่วงอื่นมากที่สุด เหตุผลแบบแลกเปลี่ยนนี้ทำให้การเลือกแบบโลภปลอดภัย ในหน่วยความจำ อาเรย์ของ struct เก็บ s และ e เรียงคู่กัน'),
    blurb: L('Sort by end, one pass, an array of structs.', 'เรียงตามจุดจบ วนรอบเดียว อาเรย์ของ struct'),
    params: [{ id: 'iv', label: L('Intervals', 'ช่วง'), value: DEF }],
    paramHint: L('start-end pairs, 0–20', 'คู่ start-end ค่า 0–20'),
    code: code(parse({ iv: DEF })),
    codeFn: p => { try { return code(parse(p)); } catch (e) { return code([[0, 1], [1, 2]]); } },
    build(sim, prm) {
      const iv = parse(prm), n = iv.length, src = code(iv), at = LN(src);
      let order = iv.map((x, k) => k), state = {}, cur = null, lastEnd = null;   // state[k] = 'take' | 'skip'
      const vals = () => { const b = sim.top().vars.find(v => v.name === 'a'); const out = []; for (let i = 0; i < n; i++) out.push([b.fields[2 * i].value, b.fields[2 * i + 1].value]); return out; };
      sim.viewFn = S => {
        const a = S.frames[0] && S.frames[0].vars.find(v => v.name === 'a'); if (!a) return null;
        const X = t => 46 + t * 22, rowH = 26, W = X(Math.max(12, ...iv.map(x => x[1]))) + 30;
        let s = '<svg width="' + W + '" height="' + (n * rowH + 40) + '" viewBox="0 0 ' + W + ' ' + (n * rowH + 40) + '">';
        const maxT = Math.max(12, ...iv.map(x => x[1]));
        for (let t = 0; t <= maxT; t++) s += '<line x1="' + X(t) + '" y1="4" x2="' + X(t) + '" y2="' + (n * rowH + 12) + '" style="stroke:var(--line);stroke-width:' + (t % 5 ? 0.6 : 1.2) + '"/><text x="' + X(t) + '" y="' + (n * rowH + 26) + '" text-anchor="middle" font-size="10" style="fill:var(--muted)">' + t + '</text>';
        for (let i = 0; i < n; i++) {
          const st = a.fields[2 * i].value, en = a.fields[2 * i + 1].value, y = 8 + i * rowH;
          const c = vc(state[i] === 'take' ? 'ok' : state[i] === 'skip' ? 'bad' : (i === cur ? 'hl' : 'hp'));
          s += '<text x="4" y="' + (y + 15) + '" font-size="11" style="fill:var(--muted)">a[' + i + ']</text>';
          s += '<rect x="' + X(st) + '" y="' + y + '" width="' + (X(en) - X(st)) + '" height="' + (rowH - 8) + '" rx="5" style="fill:' + c.f + ';stroke:' + c.s + ';stroke-width:' + (i === cur ? 2.4 : 1.4) + (state[i] === 'skip' ? ';stroke-dasharray:4 3' : '') + '"/>';
          s += '<text x="' + ((X(st) + X(en)) / 2) + '" y="' + (y + 13) + '" text-anchor="middle" font-size="11">' + st + '–' + en + '</text>';
        }
        if (lastEnd != null && lastEnd >= 0) s += '<line x1="' + X(lastEnd) + '" y1="0" x2="' + X(lastEnd) + '" y2="' + (n * rowH + 12) + '" style="stroke:var(--ptr);stroke-width:2;stroke-dasharray:5 3"/><text x="' + (X(lastEnd) + 4) + '" y="10" font-size="11" font-weight="700" style="fill:var(--ptr)">lastEnd</text>';
        return { kind: 'html', title: L('timeline', 'เส้นเวลา'), cap: L('Rows follow the array order. Green = taken, red dashed = overlaps the last taken one, teal = being checked.', 'แถวเรียงตามลำดับในอาเรย์ เขียว = เลือก แดงเส้นประ = ทับกับช่วงที่เลือกล่าสุด ฟ้าอมเขียว = กำลังตรวจ'), html: s + '</svg>' };
      };
      sim.call('main()');
      sim.step(at('int main'), L('main starts.', 'main เริ่มทำงาน'));
      const fields = []; iv.forEach((x, i) => { fields.push(['[' + i + '].s', 'int', x[0]]); fields.push(['[' + i + '].e', 'int', x[1]]); });
      const A = sim.obj('a', 'Iv[' + n + ']', fields);
      sim.step(at('Iv a['), L('An array of ' + n + ' structs. Each Iv is 8 bytes (two ints), and they sit back to back: a[0].s, a[0].e, a[1].s, a[1].e, … So a[i].e lives at base + i×8 + 4.', 'อาเรย์ของ struct ' + n + ' ตัว Iv แต่ละตัวมี 8 ไบต์ (int สองตัว) และเรียงติดกัน: a[0].s, a[0].e, a[1].s, a[1].e, … ดังนั้น a[i].e อยู่ที่ base + i×8 + 4'));
      const sorted = iv.slice().sort((x, y) => x[1] - y[1]);
      sorted.forEach((x, i) => { sim.wf(A, '[' + i + '].s', x[0]); sim.wf(A, '[' + i + '].e', x[1]); });
      sim.step(at('sort(a'), L('sort with a lambda comparator reorders the structs by end time e (writes shown all at once). Each struct moves as a whole 8-byte unit. Cost: O(n log n), the most expensive part.', 'sort ที่มี lambda เป็นตัวเปรียบเทียบ จัดเรียง struct ตามเวลาจบ e (แสดงการเขียนทั้งหมดรวมกัน) struct แต่ละตัวย้ายเป็นก้อน 8 ไบต์ทั้งก้อน ราคา O(n log n) ซึ่งเป็นส่วนที่แพงที่สุด'));
      const cA = sim.local('cnt', 'int', 0), lA = sim.local('lastEnd', 'int', -1);
      lastEnd = -1;
      sim.step(at('int cnt = 0'), L('Nothing chosen yet: cnt = 0, lastEnd = −1 (so the first interval always fits).', 'ยังไม่ได้เลือกอะไร: cnt = 0, lastEnd = −1 (ช่วงแรกจึงใส่ได้เสมอ)'));
      const iA = sim.local('i', 'int', 0);
      let cnt = 0;
      for (let i = 0; i < n; i++) {
        sim.w(iA, i); cur = i;
        const s = sim.rf(A, '[' + i + '].s'), le = sim.r(lA);
        if (s >= le) {
          state[i] = 'take'; cnt++; sim.w(cA, cnt);
          const e = sim.rf(A, '[' + i + '].e'); sim.w(lA, e); lastEnd = e;
          sim.step(at('lastEnd = a[i].e'), L('a[' + i + '] = ' + s + '–' + e + ': it starts at ' + s + ' ≥ lastEnd ' + le + ', so it fits. <b>Take it</b>: cnt = ' + cnt + ', lastEnd = ' + e + '.', 'a[' + i + '] = ' + s + '–' + e + ': เริ่มที่ ' + s + ' ≥ lastEnd ' + le + ' จึงใส่ได้ <b>เลือก</b>: cnt = ' + cnt + ', lastEnd = ' + e), { lines: [at('if (a[i].s >= lastEnd)'), at('cnt++;')] });
        } else {
          state[i] = 'skip';
          sim.step(at('if (a[i].s >= lastEnd)'), L('a[' + i + '] starts at ' + s + ' &lt; lastEnd ' + le + ': it overlaps the interval we already took. Skip. (Taking it instead could never help: it ends later.)', 'a[' + i + '] เริ่มที่ ' + s + ' &lt; lastEnd ' + le + ': ทับกับช่วงที่เลือกไว้แล้ว ข้าม (เลือกมันแทนก็ไม่ช่วย เพราะมันจบช้ากว่า)'), { lines: [at('for (int i = 0')] });
        }
      }
      cur = null; sim.drop('i');
      sim.print(sim.r(cA) + '\n');
      sim.step(at('cout << cnt'), L('Maximum number of non-overlapping intervals: <b>' + cnt + '</b>.', 'จำนวนช่วงที่ไม่ทับกันมากที่สุด: <b>' + cnt + '</b>'));
      sim.ret(0, { show: false });
    }
  });
})();
