<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>C++ Memory Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Sans:wght@400;600;700&family=IBM+Plex+Sans+Thai:wght@400;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root {
  /* Layout idea: a debugger bench. Sticky step bar on top; code on the left; concept view and raw memory (stack | heap) on the right. */
  --bg: #eef0f4;
  --panel: #ffffff;
  --panel-2: #f6f7fa;
  --ink: #161a24;
  --muted: #5b6375;
  --line: #d9dde6;
  --stack: #2a64d6;
  --stack-tint: #e9f0fd;
  --heap: #b56d00;
  --heap-tint: #fdf3e2;
  --ptr: #d02f67;
  --acc: #0b8f7d;
  --acc-tint: #dff4f0;
  --chg: #ffe066;
  --read: #7c4dff;
  --new: #1f9d55;
  --bad: #d6402b;
  --code-bg: #fbfbfd;
  --font-display: "Bricolage Grotesque", "IBM Plex Sans Thai", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", "IBM Plex Sans Thai", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", "IBM Plex Mono", ui-monospace, "Cascadia Code", Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1117; --panel: #161b24; --panel-2: #1b212c; --ink: #e7eaf0; --muted: #9aa3b5; --line: #2a3242;
    --stack: #7aa7ff; --stack-tint: #172338; --heap: #f2b64f; --heap-tint: #2a2215; --ptr: #ff6f9f;
    --acc: #3fd0b9; --acc-tint: #12302c; --chg: #8a6d00; --read: #a58bff; --new: #4ccf83; --bad: #ff7b66; --code-bg: #12161e;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1117; --panel: #161b24; --panel-2: #1b212c; --ink: #e7eaf0; --muted: #9aa3b5; --line: #2a3242;
  --stack: #7aa7ff; --stack-tint: #172338; --heap: #f2b64f; --heap-tint: #2a2215; --ptr: #ff6f9f;
  --acc: #3fd0b9; --acc-tint: #12302c; --chg: #8a6d00; --read: #a58bff; --new: #4ccf83; --bad: #ff7b66; --code-bg: #12161e;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5; }
code, .mono { font-family: var(--font-mono); font-size: .92em; }
button, select, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; line-height: 1.2; margin: 0; }

/* ---------- top bar ---------- */
.topbar { position: sticky; top: 0; z-index: 30; display: flex; align-items: center; gap: 12px; padding: 8px 16px; background: var(--panel); border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--font-display); font-weight: 700; font-size: 17px; color: var(--ink); text-decoration: none; white-space: nowrap; }
.brand-mark { display: grid; grid-template-columns: repeat(4, 7px); gap: 2px; }
.brand-mark i { width: 7px; height: 7px; border-radius: 1.5px; background: var(--stack); opacity: .9; }
.brand-mark i:nth-child(2n) { background: var(--heap); }
.brand-mark i:nth-child(3) { background: var(--ptr); }
.topbar .spacer { flex: 1; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: transparent; padding: 4px 10px; cursor: pointer; font-size: 13px; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--panel); }
.iconbtn { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 4px 10px; cursor: pointer; font-size: 13px; }
.menu-btn { display: none; }

/* ---------- app shell ---------- */
.app { display: grid; grid-template-columns: 270px minmax(0, 1fr); min-height: calc(100% - 50px); }
.side { border-right: 1px solid var(--line); background: var(--panel); padding: 12px 10px 40px; position: sticky; top: 50px; height: calc(100vh - 50px); overflow-y: auto; }
.side a { display: flex; gap: 8px; align-items: baseline; padding: 5px 8px; border-radius: 7px; color: var(--ink); text-decoration: none; font-size: 14px; line-height: 1.3; }
.side a:hover { background: var(--panel-2); }
.side a[aria-current="page"] { background: var(--acc-tint); color: var(--ink); font-weight: 600; box-shadow: inset 3px 0 0 var(--acc); }
.side .ls { font-family: var(--font-mono); font-size: 11px; color: var(--muted); min-width: 26px; }
.side h4 { margin: 16px 8px 4px; font-family: var(--font-display); font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.side h4 small { display: block; text-transform: none; letter-spacing: 0; font-family: var(--font-body); font-weight: 400; }
.main { min-width: 0; padding: 0 0 80px; }

/* ---------- home ---------- */
.home { max-width: 1100px; margin: 0 auto; padding: 28px 20px 40px; display: grid; gap: 28px; }
.home h1 { font-size: clamp(28px, 4vw, 40px); }
.home .lede { max-width: 68ch; color: var(--muted); font-size: 17px; margin: 10px 0 0; }
.home h2 { font-size: 22px; margin-bottom: 10px; }
.home p { max-width: 70ch; }
.legend-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
.legend-item { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; font-size: 14px; }
.legend-item .sw { flex: 0 0 auto; margin-top: 2px; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 10px; }
.card { display: grid; gap: 4px; padding: 12px 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; text-decoration: none; color: var(--ink); }
.card:hover { border-color: var(--acc); }
.card .t { font-weight: 600; }
.card .s { font-size: 13px; color: var(--muted); }
.card .k { font-family: var(--font-mono); font-size: 11px; color: var(--muted); }
.card .play { font-size: 12px; color: var(--acc); font-weight: 600; }
.diagram { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; overflow-x: auto; }
.twocol { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.callout { border-left: 3px solid var(--heap); background: var(--heap-tint); padding: 10px 14px; border-radius: 0 8px 8px 0; font-size: 14px; }
table.ref { border-collapse: collapse; font-size: 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
table.ref th, table.ref td { padding: 6px 12px; border-bottom: 1px solid var(--line); text-align: left; }
table.ref th { background: var(--panel-2); font-weight: 600; }
table.ref td.num { font-variant-numeric: tabular-nums; font-family: var(--font-mono); }

/* ---------- lab ---------- */
.lab-head { padding: 18px 20px 6px; display: grid; gap: 6px; }
.lab-head .crumbs { font-size: 12px; color: var(--muted); font-family: var(--font-mono); }
.lab-head h1 { font-size: 26px; }
.lab-head .summary { color: var(--muted); max-width: 90ch; margin: 0; }
.params { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: end; padding: 8px 20px 4px; }
.params label { display: grid; gap: 3px; font-size: 12px; color: var(--muted); }
.params input { min-width: 260px; padding: 6px 9px; border: 1px solid var(--line); border-radius: 7px; background: var(--panel); font-family: var(--font-mono); font-size: 13px; }
.params .hint { font-size: 12px; color: var(--muted); max-width: 70ch; }
.params .err { color: var(--bad); font-size: 13px; }
.btn { border: 1px solid var(--line); background: var(--panel); border-radius: 7px; padding: 6px 12px; cursor: pointer; font-size: 13px; }
.btn.primary { background: var(--acc); color: #fff; border-color: var(--acc); font-weight: 600; }

.stepbar { position: sticky; top: 50px; z-index: 20; margin: 8px 20px 0; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 6px 18px -12px rgba(0,0,0,.35); }
.controls { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.controls button { border: 1px solid var(--line); background: var(--panel-2); border-radius: 7px; min-width: 34px; height: 30px; cursor: pointer; font-size: 14px; }
.controls button.play { min-width: 74px; background: var(--ink); color: var(--panel); border-color: var(--ink); font-weight: 600; font-size: 13px; }
.controls input[type=range] { flex: 1; min-width: 140px; accent-color: var(--acc); }
.controls .count { font-family: var(--font-mono); font-size: 13px; color: var(--muted); min-width: 92px; text-align: right; font-variant-numeric: tabular-nums; }
.controls select { border: 1px solid var(--line); border-radius: 7px; background: var(--panel-2); height: 30px; font-size: 13px; }
.note { padding: 10px 16px 12px; font-size: 15.5px; line-height: 1.6; min-height: 64px; }
.note.warn { background: color-mix(in srgb, var(--bad) 9%, transparent); }
.note code { background: var(--panel-2); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; }
.note b.s { color: var(--stack); } .note b.h { color: var(--heap); } .note b.p { color: var(--ptr); }
.note .kbd { font-family: var(--font-mono); font-size: 11px; border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; color: var(--muted); }

.lab-grid { display: grid; grid-template-columns: minmax(330px, 0.85fr) minmax(0, 1.4fr); gap: 14px; padding: 14px 20px; align-items: start; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; min-width: 0; }
.panel > .ph { display: flex; align-items: center; gap: 8px; padding: 7px 12px; border-bottom: 1px solid var(--line); font-size: 12px; font-weight: 600; color: var(--muted); letter-spacing: .04em; text-transform: uppercase; }
.panel > .ph .sub { text-transform: none; letter-spacing: 0; font-weight: 400; }
.col { display: grid; gap: 14px; min-width: 0; align-content: start; }
.col-left { position: sticky; top: 200px; }

/* code */
.code { position: relative; margin: 0; padding: 8px 0; background: var(--code-bg); font-family: var(--font-mono); font-size: 13px; line-height: 1.55; overflow: auto; max-height: 62vh; border-radius: 0 0 12px 12px; }
.code .ln { display: grid; grid-template-columns: 38px 1fr; padding-right: 10px; white-space: pre; position: relative; }
.code .ln .no { color: var(--muted); text-align: right; padding-right: 12px; user-select: none; opacity: .7; }
.code .ln.cur { background: var(--acc-tint); box-shadow: inset 3px 0 0 var(--acc); }
.code .ln.cur .no { color: var(--acc); opacity: 1; font-weight: 700; }
.code .ln.wait { background: color-mix(in srgb, var(--acc-tint) 45%, transparent); }
.code .ln.wait::after { content: attr(data-w); position: absolute; right: 6px; top: 1px; padding: 0 6px; border-radius: 4px; background: var(--code-bg); box-shadow: 0 0 0 1px var(--line); color: var(--muted); font-size: 11px; }
.code .ln.extra { background: color-mix(in srgb, var(--chg) 30%, transparent); }
.tk-k { color: #8b3fc7; font-weight: 600; } .tk-t { color: #1c6fb8; } .tk-n { color: #b4531f; } .tk-c { color: #7a8597; font-style: italic; } .tk-s { color: #1e8a4c; } .tk-p { color: #b02a72; }
:root[data-theme="dark"] .tk-k { color: #c792ea; } :root[data-theme="dark"] .tk-t { color: #82aaff; } :root[data-theme="dark"] .tk-n { color: #f78c6c; } :root[data-theme="dark"] .tk-s { color: #c3e88d; } :root[data-theme="dark"] .tk-p { color: #ff79c6; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .tk-k { color: #c792ea; } :root:not([data-theme="light"]) .tk-t { color: #82aaff; } :root:not([data-theme="light"]) .tk-n { color: #f78c6c; } :root:not([data-theme="light"]) .tk-s { color: #c3e88d; } :root:not([data-theme="light"]) .tk-p { color: #ff79c6; } }
.console { margin: 0; padding: 8px 12px; min-height: 38px; max-height: 180px; overflow: auto; font-family: var(--font-mono); font-size: 13px; white-space: pre-wrap; background: var(--code-bg); border-radius: 0 0 12px 12px; }
.console .new { background: color-mix(in srgb, var(--chg) 55%, transparent); }

/* concept view */
.view { padding: 10px; overflow-x: auto; }
.view svg { display: block; margin: 0 auto; max-width: none; }
.view svg text { font-family: var(--font-mono); fill: var(--ink); }
.view .cap { font-size: 13px; color: var(--muted); margin: 2px 4px 8px; }

/* memory */
.mem { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr); gap: 34px; padding: 12px; }
.mem.no-heap { grid-template-columns: minmax(0, 640px); }
.region { display: grid; gap: 10px; align-content: start; min-width: 0; position: relative; z-index: 2; }
.region-h { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
.region-h .sub { font-weight: 400; letter-spacing: 0; text-transform: none; color: var(--muted); font-size: 11.5px; }
.region.stack .region-h { color: var(--stack); }
.region.heap .region-h { color: var(--heap); }
.empty-note { font-size: 13px; color: var(--muted); border: 1px dashed var(--line); border-radius: 10px; padding: 10px; }

.frame { border: 1.5px solid var(--stack); border-radius: 10px; background: var(--stack-tint); overflow: hidden; }
.frame.top { box-shadow: 0 0 0 3px color-mix(in srgb, var(--stack) 22%, transparent); }
.frame.dead { border-style: dashed; opacity: .55; filter: grayscale(.6); }
.frame-h { display: flex; justify-content: space-between; gap: 8px; padding: 5px 10px; font-family: var(--font-mono); font-size: 12.5px; font-weight: 700; color: var(--stack); border-bottom: 1px solid color-mix(in srgb, var(--stack) 30%, transparent); }
.frame-h .fl { font-weight: 400; color: var(--muted); }
.frame-body { display: grid; gap: 1px; padding: 4px; }
.retchip { margin: 4px; padding: 3px 8px; border-radius: 6px; font-family: var(--font-mono); font-size: 12px; background: color-mix(in srgb, var(--new) 16%, var(--panel)); border: 1px solid var(--new); }

.var { display: grid; grid-template-columns: 58px minmax(52px, auto) 1fr; gap: 8px; align-items: center; padding: 3px 6px; background: var(--panel); border-radius: 6px; font-size: 13px; min-height: 30px; }
.var .addr { font-family: var(--font-mono); font-size: 11px; color: var(--muted); }
.var .nm { font-family: var(--font-mono); font-weight: 700; }
.var .nm small { display: block; font-weight: 400; color: var(--muted); font-size: 10.5px; }
.var .val { justify-self: start; }
.var.param .nm::after { content: " param"; font-size: 9.5px; font-weight: 600; color: var(--stack); vertical-align: super; }
.var.ref { border: 1.5px dashed var(--ptr); }
.var.objv { grid-template-columns: 1fr; padding: 4px 6px 6px; border: 1px solid var(--line); }
.objv .oh { display: flex; gap: 8px; align-items: baseline; font-size: 12.5px; }
.objv .oh .nm { font-family: var(--font-mono); font-weight: 700; }
.objv .oh .ty { font-family: var(--font-mono); color: var(--muted); font-size: 11.5px; }
.objv .oh .addr { margin-left: auto; font-family: var(--font-mono); font-size: 11px; color: var(--muted); }
.fields { display: grid; gap: 2px; margin-top: 3px; }
.fld { display: grid; grid-template-columns: 58px 76px 1fr; gap: 6px; align-items: center; padding: 2px 4px; background: var(--panel-2); border-radius: 5px; font-size: 12.5px; }
.fld .addr { font-family: var(--font-mono); font-size: 10.5px; color: var(--muted); }
.fld .fn { font-family: var(--font-mono); font-weight: 600; }
.fld .fn small { display: block; font-weight: 400; color: var(--muted); font-size: 10px; }

.v { display: inline-flex; align-items: center; min-width: 30px; min-height: 22px; padding: 1px 7px; border-radius: 5px; border: 1px solid var(--line); background: var(--panel); font-family: var(--font-mono); font-size: 13px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.v.garb { color: var(--muted); border-style: dashed; }
.v.ptr { color: var(--ptr); border-color: color-mix(in srgb, var(--ptr) 55%, transparent); font-weight: 600; }
.v.ptr::before { content: "●"; font-size: 8px; margin-right: 5px; }
.v.null { color: var(--muted); }
.v.null::before { content: "∅"; font-size: 11px; margin-right: 4px; }
.v.dang { color: var(--bad); border-color: var(--bad); border-style: dashed; }
.v.dang::after { content: " ⚠ dangling"; font-size: 10.5px; font-weight: 600; }
.var.chg > .val > .v, .fld.chg .v, .cell.chg .cv { animation: flash 1.1s ease-out; background: color-mix(in srgb, var(--chg) 70%, var(--panel)); }
.var.read > .val > .v, .fld.read .v, .cell.read .cv { outline: 2.5px solid var(--read); outline-offset: 1px; }
.var.nwv { box-shadow: inset 3px 0 0 var(--new); }
@keyframes flash { 0% { background: var(--chg); transform: scale(1.08); } 100% { transform: scale(1); } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

/* arrays (stack or heap) */
.arr { display: flex; flex-wrap: wrap; gap: 0; padding-top: 2px; }
.cell { display: grid; grid-template-rows: auto auto auto; justify-items: center; min-width: 50px; padding: 2px 0 3px; position: relative; }
.cell .ci { font-family: var(--font-mono); font-size: 10.5px; color: var(--muted); }
.cell .cv { display: grid; place-items: center; min-width: 46px; height: 32px; padding: 0 5px; border: 1.5px solid var(--heap); border-left-width: 0; background: var(--panel); font-family: var(--font-mono); font-size: 13.5px; font-variant-numeric: tabular-nums; }
.cell:first-child .cv { border-left-width: 1.5px; border-radius: 6px 0 0 6px; }
.cell.last .cv { border-radius: 0 6px 6px 0; }
.cell .ca { font-family: var(--font-mono); font-size: 9.5px; color: var(--muted); }
.cell.unused .cv { background: repeating-linear-gradient(135deg, transparent 0 5px, color-mix(in srgb, var(--line) 70%, transparent) 5px 6px); color: var(--muted); }
.cell.garb .cv { color: var(--muted); }
.cell .ptrv { font-size: 11px; color: var(--ptr); font-weight: 600; }
.cell .tags { display: flex; gap: 2px; justify-content: center; min-height: 17px; }
.tag { font-family: var(--font-mono); font-size: 10.5px; font-weight: 700; padding: 0 5px; border-radius: 4px; background: var(--ink); color: var(--panel); line-height: 16px; }
.tag.t2 { background: var(--ptr); color: #fff; } .tag.t3 { background: var(--acc); color: #fff; } .tag.t4 { background: var(--read); color: #fff; }
.var .arr .cell .cv { border-color: var(--stack); }
.cell.endmark .cv { border: 1.5px dashed var(--muted); border-radius: 6px; color: var(--muted); font-size: 11px; margin-left: 6px; min-width: 38px; background: transparent; }

.block { border: 1.5px solid var(--heap); border-radius: 10px; background: var(--heap-tint); padding: 5px 8px 8px; min-width: 0; }
.block.born { box-shadow: 0 0 0 3px color-mix(in srgb, var(--new) 45%, transparent); }
.block.freed { border-style: dashed; opacity: .55; filter: grayscale(.7); }
.block-h { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; font-size: 12px; margin-bottom: 3px; }
.block-h .bl { font-weight: 700; color: var(--heap); font-family: var(--font-mono); }
.block-h .bx { font-family: var(--font-mono); color: var(--muted); font-size: 11px; }
.block-h .badge { font-size: 10.5px; font-weight: 700; padding: 0 6px; border-radius: 10px; background: var(--new); color: #fff; }
.block-h .badge.freedb { background: var(--bad); }
.heap-nodes { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-start; }
.heap-nodes .block { flex: 0 0 auto; }
.block.obj .fields { min-width: 190px; }

svg.arrows { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 3; overflow: visible; }
svg.arrows path { fill: none; stroke: var(--ptr); stroke-width: 1.8; opacity: .85; }
svg.arrows path.hchg { stroke-width: 3; opacity: 1; }
svg.arrows path.dim { opacity: .18; }
svg.arrows path.hot { stroke-width: 3.2; opacity: 1; }
svg.arrows path.refp { stroke-dasharray: 5 4; }
.mem.arrows-off svg.arrows { display: none; }

.legend-bar { display: flex; flex-wrap: wrap; gap: 6px 14px; padding: 6px 12px 10px; font-size: 12px; color: var(--muted); border-top: 1px solid var(--line); }
.legend-bar span { display: inline-flex; align-items: center; gap: 5px; }
.sw { display: inline-block; width: 14px; height: 14px; border-radius: 4px; border: 1.5px solid var(--line); }
.sw.st { border-color: var(--stack); background: var(--stack-tint); }
.sw.hp { border-color: var(--heap); background: var(--heap-tint); }
.sw.ch { background: var(--chg); border-color: var(--chg); }
.sw.rd { border: 2px solid var(--read); }
.sw.nw { border: 2px solid var(--new); }

   wide = big structures: memory goes full width under code + view */

  .lab-grid, .lab-grid.wide, .lab-grid.noview { grid-template-areas: "left" "view" "mem"; }

}

<body>
<header class="topbar">

  <a class="brand" href="#home"><span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span>C++ Memory Lab</a>
  <span class="spacer"></span>
  <div class="seg" id="lang" role="group" aria-label="Language"><button data-l="en" aria-pressed="true">EN</button><button data-l="th" aria-pressed="false">ไทย</button></div>

<div class="app">
  <nav class="side" id="side" aria-label="Scenarios"></nav>
  <main class="main" id="main"></main>
</div>
<script>
/* =====================================================================
   Memory Lab engine: a tiny simulated C++ memory.
   Scenarios drive a Sim object (call functions, declare locals, new/delete,
   read/write by address) and take snapshots with sim.step(line, note).
   The renderer only ever looks at snapshots.
   ===================================================================== */

// ---------- i18n ----------
const L = (en, th) => ({ en, th: th == null ? en : th });
let LANG = 'en';
const tr = x => (x && typeof x === 'object' && 'en' in x) ? (x[LANG] != null ? x[LANG] : x.en) : (x == null ? '' : String(x));

// ---------- values ----------
const P = a => ({ p: a });            // a pointer value holding address a (0 = nullptr)
const isP = v => v !== null && typeof v === 'object' && 'p' in v;
const CH = c => ({ ch: c });          // a char value
const isCH = v => v !== null && typeof v === 'object' && 'ch' in v;
const STR = s => ({ str: s });        // an opaque std::string value
const isSTR = v => v !== null && typeof v === 'object' && 'str' in v;

const BASE_SIZE = {
  char: 1, bool: 1, short: 2, int: 4, unsigned: 4, float: 4,
  long: 8, 'long long': 8, double: 8, size_t: 8, 'std::string': 32, string: 32
};
function sizeOf(type) {
  type = String(type).trim();
  if (/[*&]$/.test(type)) return 8;
  if (type in BASE_SIZE) return BASE_SIZE[type];
  const m = type.match(/^pair<(.+),(.+)>$/);
  if (m) return 8;               // only used for display of small pairs
  return 8;
}
const hex = a => '0x' + a.toString(16).toUpperCase().padStart(4, '0');

function clone(x) {
  if (x === undefined) return undefined;
  if (typeof structuredClone === 'function') return structuredClone(x);
  const fix = v => { if (Array.isArray(v)) return Array.from(v, fix); if (v && typeof v === 'object') { if (v.__U__) return undefined; const o = {}; for (const k in v) o[k] = fix(v[k]); return o; } return v; };
  return fix(JSON.parse(JSON.stringify(x, (k, v) => v === undefined ? { __U__: 1 } : v)));
}

// Lay out a list of [name, type, value] fields with natural alignment.
function layoutFields(fields, base) {
  let off = 0, maxAl = 1;
  const out = fields.map(([name, type, value]) => {
    const sz = sizeOf(type);
    const al = Math.min(sz, 8);
    maxAl = Math.max(maxAl, al);
    off = Math.ceil(off / al) * al;
    const f = { name, type, size: sz, off, addr: base + off, value };
    off += sz;
    return f;
  });
  const size = Math.ceil(off / maxAl) * maxAl;
  return { fields: out, size };
}
function structSize(fields) { return layoutFields(fields, 0).size; }

class Sim {
  constructor(opts = {}) {
    this.frames = [];
    this.ghosts = [];            // frames popped since the last snapshot (shown once, greyed)
    this.heap = [];
    this.globals = null;
    this.sp = opts.stackTop || 0xF000;
    this.hp = opts.heapBase || 0x1000;
    this.out = '';
    this.snaps = [];
    this.reads = new Set();
    this.viewFn = null;
    this.tagFn = null;
    this.seq = 0;
    this.limit = opts.limit || 1500;   // safety cap on number of steps
  }

  // ---------- frames ----------
  top() { return this.frames[this.frames.length - 1]; }
  call(sig, opts = {}) {
    const f = { id: ++this.seq, sig, vars: [], line: null, spStart: this.sp, ret: null, note: opts.note || null };
    this.frames.push(f);
    return f;
  }
  // pop the current frame; value is shown as a "returned" chip on the caller
  ret(value, opts = {}) {
    const f = this.frames.pop();
    this.sp = f.spStart;
    f.dead = true;
    this.ghosts.push(f);
    const caller = this.top();
    if (caller && opts.show !== false) caller.ret = { from: f.sig, value, type: opts.type || null };
    return value;
  }

  _alloc(size, align) {
    align = Math.min(align || size, 8) || 1;
    this.sp -= size;
    this.sp -= ((this.sp % align) + align) % align;
    return this.sp;
  }

  // scalar local (or parameter).  opts: {param:true, ref:true, note, cls}
  local(name, type, value, opts = {}) {
    const size = opts.ref ? 8 : sizeOf(type);
    const addr = this._alloc(size, size);
    const v = { kind: 'scalar', name, type, addr, size, value, param: !!opts.param, ref: !!opts.ref, cls: opts.cls || null, hidden: !!opts.hidden };
    this.top().vars.push(v);
    return addr;
  }
  param(name, type, value, opts = {}) { return this.local(name, type, value, Object.assign({ param: true }, opts)); }
  ref(name, type, target, opts = {}) { return this.local(name, type + '&', P(target), Object.assign({ ref: true }, opts)); }

  // remove a local from the current frame (end of its scope)
  drop(name) {
    const f = this.top();
    const v = f.vars.find(v => v.name === name);
    if (!v) return;
    f.vars = f.vars.filter(x => x !== v);
    if (v.addr === this.sp) this.sp += v.size;
    const lowest = f.vars.length ? Math.min(...f.vars.map(x => x.addr)) : f.spStart;
    this.sp = Math.min(lowest, f.spStart);
  }

  // local object with fields: fields = [[name, type, value], ...]
  obj(name, type, fields, opts = {}) {
    const size = structSize(fields);
    const addr = this._alloc(size, 8);
    const lay = layoutFields(fields, addr);
    const v = { kind: 'obj', name, type, addr, size, fields: lay.fields, param: !!opts.param, cls: opts.cls || null };
    this.top().vars.push(v);
    return addr;
  }

  // local C array
  arr(name, elemType, n, init, opts = {}) {
    const es = sizeOf(elemType);
    const addr = this._alloc(es * n, es);
    const cells = Array.from({ length: n }, (_, i) => Array.isArray(init) ? init[i] : init);
    this.top().vars.push({ kind: 'array', name, type: elemType + '[' + n + ']', elemType, es, n, addr, size: es * n, cells, param: !!opts.param });
    return addr;
  }

  // ---------- heap ----------
  _halloc(bytes) {
    const a = this.hp;
    this.hp += Math.ceil(Math.max(bytes, 1) / 16) * 16 + 16;   // 16-byte allocator header between blocks
    return a;
  }
  newArray(elemType, n, init, opts = {}) {
    const es = sizeOf(elemType);
    const addr = this._halloc(es * n);
    const cells = Array.from({ length: n }, (_, i) => Array.isArray(init) ? init[i] : (typeof init === 'function' ? init(i) : init));
    this.heap.push({ kind: 'array', addr, elemType, es, n, cells, size: es * n, label: opts.label || null, used: opts.used == null ? null : opts.used, born: true, expr: opts.expr || ('new ' + elemType + '[' + n + ']') });
    return addr;
  }
  newObj(type, fields, opts = {}) {
    const size = structSize(fields);
    const addr = this._halloc(size);
    const lay = layoutFields(fields, addr);
    this.heap.push({ kind: 'obj', addr, type, size, fields: lay.fields, label: opts.label || null, born: true, cls: opts.cls || null, expr: opts.expr || ('new ' + type) });
    return addr;
  }
  free(addr) {
    const b = this.heap.find(b => b.addr === addr && !b.freed);
    if (!b) throw new Error('free of unknown block ' + hex(addr));
    b.freed = true;
  }
  block(addr) { return this.heap.find(b => b.addr === addr && !b.freed); }
  setUsed(addr, n) { const b = this.block(addr); if (b) b.used = n; }
  setLabel(addr, label) { const b = this.block(addr); if (b) b.label = label; }

  // ---------- memory access by address ----------
  locate(addr) {
    for (const f of this.frames) {
      for (const v of f.vars) {
        if (v.kind === 'scalar' && v.addr === addr) return { o: v, k: 'value' };
        if (v.kind === 'obj') for (const fd of v.fields) if (fd.addr === addr) return { o: fd, k: 'value' };
        if (v.kind === 'array' && addr >= v.addr && addr < v.addr + v.size && (addr - v.addr) % v.es === 0) return { o: v.cells, k: (addr - v.addr) / v.es };
      }
    }
    for (const b of this.heap) {
      if (b.freed) continue;
      if (b.kind === 'array' && addr >= b.addr && addr < b.addr + b.size && (addr - b.addr) % b.es === 0) return { o: b.cells, k: (addr - b.addr) / b.es };
      if (b.kind === 'obj') for (const fd of b.fields) if (fd.addr === addr) return { o: fd, k: 'value' };
    }
    return null;
  }
  r(addr) {
    const c = this.locate(addr);
    if (!c) throw new Error('read of invalid address ' + hex(addr));
    this.reads.add(addr);
    return c.o[c.k];
  }
  peek(addr) { const c = this.locate(addr); if (!c) throw new Error('peek of invalid address ' + hex(addr)); return c.o[c.k]; }
  w(addr, value) {
    const c = this.locate(addr);
    if (!c) throw new Error('write to invalid address ' + hex(addr));
    c.o[c.k] = value;
    return value;
  }
  // field address of an object at base (stack or heap)
  f(base, field) {
    for (const fr of this.frames) for (const v of fr.vars) if (v.kind === 'obj' && v.addr === base) { const fd = v.fields.find(x => x.name === field); if (fd) return fd.addr; }
    for (const b of this.heap) if (b.kind === 'obj' && b.addr === base && !b.freed) { const fd = b.fields.find(x => x.name === field); if (fd) return fd.addr; }
    throw new Error('no field ' + field + ' at ' + hex(base));
  }
  // read/write a field
  rf(base, field) { return this.r(this.f(base, field)); }
  pf(base, field) { return this.peek(this.f(base, field)); }
  wf(base, field, value) { return this.w(this.f(base, field), value); }
  // address of element i of an array that starts at base
  at(base, i, es = 4) { return base + i * es; }

  print(s) { this.out += s; }

  _safe(fn, key, dflt) {
    if (!fn) return dflt;
    try { const r = fn(this); return r == null ? dflt : clone(r); }
    catch (e) { const last = this.snaps[this.snaps.length - 1]; return last ? last[key] : dflt; }
  }
  // ---------- snapshot ----------
  step(line, note, opts = {}) {
    if (this.snaps.length >= this.limit) throw new Error('STEP_LIMIT');
    if (line != null && this.frames.length) this.top().line = line;
    const s = {
      frames: clone(this.frames),
      ghosts: clone(this.ghosts),
      heap: clone(this.heap),
      out: this.out,
      note,
      reads: [...this.reads],
      view: this._safe(this.viewFn, 'view', null),
      tags: this._safe(this.tagFn, 'tags', []),
      line: line,
      lines: opts.lines || null,   // extra lines to highlight
      cls: opts.cls || null,       // e.g. 'warn' for a bad step
      label: opts.label || null
    };
    this.snaps.push(s);
    this.reads.clear();
    this.ghosts = [];
    this.heap = this.heap.filter(b => !b.freed);
    for (const b of this.heap) b.born = false;
    for (const f of this.frames) f.ret = null;
    return s;
  }
}

// ---------- scenario registry ----------
const SCEN = [];
function def(s) { SCEN.push(s); }
const PARTS = [
  { id: 1, title: L('C++ in memory', 'C++ ในหน่วยความจำ'), sub: L('Variables, pointers, functions, classes', 'ตัวแปร พอยน์เตอร์ ฟังก์ชัน คลาส') },
  { id: 2, title: L('Containers inside', 'ข้างในคอนเทนเนอร์'), sub: L('vector, stack, queue, list, heap, BST, hash', 'vector, stack, queue, list, heap, BST, hash') },
  { id: 3, title: L('Algorithms step by step', 'อัลกอริทึมทีละขั้น'), sub: L('Searching, sorting, recursion, DP, graphs', 'ค้นหา เรียง เรียกซ้ำ DP กราฟ') }
];

// parse "1, 2, 3" or "1 2 3" into numbers
function parseNums(s, max = 40) {
  return String(s).split(/[\s,]+/).filter(x => x !== '').slice(0, max).map(Number).filter(x => Number.isFinite(x)).map(x => Math.trunc(x));
}
// parse ops like "push 3, pop, push 5" → [['push',3],['pop']]
function parseOps(s, max = 30) {
  return String(s).split(/[,;\n]+/).map(x => x.trim()).filter(Boolean).slice(0, max).map(x => {
    const parts = x.split(/[\s()]+/).filter(Boolean);
    return [parts[0].toLowerCase(), ...parts.slice(1).map(t => (/^-?\d+$/.test(t) ? Number(t) : t))];
  });
}

/* =====================================================================
   Concept views: friendlier pictures of the same state (tree, ring,
   chain, graph, table, ...). Each takes a plain data object and returns
   an HTML/SVG string.
   ===================================================================== */

const VCLS = {
  hl:  { f: 'var(--acc-tint)', s: 'var(--acc)' },
  cmp: { f: 'color-mix(in srgb, var(--read) 16%, var(--panel))', s: 'var(--read)' },
  chg: { f: 'color-mix(in srgb, var(--chg) 75%, var(--panel))', s: 'var(--heap)' },
  ok:  { f: 'color-mix(in srgb, var(--new) 18%, var(--panel))', s: 'var(--new)' },
  bad: { f: 'color-mix(in srgb, var(--bad) 15%, var(--panel))', s: 'var(--bad)' },
  dim: { f: 'var(--panel-2)', s: 'var(--line)' },
  st:  { f: 'var(--stack-tint)', s: 'var(--stack)' },
  hp:  { f: 'var(--heap-tint)', s: 'var(--heap)' },
  hdr: { f: 'var(--panel-2)', s: 'var(--muted)' },
  '':  { f: 'var(--panel)', s: 'var(--muted)' }
};
const vc = c => VCLS[c || ''] || VCLS[''];
const sesc = s => esc(tr(s));

const VIEWS = {};

// ---------- several views stacked ----------
VIEWS.multi = d => d.parts.map(p => (p.cap ? '<div class="cap">' + tr(p.cap) + '</div>' : '') + VIEWS[p.kind](p)).join('<div style="height:12px"></div>');

// ---------- raw html ----------
VIEWS.html = d => tr(d.html);

// ---------- bytes of variables ----------
VIEWS.bytes = d => {
  let h = '<div style="display:grid;gap:10px">';
  for (const v of d.vars) {
    h += '<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap"><div style="min-width:120px;font-family:var(--font-mono);font-size:13px"><b>' + esc(v.name) + '</b> <span style="color:var(--muted)">' + esc(v.type) + '</span><br><span style="color:var(--muted);font-size:11.5px">= ' + esc(v.show) + '</span></div><div style="display:flex">';
    v.bytes.forEach((b, i) => {
      const c = vc(v.cls && v.cls[i]);
      h += '<div style="display:grid;justify-items:center"><div style="font-family:var(--font-mono);font-size:10px;color:var(--muted)">+' + i + '</div><div style="width:38px;height:32px;display:grid;place-items:center;border:1.5px solid ' + c.s + ';background:' + c.f + ';margin-left:-1.5px;font-family:var(--font-mono);font-size:13px">' + b + '</div><div style="font-family:var(--font-mono);font-size:9.5px;color:var(--muted)">' + hex(v.addr + i) + '</div></div>';
    });
    h += '</div>' + (v.extra ? '<div style="font-size:12.5px;color:var(--muted);max-width:40ch">' + tr(v.extra) + '</div>' : '') + '</div>';
  }
  return h + '</div>';
};

// ---------- arrays with index markers ----------
// d.rows = [{label, cells:[v], cls:[c], marks:{i:[label]}, idx:true, ranges:[{a,b,label,cls}] }]
VIEWS.array = d => {
  let h = '<div style="display:grid;gap:14px">';
  for (const r of d.rows) {
    const n = r.cells.length, W = r.w || 46, H = 34, top = 22, x0 = r.label ? 96 : 6;
    const ranges = r.ranges || [];
    const height = top + H + 18 + (ranges.length ? 22 * ranges.length : 0) + 4;
    const width = x0 + n * W + 10 + (r.marks && r.marks[n] ? 24 + 8 * r.marks[n].join(',').length : 0);
    let s = '<svg width="' + width + '" height="' + height + '" viewBox="0 0 ' + width + ' ' + height + '">';
    if (r.label) s += '<text x="0" y="' + (top + H / 2 + 4) + '" font-size="12.5" style="fill:var(--muted)">' + sesc(r.label) + '</text>';
    r.cells.forEach((v, i) => {
      const c = vc(r.cls && r.cls[i]);
      const x = x0 + i * W;
      s += '<rect x="' + x + '" y="' + top + '" width="' + W + '" height="' + H + '" rx="3" style="fill:' + c.f + ';stroke:' + c.s + ';stroke-width:1.5"/>';
      s += '<text x="' + (x + W / 2) + '" y="' + (top + H / 2 + 5) + '" text-anchor="middle" font-size="' + (String(v).length > 5 ? 10.5 : 13.5) + '">' + esc(v === undefined || v === null ? '' : String(v)) + '</text>';
      if (r.idx !== false) s += '<text x="' + (x + W / 2) + '" y="' + (top + H + 13) + '" text-anchor="middle" font-size="10" style="fill:var(--muted)">' + (r.idx0 != null ? r.idx0 + i : i) + '</text>';
      const mk = r.marks && r.marks[i];
      if (mk && mk.length) s += '<text x="' + (x + W / 2) + '" y="' + (top - 7) + '" text-anchor="middle" font-size="11.5" font-weight="700" style="fill:var(--ptr)">' + esc(mk.join(',')) + ' ▾</text>';
    });
    if (r.marks && r.marks[n] && r.marks[n].length) s += '<text x="' + (x0 + n * W + 4) + '" y="' + (top - 7) + '" font-size="11.5" font-weight="700" style="fill:var(--ptr)">' + esc(r.marks[n].join(',')) + ' ▾</text>';
    ranges.forEach((g, k) => {
      const y = top + H + 20 + k * 22, xa = x0 + g.a * W + 3, xb = x0 + (g.b + 1) * W - 3;
      const c = vc(g.cls || 'hl');
      if (g.b >= g.a) {
        s += '<path d="M' + xa + ',' + (y - 6) + ' L' + xa + ',' + y + ' L' + xb + ',' + y + ' L' + xb + ',' + (y - 6) + '" style="fill:none;stroke:' + c.s + ';stroke-width:1.8"/>';
        s += '<text x="' + ((xa + xb) / 2) + '" y="' + (y + 13) + '" text-anchor="middle" font-size="11" style="fill:' + c.s + '">' + sesc(g.label || '') + '</text>';
      }
    });
    s += '</svg>';
    h += s;
  }
  return h + '</div>';
};

// ---------- circular buffer (queue) ----------
// d = {cap, front, size, cells:[...]}
VIEWS.ring = d => {
  const n = d.n, R = Math.max(92, n * 15), r0 = R - 30, cx = R + 70, cy = R + 44, W = (R + 70) * 2, H = (R + 44) * 2;
  let s = '<svg width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + ' ' + H + '">';
  const used = i => ((i - d.front + n) % n) < d.size;
  const P2 = (r, a) => (cx + r * Math.cos(a)).toFixed(1) + ',' + (cy + r * Math.sin(a)).toFixed(1);
  const nextSlot = d.size < n ? (d.front + d.size) % n : -1;
  for (let i = 0; i < n; i++) {
    const a0 = -Math.PI / 2 + (i - 0.5) * 2 * Math.PI / n, a1 = a0 + 2 * Math.PI / n, am = (a0 + a1) / 2;
    const u = used(i);
    const c = vc(u ? (d.cls && d.cls[i]) || 'hp' : 'dim');
    const isF = i === d.front && d.size > 0;
    s += '<path d="M' + P2(r0, a0) + ' L' + P2(R, a0) + ' A' + R + ',' + R + ' 0 0 1 ' + P2(R, a1) + ' L' + P2(r0, a1) + ' A' + r0 + ',' + r0 + ' 0 0 0 ' + P2(r0, a0) + 'Z" style="fill:' + c.f + ';stroke:' + (isF ? 'var(--ptr)' : c.s) + ';stroke-width:' + (isF ? 3 : 1.5) + '"/>';
    const rm = (r0 + R) / 2;
    s += '<text x="' + (cx + rm * Math.cos(am)).toFixed(1) + '" y="' + (cy + rm * Math.sin(am) + 5).toFixed(1) + '" text-anchor="middle" font-size="14" style="' + (u ? 'font-weight:700' : 'fill:var(--muted)') + '">' + esc(u ? String(d.cells[i]) : '·') + '</text>';
    s += '<text x="' + (cx + (r0 - 12) * Math.cos(am)).toFixed(1) + '" y="' + (cy + (r0 - 12) * Math.sin(am) + 4).toFixed(1) + '" text-anchor="middle" font-size="10" style="fill:var(--muted)">' + i + '</text>';
    const lab = [];
    if (isF) lab.push(['front', 'var(--ptr)']);
    if (u && i === (d.front + d.size - 1) % n) lab.push(['back', 'var(--acc)']);
    if (i === nextSlot) lab.push(['next push', 'var(--muted)']);
    lab.forEach((l, k) => {
      const rr = R + 16 + k * 14;
      s += '<text x="' + (cx + rr * Math.cos(am)).toFixed(1) + '" y="' + (cy + rr * Math.sin(am) + 4).toFixed(1) + '" text-anchor="middle" font-size="11.5" font-weight="700" style="fill:' + l[1] + '">' + l[0] + '</text>';
    });
  }
  s += '<text x="' + cx + '" y="' + (cy - 3) + '" text-anchor="middle" font-size="11.5" style="fill:var(--muted)">mFront=' + d.front + '</text>';
  s += '<text x="' + cx + '" y="' + (cy + 12) + '" text-anchor="middle" font-size="11.5" style="fill:var(--muted)">mSize=' + d.size + '</text>';
  return s + '</svg>';
};

// ---------- linked nodes (list) ----------
// d = {nodes:[{addr, label, sub, slot, row, cls}], links:[{from, to, kind:'next'|'prev', cls}]}
VIEWS.chain = d => {
  const BW = 74, BH = 46, GX = 112, top = 46, RH = 112;
  const rows = Math.max(...d.nodes.map(n => n.row || 0), 0) + 1;
  const slots = Math.max(...d.nodes.map(n => n.slot), 0) + 1;
  const W = 30 + slots * GX + 40, H = top + rows * RH + 30;
  const pos = new Map();
  d.nodes.forEach(n => pos.set(n.addr, { x: 20 + n.slot * GX, y: top + (n.row || 0) * RH }));
  let s = '<svg width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + ' ' + H + '"><defs>' +
    '<marker id="cn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0L10,5L0,10z" style="fill:var(--ptr)"/></marker>' +
    '<marker id="cp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0L10,5L0,10z" style="fill:var(--stack)"/></marker>' +
    '<marker id="cx" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" style="fill:var(--heap)"/></marker></defs>';
  for (const l of d.links) {
    const a = pos.get(l.from), b = pos.get(l.to);
    if (!a || !b) continue;
    const next = l.kind === 'next';
    const col = l.cls === 'chg' ? 'var(--heap)' : (next ? 'var(--ptr)' : 'var(--stack)');
    const mk = l.cls === 'chg' ? 'cx' : (next ? 'cn' : 'cp');
    const sw = l.cls === 'chg' ? 3 : 1.7;
    let p;
    if (a === b) { // self loop
      const x = a.x + BW / 2, y = next ? a.y : a.y + BH;
      p = next ? 'M' + (x + 10) + ',' + y + ' C' + (x + 40) + ',' + (y - 40) + ' ' + (x - 40) + ',' + (y - 40) + ' ' + (x - 10) + ',' + y
        : 'M' + (x - 10) + ',' + y + ' C' + (x - 40) + ',' + (y + 40) + ' ' + (x + 40) + ',' + (y + 40) + ' ' + (x + 10) + ',' + y;
    } else {
      const dist = Math.abs(b.x - a.x) / GX;
      const lift = (dist <= 1 && a.y === b.y) ? 14 : 22 + dist * 10;
      if (next) {
        const x1 = a.x + BW * 0.7, y1 = a.y, x2 = b.x + BW * 0.3, y2 = b.y;
        p = 'M' + x1 + ',' + y1 + ' C' + x1 + ',' + (Math.min(y1, y2) - lift) + ' ' + x2 + ',' + (Math.min(y1, y2) - lift) + ' ' + x2 + ',' + y2;
      } else {
        const x1 = a.x + BW * 0.3, y1 = a.y + BH, x2 = b.x + BW * 0.7, y2 = b.y + BH;
        p = 'M' + x1 + ',' + y1 + ' C' + x1 + ',' + (Math.max(y1, y2) + lift) + ' ' + x2 + ',' + (Math.max(y1, y2) + lift) + ' ' + x2 + ',' + y2;
      }
    }
    s += '<path d="' + p + '" style="fill:none;stroke:' + col + ';stroke-width:' + sw + '" marker-end="url(#' + mk + ')"/>';
  }
  for (const n of d.nodes) {
    const q = pos.get(n.addr), c = vc(n.cls || (n.header ? 'hdr' : 'hp'));
    s += '<rect x="' + q.x + '" y="' + q.y + '" width="' + BW + '" height="' + BH + '" rx="7" style="fill:' + c.f + ';stroke:' + c.s + ';stroke-width:1.6' + (n.header ? ';stroke-dasharray:4 3' : '') + '"/>';
    s += '<text x="' + (q.x + BW / 2) + '" y="' + (q.y + 20) + '" text-anchor="middle" font-size="14" font-weight="700">' + esc(n.label) + '</text>';
    s += '<text x="' + (q.x + BW / 2) + '" y="' + (q.y + 36) + '" text-anchor="middle" font-size="10" style="fill:var(--muted)">' + esc(n.sub || '') + '</text>';
    if (n.tag) s += '<text x="' + (q.x + BW / 2) + '" y="' + (q.y - 6 - (n.row ? 0 : 0)) + '" text-anchor="middle" font-size="11" font-weight="700" style="fill:var(--acc)">' + esc(n.tag) + '</text>';
  }
  s += '<g font-size="10.5"><line x1="' + (W - 150) + '" y1="' + (H - 10) + '" x2="' + (W - 128) + '" y2="' + (H - 10) + '" style="stroke:var(--ptr);stroke-width:2"/><text x="' + (W - 124) + '" y="' + (H - 6) + '" style="fill:var(--muted)">next</text>' +
    '<line x1="' + (W - 86) + '" y1="' + (H - 10) + '" x2="' + (W - 64) + '" y2="' + (H - 10) + '" style="stroke:var(--stack);stroke-width:2"/><text x="' + (W - 60) + '" y="' + (H - 6) + '" style="fill:var(--muted)">prev</text></g>';
  return s + '</svg>';
};

// ---------- trees ----------
// d = {nodes:{id:{label, sub, cls, kids:[id|null,...]}}, root, binary:true, edgeLabels}
VIEWS.tree = d => {
  if (d.root == null || !d.nodes[d.root]) return '<div class="cap">' + tr(d.empty || L('(empty tree)', '(ต้นไม้ว่าง)')) + '</div>';
  const R = d.r || 21, GX = d.gx || (R * 2 + 12), GY = d.gy || 64;
  const pos = {};
  let next = 0, maxDepth = 0;
  const place = (id, depth) => {
    const nd = d.nodes[id];
    maxDepth = Math.max(maxDepth, depth);
    const kids = nd.kids || [];
    if (d.binary) {
      const [l, r] = kids;
      if (l != null) place(l, depth + 1); else if (r != null) next += 0.5;
      pos[id] = { x: next++, y: depth };
      if (r != null) place(r, depth + 1); else if (l != null) next += 0.5;
    } else {
      const real = kids.filter(k => k != null);
      if (!real.length) pos[id] = { x: next++, y: depth };
      else { real.forEach(k => place(k, depth + 1)); pos[id] = { x: (pos[real[0]].x + pos[real[real.length - 1]].x) / 2, y: depth }; }
    }
  };
  place(d.root, 0);
  const W = next * GX + 30, H = (maxDepth + 1) * GY + 20;
  const X = id => 15 + pos[id].x * GX + GX / 2, Y = id => 10 + pos[id].y * GY + R + 4;
  let s = '<svg width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + ' ' + H + '">';
  for (const id in pos) for (const k of (d.nodes[id].kids || [])) if (k != null && pos[k]) {
    const ec = d.nodes[k].edge;
    s += '<line x1="' + X(id) + '" y1="' + Y(id) + '" x2="' + X(k) + '" y2="' + Y(k) + '" style="stroke:' + (ec ? vc(ec).s : 'var(--muted)') + ';stroke-width:' + (ec ? 2.6 : 1.4) + '"/>';
  }
  for (const id in pos) {
    const nd = d.nodes[id], c = vc(nd.cls);
    const w = Math.max(R * 2, String(nd.label).length * 8 + 14);
    s += '<rect x="' + (X(id) - w / 2) + '" y="' + (Y(id) - R) + '" width="' + w + '" height="' + (R * 2) + '" rx="' + (d.square ? 6 : R) + '" style="fill:' + c.f + ';stroke:' + c.s + ';stroke-width:' + (nd.cls ? 2.2 : 1.5) + '"/>';
    s += '<text x="' + X(id) + '" y="' + (Y(id) + 5) + '" text-anchor="middle" font-size="' + (String(nd.label).length > 6 ? 11 : 13.5) + '" font-weight="600">' + esc(nd.label) + '</text>';
    if (nd.sub != null) s += '<text x="' + X(id) + '" y="' + (Y(id) + R + 12) + '" text-anchor="middle" font-size="10" style="fill:var(--muted)">' + esc(nd.sub) + '</text>';
    if (nd.tag) s += '<text x="' + (X(id) + w / 2 + 4) + '" y="' + (Y(id) - R + 6) + '" font-size="11" font-weight="700" style="fill:var(--ptr)">' + esc(nd.tag) + '</text>';
  }
  return s + '</svg>';
};

// ---------- graphs ----------
// d = {nodes:[{id,label,x,y,cls,sub}], edges:[{a,b,w,cls,dir}], w, h}
VIEWS.graph = d => {
  const W = d.w || 460, H = d.h || 260, R = 19;
  const P = {}; d.nodes.forEach(n => P[n.id] = { x: 30 + n.x * (W - 60), y: 26 + n.y * (H - 66) });
  let s = '<svg width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + ' ' + H + '"><defs><marker id="ge" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0L10,5L0,10z" style="fill:var(--muted)"/></marker></defs>';
  for (const e of d.edges) {
    const a = P[e.a], b = P[e.b], c = e.cls ? vc(e.cls).s : 'var(--line)';
    const dx = b.x - a.x, dy = b.y - a.y, L0 = Math.hypot(dx, dy) || 1;
    const x2 = b.x - dx / L0 * (R + 2), y2 = b.y - dy / L0 * (R + 2);
    s += '<line x1="' + a.x + '" y1="' + a.y + '" x2="' + (e.dir ? x2 : b.x) + '" y2="' + (e.dir ? y2 : b.y) + '" style="stroke:' + c + ';stroke-width:' + (e.cls ? 3.2 : 1.6) + '"' + (e.dir ? ' marker-end="url(#ge)"' : '') + '/>';
    if (e.w != null) { const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2; s += '<rect x="' + (mx - 11) + '" y="' + (my - 9) + '" width="22" height="16" rx="4" style="fill:var(--panel);stroke:var(--line)"/><text x="' + mx + '" y="' + (my + 3) + '" text-anchor="middle" font-size="10.5">' + e.w + '</text>'; }
  }
  for (const n of d.nodes) {
    const c = vc(n.cls), q = P[n.id];
    s += '<circle cx="' + q.x + '" cy="' + q.y + '" r="' + R + '" style="fill:' + c.f + ';stroke:' + c.s + ';stroke-width:' + (n.cls ? 2.4 : 1.5) + '"/>';
    s += '<text x="' + q.x + '" y="' + (q.y + 5) + '" text-anchor="middle" font-size="13.5" font-weight="700">' + esc(n.label) + '</text>';
    if (n.sub != null) s += '<text x="' + q.x + '" y="' + (q.y + R + 13) + '" text-anchor="middle" font-size="10.5" style="fill:var(--ptr);font-weight:700">' + esc(n.sub) + '</text>';
  }
  return s + '</svg>';
};

// ---------- 2-D tables (DP) ----------
// d = {rows:[label], cols:[label], cells:[[v]], cls:[[c]], corner}
VIEWS.table = d => {
  let h = '<table style="border-collapse:collapse;font-family:var(--font-mono);font-size:12.5px;margin:0 auto">';
  h += '<tr><th style="padding:3px 7px;color:var(--muted)">' + esc(d.corner || '') + '</th>' + d.cols.map(c => '<th style="padding:3px 7px;color:var(--muted);font-weight:600">' + esc(c) + '</th>').join('') + '</tr>';
  d.cells.forEach((row, i) => {
    h += '<tr><th style="padding:3px 7px;color:var(--muted);font-weight:600;text-align:right">' + esc(d.rows[i]) + '</th>';
    row.forEach((v, j) => {
      const c = vc(d.cls && d.cls[i] && d.cls[i][j]);

    });
    h += '</tr>';
  });
  return h + '</table>';
};

// ---------- hash table buckets ----------
// d = {buckets:[[{k,v,cls}]], hl}
VIEWS.buckets = d => {
  // d.buckets: [{addr, cls, tag, nodes:[{k, v, addr, cls, tag}]}] ; d.side: optional html under
  let h = '<div style="display:grid;gap:6px;font-family:var(--font-mono);font-size:13px">';
  d.buckets.forEach((b, i) => {
    const c = vc(b.cls || 'st');
    h += '<div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;min-height:' + (b.nodes.length ? 44 : 30) + 'px">' +
      '<div style="width:54px;text-align:right;color:' + (b.tag ? 'var(--acc)' : 'var(--muted)') + ';font-size:11.5px;font-weight:' + (b.tag ? 700 : 400) + '">' + (b.tag ? esc(b.tag) + ' → ' : '') + '[' + i + ']</div>' +
      '<div title="' + (b.addr != null ? hex(b.addr) : '') + '" style="min-width:34px;height:30px;display:grid;place-items:center;border:1.5px solid ' + c.s + ';background:' + c.f + ';border-radius:5px;font-size:10.5px;color:var(--muted)">' + (b.nodes.length ? '●' : '∅') + '</div>';
    b.nodes.forEach(e => {
      const cc = vc(e.cls || 'hp');
      h += '<span style="color:var(--ptr)">→</span><div style="position:relative;padding:3px 10px 2px;border:1.5px solid ' + cc.s + ';background:' + cc.f + ';border-radius:7px;text-align:center;line-height:1.25">' +
        (e.tag ? '<div style="position:absolute;top:-15px;left:0;right:0;text-align:center;font-size:10.5px;font-weight:700;color:var(--acc)">' + esc(e.tag) + '</div>' : '') +
        '<b>' + esc(e.k) + '</b>' + (e.v != null ? ' <span style="color:var(--muted)">:</span> ' + esc(e.v) : '') +
        '<div style="font-size:9.5px;color:var(--muted)">' + (e.addr != null ? hex(e.addr) : '') + '</div></div>';
    });
    if (b.nodes.length) h += '<span style="color:var(--ptr)">→</span><span style="color:var(--muted);font-size:11px">NULL</span>';
    h += '</div>';
  });
  h += '</div>';
  if (d.foot) h += '<div class="cap" style="margin-top:10px">' + tr(d.foot) + '</div>';
  return h;
};

// ---------------------------------------------------------------- C++ syntax colouring
const KW = new Set('if else for while do return break continue new delete class struct public private protected template typename const static void auto true false nullptr this namespace using operator sizeof switch case default inline virtual friend'.split(' '));
const TY = new Set('int char bool double float long short unsigned size_t string vector list map set queue stack deque pair priority_queue unordered_map iterator T node std CP KeyT MappedT Comp greater less'.split(' '));
function hl(line) {
  let out = '', m;
  const re = /(\/\/.*$)|("(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*')|(\b\d+(?:\.\d+)?\b)|([A-Za-z_]\w*)|(\s+)|(.)/g;
  while ((m = re.exec(line))) {
    if (m[1]) out += '<span class="tk-c">' + esc(m[1]) + '</span>';
    else if (m[2]) out += '<span class="tk-s">' + esc(m[2]) + '</span>';
    else if (m[3]) out += '<span class="tk-n">' + m[3] + '</span>';
    else if (m[4]) out += KW.has(m[4]) ? '<span class="tk-k">' + m[4] + '</span>' : TY.has(m[4]) ? '<span class="tk-t">' + m[4] + '</span>' : esc(m[4]);
    else if (m[5]) out += m[5];
    else out += (m[6] === '*' || m[6] === '&') ? '<span class="tk-p">' + esc(m[6]) + '</span>' : esc(m[6]);
  }
  return out;
}

// ---------------------------------------------------------------- value formatting
function fmtVal(v, type, ctx) {
  if (v === undefined) return '<span class="v garb" title="' + esc(tr(L('Uninitialized: whatever bits were left here before', 'ยังไม่ได้กำหนดค่า: เป็นบิตขยะที่ค้างอยู่เดิม'))) + '">?</span>';
  if (isP(v)) {
    if (v.p === 0) return '<span class="v ptr null" data-ptr="0">nullptr</span>';
    const dang = ctx && ctx.live && !ctx.live.has(v.p);
    return '<span class="v ptr' + (dang ? ' dang' : '') + '" data-ptr="' + v.p + '">' + hex(v.p) + '</span>';
  }
  return '<span class="v">' + esc(fmtPlain(v, type)) + '</span>';
}
function fmtPlain(v, type) {
  if (v === undefined) return '?';
  if (isP(v)) return v.p === 0 ? 'nullptr' : hex(v.p);
  if (isCH(v)) return "'" + (v.ch === '\0' ? '\\0' : v.ch) + "'";
  if (isSTR(v)) return '"' + v.str + '"';
  if (typeof v === 'boolean') return v ? 'true' : 'false';
  if (typeof v === 'number' && type && /double|float/.test(type) && Number.isInteger(v)) return v.toFixed(1);
  if (typeof v === 'number' && !Number.isInteger(v)) return String(Math.round(v * 1000) / 1000);
  return String(v);
}
function cellText(v, type, ctx) {
  if (isP(v)) {
    if (v.p === 0) return '<span class="ptrv null" data-ptr="0">null</span>';
    const dang = ctx && ctx.live && !ctx.live.has(v.p);
    return '<span class="ptrv' + (dang ? ' dang' : '') + '" data-ptr="' + v.p + '">' + hex(v.p) + '</span>';
  }
  return esc(fmtPlain(v, type));
}

// collect "address → display string" for change detection, and the set of live addresses
function addrMap(s) {
  const m = new Map(), live = new Set(), names = new Map();
  const put = (a, v, t) => m.set(a, fmtPlain(v, t));
  for (const f of s.frames) for (const v of f.vars) {
    if (v.kind === 'scalar') { put(v.addr, v.value, v.type); live.add(v.addr); names.set(v.addr, v.name); }
    if (v.kind === 'obj') { live.add(v.addr); names.set(v.addr, v.name); for (const fd of v.fields) { put(fd.addr, fd.value, fd.type); live.add(fd.addr); names.set(fd.addr, v.name + '.' + fd.name); } }
    if (v.kind === 'array') { v.cells.forEach((c, i) => { const a = v.addr + i * v.es; put(a, c, v.elemType); live.add(a); names.set(a, v.name + (v.cols ? '[' + Math.floor(i / v.cols) + '][' + (i % v.cols) + ']' : '[' + i + ']')); }); live.add(v.addr + v.n * v.es); }
  }
  for (const b of s.heap) {
    if (b.freed) continue;
    if (b.kind === 'array') { b.cells.forEach((c, i) => { const a = b.addr + i * b.es; put(a, c, b.elemType); live.add(a); }); live.add(b.addr + b.n * b.es); }
    if (b.kind === 'obj') { live.add(b.addr); for (const fd of b.fields) { put(fd.addr, fd.value, fd.type); live.add(fd.addr); } }
  }
  return { m, live, names };
}

function runScen() {

  UI.lines = lines;

function play() {
  if (UI.i >= UI.snaps.length - 1) go(0);
  UI.playing = true; $('#b-play') && ($('#b-play').textContent = '❚❚ ' + tr(T.pause));
  UI.timer = setInterval(() => { if (UI.i >= UI.snaps.length - 1) stop(); else go(UI.i + 1); }, 1400 / UI.speed);

function go(i, first) {
  if (!UI.snaps.length) { $('#note').textContent = UI.error || ''; $('#b-play').textContent = '▶ ' + tr(T.play); return; }
  i = Math.max(0, Math.min(UI.snaps.length - 1, i));

  const s = UI.snaps[i], prev = i > 0 ? UI.snaps[i - 1] : null;

  $('#count').textContent = tr(T.step) + ' ' + (i + 1) + ' / ' + UI.snaps.length;

function renderCode(s) {
  const box = $('#code');
  box.querySelectorAll('.ln').forEach(el => { el.classList.remove('cur', 'wait', 'extra'); el.removeAttribute('data-w'); });
  const frames = s.frames;
  // caller frames: mark their lines as "waiting"
  for (let k = 0; k < frames.length - 1; k++) {
    const f = frames[k];
    if (f.line != null) {
      const el = box.querySelector('.ln[data-n="' + f.line + '"]');
      if (el) { el.classList.add('wait'); el.setAttribute('data-w', '↩ ' + f.sig.replace(/\(.*$/, '()') + ' ' + tr(T.waiting)); }
    }

  (s.lines || []).forEach(n => { const el = box.querySelector('.ln[data-n="' + n + '"]'); if (el) el.classList.add('extra'); });
  if (s.line != null) {
    const el = box.querySelector('.ln[data-n="' + s.line + '"]');
    if (el) {
      el.classList.remove('wait'); el.removeAttribute('data-w'); el.classList.add('cur');
      const top = el.offsetTop, h = box.clientHeight;
      if (top < box.scrollTop + 20 || top > box.scrollTop + h - 40) box.scrollTop = Math.max(0, top - h / 3);
    }
  }
}

// ---------------------------------------------------------------- memory renderer
function renderMem(s, prev) {
  const mem = $('#mem');
  const cur = addrMap(s), old = prev ? addrMap(prev) : null;
  const reads = new Set(s.reads);
  const tagsBy = new Map();
  (s.tags || []).forEach(t => { if (!tagsBy.has(t.addr)) tagsBy.set(t.addr, []); tagsBy.get(t.addr).push(t); });
  const ctx = { live: cur.live };
  const st = a => {   // state classes for an address
    let c = '';
    if (old && cur.m.has(a) && old.m.has(a) && old.m.get(a) !== cur.m.get(a)) c += ' chg';
    if (reads.has(a)) c += ' read';
    return c;
  };
  const tagHTML = a => (tagsBy.get(a) || []).map(t => '<span class="tag ' + (t.cls || '') + '">' + esc(t.label) + '</span>').join('');

  // pointer targets beyond the end of an array (end() iterators)
  const ptrTargets = new Set();
  const scanP = v => { if (isP(v) && v.p) ptrTargets.add(v.p); };
  for (const f of s.frames.concat(s.ghosts || [])) for (const v of f.vars) { if (v.kind === 'scalar') scanP(v.value); if (v.kind === 'obj') v.fields.forEach(fd => scanP(fd.value)); if (v.kind === 'array') v.cells.forEach(scanP); }
  for (const b of s.heap) { if (b.kind === 'obj') b.fields.forEach(fd => scanP(fd.value)); else b.cells.forEach(scanP); }

  const arrHTML = (base, cells, es, et, used, region, cols) => {
    let h = '<div class="arr">';
    cells.forEach((c, i) => {
      const a = base + i * es;
      const un = used != null && i >= used;
      h += '<div class="cell' + (i === cells.length - 1 ? ' last' : '') + (un ? ' unused' : '') + (c === undefined ? ' garb' : '') + st(a) + '" data-addr="' + a + '">' +
        '<span class="tags">' + tagHTML(a) + '</span><span class="ci">' + (cols ? '[' + Math.floor(i / cols) + '][' + (i % cols) + ']' : '[' + i + ']') + '</span><span class="cv">' + (c === undefined ? '?' : cellText(c, et, ctx)) + '</span><span class="ca">' + hex(a) + '</span></div>';
    });
    const endA = base + cells.length * es;
    if (ptrTargets.has(endA) || tagsBy.has(endA)) h += '<div class="cell endmark" data-addr="' + endA + '"><span class="tags">' + tagHTML(endA) + '</span><span class="ci">&nbsp;</span><span class="cv">end</span><span class="ca">' + hex(endA) + '</span></div>';
    return h + '</div>';
  };

  const varHTML = v => {
    if (v.kind === 'scalar') {
      if (v.hidden) return '';
      let val;
      if (v.ref) {
        const tn = cur.names.get(v.value.p);
        val = '<span class="v ptr" data-ptr="' + v.value.p + '" data-ref="1">' + hex(v.value.p) + '</span> <span style="font-size:11.5px;color:var(--muted)">' + esc(tr(L('alias of', 'ชื่อเล่นของ'))) + ' <b>' + esc(tn || '?') + '</b></span>';
      } else val = fmtVal(v.value, v.type, ctx);
      return '<div class="var' + (v.param ? ' param' : '') + (v.ref ? ' ref' : '') + (old && !old.m.has(v.addr) ? ' nwv' : '') + st(v.addr) + '" data-addr="' + v.addr + '">' +
        '<span class="addr">' + hex(v.addr) + '</span><span class="nm">' + esc(v.name) + '<small>' + esc(v.type) + ' · ' + v.size + 'B</small></span><span class="val">' + val + ' ' + tagHTML(v.addr) + '</span></div>';
    }
    if (v.kind === 'obj') {
      return '<div class="var objv' + (v.param ? ' param' : '') + '" data-base="' + v.addr + '"><div class="oh"><span class="nm">' + esc(v.name) + '</span><span class="ty">' + esc(v.type) + '</span>' + tagHTML(v.addr) + '<span class="addr">' + hex(v.addr) + ' · ' + v.size + 'B</span></div><div class="fields">' +
        v.fields.map(fd => '<div class="fld' + st(fd.addr) + '" data-addr="' + fd.addr + '"><span class="addr">' + hex(fd.addr) + '</span><span class="fn">' + esc(fd.name) + '<small>' + esc(fd.type) + '</small></span><span>' + fmtVal(fd.value, fd.type, ctx) + ' ' + tagHTML(fd.addr) + '</span></div>').join('') + '</div></div>';
    }
    if (v.kind === 'array') {
      return '<div class="var objv' + (v.param ? ' param' : '') + '"><div class="oh"><span class="nm">' + esc(v.name) + '</span><span class="ty">' + esc(v.type) + '</span><span class="addr">' + hex(v.addr) + ' · ' + v.size + 'B</span></div>' + arrHTML(v.addr, v.cells, v.es, v.elemType, null, 'stack', v.cols) + '</div>';
    }
    return '';
  };

  const frameHTML = (f, isTop, dead) => {
    const saved = ctx.live;
    if (dead) { ctx.live = new Set(cur.live); for (const g of (s.ghosts || [])) for (const v of g.vars) { ctx.live.add(v.addr); if (v.fields) v.fields.forEach(fd => ctx.live.add(fd.addr)); if (v.kind === 'array') for (let i = 0; i <= v.n; i++) ctx.live.add(v.addr + i * v.es); } }
    try { return frameHTML0(f, isTop, dead); } finally { ctx.live = saved; }
  };
  const frameHTML0 = (f, isTop, dead) => {
    const vars = f.vars.slice().sort((a, b) => b.addr - a.addr);
    return '<div class="frame' + (isTop ? ' top' : '') + (dead ? ' dead' : '') + '"><div class="frame-h"><span>' + esc(f.sig) + '</span><span class="fl">' +
      (dead ? tr(T.popped) : (f.line != null ? tr(T.line) + ' ' + f.line : '')) + '</span></div><div class="frame-body">' +
      (vars.length ? vars.map(varHTML).join('') : '<div style="font-size:12px;color:var(--muted);padding:2px 6px">' + tr(L('(no local variables)', '(ไม่มีตัวแปรภายใน)')) + '</div>') + '</div>' +
      (f.ret ? '<div class="retchip">↩ ' + esc(f.ret.from.replace(/\s*\{.*$/, '')) + ' ' + tr(T.returned) + ' <b>' + esc(fmtPlain(f.ret.value, f.ret.type)) + '</b></div>' : '') + '</div>';
  };

  let sh = '<div class="region stack"><div class="region-h"><span>' + tr(T.stack) + '</span><span class="sub">' + tr(T.stackSub) + '</span></div>';
  s.frames.forEach((f, k) => sh += frameHTML(f, k === s.frames.length - 1, false));
  (s.ghosts || []).forEach(f => sh += frameHTML(f, false, true));
  if (!s.frames.length && !(s.ghosts || []).length) sh += '<div class="empty-note">' + tr(L('No function is running.', 'ไม่มีฟังก์ชันที่กำลังทำงาน')) + '</div>';
  sh += '</div>';

  let hh = '<div class="region heap"><div class="region-h"><span>' + tr(T.heap) + '</span><span class="sub">' + tr(T.heapSub) + '</span></div>';
  if (!s.heap.length) hh += '<div class="empty-note">' + tr(T.noHeap) + '</div>';
  let k = 0;
  const blocks = s.heap;
  while (k < blocks.length) {
    const b = blocks[k];
    if (b.kind === 'array') {
      hh += '<div class="block' + (b.born ? ' born' : '') + (b.freed ? ' freed' : '') + '"><div class="block-h">' + (b.label ? '<span class="bl">' + esc(tr(b.label)) + '</span>' : '') + '<span class="bx">' + esc(b.expr) + ' · ' + b.size + 'B · ' + hex(b.addr) + '–' + hex(b.addr + b.size - 1) + '</span>' +
        (b.born ? '<span class="badge">' + tr(T.newb) + '</span>' : '') + (b.freed ? '<span class="badge freedb">' + tr(T.freed) + '</span>' : '') + '</div>' + arrHTML(b.addr, b.cells, b.es, b.elemType, b.used, 'heap') + '</div>';
      k++;
    } else {
      hh += '<div class="heap-nodes">';
      while (k < blocks.length && blocks[k].kind === 'obj') {
        const o = blocks[k];
        hh += '<div class="block obj' + (o.born ? ' born' : '') + (o.freed ? ' freed' : '') + '" data-base="' + o.addr + '"><div class="block-h">' + (o.label ? '<span class="bl">' + esc(tr(o.label)) + '</span>' : '<span class="bl">' + esc(o.type) + '</span>') + '<span class="bx">' + hex(o.addr) + ' · ' + o.size + 'B</span>' + tagHTML(o.addr) +
          (o.born ? '<span class="badge">' + tr(T.newb) + '</span>' : '') + (o.freed ? '<span class="badge freedb">' + tr(T.freed) + '</span>' : '') + '</div><div class="fields">' +
          o.fields.map(fd => '<div class="fld' + st(fd.addr) + '" data-addr="' + fd.addr + '"><span class="addr">' + hex(fd.addr) + '</span><span class="fn">' + esc(fd.name) + '<small>' + esc(fd.type) + '</small></span><span>' + fmtVal(fd.value, fd.type, ctx) + '</span></div>').join('') + '</div></div>';
        k++;
      }
      hh += '</div>';
    }
  }
  hh += '</div>';
  const anyHeap = UI.snaps.some(x => x.heap.length);
  mem.classList.toggle('no-heap', !anyHeap);
  mem.classList.toggle('heap-light', anyHeap && Math.max(...UI.snaps.map(x => x.heap.filter(b => !b.freed).length)) <= 2);
  mem.innerHTML = sh + (anyHeap ? hh : '') + '<svg class="arrows" aria-hidden="true"></svg>';
  // remember which pointers changed
  mem.querySelectorAll('[data-ptr]').forEach(el => {
    const holder = el.closest('[data-addr]');
    if (holder && (holder.classList.contains('chg'))) el.dataset.hchg = '1';
  });
  requestAnimationFrame(drawArrows);
}

function drawArrows() {
  const mem = $('#mem'); if (!mem) return;
  const svg = mem.querySelector('svg.arrows'); if (!svg) return;
  const R = mem.getBoundingClientRect();
  let h = '<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--ptr);stroke:none"/></marker></defs>';
  const srcs = [...mem.querySelectorAll('[data-ptr]')].filter(el => el.dataset.ptr !== '0');
  let lane = 0;
  srcs.forEach((el, idx) => {
    const p = el.dataset.ptr;
    const tgt = mem.querySelector('[data-base="' + p + '"]') || mem.querySelector('.cell[data-addr="' + p + '"]') || mem.querySelector('[data-addr="' + p + '"]');
    if (!tgt) return;
    const a = el.getBoundingClientRect(), b = (tgt.classList.contains('cell') ? (tgt.querySelector('.cv') || tgt) : tgt).getBoundingClientRect();
    const lab = el.dataset.ref && el.nextElementSibling;
    const sx = (lab ? lab.getBoundingClientRect().right + 4 : a.right) - R.left, sy = a.top + a.height / 2 - R.top;
    let d;
    const isCell = tgt.classList.contains('cell');
    if (isCell) {
      // aim at the top-centre of the cell's value box
      const tx = b.left + b.width / 2 - R.left, ty = b.top - R.top;
      if (ty > sy + 8) d = 'M' + sx + ',' + sy + ' C' + (sx + 50) + ',' + sy + ' ' + tx + ',' + (ty - 50) + ' ' + tx + ',' + ty;
      else { const by = b.bottom - R.top; d = 'M' + sx + ',' + sy + ' C' + (sx + 50) + ',' + sy + ' ' + tx + ',' + (by + 60) + ' ' + tx + ',' + by; }
    } else {
      const tl = b.left - R.left, tr_ = b.right - R.left, ty = b.top + Math.min(14, b.height / 2) - R.top;
      if (tl > sx + 10) d = 'M' + sx + ',' + sy + ' C' + (sx + (tl - sx) / 2) + ',' + sy + ' ' + (tl - (tl - sx) / 2) + ',' + ty + ' ' + tl + ',' + ty;
      else if (tr_ < a.left - R.left - 10) { const sx2 = a.left - R.left; d = 'M' + sx2 + ',' + sy + ' C' + (sx2 - 40) + ',' + sy + ' ' + (tr_ + 40) + ',' + ty + ' ' + tr_ + ',' + ty; }
      else { const out = Math.max(sx, tr_) + 22 + (lane++ % 4) * 8; d = 'M' + sx + ',' + sy + ' C' + out + ',' + sy + ' ' + out + ',' + ty + ' ' + tr_ + ',' + ty; }
    }
    h += '<path data-i="' + idx + '" class="' + (el.dataset.hchg ? 'hchg' : '') + (el.dataset.ref ? ' refp' : '') + '" d="' + d + '" marker-end="url(#ah)"/>';
    el.dataset.ai = idx;
  });
  svg.innerHTML = h;
}

function hookHover() {
  document.addEventListener('mouseover', e => {

/* helpers shared by scenarios */

// line finder: LN(code)('int a = 5') → line number of the first line containing that text.
// LN(code)('text', 2) → the 2nd such line.
function LN(code) {
  const lines = code.split('\n');
  return (sub, nth = 1) => {
    let seen = 0;
    for (let i = 0; i < lines.length; i++) if (lines[i].includes(sub) && ++seen === nth) return i + 1;
    throw new Error('LN: line not found: ' + sub);
  };
}

// little-endian bytes of a value, as 2-digit hex strings
function bytesOf(v, type) {
  const n = sizeOf(type);
  if (v === undefined) return Array(n).fill('??');
  const buf = new DataView(new ArrayBuffer(8));
  if (/double/.test(type)) buf.setFloat64(0, v, true);
  else if (type === 'bool') buf.setUint8(0, v ? 1 : 0);
  else if (type === 'char') buf.setUint8(0, isCH(v) ? v.ch.charCodeAt(0) : v);
  else if (isP(v)) buf.setBigUint64(0, BigInt(v.p), true);
  else buf.setBigInt64(0, BigInt(v), true);
  return Array.from({ length: n }, (_, i) => buf.getUint8(i).toString(16).toUpperCase().padStart(2, '0'));
}

// find a scalar variable by name in the top frame (or any frame)
function findVar(sim, name) {
  for (let k = sim.frames.length - 1; k >= 0; k--) { const v = sim.frames[k].vars.find(v => v.name === name); if (v) return v; }
  return null;
}

// tags helper: [{addr,label,cls}]
const TAG = (addr, label, cls) => ({ addr, label, cls });

// a concept view for a CP-style array: cells with used/unused shading and marks
function arrRow(cells, opts = {}) {
  return Object.assign({ cells: cells.map(c => c === undefined ? '?' : fmtPlain(c)) }, opts);
}

// read all cells of a heap array block as plain values (no read marks)
function cellsOf(sim, base) { const b = sim.block(base); return b ? b.cells.slice() : []; }

// ------------------------------------------------------------------ recursion
(() => {
  const code = `long long fact(int n) {
    if (n <= 1) return 1;
    long long sub = fact(n - 1);
    return n * sub;
}
int main() {
    long long f = fact(N);
    cout << f << "\\n";
    return 0;
}`;
  def({
    id: 'recursion', part: 1, lesson: '11', lessonFile: '11-recursion-backtracking.md',
    title: L('Recursion is just a stack of frames', 'การเรียกซ้ำคือ frame ที่ซ้อนกันบน stack'),
    summary: L('Every recursive call gets its own frame with its own n. The calls pile up until the base case, then the answers flow back down the stack one frame at a time.',
      'การเรียกซ้ำแต่ละครั้งได้เฟรมของตัวเองพร้อม n ของตัวเอง การเรียกจะซ้อนขึ้นไปจนถึง base case จากนั้นคำตอบจะไหลกลับลงมาทีละเฟรม'),
    blurb: L('fact(n): frames pile up, then unwind with return values.', 'fact(n): เฟรมซ้อนขึ้น แล้วคลายกลับพร้อมค่าที่คืน'),
    params: [{ id: 'n', label: L('N (1–8)', 'N (1–8)'), value: '4' }],
    code,
    codeFn: p => code.replace('fact(N)', 'fact(' + (parseInt(p.n, 10) || 'N') + ')'),
    build(sim, prm) {
      let N = parseInt(prm.n, 10);
      if (!(N >= 1 && N <= 8)) throw userErr(L('N must be between 1 and 8.', 'N ต้องอยู่ระหว่าง 1 ถึง 8'));
      const at0 = LN(code);
      const at = k => at0(k === 'fact(N)' ? 'long long f = fact' : k);
      const tree = {}; let order = 0;
      sim.viewFn = () => ({ kind: 'tree', title: L('call tree', 'ต้นไม้การเรียก'), cap: L('Each node is one call. Green = returned, teal = running now.', 'แต่ละโหนดคือการเรียกหนึ่งครั้ง เขียว = คืนค่าแล้ว ฟ้าอมเขียว = กำลังทำงาน'), nodes: tree, root: tree.c0 ? 'c0' : null, square: true, gy: 56 });
      sim.call('main()');
      sim.step(at('int main'), L('main starts.', 'main เริ่มทำงาน'));
      sim.step(at('fact(N)'), L('main calls <code>fact(' + N + ')</code> and waits on this line.', 'main เรียก <code>fact(' + N + ')</code> แล้วรออยู่ที่บรรทัดนี้'));
      const rec = (n, parent) => {
        const id = 'c' + (order++);
        tree[id] = { label: 'fact(' + n + ')', kids: [], cls: 'hl' };
        if (parent) { tree[parent].kids.push(id); tree[parent].cls = 'cmp'; }
        sim.call('fact(int n = ' + n + ')');
        const na = sim.param('n', 'int', n);
        sim.step(at('long long fact'), L(
          'A new frame for <code>fact(' + n + ')</code>. Its <code>n</code> (' + n + ') is a separate box from every other frame\'s n. Depth now: ' + (sim.frames.length - 1) + ' call(s).',
          'เฟรมใหม่ของ <code>fact(' + n + ')</code> ตัว <code>n</code> (' + n + ') เป็นกล่องแยกจาก n ของเฟรมอื่นทั้งหมด ความลึกตอนนี้: ' + (sim.frames.length - 1) + ' ชั้น'));
        sim.r(na);
        if (n <= 1) {
          sim.step(at('if (n <= 1)'), L('<b>Base case</b>: n = ' + n + ' ≤ 1, so return 1 without calling again. This is what stops the recursion.', '<b>Base case</b>: n = ' + n + ' ≤ 1 จึงคืน 1 โดยไม่เรียกต่อ นี่คือสิ่งที่หยุดการเรียกซ้ำ'));
          tree[id].cls = 'ok'; tree[id].label = 'fact(' + n + ')=1';
          if (parent) tree[parent].cls = 'hl';
          sim.ret(1, { type: 'long long' });
          return 1;
        }
        sim.step(at('if (n <= 1)'), L('n = ' + n + ' is not ≤ 1, so keep going.', 'n = ' + n + ' ยังไม่ ≤ 1 จึงทำต่อ'));
        sim.step(at('long long sub = fact'), L('Call <code>fact(' + (n - 1) + ')</code>. This frame <b>pauses</b> here (the line is marked "waiting") until the answer comes back.', 'เรียก <code>fact(' + (n - 1) + ')</code> เฟรมนี้<b>หยุดรอ</b>อยู่ตรงนี้ (บรรทัดถูกทำเครื่องหมายว่ารอ) จนกว่าคำตอบจะกลับมา'));
        const sv = rec(n - 1, id);
        const sub = sim.local('sub', 'long long', sv);
        sim.step(at('long long sub = fact'), L('fact(' + (n - 1) + ') returned ' + sv + '. Its frame is gone; we are back in <code>fact(' + n + ')</code>, whose n is still ' + n + '. Store ' + sv + ' in <code>sub</code>.', 'fact(' + (n - 1) + ') คืนค่า ' + sv + ' เฟรมของมันหายไปแล้ว เรากลับมาที่ <code>fact(' + n + ')</code> ซึ่ง n ยังเป็น ' + n + ' เก็บ ' + sv + ' ไว้ใน <code>sub</code>'));
        sim.r(na); sim.r(sub);
        const res = n * sv;
        sim.step(at('return n * sub'), L('Return ' + n + ' × ' + sv + ' = <b>' + res + '</b>.', 'คืน ' + n + ' × ' + sv + ' = <b>' + res + '</b>'));
        tree[id].cls = 'ok'; tree[id].label = 'fact(' + n + ')=' + res;
        if (parent) tree[parent].cls = 'hl';
        sim.ret(res, { type: 'long long' });
        return res;
      };
      const f = rec(N, null);
      sim.local('f', 'long long', f);
      sim.step(at('fact(N)'), L('Back in main with the final answer ' + f + '. The stack is as small as it was before the first call.', 'กลับมาที่ main พร้อมคำตอบสุดท้าย ' + f + ' stack กลับมาเล็กเท่าก่อนการเรียกครั้งแรก'));
      sim.r(findVar(sim, 'f').addr); sim.print(f + '\n');
      sim.step(at('cout'), L(
        'Printed ' + f + '. The maximum depth was ' + N + ' frames. With n = 10⁶ the stack would overflow (a Runtime Error in the grader): that is why deep recursion sometimes needs a loop instead (course lesson 07 §4.2).',
        'พิมพ์ ' + f + ' ความลึกสูงสุดคือ ' + N + ' เฟรม ถ้า n = 10⁶ stack จะล้น (grader รายงาน Runtime Error) นี่คือเหตุผลที่การเรียกซ้ำลึก ๆ บางครั้งต้องเปลี่ยนเป็นลูป (บทเรียน 07 §4.2)'));
      sim.ret(0, { show: false });
      sim.step(at('return 0'), L('main returns.', 'main คืนค่า'));
    }
  });
})();

function boxScenario(shallow) {
  const code = shallow ? `class Box {
  public:
    int* data;
    int  n;
    Box(int n0) : n(n0) {
        data = new int[n]();
    }
    // no copy constructor written, so the compiler's
    // default copies each field, POINTER included
    ~Box() { delete[] data; }
};
int main() {
    Box a(3);
    a.data[0] = 5;
    Box b = a;          // default copy: same array!
    b.data[0] = 9;      // changes a's array too
    cout << a.data[0] << " " << b.data[0] << "\\n";
    return 0;
}                       // destructors: b, then a` : `class Box {
  public:
    int* data;
    int  n;
    Box(int n0) : n(n0) {
        data = new int[n]();
    }
    Box(const Box& o) : n(o.n) {   // deep copy
        data = new int[n];
        for (int i = 0; i < n; i++)
            data[i] = o.data[i];
    }
    ~Box() { delete[] data; }
};
int main() {
    Box a(3);
    a.data[0] = 5;
    Box b = a;          // calls the copy constructor
    b.data[0] = 9;      // only b's array changes
    cout << a.data[0] << " " << b.data[0] << "\\n";
    return 0;
}                       // destructors: b, then a`;
